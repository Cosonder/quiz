  { id: "sc-r5-8", ch: 4, cat: "Prop 4.12 二次变差为零", q: "连续局部鞅 $M$ 满足 $M_0=0$，且 $\\langle M,M\\rangle_1=0$ a.s.。可以推出：", opts: ["a.s. 对所有 $t\\in[0,1]$ 有 $M_t=0$", "只能推出 $M_1=0$ a.s.", "a.s. 对所有 $t\\ge0$ 有 $M_t=0$", "$E[M_1^2]$ 仍可能为正"], a: 0, hint: "考虑停止过程 $M^1=(M_{t\\wedge1})$ 的二次变差。",
    exp: "$\\langle M^1,M^1\\rangle_t=\\langle M,M\\rangle_{t\\wedge1}=0$，由命题 4.12 得 $M^1=0$，即 $M$ 在 $[0,1]$ 上恒为 0。对 $t>1$ 没有信息，所以不能推出 $M\\equiv0$。（书中 §4.3 · Prop 4.11, Prop 4.12 · p.85）" },
  { id: "sc-r5-9", ch: 4, cat: "§4.4 布朗运动的括号", q: "$B,B'$ 是独立的 $(\\mathcal F_t)$-布朗运动，$\\rho\\in[-1,1]$，$W=\\rho B+\\sqrt{1-\\rho^2}\\,B'$。则 $\\langle B,W\\rangle_t=$", opts: ["$\\rho\\,t$", "$0$", "$t$", "$\\rho^2 t$"], a: 0, hint: "括号是双线性的；独立布朗运动之间的括号是多少？",
    exp: "由双线性，$\\langle B,W\\rangle=\\rho\\langle B,B\\rangle+\\sqrt{1-\\rho^2}\\langle B,B'\\rangle=\\rho t+0$，其中 $\\langle B,B'\\rangle=0$ 是命题 4.16。（书中 §4.4 · Prop 4.15 (ii), Prop 4.16 · p.87–88）" },
  { id: "sc-r5-10", ch: 4, cat: "Prop 4.15 括号的期望", q: "$B,B'$ 是独立的布朗运动（从 0 出发），$W=\\rho B+\\sqrt{1-\\rho^2}B'$。对停止过程 $M=B^1$、$N=W^2$ 用 $E[M_\\infty N_\\infty]=E[\\langle M,N\\rangle_\\infty]$，得 $E[B_1W_2]=$", opts: ["$\\rho$", "$2\\rho$", "$0$", "$\\sqrt2\\,\\rho$"], a: 0, hint: "先用停止性质算 $\\langle B^1,W^2\\rangle_\\infty$。",
    exp: "$M,N$ 是 $L^2$ 有界鞅，$\\langle B^1,W^2\\rangle_t=\\langle B,W\\rangle_{t\\wedge1\\wedge2}=\\rho(t\\wedge1)$，故 $\\langle M,N\\rangle_\\infty=\\rho$，于是 $E[B_1W_2]=\\rho$。（书中 §4.4 · Prop 4.15 (iv)(v) · p.87）" },
  { id: "sc-r5-11", ch: 4, cat: "Prop 4.15 括号与停止", q: "设 $M,N$ 是连续局部鞅，$T$ 是停时。$M^T(N-N^T)$ 是连续局部鞅，最直接的理由是：", opts: ["$\\langle M^T,N-N^T\\rangle=0$", "$M^T$ 与 $N-N^T$ 相互独立", "$N-N^T$ 是有限变差过程", "$M^T$ 有界"], a: 0, hint: "两个连续局部鞅之积何时是局部鞅？看括号的停止性质。",
    exp: "由 $\\langle M^T,N\\rangle=\\langle M^T,N^T\\rangle=\\langle M,N\\rangle^T$ 得 $\\langle M^T,N-N^T\\rangle=0$，即两者正交，乘积是连续局部鞅。独立性、有界性一般都不成立；$N-N^T$ 也不是有限变差过程。（书中 §4.4 · Prop 4.15 (iv) 后注 · p.87）" },
  { id: "sc-r5-12", ch: 4, cat: "Def 4.19 典范分解", q: "设 $B$ 为从 0 出发的 $(\\mathcal F_t)$-布朗运动，$X_t=1+B_t^2$。$X$ 的典范分解 $X=M+A$ 是：", opts: ["$M_t=1+B_t^2-t$，$A_t=t$", "$M_t=B_t^2-t$，$A_t=1+t$", "$M_t=1$，$A_t=B_t^2$", "$M_t=1+B_t^2$，$A_t=0$"], a: 0, hint: "注意 Le Gall 对有限变差过程的初值约定，以及 $B^2$ 本身是不是局部鞅。",
    exp: "$B_t^2-t$ 是鞅，且有限变差过程必须 $A_0=0$，故常数 1 归入 $M$。$1+t$ 初值不为 0；$B^2$ 不是有限变差的；$1+B^2$ 不是局部鞅（否则 $t$ 是有限变差的局部鞅）。（书中 §4.5 · Def 4.19 · p.90）" },
  { id: "sc-r5-13", ch: 4, cat: "Prop 4.21 半鞅的二次变差", q: "$B$ 为布朗运动，$X_t=2B_t+\\sin t$。沿 $[0,t]$ 上网格趋于 0 的划分，$\\sum_i(X_{t_i}-X_{t_{i-1}})^2$ 依概率收敛到：", opts: ["$4t$", "$2t$", "$4t+\\int_0^t\\cos^2s\\,ds$", "$0$"], a: 0, hint: "有限变差部分的平方增量和被 $\\sup_i|\\Delta A|\\cdot\\int_0^t|dA|$ 控制。",
    exp: "由命题 4.21，极限为 $\\langle X,X\\rangle_t=\\langle 2B,2B\\rangle_t=4t$；$\\sin t$ 这一有限变差部分的平方和及交叉项都趋于 0。（书中 §4.5 · Prop 4.21 · p.90）" },
  { id: "sc-r5-14", ch: 4, cat: "Ex 4.24 局部鞅在无穷远处的收敛", q: "$M$ 为连续局部鞅，$M_0=0$。几乎必然意义下，事件 $\\{\\lim_{t\\to\\infty}M_t$ 存在且有限$\\}$ 等于：", opts: ["$\\{\\langle M,M\\rangle_\\infty<\\infty\\}$", "$\\{\\langle M,M\\rangle_\\infty=\\infty\\}$", "$\\{\\langle M,M\\rangle_\\infty=0\\}$", "$\\Omega$（总是收敛）"], a: 0, hint: "在 $\\{\\langle M,M\\rangle_\\infty<n\\}$ 上用停时 $S_n=\\inf\\{t:\\langle M,M\\rangle_t=n\\}$ 得到 $L^2$ 有界鞅。",
    exp: "习题 4.24 证明两事件 a.s. 相等。布朗运动 $\\langle B,B\\rangle_\\infty=\\infty$ 且 $B_t$ 不收敛，说明不是总收敛；$\\{\\langle M,M\\rangle_\\infty=0\\}$ 上 $M\\equiv0$，只是该事件的一个子集。（书中 Exercises · Ex 4.24 · p.92）" },
  { id: "sc-r5-15", ch: 5, cat: "§5.1 随机积分与括号", q: "设 $M,N$ 为连续局部鞅，$H\\in L^2_{loc}(M)$，$K\\in L^2_{loc}(N)$。$\\langle H\\cdot M,K\\cdot N\\rangle_t$ 等于：", opts: ["$\\int_0^t H_sK_s\\,d\\langle M,N\\rangle_s$", "$\\int_0^t H_s\\,d\\langle M,N\\rangle_s\\cdot\\int_0^t K_s\\,d\\langle M,N\\rangle_s$", "$\\int_0^t H_sK_s\\,ds$", "$\\int_0^t H_s^2K_s^2\\,d\\langle M,N\\rangle_s$"], a: 0, hint: "随机积分与括号“可交换”：先对一个变量用特征性质，再对另一个。",
    exp: "由 $\\langle H\\cdot M,N'\\rangle=H\\cdot\\langle M,N'\\rangle$ 两次使用（$N'=K\\cdot N$，再用有限变差积分的结合律）得 $\\int_0^tH_sK_s\\,d\\langle M,N\\rangle_s$。括号是双线性的，不会出现乘积或平方。（书中 §5.1.2 · Thm 5.6, (5.5) · p.105–108）" },
  { id: "sc-r5-16", ch: 5, cat: "§5.1.2 局部鞅的随机积分", q: "设 $T$ 为停时，$H\\in L^2_{loc}(M)$。下列哪个过程**不**一定等于 $(H\\cdot M)^T$？（记 $H^T_s=H_{s\\wedge T}$）", opts: ["$H^T\\cdot M$", "$(\\mathbf 1_{[0,T]}H)\\cdot M$", "$H\\cdot M^T$", "$(\\mathbf 1_{[0,T]}H)\\cdot M^T$"], a: 0, hint: "停止积分意味着 $T$ 之后不再累积增量；看看哪个在 $T$ 之后仍在积分。",
    exp: "由 (5.11)，$(H\\cdot M)^T=(\\mathbf 1_{[0,T]}H)\\cdot M=H\\cdot M^T$，后者再停止仍不变。$H^T\\cdot M$ 在 $T$ 之后仍积分 $H_T\\,dM_s$，一般得 $(H\\cdot M)_T+H_T(M_t-M_T)$。（书中 §5.1.2 · Thm 5.6, (5.11) · p.106）" },
  { id: "sc-r5-17", ch: 5, cat: "§5.1.2 矩公式", q: "设 $M$ 为连续局部鞅，$H\\in L^2_{loc}(M)$，$t\\ge0$ 固定，**不**附加可积性假设。下列哪项总成立？", opts: ["$E[(\\int_0^tH\\,dM)^2]\\le E[\\int_0^tH_s^2\\,d\\langle M,M\\rangle_s]$", "$E[(\\int_0^tH\\,dM)^2]= E[\\int_0^tH_s^2\\,d\\langle M,M\\rangle_s]$", "$E[(\\int_0^tH\\,dM)^2]\\ge E[\\int_0^tH_s^2\\,d\\langle M,M\\rangle_s]$", "$E[\\int_0^tH_s\\,dM_s]=0$"], a: 0, hint: "分右端有限和无限两种情形讨论。",
    exp: "右端有限时 $(H\\cdot M)^t\\in\\mathbb H^2$，等式成立；右端无穷时不等式平凡，这就是 (5.14)。没有 (5.13) 时等式和零均值都可能失效（例如严格局部鞅，左端有限而右端为 $\\infty$）。（书中 §5.1.2 · (5.13)–(5.14) · p.108–109）" },
  { id: "sc-r5-18", ch: 5, cat: "§5.1.4 随机积分的收敛", q: "随机积分的控制收敛定理（$H^n\\to H$ 逐点，$|H^n|\\le K$，$K$ 满足适当可积性）给出 $\\int_0^tH^n\\,dX\\to\\int_0^tH\\,dX$ 的哪种收敛？", opts: ["依概率收敛", "几乎必然收敛", "$L^2$ 收敛", "$L^1$ 收敛"], a: 0, hint: "证明里先用停时局部化得到 $L^2$ 估计，再让停时等于 $t$ 的概率趋于 1。",
    exp: "在 $[0,T_p]$ 上由 (5.14) 得 $L^2$ 收敛，而 $P(T_p=t)\\to1$，合起来只得到依概率收敛。没有可积性假设时不能保证 $L^2$/$L^1$ 收敛，a.s. 收敛也只能沿子列取得。（书中 §5.1.4 · Prop 5.8 · p.111）" },
  { id: "sc-r5-19", ch: 5, cat: "§5.1.4 Riemann 和", q: "$B$ 为布朗运动，$B_0=0$，$[0,t]$ 的分割网格趋于 0。取右端点的和 $\\sum_i B_{t_{i+1}}(B_{t_{i+1}}-B_{t_i})$ 依概率收敛到：", opts: ["$\\tfrac12(B_t^2+t)$", "$\\tfrac12(B_t^2-t)$", "$\\tfrac12B_t^2$", "$B_t^2$"], a: 0, hint: "右端点和 = 左端点和 + 增量平方和。",
    exp: "左端点和趋于 $\\int_0^tB\\,dB=\\tfrac12(B_t^2-t)$，增量平方和趋于 $\\langle B,B\\rangle_t=t$，相加得 $\\tfrac12(B_t^2+t)$。这说明 Prop 5.9 中取左端点是本质的。（书中 §5.1.4 · Prop 5.9 后的 Remark · p.112）" },
  { id: "sc-r5-20", ch: 5, cat: "§5.2 分部积分", q: "$B$ 为布朗运动，$B_0=0$。$\\int_0^t s\\,dB_s$ 等于：", opts: ["$tB_t-\\int_0^tB_s\\,ds$", "$tB_t$", "$tB_t+\\int_0^tB_s\\,ds$", "$tB_t-\\int_0^tB_s\\,ds-\\tfrac t2$"], a: 0, hint: "对 $X_s=s$、$Y_s=B_s$ 用分部积分，并想想 $\\langle X,B\\rangle$ 是多少。",
    exp: "分部积分 $tB_t=\\int_0^ts\\,dB_s+\\int_0^tB_s\\,ds+\\langle s,B\\rangle_t$，而有限变差过程与任何半鞅的括号为 0，故 $\\int_0^ts\\,dB_s=tB_t-\\int_0^tB_s\\,ds$，没有 Itô 修正项。（书中 §5.2 · 分部积分公式 · p.116）" },
  { id: "sc-r5-21", ch: 5, cat: "Exercise 5.33 多维布朗运动", q: "$B$ 是从 $x\\ne0$ 出发的三维布朗运动。关于 $(1/|B_t|)_{t\\ge0}$，下列哪项正确？", opts: ["连续局部鞅，$L^2$ 有界，但不是鞅", "一致可积的真鞅", "不是局部鞅，因为 $1/|x|$ 在 0 处奇异", "连续上鞅，但不是局部鞅"], a: 0, hint: "$1/|x|$ 在 $\\mathbb R^3\\setminus\\{0\\}$ 上调和，而 $B$ 不碰 0；再看 $E[1/|B_t|]$ 随 $t$ 的变化。",
    exp: "三维时 $B$ a.s. 不碰 0，对调和函数 $|x|^{-1}$ 用 Itô 公式（开集版本）知它是连续局部鞅；高斯密度给出 $L^2$ 有界。但 $E[1/|B_t|]\\to0$ 不是常数，所以不是鞅——局部鞅加 $L^2$ 有界不足以成为鞅。（书中 Exercise 5.33 · p.148）" },
  { id: "sc-r5-22", ch: 5, cat: "Exercise 5.30 Lévy 面积", q: "$(X,Y)$ 为从 0 出发的二维布朗运动，$A_t=\\int_0^tX_s\\,dY_s-\\int_0^tY_s\\,dX_s$。对 $\\lambda>0$，$E[e^{i\\lambda A_r}]$ 等于：", opts: ["$1/\\cosh(\\lambda r)$", "$e^{-\\lambda^2r^2/2}$", "$1/\\cosh(\\lambda\\sqrt r)$", "$e^{-\\lambda^2r/2}$"], a: 0, hint: "$A$ 不是高斯的：$\\langle A,A\\rangle_t=\\int_0^t(X_s^2+Y_s^2)\\,ds$ 是随机的。",
    exp: "习题中用 $\\cos(\\lambda A_t)\\,e^{-W_t}$ 型的局部鞅，并取 $f(t)=-\\log\\cosh(\\lambda(r-t))$，得到 $E[e^{i\\lambda A_r}]=1/\\cosh(\\lambda r)$。由于括号是随机的，答案不是高斯特征函数；缩放 $A_{cr}\\overset{d}{=}cA_r$ 也排除了 $\\sqrt r$ 形式。（书中 Exercise 5.30 · p.144–145）" },
  { id: "sc-r5-23", ch: 5, cat: "Lemma 5.14 平坦区间", q: "$M$ 为连续局部鞅，$a<b$。几乎必然地，$\\langle M,M\\rangle_b=\\langle M,M\\rangle_a$ 等价于：", opts: ["$M_t=M_a$ 对一切 $t\\in[a,b]$", "$M_b=M_a$", "$M_t=0$ 对一切 $t\\in[a,b]$", "$M_t=M_a$ 对一切 $t\\ge a$"], a: 0, hint: "$M$ 回到原值不代表中间不动；二次变差记录的是整段路径的振荡。",
    exp: "Lemma 5.14：a.s. 对一切 $a<b$，$M$ 在 $[a,b]$ 上为常数当且仅当 $\\langle M,M\\rangle$ 在其上为常数。这保证了 DDS 中 $\\beta_r=M_{\\tau_r}$ 的路径连续。$M_b=M_a$ 太弱；$M\\equiv0$ 和“$t\\ge a$ 时都等于 $M_a$”太强（$b$ 之后没有信息）。（书中 §5.3.2 · Lemma 5.14 · p.121）" },
  { id: "sc-r5-24", ch: 5, cat: "Prop 5.15 两个 DDS 布朗运动", q: "$M,N$ 为连续局部鞅，$M_0=N_0=0$，$\\langle M,M\\rangle=\\langle N,N\\rangle$ 且 $\\langle M,M\\rangle_\\infty=\\infty$。再加哪个条件就保证它们的 DDS 布朗运动 $\\beta,\\gamma$ 独立？", opts: ["$\\langle M,N\\rangle\\equiv0$", "$\\langle M,M\\rangle_t=t$", "$\\langle M,N\\rangle=\\langle M,M\\rangle$", "$\\langle M+N,M+N\\rangle=\\langle M,M\\rangle$"], a: 0, hint: "想想 $(\\beta,\\gamma)$ 要成为二维布朗运动，需要用 Lévy 刻画检查什么。",
    exp: "Prop 5.15：正交（$\\langle M,N\\rangle=0$）时 $\\beta_r\\gamma_r$ 是 $(\\mathcal G_r)$-鞅，由 Lévy 刻画 $(\\beta,\\gamma)$ 是二维布朗运动，故独立。$\\langle M,M\\rangle_t=t$ 允许 $M=N$；其余两项分别对应 $\\langle M,N\\rangle=\\langle M,M\\rangle$ 与 $=-\\tfrac12\\langle M,M\\rangle$，都不正交。（书中 §5.3.2 · Prop 5.15 · p.123）" },
  { id: "sc-r5-25", ch: 5, cat: "Thm 5.18 的推论", q: "设 $(\\mathcal F_t)$ 是一维布朗运动 $B$（$B_0=0$）的完备化典范滤子。下列哪项**不是**鞅表示定理的推论？", opts: ["每个连续局部鞅都是真鞅", "$(\\mathcal F_t)$ 右连续", "每个鞅都有连续修正", "$L^2$ 有界鞅都形如 $C+\\int_0^t h_s\\,dB_s$"], a: 0, hint: "表示定理把鞅写成随机积分，但随机积分本身可以只是局部鞅。",
    exp: "书中由表示定理推出滤子右连续（也左连续）、所有鞅有连续修正，以及 $L^2$ 有界鞅的表示。但布朗滤子中仍有严格局部鞅，例如把 $\\int_0^t(1-s)^{-1}dB_s$ 停在首次到达 1 的时刻，得到的局部鞅在 $t=1$ 时等于 1，而 $M_0=0$。（书中 §5.4 · Thm 5.18 及其推论 · p.127–130）" },
  { id: "sc-r5-26", ch: 5, cat: "§5.4 鞅表示的计算", q: "在 $[0,1]$ 上写 $B_1^3=\\int_0^1h_s\\,dB_s$（$B_0=0$）。被积过程 $h_s$ 是：", opts: ["$3B_s^2+3(1-s)$", "$3B_s^2$", "$3B_s^2+3s$", "$3B_s^2+3$"], a: 0, hint: "先对 $x^3$ 用 Itô 公式，再把剩下的 $\\int_0^1B_s\\,ds$ 也写成随机积分。",
    exp: "Itô 公式给出 $B_1^3=\\int_0^13B_s^2\\,dB_s+3\\int_0^1B_s\\,ds$；分部积分得 $\\int_0^1B_s\\,ds=\\int_0^1(1-s)\\,dB_s$。因此 $h_s=3B_s^2+3(1-s)$（且 $E[B_1^3]=0$）。（书中 §5.4 · Thm 5.18 · p.127）" },
  { id: "sc-r5-27", ch: 5, cat: "Prop 5.20 密度过程", q: "设 $Q\\ll P$ 在 $\\mathcal F_\\infty$ 上，$D_t=\\frac{dQ}{dP}\\big|_{\\mathcal F_t}$（取 càdlàg 修正）。下列哪项一般成立？", opts: ["$D$ 是一致可积鞅，$D_T=\\frac{dQ}{dP}|_{\\mathcal F_T}$", "$D$ 一定有连续路径", "$\\inf_t D_t>0$，$P$-a.s.", "$D$ 是上鞅但未必是鞅"], a: 0, hint: "$D_t$ 可以写成某个固定随机变量的条件期望。",
    exp: "$D_t=E_P[D_\\infty\\mid\\mathcal F_t]$，所以 $D$ 是由 $D_\\infty$ 封闭的一致可积鞅，由可选停止得 $D_T$ 是 $\\mathcal F_T$ 上的密度。$\\inf D_t>0$ 需要 $P,Q$ 相互绝对连续；路径连续性是 Girsanov 定理里另加的假设（布朗滤子下自动成立）。（书中 §5.5 · Prop 5.20 · p.132）" },
  { id: "sc-r5-28", ch: 5, cat: "§5.5 换测度下的不变量", q: "在 Girsanov 定理的条件下（$P\\sim Q$，密度过程 $D$ 连续），把 $P$ 换成 $Q$ 时，下列哪项**一般会改变**？", opts: ["半鞅 $X$ 典范分解中的局部鞅部分", "两个半鞅的括号 $\\langle X,Y\\rangle$", "随机积分 $H\\cdot X$（$H$ 局部有界）", "$X$ 是否为有限变差过程"], a: 0, hint: "括号可以用增量平方和的依概率极限算出，而依概率收敛在等价测度下不变。",
    exp: "$P$-局部鞅 $M$ 在 $Q$ 下分解为 $\\tilde M+\\langle M,L\\rangle$，所以局部鞅部分变了，但半鞅类不变。括号由 Prop 4.21 的逼近给出，因而不变；书中还证明了 $H\\cdot X$ 不依赖于测度；有限变差是逐条路径的性质。（书中 §5.5 · Thm 5.22 推论 (a)(b) · p.135–136）" },
  { id: "sc-r5-29", ch: 5, cat: "Thm 5.23 指数鞅判据", q: "设 $L$ 为连续局部鞅，$L_0=0$。下列哪一条（Kazamaki 判据）足以保证 $\\mathcal E(L)$ 是一致可积鞅？", opts: ["$L$ 一致可积鞅，且 $E[e^{L_\\infty/2}]<\\infty$", "$E[\\langle L,L\\rangle_\\infty]<\\infty$", "$E[\\sup_t|L_t|]<\\infty$", "$E[\\mathcal E(L)_\\infty]\\le1$"], a: 0, hint: "由 Fatou 引理，$E[\\mathcal E(L)_\\infty]\\le1$ 对任何这样的 $L$ 都成立；关键是等号。",
    exp: "Thm 5.23：Novikov ⇒ Kazamaki（$L$ 一致可积鞅且 $E[\\exp\\frac12L_\\infty]<\\infty$）⇒ $\\mathcal E(L)$ 一致可积。仅 $L^2$ 有界不够：取 $L=B^\\tau$，$\\tau$ 为 $B_t-t/2$ 首达 $-a$ 的时刻，则 $E\\tau<\\infty$，但 $E[\\mathcal E(L)_\\infty]=e^{-a}<1$。（书中 §5.5 · Thm 5.23 · p.137）" },
  { id: "sc-r5-30", ch: 5, cat: "§5.6 Cameron–Martin 公式的应用", q: "$B$ 为布朗运动，$B_0=0$，$a>0$，$c<0$，$U_a=\\inf\\{t:B_t+ct=a\\}$。$P(U_a<\\infty)$ 等于：", opts: ["$e^{2ca}$", "$e^{ca}$", "$e^{ca/2}$", "$1$"], a: 0, hint: "想想漂移为负的布朗运动永远碰不到 $a$ 的概率；可以找一个形如 $\\exp(\\theta(B_t+ct))$ 的鞅，再用可选停止。",
    exp: "$U_a$ 的密度为 $\\frac{a}{\\sqrt{2\\pi s^3}}e^{-(a-cs)^2/(2s)}$；积分得 $c\\ge0$ 时为 1，$c\\le0$ 时为 $e^{2ca}$。也可由鞅 $e^{-2c(B_t+ct)}$ 的可选停止得到 $e^{-2ca}P(U_a<\\infty)=1$。（书中 §5.6 · Prop 5.24 后的例子 · p.140–141）" },
  { id: "sc-r6-1", ch: 6, cat: "§6.1 有限维分布", q: "设 $X$ 是以 $(Q_t)$ 为转移半群的马尔可夫过程，$X_0$ 的分布为 $\\mu$。对 $0<s<t$，$P(X_s\\in A,\\ X_t\\in B)$ 等于：", opts: ["$\\int\\mu(dx)\\int_A Q_s(x,dy)\\,Q_{t-s}(y,B)$", "$\\int\\mu(dx)\\int_A Q_s(x,dy)\\,Q_{t}(y,B)$", "$\\int\\mu(dx)\\,Q_s(x,A)\\,Q_t(x,B)$", "$\\int_A\\mu(dy)\\,Q_{t-s}(y,B)$"], a: 0, hint: "先在时刻 $s$ 处用马氏性，从 $X_s=y$ 出发还需再走多长时间？",
    exp: "对 $f_1=\\mathbf 1_A$、$f_2=\\mathbf 1_B$ 归纳使用马氏性：先由 $\\mu$ 和 $Q_s$ 得到 $X_s$ 的位置，再用 $Q_{t-s}$ 走完剩下的时间。由此可见有限维分布完全由半群和初始分布决定；把 $X_s$ 与 $X_t$ 当作在给定 $X_0$ 下条件独立是错误的。（书中 §6.1 · Def 6.2 之后 · p.153）" },
  { id: "sc-r6-2", ch: 6, cat: "Cor 6.4 典范过程的构造", q: "推论 6.4 借助 Kolmogorov 扩张定理在 $\\Omega^*=E^{\\mathbb R_+}$ 上构造了以 $(Q_t)$ 为半群的典范过程。下列哪项是这一构造**不能**提供的？", opts: ["样本路径的正则性（甚至可测性）", "任意给定的初始分布 $\\mu$", "关于典范滤子的马尔可夫性", "$x\\mapsto P_x(A)$ 的可测性"], a: 0, hint: "$\\mathcal F^*$ 只由坐标映射生成，它能“看到”多少个时刻？",
    exp: "$\\Omega^*$ 上的 σ-域由坐标映射生成，因而只能描述可数多个时刻的性质，构造本身对路径正则性毫无信息；正则性要等到 Feller 情形下的定理 6.15 才得到。初始分布任意、马氏性和 $x\\mapsto P_x(A)$ 的可测性都是构造直接给出的。（书中 §6.1 · Cor 6.4 · p.155）" },
  { id: "sc-r6-3", ch: 6, cat: "Def 6.5 预解式", q: "对 $\\lambda,\\mu>0$，转移半群的预解式 $R_\\lambda$ 满足的预解方程是：", opts: ["$R_\\lambda-R_\\mu+(\\lambda-\\mu)R_\\lambda R_\\mu=0$", "$R_\\lambda-R_\\mu-(\\lambda-\\mu)R_\\lambda R_\\mu=0$", "$R_\\lambda R_\\mu=R_{\\lambda+\\mu}$", "$\\lambda R_\\lambda-\\mu R_\\mu=(\\lambda-\\mu)R_\\lambda R_\\mu$"], a: 0, hint: "用平凡半群 $Q_t=\\mathrm{Id}$（此时 $R_\\lambda=1/\\lambda$）检验各式。",
    exp: "形式上 $R_\\lambda=(\\lambda-L)^{-1}$，故 $R_\\lambda-R_\\mu=R_\\lambda[(\\mu-L)-(\\lambda-L)]R_\\mu=(\\mu-\\lambda)R_\\lambda R_\\mu$。用 $R_\\lambda=1/\\lambda$ 代入可以排除其余三式。（书中 §6.1 · Def 6.5 · p.156）" },
  { id: "sc-r6-4", ch: 6, cat: "§6.1 布朗运动的预解核", q: "一维布朗运动的预解式为 $R_\\lambda f(x)=\\int r_\\lambda(y-x)f(y)\\,dy$，其中 $r_\\lambda(z)$ 等于：", opts: ["$\\tfrac{1}{\\sqrt{2\\lambda}}e^{-\\sqrt{2\\lambda}|z|}$", "$\\tfrac{1}{\\sqrt{2\\lambda}}e^{-\\lambda|z|}$", "$\\sqrt{2\\lambda}\\,e^{-\\sqrt{2\\lambda}|z|}$", "$\\tfrac{1}{2\\lambda}e^{-\\sqrt{2\\lambda}|z|}$"], a: 0, hint: "$R_\\lambda 1=\\int_0^\\infty e^{-\\lambda t}dt$，所以 $r_\\lambda$ 的总积分应为多少？",
    exp: "$r_\\lambda(z)=\\int_0^\\infty e^{-\\lambda t}p_t(z)\\,dt$，可以用击中时 Laplace 变换 $E[e^{-\\lambda T_a}]=e^{-a\\sqrt{2\\lambda}}$ 求出。检验：正确答案在 $\\mathbb R$ 上积分为 $1/\\lambda$，其余三个（作为 $\\lambda$ 的函数）都不满足。（书中 §6.1 · 例（Def 6.5 后）· p.157）" },
  { id: "sc-r6-5", ch: 6, cat: "Lemma 6.6 预解式与上鞅", q: "设 $X$ 是以 $(Q_t)$ 为半群的马尔可夫过程，$\\lambda>0$。对任意非负 $h\\in B(E)$，下列哪个过程**一定**是上鞅？", opts: ["$e^{-\\lambda t}R_\\lambda h(X_t)$", "$e^{\\lambda t}R_\\lambda h(X_t)$", "$e^{-\\lambda t}h(X_t)$", "$R_\\lambda h(X_t)$"], a: 0, hint: "计算 $e^{-\\lambda s}Q_sR_\\lambda h$，并和 $R_\\lambda h$ 比较。",
    exp: "由 $e^{-\\lambda s}Q_sR_\\lambda h=\\int_s^\\infty e^{-\\lambda t}Q_th\\,dt\\le R_\\lambda h$ 即得上鞅性。$e^{-\\lambda t}h(X_t)$ 需要 $e^{-\\lambda s}Q_sh\\le h$，而 $h=\\mathbf 1_A$、起点在 $A$ 外时这不成立；$R_\\lambda h(X_t)$ 不加权时同样可能变大（如布朗运动远离 $A$ 处）。（书中 §6.1 · Lemma 6.6 · p.157）" },
  { id: "sc-r6-6", ch: 6, cat: "Prop 6.8 预解式的值域", q: "设 $(Q_t)$ 为 Feller 半群，$f\\in C_0(E)$。当 $\\lambda\\to\\infty$ 时，$\\lambda R_\\lambda f$：", opts: ["在 $C_0(E)$ 中一致收敛到 $f$", "在 $C_0(E)$ 中一致收敛到 $0$", "一致收敛到 $Lf$", "范数趋于 $+\\infty$"], a: 0, hint: "换元 $t\\mapsto t/\\lambda$，再用 Feller 半群的强连续性。",
    exp: "$\\lambda R_\\lambda f=\\int_0^\\infty e^{-t}Q_{t/\\lambda}f\\,dt\\to f$（强连续性加控制收敛），所以 $\\mathcal R=R_\\lambda(C_0(E))$ 在 $C_0(E)$ 中稠密。又 $\\|\\lambda R_\\lambda f\\|\\le\\|f\\|$，故范数不会发散；$Lf$ 也只对 $f\\in D(L)$ 有定义。（书中 §6.2 · Prop 6.8 · p.159）" },
  { id: "sc-r6-7", ch: 6, cat: "Prop 6.12 定义域与预解式", q: "设 $(Q_t)$ 为 Feller 半群，生成元为 $L$，$g\\in C_0(E)$，$\\lambda>0$。关于 $R_\\lambda g$，正确的是：", opts: ["$R_\\lambda g\\in D(L)$，$LR_\\lambda g=\\lambda R_\\lambda g-g$", "$R_\\lambda g\\in D(L)$，$LR_\\lambda g=g-\\lambda R_\\lambda g$", "$R_\\lambda g\\in D(L)$，$LR_\\lambda g=\\lambda R_\\lambda g$", "$R_\\lambda g$ 一般不属于 $D(L)$"], a: 0, hint: "$R_\\lambda$ 与 $\\lambda-L$ 互为逆算子。",
    exp: "由命题 6.12，$(\\lambda-L)R_\\lambda g=g$，即 $LR_\\lambda g=\\lambda R_\\lambda g-g$，并且 $D(L)=R_\\lambda(C_0(E))$，所以 $R_\\lambda g$ 总在定义域中。$g-\\lambda R_\\lambda g$ 符号相反；用 $Q_t=\\mathrm{Id}$（$L=0$，$R_\\lambda g=g/\\lambda$）检验可排除 $LR_\\lambda g=\\lambda R_\\lambda g$。（书中 §6.2 · Prop 6.12 · p.160）" },
  { id: "sc-r6-8", ch: 6, cat: "Prop 6.11 半群与生成元", q: "设 $(Q_t)$ 为 Feller 半群，$f\\in D(L)$。则对每个 $t\\ge0$，$Q_tf$ 等于：", opts: ["$f+\\int_0^t Q_s(Lf)\\,ds$", "$f-\\int_0^t Q_s(Lf)\\,ds$", "$f+tLf$", "$f+\\int_0^t Q_sf\\,ds$"], a: 0, hint: "$t\\mapsto Q_tf(x)$ 的导数是什么？",
    exp: "由于 $\\varepsilon^{-1}(Q_{t+\\varepsilon}f-Q_tf)=Q_t(\\varepsilon^{-1}(Q_\\varepsilon f-f))\\to Q_t(Lf)$，$t\\mapsto Q_tf$ 的导数为 $Q_tLf=LQ_tf$，积分即得。$f+tLf$ 只是一阶近似，例如布朗运动配上 $f$ 为 Gauss 函数时就不成立。（书中 §6.2 · Prop 6.11 · p.159）" },
  { id: "sc-r6-9", ch: 6, cat: "§6.2 布朗运动的生成元", q: "一维布朗运动半群的生成元 $L$ 的定义域 $D(L)$ 恰好是：", opts: ["$\\{h\\in C^2(\\mathbb R):h,h''\\in C_0(\\mathbb R)\\}$", "$C^2(\\mathbb R)\\cap C_0(\\mathbb R)$", "$C^2_c(\\mathbb R)$（紧支撑 $C^2$ 函数）", "$\\{h\\in C^1(\\mathbb R):h,h'\\in C_0(\\mathbb R)\\}$"], a: 0, hint: "$Lh$ 必须落在 $C_0(\\mathbb R)$ 中；另外 $e^{-x^2}$ 属于 $D(L)$ 吗？",
    exp: "书中先写 $h=R_{1/2}f$ 证得 $h''=-2f+h$，从而 $D(L)\\subset\\{h\\in C^2:h,h''\\in C_0\\}$ 且 $Lh=\\frac12h''$，再反向证明等号成立。$C^2\\cap C_0$ 太大（$h''$ 不一定在 $C_0$ 中），$C^2_c$ 太小（不含 $e^{-x^2}$）。（书中 §6.2 · 例（Cor 6.13 后）· p.161–162）" },
  { id: "sc-r6-10", ch: 6, cat: "Ex 6.23 反射布朗运动", q: "$X_t=|B_t|$ 是 $\\mathbb R_+$ 上的 Feller 过程（习题 6.23），生成元记为 $L$。设 $f\\in C^2(\\mathbb R_+)$ 且 $f,f''\\in C_0(\\mathbb R_+)$。则 $f\\in D(L)$ 当且仅当：", opts: ["$f'(0)=0$", "$f(0)=0$", "$f''(0)=0$", "不需要额外条件"], a: 0, hint: "考虑 $g(y)=f(|y|)$，它什么时候在 $0$ 处二阶连续可微？",
    exp: "若 $f'(0)=0$，$g(y)=f(|y|)$ 是 $\\mathbb R$ 上的 $C^2$ 函数，由布朗运动的生成元可得 $f\\in D(L)$ 且 $Lf=\\frac12f''$；若 $f'(0)\\neq0$，则 $f\\notin D(L)$。这是 Neumann 型（反射）边界条件，$f(0)=0$ 对应的则是在 $0$ 处被杀死的过程。（书中 Exercises · Ex 6.23 · p.179）" },
  { id: "sc-r6-11", ch: 6, cat: "Thm 6.14 生成元的鞅刻画", q: "设 $(Q_t)$ 为 Feller 半群，$X^x$ 为从 $x$ 出发的 càdlàg 版本，$h,g\\in C_0(E)$。“$h\\in D(L)$ 且 $Lh=g$”等价于对每个 $x\\in E$：", opts: ["$h(X^x_t)-\\int_0^t g(X^x_s)\\,ds$ 是鞅", "$h(X^x_t)+\\int_0^t g(X^x_s)\\,ds$ 是鞅", "$h(X^x_t)-\\int_0^t g(X^x_s)\\,ds$ 是上鞅", "$h(X^x_t)\\exp(-\\int_0^t g(X^x_s)ds)$ 是鞅"], a: 0, hint: "取期望，比较 $Q_th(x)-h(x)$ 与 $\\int_0^tQ_rg(x)\\,dr$。",
    exp: "由 $Q_sh=h+\\int_0^sQ_rg\\,dr$ 和马氏性可得鞅性；反过来，鞅性给出 $t^{-1}(Q_th-h)=t^{-1}\\int_0^tQ_rg\\,dr\\to g$。符号取反就错了；只有上鞅性也不够，它只给出不等式。（书中 §6.2 · Thm 6.14 · p.162）" },
  { id: "sc-r6-12", ch: 6, cat: "Thm 6.14 的应用：d 维布朗运动", q: "设 $L$ 是 $d$ 维布朗运动半群的生成元。由 Itô 公式与定理 6.14，书中能断言的是：", opts: ["$\\{h\\in C^2:h,\\Delta h\\in C_0\\}\\subset D(L)$", "$D(L)=C^2(\\mathbb R^d)\\cap C_0(\\mathbb R^d)$", "$D(L)\\subset C^2_c(\\mathbb R^d)$", "$C^2(\\mathbb R^d)\\subset D(L)$"], a: 0, hint: "Itô 公式只给出连续局部鞅；把它升级为真鞅还需要什么？",
    exp: "对 $h\\in C^2$，$h(X_t)-\\frac12\\int_0^t\\Delta h(X_s)ds$ 是连续局部鞅；若 $h,\\Delta h\\in C_0$（有界），它就是真鞅，再由定理 6.14 得 $h\\in D(L)$，$Lh=\\frac12\\Delta h$。一般维数下书中只得到这个包含关系，$d=1$ 时才证明了等号。$D(L)\\subset C_0$，所以不可能包含全部 $C^2$；$e^{-|x|^2}\\in D(L)$ 不是紧支撑的。（书中 §6.2 · Thm 6.14 后的例 · p.163–164）" },
  { id: "sc-r6-13", ch: 6, cat: "Thm 6.15 路径正则性", q: "定理 6.15 证明 Feller 过程有 càdlàg 修正，其中“极限存在”这一步的关键工具是：", opts: ["对 $e^{-pt}R_ph(X_t)$ 用上鞅的正则性定理", "Kolmogorov 连续性准则", "对 $h(X_t)$ 用 Itô 公式", "Doob 极大不等式加 Borel–Cantelli"], a: 0, hint: "引理 6.6 构造出的是哪一类过程？",
    exp: "取可数族 $\\mathcal H=\\{R_pf_n\\}$ 分离 $E_\\Delta$ 的点；对每个 $h\\in\\mathcal H$，$e^{-pt}h(X_t)$ 是上鞅（引理 6.6），由第 3 章定理 3.17，沿可数稠密集的左右极限几乎必然存在，从而 $X$ 本身沿稠密集有极限。Kolmogorov 准则给出的是连续性，Feller 过程一般有跳，用不上。（书中 §6.3 · Thm 6.15 · p.164）" },
  { id: "sc-r6-14", ch: 6, cat: "Lemma 6.18 第一次跳跃", q: "$E$ 有限，$X$ 是 $E$ 上 càdlàg 的 Feller 跳过程，$T_1$ 为第一次跳跃时刻。设 $q(x)>0$，在 $P_x$ 下：", opts: ["$T_1\\sim\\mathrm{Exp}(q(x))$ 且与 $X_{T_1}$ 独立", "$T_1\\sim\\mathrm{Exp}(q(x))$，但与 $X_{T_1}$ 不独立", "$T_1$ 服从 $[0,2/q(x)]$ 上的均匀分布", "$T_1$ 服从参数 $q(x)$ 的 Poisson 分布"], a: 0, hint: "在确定时刻 $s$ 用简单马氏性，$P_x(T_1>s+t)$ 可以写成什么？",
    exp: "简单马氏性给出 $P_x(T_1>s+t)=P_x(T_1>s)P_x(T_1>t)$，即无记忆性，所以 $T_1$ 服从指数分布。同理 $P_x(T_1>t,X_{T_1}=y)=P_x(T_1>t)P_x(X_{T_1}=y)$，得到独立性。均匀分布没有无记忆性；Poisson 分布取整数值，不是时刻的分布。（书中 §6.5.1 · Lemma 6.18 · p.171）" },
  { id: "sc-r6-15", ch: 6, cat: "Prop 6.20 跳过程的路径描述", q: "有限状态跳过程无吸收态，$T_0=0<T_1<T_2<\\cdots$ 为跳跃时刻。给定 $(X_{T_i})_{i\\ge0}$ 后，各等待时间 $T_{i+1}-T_i$：", opts: ["条件独立，分别服从 $\\mathrm{Exp}(q(X_{T_i}))$", "条件独立，分别服从 $\\mathrm{Exp}(q(X_{T_{i+1}}))$", "条件独立同分布，都服从 $\\mathrm{Exp}(q(x))$", "服从 $\\mathrm{Exp}(\\Pi(X_{T_i},X_{T_{i+1}}))$"], a: 0, hint: "第 $i$ 段等待时间里，过程停留在哪个状态？",
    exp: "在 $[T_i,T_{i+1})$ 上过程停在 $X_{T_i}$。在 $T_i$ 处用强马氏性，再结合引理 6.18，可知这段等待时间服从 $\\mathrm{Exp}(q(X_{T_i}))$，且各段条件独立；嵌入链 $(X_{T_i})$ 是以 $\\Pi$ 为转移核的离散马氏链。（书中 §6.5.1 · Prop 6.20 · p.174）" },
  { id: "sc-r6-16", ch: 6, cat: "§6.5.1 两状态跳过程计算", q: "$E=\\{1,2\\}$，跳出速率为 $q(1)=a>0$、$q(2)=b>0$（只能跳到另一状态）。则 $P_1(X_t=1)$ 等于：", opts: ["$\\tfrac{b}{a+b}+\\tfrac{a}{a+b}e^{-(a+b)t}$", "$\\tfrac{a}{a+b}+\\tfrac{b}{a+b}e^{-(a+b)t}$", "$e^{-at}$", "$\\tfrac{b}{a+b}+\\tfrac{a}{a+b}e^{-abt}$"], a: 0, hint: "$Q_t=\\exp(tL)$，$L=\\begin{pmatrix}-a&a\\\\ b&-b\\end{pmatrix}$；检查 $t=0$ 处的导数。",
    exp: "$L$ 的特征值为 $0$ 和 $-(a+b)$，解 $\\frac{d}{dt}Q_t=Q_tL$ 即得该式；它在 $t=0$ 时取值 $1$、导数为 $-a=L(1,1)$，$t\\to\\infty$ 时趋于平稳概率 $\\frac b{a+b}$。$e^{-at}$ 是 $P_1(T_1>t)$，漏掉了跳出后又跳回来的情形；另一个系数互换的式子导数为 $-b$。（书中 §6.5.1 · Prop 6.19 · p.172, 175）" },
  { id: "sc-r6-17", ch: 6, cat: "§6.5.2 Lévy 过程", q: "§6.5.2 对实值过程 $Y$ 假设：(i) $Y_0=0$；(ii) 增量独立且平稳；(iii) 另一条。第 (iii) 条是：", opts: ["$t\\downarrow0$ 时 $Y_t$ 依概率收敛到 $0$", "样本路径是 càdlàg 的", "样本路径是连续的", "对每个 $t$ 有 $E[Y_t^2]<\\infty$"], a: 0, hint: "书中强调 càdlàg 路径是“推出来的”，不是假设。",
    exp: "只假设依概率连续，就足以说明 $(Q_t)$ 是 Feller 半群（命题 6.21），再由定理 6.15 得到 càdlàg 修正。路径连续太强：布朗运动击中时过程 $(T_a)$ 也是例子，它有跳；二阶矩也不需要。（书中 §6.5.2 · Prop 6.21 · p.175–177）" },
  { id: "sc-r6-18", ch: 6, cat: "§6.5.3 连续状态分支过程", q: "Feller 分支扩散的例子中 $\\int Q_t(x,dy)e^{-\\lambda y}=e^{-x\\psi_t(\\lambda)}$，$\\psi_t(\\lambda)=\\frac{\\lambda}{1+\\lambda t}$。则 $\\psi_t(\\psi_s(\\lambda))$ 等于：", opts: ["$\\psi_{t+s}(\\lambda)$", "$\\psi_{ts}(\\lambda)$", "$\\psi_t(\\lambda)\\,\\psi_s(\\lambda)$", "$\\psi_t(\\lambda)+\\psi_s(\\lambda)$"], a: 0, hint: "直接代入化简，或者回想 Chapman–Kolmogorov 对 Laplace 指数意味着什么。",
    exp: "$\\frac{\\lambda/(1+\\lambda s)}{1+t\\lambda/(1+\\lambda s)}=\\frac{\\lambda}{1+\\lambda(s+t)}=\\psi_{t+s}(\\lambda)$。一般地，命题 6.22 指出分支性质加 Chapman–Kolmogorov 恒等式给出 $\\psi_t\\circ\\psi_s=\\psi_{t+s}$。（书中 §6.5.3 · Prop 6.22 · p.177–178）" },
  { id: "sc-r6-19", ch: 7, cat: "§7.1 热方程", q: "设 $\\varphi\\in C_0(\\mathbb R^d)$，$u_t(x)=E_x[\\varphi(B_t)]$。则在 $(0,\\infty)\\times\\mathbb R^d$ 上 $u$ 满足哪个方程？", opts: ["$\\partial_t u=\\tfrac12\\Delta u$", "$\\partial_t u=\\Delta u$", "$\\partial_t u=-\\tfrac12\\Delta u$", "$\\partial_t u=\\tfrac12\\Delta u-u$"], a: 0, hint: "布朗运动生成元在光滑函数上作用为什么？",
    exp: "$u_t=Q_t\\varphi$，而布朗半群的生成元在 $C^2$ 且导数属于 $C_0$ 的函数上是 $\\tfrac12\\Delta$，由 $\\partial_t Q_t\\varphi=LQ_t\\varphi$ 得 $\\partial_t u=\\tfrac12\\Delta u$；系数 $1$ 对应方差 $2t$ 的过程。（书中 §7.1 · Thm 7.1 · p.186）" },
  { id: "sc-r6-20", ch: 7, cat: "Exercise 7.28 Feynman–Kac", q: "设 $\\varphi\\in C_0(\\mathbb R^d)$，$v\\ge0$ 属于 $C_0(\\mathbb R^d)$ 且 $C^1$、一阶导数有界，$u_t(x)=E_x\\big[\\varphi(B_t)\\exp(-\\int_0^t v(B_s)ds)\\big]$。则 $u$ 满足：", opts: ["$\\partial_t u=\\tfrac12\\Delta u-vu$", "$\\partial_t u=\\tfrac12\\Delta u+vu$", "$\\partial_t u=\\tfrac12\\Delta u-v$", "$\\partial_t u=\\Delta u-vu$"], a: 0, hint: "指数因子相当于以速率 $v$ “杀死”粒子。",
    exp: "这是 Feynman–Kac 公式：带势 $v$ 的半群生成元为 $\\tfrac12\\Delta-v$，故 $\\partial_t u=\\tfrac12\\Delta u-vu$。加号对应 $\\exp(+\\int v)$；“$-v$”丢掉了与 $u$ 的乘积。（书中 Exercise 7.28 · p.206）" },
  { id: "sc-r6-21", ch: 7, cat: "§7.2 调和函数与停时", q: "设 $u$ 在区域 $D$ 上调和，$D'\\subset D$ 为子区域，$T$ 为 $B$ 离开 $D'$ 的时刻。书中保证 $u(x)=E_x[u(B_T)]$（$x\\in D'$）所加的条件是：", opts: ["$D'$ 有界且 $\\overline{D'}\\subset D$", "$\\overline{D'}\\subset D$ 即可，不需有界", "$D'$ 有界即可，允许 $D'=D$", "$u$ 在 $D$ 上有界即可"], a: 0, hint: "证明中要让 $u(B_{t\\wedge T})$ 成为真鞅并对 $t\\to\\infty$ 取极限，这需要什么？",
    exp: "$D'$ 有界且闭包在 $D$ 内时，$u,\\nabla u$ 在 $\\overline{D'}$ 上有界，$T<\\infty$ a.s.，$u(B_{t\\wedge T})$ 是真鞅，再用控制收敛。无界反例：$D=\\mathbb R^2$，$D'$ 为上半平面，$u(x)=x_2$，出口处 $u=0\\ne u(x)$；若 $D'=D$，$u$ 在 $\\partial D$ 上可能无定义。（书中 §7.2 · Prop 7.3 · p.187）" },
  { id: "sc-r6-22", ch: 7, cat: "§7.2 调和函数与出口分布", q: "在 $\\mathbb R^2$ 中令 $u(x)=x_1^2-x_2^2$，$B$ 从 $(1,0)$ 出发，$T$ 为离开以 $(1,0)$ 为心、半径 $2$ 的开圆盘的时刻。$E[u(B_T)]$ 等于：", opts: ["$1$", "$0$", "$3$", "$5$"], a: 0, hint: "先判断 $u$ 是否调和。",
    exp: "$\\Delta u=2-2=0$，由 Prop 7.3（或均值性质）$E[u(B_T)]=u(1,0)=1$。直接算也一样：$E[(B^1_T)^2]=1+2=3$，$E[(B^2_T)^2]=2$；$3$ 只是第一项，$5$ 是 $E|B_T|^2$。（书中 §7.2 · Prop 7.3, Prop 7.4 · p.187–188）" },
  { id: "sc-r6-23", ch: 7, cat: "§7.2 Dirichlet 问题的概率表示", q: "设 $D$ 为有界区域，$g$ 为 $\\partial D$ 上有界可测函数，$u(x)=E_x[g(B_T)]$，$T$ 为离开 $D$ 的时刻。下列哪项**一定**成立？", opts: ["$u$ 在 $D$ 上调和", "$u$ 连续延拓到 $\\overline D$ 且边值为 $g$", "若 $g$ 连续，则 $u$ 必取边值 $g$", "仅当 $D$ 为凸区域时 $u$ 才调和"], a: 0, hint: "用强马氏性验证均值性质。",
    exp: "由强马氏性 $u$ 满足均值性质，从而调和（Prop 7.7(ii)），对任意有界区域成立。但即使 $g$ 连续，$u$ 也未必取到边值 $g$（需外锥条件之类的正则性），可测 $g$ 更不必说。（书中 §7.2 · Prop 7.7 · p.189）" },
  { id: "sc-r6-24", ch: 7, cat: "Exercise 7.24 Dirichlet 问题", q: "设 $d\\ge2$，$D=B_1\\setminus\\{0\\}$，$g=0$ 于 $|x|=1$，$g(0)=1$。对 $x\\in D$，$u(x)=E_x[g(B_T)]$（$T$ 为离开 $D$ 的时刻）等于：", opts: ["$0$", "$1-|x|$", "$(1-|x|)^d$", "$1$"], a: 0, hint: "布朗运动在离开单位球之前会碰到原点吗？",
    exp: "$d\\ge2$ 时单点是极集，$B$ 几乎必然从单位球面离开 $D$，故 $u\\equiv0$。而 Dirichlet 问题的解若存在必等于 $u$（Prop 7.7(i)），$u$ 在 $0$ 处不趋于 $1$，所以该问题无解。（书中 Exercise 7.24 · p.205）" },
  { id: "sc-r6-25", ch: 7, cat: "§7.2 外锥条件", q: "下列有界区域中，哪一个在**每个**边界点都满足外锥条件？", opts: ["任意有界凸区域", "$B_1\\setminus\\{0\\}$（$d\\ge2$）", "单位圆盘去掉线段 $[0,1)$", "$\\mathbb R^3$ 单位球去掉一条线段"], a: 0, hint: "外锥条件要求在边界点附近，$D^c$ 包含一个以该点为顶点的开锥。",
    exp: "凸区域在每个边界点有支撑超平面，外侧半空间中可放开锥。被挖去的点或线段内点附近，$D^c$ 只是零测集，容不下开锥。（书中 §7.2 · Thm 7.8 · p.190–191）" },
  { id: "sc-r6-26", ch: 7, cat: "§7.3 单位球的出口分布", q: "设 $d\\ge2$，$T$ 为离开单位球 $B_1$ 的时刻。对 $x\\in B_1$，$B_T$ 在 $P_x$ 下关于均匀测度 $\\sigma_1(dy)$ 的密度是：", opts: ["$(1-|x|^2)/|y-x|^d$", "$(1-|x|^2)/|y-x|^{d-2}$", "$(1-|x|)/|y-x|^d$", "$(1+|x|^2)/|y-x|^d$"], a: 0, hint: "密度对每个 $y$ 关于 $x$ 调和，且对 $y$ 积分为 $1$。",
    exp: "这是 Poisson 核 $K(x,y)=(1-|x|^2)/|y-x|^d$（Cor 7.15）。其他式子在 $x=0$ 时也等于 $1$，但关于 $x$ 不调和，或积分不为 $1$。（书中 §7.3 · Def 7.10, Cor 7.15 · p.193, 195）" },
  { id: "sc-r6-27", ch: 7, cat: "§7.3 Poisson 核计算", q: "平面单位圆盘中，$B$ 从 $x=\\tfrac12$ 出发。出口点 $B_T$ 关于圆周均匀概率测度的密度在 $y=1$ 处的值是：", opts: ["$3$", "$\\tfrac13$", "$9$", "$\\tfrac32$"], a: 0, hint: "代入 $d=2$ 的 Poisson 核。",
    exp: "$K(\\tfrac12,1)=(1-\\tfrac14)/|1-\\tfrac12|^2=\\tfrac34\\cdot4=3$。$\\tfrac13$ 是 $y=-1$ 处的值，$9$ 是两者之比。（书中 §7.3 · Def 7.10, Cor 7.15 · p.193, 195）" },
  { id: "sc-r6-28", ch: 7, cat: "§7.3 径向调和函数", q: "在 $\\mathbb R^3$ 的球壳 $\\{r_1<|x|<r_2\\}$ 上，形如 $u(x)=h(|x|)$ 的调和函数恰好是：", opts: ["$a+b/r$", "$a+b\\log r$", "$a+b r^{-2}$", "$a+br$"], a: 0, hint: "径向 Laplace 方程为 $h''+\\frac{d-1}{r}h'=0$。",
    exp: "解 $h''+\\tfrac2r h'=0$ 得 $h'=c/r^2$，故 $h=a+b r^{2-d}=a+b/r$。$\\log r$ 是 $d=2$ 的情形，$r^{-2}$ 对应 $d=4$。（书中 §7.3 · Lemma 7.12 · p.193）" },
  { id: "sc-r6-29", ch: 7, cat: "§7.4 球壳出口概率", q: "设 $d=4$，$|x|=3$。布朗运动从 $x$ 出发，最终碰到球面 $\\{|y|=1\\}$ 的概率 $P_x(U_1<\\infty)$ 是：", opts: ["$\\tfrac19$", "$\\tfrac13$", "$\\tfrac1{27}$", "$1$"], a: 0, hint: "让外半径 $R\\to\\infty$，并用 $|y|^{2-d}$ 是调和函数。",
    exp: "$d\\ge3$ 时 $P_x(U_\\varepsilon<\\infty)=(\\varepsilon/|x|)^{d-2}=(1/3)^2=\\tfrac19$。$\\tfrac13$ 是 $d=3$ 的答案，$1$ 是 $d=2$ 的常返情形。（书中 §7.4 · Prop 7.16 · p.196）" },
  { id: "sc-r6-30", ch: 7, cat: "§7.4 平面球壳出口概率", q: "平面布朗运动从 $|x|=e$ 出发。它先碰到圆 $|y|=1$ 后碰到圆 $|y|=e^3$ 的概率 $P_x(U_1<U_{e^3})$ 是：", opts: ["$\\tfrac23$", "$\\tfrac13$", "$\\tfrac12$", "$1$"], a: 0, hint: "$d=2$ 时 $\\log|y|$ 是球壳上的调和函数。",
    exp: "$P_x(U_\\varepsilon<U_R)=\\dfrac{\\log R-\\log|x|}{\\log R-\\log\\varepsilon}=\\dfrac{3-1}{3-0}=\\tfrac23$。$\\tfrac13$ 是先碰外圆的概率；$1$ 是 $R\\to\\infty$ 时的极限。（书中 §7.4 · Prop 7.16 · p.196）" },
  { id: "sc-r6-31", ch: 7, cat: "§7.4 极点与路径的像", q: "关于 $d\\ge2$ 维布朗运动，下列哪项**不**成立？", opts: ["路径像集 $\\{B_t\\}$ 的 Lebesgue 测度 a.s. 为正", "非起点的固定点 a.s. 不会被碰到", "路径像集的 Hausdorff 维数为 $2$", "$d=2$ 时在任意开集中停留总时间 a.s. 无穷"], a: 0, hint: "对 $\\int 1_{\\{\\tau_y<\\infty\\}}dy$ 取期望并用 Fubini。",
    exp: "单点是极集，所以 $E_x[m(\\{B_t\\})]=\\int P_x(\\tau_y<\\infty)dy=0$，像集是 Lebesgue 零测集。其余三项都是书中结论（Hausdorff 维数为 $2$ 引自文献；停留时间无穷来自强马氏性加常返性）。（书中 §7.4 · Prop 7.16, Thm 7.17 · p.196–197）" },
  { id: "sc-r6-32", ch: 7, cat: "§7.5 共形不变性", q: "设 $\\Phi:\\mathbb C\\to\\mathbb C$ 为非常数整函数，$B$ 为复布朗运动。则 $\\Phi(B_t)=\\Gamma_{C_t}$，其中 $\\Gamma$ 是复布朗运动，时间变换 $C_t$ 为：", opts: ["$\\int_0^t|\\Phi'(B_s)|^2ds$", "$\\int_0^t|\\Phi'(B_s)|ds$", "$\\int_0^t|\\Phi(B_s)|^2ds$", "$\\int_0^t\\mathrm{Re}\\,\\Phi'(B_s)ds$"], a: 0, hint: "由 Cauchy–Riemann 方程计算 $\\mathrm{Re}\\,\\Phi(B)$ 的二次变差。",
    exp: "$\\mathrm{Re}\\,\\Phi(B)$ 与 $\\mathrm{Im}\\,\\Phi(B)$ 是局部鞅，交互变差为 $0$，二次变差都等于 $\\int_0^t|\\nabla g|^2ds=\\int_0^t|\\Phi'(B_s)|^2ds$。由常返性 $C_\\infty=\\infty$，再用 Prop 5.15 即可。（书中 §7.5 · Thm 7.18 · p.198）" },
  { id: "sc-r6-33", ch: 7, cat: "§7.5 skew-product 分解", q: "设 $B_0=z\\ne0$，则 $B_t=\\exp(\\beta_{H_t}+i\\gamma_{H_t})$，其中 $\\beta,\\gamma$ 为独立线性布朗运动。$H_t$ 等于：", opts: ["$\\int_0^t |B_s|^{-2}ds$", "$\\int_0^t |B_s|^{2}ds$", "$\\int_0^t |B_s|^{-1}ds$", "$\\tfrac12\\log t$"], a: 0, hint: "对 $\\exp$ 用共形不变性，$|\\exp'(w)|^2=|e^{w}|^2$。",
    exp: "$\\exp(\\Gamma_t)$ 的时间变换是 $C_t=\\int_0^t e^{2\\mathrm{Re}\\,\\Gamma_s}ds$，取逆后 $H_s=\\int_0^s|Z_u|^{-2}du$。$\\tfrac12\\log t$ 只是 $H_t$ 的增长阶（$4H_t/(\\log t)^2$ 依分布收敛）。（书中 §7.5 · Thm 7.19 · p.199）" },
  { id: "sc-r6-34", ch: 7, cat: "§7.6 卷绕数", q: "设 $\\theta_t$ 为从 $z\\ne0$ 出发的平面布朗运动辐角的连续版本。当 $t\\to\\infty$ 时：", opts: ["$2\\theta_t/\\log t$ 依分布收敛到标准 Cauchy", "$\\theta_t/\\sqrt t$ 依分布收敛到 $N(0,1)$", "$2\\theta_t/\\log t$ 依分布收敛到 $N(0,1)$", "$\\theta_t$ a.s. 收敛到有限极限"], a: 0, hint: "$\\theta_t=\\gamma_{H_t}$，并且 $H_t$ 的尺度是 $(\\log t)^2$。",
    exp: "Spitzer 定理：$\\frac{2}{\\log t}\\theta_t$ 接近 $\\gamma^{(\\lambda)}_{T_1^{(\\lambda)}}$，即独立布朗运动在首达时 $T_1$ 处的值，服从标准 Cauchy 分布。由于 $\\limsup\\theta_t=+\\infty$，$\\theta_t$ 不会 a.s. 收敛。（书中 §7.6 · Thm 7.20 · p.201）" },
  { id: "sc-r6-35", ch: 7, cat: "§7.6 平面布朗运动接近原点", q: "平面布朗运动从 $z\\ne0$ 出发。$\\lim_{t\\to\\infty}P\\big(\\min_{0\\le s\\le t}|B_s|\\le t^{-1/2}\\big)$ 等于：", opts: ["$\\tfrac12$", "$\\tfrac13$", "$0$", "$1$"], a: 0, hint: "$\\frac{2}{\\log t}\\log\\min_{s\\le t}|B_s|$ 收敛到 $\\min_{s\\le T_1}\\beta_s$。",
    exp: "Prop 7.22：极限为 $1/(1+a)$，这里 $t^{-a/2}$ 中 $a=1$，得 $\\tfrac12$；$\\tfrac13$ 对应距离 $1/t$（$a=2$）。原点是极点但 $B$ 常返，所以极限既不是 $0$ 也不是 $1$。（书中 §7.6 · Prop 7.22 · p.204）" },
  { id: "sc-r6-36", ch: 7, cat: "§7.6 Kallianpur–Robbins 律", q: "平面布朗运动从任意 $z$ 出发，$R>0$。当 $t\\to\\infty$ 时，$\\frac{2}{\\log t}\\int_0^t 1_{\\{|B_s|<R\\}}ds$ 依分布收敛到：", opts: ["均值为 $R^2$ 的指数分布", "均值为 $R$ 的指数分布", "常数 $\\pi R^2$", "标准 Cauchy 分布"], a: 0, hint: "极限是随机的，而且随 $R$ 的变化应与面积同阶。",
    exp: "Kallianpur–Robbins 律（Thm 7.23）：极限为均值 $R^2$ 的指数分布。因此停留时间以 $\\log t$ 的量级增长，并且归一化后不收敛到常数。（书中 §7.6 · Thm 7.23 · p.205）" },
  { id: "sc-r7-1", ch: 8, cat: "§8.2 Lipschitz 假设的局部化", q: "若只要求 $\\sigma,b$ 在每个紧集上关于 $x$ Lipschitz（常数可依赖于紧集），书中指出为保证解不爆炸还需保留什么条件？", opts: ["线性增长：$|\\sigma(t,x)|,|b(t,x)|\\le K(1+|x|)$", "二次增长：$|\\sigma|,|b|\\le K(1+|x|^2)$", "一致非退化：$\\sigma\\sigma^*\\ge\\varepsilon I$", "$b$ 关于时间 $t$ 也 Lipschitz"], a: 0, hint: "想想常微分方程 $y'=y^2$ 为什么会在有限时间爆炸。",
    exp: "局部 Lipschitz 只保证局部存在唯一，需要线性增长条件防止有限时间爆炸，这与 ODE 情形相同。二次增长允许 $y'=y^2$ 这类爆炸；非退化性和时间正则性与爆炸无关。（书中 §8.2 · Thm 8.3 后注记 · p.212–213）" },
  { id: "sc-r7-2", ch: 8, cat: "Lemma 8.4 Gronwall 引理", q: "设 $g\\ge0$ 在 $[0,T]$ 上有界可测，且 $g(t)\\le a+b\\int_0^t g(s)\\,ds$（$a,b\\ge0$）。Gronwall 引理给出：", opts: ["$g(t)\\le a\\,e^{bt}$", "$g(t)\\le a(1+bt)$", "$g(t)\\le a+e^{bt}$", "$g(t)\\le a\\,e^{bt^2/2}$"], a: 0, hint: "把条件反复代入自身迭代，看出现的级数。",
    exp: "迭代得 $g(t)\\le a\\sum_{k\\le n}(bt)^k/k!+$余项，余项由有界性趋于 0，故 $g\\le ae^{bt}$。取 $g(t)=ae^{bt}$（等号情形）即可否定其余三个更强或不可比的界。（书中 §8.2 · Lemma 8.4 · p.213）" },
  { id: "sc-r7-3", ch: 8, cat: "§8.2 轨道唯一性的证明", q: "Thm 8.3 证明轨道唯一性时，先用 $\\tau=\\inf\\{t:|X_t|\\vee|X'_t|\\ge M\\}$ 停止两个解，再对 $E[(X_{t\\wedge\\tau}-X'_{t\\wedge\\tau})^2]$ 用 Gronwall。引入 $\\tau$ 的作用是：", opts: ["保证 $h$ 有界（$\\le 4M^2$），使引理可用", "使 $\\sigma,b$ 在停止后变为常数", "使 $X,X'$ 成为 $L^2$ 有界鞅", "使两解的初值相等"], a: 0, hint: "回看 Gronwall 引理对 $g$ 的假设。",
    exp: "Gronwall 引理要求 $g$ 有界，停止在 $\\tau$ 后 $h\\le 4M^2$，得到 $h\\equiv0$，再令 $M\\to\\infty$。停时并不改变系数，也不让带漂移的 $X$ 变成鞅；初值相等是题设。（书中 §8.2 · Thm 8.3 证明 · p.213–214）" },
  { id: "sc-r7-4", ch: 8, cat: "§8.2 Picard 迭代", q: "Picard 迭代中 $g_n(t)=E[\\sup_{s\\le t}|X^n_s-X^{n-1}_s|^2]$ 满足 $g_{n+1}(t)\\le C_T\\int_0^t g_n(u)\\,du$。由此推出：", opts: ["$\\sum_n g_n(T)^{1/2}<\\infty$，$X^n$ 在 $[0,T]$ 上 a.s. 一致收敛", "$g_n(T)$ 有界，但 $\\sum_n g_n(T)^{1/2}$ 可能发散", "只有 $T$ 足够小时 $X^n$ 才收敛", "$X^n$ 只在 $L^2$ 中逐点收敛，极限可能不连续"], a: 0, hint: "对 $n$ 归纳，每一步积分会带出一个 $1/n$ 因子。",
    exp: "归纳得 $g_n(t)\\le C'_T C_T^{n-1}t^{n-1}/(n-1)!$，对任意 $T$ 都可求和，于是 $\\sum_n\\sup_{t\\le T}|X^{n+1}_t-X^n_t|<\\infty$ a.s.，$X^n$ 一致收敛到连续过程。（书中 §8.2 · Thm 8.3 证明 (8.1) · p.215）" },
  { id: "sc-r7-5", ch: 8, cat: "Thm 8.5 解映射 $F_x$", q: "Thm 8.5 给出可测映射 $F_x:C(\\mathbb R_+,\\mathbb R^m)\\to C(\\mathbb R_+,\\mathbb R^d)$，使在任何空间上 $F_x(B)$ 是 $E_x(\\sigma,b)$ 的唯一解。由此直接得到：", opts: ["弱唯一性：解的分布是 $W$ 在 $F_x$ 下的像", "$w\\mapsto F_x(w)$ 是连续映射", "解的分布不依赖于初值 $x$", "解总是 $(\\mathcal F_t)$-鞅"], a: 0, hint: "任何解都形如 $F_x(B)$，而 $B$ 的分布总是什么？",
    exp: "任意解等于 $F_x(B)$，$B$ 的分布是 Wiener 测度 $W$，所以解的分布被唯一确定。$F_x$ 关于 $w$ 只是可测（连续性是关于 $x$ 的）；有漂移时解一般不是鞅。（书中 §8.2 · Thm 8.5 · p.216）" },
  { id: "sc-r7-6", ch: 8, cat: "§8.2 对初值的依赖", q: "在 Lipschitz 情形下可选取解使 $x\\mapsto X^x(\\omega)$ 连续。对 $|x|,|y|\\le A$，书中得到的路径估计 $\\sup_{t\\le T}|X^x_t-X^y_t|\\le$", opts: ["$C_{\\varepsilon,A,T}(\\omega)|x-y|^{1-\\varepsilon}$，$\\varepsilon\\in(0,1)$", "$C_{\\varepsilon,A,T}(\\omega)|x-y|^{1+\\varepsilon}$", "$C_{A,T}(\\omega)|x-y|^{2}$", "没有路径估计，只有 $L^p$ 估计"], a: 0, hint: "由 $E[\\sup|X^x-X^y|^p]\\le C_p|x-y|^p$ 加 Kolmogorov 引理，$p$ 可任意大。",
    exp: "对所有 $p$ 有 $E[d(X^x,X^y)^p]\\le \\bar C_p|x-y|^p$，Kolmogorov 引理给出任意阶 $<1$ 的 Hölder 连续修正。指数 $>1$ 会迫使 $X^x$ 与 $x$ 无关，显然不对。（书中 §8.2 · Thm 8.5 后讨论 · p.220）" },
  { id: "sc-r7-7", ch: 8, cat: "Thm 8.6 马氏性的证明", q: "证明 $E[f(X_{s+t})\\mid\\mathcal F_s]=Q_tf(X_s)$ 时，把 $X'_t=X_{s+t}$ 看作初值为 $X_s$ 的解，驱动它的布朗运动和滤子是：", opts: ["$B_{s+t}-B_s$，滤子 $(\\mathcal F_{s+t})_{t\\ge0}$", "$B_{s+t}$，滤子 $(\\mathcal F_{s+t})_{t\\ge0}$", "$B_{s+t}-B_s$，滤子 $(\\mathcal F_t)_{t\\ge0}$", "$B_t$，滤子 $(\\mathcal F_t)_{t\\ge0}$"], a: 0, hint: "定义里的布朗运动要从 0 出发，并且 $X'$ 要对滤子适应。",
    exp: "$B'_t=B_{s+t}-B_s$ 是从 0 出发的 $(\\mathcal F_{s+t})$-布朗运动且与 $\\mathcal F_s$ 独立，$X'$ 关于 $(\\mathcal F_{s+t})$ 适应，故 $X'=F_{X_s}(B')$。$B_{s+t}$ 不从 0 出发；$X_{s+t}$ 不对 $(\\mathcal F_t)$ 适应。（书中 §8.3 · Thm 8.6 · p.221–222）" },
  { id: "sc-r7-8", ch: 8, cat: "Cor 8.8 强马氏性", q: "Lipschitz 齐次情形下，SDE 的解满足强马氏性（Cor 8.8）。书中给出的最直接理由是：", opts: ["半群是 Feller 的且轨道连续，套用 Thm 6.17", "由 Blumenthal 0-1 律", "用 Girsanov 定理化为布朗运动", "由 Yamada–Watanabe 定理"], a: 0, hint: "第 6 章对哪类马氏过程证明了强马氏性？",
    exp: "Thm 8.7 说明 $(Q_t)$ 是 Feller 半群，而解有连续（故右连续）轨道，于是第 6 章关于 Feller 过程的强马氏性定理直接适用。也可仿照 Thm 8.6 的证明用布朗运动的强马氏性。（书中 §8.3 · Cor 8.8 · p.224）" },
  { id: "sc-r7-9", ch: 8, cat: "Thm 8.7 生成元计算", q: "设 $B=(B^1,B^2)$ 为二维布朗运动，$dX_t=dB^1_t+X_t\\,dB^2_t-X_t\\,dt$（一维）。对 $f\\in C_c^2(\\mathbb R)$，生成元 $Lf(x)=$", opts: ["$\\tfrac12(1+x^2)f''(x)-xf'(x)$", "$\\tfrac12(1+x)^2f''(x)-xf'(x)$", "$(1+x^2)f''(x)-xf'(x)$", "$\\tfrac12(1+x^2)f''(x)+xf'(x)$"], a: 0, hint: "这里 $\\sigma(x)=(1,\\ x)$ 是 $1\\times2$ 矩阵，先算 $\\sigma\\sigma^*$。",
    exp: "$\\sigma\\sigma^*(x)=1+x^2$，$b(x)=-x$，代入 $Lf=\\tfrac12\\sum(\\sigma\\sigma^*)_{ij}\\partial_{ij}f+\\sum b_i\\partial_if$。两个独立噪声的方差相加而不是系数相加，故不是 $(1+x)^2$。（书中 §8.3 · Thm 8.7 · p.222）" },
  { id: "sc-r7-10", ch: 8, cat: "Thm 8.7 Feller 性与生成元", q: "关于 Lipschitz 齐次情形的 Thm 8.7，下列哪项**不**成立？", opts: ["它完整刻画了生成元的定义域 $D(L)$", "$(Q_t)$ 是 Feller 半群", "$C_c^2(\\mathbb R^d)\\subset D(L)$", "在 $C_c^2$ 上 $L$ 是二阶微分算子"], a: 0, hint: "定理只说了 $L$ 在哪个函数类上的作用？",
    exp: "定理只给出 $C_c^2\\subset D(L)$ 及 $L$ 在其上的表达式，书中明确指出这并未完整描述 $D(L)$（完整刻画通常很难，鞅问题理论正是利用部分信息来确定分布）。（书中 §8.3 · Thm 8.7 · p.222–225）" },
  { id: "sc-r7-11", ch: 8, cat: "§8.4.1 Ornstein–Uhlenbeck 过程", q: "设 $\\lambda>0$，$X$ 解 $dX_t=dB_t-\\lambda X_t\\,dt$，$X_0=x$（确定）。则 $\\mathrm{Var}(X_t)=$", opts: ["$\\dfrac{1-e^{-2\\lambda t}}{2\\lambda}$", "$\\dfrac{1-e^{-\\lambda t}}{\\lambda}$", "$\\dfrac{1}{2\\lambda}$", "$t$"], a: 0, hint: "$X_t-xe^{-\\lambda t}$ 是 Wiener 积分，用 Itô 等距。",
    exp: "$\\mathrm{Var}(X_t)=\\int_0^t e^{-2\\lambda(t-s)}ds=(1-e^{-2\\lambda t})/(2\\lambda)$，即协方差 $K(t,t)$。$1/(2\\lambda)$ 只是 $t\\to\\infty$ 的极限（平稳初值 $\\mathcal N(0,1/(2\\lambda))$ 时才恒等于它）。（书中 §8.4.1 · p.225–226）" },
  { id: "sc-r7-12", ch: 8, cat: "§8.4.2 几何布朗运动", q: "设 $\\sigma>0,r\\in\\mathbb R$，$X_0>0$，$dX_t=\\sigma X_t\\,dB_t+rX_t\\,dt$ 的解是：", opts: ["$X_0\\exp(\\sigma B_t+(r-\\sigma^2/2)t)$", "$X_0\\exp(\\sigma B_t+(r+\\sigma^2/2)t)$", "$X_0\\exp(\\sigma B_t+rt)$", "$X_0\\exp(\\sigma B_t+(r-\\sigma^2)t)$"], a: 0, hint: "对 $\\log X_t$ 用 Itô 公式，注意二阶项。",
    exp: "$d\\log X_t=\\sigma dB_t+(r-\\sigma^2/2)dt$，修正项 $-\\sigma^2/2$ 来自 $-\\tfrac12X_t^{-2}d\\langle X\\rangle_t$。特别地 $X_0>0$ 时解恒正。（书中 §8.4.2 · p.226）" },
  { id: "sc-r7-13", ch: 8, cat: "§8.4.3 平方 Bessel 过程", q: "设 $\\beta$ 为 $d$ 维布朗运动，$X_t=|\\beta_t|^2$。则 $X$ 满足（$B$ 为某个一维布朗运动）：", opts: ["$dX_t=2\\sqrt{X_t}\\,dB_t+d\\,dt$", "$dX_t=2\\sqrt{X_t}\\,dB_t+\\tfrac d2\\,dt$", "$dX_t=\\sqrt{X_t}\\,dB_t+d\\,dt$", "$dX_t=2\\sqrt{X_t}\\,dB_t$"], a: 0, hint: "$d|\\beta|^2=2\\sum_i\\beta^i d\\beta^i+(\\ ?\\ )dt$，鞅部分的二次变差是多少？",
    exp: "Itô 公式给出 $d|\\beta_t|^2=2\\sum\\beta^i_td\\beta^i_t+d\\,dt$，鞅部分二次变差为 $4|\\beta_t|^2dt$，可写成 $2\\sqrt{X_t}dB_t$。故 $|\\beta|^2$ 是 $d$ 维平方 Bessel 过程。（书中 §8.4.3 · (8.5) · p.227）" },
  { id: "sc-r7-14", ch: 8, cat: "§8.4.3 Bessel 过程的击中概率", q: "设 $X$ 为 $m$ 维平方 Bessel 过程，$m>2$，$X_0=x>0$。对 $0<\\varepsilon<x$，$P(T_\\varepsilon<\\infty)=$", opts: ["$(\\varepsilon/x)^{m/2-1}$", "$(\\varepsilon/x)^{m-2}$", "$(\\varepsilon/x)^{m/2}$", "$1$"], a: 0, hint: "$X_t^{1-m/2}$ 是局部鞅；先算 $P(T_\\varepsilon<T_A)$ 再令 $A\\to\\infty$。",
    exp: "可选停止给 $P(T_\\varepsilon<T_A)=(A^{1-m/2}-x^{1-m/2})/(A^{1-m/2}-\\varepsilon^{1-m/2})$，$A\\to\\infty$ 得 $(\\varepsilon/x)^{m/2-1}$。$m=2$ 时由 $\\log X$ 得概率为 $1$；$m=d$ 时与 $d$ 维布朗运动的结果一致（$|\\beta|^2$ 碰到 $\\varepsilon$ 即 $|\\beta|$ 碰到 $\\sqrt\\varepsilon$）。（书中 §8.4.3 · p.227–228）" },
  { id: "sc-r7-15", ch: 8, cat: "Ex 8.14 一维轨道唯一性", q: "对一维方程 $dX_t=\\sigma(X_t)dB_t+b(X_t)dt$，Exercise 8.14 在下列哪个条件下证明了轨道唯一性？", opts: ["$|\\sigma(x)-\\sigma(y)|\\le K\\sqrt{|x-y|}$，$b$ Lipschitz", "$\\sigma$ Lipschitz，$|b(x)-b(y)|\\le K\\sqrt{|x-y|}$", "$\\sigma,b$ 都是 $\\tfrac12$-Hölder", "$\\sigma,b$ 有界连续即可"], a: 0, hint: "想想平方 Bessel 方程的系数 $2\\sqrt x$ 满足什么条件。",
    exp: "扩散系数可以放宽到 $\\tfrac12$-Hölder，但漂移仍需 Lipschitz，以便最后用 Gronwall 引理；该判别法适用于平方 Bessel 方程。仅有界连续不够：如 $\\sigma(x)=|x|^{\\alpha}\\wedge1$（$\\alpha<\\tfrac12$）、$b=0$、从 0 出发时轨道唯一性失败。（书中 Exercises · Ex 8.14 · p.231–232）" },
  { id: "sc-r7-16", ch: 8, cat: "Ex 8.10 尺度函数", q: "设 $\\sigma\\ge\\varepsilon>0$，$\\sigma,b$ 有界连续且 $\\int|b|<\\infty$，$X$ 解 $dX=\\sigma(X)dB+b(X)dt$。使 $F(X_t)$ 为鞅的递增 $C^2$ 函数 $F$ 满足 $F'(x)=$", opts: ["$\\exp\\left(-\\int_0^x \\frac{2b(y)}{\\sigma(y)^2}dy\\right)$", "$\\exp\\left(\\int_0^x \\frac{2b(y)}{\\sigma(y)^2}dy\\right)$", "$\\exp\\left(-\\int_0^x \\frac{b(y)}{\\sigma(y)^2}dy\\right)$", "$\\exp\\left(-\\int_0^x \\frac{2b(y)}{\\sigma(y)}dy\\right)$"], a: 0, hint: "要求 $F(X)$ 的 $dt$ 项为零：$\\tfrac12\\sigma^2F''+bF'=0$。",
    exp: "由 Itô 公式，$F(X)$ 为局部鞅当且仅当 $\\tfrac12\\sigma^2F''+bF'=0$，解得 $F'=\\exp(-\\int 2b/\\sigma^2)$；由条件 $F'$ 有界且有正下界，$F(X)$ 是真鞅。（书中 Exercises · Ex 8.10 · p.229）" },
  { id: "sc-r7-17", ch: 9, cat: "Prop 9.1 凸函数与半鞅", q: "设 $f$ 凸，$X$ 为连续半鞅，命题 9.1 给出 $f(X_t)=f(X_0)+\\int_0^t f'_-(X_s)\\,dX_s+A^f_t$（$A^f$ 递增）。下列哪项正确？", opts: ["把 $f'_-$ 换成 $f'_+$ 也有类似分解，但递增过程一般不同", "把 $f'_-$ 换成 $f'_+$ 后递增过程总不变", "只有 $f\\in C^2$ 时 $f(X)$ 才是半鞅", "$A^f$ 一般不连续，只是 càdlàg"], a: 0, hint: "比较 $f'_+$ 与 $f'_-$ 只在可数个点上不同，而 $X$ 可能在这些点上停留并带有漂移。",
    exp: "书中注记：用右导数 $f'_+$ 也可得分解 $f(X_t)=f(X_0)+\\int f'_+(X_s)dX_s+\\tilde A^f_t$，但一般 $\\tilde A^f\\ne A^f$；$f\\in C^2$ 时两者都等于 $\\tfrac12\\int f''(X_s)d\\langle X,X\\rangle_s$。$f$ 凸（或凸函数之差）即可保证 $f(X)$ 为半鞅，且 $A^f$ 是连续递增过程。（书中 §9.1 · Prop 9.1 · p.236）" },
  { id: "sc-r7-18", ch: 9, cat: "§9.1 Tanaka 公式的约定", q: "在 Le Gall 的 Tanaka 公式 $|X_t-a|=|X_0-a|+\\int_0^t\\mathrm{sgn}(X_s-a)\\,dX_s+L^a_t(X)$ 中，$\\mathrm{sgn}(0)$ 取为：", opts: ["$-1$", "$+1$", "$0$", "任意取值，结果都一样"], a: 0, hint: "Tanaka 公式由命题 9.1 对 $f(x)=|x-a|$ 得到，其中用的是哪一侧导数？",
    exp: "命题 9.1 用左导数，而 $|x-a|$ 在 $x=a$ 处的左导数为 $-1$，故 $\\mathrm{sgn}(x)=\\mathbf 1_{\\{x>0\\}}-\\mathbf 1_{\\{x\\le0\\}}$。书中强调这一约定很重要：当 $\\int\\mathbf 1_{\\{X_s=a\\}}dV_s\\ne0$ 时，取值不同会改变 $L^a$。（书中 §9.1 · Prop 9.2 · p.237）" },
  { id: "sc-r7-19", ch: 9, cat: "§9.1 局部时的期望", q: "设 $B$ 为从 0 出发的布朗运动，则 $E[L^0_t(B)]=$", opts: ["$\\sqrt{2t/\\pi}$", "$\\sqrt{t/(2\\pi)}$", "$\\sqrt t$", "$t$"], a: 0, hint: "对 Tanaka 公式 $|B_t|=\\int_0^t\\mathrm{sgn}(B_s)dB_s+L^0_t$ 取期望。",
    exp: "随机积分的被积函数有界，是真鞅，期望为 0，所以 $E[L^0_t]=E|B_t|=\\sqrt{2t/\\pi}$。这也与 $L^0_t\\overset{d}{=}|B_t|$ 一致。（书中 §9.1 · Prop 9.2 · p.237）" },
  { id: "sc-r7-20", ch: 9, cat: "Prop 9.3 局部时的关键性质", q: "设 $X$ 为连续半鞅，$a\\in\\mathbb R$。关于随机测度 $d_sL^a_s(X)$，命题 9.3 断言几乎必然：", opts: ["它支撑在 $\\{s\\ge0:X_s=a\\}$ 上", "它的支撑恰好等于 $\\{s\\ge0:X_s=a\\}$", "它关于 Lebesgue 测度绝对连续", "它支撑在 $\\{s\\ge0:X_s\\ne a\\}$ 上"], a: 0, hint: "证明中把 Itô 公式用于 $|X_t-a|^2$，得到 $\\int_0^t|X_s-a|\\,d_sL^a_s=0$。",
    exp: "由 $\\int_0^t|X_s-a|\\,d_sL^a_s(X)=0$ 知 $L^a$ 只在 $X=a$ 时增长。一般只有包含关系：如 $X\\equiv a$ 时 $L^a=0$。对布朗运动，零点集的 Lebesgue 测度为 0 而 $L^0$ 会增长，所以不可能绝对连续。（书中 §9.1 · Prop 9.3 · p.238）" },
  { id: "sc-r7-21", ch: 9, cat: "Thm 9.12 支撑与水平集", q: "设 $B$ 为从 0 出发的布朗运动。关于 $\\mathrm{supp}(d_sL^a_s(B))\\subset\\{s:B_s=a\\}$ 何时取等号，下列哪项正确？", opts: ["每个固定 $a$ 下 a.s. 取等号，但 a.s. 存在某个 $a$ 不取等号", "a.s. 对所有 $a\\in\\mathbb R$ 同时取等号", "对每个 $a\\ne0$，a.s. 是严格包含", "只有 $a=0$ 时才 a.s. 取等号"], a: 0, hint: "考虑 $a=\\max_{[0,1]}B$ 这个随机水平。",
    exp: "定理 9.12：对每个固定的 $a$，包含关系 a.s. 取等号（证明用到强马氏性和 Blumenthal 0-1 律）。但习题 9.20 指出：取 $a$ 为 $B$ 在 $[0,1]$ 上的最大值，等号不成立，所以“对所有 $a$ 同时取等号”是错的。（书中 §9.4 · Thm 9.12 · p.249–250；Ex 9.20）" },
  { id: "sc-r7-22", ch: 9, cat: "Thm 9.4 关于空间变量的正则性", q: "设 $X=M+V$ 为连续半鞅。在局部时的 càdlàg 修正下，$L^a_t(X)-L^{a-}_t(X)=$", opts: ["$2\\int_0^t\\mathbf 1_{\\{X_s=a\\}}\\,dV_s$", "$\\int_0^t\\mathbf 1_{\\{X_s=a\\}}\\,dV_s$", "$2\\int_0^t\\mathbf 1_{\\{X_s=a\\}}\\,dM_s$", "$2\\int_0^t\\mathbf 1_{\\{X_s=a\\}}\\,d\\langle M,M\\rangle_s$"], a: 0, hint: "在 Tanaka 公式 (9.6) 中，含 $\\mathbf 1_{\\{X_s>a\\}}$ 的哪一项在 $a$ 处可能不连续？",
    exp: "定理 9.4 (9.8)：跃度为 $2\\int_0^t\\mathbf 1_{\\{X_s=a\\}}dV_s$。鞅部分 $\\int\\mathbf 1_{\\{X_s>a\\}}dM_s$ 关于 $a$ 有连续修正，而且 $\\int\\mathbf 1_{\\{X_s=a\\}}dM_s=0$、$\\int\\mathbf 1_{\\{X_s=a\\}}d\\langle M,M\\rangle_s=0$，所以后两个选项都是 0。特别地，连续局部鞅的局部时关于 $(a,t)$ 联合连续。（书中 §9.2 · Thm 9.4 · p.239）" },
  { id: "sc-r7-23", ch: 9, cat: "§9.2 $|X|$ 的局部时", q: "设 $B$ 为布朗运动，$W=|B|$。则 $L^0_t(W)=$", opts: ["$2L^0_t(B)$", "$L^0_t(B)$", "$\\tfrac12L^0_t(B)$", "$0$"], a: 0, hint: "一般地 $L^0_t(|X|)=L^0_t(X)+L^{0-}_t(X)$；布朗运动的局部时关于 $a$ 连续。",
    exp: "书中定理 9.4 后的注记给出 $L^0_t(|X|)=L^0_t(X)+L^{0-}_t(X)$。对 $B$，$a\\mapsto L^a_t(B)$ 连续，所以 $L^{0-}_t(B)=L^0_t(B)$，得 $L^0_t(|B|)=2L^0_t(B)$。另一方面 $L^{0-}_t(W)=0$，所以 $W$ 的局部时在 $a=0$ 处有跳。（书中 §9.2 · Thm 9.4 后注记 · p.243）" },
  { id: "sc-r7-24", ch: 9, cat: "Thm 9.6 广义 Itô 公式", q: "取 $f(x)=|x-1|+|x+1|$。由广义 Itô 公式，$f(X_t)-f(X_0)-\\int_0^t f'_-(X_s)\\,dX_s=$", opts: ["$L^1_t(X)+L^{-1}_t(X)$", "$\\tfrac12\\big(L^1_t(X)+L^{-1}_t(X)\\big)$", "$2\\big(L^1_t(X)+L^{-1}_t(X)\\big)$", "$L^0_t(X)$"], a: 0, hint: "先求分布意义下的二阶导数 $f''(da)$，再代入 $\\tfrac12\\int L^a_t\\,f''(da)$。",
    exp: "$f'_-$ 在 $\\pm1$ 处各跳 2，所以 $f''(da)=2\\delta_1+2\\delta_{-1}$，于是 $\\tfrac12\\int L^a_t f''(da)=L^1_t+L^{-1}_t$。这与把 Tanaka 公式 (9.5) 分别用于 $a=\\pm1$ 再相加的结果一致。（书中 §9.2 · Thm 9.6 · p.244）" },
  { id: "sc-r7-25", ch: 9, cat: "Cor 9.8 有限变差过程", q: "若 $X_t=X_0+V_t$，其中 $V$ 为连续有限变差过程，则：", opts: ["对所有 $a\\in\\mathbb R$、$t\\ge0$ 都有 $L^a_t(X)=0$", "$L^{X_0}_t(X)=\\int_0^t|dV_s|$", "只有 $V$ 单调时局部时才为 0", "局部时一般不为 0，但关于 $a$ 连续"], a: 0, hint: "在占位密度公式中，$\\langle X,X\\rangle$ 等于多少？",
    exp: "推论 9.8：因为 $\\langle X,X\\rangle=0$，占位密度公式给出 $\\int\\varphi(a)L^a_t(X)da=0$ 对所有 $\\varphi\\ge0$ 成立，再由 càdlàg 性得 $L^a_t\\equiv0$。这和 $V$ 是否单调无关。（书中 §9.2 · Cor 9.8 · p.247）" },
  { id: "sc-r7-26", ch: 9, cat: "§9.2 水平集上的积分", q: "设 $X=M+V$ 为连续半鞅，$b\\in\\mathbb R$ 固定。下列哪项一定成立？", opts: ["$\\int_0^t\\mathbf 1_{\\{X_s=b\\}}\\,d\\langle M,M\\rangle_s=0$ a.s.", "$\\int_0^t\\mathbf 1_{\\{X_s=b\\}}\\,dV_s=0$ a.s.", "$\\int_0^t\\mathbf 1_{\\{X_s=b\\}}\\,d\\langle M,M\\rangle_s=L^b_t(X)$", "$\\int_0^t\\mathbf 1_{\\{X_s=b\\}}\\,dM_s=L^b_t(X)$"], a: 0, hint: "用占位密度公式取 $\\varphi=\\mathbf 1_{\\{b\\}}$；另想想 $X=|B|$ 在 0 处的情形。",
    exp: "由占位密度公式，$\\int_0^t\\mathbf 1_{\\{X_s=b\\}}d\\langle M,M\\rangle_s=\\int\\mathbf 1_{\\{b\\}}(a)L^a_tda=0$，从而 $\\int\\mathbf 1_{\\{X_s=b\\}}dM_s=0$。但对漂移部分不一定为 0：例如 $X=|B|$ 时 $V=L^0(B)$，有 $\\int\\mathbf 1_{\\{X_s=0\\}}dV_s=L^0_t(B)$。这样的 $b$ 正是局部时关于 $a$ 的间断点。（书中 §9.2 · Cor 9.7 后 · p.246）" },
  { id: "sc-r7-27", ch: 9, cat: "Prop 9.9 局部时的逼近", q: "对一般连续半鞅 $X$，a.s. 对所有 $a,t$，$L^a_t(X)$ 等于（极限均为 $\\varepsilon\\to0$）：", opts: ["$\\lim\\tfrac1\\varepsilon\\int_0^t\\mathbf 1_{\\{a\\le X_s\\le a+\\varepsilon\\}}d\\langle X\\rangle_s$", "$\\lim\\tfrac1\\varepsilon\\int_0^t\\mathbf 1_{\\{a-\\varepsilon\\le X_s\\le a\\}}d\\langle X\\rangle_s$", "$\\lim\\tfrac1{2\\varepsilon}\\int_0^t\\mathbf 1_{\\{|X_s-a|\\le\\varepsilon\\}}d\\langle X\\rangle_s$", "$\\lim\\tfrac1\\varepsilon\\int_0^t\\mathbf 1_{\\{a\\le X_s\\le a+\\varepsilon\\}}ds$"], a: 0, hint: "由占位密度公式，这些积分就是 $L^b_t$ 在某个区间上关于 $b$ 的平均；$a\\mapsto L^a_t$ 只是右连续。",
    exp: "$\\tfrac1\\varepsilon\\int_0^t\\mathbf 1_{\\{a\\le X_s\\le a+\\varepsilon\\}}d\\langle X\\rangle_s=\\tfrac1\\varepsilon\\int_a^{a+\\varepsilon}L^b_tdb\\to L^a_t$（右连续）。左侧窗口给出 $L^{a-}_t$，对称窗口给出对称局部时 $\\tfrac12(L^a_t+L^{a-}_t)$，两者一般都不等于 $L^a_t$。用 $ds$ 代替 $d\\langle X\\rangle$ 只在 $\\langle X\\rangle_t=t$ 时才对。（书中 §9.3 · Prop 9.9 · p.247）" },
  { id: "sc-r7-28", ch: 9, cat: "Prop 9.11 上穿次数", q: "设 $N^X_\\varepsilon(t)$ 为 $t$ 之前 $X$ 上穿 $[0,\\varepsilon]$ 的次数。当 $\\varepsilon\\to0$ 时，$\\varepsilon N^X_\\varepsilon(t)$ 依概率收敛到：", opts: ["$\\tfrac12L^0_t(X)$", "$L^0_t(X)$", "$2L^0_t(X)$", "$0$"], a: 0, hint: "把 Tanaka 公式 (9.6) 用在每段上穿上：$(X)^+$ 每次增加 $\\varepsilon$，而局部时项带系数 $\\tfrac12$。",
    exp: "命题 9.11：在每个 $[\\sigma_n,\\tau_n]$ 上，$(X^+)$ 的增量为 $\\varepsilon$，等于随机积分项加上 $\\tfrac12$ 乘以 $L^0$ 的增量。对 $n$ 求和后随机积分项趋于 0，所以 $\\varepsilon N_\\varepsilon\\to\\tfrac12L^0_t$。（书中 §9.3 · Prop 9.11 · p.248）" },
  { id: "sc-r7-29", ch: 9, cat: "Prop 9.13 击中时刻处的局部时", q: "设 $B$ 为从 0 出发的布朗运动，$a\\ne0$，$T_a=\\inf\\{t:B_t=a\\}$。则 $L^0_{T_a}(B)$ 服从：", opts: ["均值为 $2|a|$ 的指数分布", "均值为 $|a|$ 的指数分布", "均值为 $a^2$ 的指数分布", "退化分布，恒等于 $2|a|$"], a: 0, hint: "无记忆性来自在 $\\inf\\{t:L^0_t\\ge s\\}$ 处用强马氏性；均值由 Tanaka 公式 (9.6) 求出。",
    exp: "命题 9.13(i)：强马氏性给出无记忆性，所以是指数分布。由 (9.6)，$\\tfrac12E[L^0_{T_1}]=E[(B_{T_1})^+]=1$，所以均值为 2，再用尺度变换得 $2|a|$。均值 $a$ 的是 $|B|$ 首次到达 $a$ 的时刻 $U_a$ 处的情形 (ii)。（书中 §9.4 · Prop 9.13 · p.251）" },
  { id: "sc-r7-30", ch: 9, cat: "Thm 9.14 证明中的 Skorokhod 引理", q: "令 $\\beta_t=\\int_0^t\\mathrm{sgn}(B_s)\\,dB_s$，于是 $|B_t|=\\beta_t+L^0_t(B)$。Lévy 定理的证明表明 a.s. $L^0_t(B)=$", opts: ["$\\sup_{s\\le t}(-\\beta_s)$", "$\\sup_{s\\le t}\\beta_s$", "$\\sup_{s\\le t}|\\beta_s|$", "$-\\beta_t$"], a: 0, hint: "$L^0$ 递增且只在 $|B|=0$ 时增长；考虑 $t$ 之前 $B$ 的最后一个零点。",
    exp: "由 $|B_s|\\ge0$ 得 $L^0_t\\ge L^0_s\\ge-\\beta_s$，所以 $L^0_t\\ge\\sup_{s\\le t}(-\\beta_s)$；在 $t$ 前最后一个零点处 $L^0$ 不再增长，可得等号。由于 $-\\beta$ 是布朗运动，$(L^0,|B|)=(\\sup(-\\beta),\\sup(-\\beta)+\\beta)$ 推出 Lévy 定理。$\\sup_{s\\le t}\\beta_s$ 只是与之同分布，并不 a.s. 相等。（书中 §9.4 · Thm 9.14 · p.252）" },
  { id: "sc-r7-31", ch: 9, cat: "§9.4 逆局部时", q: "设 $\\tau_s=\\inf\\{t\\ge0:L^0_t(B)>s\\}$。对 $\\lambda>0$，过程 $(\\tau_{\\lambda s})_{s\\ge0}$ 与哪个过程同分布？", opts: ["$(\\lambda^2\\tau_s)_{s\\ge0}$", "$(\\lambda\\tau_s)_{s\\ge0}$", "$(\\sqrt\\lambda\\,\\tau_s)_{s\\ge0}$", "$(\\lambda^{-2}\\tau_s)_{s\\ge0}$"], a: 0, hint: "布朗尺度变换下 $L^0_{c t}\\overset{d}{=}\\sqrt c\\,L^0_t$。",
    exp: "由 $L^0_{\\lambda^2u}\\overset{d}{=}\\lambda L^0_u$（过程意义）得 $\\tau_{\\lambda s}\\overset{d}{=}\\lambda^2\\tau_s$。再加上平稳独立增量，$\\tau$ 是指标为 $1/2$ 的稳定从属子，与 $(\\tilde T_s)$（首次超过 $s$ 的时刻）同分布。（书中 §9.4 · p.253）" },
  { id: "sc-r7-32", ch: 9, cat: "Prop 9.15 零点集与游程区间", q: "设 $\\tau_s=\\inf\\{t:L^0_t(B)>s\\}$，$D$ 为 $s\\mapsto\\tau_s$ 的跳跃时刻集。$\\{t\\ge0:B_t\\ne0\\}$ 的连通分支恰为：", opts: ["开区间 $(\\tau_{s-},\\tau_s)$，$s\\in D$", "闭区间 $[\\tau_{s-},\\tau_s]$，$s\\in D$", "开区间 $(\\tau_{s-},\\tau_s)$，$s\\in\\mathbb Q_+$", "开区间 $(\\tau_s,\\tau_{s+1})$，$s\\in\\mathbb N$"], a: 0, hint: "零点集的点要么是某个 $\\tau_s$，要么是跳跃处的左极限 $\\tau_{s-}$；问题是哪些点会落在 $[\\tau_{s-},\\tau_s)$ 内部。",
    exp: "由命题 9.15，零点集由所有 $\\tau_s$ 和所有 $\\tau_{s-}$（$s\\in D$）组成，所以补集的分支是游程区间 $(\\tau_{s-},\\tau_s)$，$s\\in D$。区间端点是零点，所以不是闭区间。对固定的有理数 $s$，a.s. $\\tau_{s-}=\\tau_s$；而 $(\\tau_s,\\tau_{s+1})$ 内含有零点。（书中 §9.4 · Prop 9.15 · p.253）" },
  { id: "p1-r1-1", ch: 31, cat: "§1.1 代数与 σ-代数", q: "在 $\\mathbb{R}$ 上，令 $\\mathcal{A}$ 为形如 $]a,b]$（$-\\infty\\le a\\le b\\le+\\infty$）的区间的有限并全体。则 $\\mathcal{A}$", opts: ["是代数，但不是 $\\sigma$-代数", "是 $\\sigma$-代数", "对补集不封闭，故不是代数", "对有限交不封闭，故不是代数"], a: 0, hint: "考虑可数个这种区间的递增并，例如 $]0,1-1/n]$。",
    exp: "$]a,b]$ 型区间有限并的补仍是此类有限并，且对有限并封闭，故是代数（从而对有限交也封闭）；但 $\\bigcup_n\\,]0,1-1/n]=\\,]0,1[$ 不能写成 $]a,b]$ 型区间的有限并，所以不是 $\\sigma$-代数。（书中 §1.1 · Example 1.1.20 · p.9）" },
  { id: "p1-r1-2", ch: 31, cat: "Prop 1.1.32 测度的连续性", q: "设 $\\mu$ 是 $(\\Omega,\\mathcal{F})$ 上的测度（可取 $+\\infty$）。下列哪条**不**一定成立？", opts: ["若 $B_n\\searrow B$，则 $\\mu(B_n)\\to\\mu(B)$", "若 $A_n\\nearrow A$，则 $\\mu(A_n)\\to\\mu(A)$", "若 $A\\subseteq\\bigcup_n A_n$，则 $\\mu(A)\\le\\sum_n\\mu(A_n)$", "若 $A\\subseteq B$，$\\mu(A)<\\infty$，则 $\\mu(B\\setminus A)=\\mu(B)-\\mu(A)$"], a: 0, hint: "在 $\\mathbb{N}$ 上的计数测度下考虑尾集 $\\{k\\ge n\\}$。",
    exp: "从上连续需要附加条件 $\\mu(B_1)<\\infty$：计数测度下 $B_n=\\{k\\ge n\\}$ 满足 $\\mu(B_n)=\\infty$，而 $\\bigcap_n B_n=\\emptyset$。从下连续、$\\sigma$-次可加性和有限测度时的减法公式对任意测度都成立。（书中 §1.1 · Prop 1.1.32 · p.14）" },
  { id: "p1-r1-3", ch: 31, cat: "Prop 1.1.32 测度的连续性", q: "设 $\\mu$ 是代数 $\\mathcal{A}$ 上的可加函数，$\\mu(\\Omega)$ 可能为 $+\\infty$。下列哪个条件**不**足以推出 $\\mu$ 是 $\\sigma$-可加的？", opts: ["从上连续（对 $\\mu(B_1)<\\infty$ 的 $B_n\\searrow B$）", "$\\sigma$-次可加", "从下连续", "$\\mu(\\Omega)<\\infty$ 且从上连续"], a: 0, hint: "在 $\\mathbb{N}$ 的有限集与余有限集构成的代数上，找一个只取 $0$ 和 $+\\infty$ 的可加函数。",
    exp: "$\\sigma$-可加、$\\sigma$-次可加、从下连续三者对可加函数等价，且 $\\mu(\\Omega)<\\infty$ 时从上连续也与它们等价。反例：在 $\\mathbb{N}$ 的有限集/余有限集代数上令有限集取 $0$、余有限集取 $+\\infty$，它是可加的，且从上连续（$\\mu(B_1)<\\infty$ 迫使 $B_n$ 都是有限集），但 $\\mu(\\mathbb{N})=\\infty\\neq\\sum_n\\mu(\\{n\\})=0$。（书中 §1.1 · Prop 1.1.32 · p.14）" },
  { id: "p1-r1-4", ch: 31, cat: "§1.1 概率空间", q: "在离散概率空间 $(\\mathbb{N},\\mathcal{P}(\\mathbb{N}))$ 上，使所有单点 $\\{n\\}$ 概率相等的概率测度", opts: ["不存在", "存在且唯一：每个单点概率为 $0$", "存在：取 $P(A)$ 为 $A$ 的渐近密度", "存在，但只在 $\\mathbb{N}$ 的有限子集上有定义"], a: 0, hint: "设公共值为 $c$，用 $\\sigma$-可加性计算 $P(\\mathbb{N})$。",
    exp: "若 $P(\\{n\\})=c$，则由 $\\sigma$-可加性有 $P(\\mathbb{N})=\\sum_n c$，它等于 $0$（$c=0$）或 $+\\infty$（$c>0$），都不可能等于 $1$。渐近密度并非对所有子集都有定义，也不是 $\\sigma$-可加的。（书中 §1.1 · Remark 1.1.12 · p.6）" },
  { id: "p1-r1-5", ch: 31, cat: "§1.1 有限可加与 σ-可加", q: "Vitali 论证：$[0,1]$ 上不存在定义在全部子集上、平移（模 1）不变的概率测度。论证中导出矛盾的关键在于", opts: ["$\\sigma$-可加性：可数个等测度不交集的并的测度只能为 $0$ 或 $+\\infty$", "仅有限可加性就已足以导出矛盾", "代表元集 $A$ 是 Borel 集", "代表元集 $A$ 是可数集"], a: 0, hint: "$[0,1]$ 被分解成多少个代表元集 $A$ 的平移拷贝？",
    exp: "$[0,1]$ 是 $A$ 按有理数平移得到的可数个两两不交拷贝之并，若 $P$ 是 $\\sigma$-可加的且平移不变，则 $1=\\sum_q P(A)$，而这个和只能是 $0$ 或 $+\\infty$。矛盾来自可数可加性；代表元集 $A$ 是不可数的，也不是 Borel 集（它根本不可测）。（书中 §1.1 · Example 1.1.30 · p.13）" },
  { id: "p1-r1-6", ch: 31, cat: "§1.1 可忽略集", q: "在一般的（未必完备的）概率空间 $(\\Omega,\\mathcal{F},P)$ 中，下列哪项正确？", opts: ["可忽略集未必是事件，$P(N)$ 未必有定义", "可忽略集恰为概率为 $0$ 的事件", "空间是否完备只取决于 $\\mathcal{F}$，与 $P$ 无关", "几乎必然集的任何子集都是几乎必然集"], a: 0, hint: "回忆可忽略集的定义：$N$ 只需包含于某个零概率事件。",
    exp: "$N$ 可忽略是指 $N\\subseteq A$，其中 $A\\in\\mathcal{F}$ 且 $P(A)=0$；$N$ 本身可以不属于 $\\mathcal{F}$。只有在完备空间中，可忽略集才恰好是零概率事件。完备性依赖于 $P$（零概率集合由 $P$ 决定），而几乎必然集的子集甚至可以是空集。（书中 §1.1 · Def 1.1.16, 1.1.17 · p.8）" },
  { id: "p1-r1-7", ch: 31, cat: "§1.1 容斥公式", q: "在 $\\{1,2,3,4\\}$ 的全体置换上取均匀概率。随机置换至少有一个不动点的概率是", opts: ["$\\tfrac{5}{8}$", "$\\tfrac{3}{8}$", "$1-(3/4)^4$", "$\\tfrac{2}{3}$"], a: 0, hint: "令 $A_i=\\{\\omega(i)=i\\}$，对 $P(A_1\\cup\\cdots\\cup A_4)$ 用容斥公式，注意 $k$ 个指定点都固定的概率是 $(4-k)!/4!$。",
    exp: "容斥公式给出 $\\sum_{k=1}^4(-1)^{k-1}\\binom{4}{k}\\frac{(4-k)!}{4!}=1-\\tfrac12+\\tfrac16-\\tfrac1{24}=\\tfrac{15}{24}=\\tfrac58$。$\\tfrac38$ 是没有不动点（错排）的概率；$1-(3/4)^4$ 错误地把各事件 $A_i$ 当作独立。（书中 §1.1 · Remark 1.1.28 · p.12）" },
  { id: "p1-r1-8", ch: 31, cat: "§1.2 计数与补事件", q: "一年按 365 天、生日均匀且相互独立计。使“至少两人同一天生日”的概率超过 $1/2$ 的最小人数 $k$ 是", opts: ["$23$", "$183$", "$253$", "$32$"], a: 0, hint: "把生日看作从 365 个球中有放回地抽 $k$ 次，计算补事件“生日两两不同”的概率。",
    exp: "$P(A)=1-\\frac{365!}{(365-k)!\\,365^k}$，$k=22$ 时约为 $0.476$，$k=23$ 时约为 $0.507$。$253$ 对应的是另一个问题：其中有人与某个**指定**的人同一天生日的概率超过 $1/2$；$183$ 是“天数的一半”这一错误直觉。（书中 §1.2 · Example 1.2.20 · p.28）" },
  { id: "p1-r1-9", ch: 31, cat: "§1.1 离散概率空间", q: "在 $\\Omega=\\mathbb{N}=\\{1,2,\\dots\\}$ 上令 $P(\\{n\\})=\\frac{c}{n(n+1)}$ 定义离散概率。则 $P(\\{n\\ge 5\\})=$", opts: ["$\\tfrac{1}{5}$", "$\\tfrac{1}{6}$", "$\\tfrac{4}{5}$", "$\\tfrac{1}{30}$"], a: 0, hint: "先由总和为 $1$ 确定 $c$，再对 $\\frac{1}{n}-\\frac{1}{n+1}$ 进行裂项求和。",
    exp: "由 $\\sum_{n\\ge1}\\big(\\frac1n-\\frac1{n+1}\\big)=1$ 得 $c=1$；离散概率由各单点概率决定，$P(\\{n\\ge5\\})=\\sum_{n\\ge5}\\big(\\frac1n-\\frac1{n+1}\\big)=\\frac15$。$\\tfrac45$ 是 $P(\\{n\\le4\\})$，$\\tfrac1{30}$ 只是单点 $\\{5\\}$ 的概率。（书中 §1.1 · Remark 1.1.13 · p.6）" },
  { id: "p1-r1-10", ch: 31, cat: "§1.2 抽球模型与样本空间", q: "同时掷三枚均匀骰子。三个点数两两不同的概率是", opts: ["$\\tfrac{5}{9}$", "$\\tfrac{5}{14}$", "$\\tfrac{5}{54}$", "$\\tfrac{25}{36}$"], a: 0, hint: "把各骰子看作可区分的，用 $DR_{6,3}$ 作样本空间；想一想“无序可重复”的结果是不是等可能的。",
    exp: "在 $DR_{6,3}$ 上取均匀概率，有利情形为 $|D_{6,3}|=120$，故概率为 $120/216=5/9$。$\\tfrac{5}{14}=\\binom63/\\binom83$ 把 56 个可重复组合当作等可能，但重复越多的组合概率越小；$\\tfrac{5}{54}$ 是用无序有利数 $20$ 除以有序总数 $216$ 得到的。（书中 §1.2 · Remark 1.2.13 · p.23）" },
  { id: "p1-r1-11", ch: 31, cat: "§1.2 抽球模型与样本空间", q: "9 名学生各自独立、均匀地从 3 位教授中选一位。每位教授恰被 3 人选中的概率是", opts: ["$\\binom{9}{3}\\binom{6}{3}/3^9$", "$3!\\binom{9}{3}\\binom{6}{3}/3^9$", "$1/\\binom{11}{2}$", "$\\binom{9}{3}/3^9$"], a: 0, hint: "样本空间取 $DR_{3,9}$（从学生到教授的映射），依次确定选第一、第二位教授的学生。",
    exp: "$|\\Omega|=3^9$；先选出选第一位教授的 3 人（$\\binom93$ 种），再从余下 6 人中选出选第二位的 3 人（$\\binom63$ 种），其余 3 人自动选第三位，结果约为 $8.5\\%$。各教授的人数已经指定，再乘 $3!$ 就重复计数了；$1/\\binom{11}{2}$ 把 55 种人数分配当作等可能。（书中 §5.1 · Exercise 5.1.11 · p.290）" },
  { id: "p1-r1-12", ch: 31, cat: "§1.2 逐次选择法", q: "将 40 张牌（含 4 张 7）随机分成两叠各 20 张。第一叠至少含一张 7 的概率是", opts: ["$1-\\binom{36}{20}/\\binom{40}{20}$", "$4\\binom{39}{19}/\\binom{40}{20}$", "$4\\binom{36}{19}/\\binom{40}{20}$", "$1-(1/2)^4$"], a: 0, hint: "“至少一张”通常用补事件来算；“先选一张 7，再任选其余 19 张”是否唯一确定了一个结果？",
    exp: "补事件是第一叠的 20 张全取自 36 张非 7 的牌，概率约为 $94.7\\%$。$4\\binom{39}{19}/\\binom{40}{20}$ 对含多张 7 的结果重复计数，它实际等于 $2>1$；$4\\binom{36}{19}/\\binom{40}{20}$ 是恰含一张 7 的概率；$1-(1/2)^4$ 错误地把四张 7 的去向当作独立。（书中 §1.2 · Example 1.2.22 · p.29）" },
  { id: "p1-r1-13", ch: 31, cat: "§1.2 逐次选择法", q: "袋中有 3 个白球、5 个红球，不放回地依次抽取 5 个。第 5 次抽到白球的概率是", opts: ["$\\tfrac{3}{8}$", "$\\tfrac{3}{4}$", "$\\tfrac{1}{8}$", "取决于前四次结果，没有确定值"], a: 0, hint: "在 $D_{8,5}$ 上先选定第 5 个位置上的白球，再排列前四次。",
    exp: "有利数为 $3\\cdot|D_{7,4}|$，总数为 $|D_{8,5}|$，比值为 $3/8$，与第一次抽到白球的概率相同（把第 1 个与第 5 个位置对调就是一个双射）。条件概率才依赖于前四次的结果，无条件概率是确定的。（书中 §1.2 · Example 1.2.23 · p.31）" },
  { id: "p1-r1-14", ch: 31, cat: "§1.2 二项与超几何", q: "袋中有 2 个白球、8 个黑球，**不放回**地抽取 6 个。至少抽到一个白球的概率是", opts: ["$\\tfrac{13}{15}$", "$1-(4/5)^6$", "$\\tfrac{2}{15}$", "$\\tfrac{3}{5}$"], a: 0, hint: "用超几何模型计算补事件“6 个全为黑球”的概率。",
    exp: "补事件的概率为 $\\binom86/\\binom{10}6=28/210=2/15$，所以答案是 $13/15\\approx0.87$。$1-(4/5)^6\\approx0.74$ 是有放回（二项）情形的答案；$\\tfrac35$ 只是某个指定白球被抽中的概率。（书中 §1.2 · Example 1.2.19 · p.27）" },
  { id: "p1-r1-15", ch: 31, cat: "§1.3 条件概率", q: "某人有两个孩子（性别等可能且独立）。已知**至少一个**是男孩，两个都是男孩的条件概率是？", opts: ["$1/3$", "$1/2$", "$1/4$", "$2/3$"], a: 0, hint: "在样本空间 $\\{MM,MF,FM,FF\\}$ 上写出条件事件 $B$，再用 $P(A\\cap B)/P(B)$。",
    exp: "$B=\\{MM,MF,FM\\}$，$P(B)=3/4$，$A=\\{MM\\}\\subseteq B$，故 $P(A\\mid B)=(1/4)/(3/4)=1/3$。答案 $1/2$ 对应的是“已知长子是男孩”这一不同的条件。（书中 §1.3 · Example 1.3.34 · p.52）" },
  { id: "p1-r1-16", ch: 31, cat: "§1.3 Bayes 公式", q: "三张卡片：红/红、红/白、白/白。随机取一张、随机看一面，看到红色。另一面也是红色的概率是？", opts: ["$2/3$", "$1/2$", "$1/3$", "$3/4$"], a: 0, hint: "设 $A$=“取到红/红卡”，$R$=“看到的一面是红”，先用全概率公式算 $P(R)$。",
    exp: "$P(R)=\\tfrac13(1+\\tfrac12+0)=\\tfrac12$，由 Bayes 公式 $P(A\\mid R)=P(R\\mid A)P(A)/P(R)=(1/3)/(1/2)=2/3$。直觉上的 $1/2$ 忽略了红/红卡有两面红、更容易出现红面。（书中 §5.1 · Exercise 5.1.24 · p.299）" },
  { id: "p1-r1-17", ch: 31, cat: "§1.3 全概率公式", q: "已知 $P(A\\mid B)=0.95$，$P(A\\mid B^c)=0.10$，$P(A)=0.80$，则 $P(B)$ 等于？", opts: ["$14/17$", "$4/5$", "$19/25$", "$17/20$"], a: 0, hint: "把全概率公式 $P(A)=P(A\\mid B)P(B)+P(A\\mid B^c)(1-P(B))$ 看成关于 $P(B)$ 的一次方程。",
    exp: "解得 $P(B)=\\frac{P(A)-P(A\\mid B^c)}{P(A\\mid B)-P(A\\mid B^c)}=\\frac{0.70}{0.85}=\\frac{14}{17}\\approx0.82$（需 $P(A\\mid B)\\ne P(A\\mid B^c)$）。$17/20$ 只是分母，$19/25=0.95\\times0.8$ 没有意义。（书中 §1.3 · Exercise 1.3.16 · p.42）" },
  { id: "p1-r1-18", ch: 31, cat: "§1.3 事件的独立性", q: "设 $A,B,C$ 相互独立。下列哪一对事件**不一定**独立？", opts: ["$A\\cup C$ 与 $B\\cup C$", "$A$ 与 $B^c$", "$A$ 与 $B\\cup C$", "$A^c$ 与 $B\\cap C$"], a: 0, hint: "独立性对取补封闭；把并集转成补集的交集再检验乘积公式。",
    exp: "$(A\\cup C)^c=A^c\\cap C^c$，$(B\\cup C)^c=B^c\\cap C^c$，其交的概率为 $P(A^c)P(B^c)P(C^c)$，而乘积为 $P(A^c)P(B^c)P(C^c)^2$，一般不等。$A$ 与 $B\\cap C$ 独立，取补即得 $A$ 与 $B\\cup C$、$A^c$ 与 $B\\cap C$ 独立。（书中 §5.1 · Exercise 5.1.1 · p.283）" },
  { id: "p1-r1-19", ch: 31, cat: "§1.3 事件族的独立性", q: "掷三枚均匀骰子，$A_{ij}$=“第 $i$ 枚与第 $j$ 枚点数相同”。关于 $A_{12},A_{13},A_{23}$，正确的是？", opts: ["两两独立，但不是相互独立", "相互独立", "两两都不独立", "$P(A_{12}\\cap A_{13}\\cap A_{23})=1/216$"], a: 0, hint: "分别计算 $P(A_{ij})$、两两交的概率与三者交的概率。",
    exp: "$P(A_{ij})=1/6$，任两者之交即“三枚全相同”，概率 $1/36=(1/6)^2$，故两两独立；但三者之交仍是 $1/36\\ne(1/6)^3$，所以不相互独立。（书中 §1.3 · Exercise 1.3.41 · p.55）" },
  { id: "p1-r1-20", ch: 31, cat: "Lemma 1.3.28 Borel–Cantelli", q: "$(A_n)_{n\\ge2}$ 相互独立，$P(A_n)=\\frac{1}{n\\log n}$。则 $P(A_n\\ \\text{i.o.})$ 等于？", opts: ["$1$", "$0$", "$1/2$", "无法由已知条件确定"], a: 0, hint: "判断 $\\sum_n P(A_n)$ 是否收敛，并注意独立性假设的作用。",
    exp: "由积分判别法 $\\sum 1/(n\\log n)=+\\infty$，事件又独立，由 Borel–Cantelli 第二部分得概率为 1。0–1 律保证答案只能是 0 或 1，且由独立性可以确定。（书中 §1.3 · Lemma 1.3.28 · p.48）" },
  { id: "p1-r1-21", ch: 31, cat: "§1.3 重复独立试验", q: "在**离散**概率空间上有一列相互独立事件 $(C_h)_{h\\in\\mathbb N}$，且 $P(C_h)=p$ 对所有 $h$ 成立。则 $p$ 可以取哪些值？", opts: ["只能是 $0$ 或 $1$", "$[0,1]$ 中任意值", "只能是 $1/2$", "$[0,1]$ 中任意有理数"], a: 0, hint: "任取一个样本点 $\\omega$，它落在每个 $C_h$ 或 $C_h^c$ 中；用独立性估计 $P(\\{\\omega\\})$。",
    exp: "不妨 $p\\ge1/2$，若 $p<1$，则 $P(\\{\\omega\\})\\le p^n\\to0$ 对每个 $\\omega$ 成立，与离散空间上概率由各点质量相加得到矛盾。所以非平凡的无穷独立试验列不能在离散空间上实现。（书中 §1.3 · Prop 1.3.30 · p.50）" },
  { id: "p1-r1-22", ch: 31, cat: "§1.4 概率空间的完备化", q: "设 $\\delta_0$ 为 $\\mathbb R$ 上 $0$ 点的 Dirac 分布。$(\\mathbb R,\\mathcal B,\\delta_0)$ 完备化后的 $\\sigma$-代数是？", opts: ["$\\mathcal P(\\mathbb R)$", "$\\mathcal B$ 本身（已完备）", "Lebesgue $\\sigma$-代数 $\\mathcal L$", "可数或余可数集全体"], a: 0, hint: "先找出 $\\delta_0$-可忽略集：哪些子集包含在一个零测 Borel 集中？",
    exp: "任意不含 0 的子集都含于 $\\mathbb R\\setminus\\{0\\}$（测度 0），故都是可忽略集；每个 $A\\subseteq\\mathbb R$ 可写成 $(A\\cap\\{0\\})\\cup(A\\setminus\\{0\\})$，所以完备化得到全体子集。$\\mathcal B$ 不完备，因为不含 0 的非 Borel 集是可忽略集却不在 $\\mathcal B$ 中。（书中 §1.4 · Exercise 1.4.14 · p.61）" },
  { id: "p1-r1-23", ch: 31, cat: "§1.4 分布的唯一性", q: "$\\mathbb R$ 上两个分布 $\\mu_1,\\mu_2$ 若在下列哪类集合上都相等，**不能**推出 $\\mu_1=\\mu_2$？", opts: ["所有单点集 $\\{x\\}$", "所有开集", "所有闭集", "所有 $]-\\infty,a]$，$a\\in\\mathbb R$"], a: 0, hint: "想一想两个都没有原子的不同分布。",
    exp: "$\\mathrm{Unif}_{[0,1]}$ 与 $N_{0,1}$ 在每个单点上都为 0 却不相等。由内外正则性，在开集（或闭集）上一致即相等；在 $]-\\infty,a]$ 上一致即 CDF 相同，由 Carathéodory 唯一性也相等。（书中 §1.4 · Cor 1.4.10 · p.59）" },
  { id: "p1-r1-24", ch: 31, cat: "§1.5 Carathéodory 定理", q: "关于 Carathéodory 延拓定理（一般版本）及其设定，下列哪项正确？", opts: ["$\\sigma$-有限预测度可从半环唯一延拓到其生成的 $\\sigma$-代数", "有界区间 $]a,b]$ 的全体构成一个代数", "定理要求 $\\Omega$ 是度量空间", "去掉 $\\sigma$-有限假设，延拓仍总是唯一的"], a: 0, hint: "回忆半环与代数的区别，以及证明中哪一步用到 $\\sigma$-有限。",
    exp: "有界区间族是半环但不是代数（补集不是有界区间）；证明纯属集合论，对 $\\Omega$ 无拓扑要求；存在性不需要 $\\sigma$-有限，但唯一性（经 Dynkin 定理）需要它。（书中 §1.5 · Thm 1.5.5 · p.86）" },
  { id: "p1-r1-25", ch: 31, cat: "§1.4 CDF 的跳跃", q: "取 $[0,1]$ 中有理数的一个编号 $(q_n)$，其中 $q_3=1$，令 $\\mu(\\{q_n\\})=2^{-n}$（$n\\ge1$）。则 CDF 的左极限 $F_\\mu(1-)$ 为？", opts: ["$7/8$", "$1$", "$1/8$", "$3/4$"], a: 0, hint: "$F_\\mu(x)-F_\\mu(x-)$ 等于点 $x$ 处的质量。",
    exp: "全部质量在 $[0,1]$ 中，故 $F_\\mu(1)=1$；跳跃 $\\mu(\\{1\\})=2^{-3}=1/8$，所以 $F_\\mu(1-)=1-1/8=7/8$。$F_\\mu$ 在每个有理点都不连续，在无理点连续。（书中 §1.4 · Exercise 1.4.39 · p.76）" },
  { id: "p1-r1-26", ch: 31, cat: "§1.4 由 CDF 计算概率", q: "设 $F(x)=0\\ (x<0)$，$F(x)=x/3\\ (0\\le x<1)$，$F(x)=1\\ (x\\ge1)$。对应分布 $\\mu_F$ 下 $\\mu_F(\\mathbb Q)$ 等于？", opts: ["$2/3$", "$0$", "$1/3$", "$1$"], a: 0, hint: "可数集的概率等于其中各点质量之和；找出 $F$ 的所有跳跃点。",
    exp: "$F$ 只在 $x=1$ 处跳跃，跳跃量 $1-1/3=2/3$，其余处连续，故 $\\mu_F(\\mathbb Q)=2/3$。事实上 $\\mu_F=\\tfrac23\\delta_1+\\tfrac13\\mathrm{Unif}_{[0,1]}$；$1/3$ 是 $\\mu_F([0,1[)$。（书中 §1.4 · Exercise 1.4.37 · p.76）" },
  { id: "p1-r1-27", ch: 31, cat: "§1.4 分布的类型", q: "令 $I=[0,1]\\times\\{0\\}\\subseteq\\mathbb R^2$，$\\mu(H)=\\mathrm{Leb}_1(H\\cap I)$，$H\\in\\mathcal B_2$。关于 $\\mu$ 正确的是？", opts: ["既不是离散分布，也不是绝对连续分布", "绝对连续，密度为 $\\mathbb 1_I$", "是离散分布", "不是概率测度"], a: 0, hint: "分别检查单点的质量，以及 Lebesgue 零测集上的质量。",
    exp: "$\\mu(\\{x\\})=0$ 对每点成立，故非离散；但 $\\mathrm{Leb}_2(I)=0$ 而 $\\mu(I)=1$，绝对连续分布不能给 Lebesgue 零测集正概率。$\\mathbb 1_I$ 的积分为 0，不是密度；$\\mu(\\mathbb R^2)=1$，它确实是分布。（书中 §1.4 · Remark 1.4.23 · p.67）" },
  { id: "p1-r1-28", ch: 31, cat: "§1.4 Cantor–Vitali 分布", q: "$V$ 为 Cantor–Vitali 函数，$\\mu_V$ 为满足 $\\mu_V(]a,b])=V(b)-V(a)$ 的分布。下列哪项**不成立**？", opts: ["$\\mu_V$ 以 $V'$（a.e. 定义）为密度", "对每个 $x$，$\\mu_V(\\{x\\})=0$", "$\\mu_V$ 集中在 Lebesgue 零测的 Cantor 集上", "$\\mu_V$ 由 $V$ 唯一确定"], a: 0, hint: "$V$ 连续、递增，几乎处处可导，其导数是什么？",
    exp: "$V'=0$ a.e.，若 $V'$ 是密度则总质量为 0，矛盾，所以 $\\mu_V$ 不绝对连续。$V$ 连续推出无原子；$\\mu_V$ 赋予 Cantor 集概率 1；由 Thm 1.4.33 的唯一性，$\\mu_V$ 由 $V$ 唯一确定。（书中 §1.4 · Example 1.4.36 · p.75）" },
  { id: "p1-r1-29", ch: 31, cat: "Thm 1.4.33 CDF 与分布", q: "令 $F_n(x)=0\\ (x<0)$，$x^n\\ (0\\le x<1)$，$1\\ (x\\ge1)$，$\\gamma_n$ 为其密度。关于 $F=\\lim F_n$ 与 $\\lim\\gamma_n$，正确的是？", opts: ["$F$ 是 $\\delta_1$ 的 CDF；$\\lim\\gamma_n$ 不是密度", "$F$ 是 $\\delta_1$ 的 CDF；$\\lim\\gamma_n$ 是其密度", "$F$ 是 $\\mathrm{Unif}_{[0,1]}$ 的 CDF", "$F$ 不右连续，故不是 CDF"], a: 0, hint: "逐点求极限时分 $x<1$ 与 $x\\ge1$；再看 $\\gamma_n=nx^{n-1}\\mathbb 1_{[0,1]}$ 的逐点极限。",
    exp: "$F=\\mathbb 1_{[1,+\\infty[}$ 右连续，是 $\\delta_1$ 的 CDF；$\\gamma_n\\to0$ 几乎处处，积分为 0，不是密度（$\\delta_1$ 本身也无密度）。（书中 §1.4 · Exercise 1.4.38 · p.76）" },
  { id: "p1-r1-30", ch: 31, cat: "§1.4 多元 CDF", q: "$F(x_1,x_2)$：两坐标都 $\\ge1$ 时为 1；一个 $\\ge1$、另一个在 $[0,1)$ 时为 $2/3$；其余为 0。$F$ 在 $]\\tfrac12,1]^2$ 上的矩形增量为？", opts: ["$-1/3$，故 $F$ 不是 CDF", "$1/3$，且 $F$ 是 CDF", "$0$，且 $F$ 是某离散分布的 CDF", "$-1/3$，但 $F$ 各变量单调故仍是 CDF"], a: 0, hint: "矩形增量为 $F(b_1,b_2)-F(a_1,b_2)-F(b_1,a_2)+F(a_1,a_2)$。",
    exp: "增量 $=1-2/3-2/3+0=-1/3<0$，否则对应分布会给该正方形负概率。$d\\ge2$ 时 CDF 需要矩形增量非负，仅对每个变量单调不够。（书中 §1.4 · Remark 1.4.44 · p.79）" },
  { id: "p1-r2-1", ch: 32, cat: "§2.1 分布与 CDF", q: "在概率空间 $(\\mathbb R,\\mathscr B,\\mathrm{Exp}_\\lambda)$ 上令 $X(\\omega)=\\omega^2$。$X$ 在 $x>0$ 处的密度是？", opts: ["$\\tfrac{\\lambda}{2\\sqrt x}e^{-\\lambda\\sqrt x}$", "$\\lambda e^{-\\lambda\\sqrt x}$", "$2\\lambda x\\,e^{-\\lambda x^2}$", "$\\tfrac{\\lambda}{2\\sqrt x}e^{-\\lambda x}$"], a: 0, hint: "先写 $F_X(x)=P(\\omega^2\\le x)$，注意 $\\mathrm{Exp}_\\lambda$ 集中在 $[0,\\infty)$ 上。",
    exp: "对 $x\\ge0$ 有 $F_X(x)=\\mathrm{Exp}_\\lambda([0,\\sqrt x])=1-e^{-\\lambda\\sqrt x}$，求导得 $\\frac{\\lambda}{2\\sqrt x}e^{-\\lambda\\sqrt x}$。$\\lambda e^{-\\lambda\\sqrt x}$ 漏了链式法则因子，$2\\lambda x e^{-\\lambda x^2}$ 是 $\\sqrt\\omega$ 而非 $\\omega^2$ 的情形。（书中 §2.1 · Example 2.1.16 · p.104）" },
  { id: "p1-r2-2", ch: 32, cat: "§2.1 CDF 变换", q: "设 $X\\sim\\tfrac12(\\delta_0+\\mathrm{Unif}_{[0,1]})$，$F_X$ 为其 CDF。随机变量 $F_X(X)$ 的分布是？", opts: ["$\\tfrac12(\\delta_{1/2}+\\mathrm{Unif}_{[1/2,1]})$", "$\\mathrm{Unif}_{[0,1]}$", "$\\tfrac12(\\delta_0+\\mathrm{Unif}_{[0,1]})$", "$\\tfrac12(\\delta_{1/2}+\\mathrm{Unif}_{[0,1]})$"], a: 0, hint: "先写出 $F_X$ 在 $[0,1]$ 上的表达式，再分 $X=0$ 与 $X\\in\\,]0,1]$ 两种情况。",
    exp: "$F_X(x)=\\tfrac12+\\tfrac x2$（$0\\le x\\le1$），故以概率 $\\tfrac12$ 有 $F_X(X)=\\tfrac12$，否则 $F_X(X)$ 在 $[\\tfrac12,1]$ 上均匀。$F_X$ 在 0 处跳跃，所以 $F_X(X)\\sim\\mathrm{Unif}_{[0,1]}$ 的结论不适用，说明 Cor 2.1.41 中 CDF 连续的假设不能去掉。（书中 §2.1 · Exercise 2.1.42 · p.119）" },
  { id: "p1-r2-3", ch: 32, cat: "§2.1 分布相等", q: "$X,Y$ 定义在同一概率空间上且 $X\\overset{d}{=}Y$。下列哪项一定成立？", opts: ["对任意有界 Borel $f$，$E[f(X)]=E[f(Y)]$", "$X=Y$ a.s.", "$\\sigma(X)=\\sigma(Y)$", "$(X,Y)\\overset{d}{=}(Y,X)$"], a: 0, hint: "分布相等只涉及 $\\mu_X$ 与 $\\mu_Y$，不涉及 $X,Y$ 的联合行为。",
    exp: "$E[f(X)]=\\int f\\,d\\mu_X$ 只依赖分布，故相等。取 $X\\sim\\mathrm{Be}_{1/2}$、$Y=1-X$ 可否定 $X=Y$ a.s.；独立同分布的两个变量一般生成不同的 σ-代数；在 $\\{1,2,3\\}$ 均匀概率下取 $X(\\omega)=\\omega$、$Y$ 为其循环移位，则 $(X,Y)$ 与 $(Y,X)$ 分布不同。（书中 §2.1 · Def 2.1.18 · p.105）" },
  { id: "p1-r2-4", ch: 32, cat: "§2.1 绝对连续", q: "设 $X\\sim\\mathrm{Exp}_\\lambda$，$Y\\sim\\mathrm{Exp}_\\lambda$ 与 $X$ 独立。下列哪个随机变量**不是**绝对连续的？", opts: ["$(X,X^2)$", "$X^2$", "$-\\log X$", "$(X,X+Y)$"], a: 0, hint: "考虑分布是否可能集中在一个 Lebesgue 零测集上。",
    exp: "$(X,X^2)$ 以概率 1 落在抛物线 $\\{y=x^2\\}$ 上，而该集合在 $\\mathbb R^2$ 中 Lebesgue 测度为零，故不绝对连续。$X^2$ 与 $-\\log X$ 是 $X$ 经 $C^1$ 单调变换所得，有密度；$(X,X+Y)$ 是绝对连续向量 $(X,Y)$ 的可逆线性像，也有密度。（书中 §2.1 · Example 2.1.47 · p.121）" },
  { id: "p1-r2-5", ch: 32, cat: "Thm 2.1.26 几何分布", q: "设 $T\\sim\\mathrm{Geom}_p$（取值于 $\\mathbb N=\\{1,2,\\dots\\}$）。$P(T\\ge5\\mid T>2)$ 等于？", opts: ["$(1-p)^2$", "$(1-p)^3$", "$(1-p)^5$", "$p(1-p)^2$"], a: 0, hint: "把 $\\{T\\ge5\\}$ 改写成 $\\{T>n\\}$ 的形式，再用无记忆性。",
    exp: "$\\{T\\ge5\\}=\\{T>4\\}$，由无记忆性 $P(T>2+2\\mid T>2)=P(T>2)=(1-p)^2$。$(1-p)^3$ 是把 $T\\ge5$ 误当成 $T>5$ 的结果，$p(1-p)^2$ 是 $P(T=3)$。（书中 §2.1 · Thm 2.1.26 · p.110）" },
  { id: "p1-r2-6", ch: 32, cat: "§2.1 Gamma 分布", q: "设 $X\\sim\\mathrm{Gamma}_{\\alpha,\\lambda}$（密度 $\\propto x^{\\alpha-1}e^{-\\lambda x}$），$c>0$。则 $cX$ 服从？", opts: ["$\\mathrm{Gamma}_{\\alpha,\\lambda/c}$", "$\\mathrm{Gamma}_{\\alpha,c\\lambda}$", "$\\mathrm{Gamma}_{c\\alpha,\\lambda}$", "$\\mathrm{Gamma}_{\\alpha/c,\\lambda}$"], a: 0, hint: "用 $P(cX\\le y)=P(X\\le y/c)$ 并做变量替换，看指数部分如何变化。",
    exp: "$cX$ 的密度为 $\\tfrac1c\\gamma_{\\alpha,\\lambda}(x/c)\\propto x^{\\alpha-1}e^{-(\\lambda/c)x}$，形状参数不变，速率参数变为 $\\lambda/c$。特别地 $\\lambda X\\sim\\mathrm{Gamma}_{\\alpha,1}$，这与 $E[X]=\\alpha/\\lambda$ 一致。（书中 §2.1 · Lemma 2.1.37 · p.117）" },
  { id: "p1-r2-7", ch: 32, cat: "§2.1 Gamma 分布", q: "设 $X\\sim\\mathcal N_{0,\\sigma^2}$，$\\sigma>0$。则 $X^2$ 服从？", opts: ["$\\mathrm{Gamma}_{1/2,\\,1/(2\\sigma^2)}$", "$\\mathrm{Gamma}_{1/2,\\,\\sigma^2/2}$", "$\\mathrm{Gamma}_{1/2,\\,1/2}$", "$\\mathrm{Gamma}_{1/(2\\sigma^2),\\,1/2}$"], a: 0, hint: "写 $X=\\sigma Z$，$Z\\sim\\mathcal N_{0,1}$，先确定 $Z^2$ 的分布。",
    exp: "$Z^2\\sim\\mathrm{Gamma}_{1/2,1/2}$（$\\chi^2$ 分布），而 $X^2=\\sigma^2Z^2$，由 Gamma 的尺度性质速率参数除以 $\\sigma^2$，得 $\\mathrm{Gamma}_{1/2,1/(2\\sigma^2)}$。可用均值检验：$E[X^2]=\\tfrac{1/2}{1/(2\\sigma^2)}=\\sigma^2$。（书中 §2.1 · Example 2.1.38 · p.118）" },
  { id: "p1-r2-8", ch: 32, cat: "§2.2 积分收敛定理", q: "在 $([0,1],\\mathscr B,\\mathrm{Leb})$ 上令 $X_n=n\\mathbf 1_{]0,1/n[}$。下列哪项正确？", opts: ["$\\sup_n X_n$ 不可积", "$X_n$ 不几乎处处收敛", "$E[\\liminf X_n]=\\liminf E[X_n]$", "由 Beppo Levi 定理 $E[X_n]\\to0$"], a: 0, hint: "分别算出 $X_n$ 的逐点极限与 $E[X_n]$，再看是否存在可积控制函数。",
    exp: "$X_n\\to0$ 处处成立但 $E[X_n]=1$，所以 Fatou 不等式严格，且 $E[X_n]\\not\\to0$；控制收敛定理失效，说明不存在可积控制函数，事实上 $\\sup_nX_n(\\omega)\\approx1/\\omega$ 不可积。序列也不单调，Beppo Levi 不适用。（书中 §2.2 · Thm 2.2.12 · p.130）" },
  { id: "p1-r2-9", ch: 32, cat: "Thm 2.2.26 期望与分布", q: "$T\\sim\\mathrm{Exp}_1$，$X=\\min\\{T,3\\}$。$E[X]$ 等于？", opts: ["$1-e^{-3}$", "$1-4e^{-3}$", "$1$", "$3(1-e^{-3})$"], a: 0, hint: "把 $X$ 写成 $T\\mathbf 1_{(T\\le3)}+3\\mathbf 1_{(T>3)}$，再用 $T$ 的分布积分。",
    exp: "$E[X]=\\int_0^3te^{-t}dt+3P(T>3)=(1-4e^{-3})+3e^{-3}=1-e^{-3}$。$1-4e^{-3}$ 漏掉了 $T>3$ 时取值 3 的那部分；$1$ 是 $E[T]$ 本身。（书中 §2.2 · Thm 2.2.26 · p.136；Exercise 5.2.33 · p.332）" },
  { id: "p1-r2-10", ch: 32, cat: "§2.2 $L^p$ 空间", q: "$\\Omega=\\mathbb N$，$P(\\{n\\})=c/n^3$（$c$ 为归一化常数），$X(n)=n$。对 $p\\ge1$，$X\\in L^p$ 当且仅当？", opts: ["$1\\le p<2$", "$1\\le p\\le2$", "$1\\le p<3$", "所有 $p\\ge1$"], a: 0, hint: "写出 $E[|X|^p]$ 对应的级数，看它何时收敛。",
    exp: "$E[X^p]=c\\sum_n n^{p-3}$，收敛当且仅当 $3-p>1$ 即 $p<2$。特别地 $X\\in L^1\\setminus L^2$，说明 $L^{p_2}\\subseteq L^{p_1}$（$p_1\\le p_2$）的包含一般是严格的。（书中 §2.2 · Example 2.2.36 · p.143）" },
  { id: "p1-r2-11", ch: 32, cat: "Thm 2.2.32 Jensen 不等式", q: "设所涉及的期望都有限。下列哪个不等式**不**一定成立？", opts: ["$X>0$ 时 $E[1/X]\\le 1/E[X]$", "$e^{E[X]}\\le E[e^X]$", "$X>0$ 时 $E[\\log X]\\le\\log E[X]$", "$p\\ge1$ 时 $(E|X|)^p\\le E|X|^p$"], a: 0, hint: "逐个判断所用函数在相应区间上是凸还是凹。",
    exp: "$1/x$ 在 $]0,\\infty[$ 上是凸函数，Jensen 给出的是 $E[1/X]\\ge1/E[X]$，方向相反；$e^x$、$|x|^p$（$p\\ge1$）凸，$\\log$ 凹，其余三式都是 Jensen 不等式的直接推论。（书中 §2.2 · Thm 2.2.32 · p.141）" },
  { id: "p1-r2-12", ch: 32, cat: "§2.2 协方差", q: "$(X_1,X_2)$ 的协方差矩阵为 $\\begin{pmatrix}1&\\rho\\\\ \\rho&1\\end{pmatrix}$。$\\mathrm{var}(X_1-2X_2)$ 等于？", opts: ["$5-4\\rho$", "$5+4\\rho$", "$5-2\\rho$", "$3-4\\rho$"], a: 0, hint: "用协方差的双线性，或 $\\mathrm{cov}(AX)=A\\,\\mathrm{cov}(X)A^*$。",
    exp: "$\\mathrm{var}(X_1-2X_2)=\\mathrm{var}X_1+4\\,\\mathrm{var}X_2-4\\,\\mathrm{cov}(X_1,X_2)=5-4\\rho$。$5-2\\rho$ 漏掉了交叉项的系数 2，$5+4\\rho$ 弄错了符号。（书中 §2.2 · Def 2.2.41 · p.146）" },
  { id: "p1-r2-13", ch: 32, cat: "§2.2 联合与边缘密度", q: "$(X,Y)$ 的密度为 $(x+y)\\mathbf 1_{[0,1]^2}(x,y)$。$\\mathrm{cov}(X,Y)$ 等于？", opts: ["$-1/144$", "$0$", "$1/144$", "$1/12$"], a: 0, hint: "先由联合密度对 $y$ 积分求 $X$ 的边缘密度，再算 $E[X]$ 与 $E[XY]$。",
    exp: "边缘密度 $\\gamma_X(x)=x+\\tfrac12$，$E[X]=E[Y]=\\tfrac7{12}$；$E[XY]=\\int\\!\\!\\int xy(x+y)=\\tfrac13$。故 $\\mathrm{cov}=\\tfrac13-\\tfrac{49}{144}=-\\tfrac1{144}$。若误取 $E[X]=\\tfrac12$ 会得到 $\\tfrac1{12}$。（书中 §2.2 · Prop 2.2.47 · p.152；Exercise 5.2.10 · p.314）" },
  { id: "p1-r2-14", ch: 32, cat: "Thm 2.3.3 Doob 定理", q: "$\\Omega=\\{1,2,3\\}$，$X=\\mathbf 1_{\\{1,2\\}}$，$Y=\\mathbf 1_{\\{1\\}}$。下列哪项正确？", opts: ["$X\\notin m\\sigma(Y)$ 且 $Y\\notin m\\sigma(X)$", "存在 Borel $f$ 使 $X=f(Y)$", "在均匀概率下 $X,Y$ 独立", "$\\Omega$ 上没有使 $X,Y$ 独立的概率"], a: 0, hint: "写出 $\\sigma(X)$ 与 $\\sigma(Y)$，比较包含关系；独立性则要依赖具体的概率测度。",
    exp: "$\\sigma(X)=\\{\\emptyset,\\Omega,\\{1,2\\},\\{3\\}\\}$ 与 $\\sigma(Y)=\\{\\emptyset,\\Omega,\\{1\\},\\{2,3\\}\\}$ 互不包含，由 Doob 定理两者都不是对方的函数。均匀概率下 $P(X=1,Y=0)=\\tfrac13\\ne\\tfrac49$；但取 $P=\\delta_2$ 时两者都是常数，因而独立。（书中 §2.3 · Exercise 2.3.6 · p.157）" },
  { id: "p1-r2-15", ch: 32, cat: "§2.3 确定性依赖与独立", q: "$X$ 是离散随机变量，$f$ 在 $X(\\Omega)$ 上单射。$X$ 与 $f(X)$ 独立当且仅当？", opts: ["$X$ 几乎必然为常数", "总是独立", "$X$ 至多取两个值", "从不独立"], a: 0, hint: "$f$ 单射时 $(X=y)$ 与 $(f(X)=f(y))$ 是同一个事件。",
    exp: "若独立，则 $P(X=y)=P(X=y,f(X)=f(y))=P(X=y)^2$，于是每个 $P(X=y)\\in\\{0,1\\}$，$X$ 几乎必然为常数；反之常数与任何变量独立。所以“总是独立”和“从不独立”都不对，取两个值的非退化 Bernoulli 也不独立。（书中 §2.3 · Exercise 2.3.8 · p.158）" },
  { id: "p1-r2-16", ch: 32, cat: "Thm 2.3.23 独立性判别", q: "$a,b\\ge0$，$a+b\\le1$，$(X,Y)$ 的密度为 $\\tfrac14(ax+by+1)\\mathbf 1_{[-1,1]^2}$。$X,Y$ 独立当且仅当？", opts: ["$ab=0$", "$a=b$", "$a+b=1$", "对所有这样的 $a,b$ 都独立"], a: 0, hint: "先算两个边缘密度，再比较它们的乘积与联合密度。",
    exp: "边缘密度为 $\\gamma_X=\\tfrac12(ax+1)$、$\\gamma_Y=\\tfrac12(by+1)$（在 $[-1,1]$ 上），乘积为 $\\tfrac14(ax+1)(by+1)$；与联合密度几乎处处相等当且仅当 $abxy\\equiv0$，即 $ab=0$。（书中 §2.3 · Thm 2.3.23 · p.163；Exercise 5.2.37 · p.337）" },
  { id: "p1-r2-17", ch: 32, cat: "§2.3 不相关与独立", q: "$(X,Y)$ 在三角形 $\\{x,y\\ge0,\\ x+y\\le1\\}$ 上均匀分布。$\\mathrm{cov}(X,Y)$ 等于？", opts: ["$-1/36$", "$0$", "$1/36$", "$-1/18$"], a: 0, hint: "联合密度是 $2\\mathbf 1_T$；先求 $E[X]$，再用 Beta 积分算 $E[XY]$。",
    exp: "$E[X]=E[Y]=\\tfrac13$，$E[XY]=2\\int_0^1x\\cdot\\tfrac{(1-x)^2}2dx=\\tfrac1{12}$，故 $\\mathrm{cov}=\\tfrac1{12}-\\tfrac19=-\\tfrac1{36}$。负相关，所以 $X,Y$ 不独立。$-\\tfrac1{18}$ 是 $-\\mathrm{var}(X)$。（书中 §2.3 · Example 2.3.34 · p.170）" },
  { id: "p1-r2-18", ch: 32, cat: "Thm 2.3.28 独立与期望", q: "下列关于实随机变量的命题中，哪一个**不**成立？", opts: ["$X,Y\\sim\\mathcal N_{0,1}$ 且不相关，则独立", "$X,Y\\in L^1$ 独立，则 $XY\\in L^1$", "$X,Y$ 独立，$f,g\\in m\\mathscr B$，则 $f(X),g(Y)$ 独立", "$X,Y\\in L^2$ 独立，则 $\\mathrm{var}(X+Y)=\\mathrm{var}X+\\mathrm{var}Y$"], a: 0, hint: "“不相关推出独立”需要的是联合分布的条件，而不只是各自的边缘分布。",
    exp: "只有当 $(X,Y)$ 联合正态时不相关才推出独立；仅边缘正态不够（例如 $Y=TX$，$T$ 为与 $X$ 独立的对称 $\\pm1$ 变量）。其余三条分别是 Thm 2.3.28、独立性在 Borel 变换下保持以及 Cor 2.3.30 的结论。（书中 §2.3 · Thm 2.3.28 · p.168；Example 2.3.32 · p.169）" },
  { id: "p1-r2-19", ch: 32, cat: "§2.4 给定事件的条件分布", q: "设 $X,Y\\sim\\mathrm{Be}_p$ 独立，$0<p<1$，$B=(X+Y=1)$。条件分布 $\\mu_{X|B}$ 是？", opts: ["$\\mathrm{Be}_{1/2}$，与 $p$ 无关", "$\\mathrm{Be}_p$", "$\\mathrm{Be}_{1-p}$", "$\\mathrm{Be}_{p^2/(p^2+(1-p)^2)}$"], a: 0, hint: "$B$ 上 $X=1$ 当且仅当 $(X,Y)=(1,0)$，比较 $(1,0)$ 与 $(0,1)$ 两种情形的概率。",
    exp: "$P(X=1\\mid B)=p(1-p)/(2p(1-p))=1/2$，两种情形概率相同，故条件分布是 $\\mathrm{Be}_{1/2}$，与 $p$ 无关；这正是用不均匀硬币造出公平硬币的方法。（书中 §2.4 · Example 2.4.8 · p.174）" },
  { id: "p1-r2-20", ch: 32, cat: "§2.4 给定事件的条件期望", q: "设 $T\\sim\\mathrm{Exp}_\\lambda$，$t_0>0$。$E[T\\mid T>t_0]$ 等于？", opts: ["$t_0+1/\\lambda$", "$1/\\lambda$", "$t_0+e^{-\\lambda t_0}/\\lambda$", "$e^{\\lambda t_0}/\\lambda$"], a: 0, hint: "先求条件分布：利用指数分布的无记忆性。",
    exp: "由无记忆性，$\\mu_{T|T>t_0}$ 是平移 $t_0$ 的指数分布，密度 $\\lambda e^{-\\lambda(t-t_0)}1_{[t_0,\\infty)}(t)$，故条件期望为 $t_0+1/\\lambda$；$1/\\lambda$ 是无条件期望，忘了平移。（书中 §2.4 · Example 2.4.6 · p.173）" },
  { id: "p1-r2-21", ch: 32, cat: "§2.4 给定事件的条件期望", q: "设 $(X,Y)\\sim N_{0,C}$，$C=\\begin{pmatrix}1&1\\\\1&2\\end{pmatrix}$。$E[X\\mid Y>0]$ 等于？", opts: ["$1/\\sqrt{\\pi}$", "$0$", "$\\sqrt{2/\\pi}$", "$2/\\sqrt{\\pi}$"], a: 0, hint: "把 $X$ 写成 $Y$ 的倍数加上一个与 $Y$ 独立的正态变量。",
    exp: "$X=\\tfrac12 Y+W$，$W$ 与 $Y$ 独立且中心化，故 $E[X\\mid Y>0]=\\tfrac12E[Y\\mid Y>0]=\\tfrac12\\cdot\\sqrt2\\sqrt{2/\\pi}=1/\\sqrt\\pi$。虽然 $E[X]=0$，条件期望不为 $0$；$2/\\sqrt\\pi$ 是 $E[Y\\mid Y>0]$。（书中 §2.4 · Example 2.4.10 · p.175）" },
  { id: "p1-r2-22", ch: 32, cat: "§2.5 特征函数的性质", q: "对任意实随机变量 $X$，下列关于 $\\varphi_X$ 的结论哪一个**不**一定成立？", opts: ["$\\varphi_X$ 在 $0$ 处可微", "$\\varphi_X$ 在 $\\mathbb R$ 上一致连续", "$\\varphi_X(-\\eta)=\\overline{\\varphi_X(\\eta)}$", "$\\varphi_X(0)=1$ 且 $|\\varphi_X|\\le 1$"], a: 0, hint: "可微性与矩的存在性相关，想一个没有期望的分布。",
    exp: "Cauchy 分布的特征函数 $e^{-|\\eta|}$ 在原点不可微（$X\\notin L^1$）；一致连续、共轭对称、$\\varphi_X(0)=1$ 与 $|\\varphi_X|\\le1$ 对一切 $X$ 成立。（书中 §2.5 · Prop 2.5.3 · p.178；Example 2.5.23 · p.193）" },
  { id: "p1-r2-23", ch: 32, cat: "§2.5 矩与特征函数", q: "若 $\\varphi_X(\\eta)=(1-i\\eta)^{-2}$，则 $\\mathrm{var}(X)$ 等于？", opts: ["$2$", "$6$", "$4$", "$1$"], a: 0, hint: "利用 $\\varphi_X^{(k)}(0)=E[(iX)^k]$。",
    exp: "$\\varphi'(0)=2i$ 给出 $E[X]=2$，$\\varphi''(0)=-6$ 给出 $E[X^2]=6$，故方差为 $6-4=2$（这是 $\\mathrm{Gamma}_{2,1}$）；$6$ 是二阶矩而非方差。（书中 §2.5 · Thm 2.5.20 · p.192；Remark 2.5.21 · p.193）" },
  { id: "p1-r2-24", ch: 32, cat: "§2.5 反演定理", q: "对实随机变量 $X$，“$X$ 绝对连续”与“$\\varphi_X\\in L^1(\\mathbb R)$”之间的关系是？", opts: ["后者蕴含前者，反之不成立", "两者等价", "前者蕴含后者，反之不成立", "两者互不蕴含"], a: 0, hint: "考虑 $[-1,1]$ 上均匀分布的特征函数。",
    exp: "由反演定理，$\\varphi_X\\in L^1$ 时 $X$ 有密度 $\\frac1{2\\pi}\\int e^{-ix\\eta}\\varphi_X(\\eta)d\\eta$；但 $\\mathrm{Unif}_{[-1,1]}$ 绝对连续，其特征函数 $\\sin\\eta/\\eta$ 不绝对可积，所以反之不成立。（书中 §2.5 · Remark 2.5.10 · p.184）" },
  { id: "p1-r2-25", ch: 32, cat: "§2.5 反演定理", q: "$\\frac{1}{2\\pi}\\int_{\\mathbb R}\\frac{e^{-ix\\eta}}{1+\\eta^2}d\\eta$ 作为 $x$ 的函数等于？", opts: ["$\\tfrac12 e^{-|x|}$", "$e^{-|x|}$", "$\\frac{1}{\\pi(1+x^2)}$", "$\\tfrac1{\\sqrt{2\\pi}}e^{-x^2/2}$"], a: 0, hint: "找一个特征函数为 $1/(1+\\eta^2)$ 的分布，例如两个独立 $\\mathrm{Exp}_1$ 之差。",
    exp: "$X,Y\\sim\\mathrm{Exp}_1$ 独立时 $\\varphi_{X-Y}=\\frac{1}{(1-i\\eta)(1+i\\eta)}=\\frac1{1+\\eta^2}\\in L^1$，而 $X-Y$ 的密度是 $\\tfrac12e^{-|x|}$，由反演公式即得；$\\frac1{\\pi(1+x^2)}$ 是特征函数为 $e^{-|\\eta|}$ 的 Cauchy 密度。（书中 §2.5 · Thm 2.5.6 · p.183；Exercise 5.2.7 · p.310）" },
  { id: "p1-r2-26", ch: 32, cat: "§2.5 复合 Poisson", q: "$N\\sim\\mathrm{Poisson}_\\lambda$，$Z_1,Z_2,\\dots\\sim\\mathrm{Be}_p$，全部独立，$X=\\sum_{k=1}^N Z_k$（$N=0$ 时 $X=0$）。$X$ 的分布是？", opts: ["$\\mathrm{Poisson}_{\\lambda p}$", "$\\mathrm{Poisson}_{\\lambda}$", "$\\mathrm{Poisson}_{\\lambda/p}$", "$\\mathrm{Poisson}_{\\lambda(1-p)}$"], a: 0, hint: "对 $N$ 分解求特征函数，结果形如 $e^{\\lambda(\\varphi_{Z_1}(\\eta)-1)}$。",
    exp: "$\\varphi_X(\\eta)=e^{\\lambda(\\varphi_{Z_1}(\\eta)-1)}=e^{\\lambda p(e^{i\\eta}-1)}$，正是 $\\mathrm{Poisson}_{\\lambda p}$ 的特征函数，由特征函数唯一确定分布即得。（书中 §2.5 · Example 2.5.4 · p.181）" },
  { id: "p1-r2-27", ch: 32, cat: "§2.5 多元正态", q: "设 $(X,Y)\\sim N_{0,C}$，$C=\\begin{pmatrix}1&1\\\\1&2\\end{pmatrix}$。$2X-Y$ 的分布是？", opts: ["$N_{0,2}$", "$N_{0,6}$", "$N_{0,10}$", "$N_{0,4}$"], a: 0, hint: "线性变换 $\\alpha X+\\beta$ 的协方差矩阵是 $\\alpha C\\alpha^*$。",
    exp: "取 $\\alpha=(2,-1)$，$\\alpha C\\alpha^*=4\\cdot1-2\\cdot2\\cdot1+2=2$，故 $2X-Y\\sim N_{0,2}$；$6$ 漏掉了交叉项，$10$ 把交叉项符号弄反了。（书中 §2.5 · Prop 2.5.15 · p.188）" },
  { id: "p1-r2-28", ch: 32, cat: "§2.5 不相关与独立", q: "$X\\sim N_{0,1}$，$Z\\sim\\tfrac12(\\delta_{-1}+\\delta_1)$ 独立，$Y=ZX$。下列哪个正确？", opts: ["$Y\\sim N_{0,1}$，$X,Y$ 不相关但不独立", "$(X,Y)$ 是高斯向量，故 $X,Y$ 独立", "$Y\\sim N_{0,1}$ 且 $X,Y$ 独立", "$Y$ 不是正态，因为 $|Y|=|X|$"], a: 0, hint: "不相关推出独立需要的是联合正态，而不仅是边缘正态。",
    exp: "由对称性 $Y\\sim N_{0,1}$，$\\mathrm{cov}(X,Y)=E[Z]E[X^2]=0$，但 $|Y|=|X|$ 说明二者不独立；$(X,Y)$ 不是高斯向量（例如 $X+Y$ 以概率 $1/2$ 为 $0$），所以与 Prop 2.5.18 不矛盾。（书中 §2.5 · Example 2.5.19 · p.190）" },
  { id: "p1-r2-29", ch: 32, cat: "§2.5 联合特征函数与独立性", q: "$X,Y\\sim\\mathrm{Exp}_\\lambda$ 独立，$U=X+Y$，$V=X-Y$。下列哪个正确？", opts: ["$U,V$ 不相关，但不独立", "$U,V$ 独立", "$U,V$ 正相关", "$U,V$ 独立且 $V$ 的密度为 $\\tfrac\\lambda2e^{-\\lambda|v|}$"], a: 0, hint: "算 $\\mathrm{cov}(U,V)$，再检查 $\\varphi_{(U,V)}$ 是否等于 $\\varphi_U\\varphi_V$。",
    exp: "$\\mathrm{cov}(U,V)=\\mathrm{var}X-\\mathrm{var}Y=0$；但 $\\varphi_{(U,V)}(\\eta_1,\\eta_2)=\\frac{\\lambda}{\\lambda-i(\\eta_1+\\eta_2)}\\frac{\\lambda}{\\lambda-i(\\eta_1-\\eta_2)}$ 不等于 $\\frac{\\lambda^2}{(\\lambda-i\\eta_1)^2}\\frac{\\lambda^2}{\\lambda^2+\\eta_2^2}$，故不独立（直观上 $|V|\\le U$）。$V$ 的密度确是 Laplace 型，但独立性不成立。（书中 §5.2 · Exercise 5.2.7 · p.310）" },
  { id: "p1-r2-30", ch: 32, cat: "§2.5 联合特征函数与独立性", q: "$X,Y$ 独立同分布于 $\\mu=\\tfrac12(\\delta_{-1}+\\delta_1)$。关于 $X$ 与 $XY$，下列哪个正确？", opts: ["$XY\\sim\\mu$，且 $X$ 与 $XY$ 独立", "$XY\\sim\\mu$，但 $X$ 与 $XY$ 不独立", "$XY$ 与 $X$ 不独立，因为 $XY$ 依赖于 $X$", "$\\varphi_{XY}(\\eta)=\\cos^2\\eta$"], a: 0, hint: "计算 $\\varphi_{(X,XY)}(\\eta_1,\\eta_2)$ 并与边缘特征函数之积比较。",
    exp: "$\\varphi_{XY}=\\cos\\eta=\\varphi_X$，且 $\\varphi_{(X,XY)}(\\eta_1,\\eta_2)=\\cos\\eta_1\\cos\\eta_2$，由 Prop 2.5.11 二者独立。$XY$ 依赖于 $X$ 并不妨碍独立；$\\cos^2\\eta$ 是 $X+Y$ 的特征函数。（书中 §5.2 · Exercise 5.2.9 · p.313）" },
  { id: "p1-r2-31", ch: 32, cat: "§2.6 最大值与最小值", q: "$X_i\\sim\\mathrm{Geom}_{p_i}$（$i=1,2$）独立，则 $\\min\\{X_1,X_2\\}$ 服从？", opts: ["$\\mathrm{Geom}_{p_1+p_2-p_1p_2}$", "$\\mathrm{Geom}_{p_1p_2}$", "$\\mathrm{Geom}_{p_1+p_2}$", "$\\mathrm{Geom}_{\\max\\{p_1,p_2\\}}$"], a: 0, hint: "用 $(\\min>n)=(X_1>n)\\cap(X_2>n)$ 计算尾概率。",
    exp: "$P(\\min>n)=(1-p_1)^n(1-p_2)^n=(1-p)^n$，其中 $1-p=(1-p_1)(1-p_2)$，即 $p=p_1+p_2-p_1p_2$；$p_1+p_2$ 可能大于 $1$，显然不对。（书中 §2.6 · Exercise 2.6.12 · p.202）" },
  { id: "p1-r2-32", ch: 32, cat: "§2.6 独立和的分布", q: "$X_1,\\dots,X_n\\sim N_{0,1}$ 独立，$Z=X_1^2+\\cdots+X_n^2$ 的分布是？（$\\mathrm{Gamma}_{\\alpha,\\lambda}$ 密度 $\\propto x^{\\alpha-1}e^{-\\lambda x}$）", opts: ["$\\mathrm{Gamma}_{n/2,1/2}$", "$\\mathrm{Gamma}_{n,1/2}$", "$\\mathrm{Gamma}_{n/2,1}$", "$N_{n,2n}$"], a: 0, hint: "先确定 $X_1^2$ 的分布，再用同一 $\\lambda$ 的独立 Gamma 变量之和的规律。",
    exp: "$X_1^2\\sim\\mathrm{Gamma}_{1/2,1/2}$，且 $\\mathrm{Gamma}_{\\alpha,\\lambda}*\\mathrm{Gamma}_{\\beta,\\lambda}=\\mathrm{Gamma}_{\\alpha+\\beta,\\lambda}$，故 $Z\\sim\\mathrm{Gamma}_{n/2,1/2}=\\chi^2(n)$，均值为 $n$；$\\mathrm{Gamma}_{n,1/2}$ 均值 $2n$，$\\mathrm{Gamma}_{n/2,1}$ 均值 $n/2$；$Z\\ge0$ 不可能是正态。（书中 §2.6 · Example 2.6.7 · p.200）" },
  { id: "p1-r3-1", ch: 33, cat: "§3.1 收敛方式", q: "设 $X_n,X$ 定义在同一概率空间上。下列蕴含关系中，哪一个一般**不**成立？", opts: ["依概率收敛 $\\Rightarrow$ 几乎必然收敛", "$L^p$ 收敛($p\\ge1$)$\\Rightarrow$ 依概率收敛", "几乎必然收敛 $\\Rightarrow$ 依分布收敛", "依分布收敛到常数 $c$ $\\Rightarrow$ 依概率收敛"], a: 0, hint: "回忆 Thm 3.1.9 的图示：哪条箭头只对子列成立？",
