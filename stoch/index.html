const KP = {
  "r1-gaussian-vector-indep": {"t": "高斯向量：不相关即独立", "b": "若 $(X_1,\\dots,X_n)$ 作为整体是高斯向量，其联合分布由均值向量和协方差矩阵完全决定，因此各分量（或各分块）两两不相关就等价于相互独立。前提不可省：两个各自服从正态分布的变量可以不相关却不独立，例如 $X$ 与 $\\varepsilon X$，其中 $\\varepsilon=\\pm1$ 等概率且独立于 $X$。"},
  "r1-bm-gaussian-scaling": {"t": "布朗运动的协方差与不变性", "b": "从 0 出发的布朗运动就是协方差为 $K(s,t)=s\\wedge t$ 的中心高斯过程，且路径连续。因此判断由 $B$ 变换得到的连续过程是否仍是布朗运动，只需验证它是中心高斯过程且协方差仍为 $s\\wedge t$。由此得到：$-B$、$(B_{s+t}-B_s)_{t\\ge0}$、时间反演 $tB_{1/t}$ 都是布朗运动；尺度变换时，时间放大 $c$ 倍，空间须缩小 $\\sqrt c$ 倍。"},
  "r1-bm-path-regularity": {"t": "布朗运动路径的正则性", "b": "由 Kolmogorov 连续性准则，布朗运动的路径几乎必然对每个 $\\alpha<1/2$ 都是局部 $\\alpha$-Hölder 连续的，指数 $1/2$ 是临界值。另一方面，划分加细时平方增量和 $\\sum_i(B_{t_i}-B_{t_{i-1}})^2\\to t$，所以路径在任何区间上都不是有界变差的；路径还几乎必然处处不可微。"},
  "r1-reflection-principle": {"t": "反射原理与首达时", "b": "记 $S_t=\\sup_{s\\le t}B_s$。对 $a\\ge0$、$b\\le a$，有 $P(S_t\\ge a,\\ B_t\\le b)=P(B_t\\ge 2a-b)$：在首达 $a$ 的时刻把之后的路径关于 $a$ 翻转（依据强马氏性）。推论：$S_t$ 与 $|B_t|$ 同分布；对 $a>0$，$P(T_a\\le t)=P(|B_t|\\ge a)$，故 $T_a$ 几乎必然有限，密度为 $\\frac{a}{\\sqrt{2\\pi t^3}}e^{-a^2/2t}$，尾部 $P(T_a>t)$ 只按 $t^{-1/2}$ 衰减。"},
  "r1-stopping-time": {"t": "停时及其运算", "b": "$T$ 是停时，指对每个 $t$，事件 $\\{T\\le t\\}\\in\\mathcal F_t$：是否已经停止只能依赖到当前为止的信息（允许 $T=\\infty$）。停时对取 $\\wedge$、$\\vee$、相加以及加上非负常数都封闭，可数个停时的上确界也是停时；而把停时往前平移需要预知未来，一般不再是停时。"},
  "r1-optional-stopping": {"t": "可选停止定理及其条件", "b": "设 $X$ 是右连续鞅，$T$ 是停时。若 $T$ 有界，或 $T<\\infty$ a.s. 且停止过程 $X^T$ 一致可积（例如 $|X_{t\\wedge T}|\\le C$），则 $E[X_T]=E[X_0]$。条件不可省：只有单侧界的停止鞅一般不一致可积，结论可能失败。典型用法：对有界的停止鞅写出 $E[X_T]=E[X_0]$，把出口概率作为未知数解方程。"},
  "r1-quadratic-variation": {"t": "二次变差 $\\langle M,M\\rangle$", "b": "对连续局部鞅 $M$，$\\langle M,M\\rangle$ 是唯一从 0 出发的连续递增过程，使 $M^2-\\langle M,M\\rangle$ 为连续局部鞅；它也是划分加细时平方增量和的依概率极限。布朗运动的二次变差为 $t$，即 $B_t^2-t$ 是鞅。唯一性的根源：有限变差的连续局部鞅必为常数 $M_0$，因为它的二次变差为零。"},
  "r1-ito-formula": {"t": "Itô 公式", "b": "设 $X$ 是连续半鞅，$F\\in C^2$，则 $F(X_t)=F(X_0)+\\int_0^tF'(X_s)\\,dX_s+\\frac12\\int_0^tF''(X_s)\\,d\\langle X,X\\rangle_s$。与普通链式法则相比多出二阶项，原因是二次变差不为零；对布朗运动 $d\\langle B,B\\rangle_t=dt$。反过来可以用它把随机积分算成闭式，例如由 $F(x)=x^3$ 得 $\\int_0^tB_s^2\\,dB_s=\\frac13B_t^3-\\int_0^tB_s\\,ds$。"},
  "r1-ito-isometry": {"t": "Itô 等距", "b": "对布朗运动和满足 $E\\int_0^tH_s^2\\,ds<\\infty$ 的循序可测过程 $H$，随机积分 $\\int_0^tH_s\\,dB_s$ 是均值为 0 的平方可积鞅，且 $E[(\\int_0^tH_s\\,dB_s)^2]=E[\\int_0^tH_s^2\\,ds]$。于是随机积分的二阶矩化为普通积分：先求 $E[H_s^2]$，再对 $s$ 积分。例如 $E[(\\int_0^ts\\,dB_s)^2]=t^3/3$。"},
  "r1-exp-martingale-girsanov": {"t": "指数鞅与 Girsanov 换测度", "b": "对 $\\theta\\in\\mathbb R$，$\\mathcal E(\\theta B)_t=\\exp(\\theta B_t-\\frac{\\theta^2}{2}t)$ 是鞅：由 Itô 公式 $dZ_t=\\theta Z_t\\,dB_t$，补偿项恰好抵消二阶项，没有 $dt$ 项。以 $Z_T$ 为密度在 $\\mathcal F_T$ 上定义新测度 $Q$，Girsanov 定理断言 $B_t-\\langle B,\\theta B\\rangle_t$ 在 $Q$ 下是布朗运动：换测度只改变漂移，不改变二次变差。"},
  "r1-levy-characterization": {"t": "Lévy 刻画", "b": "若 $M$ 是连续局部鞅，$M_0=0$，且对所有 $t$ 有 $\\langle M,M\\rangle_t=t$，则 $M$ 是布朗运动（$d$ 维时要求 $\\langle M^i,M^j\\rangle_t=\\delta_{ij}t$）。要点是条件加在整条路径的二次变差上；只知道每个时刻的边缘分布或二阶矩，不能确定过程的联合分布，也推不出它是布朗运动。"},
  "r1-recurrence-transience": {"t": "布朗运动的常返与暂留", "b": "一维布朗运动是点常返的：几乎必然无穷多次回到每个点。$d=2$ 时是邻域常返的：几乎必然无穷多次进入任意非空开集，但几乎必然不碰到给定的其他点。$d\\ge3$ 时暂留：$|B_t|\\to\\infty$ a.s.。证明的关键是 $\\log|x|$（$d=2$）与 $|x|^{2-d}$（$d\\ge3$）在原点外调和。"},
  "r1-ornstein-uhlenbeck": {"t": "OU 过程：积分因子法", "b": "求解线性方程 $dX_t=dB_t-\\lambda X_t\\,dt$ 的技巧是乘积分因子：对 $e^{\\lambda t}X_t$ 用 Itô 公式（分部积分），漂移项相互抵消，只剩 $d(e^{\\lambda t}X_t)=e^{\\lambda t}\\,dB_t$，积分即得显式解。被积函数是确定性的，所以当 $X_0$ 为常数（或与 $B$ 独立的高斯变量）时 $X$ 是高斯过程；$\\lambda>0$ 时其分布收敛到 $N(0,\\frac{1}{2\\lambda})$。"},
  "r2-gaussian-space-process": {"t": "高斯空间与高斯过程", "b": "（中心）高斯空间是 $L^2(\\Omega,\\mathcal F,P)$ 中只含中心高斯变量的闭线性子空间；要求闭不会出问题，因为高斯变量的 $L^2$ 极限仍是高斯变量。过程 $(X_t)_{t\\in T}$ 称为中心高斯过程，指任意有限线性组合 $\\sum_ic_iX_{t_i}$ 都是中心高斯变量。仅要求每个 $X_t$ 是高斯变量远远不够。"},
  "r2-pre-bm-and-bm": {"t": "pre-BM 与布朗运动的定义", "b": "pre-Brownian motion 只是关于有限维分布的条件，以下表述等价：中心高斯过程且协方差为 $s\\wedge t$；$X_0=0$，增量独立且 $X_t-X_s\\sim N(0,t-s)$；等等。Le Gall 的布朗运动 = pre-Brownian motion + 所有样本路径连续。路径连续性不由有限维分布决定，其存在性来自 Kolmogorov 引理给出的连续修正。"},
  "r2-modification-indistinguishable": {"t": "修正与不可区分", "b": "$\\tilde X$ 是 $X$ 的修正，指对每个 $t$，$P(\\tilde X_t=X_t)=1$，例外零测集可以随 $t$ 改变；不可区分则要求 $P(\\forall t,\\ \\tilde X_t=X_t)=1$。不可区分推出修正，修正推出有限维分布相同，反之一般不成立。若两者路径都右连续（或都左连续），先在可数稠密集上合并零测集，再由路径连续性延拓，二者便等价。"},
  "r2-stopping-time-def": {"t": "停时与 $(\\mathcal F_{t+})$-停时", "b": "$T:\\Omega\\to[0,\\infty]$ 是 $(\\mathcal F_t)$-停时，指对每个 $t\\ge0$，$\\{T\\le t\\}\\in\\mathcal F_t$。若改为对每个 $t>0$ 要求 $\\{T<t\\}\\in\\mathcal F_t$，得到的恰是 $(\\mathcal F_{t+})$-停时，因为 $\\{T\\le t\\}=\\bigcap_n\\{T<t+\\frac1n\\}$。每个停时都满足后一条件；滤子右连续时两者一致。"},
  "r2-sigma-field-ft": {"t": "停时前的 σ-代数 $\\mathcal F_T$", "b": "对停时 $T$，$\\mathcal F_T$ 由满足下述条件的 $A\\in\\mathcal F_\\infty$ 组成：对每个 $t\\ge0$，$A\\cap\\{T\\le t\\}\\in\\mathcal F_t$，直观上是“到时刻 $t$ 能判断是否已停止且 $A$ 已发生”。把 $\\{T\\le t\\}$ 换成 $\\{T<t\\}$ 得到一般更大的 $\\mathcal F_{T+}$。常用性质：$T$ 是 $\\mathcal F_T$-可测的；$S\\le T$ 时 $\\mathcal F_S\\subset\\mathcal F_T$。"},
  "r2-complete-filtration": {"t": "完备滤子与通常条件", "b": "记 $\\mathcal N$ 为 $(\\Omega,\\mathcal F_\\infty,P)$ 中的可略集全体。若 $\\mathcal N\\subset\\mathcal F_0$（从而含于每个 $\\mathcal F_t$），称滤子完备；若对所有 $t$ 有 $\\mathcal F_{t+}=\\mathcal F_t$，称滤子右连续。注意可略集是相对 $\\mathcal F_\\infty$ 而言的。滤子完备且右连续时，鞅有 càdlàg 修正，且 $(\\mathcal F_{t+})$-停时就是停时。"},
  "r2-progressive": {"t": "循序可测过程", "b": "过程 $X$ 称为循序可测（progressive），指对每个 $t$，映射 $(\\omega,s)\\mapsto X_s(\\omega)$ 限制在 $\\Omega\\times[0,t]$ 上关于 $\\mathcal F_t\\otimes\\mathcal B([0,t])$ 可测。它同时蕴含适应与联合可测，但“适应 + 可测”一般推不出它。常用充分条件：适应且路径右连续（或左连续）的过程是循序可测的，证明用分段常值的离散逼近。"},
  "r2-martingale-def": {"t": "鞅、上鞅、下鞅的定义", "b": "适应过程 $X$ 若对每个 $t$ 有 $X_t\\in L^1$，且对 $s<t$ 有 $E[X_t\\mid\\mathcal F_s]=X_s$，称为鞅；把等号换成 $\\le$ 是上鞅，换成 $\\ge$ 是下鞅。定义中不含任何路径正则性要求，càdlàg 修正是后来在完备、右连续滤子下证明的。记忆：上鞅的期望随时间递减，像一个对你不利的赌局。"},
  "r2-ft-brownian-motion": {"t": "$(\\mathcal F_t)$-布朗运动", "b": "$B$ 称为 $(\\mathcal F_t)$-布朗运动，指 $B$ 是布朗运动、适应于 $(\\mathcal F_t)$，并且对 $s<t$，增量 $B_t-B_s$ 独立于 $\\mathcal F_s$。只有适应性不够，因为滤子可能“偷看”未来：例如取 $\\mathcal F_t=\\sigma(B_r,r\\le t+1)$，$B$ 仍是适应的，但增量不独立于 $\\mathcal F_s$，$B$ 也不再是 $(\\mathcal F_t)$-鞅。"},
  "r2-closed-martingale": {"t": "闭鞅", "b": "鞅 $(X_t)_{t\\ge0}$ 称为闭的，指存在 $Z\\in L^1$，使对所有 $t$，$X_t=E[Z\\mid\\mathcal F_t]$，即在 $t=\\infty$ 处被一个可积变量“封住”。对右连续鞅，闭等价于一致可积，也等价于 $t\\to\\infty$ 时几乎必然且在 $L^1$ 中收敛，此时可取 $Z=X_\\infty$。仅在 $L^1$ 中有界是不够的。"},
  "r2-finite-variation": {"t": "有限变差函数与过程", "b": "Le Gall 的约定：连续函数 $a:[0,T]\\to\\mathbb R$ 有有限变差，指 $a(0)=0$ 且存在 $[0,T]$ 上的有符号测度 $\\mu$ 使 $a(t)=\\mu([0,t])$（由连续性，$\\mu$ 无原子）。有限变差过程是适应过程，且所有样本路径都是这种函数（在每个 $[0,T]$ 上），因此路径自动连续且从 0 出发；路径还递增时称为递增过程。"},
  "r2-local-martingale-def": {"t": "连续局部鞅的定义", "b": "设适应连续过程 $M$ 满足 $M_0=0$。若存在不减的停时列 $(T_n)$，对每个 $\\omega$ 都有 $T_n(\\omega)\\uparrow\\infty$，且每个停止过程 $M^{T_n}$ 都是一致可积鞅，则称 $M$ 为连续局部鞅，$(T_n)$ 称为约化序列。一般情形下，称 $M$ 为连续局部鞅是指 $M_t-M_0$ 如此，因此不要求 $M_0$ 可积。"},
  "r2-quadratic-variation": {"t": "二次变差的存在唯一性", "b": "对连续局部鞅 $M$，存在唯一（在不可区分意义下）的递增过程 $\\langle M,M\\rangle$，使 $M^2-\\langle M,M\\rangle$ 是连续局部鞅。并且沿网格趋于 0 的划分，平方增量和依概率收敛到 $\\langle M,M\\rangle_t$。可以把它理解为让 $M^2$ 成为局部鞅所需的补偿项；对布朗运动它就是 $t$。"},
  "r2-bracket-orthogonal": {"t": "括号与正交", "b": "两个连续局部鞅的括号用极化恒等式定义：$\\langle M,N\\rangle=\\frac12(\\langle M+N,M+N\\rangle-\\langle M,M\\rangle-\\langle N,N\\rangle)$。它是唯一使 $MN-\\langle M,N\\rangle$ 为连续局部鞅的有限变差过程，并且对称、双线性。若 $\\langle M,N\\rangle=0$，等价地 $MN$ 是连续局部鞅，就称 $M,N$ 正交；两个独立的 $(\\mathcal F_t)$-布朗运动是正交的。"},
  "r2-semimartingale-bracket": {"t": "连续半鞅的括号", "b": "连续半鞅 $X=M+A$（$M$ 为连续局部鞅，$A$ 为有限变差过程）的分解是唯一的，因为有限变差的连续局部鞅只能是零。对另一个半鞅 $Y=M'+A'$，定义 $\\langle X,Y\\rangle=\\langle M,M'\\rangle$：有限变差部分对括号没有贡献，在平方和的离散逼近中，含有它们的项都趋于 0。"},
  "r2-h2-space": {"t": "空间 $\\mathbb H^2$", "b": "$\\mathbb H^2$ 是满足 $M_0=0$ 且在 $L^2$ 中有界（$\\sup_tE[M_t^2]<\\infty$）的连续鞅全体；等价地，它由 $M_0=0$ 且 $E[\\langle M,M\\rangle_\\infty]<\\infty$ 的连续局部鞅组成。配上内积 $(M,N)_{\\mathbb H^2}=E[\\langle M,N\\rangle_\\infty]=E[M_\\infty N_\\infty]$，它是 Hilbert 空间，是构造随机积分的出发点。"},
  "r2-elementary-process": {"t": "初等过程", "b": "初等过程形如 $H_s=\\sum_{i=0}^{p-1}H_{(i)}\\mathbf 1_{(t_i,t_{i+1}]}(s)$，其中 $0=t_0<t_1<\\dots<t_p$，每个 $H_{(i)}$ 是有界且 $\\mathcal F_{t_i}$-可测的随机变量。区间左开右闭、系数在左端点时刻可测，体现“下注只能用当时已知的信息”。对 $M\\in\\mathbb H^2$，定义 $(H\\cdot M)_t=\\sum_iH_{(i)}(M_{t_{i+1}\\wedge t}-M_{t_i\\wedge t})$。"},
  "r2-integrand-classes": {"t": "被积过程的可积类", "b": "对连续局部鞅 $M$：$L^2(M)$ 由满足 $E[\\int_0^\\infty H_s^2\\,d\\langle M,M\\rangle_s]<\\infty$ 的循序可测过程组成；$L^2_{loc}(M)$ 只要求对每个 $t$，几乎必然 $\\int_0^tH_s^2\\,d\\langle M,M\\rangle_s<\\infty$。对连续半鞅 $X=M+V$ 积分时，取局部有界的循序可测过程 $H$，令 $H\\cdot X=H\\cdot M+H\\cdot V$；局部有界保证两部分都有意义。"},
  "r2-transition-semigroup": {"t": "转移半群与 Feller 半群", "b": "转移半群 $(Q_t)_{t\\ge0}$ 是一族转移核，满足三条：$Q_0(x,\\cdot)=\\delta_x$；Chapman–Kolmogorov 方程 $Q_{t+s}=Q_tQ_s$；$(t,x)\\mapsto Q_t(x,A)$ 联合可测。Feller 半群另外要求：对每个 $f\\in C_0(E)$，$Q_tf\\in C_0(E)$，且 $t\\to0$ 时 $\\|Q_tf-f\\|\\to0$（一致范数）。“保持 $C_0(E)$”不属于一般转移半群的定义。"},
  "r2-markov-process-def": {"t": "马尔可夫过程的定义", "b": "适应过程 $X$ 称为以 $(Q_t)$ 为转移半群的 $(\\mathcal F_t)$-马尔可夫过程，指对所有 $s,t\\ge0$ 和有界可测函数 $f$，$E[f(X_{s+t})\\mid\\mathcal F_s]=Q_tf(X_s)$。左边条件化的是整个过去，右边只依赖当前位置 $X_s$ 与时间差 $t$。特别地，取 $s=0$ 再求期望得 $E[f(X_t)]=E[Q_tf(X_0)]$。"},
  "r2-sde-solution-notions": {"t": "SDE 的解与唯一性概念", "b": "对方程 $E(\\sigma,b)$：弱存在指能找到某个带滤子的概率空间和布朗运动使解存在；弱唯一指初值相同的解同分布；轨道唯一指在同一空间、同一布朗运动 $B$ 下，$X_0=X'_0$ a.s. 的两个解不可区分。$E_x(\\sigma,b)$ 的解称为强解，指它适应于 $B$ 的完备自然滤子，即解由驱动的布朗运动“决定”。"},
  "r2-tanaka-formula": {"t": "Tanaka 公式", "b": "对连续半鞅 $X$ 与 $a\\in\\mathbb R$，存在递增过程 $L^a_t$（局部时，只在 $\\{X_t=a\\}$ 上增加），使 $|X_t-a|=|X_0-a|+\\int_0^t\\mathrm{sgn}(X_s-a)\\,dX_s+L^a_t$，这里约定 $\\mathrm{sgn}(0)=-1$。结合 $|x|=x^++x^-$ 与 $x=x^+-x^-$，正部与负部的公式各分得一半局部时；正部公式中的被积函数是 $\\mathbf 1_{\\{X_s>a\\}}$。"},
  "r3-gaussian-orthogonal-indep": {"t": "高斯空间中正交即独立", "b": "设 $H$ 是中心高斯空间，$(H_i)_{i\\in I}$ 是 $H$ 的一族线性子空间，则各 $H_i$ 在 $L^2$ 中两两正交当且仅当 σ-代数 $\\sigma(H_i)$ 相互独立。关键前提是所有 $H_i$ 位于同一个高斯空间内；若变量只是各自服从高斯分布，联合起来不一定是高斯向量（如 $X$ 与 $\\varepsilon X$），不相关就推不出独立。"},
  "r3-kolmogorov-lemma": {"t": "Kolmogorov 连续性引理", "b": "设 $I$ 是有界区间，$X$ 取值于完备度量空间 $(E,d)$，且存在 $q,\\varepsilon,C>0$ 使 $E[d(X_s,X_t)^q]\\le C|t-s|^{1+\\varepsilon}$，则 $X$ 有一个修正，其路径对每个 $\\alpha\\in(0,\\varepsilon/q)$ 都是 $\\alpha$-Hölder 连续的。用法：先算出增量矩的阶并写成 $1+\\varepsilon$ 的形式，再让 $q$ 变动，取所得 Hölder 指数的上确界。"},
  "r3-blumenthal": {"t": "Blumenthal 0-1 律", "b": "对布朗运动的自然滤子，$\\mathcal F_{0+}=\\bigcap_{t>0}\\mathcal F_t$ 是平凡的：其中每个事件的概率为 0 或 1。它刻画的是“紧接在时刻 0 之后”的信息。典型推论：几乎必然对每个 $\\varepsilon>0$，$\\sup_{s\\le\\varepsilon}B_s>0$ 且 $\\inf_{s\\le\\varepsilon}B_s<0$，从而布朗运动在 0 附近无穷多次穿越 0。"},
  "r3-qv-approximation": {"t": "二次变差的离散逼近", "b": "对布朗运动，沿网格趋于 0 的划分，平方增量和 $\\sum_i(B_{t_i}-B_{t_{i-1}})^2$ 在 $L^2$ 中收敛到 $t$（直接计算差的二阶矩即得），由此路径在任何区间上都不是有限变差。对一般连续局部鞅 $M$，平方增量和收敛到 $\\langle M,M\\rangle_t$ 只能保证依概率收敛，因为 $M$ 未必有二阶矩。"},
  "r3-bm-strong-markov": {"t": "布朗运动的强马氏性", "b": "设 $T$ 是停时且 $P(T<\\infty)>0$。在条件概率 $P(\\cdot\\mid T<\\infty)$ 下，过程 $B^{(T)}_t=\\mathbf 1_{\\{T<\\infty\\}}(B_{T+t}-B_T)$ 是布朗运动，并且独立于 $\\mathcal F_T$。要点：必须减去 $B_T$ 才能从 0 重新出发；与之独立的是停时之前的全部信息。反射原理就是它的直接应用。"},
  "r3-reflection-principle": {"t": "反射原理与首达时分布", "b": "记 $S_t=\\sup_{s\\le t}B_s$。对 $a\\ge0$、$b\\le a$，$P(S_t\\ge a,\\ B_t\\le b)=P(B_t\\ge2a-b)$：首达 $a$ 后把路径关于 $a$ 翻转，$b$ 的像是 $2a-b$。取 $b=a$ 可得 $S_t$ 与 $|B_t|$ 同分布；对 $a>0$，$P(T_a\\le t)=P(|B_t|\\ge a)$，再用 $B_t\\overset{d}{=}\\sqrt t\\,B_1$ 即可求出 $T_a$ 的分布，其密度为 $\\frac{a}{\\sqrt{2\\pi t^3}}e^{-a^2/2t}$。"},
  "r3-doob-inequalities": {"t": "Doob 极大不等式与 $L^p$ 不等式", "b": "设 $X$ 路径右连续。若 $X$ 是上鞅，则对 $\\lambda>0$，$\\lambda P(\\sup_{s\\le t}|X_s|>\\lambda)\\le E|X_0|+2E|X_t|$；鞅的情形右边可改为 $E|X_t|$。若 $X$ 是鞅且 $p>1$，则 $E[\\sup_{s\\le t}|X_s|^p]\\le(\\frac{p}{p-1})^pE|X_t|^p$，$p=2$ 时常数为 4；$p=1$ 时没有这样的不等式。"},
  "r3-martingale-convergence": {"t": "鞅收敛与闭鞅刻画", "b": "右连续上鞅若在 $L^1$ 中有界，则 $t\\to\\infty$ 时几乎必然收敛到某个 $X_\\infty\\in L^1$，但不一定在 $L^1$ 中收敛。对右连续鞅，以下三者等价：闭鞅（$X_t=E[Z\\mid\\mathcal F_t]$）；一致可积；几乎必然且在 $L^1$ 中收敛。反例：$e^{B_t-t/2}$ 是正鞅，在 $L^1$ 中有界、几乎必然收敛到 0，却不一致可积。"},
  "r3-optional-stopping": {"t": "可选停止定理（连续时间）", "b": "若 $X$ 是一致可积的右连续鞅，$S\\le T$ 是停时（可以取 $\\infty$，此时 $X_\\infty$ 为极限），则 $X_S=E[X_T\\mid\\mathcal F_S]$；若 $S\\le T$ 有界，则对任意右连续鞅成立。推论：停止过程 $X^T$ 总是鞅，$X$ 一致可积时 $X^T$ 也一致可积。对非负右连续上鞅，非负性可代替一致可积，但只得到不等式 $Z_U\\ge E[Z_V\\mid\\mathcal F_U]$（$U\\le V$）。"},
  "r3-local-martingale-properties": {"t": "连续局部鞅的基本性质", "b": "三条常用性质：非负连续局部鞅若 $M_0\\in L^1$，由 Fatou 引理是上鞅；若存在 $Z\\in L^1$ 使对所有 $t$ 有 $|M_t|\\le Z$，则 $M$ 是一致可积鞅，而仅仅可积或在 $L^1$ 中有界都不够；若 $M$ 同时是有限变差过程（按约定从 0 出发），则 $M\\equiv0$，这保证了半鞅分解的唯一性。"},
  "r3-l2-bounded-criterion": {"t": "$L^2$ 有界鞅的括号判据", "b": "设 $M$ 是连续局部鞅，$M_0\\in L^2$。则 $M$ 是 $L^2$ 有界的真鞅当且仅当 $E[\\langle M,M\\rangle_\\infty]<\\infty$，此时 $M^2-\\langle M,M\\rangle$ 是一致可积鞅，且 $E[M_\\infty^2]=E[M_0^2]+E[\\langle M,M\\rangle_\\infty]$。有限时间版本：$M$ 是每个 $M_t$ 都平方可积的真鞅，当且仅当对每个 $t$，$E[\\langle M,M\\rangle_t]<\\infty$。"},
  "r3-kunita-watanabe": {"t": "Kunita–Watanabe 不等式", "b": "设 $M,N$ 是连续局部鞅，$H,K$ 是可测过程，则几乎必然有 $\\int_0^\\infty|H_s||K_s|\\,|d\\langle M,N\\rangle_s|\\le(\\int_0^\\infty H_s^2\\,d\\langle M,M\\rangle_s)^{1/2}(\\int_0^\\infty K_s^2\\,d\\langle N,N\\rangle_s)^{1/2}$。它是括号形式的 Cauchy–Schwarz 不等式，对每条路径成立，不需要取期望；取 $H=K=1$ 即得括号的全变差被两个二次变差的几何平均控制。"},
  "r3-stochastic-integral-char": {"t": "随机积分的括号刻画与等距", "b": "对 $M\\in\\mathbb H^2$、$H\\in L^2(M)$，$H\\cdot M$ 是 $\\mathbb H^2$ 中唯一满足 $\\langle H\\cdot M,N\\rangle=H\\cdot\\langle M,N\\rangle$（对所有 $N\\in\\mathbb H^2$）的元素；取 $N=H\\cdot M$ 得 $\\langle H\\cdot M,H\\cdot M\\rangle=H^2\\cdot\\langle M,M\\rangle$，所以 $H\\mapsto H\\cdot M$ 是 $L^2(M)\\to\\mathbb H^2$ 的等距。推广到连续局部鞅 $M$ 与 $H\\in L^2_{loc}(M)$ 时，$H\\cdot M$ 是初值为 0、对所有连续局部鞅 $N$ 满足同一关系的唯一连续局部鞅，一般不是真鞅。"},
  "r3-riemann-sums": {"t": "随机积分的 Riemann 和逼近", "b": "若 $H$ 适应且路径连续，$X$ 是连续半鞅，则沿网格趋于 0 的划分，取左端点的和 $\\sum_iH_{t_i}(X_{t_{i+1}}-X_{t_i})$ 依概率收敛到 $\\int_0^tH_s\\,dX_s$。取左端点体现“只用过去的信息下注”；若改取两端点的平均，在 $H$ 也是半鞅时会得到 Stratonovich 积分，它与 Itô 积分相差 $\\frac12\\langle H,X\\rangle_t$。"},
  "r3-ito-formula": {"t": "多维 Itô 公式", "b": "设 $X^1,\\dots,X^p$ 是连续半鞅，$F\\in C^2(\\mathbb R^p)$，则 $F(X_t)=F(X_0)+\\sum_i\\int_0^t\\partial_iF(X_s)\\,dX^i_s+\\frac12\\sum_{i,j}\\int_0^t\\partial_{ij}F(X_s)\\,d\\langle X^i,X^j\\rangle_s$。二次连续可微这一条件不能随意减弱，因为公式里出现二阶偏导；对 $|x|$ 这类只是凸的函数，需要用局部时修正，即 Tanaka 公式。"},
  "r3-stochastic-exponential": {"t": "随机指数 $\\mathcal E(L)$", "b": "对连续局部鞅 $M$ 与 $\\lambda\\in\\mathbb C$，$\\mathcal E^\\lambda(M)_t=\\exp(\\lambda M_t-\\frac{\\lambda^2}{2}\\langle M,M\\rangle_t)$ 是复值连续局部鞅，满足 $dZ=\\lambda Z\\,dM$（由 Itô 公式，括号项恰好抵消二阶项），但一般不是真鞅。反过来，严格正的连续局部鞅 $D$ 都能写成 $D=\\exp(L-\\frac12\\langle L,L\\rangle)$，其中连续局部鞅 $L$ 由 $dL=D^{-1}dD$ 和初值 $\\log D_0$ 确定。"},
  "r3-levy-characterization": {"t": "Lévy 刻画（$d$ 维）", "b": "$d$ 维适应连续过程 $X$（$X_0=0$）是 $(\\mathcal F_t)$-布朗运动，当且仅当每个分量都是连续局部鞅，且 $\\langle X^i,X^j\\rangle_t=\\delta_{ij}t$。仅知道各分量分别是一维布朗运动是不够的：分量之间可能相关，例如 $(B,B)$。证明的思路是用 Itô 公式验证 $\\exp(i\\xi\\cdot X_t+\\frac{|\\xi|^2}{2}t)$ 是鞅，从而得到增量的条件特征函数。"},
  "r3-dds-time-change": {"t": "DDS 时间变换定理", "b": "Dambis–Dubins–Schwarz：设 $M$ 是连续局部鞅，$M_0=0$，且 $\\langle M,M\\rangle_\\infty=\\infty$ a.s.。令 $\\tau_r=\\inf\\{t:\\langle M,M\\rangle_t>r\\}$，则 $\\beta_r=M_{\\tau_r}$ 是（关于时变滤子 $(\\mathcal F_{\\tau_r})$ 的）布朗运动，并且 $M_t=\\beta_{\\langle M,M\\rangle_t}$。也就是说，连续局部鞅都是时间变换后的布朗运动；条件 $\\langle M,M\\rangle_\\infty=\\infty$ 保证每个 $\\tau_r$ 都有限。"},
  "r3-bdg-inequality": {"t": "BDG 不等式", "b": "对每个 $p>0$，存在只依赖 $p$ 的常数 $0<c_p\\le C_p$，使对任意 $M_0=0$ 的连续局部鞅 $M$ 与停时 $T$，有 $c_pE[\\langle M,M\\rangle_T^{p/2}]\\le E[(M^*_T)^p]\\le C_pE[\\langle M,M\\rangle_T^{p/2}]$，其中 $M^*_T=\\sup_{t\\le T}|M_t|$。与 Doob 不等式不同，它对 $p\\le1$ 也成立。典型应用：取 $p=1$，用二次变差控制 $E[M^*_\\infty]$，从而得到一致可积性。"},
  "r3-martingale-representation": {"t": "布朗鞅表示定理", "b": "设滤子是布朗运动 $B$ 的完备自然滤子。则每个 $Z\\in L^2(\\Omega,\\mathcal F_\\infty,P)$ 可唯一写成 $Z=E[Z]+\\int_0^\\infty h_s\\,dB_s$，其中 $h\\in L^2(B)$。推论：在这个滤子下，每个连续局部鞅都等于常数加上关于 $B$ 的随机积分。若滤子中含有与 $B$ 无关的额外随机性，结论一般失败。"},
  "r3-girsanov-novikov": {"t": "Girsanov 换测度定理", "b": "设 $P,Q$ 在 $\\mathcal F_\\infty$ 上互相绝对连续，密度过程 $D_t=\\frac{dQ}{dP}|_{\\mathcal F_t}$ 连续，写成 $D=\\mathcal E(L)$。若 $M$ 是 $P$ 下的连续局部鞅，则 $M-\\langle M,L\\rangle$ 是 $Q$ 下的连续局部鞅。反过来，要用给定的 $L$（$L_0=0$）构造 $Q$，需要 $\\mathcal E(L)$ 是一致可积鞅；Novikov 判据 $E[\\exp(\\frac12\\langle L,L\\rangle_\\infty)]<\\infty$ 是最常用的充分条件，它蕴含 Kazamaki 判据。"},
  "r3-feller-strong-markov": {"t": "Feller 过程的强马氏性", "b": "设 $(Q_t)$ 是 Feller 半群，$X$ 是以它为转移半群、路径 càdlàg 的马尔可夫过程，$T$ 是 $(\\mathcal F_{t+})$-停时（比 $(\\mathcal F_t)$-停时更一般）。则在 $\\{T<\\infty\\}$ 上，给定 $\\mathcal F_T$，过程 $(X_{T+t})_{t\\ge0}$ 的条件分布就是从 $X_T$ 出发的同一马尔可夫过程的分布。简单马氏性只对确定时刻成立；Feller 性用于从离散化停时取极限。"},
  "r3-lipschitz-sde": {"t": "Lipschitz SDE 的强解", "b": "若 $\\sigma,b$ 在 $\\mathbb R_+\\times\\mathbb R^d$ 上连续，且关于 $x$ 一致 Lipschitz：$|\\sigma(t,x)-\\sigma(t,y)|+|b(t,x)-b(t,y)|\\le K|x-y|$，则 $E(\\sigma,b)$ 有轨道唯一性，且对每个初值都存在强解。证明思路：用 Picard 迭代构造解，用 Doob 不等式与 Gronwall 引理控制相邻两次迭代的差。"},
  "r3-yamada-watanabe": {"t": "Yamada–Watanabe 定理", "b": "Yamada–Watanabe：弱存在加上轨道唯一，推出弱唯一，并且在任何配有布朗运动的空间上都存在强解。反方向不成立，经典例子是 $dX_t=\\mathrm{sgn}(X_t)\\,dB_t$：由 Lévy 刻画，任何解都是布朗运动，所以弱存在与弱唯一成立；但从 0 出发时 $X$ 与 $-X$ 是同一 $B$ 驱动的两个解，轨道唯一失败，也不存在强解。"},
  "r3-occupation-density": {"t": "占位密度公式与 Trotter 定理", "b": "对连续半鞅 $X$，局部时 $a\\mapsto L^a_t(X)$ 是 $\\langle X,X\\rangle$ 的占位密度：对非负可测 $\\varphi$，几乎必然对所有 $t$，$\\int_0^t\\varphi(X_s)\\,d\\langle X,X\\rangle_s=\\int_{\\mathbb R}\\varphi(a)L^a_t(X)\\,da$。一般只能取到关于 $a$ 为 càdlàg 的版本；对布朗运动（$d\\langle B,B\\rangle_s=ds$），Trotter 定理给出关于 $(a,t)$ 联合连续的版本。"},
  "r3-levy-sup-local-time": {"t": "Lévy 定理：最大值与局部时", "b": "记 $S_t=\\sup_{s\\le t}B_s$。Lévy 定理断言二维过程 $(S_t,S_t-B_t)_{t\\ge0}$ 与 $(L^0_t(B),|B_t|)_{t\\ge0}$ 同分布：递增的分量对应局部时，非负的反射分量对应 $|B|$。证明用 Skorokhod 引理：Tanaka 公式把 $|B|$ 写成一个布朗运动加上只在零点增加的递增过程。推论：$L^0_t$、$S_t$、$|B_t|$ 同分布。"},
  "qi1-first-step-analysis": {"t": "首步分析", "b": "求期望步数或获胜概率时，按第一步的结果分情况讨论，利用“重新开始”的马尔可夫性把问题化回自身（或少数几个状态），得到线性方程。例如独立重复试验每次成功概率为 $p$，首次成功所需次数的期望 $m$ 满足 $m=1+(1-p)m$，故 $m=1/p$。轮流进行的游戏也一样：一轮过后若无人获胜，局面与开始时完全相同。"},
  "qi1-pattern-waiting-time": {"t": "等待模式出现：状态法", "b": "等待硬币序列中首次出现某个模式时，以“当前已匹配的最长前缀”为状态，对每个状态列首步方程。关键是失败后退回哪个状态：模式的前缀与后缀若有重叠，失败时损失的进度不同，期望也不同。Conway 公式：公平硬币下期望等于 $\\sum 2^k$，对所有满足“长为 $k$ 的前缀等于长为 $k$ 的后缀”的 $k$ 求和，例如 HTH 为 $2^3+2^1=10$。"},
  "qi1-conditional-bayes": {"t": "条件概率与贝叶斯公式", "b": "条件概率 $P(A\\mid B)=P(A\\cap B)/P(B)$：在条件允许的等可能情形中计数，务必精确理解条件（“至少一个”与“指定的那一个”不同）。贝叶斯公式 $P(A\\mid B)=\\frac{P(B\\mid A)P(A)}{P(B)}$ 把先验与似然结合；基础率很低时，即使检验很准，阳性的后验概率也可能不高。知情者的行为本身也携带信息，要把它纳入条件。"},
  "qi1-linearity-of-expectation": {"t": "期望的线性性：拆分求和", "b": "把复杂的计数随机变量写成简单随机变量之和，再用 $E[\\sum_iX_i]=\\sum_iE[X_i]$，不需要独立性。两种常见拆法：指示变量，利用 $E[\\mathbf 1_A]=P(A)$，例如数随机排列中的某类位置；分阶段的等待时间，每阶段是几何分布，期望为该阶段成功概率的倒数，例如集齐 $n$ 种卡片的期望为 $n\\sum_{k=1}^n\\frac1k\\approx n\\ln n$。"},
  "qi1-order-statistics": {"t": "均匀分布的顺序统计量", "b": "求最大值、最小值的分布，先算分布函数：独立时 $P(\\max\\le t)=\\prod_iP(X_i\\le t)$，$P(\\min>t)=\\prod_iP(X_i>t)$；再对密度积分，或对非负 $Z$ 用 $E[Z]=\\int_0^\\infty P(Z>t)\\,dt$。$n$ 个独立 $U(0,1)$ 的第 $k$ 小值服从 $\\mathrm{Beta}(k,n-k+1)$，期望为 $\\frac{k}{n+1}$：直观上 $n$ 个点平均把区间分成 $n+1$ 段。"},
  "qi1-inclusion-exclusion": {"t": "容斥原理与错排", "b": "$P(\\bigcup_iA_i)=\\sum_{k\\ge1}(-1)^{k+1}\\sum_{i_1<\\dots<i_k}P(A_{i_1}\\cap\\dots\\cap A_{i_k})$。对称情形下第 $k$ 项只需算一个 $k$ 重交的概率再乘以 $\\binom nk$。用于随机排列：指定的 $k$ 个位置都是不动点的概率为 $\\frac{(n-k)!}{n!}$，代入容斥即得“没有不动点”的概率；此时不动点个数近似服从参数为 1 的泊松分布。"},
  "qi1-geometric-probability": {"t": "几何概率", "b": "当随机性来自若干独立均匀变量时，把样本空间画成单位正方形（或立方体），所求概率就是满足条件的区域的面积（体积）。先把条件化成坐标的不等式组，再用对称性只算一部分。例如两个独立 $U(0,1)$ 之差的绝对值小于 $\\frac12$ 的概率为 $1-2\\cdot\\frac18=\\frac34$。三条线段能构成三角形，当且仅当每段都短于总长的一半。"},
  "qi1-random-walk-optional-stopping": {"t": "随机游走的可选停时", "b": "对鞅 $X$ 与停时 $T$，若停止过程有界（或 $E[T]<\\infty$ 且增量有界），则 $E[X_T]=E[X_0]$。简单对称随机游走中 $S_n$ 与 $S_n^2-n$ 都是鞅：前者给出离开区间时落在哪一端的概率，后者给出 $E[T]=E[S_T^2]$。连续版本对布朗运动同样适用，用 $B_t$ 与 $B_t^2-t$。"},
  "qi1-gaussian-moments": {"t": "正态分布的矩", "b": "$Z\\sim N(0,1)$ 时，奇数阶矩为 0，偶数阶矩为 $E[Z^{2k}]=(2k-1)!!$，可由分部积分或把矩母函数 $e^{\\lambda^2/2}$ 展开得到；绝对一阶矩 $E|Z|=\\sqrt{2/\\pi}$。对 $X\\sim N(0,\\sigma^2)$，写成 $X=\\sigma Z$ 再缩放；布朗运动满足 $B_t\\overset{d}{=}\\sqrt t\\,Z$。由反射原理，$\\sup_{s\\le t}B_s$ 与 $|B_t|$ 同分布，其矩也可这样计算。"},
  "qi1-bivariate-normal-orthant": {"t": "二元正态的象限概率", "b": "设 $(X,Y)$ 是标准二元正态，相关系数为 $\\rho$，则 $P(X>0,Y>0)=\\frac14+\\frac{\\arcsin\\rho}{2\\pi}$。推导：把 $(X,Y)$ 写成独立标准正态 $(Z_1,Z_2)$ 的线性组合，事件变成平面上两个过原点的半平面之交，即一个角形区域；由旋转对称，概率等于该角的弧度除以 $2\\pi$。检验：$\\rho=0$ 时为 $\\frac14$，$\\rho\\to1$ 时趋于 $\\frac12$。"},
  "qi1-correlation-psd": {"t": "相关矩阵半正定", "b": "任何协方差矩阵（相关矩阵）都半正定，这等价于任意线性组合的方差非负：$\\mathrm{Var}(\\sum_ic_iX_i)=c^\\top\\Sigma c\\ge0$。求相关系数的可行范围时，选取恰当的组合（对称情形取全部求和），或计算特征值、行列式。例如 $n$ 个变量两两相关系数都为 $\\rho$ 时，相关矩阵的特征值为 $1+(n-1)\\rho$ 与 $1-\\rho$。"},
  "qi1-optimal-stopping": {"t": "最优停止：倒推法", "b": "有限期最优停止从最后一期往回推：先算出继续下去的价值 $V$（最后一期只能接受，价值就是期望），当前观测值高于 $V$ 就停下，否则继续，所以当期价值为 $E[\\max(X,V)]$。期数更多时逐期迭代 $V_k=E[\\max(X,V_{k+1})]$。例如收益为 $U(0,1)$、有两次机会时，阈值为 $\\frac12$，最优期望为 $\\frac58$。"},
  "qi2-counting-multiples": {"t": "数倍数：取整与容斥", "b": "$1$ 到 $n$ 中 $k$ 的倍数有 $\\lfloor n/k\\rfloor$ 个。素数 $p$ 在 $n!$ 中的幂次由 Legendre 公式 $\\sum_{j\\ge1}\\lfloor n/p^j\\rfloor$ 给出（$p^2$ 的倍数要多算一次，依此类推）；$n!$ 末尾 0 的个数等于 2 与 5 的幂次中较小者，即 5 的幂次。数“不被若干个数整除”的个数用容斥：减去各自的倍数，加回两两最小公倍数的倍数，依此类推。"},
  "qi2-clock-angle": {"t": "钟表夹角", "b": "分针每分钟转 $6^\\circ$，时针每小时转 $30^\\circ$，即每分钟 $0.5^\\circ$，两针的相对角速度为每分钟 $5.5^\\circ$。$h$ 点 $m$ 分时两针夹角为 $|30h-5.5m|$，若超过 $180^\\circ$ 则取 $360^\\circ$ 减去它。常见陷阱是忘了时针在这一小时内也在走，并不正好指在整点刻度上。"},
  "qi2-tournament-elimination": {"t": "只比名次的淘汰推理", "b": "只能比较名次、不能计时的问题，先分组比赛，再让各组第一名比赛，从而给组排序。之后逐一排除不可能进入前 $k$ 名的个体：只要已经确定至少有 $k$ 个对手比它快，就可以淘汰。按这种偏序关系列出剩下的候选，再安排尽可能少的附加比赛；同时要论证更少的场次无法确定结果。"},
  "qi2-information-bound": {"t": "信息论下界与编码", "b": "每次操作有 $r$ 种可能结果，则 $k$ 次操作最多区分 $r^k$ 种情况，所以要区分 $N$ 种情况至少需要 $\\lceil\\log_rN\\rceil$ 次。天平有三种结果（左重、右重、平衡），应把对象尽量均分成三组；每个检测对象只有两种结果时用二进制编码：给对象编号，第 $i$ 个检测者负责所有编号第 $i$ 位为 1 的对象。"},
  "qi2-symmetry-argument": {"t": "对称性论证", "b": "直接计算很繁琐时，先找出过程最终只可能出现的少数几种结局，再论证在问题的随机机制下它们地位对称，于是概率相等。常见形式：每次随机选择时，两个关键对象被选中的机会总相同，一旦选中其中之一结局就已确定。简单例子：均匀洗牌后，某张指定牌位于另一张指定牌之前的概率是 $\\frac12$。"},
  "qi2-multiplication-rule": {"t": "乘法法则：逐步条件化", "b": "$P(A_1\\cap\\dots\\cap A_k)=P(A_1)P(A_2\\mid A_1)\\cdots P(A_k\\mid A_1\\cap\\dots\\cap A_{k-1})$。不放回抽样时依次计算每一步的条件概率，结果与组合计数 $\\binom{K}{k}/\\binom{N}{k}$ 一致，二者可以互相验算。例如从 10 个球（其中 3 个红球）中不放回取 2 个，都是红球的概率为 $\\frac{3}{10}\\cdot\\frac29=\\frac{1}{15}$。"},
  "qi2-no-arbitrage": {"t": "无套利：平价与价格界", "b": "无套利原则：到期收益相同的两个组合，今天的价格必须相同。看涨减看跌在到期时恰好等于标的减行权价，由此得到看涨看跌平价。同理可得下界：无股息时欧式看涨满足 $C\\ge S-Ke^{-rT}$；$r>0$ 时它严格大于立即行权的价值 $S-K$，所以不付股息的美式看涨不应提前行权（看跌期权则不然）。"},
  "qi2-bs-greeks": {"t": "Black–Scholes 希腊字母", "b": "无股息欧式看涨：$\\Delta=N(d_1)$，$\\Gamma=\\frac{\\varphi(d_1)}{S\\sigma\\sqrt T}$，$\\mathrm{Vega}=S\\varphi(d_1)\\sqrt T>0$，其中 $d_1=\\frac{\\ln(S/K)+(r+\\sigma^2/2)T}{\\sigma\\sqrt T}$。分析定性问题时看各因子的符号与大小：$\\varphi(d_1)$ 在 $d_1=0$（大致平值）处最大，$T$ 小时分母小。同一行权价与到期日的看涨、看跌期权，Gamma 与 Vega 相同。"},
  "qi2-atm-approximation": {"t": "平值期权价格速算", "b": "当 $r\\approx0$ 且 $S=K$ 时，Black–Scholes 价格为 $C=S[N(x)-N(-x)]$，$x=\\frac{\\sigma\\sqrt T}{2}$。小 $x$ 时 $N(x)-N(-x)\\approx2x\\varphi(0)$，故 $C\\approx\\frac{1}{\\sqrt{2\\pi}}S\\sigma\\sqrt T\\approx0.4\\,S\\sigma\\sqrt T$，适用于 $\\sigma\\sqrt T$ 较小的情形；由平价关系，平值看跌同价。面试中可用于心算估价或反推隐含波动率。"},
  "qi2-risk-neutral-pricing": {"t": "风险中性定价", "b": "在风险中性测度 $Q$ 下，衍生品价格等于到期收益的折现期望 $e^{-rT}E_Q[\\text{payoff}]$；只依赖事件是否发生的收益，其价格就是折现的风险中性概率。Black–Scholes 下 $Q(S_T>K)=N(d_2)$，而 $N(d_1)$ 是以股票为计价单位时的概率。对看涨价格关于 $K$ 求导：$\\partial_KC=-e^{-rT}Q(S_T>K)$，$\\partial_K^2C=e^{-rT}q(K)$（Breeden–Litzenberger）。"},
  "c1-std-gaussian": {"t": "标准高斯变量的基本计算", "b": "$X\\sim\\mathcal N(0,1)$ 时，对一切 $z\\in\\mathbb C$ 有 $E[e^{zX}]=e^{z^2/2}$（先对实数配方，再解析延拓），特征函数为 $e^{-\\xi^2/2}$；矩为 $E[X^{2n}]=\\frac{(2n)!}{2^n n!}$，奇数阶矩为 $0$。独立的 $\\mathcal N(m,\\sigma^2)$ 与 $\\mathcal N(m',\\sigma'^2)$ 之和服从 $\\mathcal N(m+m',\\sigma^2+\\sigma'^2)$。"},
  "c1-gaussian-limits": {"t": "高斯变量的极限（Prop 1.1）", "b": "若 $X_n\\sim\\mathcal N(m_n,\\sigma_n^2)$ 在 $L^2$ 中收敛到 $X$，则 $X\\sim\\mathcal N(m,\\sigma^2)$，其中 $m=\\lim m_n$，$\\sigma=\\lim\\sigma_n$，并且收敛在一切 $L^p$（$p<\\infty$）中成立。结论 (i) 只需依分布收敛即可，极限可能退化为常数。由此，高斯变量的 $L^2$ 闭包仍然由高斯变量组成。"},
  "c1-gaussian-vector": {"t": "高斯向量与协方差", "b": "$X$ 称为高斯向量，若每个 $\\langle u,X\\rangle$ 都是高斯变量。此时 $E[e^{i\\langle u,X\\rangle}]=\\exp(i\\langle u,m_X\\rangle-\\frac12q_X(u))$，$q_X(u)=\\langle u,\\Gamma_Xu\\rangle$。$\\Gamma_X$ 是非负对称算子；反之（Thm 1.3(i)）任何非负对称算子都是某个中心化高斯向量的协方差。"},
  "c1-gaussian-support-density": {"t": "高斯分布的支撑与密度", "b": "Thm 1.3(ii)：在 $\\Gamma_X$ 的特征基下 $X=\\sum_{j\\le r}Y_j\\varepsilon_j$，$Y_j$ 独立且 $\\operatorname{var}Y_j=\\lambda_j>0$，$r=\\operatorname{rank}\\Gamma_X$。$P_X$ 的支撑是 $\\operatorname{span}(\\varepsilon_1,\\dots,\\varepsilon_r)$；$P_X$ 有密度当且仅当 $r=d$，此时密度为 $(2\\pi)^{-d/2}(\\det\\Gamma_X)^{-1/2}\\exp(-\\frac12\\langle x,\\Gamma_X^{-1}x\\rangle)$。"},
  "c1-gaussian-conditioning": {"t": "高斯条件期望=正交投影", "b": "Cor 1.10：$H$ 是高斯空间，$K\\subset H$ 是闭子空间，$X\\in H$，则 $E[X\\mid\\sigma(K)]=p_K(X)$，条件分布为 $\\mathcal N(p_K(X),\\sigma^2)$，$\\sigma^2=E[(X-p_K(X))^2]$。关键是 $X-p_K(X)\\perp K$，由 Thm 1.9 推出独立。因此高斯情形下最优非线性预测就是线性回归。"},
  "c1-covariance-function": {"t": "协方差函数与存在性", "b": "中心化高斯过程的协方差函数 $\\Gamma(s,t)=E[X_sX_t]$ 决定全部有限维分布，且必对称、正型：对有限支撑的 $c$，$\\sum c(s)c(t)\\Gamma(s,t)\\ge0$。Thm 1.11：任何对称正型函数都是某个高斯过程的协方差。例：$\\Gamma(s,t)=\\int e^{i\\xi(t-s)}\\mu(d\\xi)$（$\\mu$ 对称有限）给出平稳过程，$\\mu$ 称为谱测度。"},
  "c1-white-noise": {"t": "高斯白噪声", "b": "强度为 σ-有限测度 $\\mu$ 的高斯白噪声是从 $L^2(E,\\mathcal E,\\mu)$ 到某个高斯空间的等距映射 $G$：$E[G(f)G(g)]=\\int fg\\,d\\mu$。对 $\\mu(A)<\\infty$ 记 $G(A)=G(\\mathbf 1_A)\\sim\\mathcal N(0,\\mu(A))$；不相交集给出独立变量，可数不交并（$\\mu(A)<\\infty$）上 $G(A)=\\sum G(A_j)$ 在 $L^2$ 中成立，但固定 $\\omega$ 时 $A\\mapsto G(A)(\\omega)$ 一般不是测度。存在性见 Prop 1.13。"},
  "c1-white-noise-quadratic": {"t": "白噪声二次和恢复强度", "b": "Prop 1.14：$\\mu(A)<\\infty$，若 $A$ 的划分 $(A^n_j)_j$ 的网格 $\\sup_j\\mu(A^n_j)\\to0$，则 $\\sum_jG(A^n_j)^2\\to\\mu(A)$ 于 $L^2$。证明：误差的二阶矩等于 $2\\sum_j\\mu(A^n_j)^2\\le2\\sup_j\\mu(A^n_j)\\,\\mu(A)$，用到独立性和 $\\operatorname{var}(X^2)=2\\sigma^4$。"},
  "a1-monotone-class-def": {"t": "单调类的定义", "b": "$\\mathcal M\\subset\\mathcal P(E)$ 称为单调类，若：(i) $E\\in\\mathcal M$；(ii) $A\\subset B$ 都在 $\\mathcal M$ 中时 $B\\setminus A\\in\\mathcal M$；(iii) 对递增序列的并封闭。单调类自动对补、递减交封闭；它是 σ-代数当且仅当对有限交封闭。$\\mathcal M(\\mathcal C)$ 是包含 $\\mathcal C$ 的所有单调类之交。"},
  "a1-monotone-class-lemma": {"t": "单调类引理", "b": "若 $\\mathcal C\\subset\\mathcal P(E)$ 对有限交封闭，则 $\\mathcal M(\\mathcal C)=\\sigma(\\mathcal C)$。证明：令 $\\mathcal M_A=\\{B\\in\\mathcal M(\\mathcal C):A\\cap B\\in\\mathcal M(\\mathcal C)\\}$，先对 $A\\in\\mathcal C$、再对 $A\\in\\mathcal M(\\mathcal C)$ 证明它是包含 $\\mathcal C$ 的单调类，从而 $\\mathcal M(\\mathcal C)$ 对交封闭。没有 π-系统假设时结论可能失败。"},
  "a1-mc-applications": {"t": "单调类引理的典型应用", "b": "(1) 两个概率测度在一个生成 $\\mathcal A$ 的 π-系统上相等，则在 $\\mathcal A$ 上相等。(2) 要证 $\\sigma(X_i,i\\in I)$ 与 $\\mathcal G$ 独立，只需对每个有限子族 $(X_{i_1},\\dots,X_{i_p})$ 验证。(3) 验证 $E[Z\\mid X_i,i\\in I]=E[Z\\mid X_{i_0}]$ 也只需对有限子族检验。方法：说明“性质成立的集合”构成单调类。"},
  "c2-wiener-integral": {"t": "Wiener 积分", "b": "由 pre-Brownian motion 对应的白噪声 $G$ 定义 $\\int_0^\\infty f(s)dB_s:=G(f)$，$f\\in L^2(\\mathbb R_+,dt)$。它是等距映射：$\\int f\\,dB\\sim N(0,\\int f^2ds)$，且 $E[\\int f\\,dB\\int g\\,dB]=\\int fg\\,ds$；$\\int_u^v dB_s=B_v-B_u$。它不是逐 $\\omega$ 定义的积分，被积函数不依赖 $\\omega$。"},
  "c2-invariance": {"t": "布朗运动的不变性质", "b": "若 $B$ 是布朗运动，则 $-B$（对称性）、$\\lambda^{-1}B_{\\lambda^2t}$（尺度）、$B_{s+t}-B_s$（简单马氏性，且独立于 $\\sigma(B_r,r\\le s)$）都是布朗运动。时间反演：$W_0=0$，$W_t=tB_{1/t}$ 也是布朗运动，由此 $B_t/t\\to0$ a.s.。验证方法：先验证是 pre-BM（协方差 $s\\wedge t$），再验证路径连续。"},
  "c2-wiener-measure": {"t": "Wiener 测度与典则构造", "b": "Wiener 测度 $W$ 是 $\\omega\\mapsto B_\\cdot(\\omega)$ 在 $(C(\\mathbb R_+,\\mathbb R),\\mathcal C)$ 上的像测度。柱集构成生成 $\\mathcal C$ 的 π-系，其测度由有限维密度给出，所以 $W$ 与 $B$ 的选取无关：对任意两个布朗运动，$P(B\\in A)=P(B'\\in A)$。在 $(C,\\mathcal C,W)$ 上，坐标过程就是布朗运动（典则构造）。"},
  "c2-kolmogorov-proof": {"t": "Kolmogorov 引理的证明", "b": "思路：由 Markov 不等式和 Borel–Cantelli，a.s. 对充分大的 $n$，相邻二进点的增量 $\\le2^{-n\\alpha}$（需要 $\\alpha<\\varepsilon/q$）；链式论证（Lemma 2.10）给出 $D$ 上的 Hölder 估计，常数为 $2K/(1-2^{-\\alpha})$；由 $E$ 完备，把路径从 $D$ 唯一连续延拓；最后由依概率连续性说明它是原过程的修正。"},
  "c2-blumenthal-cons": {"t": "0-1 律的路径推论", "b": "由 Blumenthal 0-1 律：a.s. 对每个 $\\varepsilon>0$，$\\sup_{[0,\\varepsilon]}B>0>\\inf_{[0,\\varepsilon]}B$，所以 0 是零点集的聚点；结合尺度不变性得到对所有 $a$ 有 $T_a<\\infty$，且 $\\limsup B_t=+\\infty$、$\\liminf B_t=-\\infty$。再用简单马氏性（只在可数多个有理时刻）可得：路径在任何区间上都不单调；类似地，$\\limsup_{t\\downarrow0}B_t/\\sqrt t=+\\infty$，所以在固定时刻没有右导数。"},
  "c2-stopping-time": {"t": "停时与 $\\mathcal F_T$", "b": "$T\\in[0,\\infty]$ 是停时，若 $\\forall t$，$\\{T\\le t\\}\\in\\mathcal F_t$（允许取 $\\infty$）。例子：常数、首达时 $T_a$（$\\{T_a\\le t\\}=\\{\\inf_{s\\le t}|B_s-a|=0\\}$）、$T+t$。反例：最后零点 $\\sup\\{s\\le1:B_s=0\\}$、$[0,1]$ 上的最大值点。$\\mathcal F_T=\\{A:A\\cap\\{T\\le t\\}\\in\\mathcal F_t\\ \\forall t\\}$，且 $\\mathbf 1_{\\{T<\\infty\\}}B_T$ 是 $\\mathcal F_T$-可测的。"},
  "c2-strong-markov-app": {"t": "强马氏性的应用", "b": "在首达时 $T_a$ 处使用强马氏性：$(B_{T_a+t}-a)_t$ 是独立于 $\\mathcal F_{T_a}$ 的布朗运动。由此 $(T_a)_{a\\ge0}$ 具有独立平稳增量：$T_b-T_a\\overset{d}{=}T_{b-a}\\overset{d}{=}(b-a)^2T_1$。结合反射原理和时间反演 $B'_u=B_t-B_{t-u}$，可知 $S_t$、$S_t-B_t$、$|B_t|$ 三者同分布。"},
  "c2-multidim": {"t": "$d$ 维布朗运动", "b": "$d$ 维布朗运动（从 0 出发）的各分量是独立的一维布朗运动；从随机初值 $Z$ 出发是指 $X=Z+B$，其中 $B$ 与 $Z$ 独立，这时各分量可能不独立。对 $\\mathbb R^d$ 的等距 $\\Phi$，$\\Phi(X)$ 仍是 $d$ 维布朗运动；例如 $(B^1+B^2)/\\sqrt2$ 是一维布朗运动。0-1 律和强马氏性都可以平行推广。"},
  "a2-maximal": {"t": "极大不等式与 Doob 不等式", "b": "上鞅：$\\lambda P(\\sup_{n\\le k}|Y_n|>\\lambda)\\le E|Y_0|+2E|Y_k|$。鞅，$p>1$：$E[\\sup_{n\\le k}|Y_n|^p]\\le(\\frac{p}{p-1})^pE|Y_k|^p$，例如 $p=2$ 时常数为 4。$p=1$ 时没有这样的不等式；右端有限时不等式才有意义。"},
  "a2-upcrossing": {"t": "上穿次数与上穿不等式", "b": "$M^y_{ab}(n)$ 是最大的 $k$，使得存在 $m_1<n_1<\\dots<m_k<n_k\\le n$，满足 $y_{m_i}\\le a$、$y_{n_i}\\ge b$。Doob：若 $Y$ 是上鞅，则 $E[M^Y_{ab}(n)]\\le\\frac{1}{b-a}E[(Y_n-a)^-]$。它是证明鞅收敛定理的关键工具：上穿次数有限，就排除了振荡。"},
  "a2-convergence": {"t": "上鞅几乎必然收敛", "b": "若上鞅 $(Y_n)$ 在 $L^1$ 中有界，则 $Y_n\\to Y_\\infty\\in L^1$ a.s.，但一般不在 $L^1$ 中收敛。非负上鞅自动满足 $E|Y_n|\\le E[Y_0]$，因而 a.s. 收敛。反例：$Y_n=2^n\\mathbf 1\\{$前 $n$ 次正面$\\}$ a.s. 趋于 0，但 $E[Y_n]=1$。"},
  "a2-ui-martingale": {"t": "一致可积鞅", "b": "对离散时间鞅，下列三条等价：(i) 闭：存在 $Z\\in L^1$ 使 $Y_n=E[Z\\mid\\mathcal G_n]$；(ii) a.s. 且 $L^1$ 收敛；(iii) 一致可积。此时极限为 $Y_\\infty=E[Z\\mid\\mathcal G_\\infty]$，$\\mathcal G_\\infty=\\bigvee_n\\mathcal G_n$。$L^1$ 有界严格弱于这些条件。"},
  "a2-optional-stopping": {"t": "离散可选停时定理", "b": "(1) $Y$ 是一致可积鞅，$S\\le T$ 是停时（可以取 $\\infty$，约定 $Y_\\infty$ 为 a.s. 极限），则 $Y_T\\in L^1$ 且 $Y_S=E[Y_T\\mid\\mathcal G_S]$。(2) $Y$ 是上鞅，$S\\le T$ 是有界停时，则 $Y_S\\ge E[Y_T\\mid\\mathcal G_S]$，从而 $E[Y_T]\\le E[Y_S]$。两个条件都不满足时可能失效，例如简单随机游走在首达 1 的时刻。"},
  "a2-backward": {"t": "反向上鞅收敛", "b": "反向滤子 $(\\mathcal H_n)_{n\\in-\\mathbb N}$ 递增，$n\\to-\\infty$ 时越来越小；反向上鞅要求 $E[Y_n\\mid\\mathcal H_m]\\le Y_m$（$m\\le n\\le0$）。若它在 $L^1$ 中有界，则 $n\\to-\\infty$ 时 a.s. **且 $L^1$** 收敛，这一点与正向情形不同，第 3 章的应用正需要它。"},
  "c3-xt-measurable": {"t": "停止位置 $X_T$ 的可测性", "b": "若 $X$ 循序可测、$T$ 是停时，则定义在 $\\{T<\\infty\\}$ 上的 $X_T(\\omega)=X_{T(\\omega)}(\\omega)$ 是 $\\mathcal F_T$-可测的。证明利用：$Y$ 是 $\\mathcal F_T$-可测的，当且仅当它在每个 $\\{T\\le t\\}$ 上的限制是 $\\mathcal F_t$-可测的。若 $X_t\\to X_\\infty$，令 $X_T=X_\\infty$ 于 $\\{T=\\infty\\}$，所得 $X_T$ 仍是 $\\mathcal F_T$-可测的。"},
  "c3-construct-stopping": {"t": "构造停时的方法", "b": "(1) 若 $T$ 是停时，$S$ 是 $\\mathcal F_T$-可测的且 $S\\ge T$，则 $S$ 也是停时。特别地，二进上取整 $T_n=(k+1)2^{-n}$（于 $\\{k2^{-n}<T\\le(k+1)2^{-n}\\}$）是递减趋于 $T$ 的停时。(2) 对适应过程：路径右连续时，开集的首达时是 $(\\mathcal F_{t+})$-停时；路径连续时，闭集的首达时是 $(\\mathcal F_t)$-停时。"},
  "c3-submart-basics": {"t": "下鞅的基本性质", "b": "Jensen 不等式：若 $X$ 是鞅，$f$ 凸且 $f(X_t)$ 可积，则 $f(X_t)$ 是下鞅；若 $X$ 只是下鞅，还需要 $f$ 单调不减（例如 $X^+$）。由此，上鞅或下鞅在每个有限区间上 $L^1$ 有界：对下鞅有 $\\sup_{s\\le t}E|X_s|\\le 2E[X_t^+]-E[X_0]$。"},
  "c3-sq-increments": {"t": "平方可积鞅增量的正交性", "b": "设 $M$ 是平方可积鞅，$s<t$。对 $[s,t]$ 的任意分割，有 $E[\\sum_i(M_{t_i}-M_{t_{i-1}})^2\\mid\\mathcal F_s]=E[M_t^2-M_s^2\\mid\\mathcal F_s]=E[(M_t-M_s)^2\\mid\\mathcal F_s]$。原因是交叉项的条件期望为零，即鞅增量在 $L^2$ 中正交。后面构造二次变差时要用到这条恒等式。"},
  "c3-regularization": {"t": "上穿次数与 càdlàg 修正", "b": "上鞅在可数稠密集 $D$ 上满足上穿不等式 $E[M^X_{ab}(D\\cap[0,T])]\\le E[(X_T-a)^-]/(b-a)$，因此 a.s. 沿 $D$ 处处有右极限 $X_{t+}$ 和左极限，并且 $X_t\\ge E[X_{t+}\\mid\\mathcal F_t]$，当 $s\\mapsto E[X_s]$ 右连续时取等。若滤子右连续且完备，且 $t\\mapsto E[X_t]$ 右连续，则上鞅有 càdlàg 修正（Thm 3.18）。"},
  "c3-ost-bm": {"t": "可选停止计算布朗运动", "b": "把鞅 $B_t$、$B_t^2-t$、$e^{\\theta B_t-\\theta^2t/2}$ 在停时处停止，先验证停止后的鞅有界（因而一致可积），再用 $E[M_T]=E[M_0]$。例如退出时间 $U_a$ 满足 $E[U_a]=a^2$，首达时 $T_a$ 满足 $E[e^{-\\lambda T_a}]=e^{-a\\sqrt{2\\lambda}}$。缺少一致可积时，这种推导可能给出荒谬的结论。"},
  "c4-fv-function": {"t": "有限变差函数的全变差与积分", "b": "连续且 $a(0)=0$ 的有限变差函数，其全变差 $\\int_0^t|da|$ 等于所有划分上 $\\sum|a(t_i)-a(t_{i-1})|$ 的上确界，也是网格趋于 0 时这些和的极限（命题 4.2）。对连续的 $f$，左端点和 $\\sum f(t_{i-1})(a(t_i)-a(t_{i-1}))$ 收敛到 $\\int_0^t f\\,da$（引理 4.3）。"},
  "c4-fv-integral": {"t": "对有限变差过程的积分", "b": "若 $A$ 是有限变差过程，$H$ 循序可测且对所有 $t,\\omega$ 有 $\\int_0^t|H_s||dA_s|<\\infty$，则 $H\\cdot A=\\int_0^\\cdot H_s\\,dA_s$ 仍是有限变差过程（命题 4.5）。循序可测保证适应性；滤子完备时积分条件放宽为 a.s. 成立即可。特例 $A_t=t$ 给出 $\\int_0^t H_s\\,ds$。"},
  "c4-local-mart-props": {"t": "连续局部鞅的基本性质", "b": "非负且 $M_0\\in L^1$ 时是上鞅；被可积变量 $Z$ 控制时是一致可积鞅；$M_0\\in L^1$ 时 $T_n=\\inf\\{t:|M_t|\\ge n\\}$ 约化 $M$（命题 4.7）。但一致可积甚至 $L^2$ 有界都不能保证是鞅（例：三维布朗运动的 $1/|B_t|$）；$Z+B_t$（$B$ 为从 0 出发的布朗运动，$Z$ 为 $\\mathcal F_0$ 可测且 $E|Z|=\\infty$）是局部鞅而不是鞅。"},
  "c4-qv-props": {"t": "二次变差：停止与退化", "b": "对任意停时 $T$，$\\langle M^T,M^T\\rangle=\\langle M,M\\rangle^T$（命题 4.11），因为 $M_{t\\wedge T}^2-\\langle M,M\\rangle_{t\\wedge T}$ 仍是局部鞅。若 $M_0=0$，则 $\\langle M,M\\rangle=0$ 当且仅当 $M=0$（命题 4.12），证明用非负局部鞅是上鞅。两者结合可得：二次变差在某段上不增，则 $M$ 在该段上为常数。"},
  "c4-bracket-bm": {"t": "布朗运动之间的括号", "b": "两个独立的 $(\\mathcal F_t)$-布朗运动 $B,B'$ 满足 $\\langle B,B'\\rangle=0$（命题 4.16），证明利用 $(B+B')/\\sqrt2$ 仍是布朗运动和括号的双线性。于是它们正交，$BB'$ 是连续局部鞅。由双线性可算 $B,B'$ 线性组合之间的括号。"},
  "c4-bracket-props": {"t": "括号 $\\langle M,N\\rangle$ 的性质", "b": "$\\langle M,N\\rangle$ 是使 $MN-\\langle M,N\\rangle$ 为局部鞅的唯一有限变差过程，对称双线性，是 $\\sum\\Delta M\\Delta N$ 的依概率极限。停止：$\\langle M^T,N^T\\rangle=\\langle M^T,N\\rangle=\\langle M,N\\rangle^T$。若 $M,N$ 是 $L^2$ 有界鞅，则 $E[M_\\infty N_\\infty]=E[M_0N_0]+E[\\langle M,N\\rangle_\\infty]$（命题 4.15）。"},
  "c4-semimartingale": {"t": "连续半鞅与其二次变差", "b": "连续半鞅是 $X=M+A$，$M$ 为连续局部鞅，$A$ 为有限变差过程（$A_0=0$），由定理 4.8 该分解唯一，称为典范分解；初值归入 $M$。对 $Y=M'+A'$ 定义 $\\langle X,Y\\rangle=\\langle M,M'\\rangle$，且 $\\sum\\Delta X\\Delta Y\\to\\langle X,Y\\rangle_t$ 依概率成立（命题 4.21）：有限变差部分的贡献趋于 0。例：$B_t^2=(B_t^2-t)+t$。"},
  "c4-qv-convergence": {"t": "局部鞅收敛与二次变差", "b": "设 $M$ 为连续局部鞅，$M_0=0$。则 a.s. 有 $\\{\\lim_{t\\to\\infty}M_t$ 存在且有限$\\}=\\{\\langle M,M\\rangle_\\infty<\\infty\\}$（习题 4.24）。方法：分别用 $T_n=\\inf\\{t:|M_t|=n\\}$ 与 $S_n=\\inf\\{t:\\langle M,M\\rangle_t=n\\}$ 停止，化为有界鞅或 $L^2$ 有界鞅。"},
  "c5-integral-props": {"t": "$H\\cdot M$ 的基本性质", "b": "对连续局部鞅 $M$ 与 $H\\in L^2_{loc}(M)$，$H\\cdot M$ 由 $\\langle H\\cdot M,N\\rangle=H\\cdot\\langle M,N\\rangle$ 刻画，因此 $\\langle H\\cdot M,K\\cdot N\\rangle=\\int HK\\,d\\langle M,N\\rangle$，且 $K\\cdot(H\\cdot M)=(KH)\\cdot M$。停止：$(H\\cdot M)^T=(\\mathbf 1_{[0,T]}H)\\cdot M=H\\cdot M^T$。矩：总有 $E[(H\\cdot M)_t^2]\\le E[\\int_0^tH^2d\\langle M,M\\rangle]$；右端有限时取等，且均值为 0。"},
  "c5-convergence": {"t": "随机积分的收敛与 Riemann 和", "b": "控制收敛（Prop 5.8）：若局部有界循序过程 $H^n\\to H$（在 $[0,t]$ 上逐点），$|H^n|\\le K$，$\\int_0^tK^2d\\langle M,M\\rangle<\\infty$ 且 $\\int_0^tK|dV|<\\infty$，则 $\\int_0^tH^ndX\\to\\int_0^tH\\,dX$ 依概率收敛。由此，对连续适应的 $H$，左端点 Riemann 和 $\\sum H_{t_i}(X_{t_{i+1}}-X_{t_i})$ 依概率收敛到 $\\int_0^tH\\,dX$；改用右端点结论一般不成立，例如 $H=X$ 时极限多出 $\\langle X,X\\rangle_t$。"},
  "c5-ibp": {"t": "分部积分公式", "b": "对连续半鞅 $X,Y$：$X_tY_t=X_0Y_0+\\int_0^tX\\,dY+\\int_0^tY\\,dX+\\langle X,Y\\rangle_t$，即 Itô 公式取 $F(x,y)=xy$。若其中一个是有限变差过程，括号为 0，就退化为普通的分部积分。例：$tB_t=\\int_0^ts\\,dB_s+\\int_0^tB_s\\,ds$。"},
  "c5-multi-ito": {"t": "多维 Itô 公式及其应用", "b": "对 $d$ 维布朗运动 $B$ 与 $C^2$ 函数 $F$：$F(B_t)=F(B_0)+\\int_0^t\\nabla F(B_s)\\cdot dB_s+\\frac12\\int_0^t\\Delta F(B_s)\\,ds$；若 $F$ 只在开集 $U$ 上有定义且 $B$ 不离开 $U$，公式依然成立。因此调和函数作用在 $B$ 上得到局部鞅，例如 $d=3$ 时的 $1/|B_t|$，但它未必是真鞅。Lévy 面积 $\\int X\\,dY-\\int Y\\,dX$ 的括号为 $\\int(X^2+Y^2)ds$。"},
  "c5-dds-flat": {"t": "DDS 的细节：平坦区间与独立性", "b": "Lemma 5.14：a.s. $M$ 在 $[a,b]$ 上为常数 ⇔ $\\langle M,M\\rangle_b=\\langle M,M\\rangle_a$，这保证了时间变换后的 $\\beta_r=M_{\\tau_r}$ 路径连续。Prop 5.15：若 $M_0=N_0=0$、$\\langle M,M\\rangle=\\langle N,N\\rangle$（趋于 $\\infty$）且 $\\langle M,N\\rangle=0$，则两者的 DDS 布朗运动独立。"},
  "c5-mart-rep": {"t": "布朗滤子下的鞅表示", "b": "在一维布朗运动的完备化典范滤子下，每个 $Z\\in L^2(\\mathcal F_\\infty)$ 都唯一地写成 $E[Z]+\\int_0^\\infty h_s\\,dB_s$（$h\\in L^2(B)$），连续局部鞅也写成 $C+\\int_0^th\\,dB$（$h\\in L^2_{loc}(B)$）。推论：滤子左右连续，所有鞅有连续修正。具体的 $h$ 常用 Itô 公式加分部积分求，例如 $B_1^2=1+\\int_0^12B_s\\,dB_s$。"},
  "c5-girsanov-props": {"t": "密度过程与换测度不变量", "b": "若 $Q\\ll P$，则 $D_t=dQ/dP|_{\\mathcal F_t}=E_P[D_\\infty|\\mathcal F_t]$ 是一致可积鞅，且对停时 $T$ 有 $D_T=dQ/dP|_{\\mathcal F_T}$；若 $P\\sim Q$，则 $\\inf_tD_t>0$。在 $P\\sim Q$ 且 $D$ 连续时，$P$-半鞅与 $Q$-半鞅是同一类，括号 $\\langle X,Y\\rangle$ 与随机积分 $H\\cdot X$ 不变，只有典范分解变化：$M=\\tilde M+\\langle M,L\\rangle$。"},
  "c5-kazamaki": {"t": "Novikov 与 Kazamaki 判据", "b": "$L$ 为连续局部鞅，$L_0=0$。(i) Novikov：$E[\\exp\\frac12\\langle L,L\\rangle_\\infty]<\\infty$；(ii) Kazamaki：$L$ 是一致可积鞅且 $E[\\exp\\frac12L_\\infty]<\\infty$；(iii) $\\mathcal E(L)$ 是一致可积鞅，等价于 $E[\\mathcal E(L)_\\infty]=1$。有 (i)⇒(ii)⇒(iii)。仅有 $L^2$ 有界不足以推出 (iii)。"},
  "c5-cameron-martin": {"t": "Cameron–Martin 公式", "b": "若 $h(t)=\\int_0^tg(s)ds$ 且 $g\\in L^2$（Cameron–Martin 空间），则 $E[\\Phi(B+h)]=E[\\Phi(B)\\exp(\\int_0^\\infty g\\,dB-\\frac12\\int_0^\\infty g^2ds)]$：Wiener 测度在这种平移下拟不变。应用：带漂移布朗运动 $B_t+ct$ 首达 $a>0$ 的时刻密度为 $\\frac{a}{\\sqrt{2\\pi s^3}}e^{-(a-cs)^2/2s}$。"},
  "c6-existence": {"t": "有限维分布与典范构造", "b": "马尔可夫过程的有限维分布由半群和初始分布 $\\mu$ 完全决定：$P(X_0\\in A_0,X_{t_1}\\in A_1,\\dots)=\\int_{A_0}\\mu(dx_0)\\int_{A_1}Q_{t_1}(x_0,dx_1)\\int_{A_2}Q_{t_2-t_1}(x_1,dx_2)\\cdots$。$E$ 为 Polish 空间时，由 Kolmogorov 扩张定理可在 $E^{\\mathbb R_+}$ 上构造具有任意初始分布的典范马氏过程 $(P_x)$，但这一构造对路径正则性没有任何信息。"},
  "c6-resolvent": {"t": "预解式", "b": "$R_\\lambda f=\\int_0^\\infty e^{-\\lambda t}Q_tf\\,dt$，满足 $\\|R_\\lambda f\\|\\le\\|f\\|/\\lambda$ 和预解方程 $R_\\lambda-R_\\mu+(\\lambda-\\mu)R_\\lambda R_\\mu=0$。对非负 $h$，$e^{-\\lambda t}R_\\lambda h(X_t)$ 是上鞅（引理 6.6），这是研究路径正则性的入口。一维布朗运动的预解核为 $\\frac1{\\sqrt{2\\lambda}}e^{-\\sqrt{2\\lambda}|y-x|}$。"},
  "c6-generator": {"t": "Feller 半群的生成元", "b": "$Lf=\\lim_{t\\downarrow0}(Q_tf-f)/t$（在 $C_0(E)$ 中），$D(L)$ 是使该极限存在的 $f$。对 $f\\in D(L)$，$Q_tf=f+\\int_0^tQ_sLf\\,ds$，且 $LQ_s f=Q_sLf$。$\\lambda R_\\lambda f\\to f$，所以 $D(L)=R_\\lambda(C_0(E))$ 稠密，且 $R_\\lambda=(\\lambda-L)^{-1}$；生成元（连同定义域）决定半群。"},
  "c6-bm-generator": {"t": "布朗运动类生成元", "b": "一维布朗运动：$D(L)=\\{h\\in C^2:h,h''\\in C_0\\}$，$Lh=\\frac12h''$，证明借助 $h=R_{1/2}f$ 推出 $h''=h-2f$。反射布朗运动 $|B_t|$ 的生成元同样是 $\\frac12f''$，但定义域中的函数还要满足边界条件 $f'(0)=0$。"},
  "c6-martingale-char": {"t": "生成元的鞅刻画", "b": "对 Feller 过程和 $h,g\\in C_0(E)$：$h\\in D(L)$ 且 $Lh=g$，当且仅当对每个起点 $x$，$h(X_t)-\\int_0^tg(X_s)ds$ 是鞅（定理 6.14）。例如 $d$ 维布朗运动，若 $h\\in C^2$ 且 $h,\\Delta h\\in C_0$，Itô 公式给出的局部鞅是真鞅，从而 $Lh=\\frac12\\Delta h$。这一思想后来发展为鞅问题。"},
  "c6-cadlag": {"t": "Feller 过程的 càdlàg 修正", "b": "Feller 过程总有 càdlàg 修正 $\\tilde X$，它关于右连续滤子 $\\mathcal F_{t+}\\vee\\sigma(\\mathcal N)$ 仍是同一半群的马氏过程（定理 6.15）。证明：用可数族 $R_pf_n$ 分离点，对上鞅 $e^{-pt}R_ph(X_t)$ 用上鞅的正则性定理得到沿稠密集的左右极限，再证明路径不会到达无穷远点 $\\Delta$。"},
  "c6-jump-structure": {"t": "有限状态跳过程的结构", "b": "有限状态 Feller 跳过程在 $P_x$ 下：第一次跳跃时刻 $T_1\\sim\\mathrm{Exp}(q(x))$，且当 $q(x)>0$ 时 $T_1$ 与 $X_{T_1}$ 独立。嵌入链 $(X_{T_i})$ 是以 $\\Pi(x,y)=P_x(X_{T_1}=y)$ 为转移核的马氏链；给定嵌入链后，等待时间 $T_{i+1}-T_i$ 条件独立，服从 $\\mathrm{Exp}(q(X_{T_i}))$。"},
  "c6-jump-generator": {"t": "跳过程的生成元矩阵", "b": "有限状态时 $D(L)=B(E)$，$L\\varphi(x)=q(x)\\sum_{y\\ne x}\\Pi(x,y)(\\varphi(y)-\\varphi(x))$，矩阵元为 $L(x,y)=q(x)\\Pi(x,y)$（$y\\ne x$）、$L(x,x)=-q(x)$，每行和为 $0$。半群为矩阵指数 $Q_t=e^{tL}$，$L(x,y)$ 就是从 $x$ 到 $y$ 的瞬时转移速率。"},
  "c6-levy": {"t": "Lévy 过程", "b": "若 $Y_0=0$、增量独立平稳，且 $t\\downarrow0$ 时 $Y_t$ 依概率收敛到 $0$，则 $Q_t(x,\\cdot)=$（$Y_t$ 的分布平移 $x$）构成 $\\mathbb R$ 上的 Feller 半群，$Y$ 是相应的马氏过程，因而有 càdlàg 修正。Lévy 过程即 $Y_0=0$、具有独立平稳增量且路径 càdlàg 的过程，例如布朗运动和击中时过程 $(T_a)_{a\\ge0}$。"},
  "c6-csbp": {"t": "连续状态分支过程", "b": "$\\mathbb R_+$ 上的半群若满足 $Q_t(x,\\cdot)*Q_t(y,\\cdot)=Q_t(x+y,\\cdot)$，就称为连续状态分支过程的半群。此时 $\\int Q_t(x,dy)e^{-\\lambda y}=e^{-x\\psi_t(\\lambda)}$，且 $\\psi_t\\circ\\psi_s=\\psi_{t+s}$；在适当的连续性条件下半群是 Feller 的。例：$\\psi_t(\\lambda)=\\lambda/(1+\\lambda t)$，对应 Feller 分支扩散。"},
  "c7-heat-equation": {"t": "热方程与 Feynman–Kac", "b": "对 $\\varphi\\in C_0(\\mathbb R^d)$，$u_t(x)=E_x[\\varphi(B_t)]$ 在 $(0,\\infty)\\times\\mathbb R^d$ 上满足 $\\partial_t u=\\tfrac12\\Delta u$，且 $s\\downarrow0,y\\to x$ 时 $u_s(y)\\to\\varphi(x)$。加入势 $v\\ge0$（$v\\in C_0$，$C^1$ 且一阶导数有界）后，$u_t(x)=E_x[\\varphi(B_t)e^{-\\int_0^t v(B_s)ds}]$ 满足 $\\partial_t u=\\tfrac12\\Delta u-vu$（Feynman–Kac 公式）。"},
  "c7-harmonic-mean-value": {"t": "调和函数与布朗运动", "b": "设 $u$ 在 $D$ 上调和，$D'$ 为子区域且 $\\overline{D'}\\subset D$，$T$ 为离开 $D'$ 的时刻，则 $u(B_{t\\wedge T})$ 是局部鞅；若 $D'$ 还有界，则 $u(x)=E_x[u(B_T)]$（$x\\in D'$）。取 $D'$ 为球即得均值性质：$u(x)$ 等于 $u$ 在球面均匀测度 $\\sigma_{x,r}$ 下的平均。反之，局部有界可测且满足均值性质的函数必调和。"},
  "c7-dirichlet-problem": {"t": "Dirichlet 问题的概率解", "b": "$D$ 为有界区域，$T$ 为离开 $D$ 的时刻。若 Dirichlet 问题（$u$ 调和，$x\\to y\\in\\partial D$ 时 $u(x)\\to g(y)$）有解，则解必为 $u(x)=E_x[g(B_T)]$，因而唯一。对任意有界可测 $g$，该式在 $D$ 内调和，但未必取到边值。例如 $B_1\\setminus\\{0\\}$ 上，$0$ 处的边值无法实现。"},
  "c7-exterior-cone": {"t": "外锥条件", "b": "若存在以 $y$ 为顶点的开锥 $C$ 和 $r>0$，使 $C\\cap B(y,r)\\subset D^c$，就称 $D$ 在 $y\\in\\partial D$ 满足外锥条件（凸区域处处满足）。在每个边界点都满足时，对任意连续 $g$，$E_x[g(B_T)]$ 是 Dirichlet 问题的唯一解。关键在于 Blumenthal 0-1 律给出 $\\lim_{x\\to y}P_x(T>\\eta)=0$。"},
  "c7-poisson-kernel": {"t": "Poisson 核", "b": "单位球的 Poisson 核为 $K(x,y)=\\dfrac{1-|x|^2}{|y-x|^d}$，$x\\in B_1,\\ y\\in\\partial B_1$。它关于 $x$ 调和，且 $\\int K(x,y)\\sigma_1(dy)=1$。连续 $g$ 的 Dirichlet 解为 $u(x)=\\int g(y)K(x,y)\\sigma_1(dy)$；等价地，$B_T$ 在 $P_x$ 下关于 $\\sigma_1$ 的密度就是 $K(x,\\cdot)$。"},
  "c7-annulus-exit": {"t": "径向调和函数与球壳出口", "b": "径向调和函数为 $a+b\\log r$（$d=2$）或 $a+br^{2-d}$（$d\\ge3$）。用它在球壳上解 Dirichlet 问题，得 $P_x(U_\\varepsilon<U_R)=\\frac{\\log R-\\log|x|}{\\log R-\\log\\varepsilon}$（$d=2$）或 $\\frac{R^{2-d}-|x|^{2-d}}{R^{2-d}-\\varepsilon^{2-d}}$（$d\\ge3$）。令 $R\\to\\infty$：$d=2$ 时 $P_x(U_\\varepsilon<\\infty)=1$，$d\\ge3$ 时为 $(\\varepsilon/|x|)^{d-2}$。"},
  "c7-polar-points": {"t": "极点与路径的像", "b": "$d\\ge2$ 时 $P_x(U_0<\\infty)=0$（$x\\ne0$），即单点是极集。由 Fubini，路径像集 $\\{B_t,t\\ge0\\}$ 的 Lebesgue 测度 a.s. 为 $0$，尽管其 Hausdorff 维数为 $2$。$d=2$ 时布朗运动常返，在每个非空开集中停留的总时间 a.s. 无穷；$d\\ge3$ 时暂留。"},
  "c7-conformal": {"t": "共形不变性与 skew-product", "b": "对非常数整函数 $\\Phi$，$\\Phi(B_t)=\\Gamma_{C_t}$，其中 $C_t=\\int_0^t|\\Phi'(B_s)|^2ds$，$\\Gamma$ 是从 $\\Phi(z)$ 出发的复布朗运动。用于极坐标得 skew-product：$B_t=\\exp(\\beta_{H_t}+i\\gamma_{H_t})$，$H_t=\\int_0^t|B_s|^{-2}ds$，$\\beta,\\gamma$ 为独立线性布朗运动。$|B|$ 是 Markov 过程（Bessel），辐角 $\\theta_t$ 不是。"},
  "c7-spitzer": {"t": "Spitzer 卷绕定理", "b": "设 $\\theta_t$ 为平面布朗运动（起点 $\\ne0$）辐角的连续版本，则 $\\frac{2}{\\log t}\\theta_t$ 依分布收敛到标准 Cauchy 分布。证明的关键是 $\\frac{4}{(\\log t)^2}H_t$ 近似于独立布朗运动 $\\beta$ 的首达时 $T_1$，而 $\\gamma_{T_1}$ 的特征函数为 $e^{-|\\xi|}$。"},
  "c7-asymptotic-laws": {"t": "平面布朗运动的渐近律", "b": "起点 $z\\ne0$ 时，$\\lim_t P(\\min_{s\\le t}|B_s|\\le t^{-a/2})=\\frac1{1+a}$，来自 $P(T_{-a}<T_1)=\\frac1{1+a}$；例如 $1/t$ 对应 $a=2$，极限为 $\\tfrac13$。Kallianpur–Robbins 律：$\\frac{2}{\\log t}\\int_0^t1_{\\{|B_s|<R\\}}ds$ 依分布收敛到均值 $R^2$ 的指数分布。"},
  "c8-lipschitz-growth": {"t": "局部 Lipschitz 与线性增长", "b": "Thm 8.3 假设 $\\sigma,b$ 连续且关于 $x$ 一致 Lipschitz。可以把它放宽为局部 Lipschitz（常数依赖于紧集），但此时必须保留线性增长条件 $|\\sigma(t,x)|,|b(t,x)|\\le K(1+|x|)$ 以防解在有限时间爆炸，正如 ODE $y'=y^2$ 的例子所示。"},
  "c8-gronwall": {"t": "Gronwall 引理", "b": "若 $g\\ge0$ 在 $[0,T]$ 上有界可测且 $g(t)\\le a+b\\int_0^tg(s)ds$，则 $g(t)\\le ae^{bt}$；迭代后余项 $\\le A(bt)^{n+1}/(n+1)!\\to0$，有界性不可省。证明轨道唯一性时对 $E[(X_{t\\wedge\\tau}-X'_{t\\wedge\\tau})^2]$ 用 $a=0$ 的情形得到差为 0，停时 $\\tau$ 用来保证有界。"},
  "c8-picard": {"t": "Picard 迭代构造强解", "b": "令 $X^0=x$，$X^n_t=x+\\int_0^t\\sigma(s,X^{n-1}_s)dB_s+\\int_0^tb(s,X^{n-1}_s)ds$。用 BDG（或 Doob）不等式与 Lipschitz 性得 $g_{n+1}(t)\\le C_T\\int_0^tg_n$，从而 $g_n(t)\\le C'_TC_T^{n-1}t^{n-1}/(n-1)!$，$X^n$ 在 $[0,T]$ 上 a.s. 一致收敛，极限对 $B$ 的完备自然滤子适应，是强解。"},
  "c8-solution-map": {"t": "解映射 $F_x$（Thm 8.5）", "b": "Lipschitz 情形下存在可测映射 $F_x$：$F_x(w)_t$ 只依赖 $w|_{[0,t]}$，$x\\mapsto F_x(w)$ 连续，且任何空间上 $F_x(B)$ 是 $E_x(\\sigma,b)$ 的唯一解；对 $\\mathcal F_0$-可测 $U$（与 $B$ 独立），$F_U(B)$ 是初值 $U$ 的解。推论：弱唯一性；解可取为关于初值局部 $(1-\\varepsilon)$-Hölder 连续。"},
  "c8-markov": {"t": "SDE 解的（强）马氏性", "b": "齐次 Lipschitz 情形下，解是关于 $(\\mathcal F_t)$ 的马氏过程，半群 $Q_tf(x)=E[f(X^x_t)]=\\int f(F_x(w)_t)W(dw)$。证明关键：$X_{s+\\cdot}$ 是由 $B_{s+\\cdot}-B_s$ 驱动、初值 $X_s$ 的解，故等于 $F_{X_s}(B_{s+\\cdot}-B_s)$。由于 $(Q_t)$ 是 Feller 半群且轨道连续，强马氏性随之成立。"},
  "c8-generator": {"t": "扩散的生成元", "b": "$(Q_t)$ 是 Feller 半群，$C_c^2(\\mathbb R^d)\\subset D(L)$，且 $Lf=\\tfrac12\\sum_{i,j}(\\sigma\\sigma^*)_{ij}\\partial_{ij}f+\\sum_ib_i\\partial_if$。证明：对 $f(X^x_t)$ 用 Itô 公式，$f(X_t)-f(x)-\\int_0^tLf(X_s)ds$ 是局部鞅，且在有限区间上有界，故为鞅。注意这并没有完整刻画 $D(L)$。"},
  "c8-explicit-solutions": {"t": "OU 过程与几何布朗运动", "b": "OU：$dX=dB-\\lambda Xdt$，$X_t=X_0e^{-\\lambda t}+\\int_0^te^{-\\lambda(t-s)}dB_s$，$X_0=x$ 时 $\\mathrm{cov}(X_s,X_t)=(e^{-\\lambda|t-s|}-e^{-\\lambda(t+s)})/(2\\lambda)$；$X_0\\sim\\mathcal N(0,1/(2\\lambda))$ 时平稳。几何布朗运动：$dX=\\sigma XdB+rXdt$，$X_t=X_0\\exp(\\sigma B_t+(r-\\sigma^2/2)t)$。"},
  "c8-bessel": {"t": "平方 Bessel 过程", "b": "$m$ 维平方 Bessel 过程解 $dX=2\\sqrt{X}dB+m\\,dt$（系数非 Lipschitz）；$d$ 维布朗运动的 $|\\beta|^2$ 是 $d$ 维的。$m>0,X_0=x$ 时 $X^{1-m/2}$（$m=2$ 时 $\\log X$）是局部鞅，给出 $P(T_\\varepsilon<T_A)$。$m\\ge2$ 时不击中 0；$m>2$ 时 $P(T_\\varepsilon<\\infty)=(\\varepsilon/x)^{m/2-1}$，且 $X_t\\to\\infty$ a.s.。"},
  "c8-yw-criterion": {"t": "一维轨道唯一性判别法", "b": "一维方程 $dX=\\sigma(X)dB+b(X)dt$ 中，若 $|\\sigma(x)-\\sigma(y)|\\le K\\sqrt{|x-y|}$ 且 $b$ Lipschitz，则轨道唯一性成立。方法：用 $|x|$ 的光滑近似 $F_n$ 对 $X-X'$ 作 Itô 公式，二阶项因 $\\tfrac12$-Hölder 而消失，再用 Gronwall 引理。可用于平方 Bessel 方程；高维无类似结论。"},
  "c8-scale-function": {"t": "尺度函数与时间变换", "b": "一维 $dX=\\sigma(X)dB+b(X)dt$，取 $F'(x)=\\exp(-\\int_0^x2b/\\sigma^2)$，则 $\\tfrac12\\sigma^2F''+bF'=0$，$Y=F(X)$ 无漂移：$dY=(\\sigma F')(F^{-1}(Y))dB$。再由时间变换法（$\\varepsilon\\le\\sigma\\le M$ 时 $dX=\\sigma(X)dB$ 弱存在、弱唯一）得到原方程的弱存在与弱唯一。"},
  "c9-gen-ito": {"t": "凸函数与广义 Itô 公式", "b": "若 $f$ 是凸函数之差，则 $f(X_t)=f(X_0)+\\int_0^tf'_-(X_s)dX_s+\\tfrac12\\int_{\\mathbb R}L^a_t(X)f''(da)$，其中 $f''(da)$ 是 $f$ 的分布二阶导数（$f''([a,b))=f'_-(b)-f'_-(a)$）。$f\\in C^2$ 时退化为通常的 Itô 公式。用右导数 $f'_+$ 也有类似分解，但递增项一般会变。"},
  "c9-tanaka": {"t": "Tanaka 公式与局部时定义", "b": "$L^a_t(X):=|X_t-a|-|X_0-a|-\\int_0^t\\mathrm{sgn}(X_s-a)dX_s$ 是连续递增过程，其中约定 $\\mathrm{sgn}(0)=-1$（对应左导数）。$(X_t-a)^\\pm$ 的公式各带 $\\tfrac12L^a_t$。对停时 $T$ 有 $L^a_t(X^T)=L^a_{t\\wedge T}(X)$。例：对布朗运动，$E[L^0_t]=E|B_t|$。"},
  "c9-support": {"t": "局部时的支撑性质", "b": "a.s. 测度 $d_sL^a_s(X)$ 支撑在 $\\{s:X_s=a\\}$ 上，即 $L^a$ 只在 $X=a$ 时增长；一般只是包含关系。对布朗运动，固定 $a$ 时包含关系 a.s. 是等号（Trotter 定理），但 a.s. 存在某个（随机的）$a$ 使等号不成立，例如 $a=\\max_{[0,1]}B$。"},
  "c9-cadlag": {"t": "局部时关于 $a$ 的正则性", "b": "$a\\mapsto L^a(X)$ 有 càdlàg 修正，跃度为 $L^a_t-L^{a-}_t=2\\int_0^t\\mathbf 1_{\\{X_s=a\\}}dV_s$（$V$ 为有限变差部分）。因此连续局部鞅的局部时关于 $(a,t)$ 联合连续。例：$L^0_t(|X|)=L^0_t(X)+L^{0-}_t(X)$。"},
  "c9-occupation-cons": {"t": "占位密度公式的推论", "b": "由 $\\int_0^t\\varphi(X_s)d\\langle X,X\\rangle_s=\\int\\varphi(a)L^a_tda$ 可得：对任意 $b$，$\\int_0^t\\mathbf 1_{\\{X_s=b\\}}d\\langle M,M\\rangle_s=0$；若 $X=X_0+V$ 为有限变差过程，则所有局部时都为 0。但 $\\int\\mathbf 1_{\\{X_s=b\\}}dV_s$ 可以不为 0，这样的 $b$ 就是 $a\\mapsto L^a$ 的跳点。"},
  "c9-approx": {"t": "局部时的逼近", "b": "a.s. 有 $L^a_t=\\lim_{\\varepsilon\\to0}\\tfrac1\\varepsilon\\int_0^t\\mathbf 1_{\\{a\\le X_s\\le a+\\varepsilon\\}}d\\langle X\\rangle_s$（用到右连续性）。对称窗口给出对称局部时 $\\tfrac12(L^a_t+L^{a-}_t)$。上穿逼近：$\\varepsilon N^X_\\varepsilon(t)\\to\\tfrac12L^0_t$（依概率收敛）。"},
  "c9-exp-law": {"t": "击中时刻处局部时的分布", "b": "对从 0 出发的布朗运动：$L^0_{T_a}$ 服从均值为 $2|a|$ 的指数分布（$T_a$ 为首次击中 $a\\ne0$ 的时刻）；$L^0_{U_a}$ 服从均值为 $a$ 的指数分布（$U_a$ 为 $|B|$ 首次到达 $a$ 的时刻）。指数性来自强马氏性带来的无记忆性，均值由 Tanaka 公式求得。"},
  "c9-levy-proof": {"t": "Lévy 定理的 Skorokhod 证明", "b": "由 Tanaka 公式 $|B_t|=\\beta_t+L^0_t$，其中 $\\beta=\\int\\mathrm{sgn}(B)dB$ 是布朗运动。利用支撑性质可得 a.s. $L^0_t=\\sup_{s\\le t}(-\\beta_s)$，于是 $(L^0,|B|)$ 是布朗运动 $-\\beta$ 的 (最大值, 最大值减当前值)，从而与 $(S,S-B)$ 同分布。"},
  "c9-inverse-lt": {"t": "逆局部时与游程区间", "b": "$\\tau_s=\\inf\\{t:L^0_t(B)>s\\}$ 是递增的 càdlàg 过程，有平稳独立增量，且 $(\\tau_{\\lambda s})\\overset{d}{=}(\\lambda^2\\tau_s)$，即指标为 $1/2$ 的稳定从属子。零点集为 $\\{\\tau_s\\}\\cup\\{\\tau_{s-}:s\\in D\\}$（$D$ 为跳跃时刻集），游程区间为 $(\\tau_{s-},\\tau_s)$，$s\\in D$。"},
  "p1c1-algebra-sigma": {"t": "代数与 $\\sigma$-代数", "b": "代数是对取补与有限并封闭的非空集族，$\\sigma$-代数还要求对可数并封闭；由取补可得两者分别对有限交、可数交封闭，并且都包含 $\\emptyset$ 与 $\\Omega$。例：$\\mathbb{R}$ 上 $]a,b]$ 型区间的有限并构成代数但不是 $\\sigma$-代数；不可数集上“自身或补集至多可数”的集族是 $\\sigma$-代数。"},
  "p1c1-sigma-continuity": {"t": "$\\sigma$-可加性与连续性", "b": "对代数上的可加函数 $\\mu$，$\\sigma$-可加、$\\sigma$-次可加、从下连续三者等价；$\\sigma$-可加时还有从上连续，但要求 $\\mu(B_1)<\\infty$。当 $\\mu(\\Omega)<\\infty$ 时四者全部等价。若去掉有限性，从上连续可能不成立，例如计数测度下的尾集 $\\{k\\ge n\\}$。"},
  "p1c1-uniform-no-go": {"t": "均匀概率的不存在性", "b": "$\\sigma$-可加性限制很强：可数无限集上不存在使所有单点等概率的概率测度，因为可数个相同的数之和只能是 $0$ 或 $+\\infty$。同理（Vitali），$[0,1]$ 上不存在定义于全部子集、平移不变的 $\\sigma$-可加概率，所以必须把事件限制在比幂集小的 $\\sigma$-代数上。"},
  "p1c1-negligible-complete": {"t": "可忽略集与完备性", "b": "若 $N\\subseteq A$，$A\\in\\mathcal{F}$ 且 $P(A)=0$，则称 $N$ 可忽略；若 $C$ 的补集可忽略，则称 $C$ 几乎必然。它们未必是事件。若所有可忽略集都属于 $\\mathcal{F}$，则称空间完备，此时可忽略等价于概率为 $0$。完备性依赖于 $P$，并且总可以把空间完备化。"},
  "p1c1-complement-inclusion-exclusion": {"t": "补事件与容斥公式", "b": "$P(A^c)=1-P(A)$ 常把“至少一个”化为“一个也没有”。一般地，$P(\\bigcup_{k=1}^n A_k)=\\sum_{k=1}^n(-1)^{k-1}\\sum_{|I|=k}P(\\bigcap_{i\\in I}A_i)$；$n=2$ 时即 $P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$。例：掷 8 次骰子至少出现一次 6 的概率为 $1-5^8/6^8$。"},
  "p1c1-discrete-density": {"t": "离散概率由单点概率决定", "b": "在至多可数的 $\\Omega$ 上（取 $\\mathcal{F}=\\mathcal{P}(\\Omega)$），概率 $P$ 与满足 $p\\ge0$、$\\sum_\\omega p(\\omega)=1$ 的函数 $p(\\omega)=P(\\{\\omega\\})$ 一一对应，且 $P(A)=\\sum_{\\omega\\in A}p(\\omega)$。由于各项非负，求和与次序无关。均匀概率是 $p$ 为常数的特例，只在 $\\Omega$ 有限时才可能。"},
  "p1c1-urn-sample-space": {"t": "抽球模型与样本空间", "b": "有放回抽取用 $DR_{n,k}$（$n^k$ 个），不放回抽取用 $D_{n,k}$（$n!/(n-k)!$ 个），同时抽取用 $C_{n,k}$（$\\binom nk$ 个），三者都取均匀概率。“无序可重复”的结果（可重复组合）不是等可能的，重复越多的结果概率越小，因此应在 $DR_{n,k}$ 上计数。"},
  "p1c1-successive-choices": {"t": "逐次选择法", "b": "若集合中的元素能由有限步选择唯一确定，且第 $i$ 步的选法数 $n_i$ 与之前的选择无关，则元素个数为 $n_1n_2\\cdots n_k$。常见错误有：计入并不存在的结果、对同一结果重复计数（例如“先选一张 7，再任选其余”）、漏计结果。例：不放回抽取时，第 $k$ 次抽到白球的概率等于 $b/(b+r)$。"},
  "p1c1-binomial-hypergeom": {"t": "二项概率与超几何概率", "b": "袋中有 $b$ 个白球、$r$ 个红球，抽取 $n$ 次。有放回时恰得 $k$ 个白球的概率为 $\\binom nk p^k(1-p)^{n-k}$，其中 $p=b/(b+r)$；不放回时为 $\\binom bk\\binom r{n-k}/\\binom{b+r}n$，其中 $\\max\\{0,n-r\\}\\le k\\le\\min\\{n,b\\}$。"},
  "p1c1-cond-prob-bayes": {"t": "条件概率、全概率与 Bayes", "b": "$P(B)>0$ 时 $P(A\\mid B)=P(A\\cap B)/P(B)$，它是 $(\\Omega,\\mathcal F)$ 上的概率测度。对可数分割 $(B_i)$ 有全概率公式 $P(A)=\\sum_i P(A\\mid B_i)P(B_i)$；Bayes 公式 $P(B\\mid A)=P(A\\mid B)P(B)/P(A)$ 把“因→果”的概率反转为“果→因”。若 $P(A\\mid B)\\ne P(A\\mid B^c)$，还可由全概率公式反解出 $P(B)$。"},
  "p1c1-independence": {"t": "事件的独立性", "b": "$A,B$ 独立指 $P(A\\cap B)=P(A)P(B)$，它依赖于测度 $P$，且对取补封闭（$A,B^c$ 等也独立）。事件族 $(A_i)$ 独立要求对每个有限子族都有乘积公式；两两独立不蕴含独立，三重乘积公式也不蕴含两两独立。例如三枚骰子“两两点数相同”的三个事件两两独立却不独立。"},
  "p1c1-independent-sequences": {"t": "独立事件列：BC 引理", "b": "$(A_n\\ \\text{i.o.})=\\bigcap_n\\bigcup_{k\\ge n}A_k$。Borel–Cantelli：若 $\\sum P(A_n)<\\infty$ 则 $P(A_n\\ \\text{i.o.})=0$（无需独立）；若 $A_n$ 独立且 $\\sum P(A_n)=\\infty$ 则 $P(A_n\\ \\text{i.o.})=1$。另外，离散概率空间上不存在非平凡的无穷独立同概率事件列：必有 $p\\in\\{0,1\\}$，所以无穷次独立试验需要非离散的空间。"},
  "p1c1-completion": {"t": "概率空间的完备化", "b": "子集 $N$ 称为 $P$-可忽略的，若它含于某个零概率事件。完备化取 $\\bar{\\mathcal F}=\\{A\\cup N: A\\in\\mathcal F, N\\ \\text{可忽略}\\}=\\sigma(\\mathcal F\\cup\\mathcal N)$，并令 $\\bar P(A\\cup N)=P(A)$，此定义良好。完备化依赖于 $\\sigma$-代数与测度：例如 $(\\mathbb R,\\{\\emptyset,\\mathbb R\\},\\delta_x)$ 已完备，而 $(\\mathbb R,\\mathcal B,\\delta_x)$ 不完备。"},
  "p1c1-dist-uniqueness": {"t": "分布由生成族唯一确定", "b": "度量空间上的分布内外正则：$\\mu(H)$ 等于所含闭集测度的上确界、包含它的开集测度的下确界，故两个分布在所有开集（或闭集）上相等即相等。Carathéodory 定理：半环上的 $\\sigma$-有限预测度可唯一延拓到生成的 $\\sigma$-代数；存在性不需 $\\sigma$-有限，唯一性需要。由于 $]a,b]$ 构成生成 $\\mathcal B$ 的半环，实分布由 CDF 唯一确定。"},
  "p1c1-cdf-jumps": {"t": "CDF 的性质与跳跃", "b": "$F_\\mu(x)=\\mu(]-\\infty,x])$ 单调递增、右连续，在 $-\\infty$、$+\\infty$ 处极限为 0、1。左极限 $F_\\mu(x-)=\\mu(]-\\infty,x[)$，故 $\\mu(\\{x\\})=F_\\mu(x)-F_\\mu(x-)$：原子恰是跳跃点，质量等于跳跃量。单调函数至多有可数个间断点，所以任何分布的原子集至多可数。"},
  "p1c1-ac-singular": {"t": "离散、绝对连续及其他", "b": "离散分布形如 $\\sum p_n\\delta_{x_n}$；绝对连续分布形如 $\\mu(H)=\\int_H\\gamma$，密度只在 Lebesgue 零测集外唯一。绝对连续分布给 Lebesgue 零测集概率 0，这是判断无密度的实用检验。存在两类都不是的分布：如 $\\mathbb R^2$ 中线段上的均匀分布，或由连续的 Cantor–Vitali 函数（$V'=0$ a.e.）生成的分布。"},
  "p1c1-cdf-characterization": {"t": "CDF 刻画分布", "b": "一维：递增右连续的 $F$ 唯一确定 $\\sigma$-有限测度 $\\mu_F$，满足 $\\mu_F(]a,b])=F(b)-F(a)$；若极限为 0 和 1 则 $\\mu_F$ 是分布；$F$ 绝对连续当且仅当 $\\mu_F$ 绝对连续，此时 $F'$ 是密度。$d$ 维：CDF 除右连续和极限条件外还需矩形增量 $\\Delta^{(1)}\\cdots\\Delta^{(d)}F\\ge0$，仅对每个变量单调不够。"},
  "p1c2-cdf-transform": {"t": "用 CDF 求变换后的分布", "b": "求 $Y=f(X)$ 的分布时，先算 $F_Y(y)=P(f(X)\\le y)$ 再求导。若 $f$ 连续严格增，则 $F_Y=F_X\\circ f^{-1}$；若 $f\\in C^1$ 且 $f'\\ne0$，则 $\\gamma_Y=\\gamma_X(f^{-1})/|f'(f^{-1})|$。特别地，CDF 连续且严格增时 $F_X(X)\\sim\\mathrm{Unif}_{[0,1]}$，反过来 $F^{-1}(U)$ 的 CDF 为 $F$；若 $F_X$ 有跳跃，前一结论不成立。"},
  "p1c2-law-ac": {"t": "分布、同分布与绝对连续", "b": "$X$ 的分布 $\\mu_X(H)=P(X\\in H)$ 只描述取值的概率分配：$X\\overset d=Y$ 意为 $\\mu_X=\\mu_Y$，可以定义在不同空间上，同一空间上也不意味着 $X=Y$ a.s.。$X$ 绝对连续指 $\\mu_X$ 有密度，因此 $\\mu_X$ 不能给 Lebesgue 零测集正概率；例如 $(X,f(X))$ 集中在函数图像上，永远不是绝对连续的。"},
  "p1c2-geometric-memoryless": {"t": "几何分布的无记忆性", "b": "$T\\sim\\mathrm{Geom}_p$ 取值于 $\\{1,2,\\dots\\}$，$P(T=k)=p(1-p)^{k-1}$，尾概率 $P(T>n)=(1-p)^n$，并满足无记忆性 $P(T>n+k\\mid T>n)=P(T>k)$。反之，取值于 $\\mathbb N$ 且无记忆的随机变量必服从几何分布，参数 $p=P(T=1)$。均值为 $1/p$，方差为 $(1-p)/p^2$。"},
  "p1c2-gamma-chi2": {"t": "Gamma 分布与 $\\chi^2$", "b": "$\\mathrm{Gamma}_{\\alpha,\\lambda}$ 的密度为 $\\frac{\\lambda^\\alpha}{\\Gamma(\\alpha)}x^{\\alpha-1}e^{-\\lambda x}$（$x>0$），均值 $\\alpha/\\lambda$，方差 $\\alpha/\\lambda^2$，且 $\\mathrm{Gamma}_{1,\\lambda}=\\mathrm{Exp}_\\lambda$。尺度性质：$c>0$ 时 $cX\\sim\\mathrm{Gamma}_{\\alpha,\\lambda/c}$。若 $Z\\sim\\mathcal N_{0,1}$，则 $Z^2\\sim\\mathrm{Gamma}_{1/2,1/2}$，即 $\\chi^2$ 分布。由尺度性质还可得 $\\sigma Z$ 的平方服从 $\\mathrm{Gamma}_{1/2,1/(2\\sigma^2)}$；用 CDF 法计算时注意 $P(Z^2\\le x)=P(-\\sqrt x\\le Z\\le\\sqrt x)$ 要利用对称性。"},
  "p1c2-convergence-thms": {"t": "单调收敛、Fatou 与控制收敛", "b": "Beppo Levi：非负且单调增的 $X_n\\uparrow X$ 满足 $E[X_n]\\uparrow E[X]$。Fatou：对非负 $X_n$ 有 $E[\\liminf X_n]\\le\\liminf E[X_n]$。控制收敛：若 $X_n\\to X$ a.s. 且 $|X_n|\\le Y\\in L^1$，则 $E[X_n]\\to E[X]$。典型反例 $n\\mathbf 1_{]0,1/n[}$ 逐点趋于 0 而期望恒为 1，此时没有可积控制函数。"},
  "p1c2-expectation-law": {"t": "用分布计算期望", "b": "若 $X$ 的分布为 $\\mu_X$，$f$ 是 Borel 函数，则 $f(X)\\in L^1$ 当且仅当 $f\\in L^1(\\mu_X)$，且 $E[f(X)]=\\int f\\,d\\mu_X$；有密度时等于 $\\int f\\gamma_X\\,dx$，离散时为加权和。截断、示性函数分解后再对分布积分，是计算 $E[\\min\\{T,c\\}]$ 一类期望的标准做法。"},
  "p1c2-lp-jensen": {"t": "Jensen 不等式与 $L^p$ 包含", "b": "Jensen：$X$ 取值于区间 $]a,b[$，$f$ 在其上凸，且 $X,f(X)\\in L^1$，则 $f(E[X])\\le E[f(X)]$；$f$ 凹时不等号反向。取 $f=|x|^{p_2/p_1}$ 得 $\\|X\\|_{p_1}\\le\\|X\\|_{p_2}$（$p_1\\le p_2$），因而在概率空间上 $L^{p_2}\\subseteq L^{p_1}$，包含一般是严格的，例如 $P(\\{n\\})\\propto n^{-3}$ 时 $X(n)=n\\in L^1\\setminus L^2$。"},
  "p1c2-covariance": {"t": "协方差的计算", "b": "$\\mathrm{cov}(X,Y)=E[XY]-E[X]E[Y]$，是 $L^2$ 上对称双线性型；$\\mathrm{var}(X+Y)=\\mathrm{var}X+\\mathrm{var}Y+2\\mathrm{cov}(X,Y)$。对随机向量有 $\\mathrm{cov}(AX+b)=A\\,\\mathrm{cov}(X)A^*$，协方差矩阵对称半正定。已知联合密度时，边缘密度由对其余变量积分得到，再分别计算各阶矩。"},
  "p1c2-doob": {"t": "Doob 定理与确定性依赖", "b": "Doob 定理：$X\\in m\\sigma(Y)$ 当且仅当存在 Borel 函数 $f$ 使 $X=f(Y)$。确定性依赖只取决于 σ-代数的包含关系，与概率测度无关，且是单向的；随机独立则依赖于所取的 $P$。两者并非互为反面：常数与一切变量独立；而 $X$ 与其单射像 $f(X)$ 独立当且仅当 $X$ 几乎必然为常数。"},
  "p1c2-indep-criteria": {"t": "独立性的刻画与不相关", "b": "$X_1,X_2$ 独立等价于联合 CDF 分解为乘积，或 $\\mu_{(X_1,X_2)}=\\mu_{X_1}\\otimes\\mu_{X_2}$；有联合密度时等价于联合密度几乎处处等于边缘密度之积。独立且可积时 $XY$ 可积且 $E[XY]=E[X]E[Y]$，因此 $L^2$ 中独立推出不相关。反之不成立（如圆盘上的均匀分布）；只有在联合正态时不相关才推出独立。"},
  "p1c2-cond-event": {"t": "给定事件的条件分布与期望", "b": "设 $P(B)>0$，$X$ 在 $P(\\cdot\\mid B)$ 下的分布称为条件分布 $\\mu_{X|B}$，相应期望为 $E[X\\mid B]$。计算公式：$E[f(X)\\mid B]=\\frac{1}{P(B)}\\int_B f(X)dP=\\int f\\,d\\mu_{X|B}$。若 $(X,Y)$ 有联合密度，则 $X$ 给定 $(Y\\in K)$ 的条件密度为 $\\frac{1}{P(Y\\in K)}\\int_K\\gamma_{(X,Y)}(x,y)dy$。例：$T\\sim\\mathrm{Exp}_\\lambda$ 给定 $T>t_0$ 是平移 $t_0$ 的指数分布。"},
  "p1c2-chf-moments": {"t": "特征函数与矩", "b": "若 $X\\in L^p$，则 $\\varphi_X(\\eta)=\\sum_{k\\le p}\\frac{E[(iX)^k]}{k!}\\eta^k+o(\\eta^p)$，于是 $\\varphi_X$ 在 $0$ 处 $p$ 阶可微且 $\\varphi_X^{(k)}(0)=i^kE[X^k]$。反面例子：Cauchy 分布不可积，其特征函数 $e^{-|\\eta|}$ 在原点不可微。一般地 $\\varphi_X$ 总满足 $\\varphi_X(0)=1$、$|\\varphi_X|\\le1$、一致连续。"},
  "p1c2-chf-inversion": {"t": "反演定理", "b": "特征函数 $\\varphi(\\eta)=\\int e^{ix\\eta}\\mu(dx)$ 唯一决定分布 $\\mu$。若 $\\varphi\\in L^1(\\mathbb R)$，则 $\\mu$ 绝对连续，且密度为 $\\gamma(x)=\\frac1{2\\pi}\\int e^{-ix\\eta}\\varphi(\\eta)d\\eta$（有界连续）。该条件只是充分的：$\\mathrm{Unif}_{[-1,1]}$ 有密度，但特征函数 $\\sin\\eta/\\eta\\notin L^1$。"},
  "p1c2-chf-compound": {"t": "复合 Poisson 的特征函数", "b": "若 $N\\sim\\mathrm{Poisson}_\\lambda$ 与独立同分布的 $Z_k$ 相互独立，$X=\\sum_{k=1}^N Z_k$，则对 $N$ 的取值分解并利用独立性得 $\\varphi_X(\\eta)=\\exp(\\lambda(\\varphi_{Z_1}(\\eta)-1))$。再与已知分布的特征函数比对（如 $\\mathrm{Poisson}_\\lambda$ 的 $e^{\\lambda(e^{i\\eta}-1)}$）即可识别分布。"},
  "p1c2-chf-independence": {"t": "联合特征函数与独立性", "b": "$X_1,\\dots,X_n$ 独立当且仅当联合特征函数分解为边缘特征函数之积：$\\varphi_X(\\eta_1,\\dots,\\eta_n)=\\prod\\varphi_{X_i}(\\eta_i)$。不相关一般推不出独立，需直接检验这一分解；一个变量是另一个的函数也不排除独立（如 Rademacher 变量 $X$ 与 $XY$）。"},
  "p1c2-gauss-vector": {"t": "高斯向量", "b": "$X\\sim N_{\\mu,C}$（$C$ 对称半正定）指 $\\varphi_X(\\eta)=e^{i\\langle\\mu,\\eta\\rangle-\\frac12\\langle C\\eta,\\eta\\rangle}$；$C$ 退化时没有密度。$X$ 是高斯向量当且仅当每个 $\\langle\\eta,X\\rangle$ 都是正态，且 $\\alpha X+\\beta\\sim N_{\\alpha\\mu+\\beta,\\alpha C\\alpha^*}$。对高斯向量，分量独立当且仅当不相关；仅边缘为正态时这一结论不成立。"},
  "p1c2-max-min": {"t": "独立变量的最大值与最小值", "b": "$X_1,\\dots,X_n$ 独立时，$F_{\\max}(x)=\\prod F_{X_k}(x)$，$1-F_{\\min}(y)=\\prod(1-F_{X_k}(y))$，依据是 $(\\max\\le x)=\\bigcap(X_k\\le x)$，$(\\min>y)=\\bigcap(X_k>y)$。例：独立 $\\mathrm{Exp}_{\\lambda_k}$ 的最小值服从 $\\mathrm{Exp}_{\\lambda_1+\\cdots+\\lambda_n}$。"},
  "p1c2-sum-indep": {"t": "独立和与卷积", "b": "独立绝对连续变量之和的密度是卷积 $\\gamma_X*\\gamma_Y$，离散情形为离散卷积。由此得：$\\mathrm{Bin}_{n,p}+\\mathrm{Bin}_{m,p}=\\mathrm{Bin}_{n+m,p}$，Poisson 参数相加，正态均值和方差相加，$\\mathrm{Gamma}_{\\alpha,\\lambda}+\\mathrm{Gamma}_{\\beta,\\lambda}=\\mathrm{Gamma}_{\\alpha+\\beta,\\lambda}$；特别地 $n$ 个独立标准正态的平方和服从 $\\chi^2(n)=\\mathrm{Gamma}_{n/2,1/2}$。"},
  "p1c3-conv-relations": {"t": "收敛方式之间的关系", "b": "同一概率空间上：几乎必然收敛与 $L^p$ 收敛都推出依概率收敛，依概率收敛推出依分布收敛，并且存在几乎必然收敛的子列。反向的补救：若依概率收敛且有 $Y\\in L^p$ 使 $|X_n|\\le Y$，则 $L^p$ 收敛；若依分布收敛到常数，则依概率收敛。依概率收敛可由度量 $E[|X-Y|/(1+|X-Y|)]$ 刻画，而几乎必然收敛不能由任何拓扑诱导。"},
  "p1c3-counterexamples": {"t": "收敛方式的经典反例", "b": "$n^2\\mathbf 1_{(0,1/n)}$：几乎必然收敛但任何 $L^p$ 都不收敛。“打字机”序列 $\\mathbf 1_{J_n}$(二进区间依次扫过 $[0,1]$)：$L^p$ 收敛但处处不收敛。$X\\sim\\mathrm{Be}_{1/2}$ 与 $1-X$ 交替：同分布因而依分布收敛，但不依概率收敛。小概率的大跳跃也可让依概率收敛成立而 $L^2$ 范数不趋于 0。"},
  "p1c3-markov-tail": {"t": "Markov 不等式与尾部公式", "b": "Markov：$P(|X|\\ge\\lambda)\\le E[|X|^p]/\\lambda^p$；取 $p=2$ 并中心化得 Chebyshev：$P(|Y-E[Y]|\\ge\\lambda)\\le\\mathrm{var}(Y)/\\lambda^2$。反方向，对 $f\\in C^1$ 且 $f'\\ge0$ 有 $E[f(|X|)]=f(0)+\\int_0^\\infty f'(t)P(|X|\\ge t)\\,dt$，特别地 $E|X|^p=p\\int_0^\\infty t^{p-1}P(|X|\\ge t)\\,dt$，用尾部估计判断可积性。"},
  "p1c3-lln": {"t": "大数律", "b": "$X_n$ i.i.d.，$M_n=S_n/n$。若 $X_1\\in L^2$，则 $E[(M_n-\\mu)^2]=\\sigma^2/n$，得 $L^2$ 收敛及依概率收敛，且(强大数律)几乎必然收敛；若只设 $X_1\\in L^1$，特征函数方法给出 $M_n\\xrightarrow{d}\\mu$，Kolmogorov 强大数律给出几乎必然收敛。应用：Bernstein 多项式 $f_n(p)=E[f(M_n)]$($X_i\\sim\\mathrm{Be}_p$)一致逼近 $f\\in C([0,1])$；Monte Carlo 方法。"},
  "p1c3-cdf-weak": {"t": "弱收敛与 CDF 收敛", "b": "实分布 $\\mu_n\\xrightarrow{d}\\mu$ 当且仅当 $F_{\\mu_n}(x)\\to F_\\mu(x)$ 对 $F_\\mu$ 的每个连续点 $x$ 成立；间断点处可以不收敛，例如 $\\delta_{1/n}\\to\\delta_0$ 而 $F_n(0)=0$。弱收敛也不意味着对所有 Borel 集 $\\mu_n(H)\\to\\mu(H)$。求极小值、极大值等的极限分布时，常直接计算 CDF 再用此判据。"},
  "p1c3-tightness": {"t": "紧性与 Helly 定理", "b": "分布族 $(\\mu_i)$ tight：对每个 $\\epsilon>0$ 有 $M$ 使对所有 $i$，$\\mu_i(\\mathbb R\\setminus(-M,M))\\le\\epsilon$。Helly 定理：tight 序列必有弱收敛子列。没有 tight 性时 CDF 可以逐点收敛到非 CDF 的函数，例如 $\\delta_n$ 的 CDF 趋于 $0$，质量逃逸到无穷，序列没有弱收敛子列。"},
  "p1c3-levy": {"t": "Lévy 连续性定理", "b": "(i) 若 $\\mu_n\\xrightarrow{d}\\mu$，则特征函数逐点收敛到 $\\varphi_\\mu$。(ii) 若 $\\varphi_{\\mu_n}$ 逐点收敛到某个在 $0$ 处连续的函数 $\\varphi$，则 $\\varphi$ 是某分布 $\\mu$ 的 CHF 且 $\\mu_n\\xrightarrow{d}\\mu$。在 $0$ 处的连续性不可省略：$N_{0,n}$ 的 CHF 趋于 $\\mathbf 1_{\\{0\\}}$，但序列不弱收敛。典型应用：几何分布(缩放)趋于指数分布，二项分布 $\\mathrm{Bin}_{n,p_n}$($np_n\\to\\lambda$)趋于 Poisson。"},
  "p1c3-clt": {"t": "中心极限定理", "b": "$X_n$ i.i.d. 属于 $L^2$，均值 $\\mu$，标准差 $\\sigma>0$，则 $(S_n-n\\mu)/(\\sigma\\sqrt n)\\xrightarrow{d}N_{0,1}$；等价地，$n$ 大时 $M_n$ 近似服从 $N_{\\mu,\\sigma^2/n}$。用途：二项分布的正态近似 $P(X\\le k)\\approx\\Phi((k-np)/\\sqrt{np(1-p)})$；Monte Carlo 的置信区间半径 $1.96\\sigma/\\sqrt n$(95%)。若 $X_1\\in L^3$，Berry–Esseen 给出 $O(n^{-1/2})$ 的一致误差界。"},
  "p1c4-discrete-condexp": {"t": "离散情形的条件期望", "b": "若 $Y$ 离散，取值 $y_n$，且 $B_n=(Y=y_n)$ 都有正概率，则 $E[X\\mid Y]=\\sum_n E[X\\mid B_n]1_{B_n}$，其中 $E[X\\mid B_n]=E[X1_{B_n}]/P(B_n)$。它是在划分每一块上取常数的随机变量。全概率公式 $\\mu_X=E[\\mu_{X\\mid Y}]$ 给出 $E[X]=\\sum_n E[X\\mid B_n]P(B_n)$。要区分数值 $E[X\\mid B]$ 与随机变量 $E[X\\mid 1_B]$。"},
  "p1c4-cond-law-sum": {"t": "给定和的条件分布", "b": "求 $\\mu_{X_1\\mid Y}$（$Y=X_1+X_2$，两者独立）时，计算 $P(X_1=k\\mid Y=n)=P(X_1=k)P(X_2=n-k)/P(Y=n)$。Poisson 情形得到 $\\mathrm{Bin}_{Y,\\lambda_1/(\\lambda_1+\\lambda_2)}$；两个独立 $\\mathrm{Geom}_p$（取值 $\\ge1$）相加时，联合概率与 $k$ 无关，条件分布是 $\\{1,\\dots,Y-1\\}$ 上的均匀分布。"},
  "p1c4-condexp-def": {"t": "条件期望的定义与版本", "b": "$X\\in L^1$ 时，$Z=E[X\\mid\\mathcal G]$ 指：(i) $Z\\in m\\mathcal G$；(ii) 对一切有界 $W\\in m\\mathcal G$ 有 $E[ZW]=E[XW]$。(ii) 可换成只对生成 $\\mathcal G$ 的 $\\cap$-封闭族中的 $G$ 验证 $E[Z1_G]=E[X1_G]$。这样的 $Z$ 存在且 a.s. 唯一，称为一个版本。与版本 a.s. 相等的变量只有在仍为 $\\mathcal G$-可测时才是版本。"},
  "p1c4-condexp-props": {"t": "条件期望的性质与冻结引理", "b": "主要性质：$E[E[X\\mid\\mathcal G]]=E[X]$；线性、单调；有界 $X\\in m\\mathcal G$ 可以提出：$E[XY\\mid\\mathcal G]=XE[Y\\mid\\mathcal G]$；$\\mathcal H\\subseteq\\mathcal G$ 时有塔性质；条件 Beppo Levi、Fatou、控制收敛、Jensen；$\\|E[X\\mid\\mathcal G]\\|_p\\le\\|X\\|_p$。冻结引理：$X\\in m\\mathcal G$，$Y$ 与 $\\mathcal G$ 独立，$f$ 为 Borel 函数且 $f(X,Y)\\in L^1$，则 $E[f(X,Y)\\mid\\mathcal G]=F(X)$，其中 $F(x)=E[f(x,Y)]$。"},
  "p1c4-l2-projection": {"t": "$L^2$ 投影与正态回归", "b": "$X\\in L^2$ 时，$E[X\\mid\\mathcal G]$ 是 $X$ 在 $L^2(\\Omega,\\mathcal G,P)$ 上的正交投影，即在 $\\mathcal G$-可测变量中使 $E|X-W|^2$ 最小。残差 $X-Z$ 均值为零，且与每个 $W\\in L^2(\\mathcal G)$ 不相关，但一般不独立。$(X,Y)$ 为二维正态时，$\\mu_{X\\mid Y}=\\mathcal N_{\\mu_1+(Y-\\mu_2)\\sigma_{XY}/\\sigma_Y^2,\\ \\sigma_X^2-\\sigma_{XY}^2/\\sigma_Y^2}$。"},
  "p1c4-bayes": {"t": "条件期望的 Bayes 公式", "b": "设在 $\\mathcal F$ 上 $Q\\ll P$，$L=dQ/dP$，则对 $X\\in L^1(Q)$ 有 $E^Q[X\\mid\\mathcal G]=E^P[XL\\mid\\mathcal G]/E^P[L\\mid\\mathcal G]$，其中分母 $Q$-a.s. 为正。$Q$ 在 $\\mathcal G$ 上相对于 $P$ 的 Radon-Nikodym 导数是 $E^P[L\\mid\\mathcal G]$；$L$ 本身一般不是 $\\mathcal G$-可测的。"},
  "p1c4-regular-version": {"t": "正则条件概率与正则条件分布", "b": "正则条件概率是一族概率测度 $(P_\\omega(\\cdot\\mid\\mathcal G))_\\omega$，满足对每个 $A$ 有 $P(A\\mid\\mathcal G)=E[1_A\\mid\\mathcal G]$。一般未必存在，但在 Polish 空间上存在。对 $\\mathbb R^d$ 值的 $X$，正则条件分布 $\\mu_{X\\mid\\mathcal G}$ 总存在：先在可数集 $\\mathbb Q$ 上取 $E[1_{(X\\le q)}\\mid\\mathcal G]$，去掉一个零集后得到 $\\mathbb Q$ 上的 CDF，再延拓并用 Dynkin 定理验证。"},
  "p1c4-cond-law-integrals": {"t": "用正则条件分布计算条件期望", "b": "若 $\\mu_{X\\mid\\mathcal G}$ 是正则版本且 $f(X)\\in L^1$，则 $E[f(X)\\mid\\mathcal G]=\\int f\\,d\\mu_{X\\mid\\mathcal G}$。全概率公式写作 $\\mu_X=E[\\mu_{X\\mid\\mathcal G}]$。例：$\\mu_{X\\mid Y}=\\mathcal N_{Y,1}$ 时 $E[X\\mid Y]=Y$，再结合全概率公式与提取已知量，可算出 $E[X]$、$E[XY]$ 等矩。要注意：只有正则版本才保证对每个 $\\omega$ 上式的积分都有意义。"},
  "p1c4-cond-density": {"t": "条件密度与联合密度", "b": "$(X,Y)$ 绝对连续时，$\\gamma_{X\\mid Y}(x,y)=\\gamma_{(X,Y)}(x,y)/\\gamma_Y(y)$（$\\gamma_Y>0$ 处）是条件密度，且 $E[f(X)\\mid Y=y]=\\int f(x)\\gamma_{X\\mid Y}(x,y)dx$。反过来，$\\gamma_{(X,Y)}=\\gamma_{X\\mid Y}\\gamma_Y$，$\\gamma_X=E[\\gamma_{X\\mid Y}(\\cdot,Y)]$。随机参数的混合可能产生重尾，例如正态尺度混合得到 Cauchy 分布。"},
};

// ---------- 做题日历：最近一年每天答了多少题（每答一题记一次，包括重做） ----------
const HEAT_STEPS = [1, 10, 25, 50];   // 颜色档：1–9、10–24、25–49、50 题以上
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const heatLevel = n => HEAT_STEPS.filter(s => n >= s).length;
function heatCard(raw) {
  const counts = new Map();
  raw.forEach(d => { const t = new Date(d.at); if (!isNaN(t)) { const k = dayKey(t); counts.set(k, (counts.get(k) || 0) + 1); } });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 7 * 52 - (today.getDay() + 6) % 7);   // 52 周前的周一
  const card = el("section", "card heat-card");
  card.append(el("h3", null, "做题日历"));
  // 统计：最近一年题数、做题天数、连续天数（今天还没做时从昨天算起）、今天
  let total = 0, days = 0;
  for (const [k, n] of counts) if (new Date(k + "T00:00") >= start) { total += n; days++; }
  let streak = 0; const d = new Date(today);
  if (!counts.get(dayKey(d))) d.setDate(d.getDate() - 1);
  while (counts.get(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  const stats = el("div", "heat-stats");
  [["最近一年", `${total} 题`], ["做题", `${days} 天`], ["连续", `${streak} 天`], ["今天", `${counts.get(dayKey(today)) || 0} 题`]]
    .forEach(([k, v]) => { const s = el("span", null, k + " "); s.append(el("b", null, v)); stats.append(s); });
  card.append(stats);
  // 网格：每列一周（周一在上），第一行是月份
  const scroll = el("div", "heat-scroll"), grid = el("div", "heat-grid");
  grid.setAttribute("role", "img");
  grid.setAttribute("aria-label", `最近一年做题日历：共 ${total} 题，${days} 天`);
  ["", "一", "", "三", "", "五", "", "日"].forEach(t => grid.append(el("span", "hw", t)));
  const info = el("div", "heat-day", "点一个格子看当天做了多少题。");
  const fmt = dt => `${dt.getFullYear()} 年 ${dt.getMonth() + 1} 月 ${dt.getDate()} 日（周${"日一二三四五六"[dt.getDay()]}）`;
  let lastMonth = -1;
  for (const wk = new Date(start); wk <= today; wk.setDate(wk.getDate() + 7)) {
    const m = wk.getMonth(), endOfWeek = new Date(wk); endOfWeek.setDate(endOfWeek.getDate() + 6);

// ---------- 备份与恢复：所有记录 + 本机设置 → 一个 .json 文件；恢复时合并，已有的记录不重复 ----------
const BK_COLLS = ["answers", "exams", "vocab"];
const BK_PREFIX = "sq-";   // 本页在浏览器里的设置键前缀
const BK_APP = (BANK[0] && BANK[0].id.split("-")[0]) || "quiz";
const bkKey = d => JSON.stringify(Object.keys(d).sort().map(k => [k, d[k]]));
async function bkCollect() {
  const db = {};
  for (const c of BK_COLLS) db[c] = (await dbRef.collection(c).get()).docs.map(d => d.data());
  const ls = {};
  try {
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);
      if (key && (key.startsWith(BK_PREFIX) && !key.startsWith(BK_PREFIX + "db-") || key === "quiz-remind")) ls[key] = localStorage.getItem(key);
    }
  } catch (e) {}
  return { app: BK_APP, title: document.title, version: 1, at: new Date().toISOString(), db, ls };
}
async function bkSave(text, name) {
  if (typeof claude !== "undefined") {
    const dl = await claude.use("downloads");
    if (dl) { await dl.save({ filename: name, data: text }); return "saved"; }
    await navigator.clipboard.writeText(text); return "copied";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return "saved";
}
function backupRow() {
  const row = el("div", "heat-remind bk-row");
  row.append(el("span", "bk-name", "备份与恢复"));
  const out = el("button", "btn ghost", "备份记录"); out.type = "button"; out.id = "bkOut";
  const inBtn = el("button", "btn ghost", "从备份恢复"); inBtn.type = "button"; inBtn.id = "bkIn";
  const file = el("input"); file.type = "file"; file.accept = ".json,application/json"; file.hidden = true; file.id = "bkFile";
  const note = el("span", "bk-note", "把错题本、做题日历、单词记录和本机设置存成一个文件，换设备或清除数据后可以恢复。");
  const busy = on => { out.disabled = inBtn.disabled = on; };
  out.addEventListener("click", async () => {
    if (!dbRef) { note.textContent = "当前视图无法读取记录，不能备份。"; return; }
    busy(true); note.textContent = "正在整理记录…";
    try {
      const data = await bkCollect();
      const n = BK_COLLS.reduce((s, c) => s + data.db[c].length, 0);
      const d = new Date(), p2 = x => String(x).padStart(2, "0");
      const name = `${BK_APP}-quiz-backup-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}.json`;
      const how = await bkSave(JSON.stringify(data), name);
      note.textContent = how === "copied" ? `共 ${n} 条记录。这里不能下载文件，备份内容已复制到剪贴板，可以粘贴到备忘录里另存为 .json 文件。`
        : `已生成备份文件 ${name}（共 ${n} 条记录），请保存好。`;
    } catch (e) {
      note.textContent = e && e.code === "declined" ? "已取消保存。" : "备份没有完成，请稍后再试。";
    }
    busy(false);
  });
  inBtn.addEventListener("click", () => { if (!dbRef) { note.textContent = "当前视图无法保存记录，不能恢复。"; return; } file.value = ""; file.click(); });
  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { note.textContent = "这个文件不是有效的备份文件。"; return; }
    if (!data || typeof data.db !== "object") { note.textContent = "这个文件不是有效的备份文件。"; return; }
    if (data.app && data.app !== BK_APP && !confirm(`这个备份来自“${data.title || data.app}”，不是本页的记录。仍然导入吗？`)) return;
    busy(true);
    let added = 0, skipped = 0, failed = 0, total = 0;
    try {
      for (const c of BK_COLLS) total += Array.isArray(data.db[c]) ? data.db[c].length : 0;
      for (const c of BK_COLLS) {
        const list = Array.isArray(data.db[c]) ? data.db[c] : [];
        if (!list.length) continue;
        const have = new Set((await dbRef.collection(c).get()).docs.map(d => bkKey(d.data())));
        for (const d of list) {
          if (!d || typeof d !== "object") { failed++; continue; }
          const k = bkKey(d);
          if (have.has(k)) { skipped++; continue; }
          try { await dbRef.collection(c).add(d); have.add(k); added++; }
          catch (e) { failed++; if (e && e.code === "quota_exceeded") throw e; }
          if ((added + skipped + failed) % 20 === 0) note.textContent = `正在恢复… ${added + skipped + failed} / ${total}`;
        }
      }
      if (data.ls && typeof data.ls === "object") {
        try { for (const [k, v] of Object.entries(data.ls)) if (typeof v === "string" && (k.startsWith(BK_PREFIX) || k === "quiz-remind")) localStorage.setItem(k, v); } catch (e) {}
      }
      note.textContent = `恢复完成：新增 ${added} 条记录` + (skipped ? `，${skipped} 条已存在（跳过）` : "") + (failed ? `，${failed} 条没能写入` : "") + "。";
    } catch (e) {
      note.textContent = `恢复到一半停止了（已新增 ${added} 条）：记录存储已满。`;
    }
    busy(false);
    bookCache = null;
    if (typeof vStats !== "undefined") vStats = null;
    if (view === "book") { const keep = note.textContent; renderBook(); setTimeout(() => { const n = $("bkOut")?.parentElement?.querySelector(".bk-note"); if (n) n.textContent = keep; }, 0); }
  });
  row.append(out, inBtn, file, note);
  return row;
}

// 日历文件每行不超过 75 字节，长行折行（续行以空格开头），不拆开多字节字符
function foldIcs(line) {
  const enc = new TextEncoder(), out = [];
  let cur = "", lim = 75;
  for (const ch of line) {
    if (enc.encode(cur + ch).length > lim) { out.push(cur); cur = " "; lim = 75; }
    cur += ch;
  }
  out.push(cur);
  return out.join("\r\n");
}

const tagSaved = (() => { try { return JSON.parse(localStorage.getItem("sq-tags") || "{}"); } catch (e) { return {}; } })();
let pickTags = new Set(tagSaved.tags || []);
let tagMode = tagSaved.mode === "all" ? "all" : "any";
let tagRandom = !!tagSaved.rand;   // “随机”：打乱检索结果的顺序   // any：带任一所选标签；all：同时带所有所选标签
const saveTags = () => { try { localStorage.setItem("sq-tags", JSON.stringify({ tags: [...pickTags], mode: tagMode, rand: tagRandom })); } catch (e) {} };
function tagMatch(q, tags, mode) {
  if (!q || !tags.length) return false;
  const lv = tags.filter(t => LEVELS.includes(t)), tp = tags.filter(t => !LEVELS.includes(t));
  if (lv.length && !lv.includes(q.level)) return false;
  return !tp.length || (mode === "all" ? tp.every(t => q.tags.includes(t)) : tp.some(t => q.tags.includes(t)));
}
const tagKey = (kind, tags = [...pickTags], mode = tagMode, rnd = tagRandom) => `${kind}:${mode}${rnd ? "!" : ""}:${tags.join("|")}`;
function parseTagKey(key) {
  const m = /^(tag|wrong):(any|all)(!?):(.*)$/.exec(key);
  return m ? { kind: m[1], mode: m[2], rnd: m[3] === "!", tags: m[4] ? m[4].split("|") : [] } : null;
}
const wrongIds = () => new Set((bookCache?.wrong || []).map(d => d.qid));
function tagLabel(p) {
  const lv = p.tags.filter(t => LEVELS.includes(t)).sort((a, b) => LEVELS.indexOf(a) - LEVELS.indexOf(b)), tp = p.tags.filter(t => !LEVELS.includes(t));
  const t = (lv.length ? lv.join("/") + (tp.length ? " · " : "") : "") + (tp.length ? tp.join(p.mode === "all" ? " + " : " / ") : lv.length ? "" : "全部");
  return (p.kind === "wrong" ? "错题 · " : "标签 · ") + (p.rnd ? "随机 · " : "") + t + (tp.length > 1 ? (p.mode === "all" ? "（同时满足）" : "（任一）") : "");
}
