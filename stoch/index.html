  const epKeys = SHOW_EPS.map((_, k) => "ep:" + (k + 1));
  const showKeys = ["fr-r13", ...epKeys];
  const listen = folder("全部听力题", "", listenKeys, k => {
    const [nm, sub] = ROUNDS.find(r => r.id === k).name.split(" · ");
    return groupEntry(k, { title: sub || nm, zh: nm });
  });
  listen.classList.add("listen-folder");
  const show = folder("废柴联盟 · 第一季", "按集", showKeys, k => k === "fr-r13"
    ? groupEntry(k, { title: "第一季代词（全部）", zh: "台词里的代词题" })
    : groupEntry(k, { no: "E" + k.slice(3), title: SHOW_EPS[Number(k.slice(3)) - 1] }));
  show.classList.add("show-folder");
  const holder = el("li");
  holder.append(show);
  listen.querySelector("ul").append(holder);
  // 听力文件夹默认展开；子文件夹在选中或有错题时展开
  listen.open = true;
  toc.append(listen);
  }

  // 按章节（只算语法题）
  const chapters = book => {
    toc.append(el("div", "toc-sec", "按章节"));
    PARTS.filter(pt => pt.book === book).forEach(pt => {
      const keys = pt.chs.map(([n]) => "ch:" + n);
      toc.append(folder(`${pt.n} ${pt.t}`, pt.p ? `p.${pt.p}` : "面试题", keys, k => {
        const c = CH.get(Number(k.slice(3)));
        return groupEntry(k, { no: c.p ? String(c.no) : "", title: c.p ? c.t : c.zh, zh: c.p ? `${c.zh} · p.${c.p}` : c.t });
      }));
    });
  };
  chapters(undefined);

  // 第二本书：Pascucci，与 Le Gall 分开
  toc.append(el("div", "toc-book toc-book2", "Pascucci · Probability Theory I: Random Variables and Distributions（Unitext 165）"));
  if (view === "quiz") {
    toc.append(el("div", "toc-sec", "按轮次"));
    const ul3 = el("ul");
    ROUNDS.filter(r => r.kind === "p1").forEach(r => {
      const [nm, sub] = r.name.split(" · ");
      ul3.append(groupEntry(r.id, { title: nm, zh: sub }));
    });
    toc.append(ul3);
  }
  chapters("p1");
}

// ---------- 答题 ----------
function updateProgress(done) {
  pSet.textContent = set.label;
  const jumpInput = document.getElementById("jumpInput");
  jumpInput.max = set.qs.length;
  if (document.activeElement !== jumpInput) jumpInput.value = Math.min(idx + 1, set.qs.length);
  document.getElementById("pTotal").textContent = `/ ${set.qs.length}`;
  const n = bEnd() - bStart, d = Math.max(0, Math.min(done, bEnd()) - bStart);
  pBar.style.width = (n ? d / n * 100 : 0) + "%";
  pScore.textContent = `本组 ${d}/${n} · 得分 ${score}`;
}

// ---------- 跳到指定题号 ----------
function jumpTo() {
  const input = document.getElementById("jumpInput");
  const n = parseInt(input.value, 10);
  if (!set || !Number.isFinite(n)) { input.value = idx + 1; return; }
  idx = Math.min(Math.max(n, 1), set.qs.length) - 1;
  bStart = idx;
  for (let k = bStart; k < bEnd(); k++) delete answers[k];
  score = calcScore();
  input.blur();
  if (view !== "quiz") switchView("quiz");
  beginBatch();
}
document.getElementById("jumpBtn").addEventListener("click", jumpTo);
document.getElementById("jumpInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); jumpTo(); } });

// ---------- 听力：调用设备自带的法语语音朗读 ----------
const tts = "speechSynthesis" in window ? window.speechSynthesis : null;
let frVoice = null;
let userActivated = false;   // 浏览器只允许在点击之后出声
document.addEventListener("pointerdown", () => { userActivated = true; }, { capture: true });
document.addEventListener("keydown", () => { userActivated = true; }, { capture: true });
function pickVoice() {
  if (!tts) return null;
  const fr = tts.getVoices().filter(v => /^fr/i.test(v.lang));
  const score = v => (/^fr[-_]FR/i.test(v.lang) ? 4 : 0) + (/enhanced|premium|natural|neural/i.test(v.name) ? 3 : 0)
    + (/amélie|amelie|thomas|audrey|aurélie|marie/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
  fr.sort((a, b) => score(b) - score(a));
  return fr[0] || null;
}
if (tts) { frVoice = pickVoice(); tts.addEventListener?.("voiceschanged", () => { frVoice = pickVoice(); }); }
function speak(text, rate, btn) {
  if (!tts) return false;
  lastAutoAudio = text;
  tts.cancel();
  document.querySelectorAll('.play[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false"));
  // 长文按句子拆开排队朗读，避免一次读太长被系统截断
  const parts = text.match(/[^.!?…]+[.!?…]+["»]?\s*|[^.!?…]+$/g) || [text];
  parts.forEach((part, k) => {
    const u = new SpeechSynthesisUtterance(part.trim());
    u.lang = "fr-FR";
    if (frVoice) u.voice = frVoice;
    u.rate = rate;
    if (btn && k === parts.length - 1) u.onend = u.onerror = () => btn.setAttribute("aria-pressed", "false");
    tts.speak(u);
  });
  if (btn) btn.setAttribute("aria-pressed", "true");
  return true;
}
let lastAutoAudio = null;   // 同一篇长文的几道题之间不重复自动播放

function typeset(node) {
  const mj = window.MathJax;
  if (mj && mj.typesetPromise) mj.typesetPromise([node]).then(() => fitWide(node)).catch(() => {});
  else setTimeout(() => typeset(node), 300);
}
// 比所在段落还宽的公式改成独占一行、可横向滚动
function fitWide(node) {
  node.querySelectorAll("mjx-container").forEach(m => {
    m.classList.remove("mjx-wide");
    const host = m.parentElement.closest(".opt > span, .q, .kp-b, .explain, li, p, div") || m.parentElement;
    const cs = getComputedStyle(host);
    const room = host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (m.getBoundingClientRect().width > room + 1) m.classList.add("mjx-wide");
  });
}
let fitTimer = 0;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => fitWide(stage), 150); });

let hintUsed = false;
function renderQuestion() {
  const item = set.qs[idx];
  hintUsed = false;
  savePos();
  updateProgress(idx);
  stage.innerHTML = "";
  const card = el("section", "card");
  const tags = el("div", "tagrow");
  if (item.level) tags.append(el("span", "tag lv", item.level));
  tags.append(el("span", "tag", item.cat), el("span", "tag plain", chName(CH.get(item.ch))));
  if (item.audio) {
    if (tts) tts.cancel();
    const head = el("h2", "q listen");
    head.append(el("span", null, item.q));
    const row = el("div", "listen-row");
    const play = el("button", "play", "▶ 播放");
    play.type = "button";
    play.id = "playBtn";
    const slow = el("button", "play slow", "慢速");
    slow.type = "button";
    slow.id = "slowBtn";
    row.append(play, slow);
    if (tts) {
      play.addEventListener("click", () => speak(item.audio, 0.95, play));
      slow.addEventListener("click", () => speak(item.audio, 0.7, slow));
      if (item.title) {
        const stop = el("button", "play slow", "停止");
        stop.type = "button";
        stop.id = "stopBtn";
        stop.addEventListener("click", () => { tts.cancel(); row.querySelectorAll(".play").forEach(b => b.setAttribute("aria-pressed", "false")); });
        row.append(stop, el("span", "listen-note", "同一篇录音的几道题共用"));
      } else {
        row.append(el("span", "listen-note", "可以反复听"));
      }
    } else {
      play.disabled = slow.disabled = true;
      row.append(el("span", "listen-note", "这台设备不能朗读，下方显示原文"));
    }
    head.append(row);
    card.append(tags, head);
    if (tts && userActivated && item.audio !== lastAutoAudio) speak(item.audio, 0.95, play);
  } else {
    const qh = el("h2", "q");
    item.q.split(/\*\*/).forEach((part, k) => qh.append(k % 2 ? el("u", "neg", part) : document.createTextNode(part)));
    card.append(tags, qh);
  }
  const opts = el("div", "opts");
  // 每次随机打乱选项顺序，避免记住答案位置
  const order = item.opts.map((_, i) => i);
  for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
  const buttons = [];
  order.forEach((i, pos) => {
    const b = el("button", "opt");
    b.type = "button";
    b.id = `${item.id}-opt${i}`;
    b.append(el("span", "key", KEYS[pos]), el("span", null, item.opts[i]));
    b.addEventListener("click", () => choose(i, buttons, card, order));
    opts.append(b);
    buttons[i] = b;
  });
  card.append(opts);
  const exp = el("div", "explain pending", "选一个答案，这里会显示对错和解析。");
  if (item.audio && !tts) { exp.textContent = ""; exp.append(el("span", "transcript", item.audio)); }
  exp.id = "explain";
  const actions = el("div", "actions");
  const prev = el("button", "btn ghost", "上一题");
  prev.type = "button";
  prev.id = "prevBtn";
  prev.disabled = idx <= bStart;
  prev.addEventListener("click", goPrev);
  actions.append(prev);
  const next = el("button", "btn", idx === bEnd() - 1 ? "查看成绩" : "下一题");
  next.type = "button";
  next.id = "nextBtn";
  next.disabled = true;
  next.addEventListener("click", () => { idx++; idx < bEnd() ? renderQuestion() : renderResult(); });
  if (item.hint) {
    const hb = el("button", "btn ghost", "💡 提示");
    hb.type = "button";
    hb.id = "hintBtn";
    hb.addEventListener("click", () => {
      hintUsed = true;
      hb.disabled = true;
      exp.classList.remove("pending");
      exp.textContent = "";
      exp.append(el("b", "hint-h", "💡 提示："), document.createTextNode(" " + item.hint));
      typeset(exp);
    });
    actions.append(hb);
  }
  actions.append(next);
  card.append(exp, actions);
  stage.append(card);
  typeset(card);
  if (answers[idx] !== undefined) paintAnswer(answers[idx], buttons, card, order);
}

function choose(i, buttons, card, order) {
  const item = set.qs[idx];
  const right = i === item.a;
  answers[idx] = i;
  score = calcScore();
  record(item, i, right);
  paintAnswer(i, buttons, card, order);
}
// 标出对错、显示解析（回看做过的题时也用）
function paintAnswer(i, buttons, card, order) {
  const item = set.qs[idx];
  const right = i === item.a;
  buttons.forEach((b, j) => {
    b.disabled = true;
    if (j === item.a) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  const exp = card.querySelector("#explain");
  exp.classList.remove("pending");
  exp.textContent = "";
  exp.scrollTop = 0;
  exp.append(el("b", right ? "ok" : "no", right ? "回答正确！" : `答错了，正确答案是 ${KEYS[order.indexOf(item.a)]}。`));
  if (item.say && tts) {
    const hear = el("button", "play slow say", "▶ 听原句");
    hear.type = "button";
    hear.addEventListener("click", () => speak(item.say, 0.95, hear));
    exp.append(document.createTextNode(" "), hear);
  }
  if (item.audio) {
    exp.append(el("span", "transcript", item.quote || item.audio));
    if (item.tr) exp.append(document.createTextNode(item.tr + " "));
  }
  if (hintUsed) exp.append(el("span", "hint-used", "（用了提示）"));
  exp.append(document.createTextNode(" " + item.exp));
  if (item.tags && item.tags.length) exp.append(el("span", "tag-note", "🏷 标签：" + item.tags.join("、")));
  if (study && item.kp && KP[item.kp]) exp.append(el("span", "kp-note", "📌 知识点：" + KP[item.kp].t));
  typeset(exp);
  const hb = card.querySelector("#hintBtn");
  if (hb) hb.disabled = true;
  const next = card.querySelector("#nextBtn");
  next.disabled = false;
  updateProgress(idx + 1);
  next.focus({ preventScroll: true });
}

function renderResult() {
  updateProgress(bEnd());
  savePos();   // 做完一组后，下次从第 1 题开始
  stage.innerHTML = "";
  const card = el("section", "card");
  const s = el("p", "score", String(score));
  const nB = bEnd() - bStart;
  s.append(el("small", null, ` / ${nB}`));
  const pct = score / nB;
  const msg = pct === 1 ? "Parfait ! 全对，这部分掌握得很扎实。" : pct >= .75 ? "很不错，只差一点点。" : pct >= .5 ? "及格了，看看解析还能再进步。" : "再来一次吧，解析里都有答案。";
  card.append(el("span", "tag", nB < set.qs.length ? `${set.label} · 第 ${bStart + 1}–${bEnd()} 题` : set.label), s, el("p", "sub", msg));
  const list = el("ul", "review");
  set.qs.slice(bStart, bEnd()).forEach((item, j) => {
    const i = bStart + j;
    const done = answers[i] !== undefined;
    const ok = answers[i] === item.a;
    const li = el("li");
    li.append(el("span", "mark " + (ok ? "ok" : done ? "no" : ""), ok ? "✓" : done ? "✗" : "–"));
    const t = el("span", null, item.q + " ");
    t.append(el("span", "ans", `正确答案：${item.opts[item.a]}`));
    li.append(t);
    list.append(li);
  });
  card.append(list);
  const actions = el("div", "actions");
  const book = el("button", "btn ghost", "看错题本");
  book.type = "button";
  book.addEventListener("click", () => switchView("book"));
  const again = el("button", nB < set.qs.length ? "btn ghost" : "btn", nB < set.qs.length ? "再做这一组" : "再做一次");
  again.type = "button";
  again.id = "againBtn";
  again.addEventListener("click", () => startBatch(bStart));
  actions.append(book, again);
  if (nB < set.qs.length) {
    const end = bEnd(), last = end >= set.qs.length;
    const nextEnd = last ? Math.min(per, set.qs.length) : Math.min(end + per, set.qs.length);
    const more = el("button", "btn", last ? `从头再来（第 1–${nextEnd} 题）` : `下一组（第 ${end + 1}–${nextEnd} 题）`);
    more.type = "button";
    more.id = "moreBtn";
    more.addEventListener("click", () => startBatch(last ? 0 : end));
    actions.append(more);
  }
  card.append(actions);
  stage.append(card);
  typeset(card);
}

// ---------- 错题本 ----------
async function renderBook() {
  renderToc();
  stage.innerHTML = "";
  const card = el("section", "card");
  stage.append(card);
  if (!dbRef) { card.append(el("p", "empty", "当前视图无法读取错题本。登录 claude.ai 后打开这个页面就能看到。")); return; }
  if (!bookCache) {
    card.append(el("p", "empty", "正在读取答题记录…"));
    let docs;
    try { docs = (await dbRef.collection("answers").get()).docs.map(d => d.data()); }
    catch (e) { card.textContent = ""; card.append(el("p", "empty", "暂时读取不到错题本，稍后再点一次「错题本」。")); return; }
    // 同一道题答了多次，只看最近一次
    const latest = new Map();
    docs.sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(d => latest.set(d.qid, d));
    const all = [...latest.values()].filter(d => BY_ID.has(d.qid));
    bookCache = { all, wrong: all.filter(d => !d.isCorrect), raw: docs };
  }
  if (view !== "book") return;
  if (bookFilter !== "all" && !bookCache.wrong.some(d => inGroup(bookFilter, BY_ID.get(d.qid)))) bookFilter = "all";
  renderToc();
  drawBook();
}

function drawBook() {
  if (!bookCache) return;
  const { all, wrong } = bookCache;
  stage.innerHTML = "";
  stage.append(heatCard(bookCache.raw || []));
  stage.append(tagDistCard());
  const card = el("section", "card");
  stage.append(card);
  const tags = el("div", "tagrow");
  tags.append(el("span", "tag", bookFilter === "all" ? "错题本 · 全部" : "错题本 · " + labelOf(bookFilter).replace(/^错题 · /, "")));
  card.append(tags);

  const scope = bookFilter === "all" ? all : all.filter(d => inGroup(bookFilter, BY_ID.get(d.qid)));
  const scopeWrong = scope.filter(d => !d.isCorrect);
  const stats = el("div", "stats");
  [[scope.length, "已答题数"], [scopeWrong.length, "错题"], [scope.length ? Math.round((scope.length - scopeWrong.length) / scope.length * 100) + "%" : "–", "正确率"]]
    .forEach(([v, k]) => { const st = el("div", "stat"); st.append(el("b", null, String(v)), el("span", null, k)); stats.append(st); });
  card.append(stats);
  if (scopeWrong.length) {
    const drill = el("button", "btn", `练这些错题（${scopeWrong.length} 题）`); drill.type = "button"; drill.id = "drillBtn";
    const p = parseTagKey(bookFilter);
    drill.addEventListener("click", () => switchView("quiz", p ? tagKey("wrong", p.tags, p.mode) : bookFilter === "all" ? "wrong:any:" : bookFilter));
    const row = el("div", "actions"); row.append(drill); card.append(row);
  }

  if (!wrong.length) { card.append(el("p", "empty", all.length ? "目前没有错题，继续保持。" : "还没有答题记录。去「答题」做一轮，答错的题会出现在这里。")); return; }

  // 选了某一组就整组列出；看全部时，语法题按章节、听力题按集或按轮分组
  const groups = new Map();
  scopeWrong.forEach(d => {
    const k = bookFilter === "all" || parseTagKey(bookFilter) ? homeOf(BY_ID.get(d.qid)) : bookFilter;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  });
  const order = k => k.startsWith("ch:") ? Number(k.slice(3)) : k.startsWith("fr-r") ? 100 + parseInt(k.slice(4)) : 200 + Number(k.slice(3));
  [...groups.keys()].sort((a, b) => order(a) - order(b)).forEach(k => {
    const items = groups.get(k);
    const g = el("div", "group");
    const head = el("div", "group-head");
    const h = el("h3", null, labelOf(k));
    if (k.startsWith("ch:")) { const c = CH.get(Number(k.slice(3))); if (c) h.append(el("span", "zh", c.p ? `${c.t} · p.${c.p}` : c.t)); }
    h.append(el("span", "badge bad", `${items.length} 错`));
    head.append(h);
    const go = el("button", "btn ghost", "练这一组");
    go.type = "button";
    go.addEventListener("click", () => { switchView("quiz", k); });
    head.append(go);
    g.append(head);
    items.forEach(d => {
      const m = el("div", "miss");
      const mq = el("span", "mq");
      String(d.question).split(/\*\*/).forEach((part, k) => mq.append(k % 2 ? el("u", "neg", part) : document.createTextNode(part)));
      m.append(mq);
      const a = el("span", "ma");
      a.append(document.createTextNode(`${d.cat} · 你选 `), el("span", "no", d.chosen), document.createTextNode(" · 正确 "), el("span", "ok", d.correct),
        document.createTextNode(" · " + (ROUND_NAMES[d.round] || d.round)));
      m.append(a);
      g.append(m);
    });
    card.append(g);
  });
  typeset(card);
}

// ---------- 切换 ----------
function switchView(v, setKey) {
  view = v;
  tabQuiz.setAttribute("aria-selected", String(v === "quiz"));
  tabBook.setAttribute("aria-selected", String(v === "book"));
  progressEl.hidden = v === "book";
  if (v === "book") { renderBook(); return; }
  if (setKey) { startSet(setKey); return; }
  renderToc();
  if (rv) { renderReview(); return; }
  if (answers[idx] !== undefined) idx++;
  idx < bEnd() ? renderQuestion() : renderResult();
}
tabQuiz.addEventListener("click", () => { if (view !== "quiz") switchView("quiz"); });
tabBook.addEventListener("click", () => { bookCache = null; switchView("book"); });

startSet("p1-r1");
</script>
