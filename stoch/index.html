.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; }

  { id: "sc-r1-1", ch: 1, cat: "高斯向量 §1.2", q: "设 $(X,Y)$ 是高斯向量，且 $\\operatorname{cov}(X,Y)=0$。下列哪个结论成立？", opts: ["$X$ 与 $Y$ 独立", "$X$ 与 $Y$ 不一定独立", "只有均值都为 0 时才独立", "$X=Y$ 几乎必然成立"], a: 0, hint: "高斯向量的联合分布由哪些量完全决定？",

  { id: "sc-r1-2", ch: 2, cat: "布朗运动的定义 §2.1", q: "设 $B$ 是标准布朗运动，$s,t\\ge 0$。$E[B_sB_t]$ 等于多少？", opts: ["$s\\wedge t$", "$s\\vee t$", "$st$", "$|t-s|$"], a: 0, hint: "设 $s\\le t$，把 $B_t$ 写成 $B_s+(B_t-B_s)$，再用增量独立。",

  { id: "sc-r1-3", ch: 2, cat: "尺度不变性 §2.1", q: "设 $B$ 是布朗运动，$\\lambda>0$。下列哪个过程仍然是布朗运动？", opts: ["$\\lambda^{-1}B_{\\lambda^2 t}$", "$\\lambda B_{t/\\lambda}$", "$\\lambda B_{\\lambda t}$", "$\\lambda^{-1}B_{\\lambda t}$"], a: 0, hint: "逐个算方差：哪一个在时刻 $t$ 的方差恰好是 $t$？",

  { id: "sc-r1-4", ch: 2, cat: "样本路径 §2.2–2.3", q: "关于一维布朗运动的样本路径，下列哪一项正确（几乎必然）？", opts: ["对任意 $\\alpha<1/2$，路径局部 $\\alpha$-Hölder 连续", "路径是 Lipschitz 连续的", "路径在几乎所有时刻可微", "路径在任意有限区间上有界变差"], a: 0, hint: "想想 Kolmogorov 连续性准则给出的 Hölder 指数上限，以及二次变差为什么不为 0。",

  { id: "sc-r1-5", ch: 2, cat: "反射原理 §2.4", q: "设 $S_t=\\sup_{s\\le t}B_s$，$a\\ge 0$。由反射原理，$P(S_t\\ge a)$ 等于多少？", opts: ["$2P(B_t\\ge a)$", "$P(B_t\\ge a)$", "$\\tfrac12 P(B_t\\ge a)$", "$P(|B_t|\\ge 2a)$"], a: 0, hint: "路径到达 $a$ 之后，关于 $a$ 反射，终点在 $a$ 之上和之下的可能性一样大。",

  { id: "sc-r1-6", ch: 2, cat: "首达时 §2.4", q: "设 $a>0$，$T_a=\\inf\\{t\\ge0: B_t=a\\}$。下列哪一项正确？", opts: ["$T_a<\\infty$ 几乎必然成立，但 $E[T_a]=\\infty$", "$E[T_a]=a^2$", "$T_a$ 以正概率等于 $\\infty$", "$E[T_a]=a$"], a: 0, hint: "先用反射原理求 $P(T_a\\le t)$ 的极限，再看密度在 $t\\to\\infty$ 时衰减得多快。",

  { id: "sc-r1-8", ch: 3, cat: "可选停时定理 §3.4", q: "对 $T_a=\\inf\\{t: B_t=a\\}$（$a>0$），$E[B_{T_a}]=a\\ne 0=E[B_0]$。为什么这不违反可选停时定理？", opts: ["停止过程 $(B_{t\\wedge T_a})_{t\\ge0}$ 不一致可积", "布朗运动不是鞅", "$T_a$ 不是停时", "布朗运动的路径不连续"], a: 0, hint: "可选停时定理需要什么条件？$B_{t\\wedge T_a}$ 有上界，有没有下界？",

  { id: "sc-r1-9", ch: 3, cat: "可选停时的应用 §3.4", q: "布朗运动从 0 出发，$a,b>0$。它先到达 $b$、后到达 $-a$ 的概率是多少？", opts: ["$\\dfrac{a}{a+b}$", "$\\dfrac{b}{a+b}$", "$\\dfrac12$", "$\\dfrac{a}{b}$"], a: 0, hint: "$B_{t\\wedge T}$ 有界，所以 $E[B_T]=0$。设先到 $b$ 的概率为 $p$，列方程。",
    exp: "设 $T=T_{-a}\\wedge T_b$，$B_{t\\wedge T}$ 有界，可用可选停时定理：$0=E[B_T]=b\\,p-a(1-p)$，解得 $p=\\frac{a}{a+b}$。直观上，离 $-a$ 越远（$a$ 越大），越可能先碰到 $b$。（书中 §3.4）" },
  { id: "sc-r1-10", ch: 3, cat: "鞅 §3.3", q: "设 $B$ 是布朗运动。下列哪个过程是鞅？", opts: ["$B_t^2-t$", "$B_t^2$", "$e^{B_t}$", "$B_t^3$"], a: 0, hint: "$B_t^2$ 的期望随时间增长，要减去什么才能让期望保持不变？",
    exp: "$B_t^2-t$ 是鞅，$B_t^2$ 是下鞅。$e^{B_t}$ 需要补偿成 $e^{B_t-t/2}$ 才是鞅；$B_t^3$ 要减去 $3\\int_0^tB_s\\,ds$ 才是鞅。（书中 §3.3 · p.49 起）" },
  { id: "sc-r1-11", ch: 4, cat: "有限变差局部鞅 §4.2", q: "一个连续局部鞅 $M$ 同时又是有限变差过程，那么：", opts: ["$M_t=M_0$ 对所有 $t$ 几乎必然成立", "$M$ 一定是布朗运动", "$\\langle M,M\\rangle_t=t$", "$M$ 不一定是鞅，但一定有界"], a: 0, hint: "有限变差过程的二次变差是多少？一个二次变差为 0 的连续局部鞅会怎样？",

  { id: "sc-r1-12", ch: 4, cat: "二次变差 §4.3", q: "标准布朗运动的二次变差 $\\langle B,B\\rangle_t$ 等于多少？", opts: ["$t$", "$t^2$", "$0$", "$B_t^2$"], a: 0, hint: "$B_t^2$ 减去什么才是鞅？二次变差就是那个补偿项。",
    exp: "$\\langle B,B\\rangle_t=t$，因为 $B_t^2-t$ 是连续鞅。也可以理解为：划分加细时 $\\sum_i(B_{t_{i+1}}-B_{t_i})^2\\to t$（依概率）。（书中 §4.3 · p.79）" },
  { id: "sc-r1-13", ch: 5, cat: "Itô 公式 §5.2", q: "由 Itô 公式，$d(B_t^2)$ 等于多少？", opts: ["$2B_t\\,dB_t+dt$", "$2B_t\\,dB_t$", "$2B_t\\,dB_t+2\\,dt$", "$2B_t\\,dB_t+\\tfrac12\\,dt$"], a: 0, hint: "用 Itô 公式：$f(x)=x^2$，别忘了二阶导数乘以 $\\tfrac12\\,d\\langle B,B\\rangle_t$。",

  { id: "sc-r1-14", ch: 5, cat: "随机积分 §5.1–5.2", q: "$\\displaystyle\\int_0^t B_s\\,dB_s$ 等于多少？", opts: ["$\\tfrac12(B_t^2-t)$", "$\\tfrac12B_t^2$", "$B_t^2-t$", "$\\tfrac12(B_t^2+t)$"], a: 0, hint: "把上一题的 $d(B_t^2)$ 从 0 积到 $t$，再解出 $\\int_0^t B_s\\,dB_s$。",

  { id: "sc-r1-15", ch: 5, cat: "Itô 等距 §5.1", q: "$E\\Big[\\big(\\int_0^t B_s\\,dB_s\\big)^2\\Big]$ 等于多少？", opts: ["$\\dfrac{t^2}{2}$", "$t$", "$t^2$", "$0$"], a: 0, hint: "Itô 等距把随机积分平方的期望变成普通积分 $E\\int_0^t H_s^2\\,ds$。",

  { id: "sc-r1-17", ch: 5, cat: "Lévy 刻画 §5.3.1", q: "设 $M$ 是连续局部鞅，$M_0=0$。下列哪个条件能保证 $M$ 是布朗运动？", opts: ["$\\langle M,M\\rangle_t=t$ 对所有 $t$", "$E[M_t^2]=t$ 对所有 $t$", "对每个 $t$，$M_t\\sim N(0,t)$", "$M$ 的增量两两不相关"], a: 0, hint: "边缘分布不能决定整个过程。Lévy 刻画只用到哪一个量？",

    exp: "定理 7.17：平面布朗运动常返，即几乎必然无限次进入任意非空开集；$d\\ge3$ 时暂留，$|B_t|\\to\\infty$。（一维布朗运动也常返，而且会回到每一个点。）（书中 §7.4 · p.196）" },
  { id: "sc-r1-20", ch: 8, cat: "Ornstein–Uhlenbeck 过程 §8.4.1", q: "设 $\\lambda>0$，方程 $dX_t=dB_t-\\lambda X_t\\,dt$ 的解是：", opts: ["$X_t=X_0e^{-\\lambda t}+\\int_0^t e^{-\\lambda(t-s)}\\,dB_s$", "$X_t=X_0e^{-\\lambda t}+\\int_0^t e^{-\\lambda s}\\,dB_s$", "$X_t=X_0e^{\\lambda t}+\\int_0^t e^{\\lambda(t-s)}\\,dB_s$", "$X_t=X_0e^{-\\lambda t}+e^{-\\lambda t}B_t$"], a: 0, hint: "考虑 $e^{\\lambda t}X_t$ 并对它用 Itô 公式，$dt$ 项会互相抵消。",
    exp: "对 $e^{\\lambda t}X_t$ 用 Itô 公式：$d(e^{\\lambda t}X_t)=e^{\\lambda t}dB_t$，积分后乘以 $e^{-\\lambda t}$ 即得。随机积分的被积函数是确定性的，所以 $X$ 是高斯过程。（书中 §8.4.1 · p.225）" },
  { id: "sc-r2-1", ch: 1, cat: "Def 1.6 高斯过程", q: "Le Gall 对（中心化）高斯过程 $(X_t)_{t\\in T}$ 的定义是：", opts: ["任意有限个 $X_t$ 的线性组合都是中心化高斯变量", "每个 $X_t$ 都是中心化高斯变量", "任意两个 $X_s,X_t$ 都不相关", "$(X_t)$ 有独立增量"], a: 0,
    hint: "只要求每个 $X_t$ 是高斯的够不够？想想定理 1.9 后面那个 $X_2=\\varepsilon X$ 的反例。",
    exp: "定义 1.6 要求所有有限线性组合都是中心化高斯变量，这比“每个边缘都高斯”强得多。（书中 Def 1.6 · p.7）" },
  { id: "sc-r2-2", ch: 1, cat: "Def 1.4 高斯空间", q: "（中心化）高斯空间是 $L^2(\\Omega,\\mathcal F,P)$ 的：", opts: ["闭线性子空间，且只含中心化高斯变量", "线性子空间（不要求闭），只含高斯变量", "由一列独立高斯变量张成的子空间", "闭子空间，且其中元素两两独立"], a: 0,
    hint: "定义里有两个条件：一个是拓扑上的，一个是关于分布的。",
    exp: "定义 1.4：closed linear subspace of $L^2$ which contains only centered Gaussian variables。闭性保证 $L^2$ 极限仍在空间里（高斯变量的 $L^2$ 极限仍是高斯）。（书中 Def 1.4 · p.7）" },
  { id: "sc-r2-3", ch: 2, cat: "Def 2.12 布朗运动", q: "按 Le Gall 的定义 2.12，过程 $(B_t)_{t\\ge0}$ 是（从 0 出发的）布朗运动，需要满足：", opts: ["它是 pre-Brownian motion，且所有样本路径连续", "增量独立平稳，且几乎所有路径连续", "它是高斯过程，且路径 $\\tfrac12$-Hölder 连续", "它是鞅，且二次变差为 $t$"], a: 0,
    hint: "定义 2.12 建立在定义 2.1（pre-Brownian motion）之上，只多加了一条关于路径的要求。",
    exp: "定义 2.12：(i) $B$ 是 pre-Brownian motion；(ii) 所有样本路径连续。存在性来自 Kolmogorov 引理给出的连续修正（推论 2.11）。（书中 Def 2.12 · p.27）" },
  { id: "sc-r2-4", ch: 2, cat: "Prop 2.3 pre-BM 的等价刻画", q: "下面哪一条**不是** “$X$ 是 pre-Brownian motion” 的等价条件？", opts: ["中心化高斯，协方差 $s\\wedge t$，且路径连续", "中心化高斯过程，协方差 $K(s,t)=s\\wedge t$", "$X_0=0$，$X_t-X_s$ 独立于 $\\sigma(X_r,r\\le s)$ 且 $\\sim N(0,t-s)$", "$X_0=0$，各段增量独立且 $X_{t_i}-X_{t_{i-1}}\\sim N(0,t_i-t_{i-1})$"], a: 0,
    hint: "pre-Brownian motion 只关心有限维分布。哪个选项多要求了一条和有限维分布无关的性质？",
    exp: "命题 2.3 的 (ii)(iii)(iv) 都与 (i) 等价；路径连续性不是有限维分布能决定的，加上它就变成了布朗运动的定义。（书中 Prop 2.3 · p.20）" },
  { id: "sc-r2-5", ch: 2, cat: "Def 2.7 修正", q: "$\\tilde X$ 是 $X$ 的 modification（修正），是指：", opts: ["对每个 $t\\in T$，$P(\\tilde X_t=X_t)=1$", "$P(\\forall t\\in T,\\ \\tilde X_t=X_t)=1$", "$\\tilde X$ 与 $X$ 有相同的有限维分布", "存在零测集 $N$，在 $N$ 外两者路径相同"], a: 0,
    hint: "“对每个 $t$ 几乎必然”与“几乎必然对所有 $t$”，零测集能否依赖 $t$？",
    exp: "定义 2.7：$\\forall t,\\ P(\\tilde X_t=X_t)=1$，零测集可以随 $t$ 变。“对所有 $t$ 同时几乎必然相等”和“零测集外路径相同”说的是不可区分（定义 2.8）；“有限维分布相同”只是修正的推论。（书中 Def 2.7 · p.23）" },
  { id: "sc-r2-6", ch: 2, cat: "修正与不可区分", q: "设 $X,\\tilde X$ 的样本路径都右连续（指标集为区间）。下面哪一项正确？", opts: ["$\\tilde X$ 是 $X$ 的修正 $\\iff$ 两者不可区分", "修正推不出不可区分", "不可区分推不出修正", "两者只有相同的一维分布"], a: 0,
    hint: "先在可数稠密集 $I\\cap\\mathbb Q$ 上去掉可数个零测集，再用路径的右连续性。",
    exp: "书中在定义 2.8 后说明：路径连续（或只右连续、左连续）时，修正与不可区分等价。一般情形下不可区分强得多。（书中 Def 2.8 后 · p.23）" },
  { id: "sc-r2-7", ch: 3, cat: "Def 3.5 停时", q: "$T:\\Omega\\to[0,\\infty]$ 是滤子 $(\\mathcal F_t)$ 的停时，是指：", opts: ["对每个 $t\\ge0$，$\\{T\\le t\\}\\in\\mathcal F_t$", "对每个 $t>0$，$\\{T<t\\}\\in\\mathcal F_t$", "对每个 $t\\ge0$，$\\{T=t\\}\\in\\mathcal F_t$", "$T$ 是 $\\mathcal F_\\infty$-可测的"], a: 0,
    hint: "用严格不等号 $\\{T<t\\}$ 的条件也很合理，但它刻画的是另一个滤子的停时（命题 3.6）。",
    exp: "定义 3.5 用的是 $\\{T\\le t\\}\\in\\mathcal F_t$。只要求 $\\{T<t\\}\\in\\mathcal F_t$ 的是 $(\\mathcal F_{t+})$ 的停时。注意允许 $T=\\infty$。（书中 Def 3.5 · p.44）" },
  { id: "sc-r2-8", ch: 3, cat: "Prop 3.6 关于 $\\mathcal F_{t+}$ 的停时", q: "“对每个 $t>0$，$\\{T<t\\}\\in\\mathcal F_t$” 等价于 $T$ 是哪个滤子的停时？", opts: ["$(\\mathcal F_{t+})$", "$(\\mathcal F_t)$", "$(\\mathcal F_{t-})$", "常值滤子 $\\mathcal F_\\infty$"], a: 0,
    hint: "$\\{T\\le t\\}=\\bigcap_n\\{T<t+1/n\\}$，右边需要的是比 $\\mathcal F_t$ 稍大一点的信息。",
    exp: "命题 3.6(i)：$T$ 是 $(\\mathcal F_{t+})$ 的停时 $\\iff$ 对每个 $t>0$，$\\{T<t\\}\\in\\mathcal F_t$ $\\iff$ $T\\wedge t$ 是 $\\mathcal F_t$-可测的。（书中 Prop 3.6 · p.44）" },
  { id: "sc-r2-9", ch: 3, cat: "Def 3.5 $\\mathcal F_T$", q: "停时 $T$ 的“过去 σ-代数” $\\mathcal F_T$ 定义为：", opts: ["$\\{A\\in\\mathcal F_\\infty:\\ \\forall t\\ge0,\\ A\\cap\\{T\\le t\\}\\in\\mathcal F_t\\}$", "$\\{A\\in\\mathcal F_\\infty:\\ \\forall t,\\ A\\cap\\{T=t\\}\\in\\mathcal F_t\\}$", "$\\sigma(T)$", "$\\{A\\in\\mathcal F_\\infty:\\ \\forall t>0,\\ A\\cap\\{T<t\\}\\in\\mathcal F_t\\}$"], a: 0,
    hint: "用 $\\{T<t\\}$ 的那个版本是另一个 σ-代数（$\\mathcal F_{T+}$）；正确答案与停时定义中的那个不等号一致。",
    exp: "$\\mathcal F_T=\\{A\\in\\mathcal F_\\infty: A\\cap\\{T\\le t\\}\\in\\mathcal F_t,\\ \\forall t\\}$；把 $\\le$ 换成 $<$ 得到的是 $\\mathcal F_{T+}$（命题 3.6(ii)）。（书中 Def 3.5 · p.44）" },
  { id: "sc-r2-10", ch: 3, cat: "滤子的完备性", q: "Le Gall 说滤子 $(\\mathcal F_t)$ 是 complete（完备的），是指：", opts: ["所有 $(\\mathcal F_\\infty,P)$-可略集都属于 $\\mathcal F_0$", "$\\mathcal F_{t+}=\\mathcal F_t$ 对所有 $t$", "$\\mathcal F_\\infty=\\mathcal F$", "每个 $\\mathcal F_t$ 相对于自身是完备 σ-代数"], a: 0,
    hint: "“$\\mathcal F_{t+}=\\mathcal F_t$”是“右连续”的定义。完备性关心的是可略集放在哪里。",
    exp: "书中：令 $\\mathcal N$ 为所有 $(\\mathcal F_\\infty,P)$-可略集，若 $\\mathcal N\\subset\\mathcal F_0$（从而 $\\subset\\mathcal F_t$），则称滤子完备。注意是相对 $\\mathcal F_\\infty$ 而言的可略集。（书中 §3.1 · p.42）" },
  { id: "sc-r2-11", ch: 3, cat: "Def 3.3 循序可测", q: "过程 $X$ 是 progressive（循序可测）的，是指：", opts: ["对每个 $t$，$X$ 限制在 $\\Omega\\times[0,t]$ 上关于 $\\mathcal F_t\\otimes\\mathcal B([0,t])$ 可测", "对每个 $t$，$X_t$ 是 $\\mathcal F_t$-可测的", "$(\\omega,t)\\mapsto X_t(\\omega)$ 关于 $\\mathcal F\\otimes\\mathcal B(\\mathbb R_+)$ 可测", "$X$ 适应且路径右连续"], a: 0,
    hint: "只要求每个 $X_t$ 是 $\\mathcal F_t$-可测叫“适应”，只要求联合可测叫“可测”，“适应且路径右连续”只是一个充分条件（命题 3.4）。",
    exp: "定义 3.3：progressive 要求在每个 $\\Omega\\times[0,t]$ 上关于 $\\mathcal F_t\\otimes\\mathcal B([0,t])$ 联合可测。它同时蕴含适应和可测。（书中 Def 3.3 · p.42）" },
  { id: "sc-r2-12", ch: 3, cat: "Prop 3.4 循序可测的充分条件", q: "下面哪个条件能保证一个适应过程是 progressive 的？", opts: ["样本路径右连续（或左连续）", "每个 $X_t$ 都可积", "$X_0=0$", "$X$ 是可测过程"], a: 0,
    hint: "关键在于能用离散时间的近似逼近过程本身。",
    exp: "命题 3.4：适应且路径右连续（或左连续）的过程是 progressive 的。单是“可测 + 适应”一般不够。（书中 Prop 3.4 · p.43）" },
  { id: "sc-r2-13", ch: 3, cat: "Def 3.10 鞅", q: "下面哪一条**不是** Le Gall 定义 3.10 中对鞅的要求？", opts: ["样本路径连续", "$X$ 是适应的", "对每个 $t$，$X_t\\in L^1$", "对 $s<t$，$E[X_t\\mid\\mathcal F_s]=X_s$"], a: 0,
    hint: "定义里只有可测性、可积性、条件期望三条。路径正则性要靠后面的定理 3.18 另外得到。",
    exp: "定义 3.10：适应、$X_t\\in L^1$、$E[X_t\\mid\\mathcal F_s]=X_s$。路径性质不在定义里（定理 3.18 在完备右连续滤子下给出càdlàg修正）。（书中 Def 3.10 · p.49）" },
  { id: "sc-r2-14", ch: 3, cat: "Def 3.10 上鞅", q: "上鞅（supermartingale）满足：对 $0\\le s<t$，", opts: ["$E[X_t\\mid\\mathcal F_s]\\le X_s$", "$E[X_t\\mid\\mathcal F_s]\\ge X_s$", "$E[X_t]\\ge E[X_s]$", "$E[X_t\\mid\\mathcal F_s]<X_s$"], a: 0,
    hint: "记法：上鞅是“平均来看越来越小”（像对你不利的赌局）。",
    exp: "上鞅：$E[X_t\\mid\\mathcal F_s]\\le X_s$，从而 $E[X_t]\\le E[X_s]$；下鞅不等号反向。（书中 Def 3.10 · p.49）" },
  { id: "sc-r2-15", ch: 3, cat: "Def 3.11 $(\\mathcal F_t)$-布朗运动", q: "$B$ 是 $(\\mathcal F_t)$-布朗运动，是指：", opts: ["$B$ 是布朗运动，适应于 $(\\mathcal F_t)$，且关于 $(\\mathcal F_t)$ 有独立增量", "$B$ 是布朗运动，且 $(\\mathcal F_t)$ 包含 $B$ 的自然滤子", "$B$ 是布朗运动，且是 $(\\mathcal F_t)$-鞅", "$B$ 是适应于 $(\\mathcal F_t)$ 的布朗运动"], a: 0,
    hint: "只是“适应”还不够：滤子里可能含有未来增量的信息。",
    exp: "定义 3.11：$B$ 是布朗运动、适应，且对 $s<t$，$B_t-B_s$ 独立于 $\\mathcal F_s$。只说“适应于 $(\\mathcal F_t)$ 的布朗运动”缺了独立增量这一条。（书中 Def 3.11 · p.50）" },
  { id: "sc-r2-16", ch: 3, cat: "Def 3.20 闭鞅", q: "鞅 $(X_t)$ 称为 closed（闭的），是指：", opts: ["存在 $Z\\in L^1$，使得对所有 $t$，$X_t=E[Z\\mid\\mathcal F_t]$", "$X_t$ 几乎必然收敛", "$(X_t)$ 在 $L^1$ 中有界", "存在常数 $C$，使 $|X_t|\\le C$"], a: 0,
    hint: "“闭”指能在 $t=\\infty$ 处用一个可积随机变量把鞅“封住”。",
    exp: "定义 3.20：存在 $Z\\in L^1$ 使 $X_t=E[Z\\mid\\mathcal F_t]$。定理 3.21 说它等价于一致可积，也等价于 a.s. 且 $L^1$ 收敛。（书中 Def 3.20 · p.59）" },
  { id: "sc-r2-17", ch: 4, cat: "Def 4.1 有限变差函数", q: "Le Gall 定义连续函数 $a:[0,T]\\to\\mathbb R$ 有有限变差时，要求：", opts: ["$a(0)=0$，且存在有符号测度 $\\mu$ 使 $a(t)=\\mu([0,t])$", "$a$ 可微且导数可积", "$a$ 单调", "$a$ 是 $\\tfrac12$-Hölder 的"], a: 0,
    hint: "书里的定义是用测度写的，并且规定了起点的值。",
    exp: "定义 4.1：连续、$a(0)=0$，且存在 $[0,T]$ 上的有符号测度 $\\mu$ 使 $a(t)=\\mu([0,t])$；由连续性 $\\mu$ 无原子。（书中 Def 4.1 · p.70）" },
  { id: "sc-r2-18", ch: 4, cat: "Def 4.4 有限变差过程", q: "按定义 4.4，适应过程 $A$ 是有限变差过程，需要：", opts: ["所有样本路径都是 $\\mathbb R_+$ 上的有限变差函数", "几乎所有样本路径单调", "$A$ 是鞅", "$E[\\int_0^\\infty|dA_s|]<\\infty$"], a: 0,
    hint: "注意定义 4.1 里的有限变差函数自带连续性和 $a(0)=0$。",
    exp: "定义 4.4：适应，且所有样本路径都是有限变差函数（因此 $A_0=0$ 且路径连续）；路径还递增时称为 increasing process。（书中 Def 4.4 · p.73）" },
  { id: "sc-r2-19", ch: 4, cat: "Def 4.6 局部鞅（一）", q: "定义 4.6 中，约化序列使停止过程 $M^{T_n}$ 成为：", opts: ["一致可积鞅", "鞅（不要求一致可积）", "有界鞅", "平方可积鞅"], a: 0,
    hint: "Le Gall 的版本对停止过程要求比“鞅”更强。",
    exp: "定义 4.6：存在 $T_n\\uparrow\\infty$ 使每个 $M^{T_n}$ 都是 uniformly integrable martingale。（书中 Def 4.6 · p.76）" },
  { id: "sc-r2-20", ch: 4, cat: "Def 4.6 局部鞅（二）", q: "定义 4.6 中对停时列 $(T_n)$ 的要求是：", opts: ["不减，且对每个 $\\omega$，$T_n(\\omega)\\uparrow\\infty$", "每个 $T_n$ 都有界", "$T_n\\to\\infty$ 依概率", "$T_n$ 都是常数"], a: 0,
    hint: "书中特别写了 “$T_n(\\omega)\\uparrow\\infty$ for every $\\omega$”。",
    exp: "要求 nondecreasing 且对每个 $\\omega$ 都趋于无穷（不只是几乎必然）。（书中 Def 4.6 · p.76）" },
  { id: "sc-r2-21", ch: 4, cat: "Def 4.6 局部鞅（三）", q: "定义 4.6 首先针对 $M_0=0$ 的情形。若不假设 $M_0=0$，Le Gall 称 $M$ 为连续局部鞅是指：", opts: ["$N_t=M_t-M_0$ 是连续局部鞅", "$M_0\\in L^1$ 且 $M^{T_n}$ 是鞅", "$M_0$ 有界", "$M$ 本身是鞅"], a: 0,
    hint: "减去初值，就回到了定义的第一种情形。",
    exp: "书中：when we do not assume $M_0=0$，we say $M$ is a continuous local martingale if $N_t=M_t-M_0$ is。这样 $M_0$ 不需要可积。（书中 Def 4.6 · p.76）" },
  { id: "sc-r2-22", ch: 4, cat: "Thm 4.9 二次变差", q: "连续局部鞅 $M$ 的二次变差 $\\langle M,M\\rangle$ 是唯一的递增过程，使得：", opts: ["$M_t^2-\\langle M,M\\rangle_t$ 是连续局部鞅", "$M_t^2+\\langle M,M\\rangle_t$ 是鞅", "$\\langle M,M\\rangle_t=E[M_t^2]$", "$M_t-\\langle M,M\\rangle_t$ 是鞅"], a: 0,
    hint: "对布朗运动，答案应当给出 $B_t^2-t$。",
    exp: "定理 4.9：存在唯一（不可区分意义下）的递增过程使 $M^2-\\langle M,M\\rangle$ 是连续局部鞅，且它是平方和的依概率极限。（书中 Thm 4.9 · p.79）" },
  { id: "sc-r2-23", ch: 4, cat: "Def 4.14 括号", q: "两个连续局部鞅的括号 $\\langle M,N\\rangle$ 定义为：", opts: ["$\\tfrac12\\big(\\langle M+N,M+N\\rangle-\\langle M,M\\rangle-\\langle N,N\\rangle\\big)$", "$\\langle M+N,M+N\\rangle-\\langle M-N,M-N\\rangle$", "$\\sqrt{\\langle M,M\\rangle\\langle N,N\\rangle}$", "$E[M_tN_t]$"], a: 0,
    hint: "和内积的极化恒等式一样。",
    exp: "定义 4.14 用极化恒等式；命题 4.15(i)：它是唯一使 $MN-\\langle M,N\\rangle$ 为连续局部鞅的有限变差过程。（$\\langle M+N,M+N\\rangle-\\langle M-N,M-N\\rangle$ 少了系数 $\\tfrac14$。）（书中 Def 4.14 · p.87）" },
  { id: "sc-r2-24", ch: 4, cat: "Def 4.17 正交", q: "两个连续局部鞅 $M,N$ 正交，是指：", opts: ["$\\langle M,N\\rangle=0$，等价地 $MN$ 是连续局部鞅", "$E[M_tN_t]=0$ 对所有 $t$", "$M$ 与 $N$ 独立", "$\\langle M,M\\rangle=\\langle N,N\\rangle$"], a: 0,
    hint: "正交是路径意义下的括号为零，比 $E[M_tN_t]=0$ 强，比独立弱。",
    exp: "定义 4.17：$\\langle M,N\\rangle=0$，等价于 $MN$ 是连续局部鞅。两个独立的 $(\\mathcal F_t)$-布朗运动正交（命题 4.16）。（书中 Def 4.17 · p.88）" },
  { id: "sc-r2-25", ch: 4, cat: "Def 4.19–4.20 半鞅的括号", q: "设 $X=M+A$、$Y=M'+A'$ 是连续半鞅的标准分解。$\\langle X,Y\\rangle$ 定义为：", opts: ["$\\langle M,M'\\rangle$", "$\\langle M,M'\\rangle+\\langle A,A'\\rangle$", "$\\langle M,M'\\rangle+\\langle M,A'\\rangle+\\langle A,M'\\rangle$", "$\\langle X,Y\\rangle$ 无定义"], a: 0,
    hint: "有限变差部分对二次变差没有贡献（命题 4.21 的离散近似里它们趋于 0）。",
    exp: "定义 4.20：$\\langle X,Y\\rangle=\\langle M,M'\\rangle$，特别地 $\\langle X,X\\rangle=\\langle M,M\\rangle$。分解唯一性来自定理 4.8。（书中 Def 4.20 · p.90）" },
  { id: "sc-r2-26", ch: 5, cat: "空间 $\\mathbb H^2$", q: "Le Gall 记 $\\mathbb H^2$ 为：", opts: ["$L^2$ 有界、$M_0=0$ 的连续鞅全体", "所有平方可积的连续局部鞅", "$E[\\langle M,M\\rangle_t]<\\infty$ 对每个 $t$ 的鞅", "有界连续鞅全体"], a: 0,
    hint: "它要求的是在整个 $[0,\\infty)$ 上 $L^2$ 有界，还要求初值为 0。",
    exp: "§5.1.1：$\\mathbb H^2$ 是 $L^2$ 有界且 $M_0=0$ 的连续鞅；等价地 $M_0=0$ 且 $E[\\langle M,M\\rangle_\\infty]<\\infty$。内积 $(M,N)_{\\mathbb H^2}=E[\\langle M,N\\rangle_\\infty]$。（书中 §5.1.1 · p.98）" },
  { id: "sc-r2-27", ch: 5, cat: "Def 5.2 初等过程", q: "初等过程 $H_s=\\sum_i H_{(i)}\\mathbf 1_{(t_i,t_{i+1}]}(s)$ 中，$H_{(i)}$ 需要是：", opts: ["有界且 $\\mathcal F_{t_i}$-可测", "有界且 $\\mathcal F_{t_{i+1}}$-可测", "确定性常数", "可积且 $\\mathcal F_\\infty$-可测"], a: 0,
    hint: "在区间 $(t_i,t_{i+1}]$ 上下注时，只能用 $t_i$ 时刻已知的信息。",
    exp: "定义 5.2：$H_{(i)}$ 是有界的 $\\mathcal F_{t_i}$-可测随机变量，区间是左开右闭的 $(t_i,t_{i+1}]$。这正是“左端点取值”。（书中 Def 5.2 · p.100）" },
  { id: "sc-r2-28", ch: 5, cat: "$L^2_{loc}(M)$", q: "$H\\in L^2_{loc}(M)$ 的条件是：$H$ 是 progressive 的，且", opts: ["对每个 $t$，几乎必然 $\\int_0^tH_s^2\\,d\\langle M,M\\rangle_s<\\infty$", "$E\\big[\\int_0^\\infty H_s^2\\,d\\langle M,M\\rangle_s\\big]<\\infty$", "$H$ 局部有界", "$\\int_0^\\infty H_s^2\\,ds<\\infty$"], a: 0,
    hint: "要求期望有限的是 $L^2(M)$ 的条件；“loc” 版本只要求路径意义下有限。",
    exp: "§5.1.2：$L^2_{loc}(M)$ 要求 $\\int_0^tH_s^2\\,d\\langle M,M\\rangle_s<\\infty$（$\\forall t$，a.s.）；$L^2(M)$ 要求 $E[\\int_0^\\infty H_s^2d\\langle M,M\\rangle_s]<\\infty$。（书中 §5.1.2 · p.106）" },
  { id: "sc-r2-29", ch: 5, cat: "Def 5.7 对半鞅的积分", q: "定义 5.7 中，对连续半鞅 $X$ 积分时，被积过程 $H$ 要求：", opts: ["局部有界且 progressive", "有界且路径连续", "属于 $L^2(M)$", "确定性函数"], a: 0,
    hint: "它要同时能对局部鞅部分和有限变差部分积分。",
    exp: "定义 5.7：$H$ locally bounded progressive，$H\\cdot X=H\\cdot M+H\\cdot V$；局部有界保证 $H\\in L^2_{loc}(M)$ 且对 $|dV|$ 可积。（书中 Def 5.7 · p.109）" },
  { id: "sc-r2-30", ch: 6, cat: "Def 6.1 转移半群", q: "下面哪一条**不是**定义 6.1 中转移半群的条件？", opts: ["$Q_t$ 把 $C_0(E)$ 映到 $C_0(E)$", "$Q_0(x,dy)=\\delta_x(dy)$", "Chapman–Kolmogorov：$Q_{t+s}=Q_tQ_s$", "$(t,x)\\mapsto Q_t(x,A)$ 关于 $\\mathcal B(\\mathbb R_+)\\otimes\\mathcal E$ 可测"], a: 0,
    hint: "其中一条属于更强的概念（定义 6.7）。",
    exp: "定义 6.1 的三条是 $Q_0(x,\\cdot)=\\delta_x$、Chapman–Kolmogorov 和联合可测性；“把 $C_0(E)$ 映到 $C_0(E)$”是 Feller 半群的条件（定义 6.7(i)）。（书中 Def 6.1 · p.152）" },
  { id: "sc-r2-31", ch: 6, cat: "Def 6.2 马尔可夫过程", q: "适应过程 $X$ 是以 $(Q_t)$ 为转移半群的 $(\\mathcal F_t)$-马尔可夫过程，是指对 $s,t\\ge0$、$f\\in B(E)$：", opts: ["$E[f(X_{s+t})\\mid\\mathcal F_s]=Q_tf(X_s)$", "$E[f(X_{s+t})\\mid X_s]=Q_{s+t}f(X_0)$", "$E[f(X_t)]=Q_tf(X_0)$", "$E[f(X_{s+t})\\mid\\mathcal F_s]=Q_sf(X_t)$"], a: 0,
    hint: "条件化的是整个过去 $\\mathcal F_s$，而答案只依赖现在 $X_s$ 和时间差 $t$。",
    exp: "定义 6.2：$E[f(X_{s+t})\\mid\\mathcal F_s]=Q_tf(X_s)$。（书中 Def 6.2 · p.152）" },
  { id: "sc-r2-32", ch: 6, cat: "Def 6.7 Feller 半群", q: "转移半群 $(Q_t)$ 是 Feller 的，条件是：", opts: ["$\\forall f\\in C_0(E)$：$Q_tf\\in C_0(E)$ 且 $\\|Q_tf-f\\|\\to0$", "$Q_tf$ 对所有有界可测 $f$ 连续", "$Q_t$ 是压缩算子", "$Q_tf\\to f$ 逐点（$t\\to0$）"], a: 0,
    hint: "两条：保持 $C_0(E)$，以及在 $C_0(E)$ 的一致范数下强连续。",
    exp: "定义 6.7：(i) $Q_tf\\in C_0(E)$；(ii) $\\|Q_tf-f\\|\\to0$（$t\\to0$）。书中证明逐点收敛已足以推出 (ii)，但定义写的是范数收敛。（书中 Def 6.7 · p.158）" },
  { id: "sc-r2-33", ch: 8, cat: "Def 8.2 轨道唯一性", q: "方程 $E(\\sigma,b)$ 的 pathwise uniqueness（轨道唯一性）是指：", opts: ["固定概率空间和布朗运动，初值几乎必然相同的两个解不可区分", "所有解有相同的分布", "对每个 $x$ 都存在解", "解适应于 $B$ 的完备自然滤子"], a: 0,
    hint: "注意区分四个概念：轨道唯一性、弱唯一性（分布唯一）、弱存在性和强解。",
    exp: "定义 8.2：pathwise uniqueness 要求在同一空间、同一 $B$ 下，$X_0=X'_0$ a.s. 的两个解不可区分。（书中 Def 8.2 · p.211）" },
  { id: "sc-r2-34", ch: 8, cat: "Def 8.2 强解", q: "$E_x(\\sigma,b)$ 的解 $X$ 称为 strong solution（强解），是指：", opts: ["$X$ 适应于 $B$ 的完备自然滤子", "$X$ 的路径连续", "解在轨道意义下唯一", "系数 $\\sigma,b$ 是 Lipschitz 的"], a: 0,
    hint: "强解由驱动的布朗运动“决定”。",
    exp: "定义 8.2：若 $X$ 关于 $B$ 的 completed canonical filtration 适应，称为强解。（书中 Def 8.2 · p.211）" },
  { id: "sc-r2-35", ch: 9, cat: "Prop 9.2 Tanaka 公式", q: "Tanaka 公式中 $(X_t-a)^+$ 的分解是：", opts: ["$(X_0-a)^++\\int_0^t\\mathbf 1_{\\{X_s>a\\}}dX_s+\\tfrac12L^a_t$", "$(X_0-a)^++\\int_0^t\\mathbf 1_{\\{X_s>a\\}}dX_s+L^a_t$", "$(X_0-a)^++\\int_0^t\\mathbf 1_{\\{X_s\\ge a\\}}dX_s+L^a_t$", "$(X_0-a)^++\\int_0^t\\mathbf 1_{\\{X_s>a\\}}dX_s-\\tfrac12L^a_t$"], a: 0,
    hint: "把 $|x-a|=(x-a)^++(x-a)^-$ 的三个公式对应起来：$|X_t-a|$ 的公式里局部时系数是 1。",
    exp: "命题 9.2：$|X_t-a|$ 的公式带 $L^a_t$，$(X_t-a)^\\pm$ 的公式各带 $\\tfrac12L^a_t$；$(X_t-a)^+$ 用 $\\mathbf 1_{\\{X_s>a\\}}$，$(X_t-a)^-$ 用 $-\\mathbf 1_{\\{X_s\\le a\\}}$。（书中 Prop 9.2 · p.237）" },
  { id: "sc-r3-1", ch: 1, cat: "Thm 1.9 正交与独立", q: "定理 1.9 说子空间 $H_i$ 两两正交 $\\iff$ σ-代数 $\\sigma(H_i)$ 独立。它的关键前提是：", opts: ["所有 $H_i$ 都是同一个中心化高斯空间的子空间", "每个 $H_i$ 都是有限维的", "每个 $H_i$ 都只含标准正态变量", "$H_i$ 两两不相交"], a: 0,
    hint: "书中紧接着给了 $X_2=\\varepsilon X$ 的反例：两个高斯变量不相关却不独立，问题出在哪里？",
    exp: "必须是同一高斯空间的子空间。反例中 $(X,\\varepsilon X)$ 不是高斯向量，所以不相关推不出独立。（书中 Thm 1.9 · p.8）" },
  { id: "sc-r3-2", ch: 2, cat: "Thm 2.9 Kolmogorov 引理", q: "若 $E[d(X_s,X_t)^q]\\le C|t-s|^{1+\\varepsilon}$，Kolmogorov 引理给出的修正对哪些 $\\alpha$ 是 $\\alpha$-Hölder 的？", opts: ["$\\alpha\\in(0,\\varepsilon/q)$", "$\\alpha\\in(0,(1+\\varepsilon)/q)$", "$\\alpha\\in(0,1/q)$", "$\\alpha\\in(0,\\varepsilon)$"], a: 0,
    hint: "把 $|t-s|^{1+\\varepsilon}$ 里的“1”看作维数；多出来的 $\\varepsilon$ 再除以矩的阶数。",
    exp: "定理 2.9：存在修正，对每个 $\\alpha\\in(0,\\varepsilon/q)$ 都 $\\alpha$-Hölder 连续。条件：$I$ 是有界区间，$E$ 是完备度量空间。（书中 Thm 2.9 · p.24）" },
  { id: "sc-r3-3", ch: 2, cat: "Kolmogorov 引理用于布朗运动", q: "对布朗运动，$E|B_t-B_s|^q=c_q|t-s|^{q/2}$。由 Kolmogorov 引理，可得路径 $\\alpha$-Hölder，其中：", opts: ["$\\alpha<\\tfrac12-\\tfrac1q$，再令 $q\\to\\infty$ 得任意 $\\alpha<\\tfrac12$", "$\\alpha<\\tfrac12$，对固定的 $q$ 已经成立", "$\\alpha<1-\\tfrac1q$", "$\\alpha=\\tfrac12$"], a: 0,
    hint: "这里 $1+\\varepsilon=q/2$。",
    exp: "$\\varepsilon=q/2-1$，于是 $\\alpha<\\varepsilon/q=\\tfrac12-\\tfrac1q$；对所有 $q$ 取并，得到任意 $\\alpha<\\tfrac12$（推论 2.11）。（书中 Thm 2.9 · p.24）" },
  { id: "sc-r3-4", ch: 2, cat: "Thm 2.13 Blumenthal 0-1 律", q: "Blumenthal 0-1 律断言：", opts: ["$\\mathcal F_{0+}$ 中每个事件的概率为 0 或 1", "$\\mathcal F_\\infty$ 中每个事件的概率为 0 或 1", "尾 σ-代数是平凡的", "$\\mathcal F_0$ 是平凡的"], a: 0,
    hint: "它说的是“紧接在 0 之后”的信息。",
    exp: "定理 2.13：$\\mathcal F_{0+}=\\bigcap_{t>0}\\mathcal F_t$ 是平凡的。推论之一（命题 2.14）：a.s. 对每个 $\\varepsilon>0$，$\\sup_{s\\le\\varepsilon}B_s>0$。（书中 Thm 2.13 · p.30）" },
  { id: "sc-r3-5", ch: 2, cat: "Prop 2.16 布朗运动的二次变差", q: "命题 2.16：划分网格趋于 0 时，$\\sum_i(B_{t_i^n}-B_{t_{i-1}^n})^2\\to t$。这里的收敛是：", opts: ["在 $L^2$ 中", "几乎必然（对任意划分列）", "仅依分布", "一致收敛"], a: 0,
    hint: "证明是直接算平方和与 $t$ 之差的二阶矩。",
    exp: "命题 2.16 的收敛是 $L^2$ 收敛（不对任意划分列保证 a.s. 收敛）。推论 2.17：路径在任何区间上无限变差。（书中 Prop 2.16 · p.32）" },
  { id: "sc-r3-6", ch: 2, cat: "Thm 2.20 强马氏性", q: "布朗运动的强马氏性（定理 2.20）：设 $T$ 是停时且 $P(T<\\infty)>0$，则在 $P(\\cdot\\mid T<\\infty)$ 下，", opts: ["$B^{(T)}_t=\\mathbf 1_{\\{T<\\infty\\}}(B_{T+t}-B_T)$ 是布朗运动，且独立于 $\\mathcal F_T$", "$B_{T+t}$ 是布朗运动，独立于 $\\mathcal F_T$", "$B^{(T)}$ 是布朗运动，但可能依赖于 $\\mathcal F_T$", "$B^{(T)}$ 只在 $T$ 有界时是布朗运动"], a: 0,
    hint: "要“重新从 0 出发”，必须减去 $B_T$；独立的对象是停时之前的全部信息。",
    exp: "定理 2.20：在 $P(\\cdot\\mid T<\\infty)$ 下，$(B_{T+t}-B_T)_{t\\ge0}$ 是独立于 $\\mathcal F_T$ 的布朗运动。（书中 Thm 2.20 · p.34）" },
  { id: "sc-r3-7", ch: 2, cat: "Thm 2.21 反射原理", q: "设 $S_t=\\sup_{s\\le t}B_s$，$a\\ge0$，$b\\le a$。反射原理给出 $P(S_t\\ge a,\\ B_t\\le b)=$", opts: ["$P(B_t\\ge2a-b)$", "$P(B_t\\ge a-b)$", "$2P(B_t\\ge a)$", "$P(B_t\\le2a-b)$"], a: 0,
    hint: "在首次到达 $a$ 后把路径关于 $a$ 反射：$b$ 的像是 $2a-b$。",
    exp: "定理 2.21：$P(S_t\\ge a,B_t\\le b)=P(B_t\\ge2a-b)$，特别地 $S_t\\overset{d}{=}|B_t|$。（书中 Thm 2.21 · p.35）" },
  { id: "sc-r3-8", ch: 2, cat: "Cor 2.22 首达时的分布", q: "对 $a>0$，$T_a$ 与哪个随机变量同分布？", opts: ["$a^2/B_1^2$", "$a/|B_1|$", "$a^2B_1^2$", "$a/B_1^2$"], a: 0,
    hint: "由 $P(T_a\\le t)=P(|B_t|\\ge a)=P(|B_1|\\ge a/\\sqrt t)$ 解出 $t$。",
    exp: "推论 2.22：$T_a\\overset{d}{=}a^2/B_1^2$，密度 $\\frac{a}{\\sqrt{2\\pi t^3}}e^{-a^2/2t}$。（书中 Cor 2.22 · p.37）" },
  { id: "sc-r3-9", ch: 3, cat: "Prop 3.15 极大不等式", q: "右连续上鞅的极大不等式：对 $\\lambda>0$，$\\lambda P(\\sup_{s\\le t}|X_s|>\\lambda)\\le$", opts: ["$E|X_0|+2E|X_t|$", "$E|X_t|$", "$2E|X_t|$", "$E|X_0|+E|X_t|$"], a: 0,
    hint: "对上鞅（不一定是鞅）需要同时用到起点和终点。",
    exp: "命题 3.15(i)：$\\lambda P(\\sup_{0\\le s\\le t}|X_s|>\\lambda)\\le E|X_0|+2E|X_t|$。（书中 Prop 3.15 · p.53）" },
  { id: "sc-r3-10", ch: 3, cat: "Prop 3.15 Doob $L^p$ 不等式", q: "右连续鞅、$p>1$：$E[\\sup_{s\\le t}|X_s|^p]\\le C_p\\,E|X_t|^p$，其中 $C_p=$", opts: ["$\\big(\\tfrac{p}{p-1}\\big)^p$", "$\\tfrac{p}{p-1}$", "$p^p$", "$2^p$"], a: 0,
    hint: "$p=2$ 时常数是 4。",
    exp: "命题 3.15(ii)：$C_p=(p/(p-1))^p$，$p=2$ 时为 4。$p=1$ 时不等式不成立（常数发散）。（书中 Prop 3.15 · p.53）" },
  { id: "sc-r3-11", ch: 3, cat: "Thm 3.19 上鞅收敛", q: "右连续上鞅若在 $L^1$ 中有界，则 $X_t$（$t\\to\\infty$）：", opts: ["几乎必然收敛到某个 $X_\\infty\\in L^1$", "在 $L^1$ 中收敛", "几乎必然且在 $L^1$ 中收敛", "不一定收敛"], a: 0,
    hint: "$L^1$ 收敛需要更强的条件（定理 3.21）。",
    exp: "定理 3.19 只给出 a.s. 收敛到 $X_\\infty\\in L^1$。$L^1$ 收敛等价于一致可积（定理 3.21）。（书中 Thm 3.19 · p.58）" },
  { id: "sc-r3-12", ch: 3, cat: "Thm 3.21 闭鞅的刻画", q: "对右连续鞅，下列哪一条**不**与“$X$ 是闭鞅”等价？", opts: ["$(X_t)$ 在 $L^1$ 中有界", "$(X_t)_{t\\ge0}$ 一致可积", "$X_t$ 几乎必然且在 $L^1$ 中收敛", "存在 $Z\\in L^1$ 使 $X_t=E[Z\\mid\\mathcal F_t]$"], a: 0,
    hint: "$L^1$ 有界只能给出 a.s. 收敛（定理 3.19）。",
    exp: "定理 3.21：闭 $\\iff$ 一致可积 $\\iff$ a.s. 且 $L^1$ 收敛。$L^1$ 有界更弱，例如指数鞅 $e^{B_t-t/2}$。（书中 Thm 3.21 · p.59）" },
  { id: "sc-r3-13", ch: 3, cat: "Thm 3.22 可选停止定理", q: "定理 3.22（可选停止）：$S\\le T$ 为停时（可以取 $\\infty$），要得到 $X_S=E[X_T\\mid\\mathcal F_S]$，需要：", opts: ["$X$ 是一致可积的右连续鞅", "$X$ 是右连续鞅，$S,T$ 有界", "$X$ 是连续局部鞅", "$X$ 是 $L^1$ 有界的鞅"], a: 0,
    hint: "停时可以无界时，需要能在 $\\infty$ 处“封住”鞅。",
    exp: "定理 3.22 要求一致可积。若 $S\\le T$ 都有界，则任意右连续鞅即可（推论 3.23）。（书中 Thm 3.22 · p.59）" },
  { id: "sc-r3-14", ch: 3, cat: "Cor 3.24 停止鞅", q: "右连续鞅 $X$、停时 $T$：停止过程 $(X_{t\\wedge T})$：", opts: ["总是鞅；若 $X$ 一致可积，则它也一致可积", "只有 $T$ 有界时才是鞅", "总是一致可积鞅", "一般只是上鞅"], a: 0,
    hint: "对每个固定的 $t$，$t\\wedge T$ 是有界停时。",
    exp: "推论 3.24：(i) $X^T$ 是鞅；(ii) 若 $X$ 一致可积，则 $X^T$ 一致可积且 $X_{t\\wedge T}=E[X_T\\mid\\mathcal F_t]$。（书中 Cor 3.24 · p.61）" },
  { id: "sc-r3-15", ch: 3, cat: "Thm 3.25 非负上鞅", q: "非负右连续上鞅 $Z$，停时 $U\\le V$（可无界），则：", opts: ["$Z_U\\ge E[Z_V\\mid\\mathcal F_U]$", "$Z_U=E[Z_V\\mid\\mathcal F_U]$", "$Z_U\\le E[Z_V\\mid\\mathcal F_U]$", "只有 $V$ 有界时才有意义"], a: 0,
    hint: "非负性代替了一致可积，但只能得到上鞅不等式。",
    exp: "定理 3.25：$Z_U,Z_V\\in L^1$ 且 $Z_U\\ge E[Z_V\\mid\\mathcal F_U]$（$Z_\\infty$ 为 a.s. 极限）。（书中 Thm 3.25 · p.64）" },
  { id: "sc-r3-16", ch: 4, cat: "Prop 4.7 局部鞅的性质", q: "关于连续局部鞅，下面哪一项正确（命题 4.7）？", opts: ["非负且 $M_0\\in L^1$ 时是上鞅", "非负时一定是鞅", "可积时一定是鞅", "被 $L^1$ 有界时一定是一致可积鞅"], a: 0,
    hint: "Fatou 引理能给出哪个方向的不等式？",
    exp: "命题 4.7：(i) 非负、$M_0\\in L^1$ ⇒ 上鞅；(ii) 被某个 $Z\\in L^1$ 控制 ⇒ 一致可积鞅。只是可积或 $L^1$ 有界都不够。（书中 Prop 4.7 · p.77）" },
  { id: "sc-r3-17", ch: 4, cat: "Thm 4.8", q: "若连续局部鞅 $M$ 同时是有限变差过程，则：", opts: ["几乎必然对所有 $t$，$M_t=0$", "$M$ 是布朗运动", "$M$ 是一致可积鞅但不一定为 0", "$\\langle M,M\\rangle_t=t$"], a: 0,
    hint: "有限变差过程按定义 4.4 自带 $M_0=0$。",
    exp: "定理 4.8：$M\\equiv0$。这保证了半鞅分解 $X=M+A$ 的唯一性。（书中 Thm 4.8 · p.78）" },
  { id: "sc-r3-18", ch: 4, cat: "Thm 4.9 收敛方式", q: "定理 4.9：$\\langle M,M\\rangle_t=\\lim\\sum_i(M_{t_i^n}-M_{t_{i-1}^n})^2$。对一般连续局部鞅，这个极限是：", opts: ["依概率收敛", "$L^2$ 收敛", "几乎必然收敛", "$L^1$ 收敛"], a: 0,
    hint: "一般局部鞅可能没有二阶矩。",
    exp: "定理 4.9 给出依概率收敛；对布朗运动（命题 2.16）有更强的 $L^2$ 收敛。（书中 Thm 4.9 · p.79）" },
  { id: "sc-r3-19", ch: 4, cat: "Thm 4.13 $L^2$ 有界鞅", q: "设 $M$ 是连续局部鞅，$M_0\\in L^2$。“$M$ 是 $L^2$ 有界的真鞅”等价于：", opts: ["$E[\\langle M,M\\rangle_\\infty]<\\infty$", "对每个 $t$，$E[\\langle M,M\\rangle_t]<\\infty$", "$\\langle M,M\\rangle_\\infty<\\infty$ a.s.", "$E[M_t^2]<\\infty$ 对每个 $t$"], a: 0,
    hint: "“对每个 $t$，$E[\\langle M,M\\rangle_t]<\\infty$”对应的是定理 4.13(ii)：每个 $M_t\\in L^2$ 的真鞅（不一定 $L^2$ 有界）。",
    exp: "定理 4.13(i)：$L^2$ 有界真鞅 $\\iff E[\\langle M,M\\rangle_\\infty]<\\infty$，此时 $E[M_\\infty^2]=E[M_0^2]+E[\\langle M,M\\rangle_\\infty]$。（书中 Thm 4.13 · p.85）" },
  { id: "sc-r3-20", ch: 4, cat: "Prop 4.18 Kunita–Watanabe", q: "Kunita–Watanabe 不等式：$\\int_0^\\infty|H_s||K_s|\\,|d\\langle M,N\\rangle_s|\\le$", opts: ["$\\big(\\int_0^\\infty H_s^2d\\langle M,M\\rangle_s\\big)^{1/2}\\big(\\int_0^\\infty K_s^2d\\langle N,N\\rangle_s\\big)^{1/2}$", "$\\int_0^\\infty H_sK_s\\,d\\langle M,M\\rangle_s$", "$\\tfrac12\\int_0^\\infty(H_s^2+K_s^2)\\,ds$", "$\\big(E\\int H^2d\\langle M\\rangle\\big)^{1/2}\\big(E\\int K^2d\\langle N\\rangle\\big)^{1/2}$"], a: 0,
    hint: "它是括号的 Cauchy–Schwarz 不等式，而且是逐个 $\\omega$ 成立的（不取期望）。",
    exp: "命题 4.18：对可测过程 $H,K$，a.s. 有 $\\int|H||K||d\\langle M,N\\rangle|\\le(\\int H^2d\\langle M,M\\rangle)^{1/2}(\\int K^2d\\langle N,N\\rangle)^{1/2}$。（书中 Prop 4.18 · p.88）" },
  { id: "sc-r3-21", ch: 5, cat: "Thm 5.4 刻画随机积分", q: "对 $M\\in\\mathbb H^2$、$H\\in L^2(M)$，$H\\cdot M$ 是 $\\mathbb H^2$ 中唯一满足哪个性质的鞅？", opts: ["对所有 $N\\in\\mathbb H^2$，$\\langle H\\cdot M,N\\rangle=H\\cdot\\langle M,N\\rangle$", "$E[(H\\cdot M)_\\infty]=0$", "$\\langle H\\cdot M,H\\cdot M\\rangle=H\\cdot\\langle M,M\\rangle$", "$(H\\cdot M)_t=\\int_0^tH_s\\,dM_s$ 作为 Stieltjes 积分"], a: 0,
    hint: "只看与自身的括号不足以唯一确定。",
    exp: "定理 5.4（5.2）：$\\langle H\\cdot M,N\\rangle=H\\cdot\\langle M,N\\rangle$ 对所有 $N\\in\\mathbb H^2$。由此 $\\langle H\\cdot M,H\\cdot M\\rangle=H^2\\cdot\\langle M,M\\rangle$（$H\\cdot\\langle M,M\\rangle$ 漏了平方）。（书中 Thm 5.4 · p.101）" },
  { id: "sc-r3-22", ch: 5, cat: "Itô 等距", q: "$M\\in\\mathbb H^2$，$H\\in L^2(M)$。由定理 5.4 的等距性，$E[(H\\cdot M)_\\infty^2]=$", opts: ["$E\\big[\\int_0^\\infty H_s^2\\,d\\langle M,M\\rangle_s\\big]$", "$E\\big[\\int_0^\\infty H_s\\,d\\langle M,M\\rangle_s\\big]^2$", "$E\\big[\\int_0^\\infty H_s^2\\,ds\\big]$", "$\\big(E\\int_0^\\infty H_s\\,dM_s\\big)^2$"], a: 0,
    hint: "$H\\mapsto H\\cdot M$ 是 $L^2(M)\\to\\mathbb H^2$ 的等距。",
    exp: "$\\|H\\cdot M\\|_{\\mathbb H^2}^2=E[\\langle H\\cdot M\\rangle_\\infty]=E[\\int H^2d\\langle M,M\\rangle]$。对布朗运动 $d\\langle B,B\\rangle_s=ds$，积分测度换成 $ds$ 的那个式子才成立。（书中 Thm 5.4 · p.101）" },
  { id: "sc-r3-23", ch: 5, cat: "Thm 5.6 局部鞅的积分", q: "对连续局部鞅 $M$ 与 $H\\in L^2_{loc}(M)$，$H\\cdot M$ 是：", opts: ["初值为 0 的唯一连续局部鞅，使所有 $N$ 有 $\\langle H\\cdot M,N\\rangle=H\\cdot\\langle M,N\\rangle$", "$\\mathbb H^2$ 中的鞅", "一致可积鞅", "有限变差过程"], a: 0,
    hint: "推广后一般只剩“局部”的性质。",
    exp: "定理 5.6：唯一的初值为 0 的连续局部鞅，满足（5.10）对所有连续局部鞅 $N$。一般不是真鞅。（书中 Thm 5.6 · p.106）" },
  { id: "sc-r3-24", ch: 5, cat: "Prop 5.9 Riemann 和", q: "$H$ 适应且路径连续。$\\int_0^tH_s\\,dX_s$ 是哪个 Riemann 和的依概率极限？", opts: ["$\\sum_iH_{t_i}(X_{t_{i+1}}-X_{t_i})$（左端点）", "$\\sum_iH_{t_{i+1}}(X_{t_{i+1}}-X_{t_i})$（右端点）", "$\\sum_i\\tfrac12(H_{t_i}+H_{t_{i+1}})(X_{t_{i+1}}-X_{t_i})$（中点）", "任意取点都可以"], a: 0,
    hint: "Itô 积分对应“下注时只知道过去”。",
    exp: "命题 5.9：左端点 Riemann 和依概率收敛到 Itô 积分。用梯形（中点）规则会得到 Stratonovich 积分，二者相差 $\\tfrac12\\langle H,X\\rangle$。（书中 Prop 5.9 · p.112）" },
  { id: "sc-r3-25", ch: 5, cat: "Thm 5.10 Itô 公式", q: "Itô 公式（定理 5.10）对 $F(X^1,\\dots,X^p)$ 成立，对 $F$ 的要求是：", opts: ["$F\\in C^2(\\mathbb R^p)$", "$F\\in C^1$", "$F$ 是凸函数", "$F$ 有界且光滑"], a: 0,
    hint: "公式里出现二阶偏导 $\\partial^2F/\\partial x_i\\partial x_j$。",
    exp: "定理 5.10：$F$ 二次连续可微，二阶项为 $\\tfrac12\\sum_{i,j}\\int\\partial_{ij}F\\,d\\langle X^i,X^j\\rangle$。凸函数情形要用到局部时（第 9 章）。（书中 Thm 5.10 · p.113）" },
  { id: "sc-r3-26", ch: 5, cat: "Prop 5.11 指数局部鞅", q: "对 $\\lambda\\in\\mathbb C$，$\\mathcal E^\\lambda(M)_t=\\exp(\\lambda M_t-\\tfrac{\\lambda^2}{2}\\langle M,M\\rangle_t)$ 满足：", opts: ["$\\mathcal E^\\lambda(M)_t=e^{\\lambda M_0}+\\lambda\\int_0^t\\mathcal E^\\lambda(M)_s\\,dM_s$", "$\\mathcal E^\\lambda(M)_t=1+\\int_0^t\\mathcal E^\\lambda(M)_s\\,dM_s$", "$\\mathcal E^\\lambda(M)$ 总是真鞅", "$\\mathcal E^\\lambda(M)_t=e^{\\lambda M_0}+\\int_0^t\\mathcal E^\\lambda(M)_s\\,ds$"], a: 0,
    hint: "用 Itô 公式，$\\langle M\\rangle$ 项正好抵消二阶项。",
    exp: "命题 5.11：它是复值连续局部鞅，且 $=e^{\\lambda M_0}+\\lambda\\int\\mathcal E^\\lambda(M)\\,dM$。一般只是局部鞅（见定理 5.23 的条件）。（书中 Prop 5.11 · p.118）" },
  { id: "sc-r3-27", ch: 5, cat: "Thm 5.12 Lévy 刻画", q: "$d$ 维适应连续过程 $X$ 是 $(\\mathcal F_t)$-布朗运动，当且仅当：", opts: ["每个 $X^i$ 是连续局部鞅，且 $\\langle X^i,X^j\\rangle_t=\\delta_{ij}t$", "每个 $X^i$ 是一维布朗运动", "每个 $X^i$ 是鞅且 $E[(X^i_t)^2]=t$", "各分量独立且都是连续鞅"], a: 0,
    hint: "只说“每个分量都是一维布朗运动”不够：各分量都是布朗运动，联合起来未必是 $d$ 维布朗运动。",
    exp: "定理 5.12：(ii) 各分量是连续局部鞅且 $\\langle X^i,X^j\\rangle_t=\\delta_{ij}t$。这里 $X_0$ 需要从 0 出发（$(\\mathcal F_t)$-BM 定义）。（书中 Thm 5.12 · p.119）" },
  { id: "sc-r3-28", ch: 5, cat: "Thm 5.13 Dambis–Dubins–Schwarz", q: "DDS 定理：若连续局部鞅 $M$ 满足 ______，则存在布朗运动 $\\beta$ 使 $M_t=\\beta_{\\langle M,M\\rangle_t}$。", opts: ["$\\langle M,M\\rangle_\\infty=\\infty$ a.s.", "$E[\\langle M,M\\rangle_\\infty]<\\infty$", "$M$ 一致可积", "$\\langle M,M\\rangle_t=t$"], a: 0,
    hint: "时间变换 $\\tau_r=\\inf\\{t:\\langle M,M\\rangle_t>r\\}$ 要对所有 $r\\ge0$ 有限。",
    exp: "定理 5.13 要求 $\\langle M,M\\rangle_\\infty=\\infty$ a.s.（书中 $M_0=0$）。$\\langle M,M\\rangle_t=t$ 是 Lévy 刻画的情形，不是定理要求的条件。（书中 Thm 5.13 · p.121）" },
  { id: "sc-r3-29", ch: 5, cat: "Thm 5.16 BDG 不等式", q: "BDG 不等式 $c_pE[\\langle M,M\\rangle_T^{p/2}]\\le E[(M_T^*)^p]\\le C_pE[\\langle M,M\\rangle_T^{p/2}]$ 对哪些 $p$ 成立？", opts: ["所有 $p>0$", "只有 $p>1$", "只有 $p\\ge2$", "只有 $p=2$"], a: 0,
    hint: "这和 Doob 不等式（需要 $p>1$）不同。",
    exp: "定理 5.16：对每个实数 $p>0$，常数只依赖 $p$；$M_0=0$，$T$ 是任意停时，$M^*_T=\\sup_{t\\le T}|M_t|$。（书中 Thm 5.16 · p.124）" },
  { id: "sc-r3-30", ch: 5, cat: "Cor 5.17", q: "连续局部鞅 $M$（$M_0=0$）是一致可积鞅的一个充分条件是：", opts: ["$E[\\langle M,M\\rangle_\\infty^{1/2}]<\\infty$", "$\\langle M,M\\rangle_\\infty<\\infty$ a.s.", "$E[\\langle M,M\\rangle_t]<\\infty$ 对每个 $t$", "$E|M_t|<\\infty$ 对每个 $t$"], a: 0,
    hint: "用 $p=1$ 的 BDG：$E[M^*_\\infty]$ 被什么控制？",
    exp: "推论 5.17：$E[\\langle M,M\\rangle_\\infty^{1/2}]<\\infty$ ⇒ $E[M^*_\\infty]<\\infty$ ⇒ $M$ 被可积变量控制，是一致可积鞅。（书中 Cor 5.17 · p.126）" },
  { id: "sc-r3-31", ch: 5, cat: "Thm 5.18 鞅表示", q: "鞅表示定理（定理 5.18）的前提是：", opts: ["滤子是布朗运动 $B$ 的完备自然滤子", "滤子满足通常条件即可", "$Z$ 有界", "$Z$ 是 $B_1$ 的函数"], a: 0,
    hint: "若滤子里有和 $B$ 无关的随机性，就不可能全部用 $\\int h\\,dB$ 表示。",
    exp: "定理 5.18：在 $B$ 的完备自然滤子下，$Z\\in L^2(\\mathcal F_\\infty)$ 有唯一 $h\\in L^2(B)$ 使 $Z=E[Z]+\\int_0^\\infty h_s\\,dB_s$。（书中 Thm 5.18 · p.127）" },
  { id: "sc-r3-32", ch: 5, cat: "Thm 5.22 Girsanov", q: "Girsanov 定理：$P,Q$ 在 $\\mathcal F_\\infty$ 上互相绝对连续，$D=\\mathcal E(L)$ 连续。若 $M$ 是 $P$-连续局部鞅，则 $Q$-局部鞅是：", opts: ["$M-\\langle M,L\\rangle$", "$M+\\langle M,L\\rangle$", "$M-\\langle L,L\\rangle$", "$M-L$"], a: 0,
    hint: "取 $M=B$、$L=\\theta B$ 验证：$B_t-\\theta t$。",
    exp: "定理 5.22：$\\tilde M=M-\\langle M,L\\rangle$ 是 $Q$ 下的连续局部鞅。（书中 Thm 5.22 · p.134）" },
  { id: "sc-r3-33", ch: 5, cat: "Thm 5.23 Novikov 判据", q: "设 $L_0=0$。Novikov 判据 ______ 推出 $\\mathcal E(L)$ 是一致可积鞅。", opts: ["$E[\\exp(\\tfrac12\\langle L,L\\rangle_\\infty)]<\\infty$", "$E[\\exp(\\langle L,L\\rangle_\\infty)]<\\infty$", "$E[\\exp(\\tfrac12L_\\infty)]<\\infty$", "$\\langle L,L\\rangle_\\infty<\\infty$ a.s."], a: 0,
    hint: "$E[\\exp(\\tfrac12L_\\infty)]<\\infty$ 是 Kazamaki 判据的一部分（还要求 $L$ 一致可积）。",
    exp: "定理 5.23：Novikov ⇒ Kazamaki（$L$ 一致可积且 $E[e^{L_\\infty/2}]<\\infty$）⇒ $\\mathcal E(L)$ 一致可积鞅。（书中 Thm 5.23 · p.137）" },
  { id: "sc-r3-34", ch: 5, cat: "Prop 5.21 正局部鞅的对数", q: "严格正的连续局部鞅 $D$ 可写成 $\\mathcal E(L)$，其中 $L_t=$", opts: ["$\\log D_0+\\int_0^tD_s^{-1}\\,dD_s$", "$\\log D_t$", "$\\int_0^tD_s\\,dD_s$", "$\\log D_0+\\int_0^t\\log D_s\\,ds$"], a: 0,
    hint: "$\\log D_t$ 本身还差一个 $-\\tfrac12\\langle L,L\\rangle$。",
    exp: "命题 5.21：$L_t=\\log D_0+\\int_0^tD_s^{-1}dD_s$，且 $D=\\exp(L-\\tfrac12\\langle L,L\\rangle)$。（书中 Prop 5.21 · p.133）" },
  { id: "sc-r3-35", ch: 6, cat: "Thm 6.17 强马氏性", q: "定理 6.17（一般马尔可夫过程的强马氏性）需要的条件包括：", opts: ["Feller 半群、càdlàg 路径，$T$ 是 $(\\mathcal F_{t+})$ 的停时", "只需转移半群和可测路径", "$T$ 必须有界", "过程必须是布朗运动"], a: 0,
    hint: "它比简单马氏性（定理 6.16）多了对半群的要求。",
    exp: "定理 6.17：在定理 6.16（càdlàg 路径）的假设上再要求 $(Q_t)$ 是 Feller 的，$T$ 可为 $(\\mathcal F_{t+})$ 停时，则 $E[\\mathbf 1_{\\{T<\\infty\\}}\\Phi(Y_{T+\\cdot})\\mid\\mathcal F_T]=\\mathbf 1_{\\{T<\\infty\\}}E_{Y_T}[\\Phi]$。（书中 Thm 6.17 · p.169）" },
  { id: "sc-r3-36", ch: 8, cat: "Thm 8.3 Lipschitz 情形", q: "定理 8.3：在什么假设下，$E(\\sigma,b)$ 有轨道唯一性且对每个初值存在强解？", opts: ["$\\sigma,b$ 连续且关于 $x$ 一致 Lipschitz", "$\\sigma,b$ 有界可测", "$\\sigma,b$ 连续", "$\\sigma$ 非退化"], a: 0,
    hint: "证明用 Picard 迭代和 Gronwall 引理。",
    exp: "§8.2 假设：$\\sigma,b$ 在 $\\mathbb R_+\\times\\mathbb R^d$ 上连续，且 $|\\sigma(t,x)-\\sigma(t,y)|+|b(t,x)-b(t,y)|\\le K|x-y|$。（书中 Thm 8.3 · p.212）" },
  { id: "sc-r3-37", ch: 8, cat: "Yamada–Watanabe", q: "Yamada–Watanabe 定理：若 ______，则弱唯一性成立且存在强解。", opts: ["弱存在且轨道唯一", "弱存在且弱唯一", "系数有界", "存在强解"], a: 0,
    hint: "书中的反例 $dX=\\mathrm{sgn}(X)dB$：有弱存在和弱唯一，却没有轨道唯一，也没有强解。",
    exp: "Yamada–Watanabe：weak existence + pathwise uniqueness ⇒ weak uniqueness，且对任意空间和布朗运动存在强解。（书中 §8.1 · p.212）" },
  { id: "sc-r3-38", ch: 8, cat: "Tanaka 的例子", q: "对方程 $dX_t=\\mathrm{sgn}(X_t)\\,dB_t$，书中说明了：", opts: ["弱存在、弱唯一成立，但轨道唯一不成立", "轨道唯一成立，但弱存在不成立", "存在强解", "什么都不成立"], a: 0,
    hint: "任何解都是布朗运动（Lévy 刻画）；但 $\\beta$ 和 $-\\beta$ 能同时是解吗？",
    exp: "任何解都是布朗运动，故弱唯一；从 0 出发时 $\\beta$ 与 $-\\beta$ 都是同一 $B$ 下的解，所以轨道唯一不成立，也不是强解。（书中 §8.1 · p.211–212）" },
  { id: "sc-r3-39", ch: 9, cat: "Cor 9.7 占位密度公式", q: "连续半鞅 $X$ 的占位密度公式：$\\int_0^t\\varphi(X_s)\\,d\\langle X,X\\rangle_s=$", opts: ["$\\int_{\\mathbb R}\\varphi(a)L^a_t(X)\\,da$", "$\\int_{\\mathbb R}\\varphi(a)L^a_t(X)\\,d\\langle X,X\\rangle_a$", "$\\int_0^t\\varphi(X_s)\\,ds$", "$\\int_{\\mathbb R}\\varphi(a)\\,da$"], a: 0,
    hint: "左边对 $d\\langle X,X\\rangle$ 积分，右边对空间变量 $a$ 积分。",
    exp: "推论 9.7：$\\int_0^t\\varphi(X_s)d\\langle X,X\\rangle_s=\\int\\varphi(a)L^a_t(X)da$。对布朗运动 $d\\langle B\\rangle_s=ds$，即 Trotter 定理中的公式。（书中 Cor 9.7 · p.245）" },
  { id: "sc-r3-40", ch: 9, cat: "Thm 9.12 Trotter", q: "Trotter 定理说布朗运动的局部时 $(L^a_t(B))$ 有一个版本：", opts: ["关于 $(a,t)$ 联合连续", "关于 $a$ 只是 càdlàg", "关于 $t$ 严格递增", "对每个 $a$ 几乎处处为 0"], a: 0,
    hint: "对一般连续半鞅，定理 9.4 只给出关于 $a$ 的 càdlàg 修正。",
    exp: "定理 9.12：存在关于 $(a,t)$ 联合连续的版本，满足 $\\int_0^t\\varphi(B_s)ds=\\int\\varphi(a)L^a_t(B)da$。（书中 Thm 9.12 · p.249）" },
  { id: "sc-r3-41", ch: 9, cat: "Thm 9.14 Lévy 定理", q: "Lévy 定理：$(S_t,\\ S_t-B_t)_{t\\ge0}$ 与哪个过程同分布？", opts: ["$(L^0_t(B),\\ |B_t|)_{t\\ge0}$", "$(|B_t|,\\ L^0_t(B))_{t\\ge0}$", "$(B_t,\\ |B_t|)_{t\\ge0}$", "$(L^0_t(B),\\ B_t)_{t\\ge0}$"], a: 0,
    hint: "$S-B\\ge0$ 应对应一个非负过程，而 $S$ 是递增的。",
    exp: "定理 9.14：$(S,S-B)\\overset{d}{=}(L^0(B),|B|)$。特别地 $L^0_t\\overset{d}{=}S_t\\overset{d}{=}|B_t|$。（书中 Thm 9.14 · p.252）" },
  { id: "qi-r1-1", ch: 21, cat: "几何分布", q: "掷一枚均匀骰子，直到掷出 6 为止。期望要掷几次？", opts: ["6", "3.5", "5", "36"], a: 0,
    hint: "设期望为 $E$。第一次没掷出 6 时，相当于从头再来。",
    exp: "$E = 1 + \\tfrac56 E$，解得 $E=6$。一般地，成功概率为 $p$ 的几何分布期望是 $1/p$。" },
  { id: "qi-r1-2", ch: 21, cat: "抛硬币 · 模式", q: "抛均匀硬币，直到第一次出现连续两次正面 HH。期望要抛几次？", opts: ["6", "4", "3", "8"], a: 0,
    hint: "设两个状态：$E_0$ 是“还没有正面”，$E_1$ 是“上一次刚好是正面”，列方程。",
    exp: "$E_0 = 1 + \\tfrac12E_1 + \\tfrac12E_0$，$E_1 = 1 + \\tfrac12\\cdot0 + \\tfrac12E_0$，解得 $E_0 = 6$。对比 HT 只要 4 次：HH 失败一次就要从头来。" },
  { id: "qi-r1-3", ch: 21, cat: "抛硬币 · 模式", q: "抛均匀硬币，直到第一次出现 HT（正面后紧跟反面）。期望要抛几次？", opts: ["4", "6", "3", "8"], a: 0,
    hint: "一旦出现 H，接下来只要等第一个 T 就行，中间再出 H 也不会前功尽弃。",
    exp: "等第一个 H 期望 2 次，之后等第一个 T 期望 2 次，共 4 次。用 Conway 公式：HT 的前缀和后缀只在长度 2 处重合，期望 $2^2=4$。" },
  { id: "qi-r1-4", ch: 20, cat: "轮流抛硬币", q: "两人轮流抛均匀硬币，先抛出正面的人赢。先手赢的概率是多少？", opts: ["$2/3$", "$1/2$", "$3/4$", "$3/5$"], a: 0,
    hint: "先手第一次就赢的概率是 $\\tfrac12$；两人第一轮都没抛中，局面回到开始。",
    exp: "$p = \\tfrac12 + \\tfrac14 p$，所以 $p = \\tfrac23$。" },
  { id: "qi-r1-5", ch: 20, cat: "条件概率", q: "一个家庭有两个孩子，已知至少有一个是男孩，两个都是男孩的概率是多少？（男女等可能、相互独立）", opts: ["$1/3$", "$1/2$", "$1/4$", "$2/3$"], a: 0,
    hint: "把四种等可能情形（男男、男女、女男、女女）列出来，去掉不符合条件的。",
    exp: "条件排除了“女女”，剩下三种等可能情形，其中男男占一种，概率 $1/3$。若已知“老大是男孩”，答案才是 $1/2$。" },
  { id: "qi-r1-6", ch: 20, cat: "三门问题", q: "三扇门后有一辆车、两只羊。你选一扇门后，主持人（知道答案）打开另一扇有羊的门，问你换不换。换门赢车的概率是？", opts: ["$2/3$", "$1/2$", "$1/3$", "$3/4$"], a: 0,
    hint: "想一想：你最初选错的概率是多少？选错时换门会怎样？",
    exp: "最初选错的概率是 $2/3$，选错时主持人只能打开另一只羊的门，换门必赢。所以换门赢的概率是 $2/3$。" },
  { id: "qi-r1-7", ch: 20, cat: "贝叶斯", q: "某病患病率 1%。检测对患者 99% 呈阳性，对健康人有 1% 假阳性。一个人检测阳性，他真正患病的概率约为？", opts: ["50%", "99%", "90%", "1%"], a: 0,
    hint: "设想 10000 人：多少人患病并检出阳性？多少健康人被误判为阳性？",
    exp: "10000 人中 100 人患病，约 99 人阳性；9900 健康人中约 99 人假阳性。阳性者中真患病约 $99/198 = 50\\%$。基础率很低时，阳性预测值会大打折扣。" },
  { id: "qi-r1-8", ch: 21, cat: "集券问题", q: "每次随机得到 6 种卡片中的一种（等可能），集齐 6 种期望要抽几次？", opts: ["14.7", "21", "36", "6"], a: 0,
    hint: "已经有 $k$ 种时，抽到新卡片的概率是 $(6-k)/6$，等待时间是几何分布。",
    exp: "$E = 6\\left(1 + \\tfrac12 + \\cdots + \\tfrac16\\right) = 14.7$。一般地是 $nH_n \\approx n\\ln n$。" },
  { id: "qi-r1-9", ch: 21, cat: "顺序统计量", q: "$X, Y$ 独立且都服从 $U(0,1)$，$E[\\max(X,Y)]$ 是多少？", opts: ["$2/3$", "$1/2$", "$3/4$", "$1/3$"], a: 0,
    hint: "先求分布函数 $P(\\max(X,Y)\\le t)$，再求期望。",
    exp: "$P(\\max\\le t) = t^2$，密度 $2t$，期望 $\\int_0^1 2t^2\\,dt = \\tfrac23$。一般地 $n$ 个的最大值期望是 $\\tfrac{n}{n+1}$。" },
  { id: "qi-r1-10", ch: 21, cat: "顺序统计量", q: "$n$ 个独立的 $U(0,1)$ 随机变量的最小值，期望是多少？", opts: ["$\\dfrac{1}{n+1}$", "$\\dfrac1n$", "$\\dfrac{1}{2n}$", "$\\dfrac{1}{2^n}$"], a: 0,
    hint: "$P(\\min > t) = ?$ 再用 $E[Z] = \\int_0^1 P(Z>t)\\,dt$。",
    exp: "$P(\\min>t) = (1-t)^n$，积分得 $\\tfrac{1}{n+1}$。直观上，$n$ 个点把 $[0,1]$ 平均分成 $n+1$ 段。" },
  { id: "qi-r1-11", ch: 21, cat: "指示变量", q: "$1,\\dots,n$ 的一个均匀随机排列中，不动点个数的期望是多少？", opts: ["1", "$n/2$", "$1/e$", "$\\ln n$"], a: 0,
    hint: "把不动点个数写成 $n$ 个指示变量之和，用期望的线性性，不需要独立。",
    exp: "每个位置是不动点的概率为 $1/n$，共 $n$ 个，期望 $= n\\cdot\\tfrac1n = 1$，与 $n$ 无关。" },
  { id: "qi-r1-12", ch: 20, cat: "错排", q: "$n$ 个人随机拿回 $n$ 顶帽子，没有一个人拿到自己帽子的概率，当 $n\\to\\infty$ 时趋于？", opts: ["$1/e$", "0", "$1/2$", "$1-1/e$"], a: 0,
    hint: "用容斥原理：$\\sum_k (-1)^k/k!$。",
    exp: "概率 $= \\sum_{k=0}^n \\tfrac{(-1)^k}{k!} \\to e^{-1} \\approx 0.368$。不动点个数近似服从参数 1 的泊松分布。" },
  { id: "qi-r1-13", ch: 20, cat: "几何概率", q: "把一根木棍上随机取两个独立均匀的点，折成三段。三段能组成三角形的概率是？", opts: ["$1/4$", "$1/2$", "$1/3$", "$1/8$"], a: 0,
    hint: "三段能组成三角形，当且仅当每一段都短于总长的一半。在单位正方形里画出这个区域。",
    exp: "在 $[0,1]^2$ 中满足条件的区域是两个面积各 $1/8$ 的三角形，总概率 $1/4$。" },
  { id: "qi-r1-14", ch: 21, cat: "随机游走 · 可选停时", q: "简单对称随机游走从 0 出发，每步 $\\pm1$。它先到达 $+a$ 而不是 $-b$ 的概率是？（$a,b$ 为正整数）", opts: ["$\\dfrac{b}{a+b}$", "$\\dfrac{a}{a+b}$", "$\\dfrac12$", "$\\dfrac{ab}{(a+b)^2}$"], a: 0,
    hint: "$S_n$ 是鞅，停止后有界，可以用可选停时定理：$E[S_T] = 0$。",
    exp: "设先到 $a$ 的概率为 $p$：$pa - (1-p)b = 0$，得 $p = \\tfrac{b}{a+b}$。离 $-b$ 越远，越可能先碰到 $+a$。" },
  { id: "qi-r1-15", ch: 21, cat: "随机游走 · 可选停时", q: "上题中，随机游走第一次碰到 $+a$ 或 $-b$ 所需步数的期望是？", opts: ["$ab$", "$a+b$", "$(a+b)^2$", "$a^2+b^2$"], a: 0,
    hint: "找一个和步数 $n$ 有关的鞅：$S_n^2 - n$。",
    exp: "由 $E[S_T^2] = E[T]$：$E[T] = p a^2 + (1-p) b^2 = \\tfrac{b a^2 + a b^2}{a+b} = ab$。连续版本就是布朗运动离开 $(-b,a)$ 的期望时间 $ab$。" },
  { id: "qi-r1-16", ch: 21, cat: "正态矩", q: "$X\\sim N(0,1)$，$E[X^4]$ 是多少？", opts: ["3", "1", "2", "4"], a: 0,
    hint: "用分部积分，或者记住 $E[X^{2k}] = (2k-1)!!$。",
    exp: "$E[X^4] = 3!! = 3$。峰度为 3 就是这么来的，“超额峰度”是减去 3 以后的值。" },
  { id: "qi-r1-17", ch: 20, cat: "二元正态", q: "$(X,Y)$ 是标准二元正态，相关系数 $\\rho = 1/2$。$P(X>0, Y>0)$ 是多少？", opts: ["$1/3$", "$1/4$", "$3/8$", "$1/2$"], a: 0,
    hint: "公式 $P = \\tfrac14 + \\tfrac{\\arcsin\\rho}{2\\pi}$；也可以用极坐标看两个半平面的交角。",
    exp: "$\\tfrac14 + \\tfrac{\\pi/6}{2\\pi} = \\tfrac14 + \\tfrac1{12} = \\tfrac13$。$\\rho=0$ 时是 $1/4$，$\\rho\\to1$ 时趋于 $1/2$。" },
  { id: "qi-r1-18", ch: 20, cat: "相关矩阵", q: "三个随机变量两两之间的相关系数都等于 $\\rho$。$\\rho$ 最小可以取到多少？", opts: ["$-1/2$", "$-1$", "$-1/3$", "0"], a: 0,
    hint: "相关矩阵必须半正定。看一看 $\\operatorname{Var}(X+Y+Z)$（标准化后）。",
    exp: "$\\operatorname{Var}(X+Y+Z) = 3 + 6\\rho \\ge 0$，所以 $\\rho \\ge -\\tfrac12$。一般 $n$ 个变量时下界是 $-\\tfrac{1}{n-1}$。" },
  { id: "qi-r1-19", ch: 21, cat: "最优停止", q: "掷一次骰子，可以拿走与点数相同的钱，或者放弃这次结果重掷一次（重掷后必须接受）。最优策略下期望收益是多少？", opts: ["4.25", "3.5", "4", "4.5"], a: 0,
    hint: "重掷的期望是 3.5。第一次掷出多少时应该保留？",
    exp: "掷出 4、5、6 就保留（平均 5），掷出 1、2、3 就重掷（期望 3.5）：$\\tfrac12\\cdot5 + \\tfrac12\\cdot3.5 = 4.25$。" },
  { id: "qi-r1-20", ch: 21, cat: "布朗运动", q: "标准布朗运动 $B$，$E|B_t|$ 等于？", opts: ["$\\sqrt{2t/\\pi}$", "$\\sqrt t$", "$t$", "0"], a: 0,
    hint: "$B_t \\sim \\sqrt t\\, Z$，$Z\\sim N(0,1)$。先算 $E|Z|$。",
    exp: "$E|Z| = 2\\int_0^\\infty z\\varphi(z)\\,dz = \\sqrt{2/\\pi}$，所以 $E|B_t| = \\sqrt{2t/\\pi}$。由反射原理，这也是 $E[\\sup_{s\\le t}B_s]$。" },
  { id: "qi-r2-1", ch: 22, cat: "计数", q: "$100!$ 的末尾有多少个 0？", opts: ["24", "20", "25", "10"], a: 0,
    hint: "末尾的 0 来自因子 $2\\times5$，因子 2 远多于 5，所以只需要数因子 5。别忘了 25、50、75、100 各贡献两个。",
    exp: "$\\lfloor100/5\\rfloor + \\lfloor100/25\\rfloor = 20 + 4 = 24$。" },
  { id: "qi-r2-2", ch: 22, cat: "钟表", q: "3 点 15 分时，时针和分针的夹角是多少度？", opts: ["7.5°", "0°", "15°", "30°"], a: 0,
    hint: "分针指向 3。时针每分钟走多少度？",
    exp: "时针每小时 30°、每分钟 0.5°。15 分钟后时针从 3 往前走了 7.5°，分针正好指 3，夹角 7.5°。" },
  { id: "qi-r2-3", ch: 22, cat: "容斥原理", q: "1 到 1000 中，既不能被 2 整除、也不能被 3 整除的数有多少个？", opts: ["333", "334", "500", "167"], a: 0,
    hint: "用容斥：减去 2 的倍数和 3 的倍数，再加回 6 的倍数。",
    exp: "$1000 - 500 - 333 + 166 = 333$。" },
  { id: "qi-r2-4", ch: 22, cat: "赛马", q: "25 匹马，每场最多 5 匹同跑，没有计时只能看名次。最少要几场才能确定最快的 3 匹？", opts: ["7", "6", "8", "11"], a: 0,
    hint: "先分 5 组各跑一场，再让 5 个组的第一名跑一场。之后还有哪些马可能进前三？",
    exp: "前 6 场后，冠军确定。可能是第 2、3 名的只剩 5 匹（冠军组的第 2、3 名，第二名组的第 1、2 名，第三名组的第 1 名），第 7 场取前两名。共 7 场。" },
  { id: "qi-r2-5", ch: 22, cat: "称球", q: "8 个外观相同的球中有一个更重，用天平最少称几次一定能找出它？", opts: ["2", "3", "1", "4"], a: 0,
    hint: "天平每次有三种结果（左重、右重、平衡），所以每次应该把球分成三组。",
    exp: "3+3+2：若平衡，重球在剩下 2 个里，再称一次；若不平衡，从重的 3 个里拿 2 个称一次。$3^2 = 9 \\ge 8$，2 次足够；1 次最多区分 3 种情况，不够。" },
  { id: "qi-r2-6", ch: 22, cat: "二进制", q: "1000 瓶酒中有一瓶有毒，小白鼠喝到毒酒一天后死亡。只有一天时间，最少需要几只小白鼠才能确定毒酒？", opts: ["10", "9", "1000", "500"], a: 0,
    hint: "每只小白鼠最后只有“死”或“活”两种结果，$k$ 只能区分多少种情况？",
    exp: "把瓶子编号写成二进制，第 $i$ 只老鼠喝所有第 $i$ 位为 1 的瓶子。死亡情况组成的二进制数就是毒酒编号。$2^{10} = 1024 \\ge 1000 > 2^9$，所以要 10 只。" },
  { id: "qi-r2-7", ch: 20, cat: "登机问题", q: "100 人按顺序登机，各有指定座位。第 1 人随机选座；之后每人若自己的座位空着就坐，被占了就随机选空座。最后一人坐到自己座位的概率是？", opts: ["$1/2$", "$1/100$", "$1/e$", "$99/100$"], a: 0,
    hint: "最后一人面对的空座位只可能是哪两个座位之一？这两个座位的地位对称吗？",
    exp: "每当有人随机选座，选到第 1 个人的座位和第 100 个人的座位的可能性相同；一旦选到其中之一，结局就定了。所以概率是 $1/2$。" },
  { id: "qi-r2-8", ch: 20, cat: "抽牌", q: "从一副 52 张的扑克牌中随机抽 2 张，两张都是 A 的概率是？", opts: ["$1/221$", "$1/169$", "$1/26$", "$1/13$"], a: 0,
    hint: "第一张是 A 的概率乘以“已知第一张是 A 时第二张也是 A”的概率。",
    exp: "$\\tfrac{4}{52}\\cdot\\tfrac{3}{51} = \\tfrac{1}{221}$。" },
  { id: "qi-r2-9", ch: 23, cat: "看涨看跌平价", q: "同一标的、同一行权价 $K$ 和到期日 $T$ 的欧式看涨 $C$ 和看跌 $P$（无股息），满足 $C - P = $？", opts: ["$S - Ke^{-rT}$", "$K - S$", "$S - K$", "$Ke^{-rT} - S$"], a: 0,
    hint: "比较“买看涨、卖看跌”这个组合在到期时的收益，和什么东西一样？",
    exp: "到期时 $(S_T-K)^+ - (K-S_T)^+ = S_T - K$，相当于持有股票并借入 $Ke^{-rT}$。无套利要求今天的价格相等。" },
  { id: "qi-r2-10", ch: 23, cat: "Delta", q: "平值（$S = K$）欧式看涨期权的 delta 大约是多少？（$r>0$）", opts: ["略大于 0.5", "正好 0.5", "接近 1", "接近 0"], a: 0,
    hint: "delta $= N(d_1)$。平值时 $d_1 = (r + \\sigma^2/2)\\sqrt T/\\sigma$ 的符号是什么？",
    exp: "平值时 $d_1 > 0$，所以 $N(d_1)$ 略大于 0.5。常说的“平值 delta 约 0.5”是近似。" },
  { id: "qi-r2-11", ch: 23, cat: "Vega", q: "其他条件不变，波动率上升时，欧式看涨期权的价格会？", opts: ["上升", "下降", "不变", "取决于是否价内"], a: 0,
    hint: "vega $= S\\varphi(d_1)\\sqrt T$，它的符号是什么？",
    exp: "vega 总是正的：波动率越大，价内的机会越大，而亏损被限制在期权费以内。看涨和看跌都是如此。" },
  { id: "qi-r2-12", ch: 23, cat: "美式期权", q: "标的股票不付股息时，美式看涨期权什么时候提前行权是最优的？", opts: ["永远不会", "深度价内时", "到期前一天", "波动率很低时"], a: 0,
    hint: "比较立即行权得到的 $S-K$ 和继续持有的价值下界 $S - Ke^{-rT}$。",
    exp: "$C \\ge S - Ke^{-rT} > S - K$（$r>0$），继续持有总比行权值钱，所以不提前行权，价格与欧式相同。付股息的看涨、以及看跌期权则可能提前行权。" },
  { id: "qi-r2-13", ch: 23, cat: "估算", q: "无利率时平值看涨期权价格约为 $0.4\\,S\\sigma\\sqrt T$。$S=100$，$\\sigma=20\\%$，$T=1$ 年，价格大约是？", opts: ["8", "20", "4", "10"], a: 0,
    hint: "$0.4 \\approx 1/\\sqrt{2\\pi}$。直接代数。",
    exp: "$0.4\\times100\\times0.2\\times1 = 8$。精确的 Black–Scholes 价约 7.97。面试时常用这个公式做心算估计。" },
  { id: "qi-r2-14", ch: 23, cat: "数字期权", q: "到期时 $S_T > K$ 就支付 1 元的数字看涨期权，Black–Scholes 价格是？", opts: ["$e^{-rT}N(d_2)$", "$e^{-rT}N(d_1)$", "$N(d_1)$", "$SN(d_1)$"], a: 0,
    hint: "价格 = 折现后的风险中性概率 $e^{-rT}\\,Q(S_T > K)$。",
    exp: "风险中性下 $Q(S_T>K) = N(d_2)$，所以价格是 $e^{-rT}N(d_2)$。$N(d_1)$ 是用股票作计价单位时的概率。" },
  { id: "qi-r2-15", ch: 23, cat: "Gamma", q: "欧式期权的 gamma 在什么情况下最大？", opts: ["平值附近且临近到期", "深度价内", "深度价外", "离到期很久"], a: 0,
    hint: "gamma $= \\dfrac{\\varphi(d_1)}{S\\sigma\\sqrt T}$。看分子什么时候最大、分母什么时候最小。",
    exp: "平值时 $\\varphi(d_1)$ 最大；临近到期时 $\\sqrt T$ 很小，gamma 变得很尖。这时 delta 对股价非常敏感，对冲最困难。" },
  { id: "qi-r2-16", ch: 23, cat: "行权价", q: "欧式看涨期权的价格作为行权价 $K$ 的函数是？", opts: ["递减且凸", "递增且凸", "递减且凹", "线性"], a: 0,
    hint: "$K$ 越高，收益 $(S_T-K)^+$ 越小。再想想 $\\partial^2C/\\partial K^2$ 和风险中性密度的关系（Breeden–Litzenberger）。",
    exp: "$\\partial C/\\partial K = -e^{-rT}Q(S_T>K) \\le 0$，$\\partial^2 C/\\partial K^2 = e^{-rT}q(K) \\ge 0$。违反凸性就存在蝶式价差套利。" },
  { id: "sc-r4-1", ch: 1, cat: "§1.1 标准高斯变量的矩", q: "设 $X\\sim\\mathcal N(0,1)$。$E[X^6]$ 等于多少？", opts: ["$15$", "$6$", "$30$", "$105$"], a: 0, hint: "用公式 $E[X^{2n}]=\\frac{(2n)!}{2^n n!}$，或由特征函数展开读出系数。",
    exp: "$E[X^{2n}]=\\frac{(2n)!}{2^n n!}$，取 $n=3$ 得 $720/48=15$。$105$ 是 $E[X^8]$，$6$、$30$ 是常见的错算。（书中 §1.1 · p.2）" },
  { id: "sc-r4-2", ch: 1, cat: "§1.1 复 Laplace 变换", q: "设 $X\\sim\\mathcal N(0,1)$。对 $z\\in\\mathbb C$，$E[e^{zX}]$ 是：", opts: ["对所有 $z\\in\\mathbb C$ 有定义，等于 $e^{z^2/2}$", "对所有 $z\\in\\mathbb C$ 等于 $e^{|z|^2/2}$", "对所有 $z\\in\\mathbb C$ 等于 $e^{-z^2/2}$", "只在实轴附近的带状区域内有定义"], a: 0, hint: "先对实数 $z$ 配方计算，再考虑两边作为 $z$ 的函数的解析性。",
    exp: "实数情形配方得 $e^{\\lambda^2/2}$，这也说明 $E[e^{zX}]$ 对一切复数 $z$ 有限且全纯；由解析延拓得 $e^{z^2/2}$。取 $z=i\\xi$ 才得到 $e^{-\\xi^2/2}$；$e^{|z|^2/2}$ 在 $z=i\\xi$ 处就错了。（书中 §1.1 · p.1–2）" },
  { id: "sc-r4-3", ch: 1, cat: "§1.1 独立高斯变量之和", q: "$Y\\sim\\mathcal N(1,4)$，$Y'\\sim\\mathcal N(2,9)$ 且二者独立。$Y-Y'$ 的分布是：", opts: ["$\\mathcal N(-1,13)$", "$\\mathcal N(-1,5)$", "$\\mathcal N(-1,25)$", "$\\mathcal N(3,13)$"], a: 0, hint: "$-Y'$ 的分布是什么？独立时方差怎样相加？",
    exp: "$-Y'\\sim\\mathcal N(-2,9)$，独立高斯变量之和的均值、方差分别相加（由特征函数立得），故为 $\\mathcal N(-1,13)$。方差不会因相减而相减，也不是标准差相加。（书中 §1.1 · p.3）" },
  { id: "sc-r4-4", ch: 1, cat: "Prop 1.1 高斯变量的极限", q: "$X_n\\sim\\mathcal N(m_n,\\sigma_n^2)$ 且 $X_n\\to X$ 于 $L^2$。下列哪项成立？", opts: ["$X_n\\to X$ 于一切 $L^p$，$1\\le p<\\infty$", "只保证 $L^2$ 收敛，$p>2$ 时未必", "$\\operatorname{var}X$ 可能严格小于 $\\lim\\sigma_n^2$", "$X$ 未必是高斯变量"], a: 0, hint: "高斯变量的各阶矩能被均值和方差控制；一致可积性有什么用？",
    exp: "Prop 1.1：$X\\sim\\mathcal N(\\lim m_n,(\\lim\\sigma_n)^2)$，且由 $\\sup_n E|X_n-X|^q<\\infty$ 及一致可积性得到所有 $L^p$ 收敛。$L^2$ 收敛蕴含方差收敛，所以方差不会“丢失”。（书中 §1.1 · Prop 1.1 · p.3）" },
  { id: "sc-r4-5", ch: 1, cat: "Prop 1.1 之后的注记", q: "若只知 $X_n\\sim\\mathcal N(m_n,\\sigma_n^2)$ **依分布**收敛到 $X$，则：", opts: ["$m_n,\\sigma_n$ 收敛，$X$ 为相应的高斯分布", "$X$ 可以是任意分布", "$X$ 一定是非退化的高斯变量", "$m_n$ 可以不收敛"], a: 0, hint: "考虑特征函数 $\\exp(i\\xi m_n-\\sigma_n^2\\xi^2/2)$ 的逐点收敛。",
    exp: "书中注记指出，结论 (i) 只需依分布收敛：特征函数的收敛迫使 $m_n,\\sigma_n$ 收敛，极限仍为高斯（可能退化，例如 $\\sigma_n\\to0$ 时极限是常数）。（书中 §1.1 · Prop 1.1 后注记 · p.3）" },
  { id: "sc-r4-6", ch: 1, cat: "§1.2 高斯向量的特征函数", q: "$X$ 是 $E$ 中的高斯向量，均值 $m_X$，二次型 $q_X(u)=\\operatorname{var}\\langle u,X\\rangle$。则 $E[e^{i\\langle u,X\\rangle}]=$", opts: ["$\\exp(i\\langle u,m_X\\rangle-\\frac12 q_X(u))$", "$\\exp(i\\langle u,m_X\\rangle-q_X(u))$", "$\\exp(i\\langle u,m_X\\rangle+\\frac12 q_X(u))$", "$\\exp(\\langle u,m_X\\rangle+\\frac12 q_X(u))$"], a: 0, hint: "$\\langle u,X\\rangle$ 是一维高斯变量，它的均值和方差是什么？",
    exp: "$\\langle u,X\\rangle\\sim\\mathcal N(\\langle u,m_X\\rangle,q_X(u))$，代入一维特征函数 $e^{i\\xi m-\\sigma^2\\xi^2/2}$ 并取 $\\xi=1$ 即得 (1.1)。最后一个选项是 Laplace 变换而非特征函数。（书中 §1.2 · (1.1) · p.4）" },
  { id: "sc-r4-7", ch: 1, cat: "Thm 1.3 协方差算子", q: "下列哪个矩阵**不能**作为 $\\mathbb R^2$ 中某个高斯向量的协方差矩阵？", opts: ["$\\left(\\begin{smallmatrix}1&2\\\\2&1\\end{smallmatrix}\\right)$", "$\\left(\\begin{smallmatrix}1&1\\\\1&1\\end{smallmatrix}\\right)$", "$\\left(\\begin{smallmatrix}2&1\\\\1&2\\end{smallmatrix}\\right)$", "$\\left(\\begin{smallmatrix}1&0\\\\0&0\\end{smallmatrix}\\right)$"], a: 0, hint: "Thm 1.3(i) 说哪些对称矩阵恰好是协方差矩阵？看看特征值。",
    exp: "任何非负对称矩阵都是某个高斯向量的协方差（Thm 1.3(i)），反之协方差矩阵必非负。$\\left(\\begin{smallmatrix}1&2\\\\2&1\\end{smallmatrix}\\right)$ 有特征值 $-1$；其余三个特征值分别为 $\\{0,2\\},\\{1,3\\},\\{0,1\\}$，都可以（允许退化）。（书中 §1.2 · Thm 1.3 · p.5）" },
  { id: "sc-r4-8", ch: 1, cat: "Thm 1.3 支撑与奇异性", q: "$X$ 是 $\\mathbb R^3$ 中的中心化高斯向量，$\\Gamma_X$ 的秩为 $2$。则 $X$ 的分布 $P_X$：", opts: ["支撑是二维子空间，与 Lebesgue 测度奇异", "有密度，只是密度在某平面上为 $0$", "支撑是整个 $\\mathbb R^3$", "支撑是 $\\mathbb R^3$ 中的一个椭球面"], a: 0, hint: "在 $\\Gamma_X$ 的特征基下写 $X=\\sum Y_j\\varepsilon_j$，特征值为 $0$ 的分量是什么？",
    exp: "Thm 1.3(ii)：$X=\\sum_{j\\le r}Y_j\\varepsilon_j$，$Y_j$ 独立且方差为正特征值，故 $\\operatorname{supp}P_X=\\operatorname{span}(\\varepsilon_1,\\dots,\\varepsilon_r)$。$r<d$ 时该子空间 Lebesgue 测度为零，$P_X$ 奇异，没有密度。（书中 §1.2 · Thm 1.3 · p.5–6）" },
  { id: "sc-r4-9", ch: 1, cat: "Thm 1.3 高斯密度", q: "$X$ 是 $d$ 维中心化高斯向量且 $\\Gamma_X$ 可逆，密度为 $c\\,\\exp(-\\frac12\\langle x,\\Gamma_X^{-1}x\\rangle)$。常数 $c=$", opts: ["$(2\\pi)^{-d/2}(\\det\\Gamma_X)^{-1/2}$", "$(2\\pi)^{-d/2}(\\det\\Gamma_X)^{-1}$", "$(2\\pi)^{-1/2}(\\det\\Gamma_X)^{-d/2}$", "$(2\\pi)^{-d}(\\det\\Gamma_X)^{-1/2}$"], a: 0, hint: "在特征基下 $X$ 的坐标是独立的 $\\mathcal N(0,\\lambda_j)$，把 $d$ 个一维密度乘起来。",
    exp: "独立坐标的密度之积给出 $(2\\pi)^{-d/2}(\\lambda_1\\cdots\\lambda_d)^{-1/2}$，而 $\\lambda_1\\cdots\\lambda_d=\\det\\Gamma_X$。$d=1$ 时退化为 $1/\\sqrt{2\\pi\\sigma^2}$，可用来排除其余选项。（书中 §1.2 · Thm 1.3 · p.5）" },
  { id: "sc-r4-10", ch: 1, cat: "Cor 1.10 高斯条件分布", q: "$(X,Y)$ 是中心化高斯向量，$\\operatorname{var}X=1$，$\\operatorname{var}Y=2$，$\\operatorname{cov}(X,Y)=1$。给定 $X$ 时 $Y$ 的条件分布是：", opts: ["$\\mathcal N(X,1)$", "$\\mathcal N(X,2)$", "$\\mathcal N(X/2,1)$", "$\\mathcal N(0,2)$"], a: 0, hint: "条件期望是到 $\\operatorname{span}(X)$ 的正交投影；残差的方差是多少？",
    exp: "$p_K(Y)=\\frac{\\operatorname{cov}(X,Y)}{\\operatorname{var}X}X=X$，残差方差 $\\sigma^2=E[(Y-X)^2]=2-2+1=1$。由 Cor 1.10(ii)，条件分布为 $\\mathcal N(p_K(Y),\\sigma^2)=\\mathcal N(X,1)$。（书中 §1.3 · Cor 1.10 · p.9）" },
  { id: "sc-r4-11", ch: 1, cat: "Cor 1.10 线性回归", q: "$(X_1,X_2,X_3)$ 是中心化高斯向量。在所有可测 $f$ 中，使 $E[(X_3-f(X_1,X_2))^2]$ 最小的 $f(X_1,X_2)$：", opts: ["是 $\\lambda_1X_1+\\lambda_2X_2$，残差与 $X_1,X_2$ 正交", "一般需要包含 $X_1X_2$ 等二次项", "恒等于 $E[X_3]=0$", "是 $X_3$ 到 $\\operatorname{span}(X_1)$ 的投影"], a: 0, hint: "$E[X_3\\mid X_1,X_2]$ 在高斯空间里是哪一个投影？",
    exp: "最优 $L^2$ 逼近是 $E[X_3\\mid\\sigma(X_1,X_2)]$，而 Cor 1.10(i) 说它就是到 $K=\\operatorname{span}(X_1,X_2)$ 的正交投影，所以是线性的，系数由残差与 $X_1,X_2$ 正交确定。这是高斯情形特有的。（书中 §1.3 · Cor 1.10 注记 (c) · p.9）" },
  { id: "sc-r4-12", ch: 1, cat: "§1.3 协方差函数", q: "下列 $\\mathbb R_+\\times\\mathbb R_+$ 上的函数中，哪个**不是**某个中心化高斯过程的协方差函数？", opts: ["$\\Gamma(s,t)=|t-s|$", "$\\Gamma(s,t)=s\\wedge t$", "$\\Gamma(s,t)=e^{-|t-s|}$", "$\\Gamma(s,t)=\\cos(t-s)$"], a: 0, hint: "协方差函数必须对称且为正型；试试只在两个点上取值的 $c$。",
    exp: "取 $c(s)=1,c(t)=-1$，得 $\\sum c(s)c(t)\\Gamma=-2|t-s|<0$，不是正型（对角线为 $0$ 却有非零非对角元）。其余三个分别是布朗运动、OU 过程和谱测度为 $\\frac12(\\delta_1+\\delta_{-1})$ 的平稳过程的协方差。（书中 §1.3 · Thm 1.11 · p.10–11）" },
  { id: "sc-r4-13", ch: 1, cat: "§1.3 平稳高斯过程", q: "取 $\\mathbb R$ 上对称有限测度 $\\mu=\\frac12(\\delta_1+\\delta_{-1})$，令 $\\Gamma(s,t)=\\int e^{i\\xi(t-s)}\\mu(d\\xi)$。则 $\\Gamma(s,t)=$", opts: ["$\\cos(t-s)$", "$e^{i(t-s)}$", "$\\sin(t-s)$", "$e^{-|t-s|}$"], a: 0, hint: "直接对两个原子求和。",
    exp: "$\\Gamma=\\frac12(e^{i(t-s)}+e^{-i(t-s)})=\\cos(t-s)$。$\\mu$ 的对称性保证 $\\Gamma$ 是实的，且 $\\Gamma$ 只依赖于 $t-s$，相应的高斯过程是（强）平稳的；$\\mu$ 称为谱测度。（书中 §1.3 · Thm 1.11 后例子 · p.11）" },
  { id: "sc-r4-14", ch: 1, cat: "Def 1.12 高斯白噪声", q: "$G$ 是 $\\mathbb R_+$ 上强度为 Lebesgue 测度的高斯白噪声。$\\operatorname{cov}(G([0,2]),G([1,3]))=$", opts: ["$1$", "$0$", "$2$", "$3$"], a: 0, hint: "$G$ 是从 $L^2(\\mathbb R_+,dt)$ 出发的等距映射，保持内积。",
    exp: "$E[G(f)G(g)]=\\int fg\\,d\\mu$，所以协方差是 $\\int\\mathbf 1_{[0,2]}\\mathbf 1_{[1,3]}\\,dt=|[1,2]|=1$。只有不相交的集合才给出 $0$（从而独立）。（书中 §1.4 · Def 1.12 · p.11–12）" },
  { id: "sc-r4-15", ch: 1, cat: "§1.4 白噪声的性质", q: "$G$ 是 $(E,\\mathcal E)$ 上强度为 $\\mu$ 的高斯白噪声，下面出现的集合都满足 $\\mu(\\cdot)<\\infty$。下列哪项**不**成立？", opts: ["对每个 $\\omega$，$A\\mapsto G(A)(\\omega)$ 是符号测度", "$G(A)\\sim\\mathcal N(0,\\mu(A))$", "不相交的 $A_1,\\dots,A_n$ 给出独立的 $G(A_j)$", "$A=\\bigsqcup_j A_j$ 时 $G(A)=\\sum_j G(A_j)$ 于 $L^2$"], a: 0, hint: "可数可加性是在什么意义下成立的？例外集依赖于什么？",
    exp: "$G(A)=\\sum G(A_j)$ 只在 $L^2$（以及对固定的分解 a.s.）意义下成立，例外零集依赖于分解，书中指出固定 $\\omega$ 时 $A\\mapsto G(A)(\\omega)$ 一般不是测度。其余三条分别来自等距性和 Prop 1.2。（书中 §1.4 · p.12）" },
  { id: "sc-r4-16", ch: 1, cat: "Prop 1.14 白噪声的二次和", q: "$A=A_1\\sqcup\\dots\\sqcup A_k$，$\\mu(A)<\\infty$。$E\\big[(\\sum_j G(A_j)^2-\\mu(A))^2\\big]=$", opts: ["$2\\sum_j\\mu(A_j)^2$", "$\\sum_j\\mu(A_j)^2$", "$3\\sum_j\\mu(A_j)^2$", "$2\\mu(A)^2$"], a: 0, hint: "$G(A_j)$ 独立，且 $E[G(A_j)^2]=\\mu(A_j)$；对 $\\mathcal N(0,\\sigma^2)$ 求 $\\operatorname{var}(X^2)$。",
    exp: "均值为 $\\mu(A)$，独立性使方差相加；$\\operatorname{var}(X^2)=3\\sigma^4-\\sigma^4=2\\sigma^4$。由于 $\\sum\\mu(A_j)^2\\le\\sup_j\\mu(A_j)\\cdot\\mu(A)$，网格趋于 $0$ 时二次和 $L^2$ 收敛到 $\\mu(A)$。（书中 §1.4 · Prop 1.14 · p.13–14）" },
  { id: "sc-r4-17", ch: 2, cat: "§2.1 Wiener 积分", q: "设 $B$ 是 pre-Brownian motion，$G$ 为其白噪声。Wiener 积分 $\\int_0^1 s\\,dB_s=G(s\\mathbf 1_{[0,1]}(s))$ 的分布是：", opts: ["$N(0,1/3)$", "$N(0,1/2)$", "$N(0,1)$", "$N(1/2,1/3)$"], a: 0, hint: "白噪声是从 $L^2(\\mathbb R_+,dt)$ 到高斯空间的等距映射，均值是多少、方差等于哪个 $L^2$ 范数？",
    exp: "$G(f)=\\int_0^\\infty f(s)dB_s\\sim N(0,\\int f^2ds)$，这里 $\\int_0^1 s^2ds=1/3$。白噪声取值于中心化高斯空间，所以均值为 0，不是 $\\int_0^1 s\\,ds$。（书中 §2.1 · p.22）" },
  { id: "sc-r4-18", ch: 2, cat: "§2.1 不变性质", q: "设 $B$ 是布朗运动，$s>0$、$\\lambda>0$ 固定。下列哪个过程**不是**（从 0 出发的）布朗运动？", opts: ["$(B_{s+t})_{t\\ge0}$", "$(-B_t)_{t\\ge0}$", "$(B_{s+t}-B_s)_{t\\ge0}$", "$(\\lambda^{-1}B_{\\lambda^2t})_{t\\ge0}$"], a: 0, hint: "逐个检查初值和增量的分布。",
    exp: "$B_{s+t}$ 在 $t=0$ 处等于 $B_s\\sim N(0,s)$，不从 0 出发。其余三个分别是对称性、简单马氏性和尺度不变性（命题 2.5），对连续路径的布朗运动同样成立。（书中 §2.1 · Prop 2.5 · p.22）" },
  { id: "sc-r4-19", ch: 2, cat: "Exercise 2.25 时间反演", q: "令 $W_0=0$，$W_t=tB_{1/t}$（$t>0$），则 $W$ 是布朗运动。由此可以推出（$t\\to\\infty$）：", opts: ["$B_t/t\\to0$ 几乎必然", "$B_t/\\sqrt t\\to0$ 几乎必然", "$B_t/t\\to0$ 依概率，但不几乎必然", "$B_t/\\sqrt t$ 几乎必然有界"], a: 0, hint: "把 $B_t/t$ 写成 $W$ 在某个趋于 0 的时刻的值。",
    exp: "$B_t/t=W_{1/t}$，而 $W$ 在 0 处连续且 $W_0=0$，故 $B_t/t\\to0$ a.s.。$B_t/\\sqrt t\\sim N(0,1)$ 不会趋于 0；由重对数律，它也不是几乎必然有界的。（书中 Exercises · Exercise 2.25 · p.38）" },
  { id: "sc-r4-20", ch: 2, cat: "§2.2 Wiener 测度", q: "Wiener 测度 $W$ 定义为某个布朗运动 $B$ 在 $C(\\mathbb R_+,\\mathbb R)$ 上的像测度。它与 $B$ 的选取无关，关键原因是：", opts: ["柱集构成生成 $\\mathcal C$ 的 π-系，且其测度由有限维分布决定", "$C(\\mathbb R_+,\\mathbb R)$ 是可分完备度量空间", "所有布朗运动都定义在同一概率空间上", "布朗运动的路径在任意区间上都是无限变差的"], a: 0, hint: "一个概率测度由它在哪类集合上的取值唯一决定？用单调类引理。",
    exp: "柱集 $\\{w(t_0)\\in A_0,\\dots,w(t_n)\\in A_n\\}$ 对有限交封闭且生成 $\\mathcal C$，它们的 $W$-测度由推论 2.4 的密度公式给出，与 $B$ 无关；由单调类引理即得 $W$ 唯一。（书中 §2.2 · p.28）" },
  { id: "sc-r4-21", ch: 2, cat: "Thm 2.9 证明细节", q: "在 Kolmogorov 引理的证明中，要求取值空间 $(E,d)$ **完备**，主要用于哪一步？", opts: ["把二进有理点集 $D$ 上的 Hölder 映射延拓到整个区间", "对 $\\sum_n P(\\cdots)<\\infty$ 应用 Borel–Cantelli 引理", "用 Markov 不等式控制 $P(d(X_s,X_t)\\ge a)$", "证明 $X_s\\to X_t$ 依概率收敛"], a: 0, hint: "证明先在可数集上得到一致连续的路径，接下来需要做什么？",
    exp: "在 $D$ 上路径一致连续（Lemma 2.10），完备性保证它有唯一的连续延拓，从而定义 $\\tilde X_t=\\lim_{s\\to t,s\\in D}X_s$。Borel–Cantelli 和 Markov 不等式只涉及概率估计，与 $E$ 是否完备无关。（书中 §2.2 · Thm 2.9 · p.25）" },
  { id: "sc-r4-22", ch: 2, cat: "§2.3 样本路径性质", q: "设 $B$ 是布朗运动。下列哪一项（几乎必然）**不**成立？", opts: ["存在 $\\varepsilon>0$，使得 $B_s\\ge0$ 对所有 $s\\in[0,\\varepsilon]$", "对每个 $\\varepsilon>0$，$B$ 在 $(0,\\varepsilon]$ 中有零点", "对所有 $a\\in\\mathbb R$，$T_a<\\infty$", "$\\limsup_{t\\to\\infty}B_t=+\\infty$"], a: 0, hint: "Blumenthal 0-1 律给出：a.s. 对每个 $\\varepsilon>0$，$\\sup_{[0,\\varepsilon]}B$ 和 $\\inf_{[0,\\varepsilon]}B$ 的符号是什么？",
    exp: "命题 2.14(i)：a.s. 对每个 $\\varepsilon>0$，$\\inf_{s\\le\\varepsilon}B_s<0<\\sup_{s\\le\\varepsilon}B_s$，所以第一项不成立，且由介值定理 $B$ 在 $(0,\\varepsilon]$ 中有零点。命题 2.14(ii) 给出后两项。（书中 §2.3 · Prop 2.14 · p.30）" },
  { id: "sc-r4-23", ch: 2, cat: "Exercise 2.29", q: "利用 0-1 律可以证明：几乎必然，$\\limsup_{t\\downarrow0}B_t/\\sqrt t$ 等于多少？", opts: ["$+\\infty$", "$1$", "$\\sqrt2$", "$0$"], a: 0, hint: "事件 $\\{\\limsup_{t\\downarrow0}B_t/\\sqrt t>M\\}$ 属于 $\\mathcal F_{0+}$；它的概率至少是 $P(B_1>M)$ 吗？",
    exp: "对每个 $M$，$P(\\limsup_{t\\downarrow0} B_t/\\sqrt t\\ge M)\\ge\\limsup_{t\\downarrow 0} P(B_t> M\\sqrt t)=P(B_1>M)>0$，由 Blumenthal 0-1 律该概率为 1，故上极限为 $+\\infty$。由此 $B$ 在每个固定时刻 a.s. 没有右导数。（书中 Exercises · Exercise 2.29 · p.39）" },
  { id: "sc-r4-24", ch: 2, cat: "Cor 2.15 的证明", q: "推论 2.15 的证明先得到：a.s. 对所有**有理** $q\\ge0$ 和所有 $\\varepsilon>0$，$\\sup_{[q,q+\\varepsilon]}B>B_q$。若把“有理 $q$”换成“所有实数 $q\\ge0$”，则：", opts: ["不成立，在 $B$ 于 $[0,2]$ 上的最大值点处失效", "仍成立，由路径连续性从有理点推到实数点", "仍成立，由强马氏性在每个时刻重新开始", "仍成立，因为每个 $q$ 处的例外集都是零测集"], a: 0, hint: "不可数个零测集的并未必是零测集。想一想有没有某个（随机）时刻，紧接着它路径不会再升高。",
    exp: "若 $q$ 是 $B$ 在 $[0,2]$ 上的最大值点（a.s. 落在 $(0,2)$ 内），则对小的 $\\varepsilon$ 有 $\\sup_{[q,q+\\varepsilon]}B=B_q$。每个固定 $q$ 处的结论 a.s. 成立，但不可数个例外集的并可以不是零测集；该最大值点也不是停时，不能用强马氏性。（书中 §2.3 · Cor 2.15 · p.32）" },
  { id: "sc-r4-25", ch: 2, cat: "§2.4 停时", q: "设 $B$ 是布朗运动，$\\mathcal F_t=\\sigma(B_s,s\\le t)$。下列哪个随机时间**不是**停时？", opts: ["$\\sup\\{s\\le1:B_s=0\\}$", "$T_a=\\inf\\{t\\ge0:B_t=a\\}$", "$T+1$，其中 $T$ 是停时", "常数 $2$"], a: 0, hint: "判断 $\\{T\\le t\\}$ 是否只依赖 $[0,t]$ 上的路径。",
    exp: "$\\{T_a\\le t\\}=\\{\\inf_{s\\le t}|B_s-a|=0\\}\\in\\mathcal F_t$；$T+1$ 与常数显然是停时。最后零点 $\\sup\\{s\\le1:B_s=0\\}$ 要看到时刻 1 之前的整条路径才能确定，书中用强马氏性和命题 2.14 说明它不是停时。（书中 §2.4 · Def 2.18 · p.33）" },
  { id: "sc-r4-26", ch: 2, cat: "Exercise 2.26", q: "设 $0\\le a\\le b$，$T_c=\\inf\\{t:B_t=c\\}$。关于 $T_b-T_a$，下列哪项正确？", opts: ["与 $T_{b-a}$ 同分布，且独立于 $\\sigma(T_c,c\\le a)$", "与 $(b-a)T_1$ 同分布", "与 $T_{b-a}$ 同分布，但与 $T_a$ 不独立", "与 $T_{b^2-a^2}$ 同分布"], a: 0, hint: "在停时 $T_a$ 处应用强马氏性：$B_{T_a+t}-a$ 首次到达 $b-a$ 的时刻是什么？",
    exp: "由强马氏性，$B^{(T_a)}$ 是独立于 $\\mathcal F_{T_a}$ 的布朗运动，$T_b-T_a$ 恰是它首次到达 $b-a$ 的时刻，且 $T_c$（$c\\le a$）都是 $\\mathcal F_{T_a}$-可测的。由尺度不变性 $T_{b-a}\\overset{d}{=}(b-a)^2T_1$，不是 $(b-a)T_1$。（书中 Exercises · Exercise 2.26 · p.38）" },
  { id: "sc-r4-27", ch: 2, cat: "Exercise 2.32", q: "记 $S_t=\\sup_{s\\le t}B_s$。$S_t-B_t$ 与下列哪个随机变量同分布？", opts: ["$|B_t|$", "$B_t$", "$2S_t-B_t$", "$\\sqrt2\\,|B_t|$"], a: 0, hint: "对固定 $t$，令 $B'_u=B_t-B_{t-u}$（$u\\le t$），它仍是布朗运动。",
    exp: "$S_t-B_t=\\sup_{u\\le t}(B_{t-u}-B_t)=\\sup_{u\\le t}(-B'_u)$，而 $-B'$ 是布朗运动，所以它与 $S_t$ 同分布，从而与 $|B_t|$ 同分布（定理 2.21）。$B_t$ 可取负值；$2S_t-B_t$ 与 $\\sqrt2|B_t|$ 的期望都比 $E|B_t|$ 大。（书中 Exercises · Exercise 2.32 · p.39）" },
  { id: "sc-r4-28", ch: 2, cat: "Def 2.24 多维布朗运动", q: "设 $(B^1,B^2)$ 是从 0 出发的二维布朗运动。下列哪个过程是（一维）布朗运动？", opts: ["$(B^1_t+B^2_t)/\\sqrt2$", "$B^1_t+B^2_t$", "$(B^1_t+B^2_t)/2$", "$B^1_tB^2_t$"], a: 0, hint: "分量独立；算一下时刻 $t$ 的方差。",
    exp: "分量独立时 $(B^1+B^2)/\\sqrt2$ 是连续的中心高斯过程，协方差为 $\\tfrac12(s\\wedge t+s\\wedge t)=s\\wedge t$；它也是 $\\mathbb R^2$ 上正交变换后的一个分量。$B^1+B^2$ 方差为 $2t$，除以 2 后方差为 $t/2$，乘积 $B^1_tB^2_t$ 不是高斯的。（书中 §2.4 · Def 2.24 · p.37–38）" },
  { id: "sc-r4-29", ch: 3, cat: "Thm 3.7 $X_T$ 的可测性", q: "设 $T$ 是停时。对过程 $X$ 加下列哪个条件，就能保证 $\\omega\\mapsto X_{T(\\omega)}(\\omega)$（定义在 $\\{T<\\infty\\}$ 上）是 $\\mathcal F_T$-可测的？", opts: ["$X$ 是循序可测（progressive）的", "$X$ 适应即可，无需其他条件", "$X$ 关于 $\\mathcal F\\otimes\\mathcal B(\\mathbb R_+)$ 联合可测", "$X$ 路径连续即可，不必适应"], a: 0, hint: "把 $X_T$ 限制在 $\\{T\\le t\\}$ 上，写成 $\\omega\\mapsto(\\omega,T\\wedge t)$ 与 $(\\omega,s)\\mapsto X_s(\\omega)$ 的复合。",
    exp: "复合的第二个映射需要在 $\\Omega\\times[0,t]$ 上关于 $\\mathcal F_t\\otimes\\mathcal B([0,t])$ 可测，这正是循序可测的定义。仅适应或仅联合可测一般不够；不适应时取 $T=0$ 就可能使 $X_0$ 不是 $\\mathcal F_0$-可测。（书中 §3.2 · Thm 3.7 · p.48）" },
  { id: "sc-r4-30", ch: 3, cat: "Prop 3.8 由 $T$ 构造停时", q: "设 $T$ 是停时，$S$ 是取值于 $[0,\\infty]$ 的 $\\mathcal F_T$-可测随机变量。再加上下列哪个条件，就能保证 $S$ 是停时？", opts: ["$S\\ge T$", "$S\\le T$", "$S$ 有界", "$S\\le T+1$"], a: 0, hint: "试写 $\\{S\\le t\\}=\\{S\\le t\\}\\cap\\{T\\le t\\}$，什么条件下这个等式成立？",
    exp: "若 $S\\ge T$，则 $\\{S\\le t\\}=\\{S\\le t\\}\\cap\\{T\\le t\\}$，又 $\\{S\\le t\\}\\in\\mathcal F_T$，由 $\\mathcal F_T$ 的定义它属于 $\\mathcal F_t$。$(T-1)^+$（及其截断 $(T-1)^+\\wedge 1$）是 $T$ 的函数，满足其余三个条件，却一般不是停时。（书中 §3.2 · Prop 3.8 · p.48）" },
  { id: "sc-r4-31", ch: 3, cat: "Prop 3.9 首达时", q: "设 $X$ 适应、路径右连续，取值于度量空间，$O$ 是开集，$T_O=\\inf\\{t\\ge0: X_t\\in O\\}$。Prop 3.9 能保证：", opts: ["$T_O$ 是 $(\\mathcal F_{t+})$-停时", "$T_O$ 是 $(\\mathcal F_t)$-停时", "$T_O<\\infty$ a.s.", "在 $\\{T_O<\\infty\\}$ 上 $X_{T_O}\\in O$"], a: 0, hint: "利用路径右连续和 $O$ 是开集，把 $\\{T_O<t\\}$ 写成可数个事件的并；$\\{T_O\\le t\\}$ 能否同样处理？",
    exp: "由右连续性与 $O$ 开，$\\{T_O<t\\}=\\bigcup_{s\\in[0,t)\\cap\\mathbb Q}\\{X_s\\in O\\}\\in\\mathcal F_t$，由 Prop 3.6 得 $(\\mathcal F_{t+})$-停时。要得到 $(\\mathcal F_t)$-停时，书中需要连续路径和闭集；首达时刻 $X_{T_O}$ 可能落在 $O$ 的边界上（如布朗运动首次进入 $(a,\\infty)$ 时 $B_T=a$）。（书中 §3.2 · Prop 3.9 · p.48–49）" },
  { id: "sc-r4-32", ch: 3, cat: "Prop 3.12 凸函数与下鞅", q: "设 $X$ 是下鞅，且下列各过程都可积。哪个过程**必定**是下鞅？", opts: ["$X_t^+=X_t\\vee 0$", "$|X_t|$", "$X_t^2$", "$-X_t$"], a: 0, hint: "Jensen 不等式给出 $E[f(X_t)\\mid\\mathcal F_s]\\ge f(E[X_t\\mid\\mathcal F_s])$，下一步要比较 $f(E[X_t\\mid\\mathcal F_s])$ 与 $f(X_s)$。",
    exp: "对下鞅，$E[X_t\\mid\\mathcal F_s]\\ge X_s$，只有当凸函数 $f$ 还单调不减时才能推出 $f(E[X_t\\mid\\mathcal F_s])\\ge f(X_s)$；$x\\mapsto x^+$ 满足这一点。反例：确定性的 $X_t=t-2$ 是下鞅，但 $|X_t|$、$X_t^2$ 在 $[0,2]$ 上递减，$-X_t$ 是上鞅。（书中 §3.3 · Prop 3.12 · p.51）" },
  { id: "sc-r4-33", ch: 3, cat: "Prop 3.13 $L^1$ 有界性", q: "设 $X$ 是下鞅，$t>0$。证明 $\\sup_{0\\le s\\le t}E|X_s|<\\infty$ 时得到的上界是：", opts: ["$2E[X_t^+]-E[X_0]$", "$E[X_t^+]-E[X_0]$", "$2E[X_t^+]+E[X_0]$", "$E|X_t|$"], a: 0, hint: "$|x|=2x^+-x$；$X^+$ 是下鞅，且 $E[X_s]$ 随 $s$ 单调。",
    exp: "$X^+$ 是下鞅，故 $E[X_s^+]\\le E[X_t^+]$；又 $E[X_s]\\ge E[X_0]$，代入 $|x|=2x^+-x$ 即得上界。若 $X\\equiv1$，则 $E[X_t^+]-E[X_0]=0<1$；若 $X_t=t-2$，则 $E|X_0|=2>E|X_1|$，$2E[X_1^+]+E[X_0]=-2$，所以其余三个都不是上界。（书中 §3.3 · Prop 3.13 · p.52）" },
  { id: "sc-r4-34", ch: 3, cat: "Prop 3.14 平方可积鞅的增量", q: "设 $M$ 是平方可积鞅，$s=t_0<t_1<\\dots<t_p=t$。则 $E\\big[\\sum_{i=1}^p (M_{t_i}-M_{t_{i-1}})^2\\,\\big|\\,\\mathcal F_s\\big]$ 等于：", opts: ["$E[M_t^2\\mid\\mathcal F_s]-M_s^2$", "$E[M_t^2\\mid\\mathcal F_s]+M_s^2$", "$p\\,E[(M_t-M_s)^2\\mid\\mathcal F_s]$", "$M_t^2-M_s^2$"], a: 0, hint: "先对每一项在 $\\mathcal F_{t_{i-1}}$ 上取条件期望，交叉项会怎样？",
    exp: "$E[(M_{t_i}-M_{t_{i-1}})^2\\mid\\mathcal F_{t_{i-1}}]=E[M_{t_i}^2\\mid\\mathcal F_{t_{i-1}}]-M_{t_{i-1}}^2$，再对 $\\mathcal F_s$ 取条件期望并求和，各项相消，结果与分点无关，也等于 $E[(M_t-M_s)^2\\mid\\mathcal F_s]$。$M_t^2-M_s^2$ 一般不是 $\\mathcal F_s$-可测的。（书中 §3.3 · Prop 3.14 · p.52）" },
  { id: "sc-r4-35", ch: 3, cat: "上穿不等式", q: "设 $X$ 是上鞅，$D$ 可数稠密，$T\\in D$，$a<b$。Thm 3.17 证明中，上穿次数满足 $E[M^X_{ab}(D\\cap[0,T])]\\le$", opts: ["$\\frac{1}{b-a}E[(X_T-a)^-]$", "$\\frac{1}{b-a}E[(X_T-a)^+]$", "$\\frac{1}{b-a}E[(X_T-b)^+]$", "$\\frac{1}{b-a}E[(X_0-a)^-]$"], a: 0, hint: "先对有限集 $D_m\\subset D\\cap[0,T]$ 用离散时间的 Doob 上穿不等式，再令 $D_m$ 递增。",
    exp: "对有限集 $D_m$ 用离散上鞅的 Doob 上穿不等式，再由单调收敛令 $D_m\\uparrow D\\cap[0,T]$。反例：$a=0,b=1$，$X_0=0$，$X_1=\\pm1$ 各半，再令 $X_2=-1$；这是上鞅，上穿次数的期望为 $1/2$，但另外三个界都是 $0$。（书中 §3.3 · Thm 3.17 (proof) · p.56）" },
  { id: "sc-r4-36", ch: 3, cat: "Thm 3.17 右极限过程", q: "设 $X$ 是上鞅，$X_{t+}=\\lim_{s\\downarrow\\downarrow t,\\,s\\in D}X_s$。Thm 3.17(ii) 给出的 $X_t$ 与 $X_{t+}$ 的关系是：", opts: ["$X_t\\ge E[X_{t+}|\\mathcal F_t]$；$E[X_\\cdot]$ 右连续时取等", "$X_t\\le E[X_{t+}|\\mathcal F_t]$；$E[X_\\cdot]$ 右连续时取等", "总有 $X_t=E[X_{t+}|\\mathcal F_t]$", "$X_t\\ge E[X_{t+}|\\mathcal F_t]$；仅当路径右连续时取等"], a: 0, hint: "对 $t_n\\downarrow t$ 取 $X_t\\ge E[X_{t_n}\\mid\\mathcal F_t]$ 的极限，需要什么收敛？再比较两边的期望。",
    exp: "由后向上鞅收敛定理，$X_{t_n}\\to X_{t+}$ 在 $L^1$ 中成立，可在 $X_t\\ge E[X_{t_n}\\mid\\mathcal F_t]$ 中取极限；若 $E[X_t]=E[X_{t+}]$（即 $s\\mapsto E[X_s]$ 在 $t$ 右连续），不等式就被迫取等。鞅总是取等，并不需要路径右连续；确定性的非增、非右连续函数说明不能“总取等”。（书中 §3.3 · Thm 3.17 · p.55）" },
  { id: "sc-r4-37", ch: 3, cat: "Thm 3.18 càdlàg 修正", q: "$\\Omega=\\{-1,1\\}$ 等概率，$X_t=0$（$t\\le1$），$X_t=\\omega$（$t>1$）。$X$ 是自然滤子下的鞅，却没有右连续修正。这与 Thm 3.18 不矛盾，因为哪个假设不成立？", opts: ["滤子 $(\\mathcal F_t)$ 右连续", "滤子 $(\\mathcal F_t)$ 完备", "$t\\mapsto E[X_t]$ 右连续", "$X$ 是上鞅"], a: 0, hint: "比较 $\\mathcal F^X_1$ 与 $\\mathcal F^X_{1+}$。",
    exp: "这里 $\\mathcal F^X_1$ 是平凡的，而 $\\mathcal F^X_{1+}$ 已包含 $\\sigma(\\varepsilon)$，所以滤子不右连续。由于没有非空可略集，滤子是完备的；$E[X_t]\\equiv0$ 是连续的；$X$ 是鞅，自然也是上鞅。（书中 §3.3 · Thm 3.18 · Remark (i) · p.57–58）" },
  { id: "sc-r4-38", ch: 3, cat: "§3.4 可选停止的应用：退出时间", q: "$B$ 是从 0 出发的布朗运动，$a>0$，$U_a=\\inf\\{t\\ge0:|B_t|=a\\}$。则 $E[U_a]=$", opts: ["$a^2$", "$2a^2$", "$a^2/2$", "$+\\infty$"], a: 0, hint: "对鞅 $B_t^2-t$ 在 $t\\wedge U_a$ 处停止，然后令 $t\\to\\infty$。",
    exp: "$E[B_{t\\wedge U_a}^2]=E[t\\wedge U_a]$；左边由控制收敛（$B_{t\\wedge U_a}^2\\le a^2$）趋于 $a^2$，右边由单调收敛趋于 $E[U_a]$。注意单侧首达时 $T_a$ 满足 $E[T_a]=\\infty$，而双侧退出时间的期望有限。（书中 §3.4 · Applications (b) · p.62–63）" },
  { id: "sc-r4-39", ch: 3, cat: "§3.4 可选停止的应用：Laplace 变换", q: "$B$ 是从 0 出发的布朗运动，$a>0$，$T_a=\\inf\\{t\\ge0:B_t=a\\}$，$\\lambda>0$。则 $E[e^{-\\lambda T_a}]=$", opts: ["$e^{-a\\sqrt{2\\lambda}}$", "$e^{-a\\sqrt{\\lambda}}$", "$e^{-a\\sqrt{\\lambda/2}}$", "$1/\\cosh(a\\sqrt{2\\lambda})$"], a: 0, hint: "用指数鞅 $\\exp(\\theta B_t-\\theta^2t/2)$，$\\theta>0$，在 $T_a$ 处停止后它有界；最后令 $\\theta^2/2=\\lambda$。",
    exp: "$\\theta>0$ 时停止鞅不超过 $e^{\\theta a}$，因而一致可积，于是 $e^{\\theta a}E[e^{-\\theta^2T_a/2}]=1$；取 $\\theta=\\sqrt{2\\lambda}$ 即得。$1/\\cosh(a\\sqrt{2\\lambda})$ 是双侧退出时间 $U_a$ 的 Laplace 变换。若取 $\\theta<0$，停止鞅不一致可积，同样的推导会得出荒谬的结果。（书中 §3.4 · Applications (c) · p.63）" },
  { id: "sc-r4-40", ch: 3, cat: "Exercise 3.26 带漂移布朗运动的上确界", q: "$B$ 是从 0 出发的布朗运动，$\\mu>0$，$y>0$。则 $P\\big(\\sup_{t\\ge0}(B_t-\\mu t)>y\\big)=$", opts: ["$e^{-2\\mu y}$", "$e^{-\\mu y}$", "$e^{-\\mu y/2}$", "$e^{-\\mu^2 y/2}$"], a: 0, hint: "找 $\\theta$ 使 $\\exp(\\theta B_t-\\theta^2t/2)$ 恰好是 $B_t-\\mu t$ 的函数，再在首次到达 $y$ 的时刻停止。",
    exp: "取 $\\theta=2\\mu$，$M_t=e^{2\\mu(B_t-\\mu t)}$ 是正鞅，且 $M_t\\to0$ a.s.。在 $B_t-\\mu t$ 首次到达 $y$ 的时刻停止后 $M\\le e^{2\\mu y}$，由可选停止得 $1=e^{2\\mu y}P(\\text{到达 }y)$。因此上确界服从参数为 $2\\mu$ 的指数分布。（书中 Exercises · Ex 3.26 (3) · p.66）" },
  { id: "sc-r4-41", ch: 10, cat: "A1 单调类的定义", q: "按 Le Gall 附录 A1 的定义，下列哪条**不是**单调类 $\\mathcal M\\subset\\mathcal P(E)$ 必须满足的性质？", opts: ["对有限交封闭", "$E\\in\\mathcal M$", "$A,B\\in\\mathcal M,\\ A\\subset B\\Rightarrow B\\setminus A\\in\\mathcal M$", "对递增序列的并封闭"], a: 0, hint: "逐条回忆定义中的三条公理，并想想单调类与 σ-代数相差什么。",
    exp: "单调类的三条公理是：含 $E$、对真差 $B\\setminus A$（$A\\subset B$）封闭、对递增并封闭。对有限交封闭不是公理；加上它，单调类就成为 σ-代数。（书中 附录 A1 · 定义 · p.261）" },
  { id: "sc-r4-42", ch: 10, cat: "A1 单调类与 σ-代数", q: "单调类 $\\mathcal M$ 是 σ-代数的充要条件是：", opts: ["$\\mathcal M$ 对有限交封闭", "$\\mathcal M$ 含 $\\varnothing$", "$\\mathcal M$ 对可数递减交封闭", "无需条件，单调类总是 σ-代数"], a: 0, hint: "单调类自动具备哪些封闭性？再看还缺什么才能得到有限并。",
    exp: "单调类总含 $\\varnothing=E\\setminus E$、对补封闭，进而对递减交封闭，所以这两条不能刻画 σ-代数。有限交封闭时取补得有限并封闭，再用递增并得可数并；反之 σ-代数显然对交封闭。（书中 附录 A1 · 引理证明 · p.261–262）" },
  { id: "sc-r4-43", ch: 10, cat: "A1 单调类引理", q: "单调类引理断言 $\\mathcal M(\\mathcal C)=\\sigma(\\mathcal C)$。它对 $\\mathcal C\\subset\\mathcal P(E)$ 的假设是：", opts: ["$\\mathcal C$ 对有限交封闭", "$\\mathcal C$ 含 $E$", "$\\mathcal C$ 对取补封闭", "$\\mathcal C$ 是有限族"], a: 0, hint: "证明中定义 $\\mathcal M_A=\\{B: A\\cap B\\in\\mathcal M(\\mathcal C)\\}$，要验证 $\\mathcal C\\subset\\mathcal M_A$ 需要什么？",
    exp: "引理假设 $\\mathcal C$ 是 π-系统（对有限交封闭）。其余条件都不够：$E=\\{1,2,3,4\\}$，$\\mathcal C=\\{\\varnothing,E,\\{1,2\\},\\{3,4\\},\\{1,3\\},\\{2,4\\}\\}$ 有限、含 $E$、对补封闭，但它本身就是单调类而非 σ-代数。（书中 附录 A1 · 单调类引理 · p.261）" },
  { id: "sc-r4-44", ch: 10, cat: "A1 引理的反例", q: "$E=\\{1,2,3,4\\}$，$\\mathcal C=\\{\\{1,2\\},\\{1,3\\}\\}$。下列哪个集合属于 $\\sigma(\\mathcal C)$ 但**不**属于 $\\mathcal M(\\mathcal C)$？", opts: ["$\\{1\\}$", "$\\{3,4\\}$", "$\\{2,4\\}$", "$\\varnothing$"], a: 0, hint: "先验证 $\\{\\varnothing,E,\\{1,2\\},\\{3,4\\},\\{1,3\\},\\{2,4\\}\\}$ 是否已是单调类。",
    exp: "该六元族含 $E$，嵌套对的差与递增并都不出族，故它就是 $\\mathcal M(\\mathcal C)$。而 $\\{1\\}=\\{1,2\\}\\cap\\{1,3\\}\\in\\sigma(\\mathcal C)$。问题出在 $\\mathcal C$ 对交不封闭；$\\{3,4\\},\\{2,4\\},\\varnothing$ 都在 $\\mathcal M(\\mathcal C)$ 中。（书中 附录 A1 · 单调类引理 · p.261）" },
  { id: "sc-r4-45", ch: 10, cat: "A1 推论：测度的唯一性", q: "$E=\\{1,2,3,4\\}$，概率测度 $\\mu,\\nu$ 在 $\\{1,2\\}$ 与 $\\{1,3\\}$ 上取值相同。则：", opts: ["$\\mu,\\nu$ 未必相等", "$\\mu=\\nu$，因为这两个集合生成全幂集", "$\\mu,\\nu$ 至少在 $\\{1\\}$ 上相等", "$\\mu=\\nu$，因为它们在 $E$ 上也相等"], a: 0, hint: "唯一性推论要求生成类具有什么性质？试构造一个具体的 $\\nu$。",
    exp: "推论 1 需要 $\\mathcal C$ 对有限交封闭。反例：$\\mu$ 为均匀分布，$\\nu=\\frac12(\\delta_2+\\delta_3)$，两者在 $\\{1,2\\},\\{1,3\\}$ 上都是 $\\frac12$，但 $\\mu(\\{1\\})=\\frac14\\neq0=\\nu(\\{1\\})$。（书中 附录 A1 · 推论 1 · p.262）" },
  { id: "sc-r4-46", ch: 10, cat: "A1 推论：独立性的验证", q: "要证 $\\sigma(X_i,i\\in I)$ 与 σ-代数 $\\mathcal G$ 独立，按附录 A1，只需验证：", opts: ["每个有限子族 $(X_{i_1},\\dots,X_{i_p})$ 与 $\\mathcal G$ 独立", "每个 $X_i$ 单独与 $\\mathcal G$ 独立", "对每对 $i\\neq j$，$X_i$ 与 $X_j$ 独立", "$\\sum_i X_i$ 与 $\\mathcal G$ 独立"], a: 0, hint: "哪一类事件对有限交封闭且生成 $\\sigma(X_i,i\\in I)$？",
    exp: "只依赖于有限个 $X_i$ 的事件构成 π-系统并生成 $\\sigma(X_i,i\\in I)$，由单调类引理即可推广。逐个独立不够：$X_1,X_2$ 为独立对称 $\\pm1$ 变量、$\\mathcal G=\\sigma(X_1X_2)$ 时，每个 $X_i$ 与 $\\mathcal G$ 独立，但 $(X_1,X_2)$ 不是。（书中 附录 A1 · 推论 2 · p.262）" },
  { id: "sc-r4-47", ch: 11, cat: "A2 极大不等式", q: "设 $(Y_n)$ 是离散时间上鞅，$\\lambda>0$，$k\\in\\mathbb N$。$\\lambda\\,P(\\sup_{n\\le k}|Y_n|>\\lambda)$ 不超过：", opts: ["$E|Y_0|+2E|Y_k|$", "$E|Y_k|$", "$2E|Y_k|$", "$E|Y_0|$"], a: 0, hint: "上鞅可以先大后小：想一想 $Y_0=1,Y_1=0$ 这样的确定性上鞅。",
    exp: "上鞅的极大不等式右端是 $E|Y_0|+2E|Y_k|$。取确定性上鞅 $Y_0=1,Y_1=0$、$\\lambda=\\tfrac12$：左端为 $\\tfrac12$，而 $E|Y_1|=0$，排除只含 $E|Y_k|$ 的两个选项；取 $Y_0=0,Y_1=-1$ 则排除 $E|Y_0|$。（书中 App. A2 · 极大不等式 · p.263）" },
  { id: "sc-r4-48", ch: 11, cat: "A2 Doob $L^p$ 不等式", q: "设 $(Y_n)$ 是鞅。把附录 A2 中 Doob 的 $L^p$ 不等式取 $p=2$，写成 $E[\\sup_{n\\le k}Y_n^2]\\le c\\,E[Y_k^2]$，其中的常数 $c$ 是：", opts: ["$4$", "$2$", "$1$", "$\\sqrt2$"], a: 0, hint: "回忆证明：对 $\\lambda P(\\sup_{n\\le k}|Y_n|\\ge\\lambda)\\le E[|Y_k|\\mathbf 1\\{\\sup_{n\\le k}|Y_n|\\ge\\lambda\\}]$ 关于 $2\\lambda\\,d\\lambda$ 积分，再用 Cauchy–Schwarz。",
    exp: "附录中的常数是 $(p/(p-1))^p$，$p=2$ 时为 $4$；等价地 $\\|\\sup_{n\\le k}|Y_n|\\|_2\\le2\\|Y_k\\|_2$，把范数形式的 $2$ 当成平方形式的常数就会误选 $2$。$c=1$ 显然不对：$Y_0=1$，$Y_1=1\\pm1$（各概率 $\\tfrac12$）时左端为 $2.5$，右端为 $2$。（书中 App. A2 · Doob 不等式 · p.264）" },
  { id: "sc-r4-49", ch: 11, cat: "A2 上穿次数", q: "数列 $y=(y_0,\\dots,y_5)=(0,3,1,3,0,3)$，$a=1$，$b=2$。上穿次数 $M^y_{ab}(5)$ 等于：", opts: ["$3$", "$2$", "$1$", "$5$"], a: 0, hint: "定义要求 $y_{m_i}\\le a$、$y_{n_i}\\ge b$，且 $m_1<n_1<m_2<\\cdots$；注意是“$\\le$”。",
    exp: "取 $(m_1,n_1,m_2,n_2,m_3,n_3)=(0,1,2,3,4,5)$：$y_0=0\\le1$，$y_2=1\\le1$，$y_4=0\\le1$，而 $y_1=y_3=y_5=3\\ge2$，共 3 次；只有 6 个下标，不能更多。把 $y_2=1$ 误当成不满足 $\\le a$ 会得到 2。（书中 App. A2 · 上穿次数 · p.264）" },
  { id: "sc-r4-50", ch: 11, cat: "A2 Doob 上穿不等式", q: "设 $(Y_n)$ 是上鞅，$a<b$。Doob 上穿不等式断言 $E[M^Y_{ab}(n)]$ 不超过：", opts: ["$\\frac{1}{b-a}E[(Y_n-a)^-]$", "$\\frac{1}{b-a}E[(Y_0-a)^-]$", "$(b-a)\\,E[(Y_n-a)^-]$", "$\\frac{1}{b-a}E[(Y_n-b)^+]$"], a: 0, hint: "把 $Y,a,b$ 同乘常数 $c>0$，上穿次数不变；右端应如何变化？另外，上鞅在上穿之后可以跌得很深。",
    exp: "右端是 $E[(Y_n-a)^-]/(b-a)$，在同时伸缩 $Y,a,b$ 时不变；$(b-a)E[\\cdot]$ 会按 $c^2$ 伸缩，所以不对。取 $Y_0=0$，$Y_1\\in\\{1,-3\\}$ 各以概率 $\\tfrac12$，$Y_2=0$（$Y_1=1$ 时）或 $-3$（$Y_1=-3$ 时），$a=0,b=1$：$E[M(2)]=\\tfrac12$，但 $E[(Y_0-a)^-]$ 与 $E[(Y_n-b)^+]$ 都是 $0$。（书中 App. A2 · 上穿不等式 · p.264）" },
  { id: "sc-r4-51", ch: 11, cat: "A2 上鞅收敛定理", q: "设 $(Y_n)$ 是在 $L^1$ 中有界的上鞅。下列哪一项**一定**成立？", opts: ["$Y_n$ 几乎必然收敛到某个 $Y_\\infty\\in L^1$", "$Y_n$ 在 $L^1$ 中收敛", "$E[Y_n]\\to E[Y_\\infty]$", "$(Y_n)$ 一致可积"], a: 0, hint: "考虑公平硬币下的 $Y_n=2^n\\mathbf 1\\{$前 $n$ 次都是正面$\\}$。",
    exp: "$L^1$ 有界的上鞅几乎必然收敛到可积极限。上面的例子是 $L^1$ 有界的鞅，$Y_n\\to0$ a.s.，但 $E[Y_n]=1$，所以没有 $L^1$ 收敛，也不一致可积。（书中 App. A2 · 上鞅收敛定理 · p.264）" },
  { id: "sc-r4-52", ch: 11, cat: "A2 上鞅收敛定理", q: "下列哪类离散时间过程**一定**几乎必然收敛（到有限极限）？", opts: ["非负上鞅", "任意鞅", "下有界的下鞅", "非正的上鞅"], a: 0, hint: "哪一类能自动推出 $\\sup_nE|Y_n|<\\infty$？",
    exp: "非负上鞅满足 $E|Y_n|=E[Y_n]\\le E[Y_0]$，在 $L^1$ 中有界，故 a.s. 收敛。简单随机游走是鞅但不收敛；$Y_n=n$ 是下有界的下鞅；$Y_n=-n$ 是非正上鞅，它们都发散。（书中 App. A2 · 上鞅收敛定理 · p.264）" },
  { id: "sc-r4-53", ch: 11, cat: "A2 一致可积鞅", q: "设 $Z\\in L^1(\\Omega,\\mathcal F,P)$，$Y_n=E[Z\\mid\\mathcal G_n]$。那么 $Y_n$ 几乎必然且 $L^1$ 收敛到：", opts: ["$E[Z\\mid\\mathcal G_\\infty]$", "$Z$", "$E[Z]$", "$E[Z\\mid\\mathcal G_0]$"], a: 0, hint: "$Z$ 只是 $\\mathcal F$-可测的，不一定能被 $\\bigvee_n\\mathcal G_n$ 所决定。",
    exp: "闭鞅一致可积，其极限为 $Y_\\infty=E[Z\\mid\\mathcal G_\\infty]$，$\\mathcal G_\\infty=\\bigvee_n\\mathcal G_n$。只有当 $Z$ 是 $\\mathcal G_\\infty$-可测时极限才等于 $Z$；$E[Z]$ 对应平凡的滤子。（书中 App. A2 · 一致可积鞅收敛定理 · p.264）" },
  { id: "sc-r4-54", ch: 11, cat: "A2 可选停时定理", q: "设 $Y$ 是从 0 出发的简单随机游走（鞅），$T=\\inf\\{n:Y_n=1\\}$。$T<\\infty$ a.s.，且 $E[Y_T]=1\\ne Y_0$。这与可选停时定理不矛盾，原因是：", opts: ["$(Y_n)$ 不一致可积，且 $T$ 无界", "$T$ 不是停时", "$P(T=\\infty)>0$", "可选停时定理只对上鞅成立"], a: 0, hint: "列出离散可选停时定理两个版本各自的假设。",
    exp: "一个版本要求鞅一致可积（$S,T$ 可以取 $\\infty$），另一个要求停时有界；这里两者都不满足。$\\{T=n\\}\\in\\mathcal G_n$，所以 $T$ 是停时；一维简单随机游走常返，$T<\\infty$ a.s.。（书中 App. A2 · 可选停时定理 · p.265）" },
  { id: "sc-r4-55", ch: 11, cat: "A2 可选停时定理", q: "设 $(Y_n)$ 是上鞅，$S\\le T$ 是**有界**停时。下列哪项一定成立？", opts: ["$E[Y_T]\\le E[Y_S]$", "$E[Y_T]\\ge E[Y_S]$", "$E[Y_T]=E[Y_S]$", "$Y_T\\le Y_S$ a.s."], a: 0, hint: "对 $Y_S\\ge E[Y_T\\mid\\mathcal G_S]$ 两边取期望。",
    exp: "有界情形的可选停时定理给出 $Y_S\\ge E[Y_T\\mid\\mathcal G_S]$，取期望得 $E[Y_T]\\le E[Y_S]$。等号只对鞅成立；逐点不等式 $Y_T\\le Y_S$ 一般不对（上鞅也会往上走）。（书中 App. A2 · 可选停时定理 · p.265）" },
  { id: "sc-r4-56", ch: 11, cat: "A2 反向上鞅", q: "设 $(Y_n)_{n\\in-\\mathbb N}$ 是反向上鞅，且在 $L^1$ 中有界。当 $n\\to-\\infty$ 时：", opts: ["$Y_n$ 几乎必然且在 $L^1$ 中收敛", "$Y_n$ 几乎必然收敛，但未必 $L^1$ 收敛", "$Y_n$ 仅在 $L^1$ 中收敛", "还需加上一致可积才能收敛"], a: 0, hint: "反向鞅情形 $Y_n=E[Y_0\\mid\\mathcal H_n]$，这类族有什么额外性质？",
    exp: "反向上鞅在 $L^1$ 有界时，$n\\to-\\infty$ 时 a.s. 且 $L^1$ 收敛。与正向情形不同，这里的 $L^1$ 收敛不需要额外假设，第 3 章正是用这一点得到 $L^1$ 收敛。（书中 App. A2 · 反向上鞅收敛定理 · p.265）" },
  { id: "sc-r5-1", ch: 4, cat: "Prop 4.2 全变差", q: "函数 $a(t)=\\sin t$ 在 $[0,2\\pi]$ 上的全变差 $\\int_0^{2\\pi}|da(s)|$ 等于多少？", opts: ["$4$", "$0$", "$2$", "$2\\pi$"], a: 0, hint: "全变差是划分上 $\\sum|a(t_i)-a(t_{i-1})|$ 的上确界；按单调区间切分即可。",
    exp: "$\\sin$ 在 $[0,\\pi/2]$ 升 1、在 $[\\pi/2,3\\pi/2]$ 降 2、在 $[3\\pi/2,2\\pi]$ 升 1，全变差为 $1+2+1=4$。$0$ 是 $a(2\\pi)$ 本身，不是全变差。（书中 §4.1.1 · Prop 4.2 · p.71）" },
  { id: "sc-r5-2", ch: 4, cat: "Lemma 4.3 Stieltjes 积分逼近", q: "取 $[0,1]$ 上网格趋于 0 的划分，$\\sum_i t_{i-1}\\,(t_i^2-t_{i-1}^2)$ 的极限是：", opts: ["$2/3$", "$1/2$", "$1/3$", "$1$"], a: 0, hint: "这是 $\\int_0^1 f(s)\\,da(s)$ 的左端点 Riemann–Stieltjes 和，$f(s)=s$，$a(s)=s^2$。",
    exp: "由引理 4.3，极限为 $\\int_0^1 s\\,d(s^2)=\\int_0^1 2s^2ds=2/3$。对有限变差的 $a$，取左端点还是其他点不影响极限。（书中 §4.1.1 · Lemma 4.3 · p.73）" },
  { id: "sc-r5-3", ch: 4, cat: "Prop 4.5 对有限变差过程积分", q: "设 $A$ 是有限变差过程。命题 4.5 要保证 $H\\cdot A=(\\int_0^t H_s\\,dA_s)_{t\\ge0}$ 是有限变差过程，对 $H$ 的假设是：", opts: ["循序可测，且 $\\forall t,\\omega$：$\\int_0^t|H_s||dA_s|<\\infty$", "有界即可，对可测性无要求", "仅需关于 $\\mathcal F\\otimes\\mathcal B(\\mathbb R_+)$ 可测", "适应且 $\\int_0^\\infty|H_s||dA_s|<\\infty$"], a: 0, hint: "样本路径的有限变差性来自积分条件；还需保证 $H\\cdot A$ 是适应的。",
    exp: "命题要求 $H$ 循序可测（保证 $\\int_0^t H_s dA_s$ 是 $\\mathcal F_t$ 可测的）且每个有限区间上 $|H|$ 关于 $|dA|$ 可积。仅联合可测或仅适应都不足以保证适应性，而有界性既不需要也不充分。（书中 §4.1.2 · Prop 4.5 · p.74）" },
  { id: "sc-r5-4", ch: 4, cat: "§4.2 局部鞅与真鞅", q: "设 $B$ 是从 0 出发的 $(\\mathcal F_t)$-布朗运动。下列哪个过程是连续局部鞅但**不是**鞅？", opts: ["$Z+B_t$，$Z$ 为 $\\mathcal F_0$ 可测且 $E|Z|=\\infty$", "$B_t^2-t$", "$e^{B_t-t/2}$", "$B_t$"], a: 0, hint: "鞅要求每个 $M_t$ 可积；局部鞅的定义只看 $M_t-M_0$。",
    exp: "$Z+B_t-Z=B_t$ 是鞅，所以 $Z+B$ 是连续局部鞅；但 $E|Z+B_t|=\\infty$，故不是鞅。其余三个都是真鞅。（书中 §4.2 · Def 4.6 后注 (ii) · p.76）" },
  { id: "sc-r5-5", ch: 4, cat: "Prop 4.7 何时是一致可积鞅", q: "对连续局部鞅 $M$，下列哪个条件足以推出 $M$ 是一致可积鞅？", opts: ["存在 $Z\\in L^1$ 使 $\\forall t$：$|M_t|\\le Z$", "族 $(M_t)_{t\\ge0}$ 一致可积", "$\\sup_t E[M_t^2]<\\infty$", "对每个 $t$ 有 $E|M_t|<\\infty$"], a: 0, hint: "想想三维布朗运动 $B$（从 $x\\ne0$ 出发）的 $1/|B_t|$。",
    exp: "被可积随机变量控制时，对约化序列用控制收敛即得鞅性（命题 4.7(ii)）。$1/|B_t|$ 是 $L^2$ 有界（因而一致可积）的连续局部鞅，却不是鞅，所以其余条件都不够。（书中 §4.2 · Prop 4.7 · p.77–78）" },
  { id: "sc-r5-6", ch: 4, cat: "Prop 4.7 约化序列", q: "设 $M$ 是连续局部鞅，但 $E|M_0|=\\infty$，令 $T_n=\\inf\\{t\\ge0:|M_t|\\ge n\\}$。则：", opts: ["$(T_n)$ 不约化 $M$", "$(T_n)$ 约化 $M$", "这样的 $M$ 不可能是连续局部鞅", "$T_n$ 不是停时"], a: 0, hint: "约化要求每个 $M^{T_n}$ 都是一致可积鞅，看 $t=0$ 时刻。",
    exp: "$M^{T_n}_0=M_0\\notin L^1$，故 $M^{T_n}$ 不是鞅；命题 4.7(iii) 需要 $M_0\\in L^1$。这样的 $M$ 存在（如 $Z+B$），$T_n$ 是连续适应过程的击中时，是停时。（书中 §4.2 · Prop 4.7 (iii) · p.77）" },
  { id: "sc-r5-7", ch: 4, cat: "Prop 4.11 停止与二次变差", q: "$B$ 为从 0 出发的 $(\\mathcal F_t)$-布朗运动，$T=\\inf\\{t:|B_t|=1\\}$。则 $\\langle B^T,B^T\\rangle_t=$", opts: ["$t\\wedge T$", "$t$", "$T$", "$B_{t\\wedge T}^2$"], a: 0, hint: "停止一个局部鞅，其二次变差也被同一停时停止。",
    exp: "由命题 4.11，$\\langle B^T,B^T\\rangle_t=\\langle B,B\\rangle_{t\\wedge T}=t\\wedge T$。$B_{t\\wedge T}^2$ 减去它才是局部鞅，二者不相等。（书中 §4.3 · Prop 4.11 · p.85）" },
