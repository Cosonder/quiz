    exp: "依概率收敛只能保证存在几乎必然收敛的子列(Thm 3.1.9(iii))，整列未必，如“打字机”序列。其余三条分别是 Thm 3.1.9 的 (ii)、(i)+(iv)、(vi)。（书中 §3.1 · Thm 3.1.9 · p.208）" },
  { id: "p1-r3-2", ch: 33, cat: "Thm 3.1.9 收敛方式的关系", q: "设 $X_n\\xrightarrow{P}X$，$p\\ge1$。下列哪个附加条件足以推出 $X_n\\to X$ 于 $L^p$？", opts: ["存在 $Y\\in L^p$ 使对所有 $n$ 有 $|X_n|\\le Y$ a.s.", "每个 $X_n\\in L^p$，且 $X\\in L^p$", "每个 $X_n$ 都是有界随机变量", "$X_n\\to X$ 几乎必然"], a: 0, hint: "控制收敛定理的关键假设是什么？几乎必然收敛本身能否控制矩？",
    exp: "Thm 3.1.9(v)：有 $L^p$ 控制函数时，子列几乎必然收敛加控制收敛定理及子列准则给出 $L^p$ 收敛。$X_n=n^2\\mathbf 1_{(0,1/n)}$ 每项有界、属于 $L^p$、几乎必然趋于 $0$，但 $E|X_n|^p=n^{2p-1}\\to\\infty$，否定了其余三个条件。（书中 §3.1 · Thm 3.1.9 · p.208）" },
  { id: "p1-r3-3", ch: 33, cat: "§3.1 Markov 不等式", q: "设 $X\\ge0$ 且 $P(X\\ge t)=\\min\\{1,t^{-3}\\}$($t>0$)。用 $E[X^p]=p\\int_0^\\infty t^{p-1}P(X\\ge t)\\,dt$ 计算 $E[X^2]$。", opts: ["$3$", "$3/2$", "$2$", "$+\\infty$"], a: 0, hint: "把积分拆成 $[0,1]$ 和 $[1,\\infty)$ 两段。",
    exp: "$E[X^2]=2\\big(\\int_0^1 t\\,dt+\\int_1^\\infty t^{-2}\\,dt\\big)=2(1/2+1)=3$。忘记因子 $p=2$ 会得到 $3/2$；尾部 $t^{-3}$ 衰减足够快，二阶矩有限。（书中 §3.1 · Prop 3.1.6 · p.207）" },
  { id: "p1-r3-4", ch: 33, cat: "§3.1 反例", q: "在 $[0,1]$(Lebesgue 测度)上，把 $n=2^k+\\ell$($0\\le\\ell<2^k$)，令 $X_n=\\mathbf 1_{[\\ell/2^k,(\\ell+1)/2^k]}$。下列哪项正确？", opts: ["$X_n\\to0$ 于 $L^p$，但对每个 $\\omega$，$X_n(\\omega)$ 都不收敛", "$X_n\\to0$ 几乎必然", "$X_n$ 不依概率收敛到 $0$", "$(X_n)$ 没有几乎必然收敛到 $0$ 的子列"], a: 0, hint: "分别计算 $E|X_n|^p$，并数一数固定的 $\\omega$ 落在多少个区间里。",
    exp: "$E|X_n|^p=2^{-k}\\to0$，故 $L^p$ 收敛，从而依概率收敛；但每个 $\\omega$ 属于无穷多个 $J_n$，也不属于无穷多个，所以 $X_n(\\omega)$ 在 $0,1$ 间振荡。由 Thm 3.1.9(iii)，必有几乎必然收敛的子列(例如 $\\ell=0$ 的那些项)。（书中 §3.1 · Example 3.1.11 · p.211）" },
  { id: "p1-r3-5", ch: 33, cat: "§3.1 反例", q: "设 $X\\sim\\mathrm{Be}_{1/2}$，$n$ 为偶数时 $X_n=X$，奇数时 $X_n=1-X$。下列哪项正确？", opts: ["$X_n\\xrightarrow{d}X$，但 $X_n$ 不依概率收敛到 $X$", "$X_n\\xrightarrow{P}X$", "$X_n$ 不依分布收敛", "$X_n\\to1/2$ 几乎必然"], a: 0, hint: "比较 $1-X$ 与 $X$ 的分布，再看 $|X_n-X|$ 在奇数项上取什么值。",
    exp: "$1-X\\sim\\mathrm{Be}_{1/2}$，每个 $X_n$ 与 $X$ 同分布，所以依分布收敛；而奇数项 $|X_n-X|=|1-2X|=1$，故不依概率收敛，更不会几乎必然收敛(取值只有 $0,1$，不可能趋于 $1/2$)。（书中 §3.1 · Example 3.1.12 · p.211）" },
  { id: "p1-r3-6", ch: 33, cat: "§5.3 收敛方式辨析", q: "$X_n\\sim(1-\\tfrac1n)\\delta_0+\\tfrac1n\\delta_n$，$Z_n=(X_n-1)/\\sqrt{n-1}$($n\\ge2$)。下列哪项正确？", opts: ["$Z_n\\xrightarrow{P}0$，但不在 $L^2$ 中收敛到 $0$", "$Z_n\\to0$ 于 $L^2$", "$Z_n$ 不依分布收敛", "$Z_n\\xrightarrow{d}N_{0,1}$"], a: 0, hint: "先算 $E[X_n]$ 与 $\\mathrm{var}(X_n)$，再求 $Z_n$ 的特征函数极限。",
    exp: "$E[X_n]=1$，$\\mathrm{var}(X_n)=n-1$，故 $E[Z_n^2]=1$，不在 $L^2$ 收敛；$\\varphi_{Z_n}(\\eta)\\to1$，即 $Z_n\\xrightarrow{d}\\delta_0$，由 Thm 3.1.9(vi) 得依概率收敛。均值 $0$ 方差 $1$ 并不意味着极限是标准正态。（书中 §5.3 · Exercise 5.3.2 · p.343）" },
  { id: "p1-r3-7", ch: 33, cat: "§3.2 大数律", q: "$X_n$ i.i.d. $\\mathrm{Be}_{1/2}$，$M_n$ 为前 $n$ 项均值。仅用 Chebyshev 不等式，要保证 $P(|M_n-1/2|\\ge0.1)\\le0.05$，最小的 $n$ 是", opts: ["$500$", "$100$", "$250$", "$2500$"], a: 0, hint: "$P(|M_n-\\mu|\\ge\\varepsilon)\\le\\sigma^2/(n\\varepsilon^2)$，先求 $\\sigma^2$。",
    exp: "$\\sigma^2=1/4$，界为 $\\tfrac{1/4}{n\\cdot0.01}=25/n$，令其 $\\le0.05$ 得 $n\\ge500$。（书中 §3.2 · Remark 3.2.2 · p.213）" },
  { id: "p1-r3-8", ch: 33, cat: "§3.2–3.4 大数律", q: "设 $X_n$ i.i.d.，$\\mu=E[X_1]$，$M_n=S_n/n$。下列陈述中哪一个**不**正确？", opts: ["若 $X_1\\in L^1$，则 $M_n\\to\\mu$ 于 $L^2$", "若 $X_1\\in L^2$，则 $E[(M_n-\\mu)^2]=\\mathrm{var}(X_1)/n$", "若 $X_1\\in L^1$，则 $M_n\\to\\mu$ 几乎必然", "若 $X_1\\in L^1$，则 $M_n\\xrightarrow{P}\\mu$"], a: 0, hint: "如果 $X_1\\notin L^2$，$M_n$ 本身是否属于 $L^2$？",
    exp: "若 $X_1\\in L^1\\setminus L^2$，则 $M_n$ 一般不在 $L^2$ 中(如 $M_1=X_1$)，谈不上 $L^2$ 收敛。方差公式来自独立性；$L^1$ 下的几乎必然收敛是 Kolmogorov 强大数律；依概率收敛由 Thm 3.4.2 的依分布收敛到常数加 Thm 3.1.9(vi) 得到。（书中 §3.4 · Remark 3.4.3 · p.231）" },
  { id: "p1-r3-9", ch: 33, cat: "§3.2 Bernstein 多项式", q: "$f\\in C([0,1])$ 的 $n$ 次 Bernstein 多项式为 $f_n(p)=\\sum_{k}\\binom nk p^k(1-p)^{n-k}f(k/n)$。对 $f(x)=x^2$，$f_n(p)=$", opts: ["$p^2+p(1-p)/n$", "$p^2$", "$p^2-p(1-p)/n$", "$p^2+p/n$"], a: 0, hint: "把 $f_n(p)$ 写成 $E[f(M_n)]$，$M_n$ 是 $n$ 个 $\\mathrm{Be}_p$ 的均值。",
    exp: "$f_n(p)=E[M_n^2]=\\mathrm{var}(M_n)+E[M_n]^2=p(1-p)/n+p^2$。偏差 $p(1-p)/n\\to0$ 一致成立，与 Bernstein 逼近定理一致。（书中 §3.2 · Prop 3.2.5 · p.218）" },
  { id: "p1-r3-10", ch: 33, cat: "§3.3 分布函数与弱收敛", q: "设 $\\mu_n=\\delta_{1/n}$，$F_n$ 为其 CDF。下列哪项正确？", opts: ["$\\mu_n\\xrightarrow{d}\\delta_0$，虽然 $F_n(0)\\not\\to F_{\\delta_0}(0)$", "$\\mu_n$ 不弱收敛，因为 $F_n(0)\\not\\to F_{\\delta_0}(0)$", "对每个 Borel 集 $H$ 有 $\\mu_n(H)\\to\\delta_0(H)$", "$\\mu_n\\xrightarrow{d}\\delta_0$ 且 $F_n\\to F_{\\delta_0}$ 处处成立"], a: 0, hint: "Thm 3.3.3 只要求在极限 CDF 的哪些点上收敛？",
    exp: "对 $f\\in bC$ 有 $f(1/n)\\to f(0)$，故弱收敛。$F_n(0)=0$ 而 $F_{\\delta_0}(0)=1$，但 $0$ 是 $F_{\\delta_0}$ 的间断点，Thm 3.3.3 不要求那里收敛；取 $H=(0,\\infty)$ 可见集合上的收敛失败。（书中 §3.3 · Thm 3.3.3 · p.220）" },
  { id: "p1-r3-11", ch: 33, cat: "§5.3 极限分布", q: "$X_i$ i.i.d. $\\sim\\mathrm{Unif}[0,\\lambda]$，$Y_n=\\min\\{nX_1,\\dots,nX_n\\}$。$Y_n$ 的弱极限是", opts: ["$\\mathrm{Exp}_{1/\\lambda}$", "$\\mathrm{Exp}_{\\lambda}$", "$\\delta_0$", "$\\mathrm{Unif}[0,\\lambda]$"], a: 0, hint: "计算 $P(Y_n>x)$，再用 Thm 3.3.3。",
    exp: "对 $0<x<\\lambda n$，$P(Y_n>x)=(1-\\tfrac{x}{\\lambda n})^n\\to e^{-x/\\lambda}$，即 CDF 收敛到参数为 $1/\\lambda$ 的指数分布(均值 $\\lambda$)。$\\mathrm{Exp}_\\lambda$ 的均值是 $1/\\lambda$，参数取反了。（书中 §5.3 · Exercise 5.3.3 · p.344）" },
  { id: "p1-r3-12", ch: 33, cat: "§3.3 紧性", q: "设 $X_n\\equiv n$(常数随机变量)。下列哪项正确？", opts: ["$F_{X_n}$ 逐点收敛到连续函数，但 $(X_n)$ 无弱收敛子列", "$X_n$ 弱收敛到某个分布", "$(X_n)$ 是 tight 的", "$F_{X_n}$ 逐点收敛到常数 $1$"], a: 0, hint: "写出 $F_{X_n}(x)=\\mathbf 1_{[n,\\infty)}(x)$，看它的逐点极限是不是 CDF。",
    exp: "$F_{X_n}\\to0$ 逐点，这个极限连续但不是 CDF，因此不能用 Thm 3.3.3 推出弱收敛。质量逃逸到无穷，序列不 tight，任何子列都不弱收敛。（书中 §3.3 · Example 3.3.4 · p.222）" },
  { id: "p1-r3-13", ch: 33, cat: "Def 3.3.5 紧性", q: "下列分布族中，哪一个**不是** tight 的？", opts: ["$\\{N_{0,n}:n\\in\\mathbb N\\}$", "$\\{N_{1/n,1}:n\\in\\mathbb N\\}$", "$\\{\\mathrm{Exp}_\\lambda:\\lambda\\ge1\\}$", "$\\{\\mathrm{Poisson}_\\lambda:0<\\lambda\\le5\\}$"], a: 0, hint: "对每个族，能否找到一个与成员无关的 $M$ 控制 $P(|X|\\ge M)$？",
    exp: "$X\\sim N_{0,n}$ 时 $P(|X|\\ge M)=P(|Z|\\ge M/\\sqrt n)\\to1$，不存在统一的 $M$。均值有界方差为 1 的正态族、$P(X\\ge M)=e^{-\\lambda M}\\le e^{-M}$ 的指数族、以及由 Markov 不等式 $P(X\\ge M)\\le5/M$ 的 Poisson 族都是 tight 的。（书中 §3.3 · Def 3.3.5 · p.223）" },
  { id: "p1-r3-14", ch: 33, cat: "§3.3 特征函数与弱收敛", q: "设 $\\mu_n$ 的特征函数 $\\varphi_n$ 逐点收敛到函数 $\\varphi$。再加上哪个条件，即可推出 $\\varphi$ 是某分布 $\\mu$ 的 CHF 且 $\\mu_n\\xrightarrow{d}\\mu$？", opts: ["$\\varphi$ 在 $0$ 处连续", "$\\varphi(0)=1$", "对所有 $\\eta$ 有 $|\\varphi(\\eta)|\\le1$", "$\\varphi$ 在 $\\mathbb R\\setminus\\{0\\}$ 上连续"], a: 0, hint: "哪些条件对任何特征函数的逐点极限都自动成立？",
    exp: "这是 Lévy 连续性定理 (ii)：极限在 $0$ 处连续保证 $(\\mu_n)$ tight，再由 Helly 定理和子列准则得到弱收敛。$\\varphi(0)=1$ 与 $|\\varphi|\\le1$ 对逐点极限自动成立；$N_{0,n}$ 的 CHF 极限 $\\mathbf 1_{\\{0\\}}$ 在 $\\mathbb R\\setminus\\{0\\}$ 上连续，但序列不弱收敛。（书中 §3.3 · Thm 3.3.8 · p.225）" },
  { id: "p1-r3-15", ch: 33, cat: "§5.3 特征函数与弱收敛", q: "设 $X_n\\sim\\mathrm{Unif}[0,n]$。下列哪项正确？", opts: ["$\\varphi_{X_n}\\to\\mathbf 1_{\\{0\\}}$ 逐点，$X_n$ 不弱收敛", "$\\varphi_{X_n}\\to1$，故 $X_n\\xrightarrow{d}\\delta_0$", "$\\varphi_{X_n}$ 不逐点收敛", "$X_n/n$ 也不弱收敛"], a: 0, hint: "$\\varphi_{X_n}(\\eta)=\\frac{e^{i\\eta n}-1}{i\\eta n}$($\\eta\\ne0$)，估计其模。",
    exp: "对 $\\eta\\ne0$，$|\\varphi_{X_n}(\\eta)|\\le2/(|\\eta|n)\\to0$，而 $\\varphi_{X_n}(0)=1$；极限在 $0$ 不连续，由 Lévy 定理(及 Thm 3.1.9)$X_n$ 不弱收敛，也不几乎必然收敛。$X_n/n\\sim\\mathrm{Unif}[0,1]$ 对每个 $n$ 都成立，当然弱收敛。（书中 §5.3 · Exercise 5.3.7 · p.348）" },
  { id: "p1-r3-16", ch: 33, cat: "§3.3 弱收敛的例子", q: "$X_n\\sim\\mathrm{Geom}_{p_n}$($P(X_n=k)=p_n(1-p_n)^{k-1}$，$k\\ge1$)，且 $np_n\\to\\lambda>0$。$X_n/n$ 的弱极限是", opts: ["$\\mathrm{Exp}_\\lambda$", "$\\mathrm{Exp}_{1/\\lambda}$", "$\\mathrm{Poisson}_\\lambda$", "$\\delta_{1/\\lambda}$"], a: 0, hint: "$\\varphi_{X_n}(\\eta)=p_n/(e^{-i\\eta}-1+p_n)$，代入 $\\eta/n$ 并展开指数。",
    exp: "$\\varphi_{X_n/n}(\\eta)=\\frac{np_n}{-i\\eta+o(1)+np_n}\\to\\frac{\\lambda}{\\lambda-i\\eta}$，是 $\\mathrm{Exp}_\\lambda$(均值 $1/\\lambda$)的 CHF，再用 Lévy 定理。核对均值：$E[X_n/n]=1/(np_n)\\to1/\\lambda$；极限是连续分布，不是 Poisson 或点质量。（书中 §3.3 · Example 3.3.10 · p.227）" },
  { id: "p1-r3-17", ch: 33, cat: "§3.4 中心极限定理", q: "抛均匀硬币 $400$ 次，正面次数为 $S$，$\\Phi$ 为标准正态 CDF。按中心极限定理，$P(S\\le220)$ 约等于", opts: ["$\\Phi(2)$", "$\\Phi(0.2)$", "$\\Phi(1)$", "$\\Phi(4)$"], a: 0, hint: "把 $S$ 标准化：减去 $np$，除以 $\\sqrt{np(1-p)}$。",
    exp: "$np=200$，$\\sqrt{np(1-p)}=\\sqrt{100}=10$，故 $P(S\\le220)\\approx\\Phi((220-200)/10)=\\Phi(2)\\approx0.977$。除以方差 $100$ 得 $\\Phi(0.2)$，标准差用错会得到 $\\Phi(1)$ 或 $\\Phi(4)$。（书中 §3.4 · Remark 3.4.8 · p.234）" },
  { id: "p1-r3-18", ch: 33, cat: "§3.4 Monte Carlo 方法", q: "Monte Carlo 估计 $M_n$ 的 95% 置信区间半径约为 $1.96\\,\\sigma/\\sqrt n$。要把半径缩小到原来的 $1/10$，样本量 $n$ 需乘以", opts: ["$100$", "$10$", "$\\sqrt{10}$", "$1000$"], a: 0, hint: "半径关于 $n$ 的阶是多少？",
    exp: "半径正比于 $n^{-1/2}$，缩小 10 倍需要 $n$ 增大 $10^2=100$ 倍。这个 $n^{-1/2}$ 速度来自中心极限定理，与维数无关。（书中 §3.4 · Remark 3.4.7 · p.233）" },
  { id: "p1-r4-1", ch: 34, cat: "§4.1 离散情形的条件期望", q: "$X_1,\\dots,X_n$ 独立同分布 $\\sim\\mathrm{Be}_p$（$0<p<1$），$Y=X_1+\\dots+X_n$。则 $E[X_1\\mid Y]=$？", opts: ["$Y/n$", "$p$", "$pY$", "$(Y-1)/(n-1)$"], a: 0, hint: "先算条件期望函数 $E[X_1\\mid Y=k]=P(X_1=1\\mid Y=k)$，或用对称性。",
    exp: "$P(X_1=1\\mid Y=k)=p\\binom{n-1}{k-1}p^{k-1}(1-p)^{n-k}/\\big(\\binom nk p^k(1-p)^{n-k}\\big)=k/n$，故 $E[X_1\\mid Y]=Y/n$，与 $p$ 无关；也可由 $\\sum_i E[X_i\\mid Y]=Y$ 和对称性得到。常数 $p$ 只是无条件期望。（书中 §4.1 · Example 4.1.14 · p.245）" },
  { id: "p1-r4-2", ch: 34, cat: "§4.1 离散情形的条件期望", q: "设 $Y=1_B$，$0<P(B)<1$，$X$ 可积。条件期望 $E[X\\mid Y]$ 是什么？", opts: ["$B$ 上取 $E[X\\mid B]$，$B^c$ 上取 $E[X\\mid B^c]$", "常数 $E[X\\mid B]$", "随机变量 $E[X]\\,1_B$", "$E[X1_B]\\,1_B+E[X1_{B^c}]\\,1_{B^c}$"], a: 0, hint: "$\\sigma(Y)=\\{\\emptyset,\\Omega,B,B^c\\}$，条件期望要在划分的每一块上取常数。",
    exp: "按离散情形的定义 $E[X\\mid Y]=\\sum_n E[X\\mid B_n]1_{B_n}$，划分为 $B,B^c$，故在 $B$ 上取 $E[X\\mid B]$、在 $B^c$ 上取 $E[X\\mid B^c]$。常数 $E[X\\mid B]$ 是“已知 $B$ 发生”时的数值估计，不是给定 $Y$ 的条件期望；$E[X1_B]1_B+\\dots$ 漏除了 $P(B)$、$P(B^c)$。（书中 §4.1 · Remark 4.1.13 · p.245）" },
  { id: "p1-r4-3", ch: 34, cat: "§4.1 全概率公式", q: "邮箱每日垃圾邮件数服从 $\\mathrm{Poisson}_{12}$，装了过滤软件的邮箱均值减半；公司 75% 的邮箱装了软件。随机一个邮箱每日垃圾邮件数的期望是？", opts: ["$7.5$", "$9$", "$6$", "$10.5$"], a: 0, hint: "令 $Y$ 表示是否装软件，先写出 $\\mu_{X\\mid Y}$，再对 $Y$ 取期望。",
    exp: "$\\mu_{X\\mid Y}=Y\\,\\mathrm{Poisson}_6+(1-Y)\\mathrm{Poisson}_{12}$，$E[X]=E[E[X\\mid Y]]=0.75\\cdot6+0.25\\cdot12=7.5$。$9$ 是两个均值的简单平均，$10.5$ 把权重弄反了。（书中 §4.1 · Example 4.1.8 · p.240）" },
  { id: "p1-r4-4", ch: 34, cat: "§4.1 条件分布的计算", q: "$X_i\\sim\\mathrm{Poisson}_{\\lambda_i}$（$i=1,2$）独立，$Y=X_1+X_2$。则 $X_1$ 给定 $Y$ 的条件分布 $\\mu_{X_1\\mid Y}$ 是？", opts: ["$\\mathrm{Bin}_{Y,\\lambda_1/(\\lambda_1+\\lambda_2)}$", "$\\mathrm{Bin}_{Y,\\lambda_2/(\\lambda_1+\\lambda_2)}$", "$\\mathrm{Poisson}_{\\lambda_1}$", "$\\mathrm{Unif}_{\\{0,1,\\dots,Y\\}}$"], a: 0, hint: "计算 $P(X_1=k\\mid Y=n)=P(X_1=k)P(X_2=n-k)/P(Y=n)$。",
    exp: "代入 Poisson 概率得 $\\binom nk\\lambda_1^k\\lambda_2^{n-k}/(\\lambda_1+\\lambda_2)^n$，即 $\\mathrm{Bin}_{n,\\lambda_1/(\\lambda_1+\\lambda_2)}$。$\\mathrm{Poisson}_{\\lambda_1}$ 是无条件分布；条件分布不可能超过 $Y$，且参数应是 $\\lambda_1$ 所占比例。（书中 §4.1 · Example 4.1.16 · p.246）" },
  { id: "p1-r4-5", ch: 34, cat: "§4.1 条件分布的计算", q: "$X_i\\sim\\mathrm{Geom}_p$（$i=1,2$，取值 $1,2,\\dots$）独立，$Y=X_1+X_2$。则 $\\mu_{X_1\\mid Y}$ 是？", opts: ["$\\mathrm{Unif}_{\\{1,2,\\dots,Y-1\\}}$", "$\\mathrm{Unif}_{\\{0,1,\\dots,Y\\}}$", "$\\mathrm{Bin}_{Y,1/2}$", "$\\mathrm{Geom}_p$"], a: 0, hint: "先求 $P(Y=n)$，再看 $P(X_1=k,X_2=n-k)$ 是否依赖 $k$。",
    exp: "$P(X_1=k,X_2=n-k)=p^2(1-p)^{n-2}$ 与 $k$ 无关，而 $P(Y=n)=(n-1)p^2(1-p)^{n-2}$，故在 $k=1,\\dots,n-1$ 上均匀。$X_1\\ge1$ 且 $X_2\\ge1$，所以不可能取 $0$ 或 $Y$。（书中 §4.1 · Exercise 4.1.17 · p.247）" },
  { id: "p1-r4-6", ch: 34, cat: "§4.2 条件期望的定义", q: "设 $X\\in L^1$，$Z\\in m\\mathcal G$ 可积。下列条件中，哪一个**不**足以保证 $Z=E[X\\mid\\mathcal G]$？", opts: ["仅要求 $E[Z]=E[X]$", "对所有 $G\\in\\mathcal G$，$E[Z1_G]=E[X1_G]$", "对所有有界 $W\\in m\\mathcal G$，$E[ZW]=E[XW]$", "对所有非负有界 $W\\in m\\mathcal G$，$E[ZW]=E[XW]$"], a: 0, hint: "定义要求的是对一整类 $\\mathcal G$-可测检验函数成立的等式。",
    exp: "$E[ZW]=E[XW]$ 对有界 $W\\in m\\mathcal G$、对非负有界 $W$、或对所有指示函数 $1_G$ 成立，三者互相等价（线性加单调类论证）。只要求 $E[Z]=E[X]$ 相当于只取 $W=1$，例如 $Z\\equiv E[X]$ 就满足它，但一般不是条件期望。（书中 §4.2 · Thm 4.2.1, Remark 4.2.2 · p.247）" },
  { id: "p1-r4-7", ch: 34, cat: "§4.2 条件期望的版本", q: "设 $Z=E[X\\mid\\mathcal G]$，$Z'$ 满足 $Z'=Z$ a.s.。$Z'$ 何时也是 $E[X\\mid\\mathcal G]$ 的一个版本？", opts: ["当且仅当 $Z'$ 是 $\\mathcal G$-可测的", "总是，因为条件期望只确定到零集", "当且仅当 $Z'=Z$ 处处成立", "当且仅当 $Z'$ 是 $\\sigma(X)$-可测的"], a: 0, hint: "检查定义的两条性质：哪一条对 a.s. 修改是稳定的？",
    exp: "积分等式 $E[Z'W]=E[XW]$ 在 a.s. 修改下自动保持，只有 $\\mathcal G$-可测性可能丢失（在不属于 $\\mathcal G$ 的零集上修改）。所以“总是”错；要求处处相等过强；关于 $\\sigma(X)$ 的可测性与定义无关，需要检查的是 $\\mathcal G$-可测性。（书中 §4.2 · Remark 4.2.4 · p.250）" },
  { id: "p1-r4-8", ch: 34, cat: "§4.2 条件期望的性质", q: "设所涉随机变量均可积。下列关于条件期望的说法，哪一项**不**一定成立？", opts: ["若 $X$ 与 $\\mathcal G$ 独立，则 $E[XY\\mid\\mathcal G]=E[X]E[Y\\mid\\mathcal G]$", "若 $X\\in m\\mathcal G$ 有界，则 $E[XY\\mid\\mathcal G]=XE[Y\\mid\\mathcal G]$", "$\\|E[X\\mid\\mathcal G]\\|_p\\le\\|X\\|_p$，$p\\ge1$", "$\\mathcal H\\subseteq\\mathcal G$ 时 $E[E[X\\mid\\mathcal G]\\mid\\mathcal H]=E[X\\mid\\mathcal H]$"], a: 0, hint: "回忆“独立的量可以提出”这条性质的确切条件：独立性是在哪两个对象之间？",
    exp: "$X$ 与 $\\mathcal G$ 独立并不意味着 $X$ 与 $Y$ 独立：取 $\\mathcal G=\\{\\emptyset,\\Omega\\}$、$Y=X$，左边为 $E[X^2]$，右边为 $E[X]^2$。提取已知量、$L^p$ 压缩性和塔性质都是 Thm 4.2.10 中的标准性质。（书中 §4.2 · Thm 4.2.10 · p.252）" },
  { id: "p1-r4-9", ch: 34, cat: "§4.2 冻结引理", q: "$N\\sim\\mathrm{Poisson}_\\lambda$，$Z_1,Z_2,\\dots$ 同分布，且 $N,Z_1,Z_2,\\dots$ 相互独立，$X=\\sum_{k=1}^N Z_k$（$N=0$ 时 $X=0$）。$\\varphi_X(\\eta)=$？", opts: ["$e^{\\lambda(\\varphi_{Z_1}(\\eta)-1)}$", "$\\varphi_{Z_1}(\\eta)^{\\lambda}$", "$e^{\\lambda\\varphi_{Z_1}(\\eta)}$", "$e^{\\lambda(1-\\varphi_{Z_1}(\\eta))}$"], a: 0, hint: "先对 $N$ 取条件，利用冻结引理把 $N$ 当成常数 $n$。",
    exp: "由全概率与冻结引理 $\\varphi_X(\\eta)=E[\\varphi_{Z_1}(\\eta)^N]=\\sum_n e^{-\\lambda}\\lambda^n\\varphi_{Z_1}(\\eta)^n/n!=e^{\\lambda(\\varphi_{Z_1}(\\eta)-1)}$。$e^{\\lambda\\varphi_{Z_1}}$ 在 $\\eta=0$ 处不等于 1，不是特征函数；$\\varphi_{Z_1}^\\lambda$ 把随机的 $N$ 换成了它的均值。（书中 §4.2 · Lemma 4.2.11, Example 4.2.12 · p.256）" },
  { id: "p1-r4-10", ch: 34, cat: "§4.2 条件期望与 $L^2$ 投影", q: "$X,Y\\in L^2$，$Z=E[X\\mid Y]$。下列哪一项**不**一定成立？", opts: ["$X-Z$ 与 $Y$ 独立", "$E[X-Z]=0$", "$\\mathrm{cov}(X-Z,Y)=0$", "对任意 $f(Y)\\in L^2$，$E|X-Z|^2\\le E|X-f(Y)|^2$"], a: 0, hint: "条件期望是到 $L^2(\\Omega,\\sigma(Y),P)$ 的正交投影；正交与独立是两回事。",
    exp: "由定义取 $W=1$ 得零均值，取 $W=Y$ 得与 $Y$ 不相关；投影性质给出最小二乘刻画。但残差 $X-Z$ 一般只与 $Y$ 不相关而非独立，独立性要额外结构，例如 $(X,Y)$ 联合正态。（书中 §4.2 · Remark 4.2.7, Prop 4.2.19 · p.251）" },
  { id: "p1-r4-11", ch: 34, cat: "§4.3 正态向量的条件分布", q: "$(X,Y)$ 为零均值二维正态，$\\mathrm{var}(X)=4$，$\\mathrm{var}(Y)=1$，$\\mathrm{cov}(X,Y)=1$。则 $\\mu_{X\\mid Y}=$？", opts: ["$\\mathcal N_{Y,3}$", "$\\mathcal N_{Y,4}$", "$\\mathcal N_{Y/4,3}$", "$\\mathcal N_{Y,15/4}$"], a: 0, hint: "条件均值是回归直线 $\\mu_1+(Y-\\mu_2)\\sigma_{XY}/\\sigma_Y^2$，条件方差不依赖于 $Y$。",
    exp: "$\\mu_{X\\mid Y}=\\mathcal N_{\\mu_1+(Y-\\mu_2)\\sigma_{XY}/\\sigma_Y^2,\\ \\sigma_X^2-\\sigma_{XY}^2/\\sigma_Y^2}=\\mathcal N_{Y,3}$。$\\mathcal N_{Y/4,3}$ 和 $15/4$ 都错把 $\\sigma_X^2$ 当成了分母；方差 4 忽略了观测 $Y$ 带来的信息。（书中 §4.3 · Example 4.3.25 · p.275）" },
  { id: "p1-r4-12", ch: 34, cat: "§4.2 Bayes 公式", q: "$Q\\ll P$ 于 $\\mathcal F$，$L=dQ/dP$，$X\\in L^1(Q)$，$\\mathcal G\\subseteq\\mathcal F$。则 $E^Q[X\\mid\\mathcal G]=$？", opts: ["$E^P[XL\\mid\\mathcal G]\\,/\\,E^P[L\\mid\\mathcal G]$", "$E^P[XL\\mid\\mathcal G]$", "$E^P[X\\mid\\mathcal G]\\,/\\,E^P[L\\mid\\mathcal G]$", "$E^P[XL\\mid\\mathcal G]\\cdot E^P[L\\mid\\mathcal G]$"], a: 0, hint: "$Q$ 在 $\\mathcal G$ 上的密度是 $E^P[L\\mid\\mathcal G]$，不是 $L$；取 $X\\equiv1$ 检验。",
    exp: "取 $X\\equiv1$ 应得 1，只有比值 $E^P[XL\\mid\\mathcal G]/E^P[L\\mid\\mathcal G]$ 满足；且分母 $Q$-a.s. 为正。缺少分母的 $E^P[XL\\mid\\mathcal G]$ 在 $X\\equiv1$ 时给出 $E^P[L\\mid\\mathcal G]\\ne1$。（书中 §4.2 · Thm 4.2.14 · p.258）" },
  { id: "p1-r4-13", ch: 34, cat: "§4.3 正则条件概率", q: "关于正则条件概率 $P(\\cdot\\mid\\mathcal G)$ 与正则条件分布 $\\mu_{X\\mid\\mathcal G}$ 的存在性，下列哪项正确？", opts: ["Polish 空间（Borel $\\sigma$-代数）上总存在", "任意概率空间、任意子 $\\sigma$-代数上都存在", "对每个 $A$ 任取 $E[1_A\\mid\\mathcal G]$ 的版本即可", "$\\mathbb R^d$ 值 $X$ 的正则条件分布未必存在"], a: 0, hint: "每个 $A$ 的版本都带有依赖于 $A$ 的例外零集，而 $A$ 有不可数多个。",
    exp: "Polish 空间上正则条件概率总存在（Thm 4.3.2），而一般空间中有不存在的反例。逐个取版本时例外零集依赖于 $A$，不可数并不一定是零集，所以未必得到概率测度。对 $\\mathbb R^d$ 值的 $X$，正则条件分布无条件存在（Thm 4.3.4）。（书中 §4.3 · Thm 4.3.2, Thm 4.3.4 · p.265）" },
  { id: "p1-r4-14", ch: 34, cat: "§4.4 附录：正则条件分布的构造", q: "证明 $\\mathbb R$ 值 $X$ 的正则条件分布存在时，先只对 $q\\in\\mathbb Q$ 取 $F(q)=E[1_{(X\\le q)}\\mid\\mathcal G]$。用有理数的关键原因是？", opts: ["可数个例外零集之并仍为零集", "$q\\in\\mathbb Q$ 时条件期望的版本是唯一的", "$\\mathbb Q$ 上的单调函数自动右连续", "$q$ 为无理数时 $E[1_{(X\\le q)}\\mid\\mathcal G]$ 不存在"], a: 0, hint: "条件期望的单调性、收敛定理给出的结论是“处处”成立，还是只在某种意义下成立？",
    exp: "每条 CDF 性质（单调、右连续、在 $\\pm\\infty$ 的极限）对每对有理点只 a.s. 成立；有理数可数，故存在一个 $\\mathcal G$ 中的零集 $C$，在其外 $F(\\cdot,\\omega)$ 是 $\\mathbb Q$ 上的 CDF，再延拓成 $\\mathbb R$ 上的分布并用 Dynkin 定理验证。条件期望对任何 $q$ 都存在，但版本只 a.s. 唯一；右连续性要靠条件控制收敛定理证明。（书中 §4.4 · Lemma 4.4.1, Thm 4.3.4 · p.278）" },
  { id: "p1-r4-15", ch: 34, cat: "§4.3 用条件分布计算期望", q: "$Y\\sim\\mathrm{Exp}_\\lambda$，$\\mu_{X\\mid Y}=\\mathcal N_{Y,1}$。则 $\\mathrm{cov}(X,Y)=$？", opts: ["$1/\\lambda^2$", "$1/\\lambda$", "$2/\\lambda^2$", "$0$"], a: 0, hint: "先由 $E[X\\mid Y]=\\int x\\,\\mu_{X\\mid Y}(dx)$ 求条件期望，再用提取已知量计算 $E[XY]$。",
    exp: "$E[X\\mid Y]=Y$，故 $E[X]=E[Y]=1/\\lambda$，$E[XY]=E[YE[X\\mid Y]]=E[Y^2]=2/\\lambda^2$，于是 $\\mathrm{cov}(X,Y)=2/\\lambda^2-1/\\lambda^2=1/\\lambda^2$。$2/\\lambda^2$ 是 $E[XY]$，忘了减去 $E[X]E[Y]$。（书中 §4.3 · Thm 4.3.8, Example 4.3.10 · p.266）" },
  { id: "p1-r4-16", ch: 34, cat: "§4.3 条件密度", q: "$(X,Y)$ 在 $\\{x>0,y>0,x^2+y^2<1\\}$ 上均匀分布。条件方差 $\\mathrm{var}(X\\mid Y)=$？", opts: ["$(1-Y^2)/12$", "$(1-Y^2)/4$", "$(1-Y^2)/3$", "$\\sqrt{1-Y^2}/12$"], a: 0, hint: "用 $\\gamma_{X\\mid Y}=\\gamma_{(X,Y)}/\\gamma_Y$ 认出条件分布是什么。",
    exp: "$\\gamma_{X\\mid Y}(x,y)=1_{[0,\\sqrt{1-y^2}]}(x)/\\sqrt{1-y^2}$，即 $\\mu_{X\\mid Y}=\\mathrm{Unif}_{[0,\\sqrt{1-Y^2}]}$。长度为 $\\ell$ 的区间上均匀分布的方差为 $\\ell^2/12$，故为 $(1-Y^2)/12$。$(1-Y^2)/3$ 是条件二阶矩 $E[X^2\\mid Y]$，不是方差。（书中 §4.3 · Prop 4.3.20, Example 4.3.22 · p.272）" },
  { id: "p1-r4-17", ch: 34, cat: "§4.3 由条件分布求边缘分布", q: "$Y\\sim\\mathrm{Exp}_\\lambda$，给定 $Y$ 时 $X$ 的条件分布为 $\\mathrm{Exp}_Y$（密度 $ye^{-xy}1_{x\\ge0}$）。$E[X]=$？", opts: ["$+\\infty$", "$1/\\lambda$", "$\\lambda$", "$1$"], a: 0, hint: "$E[X]=E[E[X\\mid Y]]$ 对非负变量总成立，算 $E[1/Y]$。",
    exp: "$E[X\\mid Y]=1/Y$，而 $E[1/Y]=\\int_0^\\infty\\lambda e^{-\\lambda y}y^{-1}dy=+\\infty$（在 0 附近发散）。也可求得 $\\gamma_X(x)=\\lambda/(x+\\lambda)^2$，它没有一阶矩。$1/\\lambda$ 是 $E[Y]$，不是 $E[X]$。（书中 §4.3 · Cor 4.3.23, Example 4.3.24 · p.274）" },
  { id: "p1-r4-18", ch: 34, cat: "§4.3 由条件分布求边缘分布", q: "$Y\\sim\\chi^2$（1 个自由度），$\\mu_{X\\mid Y}=\\mathcal N_{0,1/Y}$。则 $X$ 的分布是？", opts: ["Cauchy 分布，密度 $1/(\\pi(1+x^2))$", "$\\mathcal N_{0,1}$", "自由度为 2 的 Student $t$ 分布", "Laplace 分布，密度 $e^{-|x|}/2$"], a: 0, hint: "写出 $\\gamma_{(X,Y)}=\\gamma_{X\\mid Y}\\gamma_Y$，对 $y$ 积分时被积函数是关于 $y$ 的指数函数。",
    exp: "$\\gamma_{X\\mid Y}\\gamma_Y=\\sqrt{y/2\\pi}\\,e^{-x^2y/2}\\cdot e^{-y/2}/\\sqrt{2\\pi y}=e^{-(1+x^2)y/2}/(2\\pi)$，对 $y>0$ 积分得 $1/(\\pi(1+x^2))$。正态尺度混合使尾部变重，所以不是 $\\mathcal N_{0,1}$；所得分布即自由度 1 的 $t$ 分布，而不是自由度 2。（书中 §4.3 · Remark 4.3.21, Example 4.3.28 · p.272）" },
];
