<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法语区分区明信片 · 30 张</title><style>body{max-width:1300px;margin:auto;padding:24px;background:#f7f3e9;color:#243b34;font:16px/1.5 system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}figure{margin:0;background:white;border-radius:12px;overflow:hidden}img{width:100%;height:auto;display:block}figcaption{padding:16px}p{margin:.5em 0}h1{font-size:1.6rem}</style><h1>法语区旅行 · 30 张分区明信片</h1><p>魁北克 17 张 · 比利时法语区 6 张 · 瑞士法语区 7 张。每个分区通关后可在游戏中收藏。</p><main><figure><a href="qc-06.jpg"><img loading="lazy" width="960" height="640" src="qc-06.jpg" alt="Basilique Notre-Dame de Montréal"></a><figcaption><b>Montréal</b><br>Basilique Notre-Dame de Montréal<p lang="fr">Les deux tours de Notre-Dame veillent sur la place d’Armes.</p><p>圣母圣殿的双塔守望着兵器广场。</p></figcaption></figure><figure><a href="qc-13.jpg"><img loading="lazy" width="960" height="640" src="qc-13.jpg" alt="Rivière des Mille Îles"></a><figcaption><b>Laval</b><br>Rivière des Mille Îles<p lang="fr">Entre les îles, la rivière invite à une pause en canot.</p><p>岛屿之间，河流邀人乘独木舟歇一歇。</p></figcaption></figure><figure><a href="qc-16.jpg"><img loading="lazy" width="960" height="640" src="qc-16.jpg" alt="Mont Saint-Hilaire"></a><figcaption><b>Montérégie</b><br>Mont Saint-Hilaire<p lang="fr">Au pied du mont Saint-Hilaire, les pommes annoncent l’automne.</p><p>圣伊莱尔山脚下，苹果带来了秋天的消息。</p></figcaption></figure><figure><a href="qc-05.jpg"><img loading="lazy" width="960" height="640" src="qc-05.jpg" alt="Lac Memphrémagog"></a><figcaption><b>Estrie</b><br>Lac Memphrémagog<p lang="fr">Le lac Memphrémagog reflète les collines des Cantons-de-l’Est.</p><p>梅姆弗雷马戈格湖映照着东部乡镇的丘陵。</p></figcaption></figure><figure><a href="qc-17.jpg"><img loading="lazy" width="960" height="640" src="qc-17.jpg" alt="Récolte des canneberges"></a><figcaption><b>Centre-du-Québec</b><br>Récolte des canneberges<p lang="fr">Les canneberges colorent la récolte du Centre-du-Québec.</p><p>蔓越莓为魁北克中心区的丰收染上红色。</p></figcaption></figure><figure><a href="qc-04.jpg"><img loading="lazy" width="960" height="640" src="qc-04.jpg" alt="Parc national de la Mauricie"></a><figcaption><b>Mauricie</b><br>Parc national de la Mauricie<p lang="fr">En Mauricie, les lacs se cachent entre les forêts.</p><p>在莫里西，湖泊藏在森林之间。</p></figcaption></figure><figure><a href="qc-03.jpg"><img loading="lazy" width="960" height="640" src="qc-03.jpg" alt="Chute Montmorency"></a><figcaption><b>Capitale-Nationale</b><br>Chute Montmorency<p lang="fr">À Montmorency, l’eau plonge sous la passerelle suspendue.</p><p>蒙莫朗西瀑布的水流从吊桥下飞泻而落。</p></figcaption></figure><figure><a href="qc-12.jpg"><img loading="lazy" width="960" height="640" src="qc-12.jpg" alt="Chutes de la Chaudière"></a><figcaption><b>Chaudière-Appalaches</b><br>Chutes de la Chaudière<p lang="fr">À Lévis, les chutes de la Chaudière traversent les rochers.</p><p>在莱维，肖迪耶尔瀑布奔流于岩石之间。</p></figcaption></figure><figure><a href="qc-01.jpg"><img loading="lazy" width="960" height="640" src="qc-01.jpg" alt="Phare de Pointe-au-Père"></a><figcaption><b>Bas-Saint-Laurent</b><br>Phare de Pointe-au-Père<p lang="fr">Le phare de Pointe-au-Père regarde l’estuaire du Saint-Laurent.</p><p>父亲角灯塔眺望着圣劳伦斯河口。</p></figcaption></figure><figure><a href="qc-02.jpg"><img loading="lazy" width="960" height="640" src="qc-02.jpg" alt="Fjord du Saguenay"></a><figcaption><b>Saguenay–Lac-Saint-Jean</b><br>Fjord du Saguenay<p lang="fr">Les falaises du Saguenay se dressent au-dessus du fjord.</p><p>萨格奈的峭壁耸立在峡湾上方。</p></figcaption></figure><figure><a href="qc-09.jpg"><img loading="lazy" width="960" height="640" src="qc-09.jpg" alt="Monolithes de Mingan"></a><figcaption><b>Côte-Nord</b><br>Monolithes de Mingan<p lang="fr">À Mingan, la mer sculpte les monolithes de calcaire.</p><p>在明安，大海雕刻着石灰岩石柱。</p></figcaption></figure><figure><a href="qc-11.jpg"><img loading="lazy" width="960" height="640" src="qc-11.jpg" alt="Rocher Percé"></a><figcaption><b>Gaspésie–Îles-de-la-Madeleine</b><br>Rocher Percé<p lang="fr">Le rocher Percé ouvre une arche sur le golfe.</p><p>佩尔塞岩朝海湾敞开一座天然拱门。</p></figcaption></figure><figure><a href="qc-14.jpg"><img loading="lazy" width="960" height="640" src="qc-14.jpg" alt="Lac Taureau"></a><figcaption><b>Lanaudière</b><br>Lac Taureau<p lang="fr">Au lac Taureau, les plages rencontrent la forêt.</p><p>在托罗湖，沙滩与森林相遇。</p></figcaption></figure><figure><a href="qc-15.jpg"><img loading="lazy" width="960" height="640" src="qc-15.jpg" alt="Mont-Tremblant"></a><figcaption><b>Laurentides</b><br>Mont-Tremblant<p lang="fr">À Mont-Tremblant, les toits colorés répondent aux couleurs des arbres.</p><p>在蒙特朗布朗，彩色屋顶与树木的色彩交相呼应。</p></figcaption></figure><figure><a href="qc-07.jpg"><img loading="lazy" width="960" height="640" src="qc-07.jpg" alt="Musée canadien de l’histoire"></a><figcaption><b>Outaouais</b><br>Musée canadien de l’histoire<p lang="fr">À Gatineau, les courbes du musée accompagnent la rivière.</p><p>在加蒂诺，博物馆的曲线伴随着河流。</p></figcaption></figure><figure><a href="qc-08.jpg"><img loading="lazy" width="960" height="640" src="qc-08.jpg" alt="Cité de l’Or · Bourlamaque"></a><figcaption><b>Abitibi-Témiscamingue</b><br>Cité de l’Or · Bourlamaque<p lang="fr">À Val-d’Or, le chevalement rappelle l’histoire des mines.</p><p>在瓦尔多，矿井井架让人想起采矿的历史。</p></figcaption></figure><figure><a href="qc-10.jpg"><img loading="lazy" width="960" height="640" src="qc-10.jpg" alt="Cratère des Pingualuit"></a><figcaption><b>Nord-du-Québec</b><br>Cratère des Pingualuit<p lang="fr">Au Nunavik, le cratère des Pingualuit abrite un lac presque circulaire.</p><p>在努纳维克，平加卢伊特陨石坑中藏着一片近乎圆形的湖泊。</p></figcaption></figure><figure><a href="be-bru.jpg"><img loading="lazy" width="960" height="640" src="be-bru.jpg" alt="Grand-Place"></a><figcaption><b>Bruxelles-Capitale</b><br>Grand-Place<p lang="fr">Sur la Grand-Place, les façades dorées entourent les pavés.</p><p>大广场上，金色立面环绕着石铺地面。</p></figcaption></figure><figure><a href="be-brw.jpg"><img loading="lazy" width="960" height="640" src="be-brw.jpg" alt="Butte du Lion · Waterloo"></a><figcaption><b>Brabant wallon</b><br>Butte du Lion · Waterloo<p lang="fr">À Waterloo, l’escalier monte jusqu’au lion de la butte.</p><p>在滑铁卢，阶梯一直通向丘顶的雄狮。</p></figcaption></figure><figure><a href="be-hai.jpg"><img loading="lazy" width="960" height="640" src="be-hai.jpg" alt="Cathédrale de Tournai"></a><figcaption><b>Hainaut</b><br>Cathédrale de Tournai<p lang="fr">À Tournai, cinq tours dominent les toits de la ville.</p><p>在图尔奈，五座塔楼俯瞰着城市屋顶。</p></figcaption></figure><figure><a href="be-nam.jpg"><img loading="lazy" width="960" height="640" src="be-nam.jpg" alt="Citadelle de Namur"></a><figcaption><b>Namur</b><br>Citadelle de Namur<p lang="fr">À Namur, la citadelle veille sur la rencontre des deux rivières.</p><p>在那慕尔，城堡守望着两条河流的交汇。</p></figcaption></figure><figure><a href="be-lie.jpg"><img loading="lazy" width="960" height="640" src="be-lie.jpg" alt="Montagne de Bueren"></a><figcaption><b>Liège</b><br>Montagne de Bueren<p lang="fr">À Liège, les marches de Bueren invitent à prendre de la hauteur.</p><p>在列日，布伦山的阶梯邀人登高远望。</p></figcaption></figure><figure><a href="be-lux.jpg"><img loading="lazy" width="960" height="640" src="be-lux.jpg" alt="Château de Bouillon"></a><figcaption><b>Luxembourg belge</b><br>Château de Bouillon<p lang="fr">Le château de Bouillon surplombe un méandre de la Semois.</p><p>布永城堡俯瞰着瑟穆瓦河的一道弯流。</p></figcaption></figure><figure><a href="ch-ge.jpg"><img loading="lazy" width="960" height="640" src="ch-ge.jpg" alt="Jet d’eau"></a><figcaption><b>Genève</b><br>Jet d’eau<p lang="fr">À Genève, le Jet d’eau dessine une ligne blanche au-dessus du lac.</p><p>在日内瓦，大喷泉在湖面上方画出一道白线。</p></figcaption></figure><figure><a href="ch-vd.jpg"><img loading="lazy" width="960" height="640" src="ch-vd.jpg" alt="Château de Chillon"></a><figcaption><b>Vaud</b><br>Château de Chillon<p lang="fr">Le château de Chillon semble posé sur les eaux du Léman.</p><p>西庸城堡仿佛安放在莱芒湖的水面上。</p></figcaption></figure><figure><a href="ch-fr.jpg"><img loading="lazy" width="960" height="640" src="ch-fr.jpg" alt="Pont de Berne · Fribourg"></a><figcaption><b>Fribourg</b><br>Pont de Berne · Fribourg<p lang="fr">À Fribourg, le pont couvert traverse la Sarine au pied de la vieille ville.</p><p>在弗里堡，廊桥横跨老城脚下的萨林河。</p></figcaption></figure><figure><a href="ch-ne.jpg"><img loading="lazy" width="960" height="640" src="ch-ne.jpg" alt="Creux du Van"></a><figcaption><b>Neuchâtel</b><br>Creux du Van<p lang="fr">Au Creux du Van, la falaise dessine un immense demi-cercle.</p><p>在万谷岩壁，峭壁勾勒出一个巨大的半圆。</p></figcaption></figure><figure><a href="ch-ju.jpg"><img loading="lazy" width="960" height="640" src="ch-ju.jpg" alt="Étang de la Gruère"></a><figcaption><b>Jura</b><br>Étang de la Gruère<p lang="fr">Dans le Jura, les sapins se reflètent dans l’étang de la Gruère.</p><p>在汝拉，冷杉倒映在格吕埃尔池塘中。</p></figcaption></figure><figure><a href="ch-be.jpg"><img loading="lazy" width="960" height="640" src="ch-be.jpg" alt="Lac de Bienne · île Saint-Pierre"></a><figcaption><b>Berne · région francophone</b><br>Lac de Bienne · île Saint-Pierre<p lang="fr">Sur le lac de Bienne, l’île Saint-Pierre offre une pause au bord de l’eau.</p><p>在比尔湖上，圣皮埃尔岛让人享受水边的片刻宁静。</p></figcaption></figure><figure><a href="ch-vs.jpg"><img loading="lazy" width="960" height="640" src="ch-vs.jpg" alt="Valère et Tourbillon · Sion"></a><figcaption><b>Valais</b><br>Valère et Tourbillon · Sion<p lang="fr">À Sion, Valère et Tourbillon se répondent au-dessus des vignes.</p><p>在锡永，瓦莱尔与图尔比永在葡萄园上方遥相呼应。</p></figcaption></figure></main></html>
