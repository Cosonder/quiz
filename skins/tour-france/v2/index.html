<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法国与巴黎 · 53 张地标明信片</title><style>body{max-width:1300px;margin:auto;padding:24px;background:#f7f3e9;color:#243b34;font:16px/1.5 system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}figure{margin:0;background:white;border-radius:12px;overflow:hidden}img{width:100%;height:auto;display:block}figcaption{padding:16px}p{margin:.5em 0}h1{font-size:1.6rem}a{color:#305793}nav{display:flex;gap:18px;flex-wrap:wrap;margin:20px 0}.mapwrap{overflow:auto;max-height:600px;border:1px solid #c5d1d1}.map{position:relative}.map>a{position:absolute;transform:translate(-50%,-50%);width:100px;background:white;box-shadow:0 2px 5px #4566;font:10px/18px system-ui;text-align:center;border-radius:4px}.map>a img{width:100px;height:48px;object-fit:cover}.map>a span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style><h1>法国与巴黎 · 53 张地标明信片</h1><p>法国城市 26 张 · 巴黎 20 区 · 周边 7 省。960 × 640 像素。建筑与风景为像素艺术化演绎。</p><nav><a href="maps.html">查看新版地标地图</a><a href="../legacy-1.9.46/index.html">旧图存档</a><a href="map-sources.md">地图数据来源</a><a href="../../../french/">回到学习网页</a></nav><main><figure id="paris"><a href="cards/paris.jpg"><img loading="lazy" width="960" height="640" src="cards/paris.jpg" alt="Paris · la Seine"></a><figcaption><b>Paris · 巴黎</b><br>Paris · la Seine<p lang="fr">Paris est la capitale de la France. On y trouve la tour Eiffel, construite pour l&#x27;Exposition universelle de 1889. Le soir, on peut se promener le long de la Seine et admirer les monuments illuminés.</p><p>巴黎是法国的首都。这里有为 1889 年世界博览会建造的埃菲尔铁塔。晚上可以沿着塞纳河散步，欣赏灯火通明的名胜古迹。</p><a href="../legacy-1.9.46/cards/paris.svg">查看旧图</a></figcaption></figure><figure id="versailles"><a href="cards/versailles.jpg"><img loading="lazy" width="960" height="640" src="cards/versailles.jpg" alt="Château de Versailles"></a><figcaption><b>Versailles · 凡尔赛</b><br>Château de Versailles<p lang="fr">Le château de Versailles était la résidence de Louis XIV, le « Roi-Soleil ». Sa galerie des Glaces et ses immenses jardins attirent des millions de visiteurs chaque année.</p><p>凡尔赛宫曾是“太阳王”路易十四的居所。宫里的镜厅和广阔的花园每年吸引数百万游客。</p><a href="../legacy-1.9.46/cards/versailles.svg">查看旧图</a></figcaption></figure><figure id="marseille"><a href="cards/marseille.jpg"><img loading="lazy" width="960" height="640" src="cards/marseille.jpg" alt="Vieux-Port et Notre-Dame-de-la-Garde"></a><figcaption><b>Marseille · 马赛</b><br>Vieux-Port et Notre-Dame-de-la-Garde<p lang="fr">Marseille est la plus ancienne ville de France : elle a été fondée par des Grecs il y a plus de 2 600 ans. Du haut de sa colline, la basilique Notre-Dame-de-la-Garde veille sur le port et sur la mer.</p><p>马赛是法国最古老的城市，两千六百多年前由希腊人建立。守护圣母圣殿坐落在山顶，守望着港口和大海。</p><a href="../legacy-1.9.46/cards/marseille.svg">查看旧图</a></figcaption></figure><figure id="nice"><a href="cards/nice.jpg"><img loading="lazy" width="960" height="640" src="cards/nice.jpg" alt="Promenade des Anglais"></a><figcaption><b>Nice · 尼斯</b><br>Promenade des Anglais<p lang="fr">À Nice, la promenade des Anglais longe la mer sur sept kilomètres. Les habitants s&#x27;y assoient sur les célèbres chaises bleues pour regarder le soleil se coucher sur la Méditerranée.</p><p>在尼斯，英国人漫步大道沿着海边延伸七公里。当地人坐在著名的蓝色椅子上，看太阳落入地中海。</p><a href="../legacy-1.9.46/cards/nice.svg">查看旧图</a></figcaption></figure><figure id="lyon"><a href="cards/lyon.jpg"><img loading="lazy" width="960" height="640" src="cards/lyon.jpg" alt="Fourvière et les quais de Saône"></a><figcaption><b>Lyon · 里昂</b><br>Fourvière et les quais de Saône<p lang="fr">Lyon se trouve au confluent du Rhône et de la Saône. On l&#x27;appelle souvent la capitale de la gastronomie. Sur la colline, la basilique de Fourvière domine la ville.</p><p>里昂位于罗讷河与索恩河的交汇处，常被称为美食之都。富维耶圣母院矗立在山丘上，俯瞰全城。</p><a href="../legacy-1.9.46/cards/lyon.svg">查看旧图</a></figcaption></figure><figure id="annecy"><a href="cards/annecy.jpg"><img loading="lazy" width="960" height="640" src="cards/annecy.jpg" alt="Palais de l’Isle"></a><figcaption><b>Annecy · 安纳西</b><br>Palais de l’Isle<p lang="fr">Annecy est surnommée la « Venise des Alpes » à cause de ses canaux. Le palais de l&#x27;Isle, une ancienne prison en forme de bateau, se trouve au milieu de la rivière. Son lac est l&#x27;un des plus purs d&#x27;Europe.</p><p>安纳西因城中的运河被称为“阿尔卑斯山的威尼斯”。岛宫曾是一座监狱，形状像一条船，就立在河中央。安纳西湖是欧洲最清澈的湖泊之一。</p><a href="../legacy-1.9.46/cards/annecy.svg">查看旧图</a></figcaption></figure><figure id="bordeaux"><a href="cards/bordeaux.jpg"><img loading="lazy" width="960" height="640" src="cards/bordeaux.jpg" alt="Place de la Bourse et miroir d’eau"></a><figcaption><b>Bordeaux · 波尔多</b><br>Place de la Bourse et miroir d’eau<p lang="fr">Bordeaux est connue dans le monde entier pour ses vins. Devant la place de la Bourse, le miroir d&#x27;eau reflète les façades du XVIIIe siècle : c&#x27;est le plus grand miroir d&#x27;eau du monde.</p><p>波尔多以葡萄酒闻名世界。交易所广场前的水镜倒映着 18 世纪的建筑立面，它是世界上最大的水镜。</p><a href="../legacy-1.9.46/cards/bordeaux.svg">查看旧图</a></figcaption></figure><figure id="biarritz"><a href="cards/biarritz.jpg"><img loading="lazy" width="960" height="640" src="cards/biarritz.jpg" alt="Rocher de la Vierge"></a><figcaption><b>Biarritz · 比亚里茨</b><br>Rocher de la Vierge<p lang="fr">Biarritz, au Pays basque, est une ville de surf. Le rocher de la Vierge, relié à la côte par une passerelle, résiste aux grosses vagues de l&#x27;océan Atlantique.</p><p>比亚里茨位于巴斯克地区，是一座冲浪小城。圣母岩由一座小桥与海岸相连，迎着大西洋的巨浪屹立不倒。</p><a href="../legacy-1.9.46/cards/biarritz.svg">查看旧图</a></figcaption></figure><figure id="toulouse"><a href="cards/toulouse.jpg"><img loading="lazy" width="960" height="640" src="cards/toulouse.jpg" alt="Capitole de Toulouse"></a><figcaption><b>Toulouse · 图卢兹</b><br>Capitole de Toulouse<p lang="fr">On appelle Toulouse la « Ville rose » à cause de la couleur de ses briques. C&#x27;est aussi la capitale européenne de l&#x27;aéronautique : les avions Airbus y sont assemblés.</p><p>图卢兹因砖墙的颜色被称为“玫瑰之城”。它也是欧洲的航空之都，空客飞机就在这里组装。</p><a href="../legacy-1.9.46/cards/toulouse.svg">查看旧图</a></figcaption></figure><figure id="carcassonne"><a href="cards/carcassonne.jpg"><img loading="lazy" width="960" height="640" src="cards/carcassonne.jpg" alt="Cité de Carcassonne"></a><figcaption><b>Carcassonne · 卡尔卡松</b><br>Cité de Carcassonne<p lang="fr">La Cité de Carcassonne est une ville fortifiée du Moyen Âge. Avec ses 52 tours et ses deux enceintes de remparts, elle ressemble à un château de conte de fées.</p><p>卡尔卡松古城是一座中世纪的要塞城市。它有 52 座塔楼和两道城墙，看起来像童话里的城堡。</p><a href="../legacy-1.9.46/cards/carcassonne.svg">查看旧图</a></figcaption></figure><figure id="rennes"><a href="cards/rennes.jpg"><img loading="lazy" width="960" height="640" src="cards/rennes.jpg" alt="Maisons à colombages"></a><figcaption><b>Rennes · 雷恩</b><br>Maisons à colombages<p lang="fr">Rennes est la capitale de la Bretagne. Dans le centre historique, les maisons à colombages aux couleurs vives datent du Moyen Âge. C&#x27;est une ville très étudiante et animée.</p><p>雷恩是布列塔尼的首府。老城区里色彩鲜艳的木筋屋可以追溯到中世纪。这是一座学生众多、充满活力的城市。</p><a href="../legacy-1.9.46/cards/rennes.svg">查看旧图</a></figcaption></figure><figure id="saintmalo"><a href="cards/saintmalo.jpg"><img loading="lazy" width="960" height="640" src="cards/saintmalo.jpg" alt="Remparts de Saint-Malo"></a><figcaption><b>Saint-Malo · 圣马洛</b><br>Remparts de Saint-Malo<p lang="fr">Saint-Malo est entourée de remparts. Autrefois, c&#x27;était la ville des corsaires. À marée basse, on peut marcher jusqu&#x27;à de petites îles ; à marée haute, la mer arrive au pied des murs.</p><p>圣马洛被城墙环绕，从前是海盗之城。退潮时可以步行走到附近的小岛；涨潮时，海水一直漫到城墙脚下。</p><a href="../legacy-1.9.46/cards/saintmalo.svg">查看旧图</a></figcaption></figure><figure id="rouen"><a href="cards/rouen.jpg"><img loading="lazy" width="960" height="640" src="cards/rouen.jpg" alt="Gros-Horloge"></a><figcaption><b>Rouen · 鲁昂</b><br>Gros-Horloge<p lang="fr">À Rouen, le Gros-Horloge est une horloge astronomique de la Renaissance placée sur une arche, au-dessus d&#x27;une rue. C&#x27;est aussi dans cette ville que Jeanne d&#x27;Arc est morte en 1431.</p><p>在鲁昂，大钟是一座文艺复兴时期的天文钟，架在一条街道上方的拱门上。圣女贞德也是 1431 年在这座城市牺牲的。</p><a href="../legacy-1.9.46/cards/rouen.svg">查看旧图</a></figcaption></figure><figure id="montsaintmichel"><a href="cards/montsaintmichel.jpg"><img loading="lazy" width="960" height="640" src="cards/montsaintmichel.jpg" alt="Abbaye du Mont-Saint-Michel"></a><figcaption><b>Le Mont-Saint-Michel · 圣米歇尔山</b><br>Abbaye du Mont-Saint-Michel<p lang="fr">Le Mont-Saint-Michel est une abbaye construite sur un rocher, au milieu d&#x27;une baie. Les marées y sont parmi les plus fortes d&#x27;Europe : parfois, la mer entoure complètement le mont.</p><p>圣米歇尔山是建在海湾中央一块岩石上的修道院。这里的潮汐是欧洲最强的之一，有时海水会把整座山完全包围。</p><a href="../legacy-1.9.46/cards/montsaintmichel.svg">查看旧图</a></figcaption></figure><figure id="strasbourg"><a href="cards/strasbourg.jpg"><img loading="lazy" width="960" height="640" src="cards/strasbourg.jpg" alt="Petite France et cathédrale"></a><figcaption><b>Strasbourg · 斯特拉斯堡</b><br>Petite France et cathédrale<p lang="fr">Strasbourg est le siège du Parlement européen. Sa cathédrale en grès rose a une seule flèche, haute de 142 mètres. Dans le quartier de la Petite France, les maisons à colombages se reflètent dans les canaux.</p><p>斯特拉斯堡是欧洲议会所在地。用粉红砂岩建成的大教堂只有一座尖塔，高 142 米。在小法兰西区，木筋屋倒映在运河里。</p><a href="../legacy-1.9.46/cards/strasbourg.svg">查看旧图</a></figcaption></figure><figure id="reims"><a href="cards/reims.jpg"><img loading="lazy" width="960" height="640" src="cards/reims.jpg" alt="Cathédrale Notre-Dame de Reims"></a><figcaption><b>Reims · 兰斯</b><br>Cathédrale Notre-Dame de Reims<p lang="fr">Les rois de France étaient couronnés dans la cathédrale de Reims. Aujourd&#x27;hui, la ville est surtout célèbre pour le champagne, qu&#x27;on fait vieillir dans des caves creusées sous la terre.</p><p>法国国王曾在兰斯大教堂加冕。如今这座城市最出名的是香槟酒，它们在地下挖出的酒窖里慢慢陈酿。</p><a href="../legacy-1.9.46/cards/reims.svg">查看旧图</a></figcaption></figure><figure id="lille"><a href="cards/lille.jpg"><img loading="lazy" width="960" height="640" src="cards/lille.jpg" alt="Grand-Place et Vieille Bourse"></a><figcaption><b>Lille · 里尔</b><br>Grand-Place et Vieille Bourse<p lang="fr">Lille est une grande ville proche de la Belgique. Son beffroi est inscrit au patrimoine mondial de l&#x27;UNESCO. Chaque septembre, la Braderie de Lille devient le plus grand marché aux puces d&#x27;Europe.</p><p>里尔是一座靠近比利时的大城市，它的钟楼被列入联合国教科文组织世界遗产。每年九月，里尔大集市都会变成欧洲最大的跳蚤市场。</p><a href="../legacy-1.9.46/cards/lille.svg">查看旧图</a></figcaption></figure><figure id="amiens"><a href="cards/amiens.jpg"><img loading="lazy" width="960" height="640" src="cards/amiens.jpg" alt="Hortillonnages et cathédrale"></a><figcaption><b>Amiens · 亚眠</b><br>Hortillonnages et cathédrale<p lang="fr">À Amiens, les hortillonnages sont des jardins flottants entourés de canaux. On les visite en barque, au calme. La ville possède aussi la plus grande cathédrale gothique de France.</p><p>在亚眠，水上花园是被运河环绕的漂浮园地，可以坐小船静静游览。这座城市还拥有法国最大的哥特式大教堂。</p><a href="../legacy-1.9.46/cards/amiens.svg">查看旧图</a></figcaption></figure><figure id="chambord"><a href="cards/chambord.jpg"><img loading="lazy" width="960" height="640" src="cards/chambord.jpg" alt="Château de Chambord"></a><figcaption><b>Chambord · 香波尔</b><br>Château de Chambord<p lang="fr">Le château de Chambord est le plus grand des châteaux de la Loire. Son célèbre escalier à double révolution a peut-être été imaginé par Léonard de Vinci : deux personnes peuvent le monter sans jamais se croiser.</p><p>香波尔城堡是卢瓦尔河谷最大的城堡。它著名的双螺旋楼梯据说出自达·芬奇的构想：两个人同时上楼，却永远不会碰面。</p><a href="../legacy-1.9.46/cards/chambord.svg">查看旧图</a></figcaption></figure><figure id="chenonceau"><a href="cards/chenonceau.jpg"><img loading="lazy" width="960" height="640" src="cards/chenonceau.jpg" alt="Château de Chenonceau"></a><figcaption><b>Chenonceau · 舍农索</b><br>Château de Chenonceau<p lang="fr">Le château de Chenonceau est construit sur des arches au-dessus du Cher. On l&#x27;appelle le « château des Dames », car plusieurs femmes célèbres l&#x27;ont habité et transformé.</p><p>舍农索城堡建在谢尔河上的一排拱桥上。它被称为“女人的城堡”，因为好几位著名的女性曾住在这里并改建了它。</p><a href="../legacy-1.9.46/cards/chenonceau.svg">查看旧图</a></figcaption></figure><figure id="nantes"><a href="cards/nantes.jpg"><img loading="lazy" width="960" height="640" src="cards/nantes.jpg" alt="Grand Éléphant des Machines de l’île"></a><figcaption><b>Nantes · 南特</b><br>Grand Éléphant des Machines de l’île<p lang="fr">À Nantes, les Machines de l&#x27;île présentent un éléphant mécanique de douze mètres de haut. Il se promène avec des passagers sur le dos ! Nantes est aussi la ville natale de Jules Verne.</p><p>在南特，“岛上机器”展出一头 12 米高的机械大象，它会驮着乘客四处走动！南特也是儒勒·凡尔纳的故乡。</p><a href="../legacy-1.9.46/cards/nantes.svg">查看旧图</a></figcaption></figure><figure id="angers"><a href="cards/angers.jpg"><img loading="lazy" width="960" height="640" src="cards/angers.jpg" alt="Château d’Angers"></a><figcaption><b>Angers · 昂热</b><br>Château d’Angers<p lang="fr">Le château d&#x27;Angers a dix-sept grosses tours rayées de pierre sombre et de pierre claire. À l&#x27;intérieur, on peut voir la tapisserie de l&#x27;Apocalypse, la plus grande tapisserie médiévale au monde.</p><p>昂热城堡有十七座粗大的塔楼，深色和浅色的石头交替成条纹。城堡里收藏着《启示录》挂毯，它是世界上最大的中世纪挂毯。</p><a href="../legacy-1.9.46/cards/angers.svg">查看旧图</a></figcaption></figure><figure id="dijon"><a href="cards/dijon.jpg"><img loading="lazy" width="960" height="640" src="cards/dijon.jpg" alt="Chouette de Notre-Dame"></a><figcaption><b>Dijon · 第戎</b><br>Chouette de Notre-Dame<p lang="fr">Dijon est célèbre pour sa moutarde. Dans la vieille ville, une petite chouette est sculptée sur un mur de l&#x27;église Notre-Dame : on dit qu&#x27;elle porte bonheur si on la touche de la main gauche.</p><p>第戎以芥末闻名。在老城的圣母教堂墙上，雕着一只小猫头鹰。据说用左手摸一摸它就会带来好运。</p><a href="../legacy-1.9.46/cards/dijon.svg">查看旧图</a></figcaption></figure><figure id="beaune"><a href="cards/beaune.jpg"><img loading="lazy" width="960" height="640" src="cards/beaune.jpg" alt="Hospices de Beaune"></a><figcaption><b>Beaune · 博讷</b><br>Hospices de Beaune<p lang="fr">Beaune est au cœur des vignobles de Bourgogne. Les Hospices de Beaune, un ancien hôpital du XVe siècle, sont connus pour leurs toits couverts de tuiles colorées.</p><p>博讷位于勃艮第葡萄园的中心。博讷济贫院原是一座 15 世纪的医院，以屋顶上色彩缤纷的瓦片闻名。</p><a href="../legacy-1.9.46/cards/beaune.svg">查看旧图</a></figcaption></figure><figure id="ajaccio"><a href="cards/ajaccio.jpg"><img loading="lazy" width="960" height="640" src="cards/ajaccio.jpg" alt="Îles Sanguinaires"></a><figcaption><b>Ajaccio · 阿雅克肖</b><br>Îles Sanguinaires<p lang="fr">Ajaccio est la ville natale de Napoléon Bonaparte. Le soir, les îles Sanguinaires prennent une couleur rouge au coucher du soleil, à côté d&#x27;une vieille tour génoise.</p><p>阿雅克肖是拿破仑·波拿巴的故乡。傍晚，血岛在夕阳下染成红色，旁边是一座古老的热那亚塔。</p><a href="../legacy-1.9.46/cards/ajaccio.svg">查看旧图</a></figcaption></figure><figure id="bonifacio"><a href="cards/bonifacio.jpg"><img loading="lazy" width="960" height="640" src="cards/bonifacio.jpg" alt="Falaises de Bonifacio"></a><figcaption><b>Bonifacio · 博尼法乔</b><br>Falaises de Bonifacio<p lang="fr">À Bonifacio, les maisons sont construites tout au bord de hautes falaises blanches. Par beau temps, on peut voir la Sardaigne, qui se trouve de l&#x27;autre côté de la mer.</p><p>在博尼法乔，房屋就建在高高的白色悬崖边上。天气好的时候，可以望见大海对岸的撒丁岛。</p><a href="../legacy-1.9.46/cards/bonifacio.svg">查看旧图</a></figcaption></figure><figure id="p1"><a href="cards/p1.jpg"><img loading="lazy" width="960" height="640" src="cards/p1.jpg" alt="Pyramide du Louvre"></a><figcaption><b>1er · Louvre · 第 1 区 · 卢浮宫</b><br>Pyramide du Louvre<p lang="fr">Le musée du Louvre est le musée le plus visité du monde. Devant le palais, la pyramide de verre, inaugurée en 1989, sert d&#x27;entrée principale.</p><p>卢浮宫是世界上参观人数最多的博物馆。宫殿前的玻璃金字塔于 1989 年落成，是博物馆的主入口。</p><a href="../legacy-1.9.46/cards/p1.svg">查看旧图</a></figcaption></figure><figure id="p2"><a href="cards/p2.jpg"><img loading="lazy" width="960" height="640" src="cards/p2.jpg" alt="Galerie Vivienne"></a><figcaption><b>2e · Bourse · 第 2 区 · 交易所</b><br>Galerie Vivienne<p lang="fr">Le palais Brongniart, avec ses grandes colonnes, a abrité la Bourse de Paris pendant plus de 150 ans. Le quartier est aussi connu pour ses passages couverts, comme la galerie Vivienne.</p><p>布龙尼亚尔宫有一排高大的柱子，巴黎证券交易所在这里办公了 150 多年。这个街区还以带顶棚的廊街闻名，比如薇薇安廊街。</p><a href="../legacy-1.9.46/cards/p2.svg">查看旧图</a></figcaption></figure><figure id="p3"><a href="cards/p3.jpg"><img loading="lazy" width="960" height="640" src="cards/p3.jpg" alt="Hôtel de Soubise"></a><figcaption><b>3e · Temple · 第 3 区 · 苏比斯府邸</b><br>Hôtel de Soubise<p lang="fr">Dans le Marais, l’hôtel de Soubise abrite le musée des Archives nationales. Sa cour est bordée d’une élégante colonnade.</p><p>在玛黑区，苏比斯府邸设有法国国家档案馆博物馆，庭院周围是一圈优雅的柱廊。</p><a href="../legacy-1.9.46/cards/p3.svg">查看旧图</a></figcaption></figure><figure id="p4"><a href="cards/p4.jpg"><img loading="lazy" width="960" height="640" src="cards/p4.jpg" alt="Notre-Dame de Paris"></a><figcaption><b>4e · Hôtel-de-Ville · 第 4 区 · 巴黎圣母院</b><br>Notre-Dame de Paris<p lang="fr">La cathédrale Notre-Dame se trouve sur l&#x27;île de la Cité. Après le grand incendie de 2019, elle a rouvert ses portes en décembre 2024.</p><p>巴黎圣母院坐落在西岱岛上。经历 2019 年的大火之后，它于 2024 年 12 月重新开放。</p><a href="../legacy-1.9.46/cards/p4.svg">查看旧图</a></figcaption></figure><figure id="p5"><a href="cards/p5.jpg"><img loading="lazy" width="960" height="640" src="cards/p5.jpg" alt="Panthéon"></a><figcaption><b>5e · Panthéon · 第 5 区 · 先贤祠</b><br>Panthéon<p lang="fr">Au cœur du Quartier latin, le Panthéon abrite les tombeaux de grandes figures françaises, comme Victor Hugo, Marie Curie et Simone Veil.</p><p>先贤祠位于拉丁区的中心，安葬着许多法国伟人，比如维克多·雨果、玛丽·居里和西蒙娜·韦伊。</p><a href="../legacy-1.9.46/cards/p5.svg">查看旧图</a></figcaption></figure><figure id="p6"><a href="cards/p6.jpg"><img loading="lazy" width="960" height="640" src="cards/p6.jpg" alt="Jardin du Luxembourg"></a><figcaption><b>6e · Luxembourg · 第 6 区 · 卢森堡公园</b><br>Jardin du Luxembourg<p lang="fr">Au jardin du Luxembourg, les enfants font naviguer de petits voiliers sur le grand bassin. Le palais, au fond, accueille le Sénat.</p><p>在卢森堡公园，孩子们在大水池里放小帆船。远处的宫殿是法国参议院所在地。</p><a href="../legacy-1.9.46/cards/p6.svg">查看旧图</a></figcaption></figure><figure id="p7"><a href="cards/p7.jpg"><img loading="lazy" width="960" height="640" src="cards/p7.jpg" alt="Tour Eiffel · Champ-de-Mars"></a><figcaption><b>7e · Palais-Bourbon · 第 7 区 · 埃菲尔铁塔</b><br>Tour Eiffel · Champ-de-Mars<p lang="fr">La tour Eiffel mesure environ 330 mètres. Le soir, elle scintille pendant cinq minutes au début de chaque heure.</p><p>埃菲尔铁塔高约 330 米。晚上每到整点，它都会闪烁五分钟。</p><a href="../legacy-1.9.46/cards/p7.svg">查看旧图</a></figcaption></figure><figure id="p8"><a href="cards/p8.jpg"><img loading="lazy" width="960" height="640" src="cards/p8.jpg" alt="Arc de Triomphe"></a><figcaption><b>8e · Élysée · 第 8 区 · 凯旋门</b><br>Arc de Triomphe<p lang="fr">L&#x27;Arc de Triomphe se dresse en haut des Champs-Élysées. Sous l&#x27;arc repose le Soldat inconnu, et une flamme y est ravivée chaque soir.</p><p>凯旋门矗立在香榭丽舍大街的尽头。拱门下安葬着无名烈士，每天傍晚都会重新点燃那里的长明火。</p><a href="../legacy-1.9.46/cards/p8.svg">查看旧图</a></figcaption></figure><figure id="p9"><a href="cards/p9.jpg"><img loading="lazy" width="960" height="640" src="cards/p9.jpg" alt="Palais Garnier"></a><figcaption><b>9e · Opéra · 第 9 区 · 加尼叶歌剧院</b><br>Palais Garnier<p lang="fr">L&#x27;Opéra Garnier, inauguré en 1875, est célèbre pour son grand escalier de marbre et pour son plafond peint par Marc Chagall.</p><p>加尼叶歌剧院于 1875 年落成，以大理石大楼梯和马克·夏加尔绘制的天顶画闻名。</p><a href="../legacy-1.9.46/cards/p9.svg">查看旧图</a></figcaption></figure><figure id="p10"><a href="cards/p10.jpg"><img loading="lazy" width="960" height="640" src="cards/p10.jpg" alt="Canal Saint-Martin"></a><figcaption><b>10e · Entrepôt · 第 10 区 · 圣马丁运河</b><br>Canal Saint-Martin<p lang="fr">Le long du canal Saint-Martin, on traverse l&#x27;eau par de jolies passerelles en fer. Aux beaux jours, les Parisiens pique-niquent sur ses quais.</p><p>沿着圣马丁运河，可以走过一座座漂亮的铁制小桥。天气好的时候，巴黎人会在河岸上野餐。</p><a href="../legacy-1.9.46/cards/p10.svg">查看旧图</a></figcaption></figure><figure id="p11"><a href="cards/p11.jpg"><img loading="lazy" width="960" height="640" src="cards/p11.jpg" alt="Colonne de Juillet · Bastille"></a><figcaption><b>11e · Popincourt · 第 11 区 · 巴士底</b><br>Colonne de Juillet · Bastille<p lang="fr">La colonne de Juillet se dresse place de la Bastille, là où la prison a été prise le 14 juillet 1789. Tout en haut, le Génie de la Liberté brille en or.</p><p>七月柱矗立在巴士底广场，1789 年 7 月 14 日巴士底狱就是在这里被攻占的。柱顶的自由之神闪着金光。</p><a href="../legacy-1.9.46/cards/p11.svg">查看旧图</a></figcaption></figure><figure id="p12"><a href="cards/p12.jpg"><img loading="lazy" width="960" height="640" src="cards/p12.jpg" alt="Gare de Lyon"></a><figcaption><b>12e · Reuilly · 第 12 区 · 里昂火车站</b><br>Gare de Lyon<p lang="fr">La gare de Lyon se reconnaît à sa haute tour de l&#x27;horloge. C&#x27;est de là que partent les TGV vers le sud de la France.</p><p>里昂火车站的标志是那座高高的钟楼。开往法国南部的高铁就从这里出发。</p><a href="../legacy-1.9.46/cards/p12.svg">查看旧图</a></figcaption></figure><figure id="p13"><a href="cards/p13.jpg"><img loading="lazy" width="960" height="640" src="cards/p13.jpg" alt="Bibliothèque François-Mitterrand"></a><figcaption><b>13e · Gobelins · 第 13 区 · 法国国家图书馆</b><br>Bibliothèque François-Mitterrand<p lang="fr">La Bibliothèque nationale François-Mitterrand a quatre tours de verre en forme de livres ouverts. Le 13e abrite aussi un grand quartier asiatique.</p><p>密特朗国家图书馆有四座玻璃塔楼，形状像四本打开的书。第 13 区还有一个很大的亚洲街区。</p><a href="../legacy-1.9.46/cards/p13.svg">查看旧图</a></figcaption></figure><figure id="p14"><a href="cards/p14.jpg"><img loading="lazy" width="960" height="640" src="cards/p14.jpg" alt="Observatoire de Paris"></a><figcaption><b>14e · Observatoire · 第 14 区 · 巴黎天文台</b><br>Observatoire de Paris<p lang="fr">Dans le 14e arrondissement, l’Observatoire de Paris associe un bâtiment historique, des coupoles et des jardins. On y étudie le ciel depuis le XVIIe siècle.</p><p>在巴黎第 14 区，巴黎天文台汇集了历史建筑、观测穹顶和花园。从 17 世纪起，人们就在这里研究天空。</p><a href="../legacy-1.9.46/cards/p14.svg">查看旧图</a></figcaption></figure><figure id="p15"><a href="cards/p15.jpg"><img loading="lazy" width="960" height="640" src="cards/p15.jpg" alt="Parc André-Citroën"></a><figcaption><b>15e · Vaugirard · 第 15 区 · 雪铁龙公园</b><br>Parc André-Citroën<p lang="fr">Dans le parc André-Citroën, un grand ballon captif s&#x27;élève à 150 mètres de haut pour admirer Paris vu du ciel.</p><p>在安德烈·雪铁龙公园，一只系留热气球能升到 150 米高，让人从空中欣赏巴黎。</p><a href="../legacy-1.9.46/cards/p15.svg">查看旧图</a></figcaption></figure><figure id="p16"><a href="cards/p16.jpg"><img loading="lazy" width="960" height="640" src="cards/p16.jpg" alt="Trocadéro"></a><figcaption><b>16e · Passy · 第 16 区 · 特罗卡德罗</b><br>Trocadéro<p lang="fr">Depuis l&#x27;esplanade du Trocadéro, on a l&#x27;une des plus belles vues sur la tour Eiffel. En été, ses grandes fontaines rafraîchissent les promeneurs.</p><p>从特罗卡德罗广场可以看到最美的埃菲尔铁塔之一。夏天，这里的大喷泉给游人带来清凉。</p><a href="../legacy-1.9.46/cards/p16.svg">查看旧图</a></figcaption></figure><figure id="p17"><a href="cards/p17.jpg"><img loading="lazy" width="960" height="640" src="cards/p17.jpg" alt="Tribunal de Paris · Batignolles"></a><figcaption><b>17e · Batignolles · 第 17 区 · 巴黎司法院</b><br>Tribunal de Paris · Batignolles<p lang="fr">Dans le quartier des Batignolles, le Tribunal de Paris est un gratte-ciel de verre formé de blocs empilés, conçu par l&#x27;architecte Renzo Piano.</p><p>在巴蒂尼奥勒街区，巴黎司法院是一座由一层层方块叠起来的玻璃摩天楼，由建筑师伦佐·皮亚诺设计。</p><a href="../legacy-1.9.46/cards/p17.svg">查看旧图</a></figcaption></figure><figure id="p18"><a href="cards/p18.jpg"><img loading="lazy" width="960" height="640" src="cards/p18.jpg" alt="Sacré-Cœur · Montmartre"></a><figcaption><b>18e · Butte-Montmartre · 第 18 区 · 蒙马特圣心堂</b><br>Sacré-Cœur · Montmartre<p lang="fr">Sur la butte Montmartre, la basilique du Sacré-Cœur domine la ville. Juste à côté, les peintres de la place du Tertre font le portrait des passants.</p><p>在蒙马特高地上，圣心大教堂俯瞰全城。旁边的小丘广场上，画家们为路人画肖像。</p><a href="../legacy-1.9.46/cards/p18.svg">查看旧图</a></figcaption></figure><figure id="p19"><a href="cards/p19.jpg"><img loading="lazy" width="960" height="640" src="cards/p19.jpg" alt="Temple de la Sibylle"></a><figcaption><b>19e · Buttes-Chaumont · 第 19 区 · 肖蒙山丘公园</b><br>Temple de la Sibylle<p lang="fr">Au parc des Buttes-Chaumont, un petit temple rond se dresse au sommet d&#x27;une falaise, au-dessus d&#x27;un lac.</p><p>在肖蒙山丘公园，一座小小的圆形神庙立在悬崖顶上，下面是一片湖。</p><a href="../legacy-1.9.46/cards/p19.svg">查看旧图</a></figcaption></figure><figure id="p20"><a href="cards/p20.jpg"><img loading="lazy" width="960" height="640" src="cards/p20.jpg" alt="Père-Lachaise"></a><figcaption><b>20e · Ménilmontant · 第 20 区 · 拉雪兹神父公墓</b><br>Père-Lachaise<p lang="fr">Au cimetière du Père-Lachaise reposent de nombreuses célébrités, comme Molière, Chopin et Édith Piaf. C&#x27;est aussi un grand parc arboré.</p><p>拉雪兹神父公墓安葬着许多名人，比如莫里哀、肖邦和伊迪丝·琵雅芙。这里也是一座绿树成荫的大公园。</p><a href="../legacy-1.9.46/cards/p20.svg">查看旧图</a></figcaption></figure><figure id="d92"><a href="cards/d92.jpg"><img loading="lazy" width="960" height="640" src="cards/d92.jpg" alt="Grande Arche de La Défense"></a><figcaption><b>92 · Hauts-de-Seine · 上塞纳省 · 拉德芳斯</b><br>Grande Arche de La Défense<p lang="fr">À La Défense, le grand quartier d&#x27;affaires de la région parisienne, la Grande Arche ressemble à un cube géant ouvert au milieu.</p><p>拉德芳斯是巴黎地区最大的商务区，那里的新凯旋门像一个中间掏空的巨型立方体。</p><a href="../legacy-1.9.46/cards/d92.svg">查看旧图</a></figcaption></figure><figure id="d93"><a href="cards/d93.jpg"><img loading="lazy" width="960" height="640" src="cards/d93.jpg" alt="Stade de France"></a><figcaption><b>93 · Seine-Saint-Denis · 塞纳-圣但尼省 · 法兰西体育场</b><br>Stade de France<p lang="fr">Le Stade de France, à Saint-Denis, accueille les grands matchs de football et de rugby. Il a aussi servi aux Jeux olympiques de 2024.</p><p>位于圣但尼的法兰西体育场举办重大的足球和橄榄球比赛，2024 年奥运会也在这里进行。</p><a href="../legacy-1.9.46/cards/d93.svg">查看旧图</a></figcaption></figure><figure id="d94"><a href="cards/d94.jpg"><img loading="lazy" width="960" height="640" src="cards/d94.jpg" alt="Château de Vincennes"></a><figcaption><b>94 · Val-de-Marne · 马恩河谷省 · 樊尚城堡</b><br>Château de Vincennes<p lang="fr">Le château de Vincennes possède le plus haut donjon médiéval d&#x27;Europe : il mesure environ 50 mètres.</p><p>樊尚城堡拥有欧洲最高的中世纪主塔，高约 50 米。</p><a href="../legacy-1.9.46/cards/d94.svg">查看旧图</a></figcaption></figure><figure id="d95"><a href="cards/d95.jpg"><img loading="lazy" width="960" height="640" src="cards/d95.jpg" alt="Église d’Auvers-sur-Oise"></a><figcaption><b>95 · Val-d&#x27;Oise · 瓦勒德瓦兹省 · 奥维尔教堂</b><br>Église d’Auvers-sur-Oise<p lang="fr">À Auvers-sur-Oise, Vincent van Gogh a peint l&#x27;église du village. Il a passé les derniers mois de sa vie dans cette petite ville.</p><p>在瓦兹河畔奥维尔，文森特·梵高画下了村里的教堂。他在这座小城度过了生命的最后几个月。</p><a href="../legacy-1.9.46/cards/d95.svg">查看旧图</a></figcaption></figure><figure id="d77"><a href="cards/d77.jpg"><img loading="lazy" width="960" height="640" src="cards/d77.jpg" alt="Château de Fontainebleau"></a><figcaption><b>77 · Seine-et-Marne · 塞纳-马恩省 · 枫丹白露</b><br>Château de Fontainebleau<p lang="fr">Le château de Fontainebleau est célèbre pour son escalier en fer à cheval. C&#x27;est là que Napoléon a fait ses adieux à sa garde en 1814.</p><p>枫丹白露宫以马蹄形楼梯闻名。1814 年，拿破仑就是在这里告别了他的近卫军。</p><a href="../legacy-1.9.46/cards/d77.svg">查看旧图</a></figcaption></figure><figure id="d78"><a href="cards/d78.jpg"><img loading="lazy" width="960" height="640" src="cards/d78.jpg" alt="Château de Saint-Germain-en-Laye"></a><figcaption><b>78 · Yvelines · 伊夫林省 · 圣日耳曼昂莱</b><br>Château de Saint-Germain-en-Laye<p lang="fr">C&#x27;est à Saint-Germain-en-Laye qu&#x27;est né Louis XIV. La longue terrasse du château offre une belle vue sur la Seine et sur Paris.</p><p>路易十四就出生在圣日耳曼昂莱。城堡前长长的露台可以远眺塞纳河和巴黎。</p><a href="../legacy-1.9.46/cards/d78.svg">查看旧图</a></figcaption></figure><figure id="d91"><a href="cards/d91.jpg"><img loading="lazy" width="960" height="640" src="cards/d91.jpg" alt="Synchrotron SOLEIL · Saint-Aubin"></a><figcaption><b>91 · Essonne · 埃松省 · 萨克雷同步辐射光源</b><br>Synchrotron SOLEIL · Saint-Aubin<p lang="fr">Sur le plateau de Saclay, le synchrotron SOLEIL est un grand anneau où les scientifiques étudient la matière grâce à une lumière très puissante.</p><p>在萨克雷高原，SOLEIL 同步辐射光源是一座巨大的环形建筑，科学家们用极强的光来研究物质。</p><a href="../legacy-1.9.46/cards/d91.svg">查看旧图</a></figcaption></figure></main></html>
