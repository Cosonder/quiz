const KP = {
  "r1-etre-aux": {"t": "用 être 的复合过去时", "b": "表示位移或状态变化的一组不及物动词（aller、venir、partir、arriver、naître、mourir 等）以及所有代词式动词，复合过去时用 être 作助动词，过去分词要与主语性数配合：Elle est partie tôt. Nous sommes arrivés hier."},
  "r1-cod-before-pp": {"t": "COD 前置时过去分词配合", "b": "以 avoir 为助动词时，过去分词一般不配合；但如果直接宾语出现在动词之前（关系代词 que、宾语代词 le / la / les 等），过去分词就要与这个直接宾语性数配合：la lettre que j'ai écrite、Ces photos, je les ai prises."},
  "r1-pronominal-pp": {"t": "代词式动词的分词配合", "b": "代词式动词用 être，但配合要看反身代词是不是直接宾语：se 是直接宾语时配合（Elle s'est coiffée.）；动词后面另有直接宾语时，se 只是间接宾语，过去分词不配合（Elle s'est coupé le doigt.）。"},
  "r1-il-faut-subj": {"t": "il faut que + 虚拟式", "b": "il faut que 表示必要或义务，从句的动词要用虚拟式现在时，不能用直陈式。常见的不规则虚拟式要单独记：faire → que je fasse，aller → que j'aille，être → que je sois，avoir → que j'aie：Il faut que nous partions."},
  "r1-si-conditionnel": {"t": "si + 未完成过去时 → 条件式", "b": "与现在事实相反的假设：si 从句用未完成过去时，主句用条件式现在时：Si j'étais riche, je voyagerais. 与过去事实相反的假设：si 从句用愈过去时，主句用条件式过去时：S'il avait plu, je serais resté."},
  "r1-dont": {"t": "关系代词 dont", "b": "dont 代替“de + 先行词”，用于要求介词 de 的动词（parler de、avoir besoin de）或名词补语，先行词是人是物都可以：le film dont tout le monde parle、l'ami dont je connais la sœur。动词带 de 时不要误用 que。"},
  "r1-neg-article-de": {"t": "否定句中冠词变 de", "b": "否定句中，作直接宾语的不定冠词和部分冠词（un、une、des、du、de la）都变成 de，元音前写 d'：Je n'ai pas de voiture. Il ne mange pas d'œufs. 定冠词不受影响，否定时保持不变：Je n'aime pas la viande."},
  "r1-direct-indirect-pron": {"t": "直接宾语 la 与间接 lui", "b": "选代词前先看动词怎样接宾语。动词直接接宾语（connaître qn、voir qn、aimer qn）时，用直接宾语代词 le、la、les；动词通过 à 接人（parler à qn、téléphoner à qn）时，用间接宾语代词 lui、leur：Pierre ? Je le vois demain. Je lui téléphone ce soir."},
  "r1-imparfait-habit": {"t": "未完成过去时表过去习惯", "b": "过去反复发生、带习惯性的动作用未完成过去时，常与 souvent、tous les jours、d'habitude 等词连用：Chaque été, nous allions chez ma tante. 一次性、已经完成的动作则用复合过去时：L'été dernier, nous sommes allés en Grèce."},
  "r1-meilleur-mieux": {"t": "meilleur 与 mieux", "b": "形容词 bon 的比较级和最高级不规则，是 meilleur / le meilleur，要随名词配合，不说 *plus bon；副词 bien 的比较级是 mieux，用来修饰动词：Ce vin est meilleur. C'est la meilleure solution. Elle danse mieux que moi."},
  "r2-quantity-de": {"t": "数量词 + de 及例外", "b": "beaucoup、peu、trop、assez 以及 un kilo、une bouteille 等数量表达已经说明了数量，后面直接接 de，不再用 des、du、de la：beaucoup de livres、un verre d'eau。例外：bien 表示“很多”时要接 des、du、de la：bien des gens、bien du mal。"},
  "r2-neg-no-de": {"t": "否定时冠词不变的情况", "b": "否定句中冠词变 de 只针对动词的直接宾语。être 后面的表语不变：Ce n'est pas un hasard. 定冠词也不变，所以 aimer、préférer 这类表示喜好的动词后面否定时仍用 le、la、les：Il n'aime pas le thé. 对比：Il ne boit pas de thé."},
  "r2-profession-no-article": {"t": "être + 职业不加冠词", "b": "“主语 + être + 不带修饰的职业、国籍、宗教”时，名词前不用冠词，作用相当于形容词：Elle est avocate. Il est français. 改用 c'est 时要加冠词：C'est un avocat. 职业名词带了形容词也要加：C'est une excellente avocate."},
  "r2-country-prep": {"t": "国家前的 au / en / aux", "b": "表示去某国或在某国时，介词由国家名的性数决定：阴性国家和以元音开头的国家用 en（en Italie、en Iran），阳性国家用 au（au Canada、au Brésil），复数国家用 aux（aux Pays-Bas）。城市名前用 à：à Rome。"},
  "r2-partitive-abstract": {"t": "部分冠词与抽象名词", "b": "表示不确定数量的不可数名词用部分冠词 du、de la、de l'，抽象名词也一样，意思是“一些、一定的”：avoir de la patience、montrer du talent。泛指整个概念时才用定冠词：La patience est une vertu."},
  "r2-besoin-de": {"t": "besoin de + 无冠词名词", "b": "avoir besoin de、manquer de 等本身要求 de 的表达，后面如果是部分冠词或 des，就被吸收，只剩下 de / d'：J'ai besoin de temps. Il manque d'expérience. 指特定的东西时用定冠词，并与 de 缩合：J'ai besoin du livre que tu as."},
  "r2-adj-before-de": {"t": "前置形容词前 des 变 de", "b": "复数名词前面有形容词时，书面规范中不定冠词 des 要变成 de：de belles fleurs、de petits enfants、de bons amis。形容词放在名词后面时不变：des fleurs rouges。口语中常听到 des，但答题按规范写 de。"},
  "r2-weekday-article": {"t": "le lundi 与 lundi", "b": "星期名前加定冠词 le 表示“每逢这一天”，用于习惯性的安排：Le samedi, je fais du sport.（每个星期六）不加冠词时只指离现在最近的那一天，前后都可以：Samedi, je vais chez Paul.（这个星期六）"},
  "r3-lui-leur": {"t": "间接宾语代词 lui / leur", "b": "动词通过介词 à 接人（parler à、écrire à、téléphoner à、répondre à）时，用间接宾语代词代替：单数用 lui，不分阴阳性，复数用 leur：J'écris à mes cousins → Je leur écris. Tu parles à Julie ? → Tu lui parles ? 代替“à + 事物”一般用 y。"},
  "r3-cod-agreement": {"t": "直接宾语代词与配合", "b": "动词直接接宾语时用 le、la、les，复数不分阴阳性都用 les。这些代词在复合过去时里放在助动词 avoir 前面，因此过去分词要与它性数配合：Ta lettre ? Je l'ai lue. Ces chemises, je les ai repassées."},
  "r3-en": {"t": "代词 en 代替 de + 名词", "b": "en 代替带部分冠词、不定冠词或数量词的名词，表示“其中的一些、若干”：Tu as du pain ? — Oui, j'en ai. Elle a des enfants ? — Elle en a deux. 名词是特指的（le pain、ce pain）时用 le、la、les。"},
  "r3-y": {"t": "代词 y 代替地点", "b": "y 代替由 à、en、dans、chez、sur 等介词引出的地点，意思是“那里、去那里”：Tu vas chez Marc ? — Oui, j'y vais. 由 de 引出的地点（从某地来、从某地回）则用 en 代替：Tu reviens de Lyon ? — Oui, j'en reviens."},
  "r3-penser-a-lui": {"t": "penser à + 重读代词", "b": "penser à、s'intéresser à、faire attention à、tenir à 等动词后面如果是人，不能换成 lui、leur 放在动词前，而要保留 à + 重读代词：Je pense à elle. Fais attention à lui ! 后面是事物时才用 y：J'y pense."},
  "r3-stressed-pronoun": {"t": "重读代词的用法", "b": "代词单独使用、后面不跟动词时，必须用重读代词 moi、toi、lui、elle 等：Qui a fini ? — Moi ! 重读代词也用于 c'est 之后、介词之后和比较句 que 之后：C'est toi ? Je pars avec eux. Il est plus âgé qu'elle."},
  "r3-double-pron-order": {"t": "双宾语代词顺序", "b": "两个宾语代词同时出现时按固定顺序排列：me、te、se、nous、vous → le、la、les → lui、leur → y → en。两个都是第三人称时，直接宾语在前：Je la leur montre. en 永远排在最后：Je lui en donne. Il y en a."},
  "r3-imperative-pron": {"t": "命令式中的代词位置", "b": "肯定命令式中代词放在动词后面，用连字符连接，me、te 变成 moi、toi：Écoute-moi ! Donne-le-moi ! 后面接 en 时变回 m'：Donne-m'en ! 否定命令式中代词回到动词前面，按普通语序：Ne me le donne pas !"},
  "r4-person-fem": {"t": "人称名词的阴性变化", "b": "指人的名词变阴性有几种规律，具体走哪一种常要逐个记：-teur 变 -trice 或 -teuse（directeur → directrice，menteur → menteuse），其他 -eur 多变 -euse（vendeur → vendeuse）；-er 变 -ère（boucher → bouchère）；-en、-on、-an 要双写 n 再加 e（gardien → gardienne）。"},
  "r4-fixed-gender-person": {"t": "只有一种性别的人称名词", "b": "有些指人的名词性别是固定的，不随所指的人是男是女而变化，冠词和形容词都按名词本身的性配合。永远阳性：un témoin、un mannequin、un médecin（书中说法）。永远阴性：une victime、une personne、une star、une vedette。"},
  "r4-animals": {"t": "动物名称的阴阳性", "b": "家畜常有泛称、公、母三个不同的名称：un cheval、un étalon、une jument；un bœuf、un taureau、une vache。很多其他动物只有一个名称，公母通用，性别固定，需要逐个记：une girafe、une grenouille、une guêpe；un rat、un écureuil、un papillon。"},
  "r4-trees-metals": {"t": "树木、金属矿物多为阳性", "b": "树木和灌木的名称一般是阳性：le chêne、le sapin、le pommier，例外是 la vigne、la ronce、la bruyère。金属和矿物的名称一般也是阳性：le fer、l'or、le diamant，例外是 une émeraude、une perle、une pierre。"},
  "r4-masc-categories": {"t": "语言、度量、时间名词", "b": "语言名称都是阳性，即使以 e 结尾：le chinois、le russe。度量单位、数字、分数是阳性：un mètre、un tiers，唯一例外 une moitié。星期、月份、季节是阳性：le printemps，但 une semaine、une saison、une année 是阴性。"},
  "r4-countries-rivers": {"t": "以 e 结尾的国家与河流", "b": "以 e 结尾的国家和地区一般是阴性：la France、la Russie、la Normandie，例外有 le Mexique、le Cambodge、le Mozambique。以 e 结尾的法国河流也是阴性：la Loire、la Seine，例外 le Rhône；外国河流不适用这条规则：le Danube。"},
  "r4-masc-endings": {"t": "-age/-ème/-eau 阳性", "b": "这三个词尾的名词基本是阳性，看到时先按阳性处理，再核对少数例外。-age：le garage、le message，例外 une plage、une image、une cage、une page。-ème：le thème，例外 la crème。-eau：le gâteau、le couteau，例外只有 l'eau 和 la peau。"},
  "r4-non-e-ending": {"t": "非 e 结尾的名词多为阳性", "b": "以 e 以外的元音结尾的名词一般是阳性：un vélo、un menu、un genou，例外有 une photo、une auto、une radio、une clé、une fourmi。以辅音结尾的名词一般也是阳性：un lit、un prix，例外有 une nuit、une fois、une forêt。"},
  "r4-ent-ment": {"t": "-ent / -ment 结尾为阳性", "b": "以 -ent 或 -ment 结尾的名词是阳性，这条规则很可靠，可以放心类推：le moment、un monument、le talent、un accident。需要特别记住的例外只有两个常用词：une dent（牙齿）、une jument（母马）。"},
  "r4-eur": {"t": "-eur 结尾名词的阴阳性", "b": "表示机器、器具的 -eur 名词是阳性：un moteur、un ordinateur、un aspirateur。表示性质、感受的 -eur 名词多为阴性：la peur、la valeur、la largeur；例外 le bonheur、le malheur、l'honneur。看不出性别时可以借形容词配合判断。"},
  "r4-fem-categories": {"t": "水果蔬菜、学科多为阴性", "b": "以 e 结尾的水果、蔬菜一般是阴性：une pomme、une tomate，例外 un pamplemousse、un concombre；不以 e 结尾的是阳性：un citron。学科、艺术的名称一般也是阴性：la musique、la médecine，例外 le dessin、le calcul、le droit。"},
  "r4-e-after-vowel-double": {"t": "元音或双写辅音 + e", "b": "词尾 e 前面是元音或双写辅音的名词一般是阴性：une journée、une rue、une lettre、la terre、une adresse。这条规则例外很多，常用的阳性词要单独记：le verre、le beurre、le tonnerre、un musée、un lycée、un parapluie。"},
  "r4-ance-ence": {"t": "-ance/-ence 阴性", "b": "以 -ance、-anse、-ence、-ense 结尾的名词是阴性，大多是抽象名词：la confiance、la danse、la patience、la défense。需要记住的例外只有两个阳性词：le silence（寂静）、le suspense（悬念）。"},
  "r4-te-tie": {"t": "-té / -tié 结尾为阴性", "b": "以 -té 或 -tié 结尾的名词是阴性，其中大量是由形容词变来的抽象名词：la liberté、la beauté、la pitié、l'amitié。例外是一组常用的阳性词，要单独记：un été、un côté、un comité、un pâté、un traité。"},
  "r4-son": {"t": "-son 结尾为阴性", "b": "以 -son 结尾的名词一般是阴性：une maison、une raison、une boisson、une comparaison。例外是几个阳性词：un son（声音）、un poison（毒药），一字之差的 un poisson（鱼）也是阳性，三者容易混淆。"},
  "r4-ade-ine-ise": {"t": "-ade/-ine/-ise 阴性", "b": "这几个词尾的名词先按阴性处理，再核对例外。以 -ade 结尾的是阴性：la limonade、une balade，例外有 un stade、un grade。以 -ine、-ise 结尾的也是阴性：la machine、la valise、la crise，例外有 le magazine、le platine、le pare-brise。"},
  "r4-gens-paques": {"t": "gens 与 Pâques 的性", "b": "gens 一般按阳性复数配合：des gens heureux。紧挨在它前面的形容词阴阳性形式不同时，前面的成分用阴性：de bonnes gens；jeunes gens 视为一个词，永远是阳性。Pâques 在祝福语中是阴性复数：Joyeuses Pâques !"},
  "r4-double-gender": {"t": "同形异性、意义不同", "b": "有些名词阳性和阴性的意思完全不同，要根据上下文判断：un livre（书）/ une livre（磅），un poêle（炉子）/ une poêle（平底锅），un critique（评论家）/ une critique（批评），un tour / une tour（塔），le mémoire（论文）/ la mémoire（记忆）。"},
  "r4-compound-acronym": {"t": "复合名词、缩写词的性", "b": "复合名词一般取其中名词的性：un chou-fleur；但“动词 + 名词”构成的复合名词多为阳性，不管后面名词的性：un ouvre-boîte、un tire-bouchon。缩写词取其中主要名词的性：la SNCF（Société…）、le TGV（train…）。"},
  "r5-neuter-le": {"t": "中性代词 le 及其省略", "b": "le 可作中性代词，代替前面整个句子或表语形容词，不随性数变化：Il viendra ? — Je le pense. Fatiguée ? Oui, je le suis. 但“trouver、juger + 形容词 + de 不定式”中不加 le，与英语 find it 不同：Je trouve important de dormir."},
  "r5-indirect-verbs": {"t": "法英及物性不同的动词", "b": "选代词前先确认动词在法语里是否带 à，不要按英语判断。obéir à、répondre à、téléphoner à、ressembler à 是间接及物，人用 lui、leur：Il lui ressemble. 而 attendre、écouter、regarder、chercher 是直接及物，用 le、la、les：Je les écoute."},
  "r5-me-lui": {"t": "me / te 不能与 lui 连用", "b": "两个宾语代词连用时，me、te、nous、vous 只能理解为间接宾语，所以没有 *me lui、*te leur 这种组合。直接宾语是 me、te 等时，间接宾语要改用 à + 重读代词放在动词后：Il nous a présentés à elle."},
  "r5-y-en-no-agreement": {"t": "y、en 不引起分词配合", "b": "y 是间接宾语，不影响过去分词的配合：Ces questions, j'y ai réfléchi. en 即使作直接宾语，过去分词一般也不配合：Des cerises ? J'en ai mangé. 对比直接宾语代词 les 要配合：Les cerises, je les ai mangées."},
  "r5-y-ira": {"t": "aller 将来时前省略 y", "b": "aller 的简单将来时和条件式现在时（irai、irais 等）前面要省略 y，以免两个 i 音相撞：Tu iras à la fête ? — Oui, j'irai. 其他时态照常用 y：J'y vais. J'y suis allé. 这是答题时容易多写 y 的地方。"},
  "r5-y-en-idioms": {"t": "含 y / en 的固定表达", "b": "一些固定表达里 y、en 已经没有具体所指，要整体记忆。s'y connaître en qch：精通某个领域：Il s'y connaît en vins. en vouloir à qn：怨恨、生某人的气：Je ne t'en veux pas. 相关的还有 s'en vouloir（自责）、s'en prendre à qn（责怪某人）。"},
  "r5-en-quantity": {"t": "en + 数量词", "b": "用 en 代替“de + 名词”时，数量词留在动词后面，而且 en 不能省掉，漏写 en 是常见错误：Il en reste peu. J'en ai acheté deux. 形容词性的 quelques 要换成代词形式 quelques-uns、quelques-unes：Des amies ? J'en ai quelques-unes."},
  "r5-pron-with-infinitive": {"t": "代词位置：不定式与 faire", "b": "一般“动词 + 不定式”时，代词放在不定式前：Je veux le voir. 但 faire、laisser 和感官动词 + 不定式时，代词放在变位动词前：Je les entends chanter. faire + 不定式又带直接宾语时，不定式的主语变成间接宾语：Je lui ai fait lire ce livre."},
  "r5-soi": {"t": "soi 与 lui / eux", "b": "重读代词 soi 只用于泛指的单数主语，如 on、chacun、personne 和无人称 il：Chacun pour soi. Il faut penser à soi. 主语是确指的人时，即使是复数或泛泛的人群，也用 lui、elle、eux、elles：Marie rentre chez elle."},
  "r5-stressed-agreement": {"t": "重读代词与动词的数", "b": "并列主语中含第一人称时，动词按 nous 变位，含第二人称而没有第一人称时按 vous：Toi et moi, nous partons. Lui et toi, vous restez. c'est 后面接 nous、vous 仍用单数，接 eux、elles 时用复数：ce sont elles."},
  "r5-de-lui": {"t": "de + 重读代词 vs en", "b": "要求介词 de 的动词（avoir besoin de、parler de、se méfier de），后面是人时用 de + 重读代词放在动词后：Je me méfie de lui. On parle d'elle. 后面是事物时才用 en 放在动词前：Ce problème ? On en parle."},
  "r5-ce-relative": {"t": "ce + 关系代词", "b": "没有先行词或指代整个句子时，关系代词前面加 ce：作主语用 ce qui，作直接宾语用 ce que，动词要求 de 用 ce dont，要求 à 用 ce à quoi：Dis-moi ce que tu veux. Voilà ce dont j'ai peur. Il est en retard, ce qui m'agace."},
  "r5-prep-qui-lequel": {"t": "介词 + qui / lequel", "b": "先行词是人、动词又要求介词时，用“介词 + qui”：l'ami avec qui je voyage、le collègue à qui j'écris。但介词是 parmi 或 entre 时，即使指人也必须用 lequel 系列：les invités, parmi lesquels se trouvait le maire."},
  "r5-dont": {"t": "dont 的用法限制", "b": "dont 本身已经包含 de，从句里不能再重复这个成分：不再加主有形容词（la femme dont je connais le mari，不说 *son mari），也不再加 en（le sujet dont je parle）。表示“……的方式”说 la façon dont、la manière dont。"},
  "r5-no-dont": {"t": "不能用 dont 的情况", "b": "名词补语前面另有介词短语（au bord de、à côté de、au milieu de）时，dont 无法表达这个介词短语，不能用 dont，要用 duquel、de laquelle、desquels：le parc au milieu duquel se trouve un lac。书中另外指出，tenir de qn（像某人）用 de qui。"},
  "r5-de-quoi": {"t": "de quoi + 不定式", "b": "de quoi + 不定式，前面没有先行词，表示“可以用来……的东西”或“足以……的理由”：Il y a de quoi manger. Je n'ai pas de quoi payer. 常见固定说法：Il n'y a pas de quoi.（不客气）"},
  "r5-ou": {"t": "关系代词 où：地点与时间", "b": "先行词是地点时用 où，不能用“à + lequel”：la ville où j'habite；需要时 où 前面还可以加介词：le pays d'où il vient。先行词是时间时也用 où，不能像英语 when 那样用 quand：l'année où ils se sont mariés。"},
  "r5-poss-agreement": {"t": "主有代词的人称与性数", "b": "主有代词的人称跟着所有者变，阴阳性和单复数跟着所属的东西变：Mon vélo est vieux, le tien est neuf. Ta voiture et la mienne. 主语是 on、chacun、personne 这类泛指单数时，用第三人称单数：Chacun a pris la sienne."},
  "r5-poss-contraction": {"t": "à / de + 主有代词缩合", "b": "主有代词的第一个词是定冠词，遇到 à、de 要缩合：à + le mien → au mien，de + les nôtres → des nôtres：Je pense à mon fils, tu penses au tien. 主有代词 nôtre、vôtre 带长音符，与形容词 notre、votre 区分。"},
  "r5-poss-etre": {"t": "c'est le mien", "b": "être 后面紧接主有代词时，主语用 ce，不用 il / elle：C'est le mien. Ce n'est pas le tien. 表示归属也可以说 Ce stylo est à moi，但只有主有代词能作主语：Le mien est cassé.（不说 *À moi est cassé.）"},
  "r5-poss-idioms": {"t": "主有代词的习语", "b": "几个常用习语：être des nôtres，意思是和我们在一起、加入我们；y mettre du sien，意思是尽自己的一份力，sien 随人称变化：J'y mets du mien. les siens 可以指某人的家人、亲人：Il passe Noël avec les siens."},
  "r5-celui": {"t": "celui + de / qui", "b": "简单形式 celui、celle、ceux、celles 不能单用，后面必须接 de、关系从句或分词：Prends celle de ton frère. Ceux qui travaillent réussissent. 表示 the one 时不能用 l'un。代替整个句子时用 ce qui、ce que，不用 celui。"},
  "r5-celui-ci": {"t": "celui-ci、celui-là", "b": "复合形式用来区分两样东西，性数随所指名词变化：Ce pull-ci ou celui-là ? 同一句里提到两者时，celui-ci 指后者（较近、后提到的），celui-là 指前者：Paul et Marc sont frères ; celui-ci est grand, celui-là est petit."},
  "r6-cod-le-la-les": {"t": "直接宾语 le / la / les", "b": "动词直接接宾语（不带介词）时，用 le（阳单）、la（阴单）、les（复数，不分阴阳），放在变位动词前；元音前 le、la 省音为 l'。例：Ce gâteau, je le prends. Tes amies, je les invite."},
  "r6-pp-agree-cod": {"t": "COD 前置时过去分词配合", "b": "复合过去时用 avoir 时，如果直接宾语代词（le、la、les）放在助动词前，过去分词要与它的阴阳性、单复数配合。例：La lettre ? Je l'ai écrite. Ces photos, je les ai prises."},
  "r6-coi-lui-leur": {"t": "间接宾语 lui / leur", "b": "动词通过 à 接人（parler à、écrire à、téléphoner à、répondre à）时，用间接宾语代词：单数 lui（不分阴阳），复数 leur。leur 作代词时不加 s。例：Je lui réponds demain. Je leur ai parlé."},
  "r6-direct-verbs": {"t": "法语直接及物的动词", "b": "attendre、écouter、regarder、chercher 在法语里直接接宾语（英语要加介词），所以用 le / la / les，不用 lui / leur。反过来，téléphoner à、répondre à 在法语里是间接及物，用 lui / leur。例：La radio ? Je l'écoute. Mes clés ? Je les cherche."},
  "r6-y": {"t": "代词 y", "b": "y 代替 à / dans / chez 等 + 地点，也代替 à + 事物（penser à、répondre à qch）。如果 à 后面是人，用 lui / leur 或 à lui。y 和其他宾语代词一样放在变位动词前。例：Je vais à Paris → J'y vais. Je réponds à la lettre → J'y réponds."},
  "r6-en-quantity": {"t": "en 代替数量", "b": "en 代替“部分冠词 / 不定冠词 des / 数量词 + 名词”；有数字或数量词时，把它保留在句末。否定句同样用 en。例：Il a trois chats → Il en a trois. Je ne bois pas de café → Je n'en bois pas."},
  "r6-en-de": {"t": "en 代替 de + 事物 / 地点", "b": "en 代替 de + 地点（从某地来）和 de + 事物（parler de、avoir besoin de）。de 后面是人时一般用 de lui / d'elle。en 也放在变位动词前，否定时夹在 ne 和动词之间。例：Il revient de Rome → Il en revient. J'ai besoin de ce livre → J'en ai besoin."},
  "r6-pronoun-position": {"t": "宾语代词的位置", "b": "宾语代词放在它所属的动词前：动词 + 不定式时放在不定式前；复合过去时放在助动词前，否定时 ne 在代词前、pas 在助动词后。例：Je vais les appeler. Je ne l'ai pas lu."},
  "r6-imperative": {"t": "命令式中的代词", "b": "肯定命令式：代词放动词后，用连字符连接，直接宾语在前，me / te 变成 moi / toi。否定命令式：代词回到动词前，词序与陈述句相同。例：Prends-le ! Donne-la-moi ! Ne me le donne pas !"},
  "r6-stressed": {"t": "重读代词 moi, eux…", "b": "重读代词 moi、toi、lui、elle、nous、vous、eux、elles 用于：介词后、句首强调主语、比较句 que 后、c'est 后。eux 指男性或男女混合，elles 只指女性。c'est … qui 后动词跟着重读代词变位。例：chez eux ; Lui, il part. C'est nous qui avons gagné."},
  "r6-qui-que": {"t": "关系代词 qui 与 que", "b": "关系代词在从句中作主语用 qui，作直接宾语用 que（元音前写 qu'）。简便判断：que 后面的从句自带主语，qui 后面直接接动词。例：la femme qui parle ; le livre que j'ai lu."},
  "r6-dont": {"t": "关系代词 dont", "b": "从句里的动词或短语带 de（parler de、avoir besoin de、avoir envie de、être content de）时，关系代词用 dont，代替 de + 先行词。dont 后面的从句里不再出现 de。例：la voiture dont il a envie ; le projet dont nous parlons."},
  "r6-ou": {"t": "关系代词 où（地点和时间）", "b": "先行词是地点时用 où；先行词是时间（le jour、le moment、l'année）时也用 où，不用 quand。这里的 où 是关系代词，不表示疑问。例：le pays où elle habite ; l'année où il est né."},
  "r6-prep-qui": {"t": "介词 + qui 指人", "b": "关系从句里动词带介词、先行词是人时，用“介词 + qui”：avec qui、pour qui、à qui。先行词是物时通常用 lequel 等形式。例：l'ami à qui j'ai écrit ; la personne pour qui je travaille."},
  "r6-ce-qui-ce-que": {"t": "ce qui / ce que", "b": "没有具体先行词、意思是“……的东西 / 事情”时，用 ce qui（在从句中作主语）或 ce que（作宾语，从句有自己的主语）。例：Ce qui me plaît, c'est la mer. Je ne sais pas ce qu'il veut."},
  "r6-possessive": {"t": "主有代词 le mien…", "b": "主有代词 = 定冠词 + mien / tien / sien / nôtre / vôtre / leur，阴阳性和单复数跟着被拥有的东西走：le mien、la mienne、les miens、les miennes。nôtre、vôtre 带长音符，形容词 notre、votre 不带。例：Ta voiture est rouge, la mienne est bleue. Leurs enfants et les nôtres."},
  "r6-demonstrative": {"t": "指示代词 celui…", "b": "指示代词 celui（阳单）、celle（阴单）、ceux（阳复）、celles（阴复）代替前面的名词，后面必须接 qui、que、de 等，或者加 -ci / -là 单独使用。ceux qui 表示“那些……的人”。例：mon sac et celui de Paul ; ces livres-ci ou ceux-là."},
  "r20-et-un": {"t": "21–71 用 et，81 不用", "b": "21、31、41、51、61、71 用 et 连接，不加连字符：vingt et un、soixante et onze。81、91 不用 et，用连字符：quatre-vingt-un、quatre-vingt-onze。其他复合数用连字符：trente-deux。"},
  "r20-vingt-cent-s": {"t": "vingt / cent 何时加 s", "b": "vingt、cent 被乘且后面没有别的数字时加 s：quatre-vingts、trois cents；后面还有数字就不加：quatre-vingt-deux、trois cent dix。表示页码、年份、编号时是序数意义，也不加 s：la page trois cent。"},
  "r20-mille-million": {"t": "mille 与 million", "b": "mille 永远不变，前面不加 un：deux mille、mille deux cents；cent 前也不加 un。“无数”说 mille et un(e)。million、milliard 是名词：复数加 s，接名词要加 de。例：cinq mille euros ; deux millions de personnes."},
  "r20-decimal": {"t": "小数逗号与千位分隔", "b": "法语用逗号作小数点，读作 virgule；千位用空格（或点）分隔，和英语相反。价格中逗号后的部分直接读成数字。例：3,25 = trois virgule vingt-cinq ; 12,50 € = douze euros cinquante."},
  "r20-premiers-order": {"t": "les deux premiers 词序", "b": "premier、dernier、prochain、autre 和基数词连用时，放在基数词后面，并与名词配合。注意词序和英语 the first two、中文“前两个”正好相反。例：les deux premières semaines ; les dix dernières années."},
  "r20-monarch": {"t": "君主序号读法", "b": "君主、教皇的序号用基数词，不加冠词；只有“一世”用 premier。书写时用罗马数字，读出来才说成基数词。例：Henri Quatre（Henri IV）、Napoléon Premier（Napoléon Ier）。"},
  "r20-ordinal": {"t": "序数词 -ième 的构成", "b": "序数词一般是基数词 + -ième；premier 只用于“第一”，复合数里用 unième：trente et unième。拼写注意：cinq → cinquième，neuf → neuvième。huit、onze 及其序数词前不省音。例：le huitième étage ; la onzième fois."},
  "r20-aine": {"t": "约数 -aine + de", "b": "dizaine、vingtaine、centaine 等是阴性名词，表示约数，接名词时加 de；也可以表示大约的年龄。soixante-dix、quatre-vingts、quatre-vingt-dix 不能加 -aine，要用 environ。例：une trentaine de personnes ; Il a la quarantaine."},
  "r20-fraction": {"t": "demi、moitié 与分数", "b": "demi 放在名词前用连字符，不变化：une demi-journée；放在名词后与名词同性：un an et demi。“……的一半”用名词 moitié。其他分数接名词要加 de。例：la moitié du gâteau ; un tiers des élèves."},
  "r20-time": {"t": "et demi(e) 与 24 小时制", "b": "heure 是阴性，说 et demie；midi、minuit 是阳性，说 et demi。表示时刻不用 moitié。时刻表和正式场合用 24 小时制，直接读数字。例：trois heures et demie ; minuit et demi ; vingt heures quinze."},
  "r20-per-unit": {"t": "sur、le kilo、à l'heure", "b": "sur 表示“……之中的……”：un sur trois。按单位计价用定冠词：quatre euros le kilo。速度用 à：rouler à 90 km à l'heure。这几种说法都和英语介词不同，要整体记住。"},
  "r20-bis": {"t": "门牌号 bis / ter", "b": "同一个门牌号再分出第二户、第三户时，在号码后加 bis、ter，相当于 a、b。例：Elle habite au 12 bis."},
  "r20-dimensions": {"t": "尺寸 de long / d'épaisseur", "b": "表示尺寸用“数字 + 单位 + de + 形容词或名词”：long、large、haut 可以说 de long、de large、de haut；épais、profond 要用名词 d'épaisseur、de profondeur。例：une piscine de deux mètres de profondeur."},
  "r20-dates": {"t": "日期与年份读法", "b": "日期用定冠词 + 基数词，只有每月一号用 premier；huit、onze 前不省音。年份可读作 mille neuf cent… 或 dix-neuf cent…。例：le premier mai ; le huit mai ; en mille neuf cent quatre-vingt-dix."},
  "r20-week": {"t": "星期与周期", "b": "星期前加 le 表示每逢这一天，不加指某一个具体的日子。“一周后、两周后”习惯说 dans huit jours、dans quinze jours。tous les / toutes les + 数字 + 名词表示“每隔……”。例：Le lundi, je travaille. tous les trois mois."},
  "r20-an-annee": {"t": "an / année，jour / journée", "b": "基数词后一般用 an、jour：trois ans、deux jours。序数词和 chaque、plusieurs、cette 后，或强调一整段时间时用 année、journée：la deuxième année、toute la journée。例：plusieurs années ; une belle journée."},
  "r20-en-number": {"t": "数词单独作宾语要加 en", "b": "前面提到的名词省略、只留下数字时，要在动词前加 en。表示年龄也一样。例：J'ai deux sœurs, et lui en a trois. Il a vingt ans, elle en a vingt-deux."},
  "r20-nombre-numero": {"t": "nombre 与 numéro", "b": "nombre 表示数量（多少个），numéro 表示编号（电话号码、门牌号、房间号）。chiffre 是数字符号。例：le nombre d'habitants ; le numéro de la chambre."},
  "r20-neuf-v": {"t": "neuf ans 中 f 读 [v]", "b": "neuf 在 ans、heures 前连读为 [v]，其他情况读 [f]。只有在这两个词前才变音，记住这两个固定组合即可。例：neuf ans [nœvɑ̃] ; neuf heures [nœvœʁ] ; neuf euros [nœføʁo]."},
  "r20-70-99": {"t": "70–99 的组合方式", "b": "70–79 是 soixante + 10–19，80–99 是 quatre-vingt(s) + 0–19，听到 soixante 或 quatre-vingt 时要等后面的数字再相加。法语的七十、八十、九十用二十进制组合。例：soixante-quatorze = 74 ; quatre-vingt-quinze = 95."},
  "r22-depuis-present": {"t": "depuis + 现在时", "b": "动作或状态从过去开始、持续到现在，用 depuis + 现在时（英语用现在完成时，法语不用复合过去时）。depuis 后既可接时长，也可接起点。例：Il travaille ici depuis six mois. Je la connais depuis 2015."},
  "r22-il-y-a-past": {"t": "il y a + 时长 = ……以前", "b": "il y a + 时长表示“……以前”，标出过去的一个时间点，动词用过去时，常配一次性完成的动作。注意和 dans（……以后）相反。例：Elle est partie il y a une semaine."},
  "r22-pendant": {"t": "pendant：已结束的一段时间", "b": "pendant + 时长表示持续了多久，配复合过去时时指已经结束的一段时间；pendant + 名词表示“在……期间”。对比 depuis：状态持续到现在。例：Il a vécu à Rome pendant deux ans. pendant le cours."},
  "r22-depuis-negative": {"t": "否定句 depuis + 复合过去时", "b": "“一直没做某事”本身是持续到现在的状态，可以用 depuis + 否定的复合过去时。例：Je n'ai pas mangé depuis ce matin. Elle ne m'a pas écrit depuis Noël."},
  "r22-il-y-a-que": {"t": "ça fait … que + 现在时", "b": "il y a + 时长 + que + 现在时、ça fait + 时长 + que + 现在时，与 depuis + 时长同义，强调持续了多久；口语常用 ça fait … que。例：Ça fait deux heures que je t'attends = Je t'attends depuis deux heures."},
  "r22-pour-plan": {"t": "pour + 计划的时长", "b": "partir、aller、venir 等动词后，用 pour + 时长表示打算待多久；实际经过了多久用 pendant。例：Il part à Londres pour un mois. Il y est resté pendant un mois."},
  "r22-depuis-imparfait": {"t": "depuis + 未完成过去时", "b": "动作一直持续到过去某个时刻，用 depuis + 未完成过去时，相当于把 depuis + 现在时整体往过去推一格。例：Je l'attendais depuis une heure quand il est arrivé."},
  "r22-dans-future": {"t": "dans + 时长 = ……以后", "b": "dans + 时长表示从现在算起多久以后，与 il y a（……以前）相对；动词可用将来时或表示即将发生的现在时。例：Le film commence dans dix minutes. Je reviens dans une heure."},
  "r22-en-duration": {"t": "en + 时长：用了多久完成", "b": "en + 时长表示完成一件事所用的时间；pendant 只说持续了多久，不强调完成。例：Il a lu ce roman en deux jours. J'ai fini en une heure."},
  "r22-depuis-que-pendant-que": {"t": "depuis que / pendant que", "b": "depuis que + 从句表示“自从……以来”，主句状态持续到现在；pendant que + 从句表示两件事同时进行。例：Depuis qu'elle a ce travail, elle dort mal. Pendant que je cuisinais, il lisait."},
  "r22-questions": {"t": "depuis combien de temps", "b": "问持续到现在多久：Depuis combien de temps + 现在时，答 depuis…；问已结束的一段时间：Pendant combien de temps + 复合过去时，答时长；问什么时候发生：Quand…，答 il y a…。例：Depuis combien de temps tu habites ici ?"},
  "r23-masc-endings": {"t": "可靠的阳性词尾", "b": "以下词尾的名词基本都是阳性：-isme、-ment、-oir、-ail / -eil、-phone / -scope。例：le racisme、le moment、le couloir、le travail、le soleil、le microscope。看到这些词尾，可以放心按阳性处理冠词、形容词和过去分词的配合。"},
  "r23-oire": {"t": "-oire：多为阴性，场所类阳性", "b": "-oire 结尾多为阴性：la victoire、la mémoire（记忆）、la gloire。表示场所、用具的一批词是阳性：le laboratoire、le territoire、le répertoire、l'accessoire。注意不要和阳性的 -oir 混淆。"},
  "r23-ion": {"t": "-tion / -sion 结尾", "b": "-tion、-sion、-xion 结尾的名词是阴性：la nation、la décision、la réflexion。-ion 前面是其他字母时常为阳性：l'avion、le camion、le million。做题时先看 -ion 前面是不是 t、s、x。"},
  "r23-in-ain": {"t": "-in / -ain 与 main、fin", "b": "-in、-ain 结尾多为阳性：le jardin、le matin、le vin、le pain、le train。两个常用例外是阴性：la main、la fin。其余常用词按阳性处理即可。"},
  "r23-masc-fem-exceptions": {"t": "-oi、-et、-is 中的阴性例外", "b": "-oi、-et、-is 结尾多为阳性：le roi、l'emploi、le billet、le secret、le tapis、l'avis。常见阴性例外：la loi、la foi、la forêt、la vis（螺丝）、la souris。这三个词尾按阳性处理通常不会错，只需单独记住少数阴性词。"},
  "r23-ice": {"t": "-ice：阴阳都有，需逐个记", "b": "-ice 结尾没有可靠规则。阳性：le service、l'exercice、le sacrifice、l'édifice；阴性：la police、la justice、la cicatrice、la notice。做题时只能靠记忆，建议把常用词连同冠词一起背。"},
  "r23-ure-ude": {"t": "-ure / -ude 的阳性例外", "b": "-ure、-ude 结尾几乎都是阴性：la nature、la culture、l'habitude、la solitude。阳性例外：le murmure、le mercure；le prélude、l'interlude。遇到这两个词尾先按阴性处理，再记住少数阳性例外。"},
  "r23-ette-elle": {"t": "-ette / -elle 的例外", "b": "-ette、-elle 结尾多为阴性：la cigarette、l'assiette、la poubelle、la vaisselle。阳性例外：le squelette、le violoncelle。-ette 常是指小词，整体按阴性处理，只需记住个别例外。"},
  "r23-ie-ee": {"t": "-ie / -ée 的阳性例外", "b": "-ie、-ée 结尾多为阴性：la maladie、la sortie、l'idée、l'armée。阳性例外：l'incendie、le génie、le parapluie；le lycée、le musée、le trophée。这两个词尾先按阴性处理；阳性例外里有不少是场所名词，可以成组记。"},
  "r23-ique": {"t": "-ique：阴性，少数例外", "b": "-ique 结尾的名词多为阴性：la musique、la politique、la panique。阳性例外：le pique-nique、le lexique、le moustique、le cantique。这个词尾先按阴性处理，再单独记住几个常用的阳性词。"},
  "r23-esse": {"t": "-esse 结尾是阴性", "b": "-esse 结尾的名词是阴性，很多由形容词变来：jeune → la jeunesse，riche → la richesse。这条规则几乎没有例外，可以放心使用。例：la vitesse、la politesse、la promesse。"},
  "r23-age": {"t": "-age：阳性，少数短词阴性", "b": "-age 结尾多为阳性：le fromage、le voyage、le courage、le garage。常见阴性例外：la page、la plage、l'image、la cage、la nage、la rage。这个词尾整体按阳性处理，阴性的多是只有两个音节的短词。"},
  "r23-ere": {"t": "-ère：阴性，一组阳性例外", "b": "-ère 结尾多为阴性：la lumière、la colère、la rivière。阳性例外：le caractère、le mystère、le ministère、le cimetière、le derrière。这个词尾整体按阴性处理，阳性例外不多，但都是常用词。"},
  "r23-son": {"t": "-aison 与 -sson", "b": "-aison、-ison 结尾是阴性：la maison、la raison、la prison。-sson 结尾多为阳性：le poisson、le buisson（但 la boisson 是阴性）；其他 -son 也常为阳性：le son、le blouson。"},
  "r23-eur": {"t": "-eur：机器阳性，抽象名词阴性", "b": "-eur 结尾表示机器、工具的是阳性：le moteur、l'aspirateur；抽象的性质、感受多为阴性：la peur、la chaleur、la couleur。阳性例外：le bonheur、le malheur、l'honneur。"},
  "r7-ne-pas-encore-plus-que": {"t": "ne… pas encore / plus / que", "b": "ne… pas encore 是“还没有”，ne… plus 是“不再、已经不”，ne… jamais 是“从来不”，ne… que 是“只有、仅仅”，并不是否定。听到 ne 先别急着理解成“不”，要等后半部分。例：Il n'est pas encore rentré. Elle ne boit plus de café. Il ne parle que chinois."},
  "r7-venir-de": {"t": "venir de 刚刚 vs aller 将要", "b": "venir de + 不定式 表示刚刚做完某事（最近过去时）；aller + 不定式 表示马上要做（最近将来时）。听到 vient de、viens de 就是“刚刚”，别和 venir 的“来”混淆。例：Je viens de finir mes devoirs. Le film va commencer."},
  "r7-depuis-il-y-a": {"t": "depuis / ça fait… que / il y a", "b": "depuis + 时长、ça fait + 时长 + que 都配现在时，表示动作持续到现在还在继续；il y a + 时长 表示“……之前”，配过去时；dans + 时长 表示“……之后”。问 depuis quand 就用 depuis 回答。例：J'attends depuis une heure. Ça fait une heure que j'attends. Il est parti il y a dix minutes."},
  "r7-se-retrouver-on": {"t": "se retrouver 碰头；on = nous", "b": "se retrouver 是“约好碰面、会合”，retrouver qch 是“找回某物”。口语里 on 常代替 nous，动词用第三人称单数。听到 on se… ? 多半是在约“我们”一起做某事。例：On se retrouve au café ? J'ai retrouvé mes lunettes."},
  "r7-conditionnel-passe": {"t": "条件式过去时：本来会、本想", "b": "条件式过去时 = avoir / être 的条件式 + 过去分词，表示与过去事实相反或遗憾。si + 愈过去时，主句用条件式过去时；j'aurais aimé 是“我本来很想（但没做成）”。例：Si tu m'avais appelé, je serais venu. J'aurais aimé le rencontrer."},
  "r7-subjonctif": {"t": "il faut que / 不确定的 qui + 虚拟式", "b": "il faut que 后面用虚拟式，表示必须。关系从句里要找的人或物还不确定存在时，从句也常用虚拟式。虚拟式的形式常和直陈式不同，例如 puisse、soit、fasse，听到它们要想到这类结构。例：Il faut que tu partes tôt. Je cherche un appartement qui soit calme."},
  "r7-questions-figees": {"t": "常用口语问句的固定含义", "b": "有些问句不能按字面理解：Qu'est-ce que tu fais dans la vie ? 是问职业；Ça te dirait de + 不定式 ? 是邀请“你想不想……”；Tu pourrais me passer… ? 是请对方递东西。这些都是固定说法，按功能记，不要逐词翻译。例：Ça te dirait de faire une balade ? — Bonne idée ! Tu pourrais me passer le pain ?"},
  "r7-mots-interrogatifs": {"t": "疑问词决定回答类型", "b": "选回答时先抓疑问词：où 答地点，quand 答时间，pendant combien de temps 答时长，avec qui 答同伴，pourquoi 答原因。答非所问的选项往往回答的是另一个疑问词，比如用时长回答地点。例：Tu vas où ? — À Nice. Tu pars avec qui ? — Avec ma sœur."},
  "r7-si-non": {"t": "否定问句的回答 si / non", "b": "回答否定问句时，同意问句里的否定（确实不……）用 non；反驳否定、表示肯定用 si，不用 oui。这和中文的“对，不来”“不，我来”思路正好相反，要特别小心。例：Tu ne viens pas ? — Si, j'arrive ! Ça ne te gêne pas ? — Non, pas du tout."},
  "r7-etre-a-le-mien": {"t": "être à qn 与 le mien", "b": "être à qn 表示“属于某人”，问 C'est à qui ? 是问“是谁的”。回答可用主有代词 le mien、la mienne、le tien、le sien 等，性数随所属的东西变化。注意 être à + 地点 是“在某处”，要看后面是人还是地方。例：Ce stylo est à toi ? — Oui, c'est le mien. Cette valise, c'est la sienne."},
  "r7-heure-24h": {"t": "24 小时制与晚点计算", "b": "法国的预约、广播常用 24 小时制：vingt heures = 晚上八点。avec X minutes de retard 表示晚点 X 分钟，实际时间要加上去。也要分清 samedi 周六和 jeudi 周四。例：Le vol de dix-huit heures dix partira avec un quart d'heure de retard."},
  "r7-futur-simple": {"t": "简单将来时：pourrai、viendrai", "b": "简单将来时结尾是 -rai、-ras、-ra 等，有些词干不规则：pouvoir → je pourrai，venir → je viendrai，être → je serai。remettre qch à + 时间 是“推迟到……”。听到词干里多出的 r 音，一般就是将来时或条件式。例：Tu pourras m'aider demain ? On remet la réunion à lundi."},
  "r7-localisation": {"t": "方位：en face de / à côté de", "b": "en face de 是“在……对面”，à côté de 是“在……旁边”，derrière 是“后面”，devant 是“前面”。指路常用 à gauche、à droite、tout droit。听指路时要把每个介词和它后面的地点对应起来，左右和前后最容易听反。例：La banque est à côté de la boulangerie. Tournez à droite, puis allez tout droit."},
  "r7-comparatif-c-est-qui": {"t": "比较级与 c'est… qui 强调", "b": "plus / moins / aussi + 形容词 + que 表示比较，形容词与主语性数配合；le plus + 形容词 是最高级。c'est… qui 用来强调做动作的人。比较句要分清谁比谁，强调句里 qui 前面的那个人才是动作的执行者。例：Léa est plus jeune que son frère. C'est elle qui a gagné."},
  "r7-accord-cod": {"t": "COD 前置时过去分词配合", "b": "复合过去时用 avoir 时，如果直接宾语（如代词 le、la、les）放在动词前，过去分词要和它性数配合。配合只影响拼写，有时也影响读音，例如 mis → mise、pris → prise 多出 z 音。例：Ta lettre ? Je l'ai lue. Les photos, je les ai prises hier."},
  "r8-verbes-pronominaux": {"t": "代词式动词 se coucher 等", "b": "se coucher 上床睡觉、se lever 起床、s'appeler 名叫，都是代词式动词，反身代词随主语变化：je me、tu te、il se。问名字用 Comment tu t'appelles ?，别和 Comment ça va ? 混淆。这类动词的复合过去时用 être 作助动词。例：Je me lève à sept heures. Elle s'appelle Claire."},
  "r8-il-fait-meteo": {"t": "天气：il fait + 形容词", "b": "说天气用 il fait + 形容词：il fait chaud（热）、il fait froid（冷）、il fait beau（天气好）、il fait mauvais（天气差）。下雨、下雪用动词：il pleut、il neige。这里的 il 是无人称主语，不指任何人；不能说 il est froid 来表示天气冷。例：Il fait chaud en été. Il neige en montagne."},
  "r8-negation-pas-de": {"t": "否定句中 un / des / du → de", "b": "否定句里，直接宾语前的 un、une、des、du、de la 变成 de（元音前 d'）。所以 Tu as des… ? 的否定回答用 pas de。être 后面不变。这条规则只管直接宾语前的不定冠词和部分冠词，定冠词 le、la、les 不变。例：Je n'ai pas de voiture. Il ne boit pas d'alcool. Ce n'est pas un chat."},
  "r8-on-ce-soir": {"t": "on = nous；ce soir / hier soir", "b": "口语里 on 常等于 nous，动词用第三人称单数：on va、on mange。ce soir 是今晚，hier soir 是昨晚，demain soir 是明晚。听时间词时要分清今天、昨天、明天，它们决定句子说的是哪一天。例：On mange ensemble demain soir ? Hier soir, on a dîné chez Paul."},
  "r8-age-avoir": {"t": "用 avoir 说年龄", "b": "法语说年龄用 avoir，不用 être：j'ai trente ans。问年龄说 Quel âge as-tu ?。比较年龄用 avoir X ans de plus / de moins que qn。说年龄时 ans 不能省略，和中文“我二十”不同。注意不要和说时间的 Il est… heure(s) 混淆。例：Il a dix-neuf ans. J'ai trois ans de moins que mon frère."},
  "r8-nombres-70-99": {"t": "70–99 的数字", "b": "70–99 要做加法和乘法：soixante-dix = 60 + 10，quatre-vingts = 4 × 20，quatre-vingt-dix = 80 + 10。电话号码两位两位地读。法国本土这样说；比利时、瑞士用 septante、nonante 等，听力里以法国说法为主。例：soixante-quinze = 75，quatre-vingt-quatre = 84，quatre-vingt-dix-sept = 97。"},
  "r8-prix": {"t": "价格的读法", "b": "问价用 Combien coûte… ? 或 Ça fait combien ?。读价格时 euros 后面的数字是“分”：trois euros vingt = 3.20 欧元。口语里“分”通常直接读数字，不说 centimes；注意区分 douze 与 deux、quinze 与 cinq。例：Ça coûte quinze euros quarante. Ça fait combien ? — Huit euros."},
  "r8-mots-interrogatifs": {"t": "疑问词与对应回答", "b": "où 问地点，quand 问时间，pourquoi 问原因、用 parce que 回答，avec qui 问同伴。先听清疑问词再选回答。错误选项通常回答了另一个疑问词，比如用地点回答“什么时候”。例：Pourquoi tu ris ? — Parce que c'est drôle. Tu pars quand ? — Demain matin."},
  "r8-heure": {"t": "说时间：il est… heure(s)", "b": "问时间用 Il est quelle heure ?，回答 Il est + 钟点。et quart 过一刻，et demie 半，moins le quart 差一刻；midi 中午十二点，minuit 午夜。时刻表和营业时间常用 24 小时制：quinze heures = 下午三点。例：Il est huit heures et demie."},
  "r8-accepter": {"t": "接受邀请：avec plaisir", "b": "别人请你喝东西或邀请你，接受说 Oui, avec plaisir 或 Oui, je veux bien；婉拒说 Non, merci。如果对方问 Tu veux… ? 而你回答 Non, merci，就是拒绝，这一点和中文客套不同。例：Tu veux du thé ? — Oui, je veux bien. On va au cinéma ? — Avec plaisir !"},
  "r8-passe-compose-reponse": {"t": "复合过去时问，过去时答", "b": "问句用复合过去时（tu as fait），回答也要用过去时；je vais + 不定式 是“将要”。大多数动词用 avoir，aller、venir、partir 等用 être。回答的时态要和问句一致，问过去就答过去。例：Tu as vu Marie ? — Oui, je l'ai vue hier. Je suis parti tôt."},
  "r8-dates-mois": {"t": "日期：le + 数字 + 月份", "b": "日期说 le + 基数词 + 月份，每月一号用 le premier。易混的月份：octobre 十月、novembre 十一月、décembre 十二月。日期前用定冠词 le，不说“几号”的序数词（一号除外）。例：le premier mai，le quatorze juillet，le trente et un octobre。"},
  "r8-dans-il-y-a": {"t": "dans 之后 / il y a 之前", "b": "dans + 时间 表示从现在起“……之后”（将来），il y a + 时间 表示“……之前”（过去）。une demi-heure 是半小时，une heure et demie 是一个半小时。两者后面都接时长，方向相反，最容易听混。例：Le film commence dans dix minutes. Il est parti il y a une heure."},
  "r9-connecteurs": {"t": "parce que / alors / pourtant", "b": "听长文抓连接词：parce que 引出原因，alors 引出结果（所以），pourtant 引出相反情况（然而），mais 表示转折。答案往往就在这些词后面。例：Il pleut, alors je reste à la maison. Il est riche, pourtant il n'est pas heureux."},
  "r9-conditionnel-politesse": {"t": "条件式表礼貌和愿望", "b": "条件式现在时让请求和愿望更委婉：tu pourrais… ? 比 tu peux… ? 客气，j'aimerais、je voudrais 比 je veux 委婉。听到 pourrais 常常是在请对方做事。这种条件式不表示假设，只是语气客气。例：Vous pourriez fermer la porte ? J'aimerais apprendre le piano."},
  "r9-pronom-cod": {"t": "宾语代词 le / la / les 指代", "b": "宾语代词 le、la、les 放在动词前，指代前文提到的人或物，听的时候要回头找它指谁。否定句里 ne 放在代词前。例：Tu connais Marc ? Je le vois demain. Ces films, je ne les aime pas."},
  "r9-heure-duree": {"t": "时刻与时长：et quart、précises", "b": "une heure et quart = 75 分钟，une heure et demie = 90 分钟。时刻常用 24 小时制：dix-neuf heures = 晚上七点，seize heures = 下午四点（别和 six 混）。précises = 整、准时；avant 之前，après 之后。题目问时长还是时刻要先看清，再在录音里找对应的数字。例：Rendez-vous à vingt heures précises."},
  "r9-imparfait-avant": {"t": "未完成过去时：以前的状态", "b": "未完成过去时描述以前的状态或习惯，现在时说的是现在的情况。au début、avant 常配未完成过去时，maintenant 配现在时，据此分清“以前”和“现在”。例：Avant, je travaillais à Paris ; maintenant, je travaille à Lyon."},
  "r9-faux-amis": {"t": "易混词：librairie、premier étage", "b": "librairie 是书店，bibliothèque 才是图书馆。法国的 rez-de-chaussée 是中国说的一楼，premier étage 是二楼，依此类推。这类词在听力选项里常被用来设陷阱，要按法国的习惯理解。例：J'achète des livres à la librairie. J'emprunte des livres à la bibliothèque."},
  "r9-de-infinitif": {"t": "il est interdit de / avoir peur de", "b": "il est interdit de + 不定式 表示“禁止做……”，avoir peur de + 不定式或名词 表示“害怕……”。注意禁止的具体范围，例如只禁止某种方式。这两个结构后面都接 de，后面的不定式才是关键信息。例：Il est interdit de fumer ici. J'ai peur de rater le train."},
  "r9-depuis-le-week-end": {"t": "depuis + 时间点；le week-end", "b": "depuis + 时间点 配现在时，表示“从……起一直如此”，不是“只在那时”。le week-end、le lundi 带定冠词表示“每个周末、每周一”。不带冠词的 samedi 一般指最近的某个周六。例：Depuis janvier, je fais du sport le samedi."},
  "r9-augmenter-diminuer": {"t": "augmenter / diminuer de", "b": "augmenter 是增加，diminuer 是减少，变化幅度用 de 引出：augmenter de dix pour cent = 增加 10%。听数据题时要同时抓住方向（增加还是减少）和幅度（具体数字），两者缺一不可。例：Les prix ont diminué de cinq pour cent. Le nombre d'élèves a augmenté."},
  "r10-deux-douze-onze": {"t": "deux [dø] / douze [duz] / onze", "b": "deux [dø] 的元音要圆唇，douze [duz] 是 ou 音且结尾有 z，des [de] 是开口的 é。onze 前面不省音也不连读：le onze [lə ɔ̃z]。区分这几个数要听元音：圆唇的 eu、靠后的 ou，以及开口的 é。例：deux enfants [døzɑ̃fɑ̃]，douze euros [duzøʁo]。"},
  "r10-dix-six-quinze-seize": {"t": "dix / six、quinze / seize", "b": "dix [dis] 和 six [sis] 只差开头的 d / s，在辅音前 x 不发音：six livres [si livʁ]。quinze [kɛ̃z] 是 k 开头、元音带鼻音，seize [sɛz] 是 s 开头、不带鼻音。数字放在元音前时 x 读 z 并连读。例：dix jours，quinze ans，seize ans。"},
  "r10-passe-compose-present": {"t": "复合过去时 vs 现在时", "b": "复合过去时比现在时多出助动词（a、ai、as）和过去分词结尾，所以音节更多：il prend [il pʁɑ̃] / il a pris [il a pʁi]。je vais + 不定式 则是将来。听力里先找有没有 a、ai 这样的短音，再听结尾的分词。例：je finis / j'ai fini，elle part / elle est partie。"},
  "r10-imparfait-present": {"t": "现在时 vs 未完成过去时", "b": "未完成过去时结尾多一个 [ɛ] 音，常常因此多一个音节：il parle [paʁl] / il parlait [paʁlɛ]，c'est [sɛ] / c'était [setɛ]，elle a [ɛla] / elle avait [ɛlavɛ]。数清动词的音节就能分辨。未完成过去时的 -ais、-ait、-aient 都读 [ɛ]。"},
  "r10-voudrais-voulais": {"t": "条件式 voudrais vs voulais", "b": "条件式 je voudrais [vudʁɛ] 中间有 d + r，未完成过去时 je voulais [vulɛ] 中间是 l。点餐、请求时用条件式 je voudrais 表示礼貌。条件式的标志就是词干中多出的 r 音。例：Je voudrais un thé. Je voulais te dire quelque chose."},
  "r10-determinants": {"t": "限定词辨音 le / ce / ces / mes", "b": "很多名词单复数读音相同，只能靠限定词分辨：le [lə] / les [le]，ce [sə] / ces [se]，ma [ma] / mes [me]。le samedi 是“每个周六”，ce samedi 是“这个周六”。听力里要把限定词的元音听清，它往往是唯一的线索。例：le livre / les livres，ma clé / mes clés。"},
  "r10-p-v": {"t": "辅音 p / v", "b": "p 是双唇闭合再爆破，v 是上齿轻触下唇的浊摩擦音。peux [pø] 和 veux [vø] 只差这一个辅音，意思完全不同：能 / 想。中文没有 v 这个音，容易把它发成 w，听的时候要注意摩擦声。例：pain [pɛ̃] / vin [vɛ̃]，pont / vont。"},
  "r10-s-z": {"t": "ss 读 [s]，元音间 s 读 [z]", "b": "两个元音之间的单个 s 读浊音 [z]，ss 读清音 [s]。这条规律能区分很多词对。这条规律反过来也适用于听写：听到元音之间的 [z] 一般写单个 s。例：coussin [kusɛ̃] 靠垫 / cousin [kuzɛ̃] 表兄弟，basse [bas] / base [baz]。"},
  "r10-u-ou": {"t": "u [y] 和 ou [u]", "b": "u [y] 嘴唇圆、舌头靠前（像发“衣”时圆唇），ou [u] 舌头靠后。dessus 是“上面”，dessous 是“下面”，sur / sous 也是同一对立。中文的“乌”接近 ou，u 则需要在发“衣”的舌位上把嘴唇撮圆。例：vu [vy] / vous [vu]，rue [ʁy] / roue [ʁu]。"},
  "r10-oi-e": {"t": "oi [wa] 和 è [ɛ]", "b": "oi 读 [wa]，ei、è 读 [ɛ]：troisième [tʁwazjɛm] 和 treizième [tʁɛzjɛm] 就靠这个区分。oi 是一个滑音加开口的 a，听起来更响亮；è 是单一的半开元音，听起来更短更平。例：trois [tʁwa] / très [tʁɛ]，moi [mwa] / mais [mɛ]。"},
  "r10-tu-vous": {"t": "tu 和 vous 的变位辨音", "b": "tu 的形式词尾字母一般不发音，vous 的形式常以 -ez [e] 结尾，而且词干可能变化：tu viens / vous venez，tu prends / vous prenez。听主语和动词结尾两处。选项里换人称时，往往动词也一起变了。例：tu vas / vous allez。"},
  "r11-determinants": {"t": "le / les、ce / ces 辨单复数", "b": "le [lə]、ce [sə] 的元音轻而短，les [le]、ces [se] 是清楚的 é。名词单复数读音常常相同，只能靠限定词，有时还能靠动词 est / sont 辅助判断。限定词的元音是区分单复数的关键。例：le livre / les livres，ce stylo est / ces stylos sont。"},
  "r11-liaison-ont-sont": {"t": "ils ont [z] vs ils sont [s]", "b": "avoir 的复数形式和代词连读时出现 z 音：ils ont [ilzɔ̃]，nous avons [nuzavɔ̃]；être 的 ils sont、savoir 的 nous savons 是清音 s。听 z 还是 s。这一对是听力里最常见的陷阱，z 是浊音，s 是清音，声带是否振动是关键。例：elles ont [ɛlzɔ̃] / elles sont [ɛlsɔ̃]。"},
  "r11-s-z": {"t": "ss 读 [s]，元音间 s 读 [z]", "b": "拼写规律：元音之间的单个 s 读 [z]，ss 读 [s]。辨音时注意清浊：[s] 声带不振动，[z] 声带振动。例：coussin [kusɛ̃] 靠垫 / cousin [kuzɛ̃] 表兄弟，russe [ʁys] / ruse [ʁyz]。听写时听到 [s] 在两个元音之间，就写 ss。"},
  "r11-conditionnel-r": {"t": "条件式的 r 音", "b": "条件式和未完成过去时结尾相同（-ais、-ait），区别在条件式词干里有 r：j'aimerais [ʒɛmʁɛ] / j'aimais [ʒɛmɛ]，je voudrais / je voulais。条件式表示愿望、礼貌或假设，未完成过去时表示过去的状态或习惯。例：je parlerais / je parlais，il finirait / il finissait。"},
  "r11-futur-r": {"t": "将来时的 r 音", "b": "简单将来时词干里有 r，所以比现在时多出 r 音：nous partons [paʁtɔ̃] / nous partirons [paʁtiʁɔ̃]，il vient / il viendra。将来时和条件式都带 r，区别在结尾：将来时 -rai、-ra，条件式 -rais、-rait。听到多出的 r 音，就要想到将来。例：je parle / je parlerai，on finit / on finira。"},
  "r11-deux-douze-dix": {"t": "deux / douze / dix 连读", "b": "deux、dix、six 在元音前连读成 z 音：deux ans [døzɑ̃]，dix heures [dizœʁ]，douze 本身就以 z 结尾。所以 z 音帮不上忙，要靠前面的元音区分：eu [ø] / ou [u] / i [i]。这三个数在听力题里经常同时出现，需要专门练习。例：deux euros，douze euros，dix euros。"},
  "r11-quinze-seize-treize": {"t": "quinze / seize / treize", "b": "quinze [kɛ̃z] 是 k 开头、元音带鼻音；seize [sɛz] 是 s 开头；treize [tʁɛz] 是 tr 开头。另外 cinq 在元音前读 [sɛ̃k]，带 k 音。这几个数的结尾都是 z 音，只能靠开头辅音和元音区分。例：quinze jours，seize ans，treize euros。"},
  "r11-soixante-quatre-vingts": {"t": "soixante / soixante-dix / 80", "b": "soixante = 60，soixante-dix = 70，quatre-vingts = 80，quatre-vingt-dix = 90。soixante 结尾的 t 要发音，后面接元音时直接连上：soixante euros [swasɑ̃t øʁo]。法国从 70 开始用组合说法，听到 soixante 后面还要等一等，看是否接着 dix 等数字。例：soixante-cinq，quatre-vingt-deux。"},
  "r11-u-ou": {"t": "u [y] 和 ou [u]：sur / sous", "b": "sur [syʁ] 是 u 音（嘴唇圆、舌头靠前），sous [su] 是 ou 音（舌头靠后），意思正好相反：上 / 下。这对元音在方位词里特别重要，听错就会把位置完全弄反。例：tu [ty] / tout [tu]，rue [ʁy] / roue [ʁu]。"},
  "r11-imparfait-present": {"t": "现在时 vs 未完成过去时", "b": "未完成过去时结尾多一个 [ɛ] 音，或在 nous 形式多一个 [j] 音：il faut [fo] / il fallait [falɛ]，il y a / il y avait，nous chantons [ʃɑ̃tɔ̃] / nous chantions [ʃɑ̃tjɔ̃]。将来时则带 r：il sera。数动词的音节。现在时、过去时、将来时的区别常常只在一个音节上。"},
  "r11-passe-compose-present": {"t": "复合过去时 vs 现在时 / 将来", "b": "复合过去时多出助动词和过去分词：il prend / il a pris，elle vend / elle a vendu。tu as vu [ty a vy] 是过去，tu vas voir [ty va vwaʁ] 是将来。先听主语后面有没有助动词 a、as、ai，再听结尾的分词，两处都对上才是复合过去时。例：je finis / j'ai fini。"},
  "r11-pluriel-verbe": {"t": "动词单复数：boivent、连读 z", "b": "第三组动词复数常多出词尾辅音：il boit [bwa] / ils boivent [bwav]，il prend / ils prennent [pʁɛn]。-er 动词单复数读音相同，只能靠 ils 的连读 z 区分：il aime [ilɛm] / ils aiment [ilzɛm]。听复数时要同时注意主语的连读和动词结尾的辅音。"},
  "r11-consonne-finale": {"t": "词尾辅音的有无", "b": "词尾有没有辅音常常就是两个词的区别：pleut [plø] / pleure [plœʁ]，mai [mɛ] / mars [maʁs]，poste [pɔst] / porte [pɔʁt]。听清最后一个音。法语词尾的辅音要么完全不发音，要么清楚地发出来，需要认真辨别。例：peu [pø] / peur [pœʁ]，port [pɔʁ] / porte [pɔʁt]。"},
  "r11-nasales": {"t": "鼻化元音 an / in / un", "b": "鼻化元音和普通元音要分开：faim [fɛ̃] / fini [fini]，un [œ̃] / deux [dø]。鼻化元音之间也要区分：an、en 读 [ɑ̃]，嘴张得大、偏后；in、ain 读 [ɛ̃]，偏前。鼻化元音发音时气流同时从口腔和鼻腔出来，不要在后面加 n 或 ng 音。例：sans [sɑ̃] / saint [sɛ̃]，lundi [lœ̃di] / mardi。"},
  "r11-consonnes-proches": {"t": "相近辅音 p / v、g / k", "b": "p [p] 是双唇爆破，v [v] 是唇齿摩擦；g [g] 是浊音（声带振动），k [k] 是清音。中文的 b、d、g 是不送气清音，法语的 b、d、g 是浊音，听起来更“闷”一些。例：peux [pø] / veux [vø]，gare [gaʁ] / car [kaʁ]，goût [gu] / cou [ku]。"},
  "r11-moins-le-quart": {"t": "et quart / moins le quart", "b": "et quart 是“过一刻”（加 15 分钟），moins le quart 是“差一刻”（减 15 分钟），et demie 是“半”。moins 是“减”，所以要从后面的钟点往前倒推，例如十一点差一刻是十点四十五分。例：huit heures moins le quart = 7:45，deux heures et quart = 2:15，six heures et demie = 6:30。"},
  "r16-prep-verb-form": {"t": "介词后的动词形式", "b": "介词后面的动词一律用不定式（英语常用 -ing）：sans parler、pour comprendre。après 后面要用不定式过去时：après avoir mangé、après être arrivé。唯一的例外是 en，后接现在分词构成副动词：en marchant。"},
  "r16-prep-idioms": {"t": "与英语不对应的介词搭配", "b": "有些介词用法和英语不同，要逐个记：à la radio（on the radio）；最高级的范围用 de：la plus grande ville du pays（in）；avoir confiance en qn（信任）；de la part de qn（以某人名义），“替我”说 de ma part，不说 *de moi。"},
  "r16-compound-prep-repeat": {"t": "复合介词并列时的省略", "b": "复合介词后接两个并列名词时，第二个名词前只重复最后的 de（或 à），不重复整个介词：à côté de la gare et de la poste、loin de Paris et de Lyon。"},
  "r16-jouer-a-de": {"t": "jouer à / jouer de", "b": "jouer à + 定冠词 + 体育运动或游戏：jouer au football、jouer aux cartes。jouer de + 定冠词 + 乐器：jouer du violon、jouer de la flûte。两种都要和定冠词缩合：à + le = au，de + le = du。"},
  "r16-cities-islands": {"t": "城市和岛屿前的介词", "b": "城市名前用 à；城市名自带阳性冠词时要缩合：Le Havre → au Havre，阴性冠词不缩合：à La Haye。很多小岛也用 à：à Malte、à Chypre；阴性的大岛用 en：en Corse、en Sardaigne。"},
  "r16-chez-person": {"t": "chez + 人，à + 地方", "b": "去某人家里或某人的店里，用 chez + 人：chez le médecin、chez le boulanger、chez mes parents。说的是地点、店名时才用 à：à la boulangerie、à la pharmacie。au médecin 之类是口语，正式法语不宜。"},
  "r16-transport": {"t": "交通方式：en / à / dans", "b": "交通方式的介词取决于人和工具的关系。坐在交通工具里面用 en：en bus、en métro、en avion；骑乘或步行用 à：à pied、à cheval，自行车 à vélo / en vélo 都行。指具体那辆车“在车上”用 dans：dans le bus、dans l'avion。"},
  "r16-a-usage": {"t": "à + 无冠词名词：用途", "b": "名词 + à + 不带冠词的名词或不定式，表示这个东西是用来做什么的：une cuillère à soupe、une machine à coudre、une salle à manger。对比 de 表内容：un verre de vin（一杯酒）、un verre à vin（酒杯）。"},
  "r16-de-cause-manner": {"t": "de 表原因、方式", "b": "de 除了来源、所属之外，还可以表示原因，常接情感或生理感受：mourir de faim、rougir de honte、sauter de joie。也可以表示方式：d'une voix douce、de cette manière、d'un geste rapide。"},
  "r16-en-change-role-state": {"t": "en：变成、打扮成、状态", "b": "en + 不带冠词的名词有几种引申用法。表示变化的结果：se transformer en papillon、couper en morceaux；表示身份或装扮：se déguiser en pirate；表示状态，多在 être 后：être en retard、en bonne santé、en vacances。"},
  "r16-material": {"t": "材料：en / de", "b": "表示用什么材料做成，可以用 en 或 de：une table en bois / de bois、un pull en laine。en 更常用、更明确，有些搭配用 de 很别扭，例如贵金属一般说 un collier en argent、une montre en or。"},
  "r16-seasons-decades": {"t": "季节、年份与年代", "b": "季节、年份和年代前的介词各不相同。季节前用 en：en été、en automne、en hiver，唯一例外是 au printemps。具体年份、月份也用 en：en 2010、en mars。整个年代则用 dans：dans les années quatre-vingt。"},
  "r16-time-en-dans-pour": {"t": "en / dans / pour + 时段", "b": "en + 时间段：完成一件事所花的时间（Il a fini en une heure）。dans + 时间段：从现在起多久以后（Je reviens dans une heure），反义是 il y a。pour + 时间段：与 partir、aller、venir 等连用表示预计时长（Il part pour trois mois）。"},
  "r16-a-vs-dans-place": {"t": "à 与 dans 表地点", "b": "à 只点出地点，常用于对比不同地方：Il fait plus chaud à Rome qu'à Berlin。dans 强调在某个空间范围之内：se promener dans Lyon；固定说法 à l'école、à l'hôpital 里的名词一旦带修饰语就改用 dans：dans une école privée。dans 还可以表示“从……里”拿、喝：boire dans un verre。"},
  "r16-par-frequency-commencer": {"t": "par 表“每”与 commencer par", "b": "par 可以表示“每”，用于频率、比率：trois fois par semaine、dix euros par personne。commencer par + 不定式 = 先从……开始，finir par + 不定式 = 最后终于；对比 commencer à（开始做）、finir de（做完）：Il a fini par accepter。"},
  "r16-vers-envers": {"t": "vers / envers", "b": "两者形近但意思不同。vers 表示方向（Il marche vers la gare）或大约的时间（vers midi）。envers 只表示对人的感情、态度，相当于“对……”：être gentil envers ses voisins、la reconnaissance envers ses parents。"},
  "r16-sur-au-dessus": {"t": "sur / au-dessus de", "b": "两者都是“在……上”，区别在于是否接触。sur 表示贴在表面上：le livre est sur la table。au-dessus de 表示在上方、不接触：La lampe est au-dessus de la table、voler au-dessus de la ville。反义分别是 sous 和 au-dessous de。"},
  "r16-sans-avec-no-article": {"t": "sans / avec + 无冠词名词", "b": "avec、sans + 名词表示方式或“有／没有”时，名词前一般不加冠词，不定冠词和部分冠词都省去：sortir sans manteau、travailler avec patience、un café sans sucre。"},
  "r16-a-cause-de": {"t": "à cause de 与 parce que", "b": "à cause de、grâce à 是介词短语，后接名词或代词：à cause du bruit、grâce à toi；grâce à 用于带来好结果的原因。parce que、car 是连词，后接完整的句子：parce qu'il pleut。"},
  "r17-chez": {"t": "chez 的用法", "b": "去某人家或某人的店里用 chez + 人：aller chez le dentiste，正式法语不说 au dentiste。从某人那里来，两个介词连用：revenir de chez le médecin。chez + 一类人还可以表示“在……当中”，相当于 parmi：chez les adolescents。"},
  "r17-en-no-article": {"t": "en 后接无冠词名词", "b": "en 后面的名词一般不带冠词，表示泛指的场所或状态：en ville、en prison、en classe。名词一旦带冠词或修饰语，就改用 dans 或 à：dans la ville、dans une prison moderne、à la maison。不能说 *en la maison。"},
  "r17-countries-regions": {"t": "国家、地区名前的介词", "b": "阴性国家（多以 -e 结尾）用 en / de：en France、de Chine；阳性用 au / du：au Japon、du Canada；复数用 aux / des：aux États-Unis。注意 le Mexique、le Cambodge 是阳性。阴性地区用 en：en Bretagne；法国的阳性省份一般用 dans le：dans le Nord。"},
  "r17-sans-avec": {"t": "sans / avec 后接什么", "b": "sans 后接不定式或不带冠词的名词：sans rien dire、sans hésiter、sans argent，不能接现在分词。avec / sans + 不带冠词的抽象名词相当于方式副词：avec patience = patiemment、sans peine = facilement。"},
  "r17-en-duration": {"t": "en + 时间段：所花时间", "b": "en + 时间段表示完成一件事所花的时间，强调“只用了多久”：J'ai lu ce roman en trois jours。dans + 时间段则是“从现在起……以后”，用于将来：Je finirai dans trois jours。"},
  "r17-motion-verbs": {"t": "位移动词 + 方式", "b": "英语常用“方式动词 + 介词”（run out、swim across），法语用表示位移的动词，再用 en + 现在分词或 à la nage 等补充方式：Elle monta l'escalier en courant、traverser le lac à la nage。方式显而易见时直接省略。"},
  "r17-across": {"t": "across 的几种译法", "b": "英语 across 在法语中没有固定对应，要按实际意思选：à travers / au travers de = 穿过（à travers 后面不加 de）：à travers la forêt；en travers de = 横在……上：un camion en travers de la route；de l'autre côté de = 在对面；桥架在河上用 sur：un pont sur la Loire。"},
  "r17-vers-approx": {"t": "vers = 大约", "b": "vers + 时间表示“大约”，不确定具体时刻，可以换成 aux environs de：vers huit heures = aux environs de huit heures。envers 不表示时间，只表示对人的态度：poli envers ses clients。"},
  "r17-cause-de-par": {"t": "表原因的 de 和 par", "b": "de 可以表示原因，多接情感或生理感受：mourir de faim、rougir de honte。par 也可以表示原因，多接品性、动机：par curiosité、par jalousie。注意区分 de 的其他意思：来源（venir de Rome）、内容（un verre d'eau）、所属。"},
  "r17-a-usage-possession": {"t": "à：用途与所属", "b": "同一个 à 有两种常见用法。à + 不带冠词的名词或不定式表示用途：une cuillère à soupe、une machine à coudre；对比 de 表内容：une tasse de thé（一杯茶）。être à qn 表示所属：Ce livre est à moi、C'est à qui ?"},
  "r17-prep-as-other-pos": {"t": "介词与其他词类", "b": "介词后面没有补语时就成了副词：Il est resté derrière、Passe devant !。反过来，有些分词放在名词前、不变化时用作介词：passé minuit、vu les circonstances、excepté les enfants。"},
  "r17-de-a-range": {"t": "de … à：从……到……", "b": "表示一段范围时，de 引出起点，à 引出终点，时间和地点都适用：du lundi au vendredi、de Paris à Lyon。也可以说 entre … et：entre midi et deux heures，但不能混搭成 *entre … à。"},
  "r17-compound-prep-share": {"t": "两个复合介词共用名词", "b": "两个以 de 结尾的复合介词共用同一个名词时，第一个省略 de，只在最后保留：à droite et à gauche de la porte。"},
  "r17-commencer-finir": {"t": "commencer / finir 的介词", "b": "四种搭配意思不同：commencer à 表示开始做某事；commencer par 表示先从……做起；finir de 表示把某事做完；finir par 表示经过一番周折最后终于：Elle a commencé à pleurer、Il a fini par comprendre、J'ai fini de lire ce livre。"},
  "r17-verb-direct-vs-prep": {"t": "动词直接宾语还是加介词", "b": "有些动词的结构和英语、中文不同，需要逐个记：chercher、attendre、écouter、regarder 直接接宾语（英语有介词）；se rappeler qch 直接接，se souvenir de qch 要加 de；dépendre de、ressembler à、penser à 都要介词。"},
  "r17-verb-a-de-inf": {"t": "动词 + à / de + 不定式", "b": "动词后接不定式时用哪个介词由动词决定，需要逐个记：apprendre à、réussir à、commencer à；risquer de、essayer de、décider de。permettre、conseiller、demander 等的结构是人前用 à、不定式前用 de：Il conseille à son fils de partir。"},
  "r17-fixed-par-en": {"t": "par hasard、en plein", "b": "一些常见固定搭配要整体记忆。par 的固定搭配：par hasard（偶然）、par cœur（背诵）、par terre（在地上）、un par un（一个一个地）。en plein + 名词表示“正当……中间”：en plein jour、en pleine nuit、en plein été。"},
  "r17-pour-purpose": {"t": "pour + 不定式：目的", "b": "pour + 不定式表示目的“为了”，不定式的逻辑主语与主句主语相同；主语不同时要用 pour que + 虚拟式：Il économise pour acheter une maison、Elle lit pour se détendre、Je le dis pour que tu le saches。"},
  "r17-sous-figurative": {"t": "sous 的引申用法", "b": "sous 除了“在……下面”，还常用于一些引申的固定表达，要整体记忆：sous le règne de（在……统治时期）、sous Louis XIV、sous cet angle（从这个角度）、sous forme de（以……形式）。"},
  "r18-a-feature": {"t": "à + 定冠词名词：特征", "b": "à + 带定冠词的名词可以表示人或物的特征，相当于英语 with：la fille aux yeux bleus、l'homme au chapeau noir。对比 à + 无冠词名词表示用途：une machine à café。"},
  "r18-a-usage-possession": {"t": "à：用途与所属", "b": "同一个 à 有两种常见用法。à + 不带冠词的名词或不定式表示用途：une cuillère à soupe、une machine à coudre。être à qn、appartenir à qn 表示所属：Cette voiture est à mon frère。两种用法都用 à。"},
  "r18-a-time-manner": {"t": "à：时间点与方式", "b": "à 可以指具体的时间点或某个时期，回答“什么时候”：à midi、à huit heures、au XIXe siècle。à 也可以引出方式：écrit à la main、parler à voix basse、rouler à toute vitesse，回答“怎样做”。"},
  "r18-de-cause-manner": {"t": "de：原因与方式", "b": "de 可以表示原因，多接情感或生理感受：mourir de faim、rougir de honte。也可以表示方式：d'une voix douce、de cette façon。de 的意思非常多，要靠搭配判断。"},
  "r18-de-origin-start": {"t": "de：来源与起点", "b": "de 引出地点时表示来源、出发点：venir de Lyon、sortir de la maison；引出时间时表示开始。两者常和表示终点的 à 搭配：de Paris à Rome、de 8 h à midi。"},
  "r18-material-content": {"t": "材料、内容：en / de", "b": "表示材料用 en 或 de + 不带冠词的名词：une table en bois / de bois，不用 par。de 还表示容器里的内容：un verre de vin = 一杯酒；à 表示用途：un verre à vin = 酒杯。"},
  "r18-de-possession-vue": {"t": "de 表所属；de vue", "b": "de + 有限定的名词表示所属、从属关系，相当于“……的”：le vélo de mon frère、la capitale de la France。固定说法 connaître qn de vue = 只见过面、不熟；connaître qn de nom = 只听说过名字。"},
  "r18-passive-agent": {"t": "施动者 par / de", "b": "被动语态的施动者一般用 par，尤其是具体动作：Ce tableau a été peint par Monet。表示感情、状态的动词常用 de：être respecté de ses collègues。par 还可以表示“每”：trois fois par semaine。"},
  "r18-en-transport-state": {"t": "en：交通方式与状态", "b": "en 后接不带冠词的名词，意思很多。人在交通工具里面时用 en：en bus、en métro、en avion。en 还表示身体或心理状态，多在 être 后：être en forme、en bonne santé、en vacances。"},
  "r18-en-clothes-change": {"t": "en：穿着与变成", "b": "en + 不带冠词的名词可以表示穿着，“穿着……”：en jean、en uniforme、en pyjama。也可以表示变化的结果“变成”：se transformer en papillon、couper en morceaux。"},
  "r18-en-dans-time": {"t": "en / dans + 时间", "b": "en 用于年份、月份、季节：en 2008、en juillet、en hiver（但 au printemps）。en + 时间段表示完成所用的时间：Il a fait le trajet en deux heures。dans + 时间段表示从现在起多久以后：Le train part dans cinq minutes。"},
  "r18-gerondif": {"t": "副动词 en + 现在分词", "b": "en + 现在分词构成副动词，主语与主句相同。可以表示同时：Elle lit en mangeant（边吃边读）；也可以表示条件或方式：En partant tôt, tu éviteras les bouchons（= si tu pars tôt）。"},
  "r18-dans-from-figurative": {"t": "dans：从……里；抽象处境", "b": "从容器、地方里拿取或喝东西，法语用 dans 而不用 de，这和中文、英语的思路不同：boire dans un verre、copier une phrase dans un livre。dans 也有比喻用法，表示抽象处境：être dans l'embarras、dans le doute。"},
  "r18-author-chez": {"t": "chez / dans + 作家", "b": "dans + 作家名或 chez + 作家名，都表示“在这位作家的作品中”：On trouve ce thème chez Balzac。chez + 一类人表示“在……当中”，相当于 parmi：Cette maladie est rare chez les enfants。"},
  "r18-par-path-means": {"t": "par：经过、途径、原因", "b": "par 的基本意思是“经过”。它表示经过的地点或路径：passer par Lyon、sortir par la porte；比喻用法表示“通过某种途径”：J'ai eu la nouvelle par un collègue；还可以表示动机、原因：par curiosité、par politesse。"},
  "r18-pour": {"t": "pour：目的、原因、去向", "b": "pour 意思很多，要看后面接什么。pour + 不定式表示目的：Il économise pour partir en voyage。pour + 不定式过去时表示原因：Il a été puni pour avoir triché。pour + 地点表示去向：l'avion pour Rome。"},
  "r18-pour-inf-special": {"t": "pour + 不定式的特殊用法", "b": "pour + 不定式可以引出出乎意料的后续动作：Elle s'est levée pour se rasseoir aussitôt（站起来，结果马上又坐下）。也可以相当于关系从句：Il n'a personne pour l'aider = personne qui puisse l'aider。"},
  "r18-sur-sous": {"t": "sur / sous 的引申用法", "b": "sur 除了“在……表面上”，还可以表示“关于”，相当于 au sujet de：un livre sur la Chine；量尺寸时相当于 by（乘）：une chambre de quatre mètres sur cinq。sous 的固定用法：sous Louis XIV、sous cet angle、sous forme de（以……形式）。"},
  "r18-vers": {"t": "vers：大约与方向", "b": "vers + 时间表示“大约”，不确定具体时刻：vers huit heures，相当于 aux environs de；vers + 地点表示方向：marcher vers la gare。表示对人的态度要用 envers：poli envers ses clients。"},
  "r18-avec-manner": {"t": "avec + 无冠词名词：方式", "b": "avec + 不带冠词的抽象名词表示做事的方式，相当于一个方式副词：avec patience = patiemment、avec prudence = prudemment。带冠词的 avec 一般表示伴随或工具：avec un ami、avec un couteau。"},
  "r19-a-view-manner": {"t": "à 引出观点与方式", "b": "à 构成许多固定表达。表示观点：à mon avis、à ton avis（依我/你看），à ta place（换作是你）；表示方式：à la hâte（匆忙地）、à pied（步行）、à voix basse（低声地）。"},
  "r19-a-time": {"t": "à 表时刻、时期与“及时”", "b": "à 既可指时间点（à midi），也可指一个时期（au dix-neuvième siècle、à l'époque romantique）。注意 à temps = 及时、赶得上；à l'heure = 准时、准点。"},
  "r19-a-en-moment": {"t": "à ce moment / en ce moment", "b": "à 表示瞬间，en 表示持续。à ce moment-là = 在那一刻（过去或将来某个时刻）；en ce moment = 现在、这段时间：En ce moment, je lis beaucoup."},
  "r19-de-idioms": {"t": "de 构成的固定表达", "b": "de 能构成一些固定说法：être de garde / de service = 值班；être d'avis que = 认为；connaître qn de vue = 只是面熟。这类意思要整体记忆，不能逐字理解。"},
  "r19-de-par-author": {"t": "de 的歧义与 par 引出作者", "b": "de 意思太宽，un portrait de Rembrandt 既可能是他画的，也可能是画他的。名词带两个补语时，第二个改用意思明确的 par：un portrait de la reine par un jeune peintre（画的是女王，画家另有其人）。"},
  "r19-en-material": {"t": "en 表材料、颜色与比喻", "b": "en 表示材料：une table en bois、une bague en or；也可表示颜色或形状：peindre en vert、un escalier en colimaçon。还有比喻用法：un cœur en or = 金子般的心、心地极好。"},
  "r19-en-plein": {"t": "en plein(e) + 名词：正当中", "b": "en plein(e) + 名词表示“在……正中、正当……时”：en plein été（盛夏）、en pleine nuit（深夜）、en plein centre-ville（市中心）、en plein air（露天）。"},
  "r19-dans-uses": {"t": "dans 的引申用法", "b": "城市名前一般用 à，但城市名带修饰语时用 dans：dans la Rome antique。dans 还可表示目的：dans le but de、dans l'intention de；表示范围、处境：dans les limites du possible、être dans le besoin。"},
  "r19-par-uses": {"t": "par 的固定表达与交通方式", "b": "par 构成许多固定表达：par hasard（偶然）、par terre（在地上）、deux par deux（两个两个地）。par 还可表示途径、交通方式：envoyer par la poste、voyager par avion（也可说 en avion）。"},
  "r19-finir-par": {"t": "finir par / commencer par", "b": "finir par + 不定式 = 最后终于（做了某事）：Elle a fini par céder. commencer par + 不定式 = 先从……开始。对比 finir de + 不定式 = 做完某事：J'ai fini de manger."},
  "r19-pour-attribute": {"t": "passer pour / prendre pour", "b": "pour 可引出表语。passer pour + 名词/形容词 = 被认为是、被当作（主语的表语）：Il passe pour un expert. prendre qn pour + 名词 = 把某人当成（常指误认，宾语的表语）：On me prend souvent pour ma sœur."},
  "r19-sur-idioms": {"t": "sur 的习惯用法", "b": "sur 有些用法与中文“在上面”不对应：laisser la clé sur la porte = 把钥匙插在门锁上；lire la joie sur son visage = 从脸上看出喜悦。"},
  "r19-sous-au-dessous": {"t": "sous 与 au-dessous de", "b": "sous = 在……下面（常被遮盖）：sous la table、sous la pluie。au-dessous de = 低于、在……以下，常用于刻度和水平：au-dessous de la moyenne、dix degrés au-dessous de zéro。反义是 au-dessus de。"},
  "r19-avant-devant": {"t": "avant（时间）与 devant（空间）", "b": "一般 avant 用于时间、顺序，devant 用于空间位置。指路时 juste avant la poste = 快到邮局还没到时；juste devant la poste = 就在邮局正前方。devant 也可表示“在……面前”：parler devant tout le monde。"},
  "r19-avec-sans-alone": {"t": "avec / sans 不带补语", "b": "口语中 avec、sans 可以单用，补语就是上文提到的东西：Tu as ton parapluie ? — Non, je suis venu sans. faire avec = 将就现有的条件：Ce n'est pas idéal, mais on fait avec."},
  "r19-chez-company": {"t": "chez：家、店铺、公司", "b": "chez 本义是“在某人家”：chez moi；引申为“在某人的店里或诊所”：chez le boulanger、chez le dentiste；再引申为“在某公司”：travailler chez Michelin。"},
  "r19-prep-word-class": {"t": "介词的词性转换", "b": "avant、après、devant、depuis 等后面没有补语时就成了副词：Je l'ai vu deux jours après. 反过来，有些分词可当介词用：suivant les saisons = 根据季节（介词），而 le mois suivant 中 suivant 是形容词。"},
  "r21-penser-a-de": {"t": "penser à / penser de", "b": "penser à qn / qch = 想着、惦记：Je pense à mon examen. penser de = 对……有什么看法，多用于疑问句：Que penses-tu de mon idée ? 回答时常用 penser que：Je pense que c'est bien."},
  "r21-verbs-de": {"t": "接 de 的动词与形容词", "b": "许多动词和表达后面接 de，别照英语直译：dépendre de（取决于，不用 sur）、se méfier de（提防）、avoir peur de、tomber / être amoureux de（不用 avec）、être fier de：Ça dépend de toi."},
  "r21-croire-en-a": {"t": "croire en / à / qn", "b": "croire en 用于信仰或信任：croire en Dieu、croire en soi。croire à qch = 相信某事存在或为真：croire aux fantômes（à + les = aux）。croire qn 不加介词 = 相信某人说的话：Je te crois."},
  "r21-manquer": {"t": "manquer à / de / 直接宾语", "b": "A manque à B = B 想念 A，被想念的做主语：Mes parents me manquent（我想念父母）。manquer de + 无冠词名词 = 缺乏：manquer de sel。manquer qch = 错过：manquer le bus。"},
  "r21-entre-parmi": {"t": "entre 与 parmi", "b": "entre 用于两者之间（或界限分明的几者之间）：entre Paris et Lyon。parmi + 复数名词（三个以上）= 在……之中：parmi les invités、parmi nous。"},
  "r21-cause-concession": {"t": "让步与原因：malgré 等", "b": "malgré + 名词 = 尽管（让步）：malgré la fatigue。grâce à 引出好结果的原因，à cause de 引出中性或坏结果的原因。faute de + 无冠词名词 = 因为缺少：faute de temps。à force de = 由于反复：à force de travail。"},
  "r21-compound-preps": {"t": "au lieu de、d'après 等复合介词", "b": "au lieu de = 代替、不……而……：au lieu de dormir。d'après / selon = 根据……的说法：selon les experts。quant à + 重读代词或名词 = 至于：quant à lui。auprès de = 向（某人、机构）打听、申请：se plaindre auprès du directeur。"},
  "r21-depuis-ilya-pendant": {"t": "depuis / il y a / pendant", "b": "depuis + 时段配现在时，表示持续到现在：Je travaille ici depuis cinq ans. il y a + 时段 = ……以前（过去时间点）。pendant = 在……期间（常指已结束的一段）。pour + 时段多用于计划，dans + 时段指将来。"},
  "r21-time-start": {"t": "à partir de / dès / lors de", "b": "à partir de = 从……起，起点可在现在或将来：à partir de lundi（depuis 的起点在过去）。dès + 名词 = 一……就：dès son retour；接从句用 dès que。lors de + 名词 = 在……之际（较正式）：lors de la réunion。"},
  "r21-contre": {"t": "contre：对着、反对、交换", "b": "contre 本义是“对着、相对”：s'appuyer contre le mur（靠着）；反对：voter contre；针对：un sirop contre la toux；交换：échanger A contre B。se fâcher contre qn = 冲某人发火，se fâcher avec qn = 和某人闹翻。"},
  "r21-sauf": {"t": "sauf：除……以外", "b": "sauf = 除……以外，被除去的部分不包括在内，同义的有 excepté、à part。注意它和 malgré（尽管）、parmi（在……之中）意思完全不同：Je mange de tout sauf le poisson. Tout le monde est d'accord, à part moi."},
  "r21-tenir-a-de": {"t": "tenir à / tenir de", "b": "tenir à qch / qn = 珍惜、看重：Il tient à son indépendance. tenir à + 不定式 = 坚持要：Je tiens à payer. tenir de qn = 像某位长辈（长相或性格）：Il tient de son grand-père."},
  "r21-merci-pour-de": {"t": "merci pour / merci de", "b": "merci 后接名词时用 pour 或 de 都可以：merci pour le repas、merci de votre patience。后面接不定式时只能用 de：Merci de m'avoir aidé."},
  "r21-place-preps": {"t": "方位：对面、旁边、尽头", "b": "en face de = 在……对面（隔着街道等）；à côté de = 在……旁边（同一侧）；au bout de = 在……尽头：au bout du couloir，用于时间时表示“……之后”：au bout d'une heure。"},
  "r21-s-interesser-a": {"t": "s'intéresser à", "b": "代动词 s'intéresser 后面接 à，与 penser à（想着）用同一个介词：Il s'intéresse à la musique. 换成名词或其他动词的说法时用 pour：avoir de l'intérêt pour qch、se passionner pour qch。"},
  "r21-adj-a-de": {"t": "形容词 + à / de + 不定式", "b": "名词主语 + être + 形容词 + à + 不定式（主语就是动作对象）：Cette question est difficile à résoudre. 无人称句 il est / c'est + 形容词 + de + 不定式：Il est difficile de résoudre cette question. 表情绪的形容词接 de：heureux de vous voir。"},

function localDb(ns) {
  const key = c => `${ns}-db-${c}`;
  const load = c => { try { return JSON.parse(localStorage.getItem(key(c)) || "[]"); } catch (e) { return []; } };
  const snap = arr => ({ size: arr.length, docs: arr.map(d => ({ data: () => d })) });
  return { collection: c => ({
    add: async d => { const a = load(c); a.push(d); localStorage.setItem(key(c), JSON.stringify(a)); },
    get: async () => snap(load(c)),
    where: (f, op, v) => ({ get: async () => snap(load(c).filter(d => d[f] === v)) }),
  }) };
}
(async () => {

const SHOW_EPS = ["Pilot","Spanish 101","Introduction to Film","Social Psychology","Advanced Criminal Law","Football, Feminism and You",
  "Introduction to Statistics","Home Economics","Debate 109","Environmental Science","The Politics of Human Sexuality","Comparative Religion",
  "Investigative Journalism","Interpretive Dance","Romantic Expressionism","Communication Studies","Physical Education","Basic Genealogy",
  "Beginner Pottery","The Science of Illusion","Contemporary American Poultry","The Art of Discourse","Modern Warfare",
  "English as a Second Language","Pascal's Triangle Revisited"];

function members(key) {
  if (key.startsWith("ch:")) { const n = Number(key.slice(3)); return BANK.filter(q => q.ch === n && !isListen(q)); }
  if (key.startsWith("ep:")) { const n = Number(key.slice(3)); return BANK.filter(q => q.ep === n); }
  return BANK.filter(q => roundOf(q.id) === key);
}
function inGroup(key, q) {

}
function labelOf(key) {

  if (key.startsWith("ep:")) { const n = Number(key.slice(3)); return `废柴联盟 S1E${n} · ${SHOW_EPS[n - 1]}`; }

// 错题本里每道题归到哪一组：听力题按集或按轮，其余按章节

// 每组做几题（0 = 整轮一次做完），默认 10 题，记在本机浏览器里

const tts = "speechSynthesis" in window ? window.speechSynthesis : null;

function pickVoice() {
  if (!tts) return null;
  // 有的系统把语言写成 fr_FR 或 fra-FRA；没选到法语声音时浏览器可能用英语声音读，带重音的字母会读错
  const fr = tts.getVoices().filter(v => /^fr(a)?([-_]|$)/i.test(v.lang));
  const score = v => (/^fr(a)?[-_]FRA?$/i.test(v.lang) ? 4 : 0) + (/enhanced|premium|natural|neural/i.test(v.name) ? 3 : 0)
    + (/amélie|amelie|thomas|audrey|aurélie|marie/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
  fr.sort((a, b) => score(b) - score(a));
  return fr[0] || null;
}
if (tts) { frVoice = pickVoice(); tts.addEventListener?.("voiceschanged", () => { frVoice = pickVoice(); }); }
function speak(text, rate, btn) {
  if (!tts) return false;
  lastAutoAudio = text;
  if (!frVoice) frVoice = pickVoice();   // 声音列表可能在页面打开后才加载好
  tts.cancel();
  document.querySelectorAll('.play[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false"));
  // 长文按句子拆开排队朗读，避免一次读太长被系统截断
  const parts = text.match(/[^.!?…]+[.!?…]+["»]?\s*|[^.!?…]+$/g) || [text];
  parts.forEach((part, k) => {
    const u = new SpeechSynthesisUtterance(part.trim());
    u.lang = "fr-FR";
    if (frVoice) u.voice = frVoice;
    u.rate = rate;
    if (btn && k === parts.length - 1) u.onend = u.onerror = () => btn.setAttribute("aria-pressed", "false");
    tts.speak(u);
  });

}
let lastAutoAudio = null;   // 同一篇长文的几道题之间不重复自动播放

let hintUsed = false;
function renderQuestion() {

  const buttons = [];

  if (item.audio && !tts) { exp.textContent = ""; exp.append(el("span", "transcript", item.audio)); }
  exp.id = "explain";

function choose(i, buttons, card, order) {

  const exp = card.querySelector("#explain");
  exp.classList.remove("pending");
  exp.textContent = "";
  exp.scrollTop = 0;
  exp.append(el("b", right ? "ok" : "no", right ? "回答正确！" : `答错了，正确答案是 ${KEYS[order.indexOf(item.a)]}。`));
  if (item.say && tts) {
    const hear = el("button", "play slow say", "▶ 听原句");

    exp.append(document.createTextNode(" "), hear);
  }
  if (item.audio) {
    exp.append(el("span", "transcript", item.quote || item.audio));
    if (item.tr) exp.append(document.createTextNode(item.tr + " "));
  }
  if (hintUsed) exp.append(el("span", "hint-used", "（用了提示）"));
  exp.append(document.createTextNode(" " + item.exp));
  if (study && item.kp && KP[item.kp]) exp.append(el("span", "kp-note", "📌 知识点：" + KP[item.kp].t));
  const hb = card.querySelector("#hintBtn");
  if (hb) hb.disabled = true;
  const next = card.querySelector("#nextBtn");
  next.disabled = false;
  updateProgress(idx + 1);
  next.focus({ preventScroll: true });
}

function renderResult() {
  updateProgress(bEnd());
  savePos();   // 做完一组后，下次从第 1 题开始
  stage.innerHTML = "";
  const card = el("section", "card");
  const s = el("p", "score", String(score));
  const nB = bEnd() - bStart;
  s.append(el("small", null, ` / ${nB}`));
  const pct = score / nB;
  const msg = pct === 1 ? "Parfait ! 全对，这部分掌握得很扎实。" : pct >= .75 ? "很不错，只差一点点。" : pct >= .5 ? "及格了，看看解析还能再进步。" : "再来一次吧，解析里都有答案。";
  card.append(el("span", "tag", nB < set.qs.length ? `${set.label} · 第 ${bStart + 1}–${bEnd()} 题` : set.label), s, el("p", "sub", msg));
  const list = el("ul", "review");
  set.qs.slice(bStart, bEnd()).forEach((item, j) => {
    const i = bStart + j;
    const done = answers[i] !== undefined;
    const ok = answers[i] === item.a;
    const li = el("li");
    li.append(el("span", "mark " + (ok ? "ok" : done ? "no" : ""), ok ? "✓" : done ? "✗" : "–"));
    const t = el("span", null, item.q + " ");
    t.append(el("span", "ans", `正确答案：${item.opts[item.a]}`));
    li.append(t);
    list.append(li);
  });
  card.append(list);
  const actions = el("div", "actions");
  const book = el("button", "btn ghost", "看错题本");
  book.type = "button";
  book.addEventListener("click", () => switchView("book"));
  const again = el("button", nB < set.qs.length ? "btn ghost" : "btn", nB < set.qs.length ? "再做这一组" : "再做一次");
  again.type = "button";
  again.id = "againBtn";
  again.addEventListener("click", () => startBatch(bStart));
  actions.append(book, again);
  if (nB < set.qs.length) {
    const end = bEnd(), last = end >= set.qs.length;
    const nextEnd = last ? Math.min(per, set.qs.length) : Math.min(end + per, set.qs.length);
    const more = el("button", "btn", last ? `从头再来（第 1–${nextEnd} 题）` : `下一组（第 ${end + 1}–${nextEnd} 题）`);
    more.type = "button";
    more.id = "moreBtn";
    more.addEventListener("click", () => startBatch(last ? 0 : end));
    actions.append(more);
  }
  card.append(actions);
  stage.append(card);
}

// ---------- 错题本 ----------
async function renderBook() {
  renderToc();
  stage.innerHTML = "";
  const card = el("section", "card");
  stage.append(card);
  if (!dbRef) { card.append(el("p", "empty", "当前视图无法读取错题本。登录 claude.ai 后打开这个页面就能看到。")); return; }
  if (!bookCache) {
    card.append(el("p", "empty", "正在读取答题记录…"));
    let docs;
    try { docs = (await dbRef.collection("answers").get()).docs.map(d => d.data()); }
    catch (e) { card.textContent = ""; card.append(el("p", "empty", "暂时读取不到错题本，稍后再点一次「错题本」。")); return; }
    // 同一道题答了多次，只看最近一次
    const latest = new Map();
    docs.sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(d => latest.set(d.qid, d));
    const all = [...latest.values()].filter(d => BY_ID.has(d.qid));
    bookCache = { all, wrong: all.filter(d => !d.isCorrect) };
  }
  if (view !== "book") return;
  if (bookFilter !== "all" && !bookCache.wrong.some(d => inGroup(bookFilter, BY_ID.get(d.qid)))) bookFilter = "all";
  renderToc();
  drawBook();
}

function drawBook() {
  if (!bookCache) return;
  const { all, wrong } = bookCache;
  stage.innerHTML = "";
  const card = el("section", "card");
  stage.append(card);
  const tags = el("div", "tagrow");
  tags.append(el("span", "tag", bookFilter === "all" ? "错题本 · 全部" : "错题本 · " + labelOf(bookFilter)));
  card.append(tags);

  const scope = bookFilter === "all" ? all : all.filter(d => inGroup(bookFilter, BY_ID.get(d.qid)));
  const scopeWrong = scope.filter(d => !d.isCorrect);
  const stats = el("div", "stats");
  [[scope.length, "已答题数"], [scopeWrong.length, "错题"], [scope.length ? Math.round((scope.length - scopeWrong.length) / scope.length * 100) + "%" : "–", "正确率"]]
    .forEach(([v, k]) => { const st = el("div", "stat"); st.append(el("b", null, String(v)), el("span", null, k)); stats.append(st); });
  card.append(stats);

  if (!wrong.length) { card.append(el("p", "empty", all.length ? "目前没有错题，继续保持。" : "还没有答题记录。去「答题」做一轮，答错的题会出现在这里。")); return; }

  // 选了某一组就整组列出；看全部时，语法题按章节、听力题按集或按轮分组
  const groups = new Map();
  scopeWrong.forEach(d => {
    const k = bookFilter === "all" ? homeOf(BY_ID.get(d.qid)) : bookFilter;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  });
  const order = k => k.startsWith("ch:") ? Number(k.slice(3)) : k.startsWith("fr-r") ? 100 + parseInt(k.slice(4)) : 200 + Number(k.slice(3));
  [...groups.keys()].sort((a, b) => order(a) - order(b)).forEach(k => {
    const items = groups.get(k);
    const g = el("div", "group");
    const head = el("div", "group-head");
    const h = el("h3", null, labelOf(k));
    if (k.startsWith("ch:")) { const c = CH.get(Number(k.slice(3))); if (c) h.append(el("span", "zh", `${c.t} · p.${c.p}`)); }
    h.append(el("span", "badge bad", `${items.length} 错`));
    head.append(h);
    const go = el("button", "btn ghost", "练这一组");
    go.type = "button";
    go.addEventListener("click", () => { switchView("quiz", k); });
    head.append(go);
    g.append(head);
    items.forEach(d => {
      const m = el("div", "miss");
      const mq = el("span", "mq");
      String(d.question).split(/\*\*/).forEach((part, k) => mq.append(k % 2 ? el("u", "neg", part) : document.createTextNode(part)));
      m.append(mq);
      const a = el("span", "ma");
      a.append(document.createTextNode(`${d.cat} · 你选 `), el("span", "no", d.chosen), document.createTextNode(" · 正确 "), el("span", "ok", d.correct),
        document.createTextNode(" · " + (ROUND_NAMES[d.round] || d.round)));
      m.append(a);
      g.append(m);
    });
    card.append(g);
  });
}

// ---------- 切换 ----------
function switchView(v, setKey) {
  view = v;
  tabQuiz.setAttribute("aria-selected", String(v === "quiz"));
  tabBook.setAttribute("aria-selected", String(v === "book"));
  tabExam.setAttribute("aria-selected", String(v === "exam"));
  tabVocab.setAttribute("aria-selected", String(v === "vocab"));
  layoutEl.classList.toggle("solo", v === "exam");
  progressEl.hidden = v !== "quiz";
  if (tts) tts.cancel();
  if (v === "exam") { renderExam(); return; }
  if (v === "vocab") { renderVocab(); return; }
  if (v === "book") { renderBook(); return; }
  if (setKey) { startSet(setKey); return; }
  renderToc();
  if (rv) { renderReview(); return; }
  if (answers[idx] !== undefined) idx++;
  idx < bEnd() ? renderQuestion() : renderResult();
}
tabQuiz.addEventListener("click", () => { if (view !== "quiz") switchView("quiz"); });
tabBook.addEventListener("click", () => { bookCache = null; switchView("book"); });
tabExam.addEventListener("click", () => { if (view !== "exam") switchView("exam"); });
tabVocab.addEventListener("click", () => { if (view !== "vocab") switchView("vocab"); });

function exVoices() {

  const f = fr.find(v => /amélie|amelie|audrey|aurélie|marie|virginie|julie|céline|hortense|denise|léa|female/i.test(v.name));
  const m = fr.find(v => /thomas|daniel|nicolas|henri|paul|claude|mathieu|male/i.test(v.name) && !/female/i.test(v.name));
  return { F: f || frVoice, M: m || frVoice };
}
function exSpeak(lines, rate, btn) {
  if (!tts) return;
  tts.cancel();
  document.querySelectorAll('.play[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false"));
  const v = exVoices(), same = v.F === v.M;
  const queue = [];
  lines.forEach(([who, text]) => (text.match(/[^.!?…]+[.!?…]+["»]?\s*|[^.!?…]+$/g) || [text]).forEach(p => queue.push([who, p.trim()])));
  queue.forEach(([who, part], k) => {
    const u = new SpeechSynthesisUtterance(part);
    u.lang = "fr-FR";
    if (v[who]) u.voice = v[who];
    u.rate = rate;
    u.pitch = same ? (who === "F" ? 1.15 : 0.85) : 1;
    if (k === queue.length - 1) u.onend = u.onerror = () => btn.setAttribute("aria-pressed", "false");
    tts.speak(u);
  });
  btn.setAttribute("aria-pressed", "true");
}

// 把含 {n} 和 **粗体** 的段落拆成节点
function exPara(text, gap) {
  const p = el("p");
  text.split(/(\{\d+\}|\*\*[^*]+\*\*)/).forEach(part => {
    if (!part) return;
    const m = part.match(/^\{(\d+)\}$/);
    if (m) p.append(gap(Number(m[1])));
    else if (part.startsWith("**")) p.append(el("b", null, frT(part.slice(2, -2))));
    else p.append(document.createTextNode(frT(part)));
  });
  return p;
}

const V_T = [6, 1, 2, 3, 4, 5];   // 题型顺序：先看图，再做其他题
const vTypes = w => V_T.filter(t => t !== 6 || V_IMG[w.fr]);
let vStats = null;     // Map<词 id, {1..5: true/false}>
let vLoading = null, vRetry = 0;
function vLoad() {
  if (vStats || vLoading) return vLoading;
  if (!dbRef) {
    // 错题本连接是异步的：稍等再试几次，仍连不上就按“未练习”显示
    if (vRetry++ < 8) setTimeout(() => { vLoad(); if (view === "vocab") vToc(); }, 1200); else vStats = new Map();
    return null;
  }
  vLoading = dbRef.collection("vocab").get().then(snap => {
    const m = new Map();
    snap.docs.map(d => d.data()).sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(d => {
      if (!V_BY_ID.has(d.word)) return;
      if (!m.has(d.word)) m.set(d.word, {});
      m.get(d.word)[d.type] = !!d.ok;
    });
    vStats = m;
  }).catch(() => { vStats = new Map(); }).finally(() => { vLoading = null; if (view === "vocab") { vToc(); if (!vSess) vList(); } });
  return vLoading;
}
function vRecord(w, type, ok) {
  if (!vStats) vStats = new Map();
  if (!vStats.has(w.id)) vStats.set(w.id, {});
  vStats.get(w.id)[type] = ok;
  if (dbRef) dbRef.collection("vocab").add({ word: w.id, fr: w.fr, type, ok, at: new Date().toISOString() }).catch(() => {});
}
// 状态：new 没练过 / weak 有错或没练全 / done 五种题型最近一次都答对
function vState(w) {
  const s = vStats && vStats.get(w.id);
  if (!s) return "new";
  return vTypes(w).every(t => s[t] === true) ? "done" : "weak";
}
function vMarks(get, w) {
  const marks = el("span", "v-marks");
  marks.title = "题型：" + V_T.map(t => V_TYPES[t - 1]).join(" / ");
  V_T.forEach(t => {
    if (!vTypes(w).includes(t)) { marks.append(el("i", "na", "–")); return; }
    const v = get(t); marks.append(el("i", v === true ? "ok" : v === false ? "no" : "", v === true ? "✓" : v === false ? "✗" : "·"));
  });
  return marks;
}
// 例句：拆成 前半 / 要填的词形 / 后半
function vEx(w) {
  const e = V_EX[w.fr];
  if (!e) return null;
  const m = e[0].match(/^(.*)\[([^\]]+)\](.*)$/);
  return { before: m[1], form: m[2], after: m[3], full: m[1] + m[2] + m[3], tr: e[1] };
}

  card.append(el("span", "tag", "背单词 · 本组成绩"));
  const s = el("p", "score", String(right)); s.append(el("small", null, ` / ${total}`)); card.append(s);
  card.append(el("p", "sub", "每个词后面的标记依次是：" + V_T.map(t => V_TYPES[t - 1]).join("、") + "；“–”表示这个词没有该题型。"));
  const tbl = el("div", "v-table");
  S.words.forEach(w => {
    const r = el("div", "v-row");
    const fr = el("span", "v-fr"); if (vPic(w)) fr.append(vImg(w, "v-thumb")); fr.append(el("b", null, vLabel(w)));
    r.append(vSpeakBtn(w), fr, el("span", "v-pos", V_POS[w.pos]), el("span", "v-en", vMean(w)));
    r.append(vMarks(t => { const x = S.res[w.id + ":" + t]; return x ? x.ok : undefined; }, w));
    const bad = S.res[w.id + ":4"];
    if (bad && !bad.ok) r.append(el("span", "v-given", `你的拼写：${bad.given}`));
    tbl.append(r);
  });
  card.append(tbl);
  const actions = el("div", "actions");
  const back = el("button", "btn ghost", "回到词表"); back.type = "button";
  back.addEventListener("click", () => { vSess = null; vToc(); vList(); });
  const again = el("button", "btn ghost", "再练这组词"); again.type = "button";
  again.addEventListener("click", () => vStart(S.words));
  const more = el("button", "btn", "下一组"); more.type = "button"; more.id = "vMore";
  more.addEventListener("click", () => vStart(vThemeWords(vTheme === "weak" && !vThemeWords("weak").length ? "all" : vTheme)));
  actions.append(back, again, more);
  card.append(actions);
  stage.append(card);
  vToc();
}
function renderVocab() {
  vLoad();
  vToc();
  if (vSess && vSess.i < vSess.qs.length) vQuestion(); else { vSess = null; vList(); }
}
