<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>法语语法小测验</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 左侧按教材章节排列的目录 + 右侧答题卡 / 错题本；窄屏时目录收进可展开的面板 */
:root {
  --bg: #eef1f5;
  --card: #ffffff;
  --fg: #1c2433;
  --muted: #5d6779;
  --line: #d5dbe5;
  --accent: #2f5bd3;
  --accent-soft: #e3eafc;
  --good: #1d8a52;
  --good-soft: #e2f4ea;
  --bad: #c53a3a;
  --bad-soft: #fbe6e6;
  --display: "Noto Serif SC", "Songti SC", serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161e; --card: #1b212c; --fg: #e6eaf2; --muted: #9aa4b6; --line: #2d3545;
    --accent: #7c9dff; --accent-soft: #232f4d; --good: #4cc98a; --good-soft: #17322a;
    --bad: #ff7a7a; --bad-soft: #3a1f24; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161e; --card: #1b212c; --fg: #e6eaf2; --muted: #9aa4b6; --line: #2d3545;
  --accent: #7c9dff; --accent-soft: #232f4d; --good: #4cc98a; --good-soft: #17322a;
  --bad: #ff7a7a; --bad-soft: #3a1f24; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
h1 { font-family: var(--display); font-weight: 900; font-size: 1.6rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: .95rem; }
.sub .home { margin-left: 8px; color: var(--accent); white-space: nowrap; }
.tabs { display: flex; gap: 6px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; align-self: flex-start; }
.tab { font: inherit; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 8px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tocwrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; }
.tocwrap > summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.tocwrap > summary::-webkit-details-marker { display: none; }
.tocwrap > summary::after { content: "展开"; font-size: .8rem; font-weight: 500; color: var(--accent); }
.tocwrap[open] > summary::after { content: "收起"; }
.tocwrap > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 14px; }
.toc { padding: 0 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.toc-book { font-size: .78rem; color: var(--muted); padding: 0 8px 6px; line-height: 1.4; }
.toc-sec { font-size: .72rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 10px 8px 2px; }
.toc details { border-top: 1px solid var(--line); }
.toc details > summary { cursor: pointer; padding: 8px; font-weight: 700; font-size: .9rem; display: flex; gap: 8px; align-items: baseline; list-style: none; }
.toc details > summary::-webkit-details-marker { display: none; }
.toc details > summary::before { content: "▸"; color: var(--muted); font-size: .75rem; transition: transform .15s; }
.toc details[open] > summary::before { transform: rotate(90deg); }
.toc details > summary .pt { flex: 1; min-width: 0; }
.toc details > summary:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
.toc details details { border-top: 1px solid var(--line); margin: 4px 0 0 10px; }
.toc ul { list-style: none; margin: 0; padding: 0 0 6px; display: flex; flex-direction: column; gap: 1px; }
.item { width: 100%; font: inherit; text-align: left; background: transparent; border: 0; color: var(--fg); border-radius: 8px; padding: 5px 8px; cursor: pointer; display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: 6px; align-items: baseline; font-size: .88rem; line-height: 1.35; }
.item .no { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
.item .zh { display: block; color: var(--muted); font-size: .76rem; }
.item:hover:not(:disabled) { background: var(--accent-soft); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item:disabled { cursor: default; opacity: .45; }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.item[aria-current="true"] .no, .item[aria-current="true"] .zh { color: var(--accent); }
.badge { font-size: .72rem; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; white-space: nowrap; }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.zero { background: transparent; color: var(--muted); font-weight: 400; }
.pg { font-size: .72rem; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

.progress { display: flex; align-items: center; gap: 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.progress .set { color: var(--fg); font-weight: 700; }
#pText { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
#jumpInput { width: 3.6em; font: inherit; font-variant-numeric: tabular-nums; text-align: center; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
#jumpInput:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.jump { font: inherit; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.per { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
#perSel { font: inherit; font-variant-numeric: tabular-nums; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 2px; }
#perSel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar { flex: 1; min-width: 80px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.tagrow { display: flex; gap: 8px; align-items: center; min-width: 0; overflow: hidden; }
.tagrow .tag { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { font-size: .75rem; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 99px; font-weight: 500; }
.tag.plain { background: var(--bg); color: var(--muted); }
.q { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0; text-wrap: balance; line-height: 1.45; min-height: calc(1.45em * 3); }
.q.listen { font-family: var(--body); font-size: 1.02rem; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; gap: 10px;; min-height: calc(1.3rem * 1.45 * 3); }
.listen-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.play { font: inherit; font-weight: 700; font-size: .95rem; border-radius: 10px; padding: 8px 16px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--card); }
.play.slow { background: transparent; color: var(--accent); }
.play:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.play[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent-soft); }
.listen-note { font-size: .82rem; color: var(--muted); font-weight: 400; }
.play.say { padding: 2px 10px; font-size: .82rem; margin-left: 4px; vertical-align: 1px; }
.transcript { display: block; margin-top: 4px; font-family: var(--display); font-weight: 600; color: var(--fg); }
.opts { display: grid; gap: 8px; align-content: start; height: calc(4 * 3.25rem + 3 * 8px); }
.opt { height: 3.25rem; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.key { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; background: var(--bg); color: var(--muted); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .key { background: var(--good); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--card); }
.explain { border-radius: 10px; padding: 12px 14px; font-size: .95rem; line-height: 1.6; background: var(--bg); height: calc(1.6em * 5 + 24px); overflow-y: auto; overscroll-behavior: contain; }
.explain.pending { color: var(--muted); display: grid; place-items: center; text-align: center; }
.btn:disabled { opacity: .4; cursor: default; }
.explain b.ok { color: var(--good); }
.explain b.no { color: var(--bad); }
.hint-h { color: #b7791f; }
.hint-used { color: var(--muted); font-size: .88em; margin-left: 4px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 22px; background: var(--accent); color: var(--card); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 6px 14px; font-size: .85rem; }
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.score { font-family: var(--display); font-weight: 900; font-size: 3.4rem; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); font-weight: 600; }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.review li { display: flex; gap: 10px; align-items: baseline; font-size: .95rem; min-width: 0; }
.review li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.review .mark { flex: none; font-weight: 700; width: 1.2em; }
.review .mark.ok { color: var(--good); }
.review .mark.no { color: var(--bad); }
.review span.ans { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 16px; }
.group-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.group h3 { margin: 0; font-size: 1rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.group h3 .zh { font-size: .82rem; color: var(--muted); font-weight: 400; }
.miss { border-left: 3px solid var(--bad); padding: 6px 0 6px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.miss .mq { font-weight: 500; overflow-wrap: anywhere; }
.miss .ma { font-size: .9rem; color: var(--muted); }
.miss .ma .no { color: var(--bad); font-weight: 700; }
.miss .ma .ok { color: var(--good); font-weight: 700; }
.empty { color: var(--muted); margin: 0; }

@media (max-width: 600px) {
  .card { padding: 16px; }
  .q { font-size: 1.12rem; min-height: calc(1.45em * 4); }
  .q.listen { min-height: calc(1.12rem * 1.45 * 4); }
  .opt { font-size: .92rem; padding: 8px 12px; gap: 10px; }
}
@media (max-width: 819px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tocwrap { position: static; max-height: none; }
}
@media (min-width: 820px) {
  .tocwrap > summary { cursor: default; }
  .tocwrap > summary::after { content: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- 模拟卷 ---------- */
.layout.solo { grid-template-columns: minmax(0, 1fr); }
.layout.solo .tocwrap { display: none; }
.ex { display: flex; flex-direction: column; gap: 16px; }
.ex-head { display: flex; flex-direction: column; gap: 10px; }
.ex-head h2 { font-family: var(--display); font-weight: 900; font-size: 1.35rem; margin: 0; line-height: 1.3; text-wrap: balance; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: .88rem; align-items: center; }
.ex-meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
.ex-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-nav a { font-size: .82rem; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 99px; text-decoration: none; }
.ex-nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ex-part { scroll-margin-top: 12px; }
.ex-part > h3 { font-family: var(--display); font-weight: 900; font-size: 1.15rem; margin: 0; }
.ex-rule { color: var(--muted); font-size: .88rem; margin: 0; line-height: 1.55; }
.ex-sub { font-weight: 700; font-size: .98rem; margin: 6px 0 0; }
.ex-block { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.ex-block:first-of-type { border-top: 0; padding-top: 0; }
.ex-label { font-weight: 700; color: var(--accent); font-size: .9rem; }
.ex-pass { background: var(--bg); border-radius: 10px; padding: 12px 16px; line-height: 1.75; font-size: .98rem; overflow-wrap: break-word; }
.ex-pass p { margin: 0 0 .6em; text-indent: 1.5em; }
.ex-pass p:last-child { margin-bottom: 0; }
.ex-pass .ttl { text-align: center; text-indent: 0; font-weight: 700; }
.ex-pass .ad h4 { margin: .6em 0 0; font-size: .95rem; }
.ex-pass .ad p { text-indent: 0; }
.ex-q { display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 12px; }
.ex-qt { margin: 0; font-weight: 500; line-height: 1.5; display: flex; gap: 6px; }
.ex-qt .n { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 1.8em; flex: none; }
.ex-opts { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 2.2em; }
.ex-opt { font: inherit; font-size: .93rem; text-align: left; color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; max-width: 100%; }
.ex-opt .k { font-weight: 700; color: var(--muted); }
.ex-opt:hover:not(:disabled) { border-color: var(--accent); }
.ex-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ex-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ex-opt[aria-pressed="true"] .k { color: var(--accent); }
.ex-opt:disabled { cursor: default; }
.ex-opt.correct { border-color: var(--good); background: var(--good-soft); }
.ex-opt.correct .k { color: var(--good); }
.ex-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ex-opt.wrong .k { color: var(--bad); }
.ex-why { font-size: .88rem; color: var(--muted); padding-left: 2.2em; margin: 0; }
.ex-why b.ok { color: var(--good); } .ex-why b.no { color: var(--bad); }
.ex-gap { display: inline-block; min-width: 4.2em; border-bottom: 1.5px solid var(--fg); text-align: center; font-weight: 700; text-indent: 0; padding: 0 4px; color: var(--accent); }
.ex-gap .n { font-size: .75rem; color: var(--muted); font-weight: 400; margin-right: 2px; }
.ex-gap.correct { border-color: var(--good); color: var(--good); }
.ex-gap.wrong { border-color: var(--bad); color: var(--bad); }
.ex-sel, .ex-in { font: inherit; font-size: .92rem; color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; padding: 1px 4px; text-indent: 0; }
.ex-in { width: 7.5em; }
.ex-sel:focus-visible, .ex-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ex-sel.correct, .ex-in.correct { border-color: var(--good); background: var(--good-soft); }
.ex-sel.wrong, .ex-in.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ex-hint { color: var(--muted); font-size: .85rem; }
.ex-fix { color: var(--good); font-weight: 700; font-size: .85rem; }
.ex-seven { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: .93rem; }
.ex-seven li { display: flex; gap: 8px; } .ex-seven b { color: var(--muted); }
.ex-cloze-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px 16px; }
.ex-cloze-grid .ex-opts { padding-left: 0; }
.ex-cloze-grid .ex-q { flex-direction: row; align-items: baseline; gap: 6px; }
.ex-cloze-grid .n { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 1.8em; flex: none; font-size: .9rem; }
.ex-listen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ex-script { font-size: .9rem; background: var(--bg); border-radius: 8px; padding: 8px 12px; margin: 0; line-height: 1.6; }
.ex-script div { display: flex; gap: 6px; } .ex-script b { color: var(--muted); flex: none; min-width: 1.4em; }
/* 短文改错 */
.ex-fixtext { background: var(--bg); border-radius: 10px; padding: 14px 16px; line-height: 2.6; font-size: 1rem; }
.tok { font: inherit; color: var(--fg); background: transparent; border: 0; padding: 0 1px; margin: 0; cursor: pointer; border-radius: 4px; position: relative; line-height: 1.4; display: inline-block; }
.tok:hover:not(:disabled) { background: var(--accent-soft); }
.tok:focus-visible { outline: 2px solid var(--accent); }
.tok:disabled { cursor: default; }
.tok.del { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.tok.mod { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.tok .ann { position: absolute; left: 0; top: 1.35em; font-size: .72rem; font-weight: 700; color: var(--accent); white-space: nowrap; line-height: 1; }
.tok .ins { color: var(--accent); font-weight: 700; margin-right: 1px; }
.tok.ok-mark .ann, .tok.ok-mark .ins { color: var(--good); }
.tok.no-mark .ann, .tok.no-mark .ins { color: var(--bad); }
.tok.miss-mark { background: var(--bad-soft); }
.ex-pop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--card); border: 1.5px solid var(--accent); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
.ex-pop b { font-weight: 700; }
.ex-pop .ex-in { width: 8em; }
.ex-small { font: inherit; font-size: .85rem; font-weight: 700; border-radius: 8px; padding: 4px 10px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--card); color: var(--accent); }
.ex-small.solid { background: var(--accent); color: var(--card); }
.ex-small:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
.ex-small:disabled { opacity: .4; cursor: default; }
/* 写作 */
.ex-essay { font: inherit; font-size: 1rem; line-height: 1.6; width: 100%; min-height: 14em; resize: vertical; color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ex-essay:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ex-count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-fb { background: var(--bg); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: .95rem; }
.ex-fb h4 { margin: 0; font-size: 1rem; }
.ex-fb ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.ex-fb .improved { white-space: pre-wrap; font-size: .93rem; }
/* 提交栏与成绩 */

<script>
// 教材目录：Advanced French Grammar (Monique L'Huillier)，[章号, 英文标题, 中文, 页码]
const PARTS = [
  { n: 1, t: "Framework", zh: "基础框架", p: 14, chs: [
    [1, "Parts of speech", "词类", 16], [2, "Syntax and grammatical functions", "句法与语法功能", 31],
    [3, "Pronunciation, spelling, registers, punctuation", "发音、拼写、语域、标点", 57]] },
  { n: 2, t: "Verbs", zh: "动词", p: 74, chs: [
    [4, "Introduction to verbs", "动词概述", 76], [5, "Present indicative", "直陈式现在时", 88],
    [6, "depuis and other tense markers", "depuis 及其他时间标记", 103], [7, "Future", "将来时", 115],
    [8, "Imperfect", "未完成过去时", 126], [9, "Perfect", "复合过去时", 137], [10, "Past historic", "简单过去时", 150],
    [11, "Other past tenses", "其他过去时", 159], [12, "Subjunctive", "虚拟式", 164],
    [13, "Conditional and the expression of hypothesis", "条件式与假设", 194], [14, "Imperative", "命令式", 203],
    [15, "Infinitive", "不定式", 213], [16, "Present participle", "现在分词", 232], [17, "Past participle", "过去分词", 245],
    [18, "Active and passive voices", "主动态与被动态", 248], [19, "Impersonal verbs and the impersonal voice", "无人称动词与无人称结构", 263],
    [20, "Pronominal verbs", "代词式动词", 273], [21, "Modals: devoir, pouvoir, vouloir", "情态动词", 284],
    [22, "savoir and connaître", "savoir 与 connaître", 304]] },
  { n: 3, t: "Determiners and prepositions", zh: "限定词与介词", p: 312, chs: [
    [23, "Articles", "冠词", 314], [24, "Possessive adjectives, possession, attribution", "主有形容词与所属", 347],
    [25, "Demonstrative adjectives", "指示形容词", 361], [26, "Prepositions", "介词", 365]] },
  { n: 4, t: "Nouns, pronouns and modifiers", zh: "名词、代词与修饰语", p: 396, chs: [
    [27, "Nouns", "名词", 398], [28, "Qualifying adjectives", "品质形容词", 421], [29, "Adverbs", "副词", 447],
    [30, "Comparatives and superlatives", "比较级与最高级", 472], [31, "Personal pronouns", "人称代词", 499],
    [32, "Relative pronouns", "关系代词", 528], [33, "Possessive pronouns", "主有代词", 544],
    [34, "Demonstrative pronouns", "指示代词", 549], [35, "c'est / il est", "c'est 与 il est", 561],
    [36, "Indefinite words: adjectives, pronouns, adverbs", "泛指词", 570], [37, "Numbers", "数词", 603]] },
  { n: 5, t: "Sentences and text", zh: "句子与篇章", p: 630, chs: [
    [38, "Negative structures", "否定结构", 632], [39, "Interrogative and exclamative structures", "疑问与感叹结构", 647],
    [40, "Coordination and juxtaposition", "并列与连用", 671], [41, "Reported speech", "间接引语", 683]] },
];
const CH = new Map();
PARTS.forEach(pt => pt.chs.forEach(([n, t, zh, p]) => CH.set(n, { n, t, zh, p, part: pt.n })));

const ROUNDS = [
  { id: "fr-r1", kind: "grammar", name: "第一轮 · 综合" },
  { id: "fr-r2", kind: "grammar", name: "第二轮 · 冠词" },
  { id: "fr-r3", kind: "grammar", name: "第三轮 · 人称代词" },
  { id: "fr-r4", kind: "grammar", name: "第四轮 · 名词阴阳性" },
  { id: "fr-r5", kind: "grammar", name: "第五轮 · 代词综合" },
  { id: "fr-r6", kind: "grammar", name: "第六轮 · 代词基础 B1" },
  { id: "fr-r7", kind: "listen", name: "第七轮 · 听力（语义）" },
  { id: "fr-r8", kind: "listen", name: "第八轮 · 听力 A2" },
  { id: "fr-r9", kind: "listen", name: "第九轮 · 长文听力" },
  { id: "fr-r10", kind: "listen", name: "第十轮 · 听写辨音 A2" },
  { id: "fr-r11", kind: "listen", name: "第十一轮 · 听写辨音（二）" },
  { id: "fr-r16", kind: "grammar", name: "第十六轮 · 介词" },
  { id: "fr-r17", kind: "grammar", name: "第十七轮 · 介词（多种题型）" },
  { id: "fr-r18", kind: "grammar", name: "第十八轮 · 介词辨义" },
  { id: "fr-r19", kind: "grammar", name: "第十九轮 · 介词辨义（二）" },
  { id: "fr-r20", kind: "grammar", name: "第二十轮 · 数词" },
  { id: "fr-r21", kind: "grammar", name: "第二十一轮 · 介词（带提示）" },
  { id: "fr-r22", kind: "grammar", name: "第二十二轮 · depuis / il y a / pendant" },
  { id: "fr-r23", kind: "grammar", name: "第二十三轮 · 词尾与阴阳性（反例）" },
];
const ROUND_NAMES = Object.fromEntries(ROUNDS.map(r => [r.id, r.name.split(" · ")[0]]));

// 题库：id 与以往答题记录中的 qid 一致，ch 为教材章号
const BANK = [
  { id: "fr-r1-1", ch: 9, cat: "助动词", q: "Hier, je ___ allé au cinéma avec mes amis.", opts: ["ai", "suis", "es", "est"], a: 1,
    exp: "aller 属于用 être 构成复合过去时的动词（还有 venir、partir、arriver、naître 等），主语是 je，所以用 suis。" },
  { id: "fr-r1-2", ch: 17, cat: "过去分词配合", q: "Les fleurs que j'ai ___ sont très belles.", opts: ["acheté", "achetés", "achetée", "achetées"], a: 3,
    exp: "以 avoir 为助动词时，若直接宾语位于动词之前，过去分词要与它配合。这里 que 指代 les fleurs（阴性复数），所以写 achetées。" },
  { id: "fr-r1-3", ch: 20, cat: "代词式动词", q: "Elle s'est ___ les mains avant de manger.", opts: ["lavé", "lavée", "lavées", "laver"], a: 0,
    exp: "直接宾语是 les mains，位于动词之后，s' 在这里是间接宾语，所以过去分词不配合，写 lavé。对比：Elle s'est lavée.（洗她自己）要配合。" },
  { id: "fr-r1-4", ch: 12, cat: "虚拟式", q: "Il faut que tu ___ tes devoirs ce soir.", opts: ["fais", "fasses", "feras", "faisais"], a: 1,
    exp: "il faut que 后面接虚拟式。faire 的虚拟式现在时：que je fasse, que tu fasses, qu'il fasse…" },
  { id: "fr-r1-5", ch: 13, cat: "条件式", q: "Si j'avais plus de temps, j'___ le piano.", opts: ["apprends", "apprendrai", "apprendrais", "aurais appris"], a: 2,
    exp: "si + 未完成过去时（avais），主句用条件式现在时，表示与现在事实相反的假设。aurais appris 要配 si + 愈过去时（si j'avais eu）。" },
  { id: "fr-r1-6", ch: 32, cat: "关系代词", q: "C'est le livre ___ je t'ai parlé hier.", opts: ["que", "qui", "dont", "où"], a: 2,
    exp: "parler de qch 带介词 de，关系代词用 dont 代替“de + 先行词”。" },
  { id: "fr-r1-7", ch: 23, cat: "否定与冠词", q: "Le matin, je ne bois pas ___ café.", opts: ["du", "de", "le", "des"], a: 1,
    exp: "在否定句中，不定冠词和部分冠词（un, une, des, du, de la）变为 de。但定冠词不变：Je n'aime pas le café." },
  { id: "fr-r1-8", ch: 31, cat: "宾语代词", q: "Tu connais Marie ? — Oui, je ___ connais bien.", opts: ["la", "lui", "le", "en"], a: 0,
    exp: "connaître 直接接宾语（connaître qqn），Marie 是阴性单数，所以用直接宾语代词 la。lui 用于间接宾语，如 je lui parle。" },
  { id: "fr-r1-9", ch: 8, cat: "时态", q: "Quand j'étais petit, je ___ souvent à la plage avec mes parents.", opts: ["suis allé", "allais", "irai", "aille"], a: 1,
    exp: "souvent 表示过去的习惯性、重复性动作，用未完成过去时（imparfait）。复合过去时用于一次性、已完成的动作。" },
  { id: "fr-r1-10", ch: 30, cat: "比较级", q: "C'est ___ restaurant du quartier, tout le monde le dit.", opts: ["le plus bon", "le meilleur", "le mieux", "plus bon"], a: 1,
    exp: "bon 的比较级和最高级不规则：meilleur / le meilleur。mieux 是副词 bien 的比较级，修饰动词，如 Il chante mieux。" },

  { id: "fr-r2-1", ch: 23, cat: "数量表达", q: "Au marché, il a acheté beaucoup ___ pommes.", opts: ["de", "des", "les", "du"], a: 0,
    exp: "beaucoup、peu、trop、assez、un kilo 等数量表达后接 de，不再用 des / du / de la。" },
  { id: "fr-r2-2", ch: 23, cat: "否定与 être", q: "Ne t'inquiète pas, ce n'est pas ___ problème.", opts: ["de", "un", "du", "le"], a: 1,
    exp: "否定句中 un / des 变 de 的规则不适用于 être。Ce n'est pas un problème. 对比：Je n'ai pas de problème." },
  { id: "fr-r2-3", ch: 35, cat: "职业", q: "Mon père est ___ médecin à l'hôpital de Lyon.", opts: ["un", "le", "du", "（不填）"], a: 3,
    exp: "être + 不带修饰的职业、国籍、宗教时不用冠词：Il est médecin. 但用 c'est 时要加：C'est un médecin. 加了形容词也要加：C'est un bon médecin。" },
  { id: "fr-r2-4", ch: 26, cat: "国家名", q: "Cet été, nous allons ___ Portugal.", opts: ["en", "au", "à", "aux"], a: 1,
    exp: "阳性国家用 au（au Portugal, au Japon），阴性国家或以元音开头的国家用 en（en France, en Iran），复数国家用 aux（aux États-Unis）。" },
  { id: "fr-r2-5", ch: 23, cat: "抽象名词", q: "Il faut ___ courage pour dire la vérité.", opts: ["le", "de", "du", "un"], a: 2,
    exp: "表示“一些、一定量”的不可数名词（包括抽象名词）用部分冠词：du courage, de la patience。" },
  { id: "fr-r2-6", ch: 23, cat: "喜好动词", q: "Je n'aime pas ___ fromage, je préfère les fruits.", opts: ["de", "du", "le", "un"], a: 2,
    exp: "aimer、adorer、détester、préférer 表示泛指的喜好，后面用定冠词，否定时定冠词也不变：Je n'aime pas le fromage." },
  { id: "fr-r2-7", ch: 23, cat: "固定搭配", q: "Pour ce voyage, j'ai besoin ___ argent.", opts: ["de l'", "d'", "du", "des"], a: 1,
    exp: "avoir besoin de 后面接部分冠词时，de + du / de la / des 合并成 de（或 d'）：J'ai besoin d'argent. 指特定的东西时才用定冠词：J'ai besoin de l'argent que je t'ai prêté." },
  { id: "fr-r2-8", ch: 23, cat: "形容词前置", q: "Dans ce quartier, il y a ___ jolies maisons anciennes.", opts: ["des", "les", "de", "du"], a: 2,
    exp: "复数形容词放在名词前时，书面语中 des 变 de：de jolies maisons, de grands arbres。口语里常听到 des，但考试按规范写 de。" },
  { id: "fr-r2-9", ch: 23, cat: "习惯性时间", q: "___ dimanche, nous déjeunons toujours chez mes grands-parents.", opts: ["Le", "Un", "Ce", "Au"], a: 0,
    exp: "星期名前加定冠词 le 表示“每逢”：le dimanche = 每个星期天。不加冠词指最近的某一天：Dimanche, je vais au cinéma." },
  { id: "fr-r2-10", ch: 23, cat: "例外 bien des", q: "En ce moment, j'ai bien ___ soucis au travail.", opts: ["de", "des", "les", "du"], a: 1,
    exp: "bien 表示“很多”时是例外，后面接 des / du / de la：bien des soucis, bien du courage。对比 beaucoup de soucis。" },

  { id: "fr-r3-1", ch: 31, cat: "间接宾语 lui / leur", q: "Tu parles souvent à ta mère ? — Oui, je ___ parle tous les jours.", opts: ["la", "lui", "leur", "y"], a: 1,
    exp: "parler à qqn 带介词 à，人用间接宾语代词。单数用 lui（不分阴阳性），复数用 leur。la 是直接宾语。" },
  { id: "fr-r3-2", ch: 31, cat: "直接宾语与配合", q: "Tu as vu mes clés ? — Oui, je ___ ai vues sur la table.", opts: ["leur", "en", "les", "l'"], a: 2,
    exp: "voir qqch 是直接宾语，mes clés 是复数，用 les。注意直接宾语代词放在 avoir 前面，过去分词要配合：vues。" },
  { id: "fr-r3-3", ch: 31, cat: "代词 en", q: "Tu veux encore du café ? — Oui, j'___ veux bien, merci.", opts: ["le", "en", "y", "lui"], a: 1,
    exp: "en 代替“部分冠词 / 不定冠词 / 数量词 + 名词”：du café → en。如果是 le café（特指那杯）才用 le。" },
  { id: "fr-r3-4", ch: 31, cat: "代词 y", q: "Tu vas à Paris demain ? — Oui, j'___ vais en train.", opts: ["en", "le", "y", "lui"], a: 2,
    exp: "y 代替 à / en / dans / chez 等引出的地点：à Paris → y。en 代替 de + 地点：Je viens de Paris → J'en viens。" },
  { id: "fr-r3-5", ch: 31, cat: "重读代词", q: "Je pense souvent à mes grands-parents. — Moi aussi, je pense souvent ___.", opts: ["leur", "y", "les", "à eux"], a: 3,
    exp: "penser à、s'intéresser à、faire attention à 等动词后面的人不能用 lui / leur，要用 à + 重读代词：à lui, à elle, à eux, à elles。指事物时才用 y：J'y pense。" },
  { id: "fr-r3-6", ch: 31, cat: "双宾语顺序", q: "Tu donnes ce livre à Paul ? — Oui, je ___ donne ce soir.", opts: ["lui le", "le lui", "l'en", "lui en"], a: 1,
    exp: "两个第三人称宾语代词同时出现时，直接宾语在前：le / la / les + lui / leur。顺序口诀：me te se nous vous → le la les → lui leur → y → en。" },
  { id: "fr-r3-7", ch: 31, cat: "肯定命令式", q: "Ce gâteau a l'air délicieux, donne-___ un morceau !", opts: ["me", "moi", "m'en", "je"], a: 1,
    exp: "肯定命令式中代词放在动词后，用连字符连接，me / te 变成 moi / toi：donne-moi, lève-toi。只有后面接 en 时才变回 m'：donne-m'en。" },
  { id: "fr-r3-8", ch: 31, cat: "否定命令式", q: "C'est un secret ? Alors ne ___ dis pas !", opts: ["le-moi", "moi le", "me le", "le me"], a: 2,
    exp: "否定命令式中代词回到动词前，按普通语序：ne me le dis pas。肯定式才是 dis-le-moi。" },
  { id: "fr-r3-9", ch: 31, cat: "重读代词", q: "Qui veut encore du gâteau ? — ___ !", opts: ["Je", "Me", "Moi", "Mon"], a: 2,
    exp: "单独使用、不跟动词时必须用重读代词：Moi ! Toi ? Lui aussi. 同样用于 c'est 之后、介词之后和比较句中：C'est moi. Avec toi. Plus grand que lui." },
  { id: "fr-r3-10", ch: 31, cat: "双宾语顺序", q: "Tu as parlé de ton projet à ton chef ? — Oui, je ___ ai parlé hier.", opts: ["en lui", "lui en", "l'en", "y en"], a: 1,
    exp: "parler de qqch à qqn：de ton projet → en，à ton chef → lui。lui / leur 放在 en 前面：je lui en ai parlé。en 永远排在最后。" },

  { id: "fr-r4-1", ch: 27, cat: "人称名词 §2.1", q: "acteur 的阴性形式是？", opts: ["actrice", "acteuse", "acteure", "actresse"], a: 0,
    exp: "以 -teur 结尾的人称名词，阴性变成 -trice 或 -teuse：acteur → actrice，directeur → directrice，menteur → menteuse。具体是哪一种要逐个记。（书中第 27 章 · p.401）" },
  { id: "fr-r4-2", ch: 27, cat: "人称名词 §2.1", q: "chanteur 的阴性形式是？", opts: ["chantrice", "chanteuse", "chanteure", "chantresse"], a: 1,
    exp: "chanteur → chanteuse。书中把它和 menteur → menteuse 列在一起，属于 -teur → -teuse。其他 -eur 结尾的人称名词也多变 -euse：coiffeur → coiffeuse，vendeur → vendeuse。（书中第 27 章 · p.401）" },
  { id: "fr-r4-3", ch: 27, cat: "人称名词 §2.1", q: "boulanger 的阴性形式是？", opts: ["boulangère", "boulangeuse", "boulangerie", "boulangette"], a: 0,
    exp: "以 -er 结尾的人称名词，阴性变成 -ère：boulanger → boulangère，boucher → bouchère，fermier → fermière。boulangerie 是“面包店”。（书中第 27 章 · p.401）" },
  { id: "fr-r4-4", ch: 27, cat: "人称名词 §2.1", q: "musicien 的阴性形式是？", opts: ["musiciene", "musicienne", "musiciène", "musicieuse"], a: 1,
    exp: "以 -on、-an、-en 结尾的人称名词，阴性要双写 n 再加 e：musicien → musicienne，paysan → paysanne，baron → baronne。（书中第 27 章 · p.401）" },
  { id: "fr-r4-5", ch: 27, cat: "人称名词 §2.1", q: "Mme Dupont, ___ des témoins de l'accident, a parlé à la police.", opts: ["l'un", "l'une"], a: 0,
    exp: "témoin 只有阳性形式，指女性也一样，所以说 l'un des témoins。同类的还有 un mannequin，以及 médecin、professeur、peintre 等职业名称（书中说法）。（书中第 27 章 · p.402）" },
  { id: "fr-r4-6", ch: 27, cat: "人称名词 §2.1", q: "Ce jeune homme est ___ victime innocente de l'accident.", opts: ["un", "une"], a: 1,
    exp: "victime 永远是阴性，指男性也一样。同类的还有 une personne、une star、une vedette、une recrue、une sentinelle。书中例句：Mick Jagger, une grande star du pop-rock。（书中第 27 章 · p.402）" },
  { id: "fr-r4-7", ch: 27, cat: "动物名词 §2.2", q: "母马在法语里叫什么？", opts: ["une jument", "une chevale", "une étalonne", "une chevalesse"], a: 0,
    exp: "家畜常有三个名称：泛称、公、母。un cheval（马）、un étalon（种马）、une jument（母马）。同类：un bœuf / un taureau / une vache。（书中第 27 章 · p.402）" },
  { id: "fr-r4-8", ch: 27, cat: "动物名词 §2.2", q: "J'ai vu ___ souris dans la cuisine.", opts: ["un", "une"], a: 1,
    exp: "很多动物只有一个名称，公母通用，性别要逐个记。souris 是阴性；同类阴性的还有 une girafe、une grenouille、une guêpe。阳性的有 un rat、un écureuil、un papillon。（书中第 27 章 · p.403）" },
  { id: "fr-r4-9", ch: 27, cat: "阳性类别 §2.3", q: "下面这几个植物名称里，哪个是阴性？", opts: ["chêne", "pommier", "vigne", "bouleau"], a: 2,
    exp: "树木和灌木的名称一般是阳性：le chêne、le pommier、le bouleau。例外：la vigne（葡萄藤）、la ronce、la bruyère。（书中第 27 章 · p.403）" },
  { id: "fr-r4-10", ch: 27, cat: "阳性类别 §2.3", q: "下面这几个宝石和金属名称里，哪个是阴性？", opts: ["diamant", "rubis", "émeraude", "fer"], a: 2,
    exp: "金属和矿物的名称一般是阳性：le fer、le diamant、le rubis。例外：une émeraude、une perle、une pierre、la tôle、la fonte。（书中第 27 章 · p.404）" },
  { id: "fr-r4-11", ch: 27, cat: "阳性类别 §2.3", q: "Il parle très bien ___ russe.", opts: ["le", "la"], a: 0,
    exp: "语言名称都是阳性。le russe、l'arabe 虽然以 e 结尾，也是阳性。另外注意：un langage（语言风格）和 une langue（语言）。（书中第 27 章 · p.404）" },
  { id: "fr-r4-12", ch: 27, cat: "阳性类别 §2.3", q: "Il a déjà mangé ___ moitié du gâteau.", opts: ["le", "la"], a: 1,
    exp: "度量单位、数字、分数和字母都是阳性：un tiers、un quart、un demi、un gramme。唯一的例外是 une moitié。（书中第 27 章 · p.404）" },
  { id: "fr-r4-13", ch: 27, cat: "阳性类别 §2.3", q: "下面这几个表示时间的名词里，哪个是阴性？", opts: ["jour", "mois", "siècle", "semaine"], a: 3,
    exp: "星期、月份、季节的名称都是阳性：le lundi、un été；un an、un siècle 也是阳性。但 une semaine、une saison 是阴性。（书中第 27 章 · p.404）" },
  { id: "fr-r4-14", ch: 27, cat: "国家与河流 §2.3/§2.5", q: "Cet hiver, nous visitons ___ Mexique.", opts: ["le", "la"], a: 0,
    exp: "以 e 结尾的国家、地区、河流一般是阴性：la Belgique、la Chine、la Seine。例外：le Mexique、le Cambodge、le Rhône。（书中第 27 章 · p.408）" },
  { id: "fr-r4-15", ch: 27, cat: "国家与河流 §2.3/§2.5", q: "___ Danube traverse Vienne et Budapest.", opts: ["Le", "La"], a: 0,
    exp: "“以 e 结尾的河流是阴性”这条规则只适用于法国的河流，外国河流不适用：le Danube、le Gange 都是阳性。（书中第 27 章 · p.408）" },
  { id: "fr-r4-16", ch: 27, cat: "阳性词尾 §2.4", q: "下面这几个以 -age 结尾的名词里，哪个是阴性？", opts: ["voyage", "fromage", "plage", "visage"], a: 2,
    exp: "以 -age 结尾的名词一般是阳性：un voyage、le fromage、le visage。例外：une plage、une image、une cage，以及 une page（书页）。un page 是“侍从”。（书中第 27 章 · p.405）" },
  { id: "fr-r4-17", ch: 27, cat: "阳性词尾 §2.4", q: "下面这几个名词里，哪个是阴性？", opts: ["problème", "système", "crème", "poème"], a: 2,
    exp: "以 -ème、-ège、-ède 结尾的名词是阳性：un problème、un système、un collège、un remède。例外：la crème。（书中第 27 章 · p.406）" },
  { id: "fr-r4-18", ch: 27, cat: "阳性词尾 §2.4", q: "下面这几个以 -eau 结尾的名词里，哪个是阴性？", opts: ["bateau", "peau", "cadeau", "chapeau"], a: 1,
    exp: "以 -eau 结尾的名词是阳性：un bateau、un cadeau、un chapeau、un oiseau。例外只有两个：l'eau 和 la peau。（书中第 27 章 · p.406）" },
  { id: "fr-r4-19", ch: 27, cat: "阳性词尾 §2.4", q: "下面这几个名词里，哪个是阴性？", opts: ["piano", "cinéma", "photo", "café"], a: 2,
    exp: "以 e 以外的元音结尾的名词一般是阳性：un piano、un cinéma、un café、un bijou。例外：une photo（photographie 的缩写）、une auto、une clé、une villa、une fourmi。（书中第 27 章 · p.407）" },
  { id: "fr-r4-20", ch: 27, cat: "阳性词尾 §2.4", q: "下面这几个以辅音结尾的名词里，哪个是阴性？", opts: ["choix", "nez", "nuit", "riz"], a: 2,
    exp: "以辅音结尾的名词一般是阳性：un choix、un nez、le riz、un pied。例外：une nuit、une fois，以及 une tour（塔）。（书中第 27 章 · p.405）" },
  { id: "fr-r4-21", ch: 27, cat: "阳性词尾 §2.4", q: "J'ai très mal à ___ dent.", opts: ["le", "la"], a: 1,
    exp: "以 -ent、-ment 结尾的名词是阳性：un appartement、le gouvernement、un agent。例外：une dent、une jument。（书中第 27 章 · p.407）" },
  { id: "fr-r4-22", ch: 27, cat: "阳性词尾 §2.4", q: "Mon ordinateur est tout ___.", opts: ["neuf", "neuve"], a: 0,
    exp: "以 -eur 结尾、表示机器的名词是阳性：un ordinateur、un moteur、un aspirateur。前面是 l' 看不出阴阳性时，可以靠形容词的配合判断。（书中第 27 章 · p.406）" },
  { id: "fr-r4-23", ch: 27, cat: "-eur 结尾 §2.4/§2.6", q: "下面这几个以 -eur 结尾的名词里，哪个是阳性？", opts: ["couleur", "chaleur", "bonheur", "douleur"], a: 2,
    exp: "表示性质、感受的 -eur 名词多为阴性：la couleur、la chaleur、la douleur、la peur。但 le bonheur、le malheur、l'honneur、le cœur 是阳性。（书中第 27 章 · p.407）" },
  { id: "fr-r4-24", ch: 27, cat: "阴性类别 §2.5", q: "下面这几个水果和蔬菜里，哪个是阳性？", opts: ["banane", "cerise", "pamplemousse", "fraise"], a: 2,
    exp: "以 e 结尾的水果、蔬菜一般是阴性：une banane、une cerise、une carotte。例外：un pamplemousse、un concombre。不以 e 结尾的是阳性：un citron、un abricot。（书中第 27 章 · p.408）" },
  { id: "fr-r4-25", ch: 27, cat: "阴性类别 §2.5", q: "下面这几门学科里，哪个是阳性？", opts: ["physique", "chimie", "dessin", "géographie"], a: 2,
    exp: "艺术、手艺、科学、学校科目的名称一般是阴性：la physique、la chimie、l'histoire、la peinture。例外：le dessin、le calcul、le droit、le génie。（书中第 27 章 · p.409）" },
  { id: "fr-r4-26", ch: 27, cat: "阴性词尾 §2.6", q: "下面这几个名词里，哪个是阳性？", opts: ["bouteille", "verre", "guerre", "pierre"], a: 1,
    exp: "e 前面是元音或双写辅音的名词一般是阴性：une bouteille、la guerre、une pierre。例外很多：le verre、le tonnerre、le beurre、un musée、un lycée、un parapluie。（书中第 27 章 · p.409）" },
  { id: "fr-r4-27", ch: 27, cat: "阴性词尾 §2.6", q: "下面这几个名词里，哪个是阳性？", opts: ["patience", "science", "silence", "violence"], a: 2,
    exp: "以 -ance、-anse、-ence、-ense 结尾的名词是阴性：la chance、la danse、la science。例外：le silence、le suspense。（书中第 27 章 · p.410）" },
  { id: "fr-r4-28", ch: 27, cat: "阴性词尾 §2.6", q: "下面这几个名词里，哪个是阳性？", opts: ["santé", "été", "amitié", "bonté"], a: 1,
    exp: "以 -té、-tié 结尾的名词是阴性：la santé、la bonté、l'amitié、la moitié。例外：un été、un comité、un côté、un pâté、un traité。（书中第 27 章 · p.411）" },
  { id: "fr-r4-29", ch: 27, cat: "阴性词尾 §2.6", q: "下面这几个名词里，哪个是阳性？", opts: ["chanson", "raison", "saison", "poisson"], a: 3,
    exp: "以 -son 结尾的名词是阴性：une chanson、une maison、une saison。例外：un son、un poison（毒药）。un poisson（鱼）也是阳性。（书中第 27 章 · p.410）" },
  { id: "fr-r4-30", ch: 27, cat: "阴性词尾 §2.6", q: "下面这几个以 -ade 结尾的名词里，哪个是阳性？", opts: ["salade", "promenade", "stade", "façade"], a: 2,
    exp: "以 -ade 结尾的名词是阴性：la salade、la promenade、l'ambassade。例外：un stade、un grade。（书中第 27 章 · p.411）" },
  { id: "fr-r4-31", ch: 27, cat: "阴性词尾 §2.6", q: "下面这几个名词里，哪个是阳性？", opts: ["chemise", "église", "magazine", "surprise"], a: 2,
    exp: "以 -ine、-ise 结尾的名词是阴性：la cuisine、la chemise、l'église。例外：le magazine、le platine、le pare-brise。（书中第 27 章 · p.411）" },
  { id: "fr-r4-32", ch: 27, cat: "两种性别 §2.7", q: "Toutes les vieilles gens étaient ___.", opts: ["arrivés", "arrivées"], a: 1,
    exp: "gens 通常按阳性配合：tous les gens、des gens ennuyeux。但前面紧挨着一个阴阳性形式不同的形容词时，gens 变成阴性：toutes les vieilles gens étaient arrivées。（书中第 27 章 · p.412）" },
  { id: "fr-r4-33", ch: 27, cat: "两种性别 §2.7", q: "Ces jeunes gens sont bien ___ !", opts: ["bruyants", "bruyantes"], a: 0,
    exp: "jeunes gens 看作一个词，永远是阳性，所以是 bruyants。对比 de vieilles gens、de bonnes gens 是阴性。（书中第 27 章 · p.412）" },
  { id: "fr-r4-34", ch: 27, cat: "两种性别 §2.7", q: "___ Pâques à toute la famille !", opts: ["Joyeuses", "Joyeux"], a: 0,
    exp: "Pâques 在祝福语里是阴性复数：Joyeuses Pâques！指日期时是阳性：Quand Pâques sera passé…（书中第 27 章 · p.413）" },
  { id: "fr-r4-35", ch: 27, cat: "两种性别 §2.8", q: "Au marché, j'ai acheté ___ livre de cerises.", opts: ["un", "une"], a: 1,
    exp: "un livre 是“书”，une livre 是“一磅”（重量或英镑）。同类成对的词还有 un/une manche、un/une mode、un/une poste、un/une tour。（书中第 27 章 · p.413）" },
  { id: "fr-r4-36", ch: 27, cat: "两种性别 §2.8", q: "Fais fondre un peu de beurre dans ___ poêle.", opts: ["le", "la"], a: 1,
    exp: "une poêle 是“平底锅”，un poêle 是“炉子”。同类的还有 un moule（模具）和 une moule（贻贝），un voile（面纱）和 une voile（船帆）。（书中第 27 章 · p.413）" },
  { id: "fr-r4-37", ch: 27, cat: "两种性别 §2.8", q: "Le journal a publié ___ critique très sévère de ce film.", opts: ["un", "une"], a: 1,
    exp: "une critique 是“批评、评论文章”，un critique 是“评论家”（人）。同类：la mémoire（记忆）和 le mémoire（备忘录、论文）。（书中第 27 章 · p.413）" },
  { id: "fr-r4-38", ch: 27, cat: "复合名词 §2.9", q: "Tu n'aurais pas ___ ouvre-boîte ?", opts: ["un", "une"], a: 0,
    exp: "复合名词一般取其中名词的阴阳性：un chou-fleur、un gratte-ciel。但例外很多：虽然是 une boîte，un ouvre-boîte 却是阳性，因为它指“开罐头的东西”（quelque chose，阳性）。un rouge-gorge 同理（是一种 oiseau）。（书中第 27 章 · p.414）" },
  { id: "fr-r4-39", ch: 27, cat: "缩写词 §2.10", q: "L'ONU a été ___ à Sarajevo.", opts: ["humilié", "humiliée"], a: 1,
    exp: "缩写词一般取其中主要名词的阴阳性：ONU = Organisation des Nations Unies，organisation 是阴性，所以配合成 humiliée。同理 les HLM sont réservées。（书中第 27 章 · p.414）" },

  { id: "fr-r5-1", ch: 31, cat: "中性代词 le", q: "Vous a-t-il dit la vérité ? — Je ne ___ crois pas.", opts: ["le", "la", "en", "y"], a: 0,
    exp: "le 可以作中性代词，代替前面整个句子：le = qu'il vous a dit la vérité。虽然 la vérité 是阴性，这里指代的是“他说了实话”这件事，所以用 le。（书中第 31 章 · p.508）" },
  { id: "fr-r5-2", ch: 31, cat: "中性代词 le", q: "Elle est très jolie ! — Oui, elle ___ est vraiment.", opts: ["l' (= le)", "l' (= la)", "en", "y"], a: 0,
    exp: "代替表语形容词时用中性的 le，不随主语变成 la：Je suis parfois paresseux, mais vous, vous l'êtes tout le temps。这里 l' 是 le 的省音，代替 jolie。（书中第 31 章 · p.508）" },
  { id: "fr-r5-3", ch: 31, cat: "中性代词 le", q: "Je trouve ___ difficile de me concentrer.", opts: ["le", "la", "cela", "（不填）"], a: 3,
    exp: "英语说 I find it difficult to…，法语在“形容词 + 不定式”前面不加 le：Je trouve difficile de me concentrer. Il a jugé nécessaire de partir.（书中第 31 章 · p.508）" },
  { id: "fr-r5-4", ch: 31, cat: "间接宾语 lui / leur", q: "Ils obéissent à leurs parents. → Ils ___ obéissent.", opts: ["les", "leur", "y", "eux"], a: 1,
    exp: "obéir à qn 是间接及物动词（英语 obey 是直接及物），所以用 leur。反过来，attendre、écouter、regarder 在法语里是直接及物：Je l'attends。（书中第 31 章 · p.509）" },
  { id: "fr-r5-5", ch: 31, cat: "双宾语限制", q: "“她把我介绍给了他。”哪一句正确？", opts: ["Elle me lui a présentée.", "Elle m'a présentée à lui.", "Elle lui m'a présentée.", "Elle m'y a présentée."], a: 1,
    exp: "两个宾语代词连用时，me、te、nous、vous 只能理解为间接宾语，所以不能说 *me lui。直接宾语是 me 时，间接宾语要改用 à + 重读代词：Elle m'a présentée à lui。（书中第 31 章 · p.510）" },
  { id: "fr-r5-6", ch: 31, cat: "代词 y", q: "J'ai reçu une lettre et j'y ai ___ tout de suite.", opts: ["répondu", "répondue", "répondus", "répondues"], a: 0,
    exp: "y 是间接宾语，不影响过去分词的配合，所以写 répondu。（书中第 31 章 · p.511）" },
  { id: "fr-r5-7", ch: 31, cat: "代词 y", q: "Bruno ira-t-il au cours demain ? — Oui, il ___.", opts: ["ira", "y ira", "en ira", "l'ira"], a: 0,
    exp: "aller 的将来时和条件式前面省略 y，避免两个元音相撞：Oui, il ira。现在时照常用 y：Oui, il y va。（书中第 31 章 · p.512）" },
  { id: "fr-r5-8", ch: 31, cat: "代词 y", q: "Je m'___ connais en mécanique !", opts: ["en", "y", "le", "la"], a: 1,
    exp: "固定表达 s'y connaître en qch：精通某个领域。泛指学科时用 être bon en：Je suis bon en mathématiques。（书中第 31 章 · p.513）" },
  { id: "fr-r5-9", ch: 31, cat: "代词 en", q: "Il y a beaucoup de pommes cette année. → Il y ___ a beaucoup.", opts: ["les", "y", "en", "（不填）"], a: 2,
    exp: "数量表达后面要用 en 代替 de + 名词，beaucoup 保留：Il y en a beaucoup。书中提醒，忘记加 en 是常见错误。（书中第 31 章 · p.514）" },
  { id: "fr-r5-10", ch: 31, cat: "代词 en", q: "J'ai lu quelques romans de Balzac. → J'en ai lu ___.", opts: ["quelques", "quelques-uns", "quelques-unes", "certains de"], a: 1,
    exp: "en 代替名词后，数量词要换成代词形式：quelques → quelques-uns（roman 是阳性）。同理 J'en ai une、J'en ai plusieurs。（书中第 31 章 · p.514）" },
  { id: "fr-r5-11", ch: 31, cat: "代词 en", q: "J'ai trouvé de beaux verres anciens : j'en ai ___ trois.", opts: ["acheté", "achetés", "achetée", "achetées"], a: 0,
    exp: "en 即使作直接宾语，过去分词也不配合，所以写 acheté。对比 Les verres ? Je les ai achetés。（书中第 31 章 · p.514）" },
  { id: "fr-r5-12", ch: 31, cat: "代词 en", q: "Elle m'___ veut parce que je n'ai pas pu l'aider hier.", opts: ["y", "en", "le", "la"], a: 1,
    exp: "固定表达 en vouloir à qn：怨恨、生某人的气。还有 s'en vouloir de（后悔、自责），s'en prendre à qn（责怪某人）。（书中第 31 章 · p.516）" },
  { id: "fr-r5-13", ch: 31, cat: "代词位置", q: "“她不想把他们送到那里去。”Elle ne voulait pas ___ envoyer.", opts: ["les y", "y les", "leur y", "les en"], a: 0,
    exp: "动词 + 不定式时，宾语代词放在不定式前面，顺序和单个动词时一样：直接宾语 les 在 y 前面。（书中第 31 章 · p.518）" },
  { id: "fr-r5-14", ch: 31, cat: "faire / laisser + 不定式", q: "“她让他们在马路上玩。”Elle ___ jouer sur la route.", opts: ["laisse les", "les laisse", "leur laisse", "laisse-les"], a: 1,
    exp: "laisser、faire 和感官动词（voir、entendre）加不定式时，代词放在这个变位动词前面，不放在不定式前面：Elle les laisse jouer. Je l'ai vu courir。（书中第 31 章 · p.518）" },
  { id: "fr-r5-15", ch: 31, cat: "faire / laisser + 不定式", q: "“我让他整理了他的房间。”Je ___ ai fait ranger sa chambre.", opts: ["l'", "lui", "le", "y"], a: 1,
    exp: "faire + 不定式，而不定式又带直接宾语（sa chambre）时，不定式的主语变成间接宾语：Je lui ai fait ranger sa chambre。（书中第 31 章 · p.518）" },
  { id: "fr-r5-16", ch: 31, cat: "重读代词 soi", q: "On n'est jamais aussi bien que chez ___.", opts: ["lui", "soi", "nous", "eux"], a: 1,
    exp: "soi 用于泛指的单数主语：on、chacun、personne、无人称 il。Il faut avoir confiance en soi。（书中第 31 章 · p.521）" },
  { id: "fr-r5-17", ch: 31, cat: "重读代词 soi", q: "Les gens rentrent chez ___.", opts: ["soi", "lui", "eux", "leur"], a: 2,
    exp: "主语是确指的人（les gens、Michel）时用 lui、elle、eux、elles，不用 soi：Les gens rentrent chez eux。（书中第 31 章 · p.521）" },
  { id: "fr-r5-18", ch: 31, cat: "重读代词", q: "Ni lui ni moi ne ___ attendions à cela.", opts: ["nous", "se", "m'", "s'"], a: 0,
    exp: "第一人称和第三人称并列作主语时，动词按 nous 变位，反身代词也用 nous：Ni lui ni moi ne nous attendions à cela。（书中第 31 章 · p.523）" },
  { id: "fr-r5-19", ch: 31, cat: "重读代词", q: "Ce n'est pas nous, ce ___ eux qui ont cassé le vase !", opts: ["est", "sont"], a: 1,
    exp: "c'est nous、c'est vous 用单数，但后面接 eux、elles 时用复数：ce sont eux、ce sont elles。（书中第 31 章 · p.524）" },
  { id: "fr-r5-20", ch: 31, cat: "重读代词", q: "J'ai besoin de Paul. → J'ai besoin ___.", opts: ["en", "de lui", "lui", "le"], a: 1,
    exp: "要求 de 的动词，后面是人时用 de + 重读代词：de lui、d'elle、d'eux。是事物时用 en：J'en ai besoin。（书中第 31 章 · p.525）" },
  { id: "fr-r5-21", ch: 32, cat: "ce qui / ce que", q: "Je n'ai pas encore reçu de nouvelles, ___ m'ennuie.", opts: ["qui", "ce qui", "ce que", "lequel"], a: 1,
    exp: "关系代词指代前面整个句子时，要在 qui 前面加 ce，并用逗号隔开：…, ce qui m'ennuie。（书中第 32 章 · p.530）" },
  { id: "fr-r5-22", ch: 32, cat: "ce qui / ce que", q: "Il sait ___ il fait.", opts: ["qu'", "ce qui", "ce qu'", "quoi"], a: 2,
    exp: "没有先行词时，作直接宾语用 ce que：Il sait ce qu'il fait. Ce que je veux, c'est la paix。（书中第 32 章 · p.532）" },
  { id: "fr-r5-23", ch: 32, cat: "à qui / auquel", q: "La personne ___ je parlais est un collègue.", opts: ["que", "dont", "à qui", "laquelle"], a: 2,
    exp: "parler à qn：带介词 à，先行词是人，用 à qui（或 à laquelle）。英语可以省略关系代词，法语不能。（书中第 32 章 · p.532）" },
  { id: "fr-r5-24", ch: 32, cat: "à quoi", q: "Ce ___ ils pensent n'a aucun intérêt pour moi.", opts: ["que", "dont", "à quoi", "auquel"], a: 2,
    exp: "penser à qch，先行词是中性的 ce，所以用 ce à quoi。同理 Je sais ce à quoi ressemble une montre。（书中第 32 章 · p.533）" },
  { id: "fr-r5-25", ch: 32, cat: "dont / de qui", q: "C'est ma grand-mère, celle ___ je tiens.", opts: ["dont", "de qui", "que", "à qui"], a: 1,
    exp: "书中特别指出：tenir de qn（像某人）要说 la grand-mère de qui je tiens，不说 *dont je tiens。一般情况下 dont 更常用：la personne dont je parle。（书中第 32 章 · p.534）" },
  { id: "fr-r5-26", ch: 32, cat: "dont", q: "C'est le livre dont j'ai oublié ___ titre.", opts: ["son", "le", "leur", "（不填）"], a: 1,
    exp: "用了 dont，就不能再加主有形容词：le livre dont j'ai oublié le titre，不说 *dont j'ai oublié son titre。法语语序是“主语 → 动词 → 带冠词的宾语”。（书中第 32 章 · p.535）" },
  { id: "fr-r5-27", ch: 32, cat: "dont", q: "Voilà la manière ___ la société est divisée.", opts: ["dans laquelle", "dont", "où", "que"], a: 1,
    exp: "être divisé d'une certaine manière 用 de，所以是 la manière dont…，不说 *la manière dans laquelle。（书中第 32 章 · p.535）" },
  { id: "fr-r5-28", ch: 32, cat: "dont", q: "Où est le chat, celui dont je ___ occupe ?", opts: ["m'en", "m'", "m'y", "me le"], a: 1,
    exp: "s'occuper de qch 的 de 已经由 dont 代替，不能再加 en：le chat dont je m'occupe，不说 *dont je m'en occupe。（书中第 32 章 · p.536）" },
  { id: "fr-r5-29", ch: 32, cat: "de quoi", q: "Donnez-moi ___ écrire.", opts: ["dont", "de quoi", "ce dont", "quoi"], a: 1,
    exp: "de quoi + 不定式，没有先行词，意思是“可以用来……的东西”：Donnez-moi de quoi écrire. Il n'y a pas de quoi se vanter。（书中第 32 章 · p.537）" },
  { id: "fr-r5-30", ch: 32, cat: "介词 + qui", q: "Paul est la seule personne ___ j'aie confiance.", opts: ["en qui", "dont", "à qui", "que"], a: 0,
    exp: "avoir confiance en qn，先行词是人，用“介词 + qui”：en qui。同理 la personne avec qui je travaille、les gens sur qui je compte。（书中第 32 章 · p.537）" },
  { id: "fr-r5-31", ch: 32, cat: "介词 + lequel", q: "J'ai rejoint un groupe d'amis, parmi ___ il y avait Paul et Françoise.", opts: ["qui", "lesquels", "eux", "quoi"], a: 1,
    exp: "先行词是人时一般用“介词 + qui”，但介词是 parmi 或 entre 时必须用 lequel 系列：parmi lesquels、entre lesquels。（书中第 32 章 · p.538）" },
  { id: "fr-r5-32", ch: 32, cat: "où", q: "C'est le magasin ___ je suis allée hier.", opts: ["auquel", "dont", "où", "que"], a: 2,
    exp: "表示地点的 à 或 de 不能放在 lequel 前面，要用 où：le magasin où je suis allée，不说 *le magasin auquel je suis allée。（书中第 32 章 · p.538）" },
  { id: "fr-r5-33", ch: 32, cat: "补语的补语", q: "C'est la rivière au bord ___ tous les campeurs rêvent de s'installer.", opts: ["dont", "de laquelle", "où", "que"], a: 1,
    exp: "如果名词补语本身前面还有介词（au bord de），就不能用 dont，要用 duquel / de laquelle：la rivière au bord de laquelle…。（书中第 32 章 · p.539）" },
  { id: "fr-r5-34", ch: 32, cat: "où", q: "Je me souviens du jour ___ il est venu.", opts: ["quand", "où", "que", "dont"], a: 1,
    exp: "先行词是时间时用 où，不用 quand：le jour où il est venu、le mois où la plupart des gens partent en vacances。（书中第 32 章 · p.540）" },
  { id: "fr-r5-35", ch: 33, cat: "主有代词的配合", q: "Ta robe est blanche ; ___ est rouge.", opts: ["le mien", "la mienne", "ma", "la mien"], a: 1,
    exp: "主有代词的人称跟着所有者变，阴阳性和单复数跟着所属的东西变：robe 是阴性单数，所以用 la mienne。（书中第 33 章 · p.545）" },
  { id: "fr-r5-36", ch: 33, cat: "介词 + 主有代词", q: "Occupez-vous de vos affaires, pas ___.", opts: ["de leurs", "des leurs", "de les leurs", "d'eux"], a: 1,
    exp: "主有代词的第一个词是定冠词，和 à、de 要缩合：de + les leurs → des leurs。同理 au mien、du tien。（书中第 33 章 · p.545）" },
  { id: "fr-r5-37", ch: 33, cat: "介词 + 主有代词", q: "Le garage des voisins est rattaché ___.", opts: ["à notre", "au notre", "au nôtre", "à le nôtre"], a: 2,
    exp: "à + le nôtre 缩合成 au nôtre。注意主有代词 nôtre、vôtre 带长音符，发音也和形容词 notre、votre 不同。（书中第 33 章 · p.545）" },
  { id: "fr-r5-38", ch: 33, cat: "être + 主有代词", q: "J'ai trouvé ce livre. ___ le vôtre ?", opts: ["Est-il", "Est-ce", "Est-elle", "Sont-ils"], a: 1,
    exp: "être 后面紧接主有代词时，主语用 ce，不用 il：Ce n'est pas votre sac, c'est le mien. Est-ce le vôtre ?（书中第 33 章 · p.546）" },
  { id: "fr-r5-39", ch: 33, cat: "à moi / le mien", q: "Ces livres sont à vous ; ___ sont restés à la maison.", opts: ["À moi", "Les miens", "Mes", "Les miennes"], a: 1,
    exp: "c'est à moi 和 c'est le mien 都能放在 être 后面，但只有主有代词能作主语：les miens sont restés…，不能说 *à moi sont…。（书中第 33 章 · p.546）" },
  { id: "fr-r5-40", ch: 33, cat: "泛指主语", q: "On nous avait demandé de prendre des parapluies. Chacun avait apporté ___.", opts: ["les siens", "le sien", "le leur", "les leurs"], a: 1,
    exp: "主语是 on、chacun、personne 这类泛指单数代词时，用第三人称单数的主有代词：Chacun avait apporté le sien。英语这里会说 theirs。（书中第 33 章 · p.547）" },
  { id: "fr-r5-41", ch: 33, cat: "习语", q: "Serez-vous ___ ce soir pour dîner ?", opts: ["les nôtres", "des nôtres", "à nous", "nôtres"], a: 1,
    exp: "être des nôtres：和我们一起、加入我们。les siens 也可以指家人：Je n'ai pas vu les miens depuis un an。（书中第 33 章 · p.547）" },
  { id: "fr-r5-42", ch: 33, cat: "习语", q: "Si tu veux réussir, il faut que tu y mettes du ___.", opts: ["sien", "tien", "tienne", "tiens"], a: 1,
    exp: "y mettre du sien：出一份力，尽自己的努力。du sien 要随人称变化：du mien、du tien。（书中第 33 章 · p.547）" },
  { id: "fr-r5-43", ch: 34, cat: "celui + 关系从句", q: "Je cherche une collègue, ___ dont je t'ai parlé hier.", opts: ["laquelle", "celle", "celle-ci", "l'une"], a: 1,
    exp: "the one + 关系从句用 celui / celle / ceux / celles，不能用 l'un。l'un 表示“其中一个”：l'un est venu, l'autre non。（书中第 34 章 · p.550）" },
  { id: "fr-r5-44", ch: 34, cat: "celui de", q: "Il a choisi le tableau de Picasso plutôt que ___ de Magritte.", opts: ["celui-là", "celui", "ce", "le sien"], a: 1,
    exp: "celui、celle 这类简单形式不能单独用，后面要接 de、关系从句或分词：celui de Magritte。（书中第 34 章 · p.551）" },
  { id: "fr-r5-45", ch: 34, cat: "ceux qui", q: "___ qui peuvent vivre sans travailler ont bien de la chance.", opts: ["Ce", "Ceux", "Eux", "Celles-ci"], a: 1,
    exp: "没有先行词、泛指“那些……的人”时用 ceux qui / celui qui。指事物的“……的东西”用 ce qui。（书中第 34 章 · p.551）" },
  { id: "fr-r5-46", ch: 34, cat: "celui / ce", q: "（空格指代前面整句话）On a le droit de voter, ___ nous permet de changer le gouvernement.", opts: ["celui qui", "ce qui", "qui", "lequel"], a: 1,
    exp: "celui 代替一个名词词组（le droit de voter），ce 代替整个句子。要指“有投票权这件事”，用 ce qui。（书中第 34 章 · p.551）" },
  { id: "fr-r5-47", ch: 34, cat: "celui-ci / celui-là", q: "Lesquelles sont vos chaussures ? ___ ou celles-là ?", opts: ["Ceux-ci", "Celles-ci", "Celles", "Cela"], a: 1,
    exp: "复合形式 celui-ci / celui-là 用来区分两样东西，阴阳性和单复数跟着名词走：chaussures 是阴性复数，用 celles-ci。（书中第 34 章 · p.552）" },
  { id: "fr-r5-48", ch: 34, cat: "celui-ci / celui-là", q: "Courchevel et Kaprun sont deux stations de ski. ___ se trouve en Autriche et celle-là en France.", opts: ["Celle-là", "Celle-ci", "Celui-ci", "Celle"], a: 1,
    exp: "同一句里，celui-ci 指“后者”（离得近、后提到的 Kaprun），celui-là 指“前者”（Courchevel）。（书中第 34 章 · p.553）" },
  { id: "fr-r5-49", ch: 34, cat: "ce + 关系代词", q: "Ce ___ j'ai besoin, c'est de vacances.", opts: ["que", "dont", "qui", "à quoi"], a: 1,
    exp: "avoir besoin de qch，所以是 ce dont。ce qui、ce que、ce dont、ce à quoi 相当于英语的 what。（书中第 34 章 · p.553）" },

  { id: "fr-r6-1", ch: 31, cat: "直接宾语 le / la / les", q: "Tu vois ce film ce soir ? — Oui, je ___ vois avec Paul.", opts: ["la", "le", "lui", "en"], a: 1,
    exp: "voir qch 直接接宾语，ce film 是阳性单数，用 le。（书中第 31 章 · p.507）" },
  { id: "fr-r6-2", ch: 31, cat: "直接宾语 le / la / les", q: "Tu connais ces filles ? — Non, je ne ___ connais pas.", opts: ["leur", "lui", "les", "en"], a: 2,
    exp: "connaître qn 直接接宾语，ces filles 是复数，用 les（阴阳性同形）。leur 是间接宾语。（书中第 31 章 · p.507）" },
  { id: "fr-r6-3", ch: 31, cat: "直接宾语 le / la / les", q: "Elle est jolie, ta robe ! — Merci, je l'ai ___ samedi.", opts: ["acheté", "achetée", "achetés", "achetées"], a: 1,
    exp: "直接宾语代词 la（l'）放在 avoir 前面，过去分词要和它配合：robe 是阴性单数，写 achetée。（书中第 31 章 · p.507）" },
  { id: "fr-r6-4", ch: 31, cat: "间接宾语 lui / leur", q: "Tu as écrit à tes grands-parents ? — Oui, je ___ ai écrit hier.", opts: ["les", "leur", "lui", "y"], a: 1,
    exp: "écrire à qn 带 à，人用间接宾语代词。复数用 leur，单数用 lui。（书中第 31 章 · p.509）" },
  { id: "fr-r6-5", ch: 31, cat: "间接宾语 lui / leur", q: "Tu téléphones à Julie ce soir ? — Oui, je ___ téléphone à huit heures.", opts: ["la", "leur", "lui", "y"], a: 2,
    exp: "téléphoner à qn 是间接及物（英语 phone sb 是直接），所以用 lui。（书中第 31 章 · p.509）" },
  { id: "fr-r6-6", ch: 31, cat: "直接还是间接", q: "Tu attends le bus ? — Oui, je ___ attends depuis dix minutes.", opts: ["l'", "lui", "y", "en"], a: 0,
    exp: "attendre qn / qch 在法语里直接接宾语（英语是 wait for），所以用 l'（le）。同类：écouter、regarder、chercher。（书中第 31 章 · p.509）" },
  { id: "fr-r6-7", ch: 31, cat: "代词 y", q: "Tu vas au cinéma ce soir ? — Oui, j'___ vais avec ma sœur.", opts: ["en", "y", "le", "lui"], a: 1,
    exp: "y 代替 à / dans / chez 等 + 地点：au cinéma → y。（书中第 31 章 · p.511）" },
  { id: "fr-r6-8", ch: 31, cat: "代词 y", q: "Tu penses à ton examen ? — Oui, j'___ pense tout le temps.", opts: ["y", "en", "le", "lui"], a: 0,
    exp: "penser à + 事物用 y：J'y pense。如果是人，要说 Je pense à lui / à elle。（书中第 31 章 · p.510）" },
  { id: "fr-r6-9", ch: 31, cat: "代词 en", q: "Tu as des frères ? — Oui, j'___ ai deux.", opts: ["les", "y", "leur", "en"], a: 3,
    exp: "en 代替“des + 名词”，数字保留在句末：J'en ai deux。（书中第 31 章 · p.514）" },
  { id: "fr-r6-10", ch: 31, cat: "代词 en", q: "Tu veux de l'eau ? — Non merci, je n'___ veux pas.", opts: ["la", "en", "y", "le"], a: 1,
    exp: "en 代替“部分冠词 + 名词”：de l'eau → en。否定句里也一样：Je n'en veux pas。（书中第 31 章 · p.513）" },
  { id: "fr-r6-11", ch: 31, cat: "代词 en", q: "Tu viens de la bibliothèque ? — Oui, j'___ viens.", opts: ["y", "la", "en", "le"], a: 2,
    exp: "en 代替 de + 地点（从某地来）：J'en viens。y 代替 à + 地点（去某地）。（书中第 31 章 · p.515）" },
  { id: "fr-r6-12", ch: 31, cat: "代词 en", q: "Tu parles souvent de ton voyage ? — Oui, j'___ parle tout le temps.", opts: ["y", "le", "lui", "en"], a: 3,
    exp: "parler de qch：de + 事物用 en。如果是人，要说 Je parle de lui。（书中第 31 章 · p.513）" },
  { id: "fr-r6-13", ch: 31, cat: "代词位置", q: "Ce livre ? Je vais ___ ce week-end.", opts: ["le lire", "lire le", "lui lire", "le en lire"], a: 0,
    exp: "动词 + 不定式时，宾语代词放在它所属的不定式前面：Je vais le lire。（书中第 31 章 · p.518）" },
  { id: "fr-r6-14", ch: 31, cat: "代词位置", q: "Tu as vu Marc ? — Non, je ___.", opts: ["ne l'ai vu pas", "l'ai ne pas vu", "ne l'ai pas vu", "ne ai pas le vu"], a: 2,
    exp: "复合过去时的否定：ne + 代词 + 助动词 + pas + 过去分词：Je ne l'ai pas vu。（书中第 31 章 · p.518）" },
  { id: "fr-r6-15", ch: 31, cat: "命令式", q: "Ce livre est à moi. Donne-___ !", opts: ["moi-le", "le-moi", "me-le", "le-me"], a: 1,
    exp: "肯定命令式：代词放在动词后，直接宾语在前，me 变成 moi：Donne-le-moi !（书中第 14 章 · p.205）" },
  { id: "fr-r6-16", ch: 31, cat: "命令式", q: "Ces gâteaux sont pour demain. Ne ___ mange pas !", opts: ["les", "leur", "y", "le"], a: 0,
    exp: "否定命令式：代词回到动词前面，不加连字符：Ne les mange pas !（书中第 14 章 · p.206）" },
  { id: "fr-r6-17", ch: 31, cat: "重读代词", q: "Je vais au cinéma avec Marie et Sophie. Tu viens avec ___ ?", opts: ["eux", "les", "elles", "leur"], a: 2,
    exp: "介词后面指人用重读代词。Marie et Sophie 都是女性，用 elles；有男有女时用 eux。（书中第 31 章 · p.526）" },
  { id: "fr-r6-18", ch: 31, cat: "重读代词", q: "___, je préfère le thé.", opts: ["Je", "Moi", "Me", "Mon"], a: 1,
    exp: "强调主语时，在句首加重读代词，后面还要保留 je：Moi, je préfère le thé。（书中第 31 章 · p.522）" },
  { id: "fr-r6-19", ch: 31, cat: "重读代词", q: "Ma sœur est plus grande que ___.", opts: ["je", "me", "moi", "mon"], a: 2,
    exp: "比较句 que 后面用重读代词：plus grande que moi、comme toi。（书中第 31 章 · p.523）" },
  { id: "fr-r6-20", ch: 31, cat: "重读代词", q: "C'est ___ qui as raison.", opts: ["tu", "te", "toi", "ton"], a: 2,
    exp: "c'est 后面用重读代词：c'est moi、c'est toi。注意 qui 后面的动词跟着 toi 变位：qui as raison。（书中第 31 章 · p.524）" },
  { id: "fr-r6-21", ch: 32, cat: "qui / que", q: "J'ai un ami ___ habite à Lyon.", opts: ["que", "qui", "dont", "où"], a: 1,
    exp: "关系代词在从句里作主语时用 qui：un ami qui habite…（ami 是 habite 的主语）。（书中第 32 章 · p.530）" },
  { id: "fr-r6-22", ch: 32, cat: "qui / que", q: "Le gâteau ___ tu as fait est délicieux.", opts: ["qui", "dont", "que", "où"], a: 2,
    exp: "关系代词在从句里作直接宾语时用 que：tu as fait le gâteau → le gâteau que tu as fait。（书中第 32 章 · p.531）" },
  { id: "fr-r6-23", ch: 32, cat: "qui / que", q: "L'homme ___ tu vois là-bas est mon professeur.", opts: ["qui", "que", "dont", "où"], a: 1,
    exp: "从句的主语是 tu，l'homme 是 voir 的直接宾语，所以用 que。看从句里有没有主语，是区分 qui 和 que 的简单方法。（书中第 32 章 · p.531）" },
  { id: "fr-r6-24", ch: 32, cat: "dont", q: "Voici le livre ___ je t'ai parlé.", opts: ["que", "qui", "dont", "où"], a: 2,
    exp: "parler de qch 带 de，关系代词用 dont：le livre dont je t'ai parlé。（书中第 32 章 · p.535）" },
  { id: "fr-r6-25", ch: 32, cat: "dont", q: "C'est un film ___ tout le monde parle en ce moment.", opts: ["dont", "que", "qui", "où"], a: 0,
    exp: "同样是 parler de：tout le monde parle de ce film → un film dont tout le monde parle。（书中第 32 章 · p.535）" },
  { id: "fr-r6-26", ch: 32, cat: "dont", q: "Tu as trouvé le stylo ___ tu avais besoin ?", opts: ["que", "dont", "où", "qui"], a: 1,
    exp: "avoir besoin de qch 带 de，所以用 dont。dont 前面的动词带 de 时就想到它：parler de、avoir besoin de、être content de。（书中第 32 章 · p.535）" },
  { id: "fr-r6-27", ch: 32, cat: "où", q: "C'est la ville ___ je suis né.", opts: ["que", "dont", "qui", "où"], a: 3,
    exp: "先行词是地点，用 où：la ville où je suis né。（书中第 32 章 · p.540）" },
  { id: "fr-r6-28", ch: 32, cat: "où", q: "Je me souviens du jour ___ nous nous sommes rencontrés.", opts: ["quand", "où", "que", "dont"], a: 1,
    exp: "先行词是时间（le jour、le moment、l'année），也用 où，不用 quand。（书中第 32 章 · p.540）" },
  { id: "fr-r6-29", ch: 32, cat: "介词 + qui", q: "La collègue avec ___ je travaille est très sympa.", opts: ["que", "qui", "dont", "où"], a: 1,
    exp: "介词后面指人用 qui：avec qui、pour qui、chez qui。（书中第 32 章 · p.537）" },
  { id: "fr-r6-30", ch: 32, cat: "ce qui / ce que", q: "___ m'intéresse, c'est l'histoire.", opts: ["Ce que", "Qui", "Ce qui", "Que"], a: 2,
    exp: "没有先行词、意思是“……的东西”时，用 ce qui（作主语）或 ce que（作宾语）。这里作 intéresse 的主语，用 ce qui。（书中第 32 章 · p.530）" },
  { id: "fr-r6-31", ch: 32, cat: "ce qui / ce que", q: "Dis-moi ___ tu veux pour ton anniversaire.", opts: ["ce qui", "ce que", "que", "quoi"], a: 1,
    exp: "tu veux 有主语 tu，空格是 vouloir 的宾语，用 ce que。（书中第 32 章 · p.532）" },
  { id: "fr-r6-32", ch: 33, cat: "主有代词", q: "Ce n'est pas mon vélo, c'est ___ (= 你的).", opts: ["ton", "la tienne", "le tien", "le tient"], a: 2,
    exp: "主有代词由定冠词 + mien / tien / sien… 组成，阴阳性跟着东西走：vélo 是阳性，用 le tien。（书中第 33 章 · p.544）" },
  { id: "fr-r6-33", ch: 33, cat: "主有代词", q: "J'ai oublié ma clé. Tu peux me prêter ___ ?", opts: ["le tien", "la tienne", "ta", "les tiennes"], a: 1,
    exp: "clé 是阴性单数，所以是 la tienne。（书中第 33 章 · p.545）" },
  { id: "fr-r6-34", ch: 33, cat: "主有代词", q: "Mon appartement est petit, mais ___ est grand (= 我们的).", opts: ["le notre", "la nôtre", "notre", "le nôtre"], a: 3,
    exp: "appartement 是阳性，用 le nôtre。主有代词 nôtre、vôtre 带长音符，形容词 notre、votre 不带。（书中第 33 章 · p.545）" },
  { id: "fr-r6-35", ch: 33, cat: "主有代词", q: "Nos enfants jouent souvent avec ___ (= 他们的).", opts: ["leurs", "les leurs", "les leur", "le leur"], a: 1,
    exp: "复数用 les leurs。注意主有代词前面一定有冠词，单独的 leurs 是形容词。（书中第 33 章 · p.545）" },
  { id: "fr-r6-36", ch: 33, cat: "主有代词", q: "Ces clés sont à toi ? — Oui, ce sont ___.", opts: ["les miens", "mes", "les miennes", "la mienne"], a: 2,
    exp: "clés 是阴性复数，用 les miennes。être 后面接主有代词时用 c'est / ce sont。（书中第 33 章 · p.546）" },
  { id: "fr-r6-37", ch: 34, cat: "指示代词", q: "Quelle robe veux-tu ? — ___ qui est rouge.", opts: ["Celui", "Celle", "Cette", "Ce"], a: 1,
    exp: "robe 是阴性单数，用 celle。celui / celle / ceux / celles 后面要接 qui、que、de 等。（书中第 34 章 · p.550）" },
  { id: "fr-r6-38", ch: 34, cat: "指示代词", q: "Mon ordinateur est plus rapide que ___ de mon frère.", opts: ["celle", "ce", "celui", "cela"], a: 2,
    exp: "ordinateur 是阳性单数，用 celui de…：哥哥的那台。（书中第 34 章 · p.551）" },
  { id: "fr-r6-39", ch: 34, cat: "指示代词", q: "Tu préfères ces chaussures-ci ou ___ ?", opts: ["ceux-là", "celles-là", "cela", "celles"], a: 1,
    exp: "chaussures 是阴性复数，用 celles-là。加 -ci / -là 时可以单独用，不用接从句。（书中第 34 章 · p.552）" },
  { id: "fr-r6-40", ch: 34, cat: "指示代词", q: "___ qui veulent venir peuvent s'inscrire ici.", opts: ["Ce", "Eux", "Ceux", "Celui"], a: 2,
    exp: "ceux qui… 指“那些……的人”，动词用复数 veulent。单数的“……的人”是 celui qui。（书中第 34 章 · p.551）" },

  { id: "fr-r7-1", ch: 38, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Je ne l'ai pas encore vu, ce film.", tr: "意思：我还没看过这部电影。", opts: ["我还没看过这部电影。", "我已经看过这部电影了。", "我再也不想看这部电影。", "我昨天刚看了这部电影。"], a: 0,
    exp: "ne… pas encore = 还没有。对比 ne… plus = 不再，déjà = 已经。" },
  { id: "fr-r7-2", ch: 11, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Il vient de partir.", tr: "意思：他刚走。", opts: ["他刚走。", "他马上就要走。", "他是从那边来的。", "他还没走。"], a: 0,
    exp: "venir de + 不定式 = 刚刚做了某事。aller + 不定式 才是“马上要做”。" },
  { id: "fr-r7-3", ch: 38, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Je n'ai plus faim, merci.", tr: "意思：我已经不饿了，谢谢。", opts: ["我已经不饿了，谢谢。", "我还很饿，谢谢。", "我从来不觉得饿。", "我只是有点饿。"], a: 0,
    exp: "ne… plus = 不再，已经不。ne… jamais 才是“从来不”。" },
  { id: "fr-r7-4", ch: 38, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Je n'ai que dix euros sur moi.", tr: "意思：我身上只有十欧元。", opts: ["我身上只有十欧元。", "我身上一分钱也没有。", "我身上至少有十欧元。", "我还欠别人十欧元。"], a: 0,
    exp: "ne… que = 只有、仅仅，不是否定。听到 ne 不要马上理解成“没有”，要等后面是 pas、plus 还是 que。" },
  { id: "fr-r7-5", ch: 6, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Ça fait deux ans que j'habite ici.", tr: "意思：我在这儿住了两年了。", opts: ["我在这儿住了两年了（现在还住）。", "我两年前住在这儿。", "我还要在这儿住两年。", "我在这儿住了两年就搬走了。"], a: 0,
    exp: "ça fait + 时间 + que + 现在时 = 某事已经持续了多久，现在还在继续。同义：J'habite ici depuis deux ans。" },
  { id: "fr-r7-6", ch: 20, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "On se retrouve devant la gare à huit heures ?", tr: "意思：我们八点在火车站前面碰头好吗？", opts: ["我们八点在火车站前面碰头好吗？", "我们八点在火车站里面吃饭吗？", "他八点在火车站前面找到了东西。", "火车八点从车站出发吗？"], a: 0,
    exp: "se retrouver = 约好碰面。on 在口语里常常等于 nous。retrouver qch 才是“找回某物”。" },
  { id: "fr-r7-7", ch: 13, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Si j'avais su, je serais venu plus tôt.", tr: "意思：早知道的话，我就早点来了。", opts: ["早知道的话，我就早点来了。", "我知道了，所以早点来了。", "要是我知道，我会晚点来。", "我早就知道你会来。"], a: 0,
    exp: "si + 愈过去时，主句用条件式过去时，表示和过去事实相反：其实不知道，所以没早来。" },
  { id: "fr-r7-8", ch: 12, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Il faut que tu me rappelles ce soir.", tr: "意思：你今晚一定要给我回个电话。", opts: ["你今晚一定要给我回个电话。", "我今晚会给你打电话。", "你今晚不用给我打电话了。", "你昨晚给我打过电话。"], a: 0,
    exp: "rappeler qn = 给某人回电话。il faut que + 虚拟式 = 必须。注意主语是 tu，打电话的是“你”。" },
  { id: "fr-r7-9", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Tu as déjà mangé ?", tr: "意思：你已经吃过了吗？", opts: ["Oui, il y a une heure.", "Oui, je mange demain.", "Non, je suis déjà là.", "Oui, avec plaisir, j'arrive !"], a: 0,
    exp: "问的是“吃过了没有”，回答“吃过了，一个小时前”。il y a + 时间 = ……之前。" },
  { id: "fr-r7-10", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Qu'est-ce que tu fais dans la vie ?", tr: "意思：你是做什么工作的？", opts: ["Je suis infirmière.", "Je fais du sport le samedi.", "Je vais très bien, merci.", "J'habite à Lyon."], a: 0,
    exp: "Qu'est-ce que tu fais dans la vie ? 是问职业的固定说法，不是问“你在做什么”。" },
  { id: "fr-r7-11", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Ça te dirait d'aller au cinéma ce soir ?", tr: "意思：今晚去看电影，你想去吗？", opts: ["Bonne idée ! À quelle heure ?", "Il me l'a dit hier.", "Non, je ne dis rien.", "Oui, je te l'ai déjà dit."], a: 0,
    exp: "Ça te dirait de… ? = 你想不想……？是邀请，和 dire（说）的本义无关。" },
  { id: "fr-r7-12", ch: 31, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Tu pourrais me passer le sel, s'il te plaît ?", tr: "意思：你能把盐递给我吗？", opts: ["Tiens, le voilà.", "Oui, je l'ai passé hier.", "Non, je ne passe pas par là.", "Le sel, c'est mauvais pour moi."], a: 0,
    exp: "passer qch à qn = 把东西递给某人。Tiens, le voilà = 给，在这儿。le 指 le sel。" },
  { id: "fr-r7-13", ch: 6, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Depuis quand tu apprends le français ?", tr: "意思：你从什么时候开始学法语的（学了多久了）？", opts: ["Depuis deux ans.", "Dans deux ans.", "Il y a deux ans.", "Pendant deux heures."], a: 0,
    exp: "depuis quand 问持续到现在多久，用 depuis 回答。il y a deux ans 回答的是“什么时候开始”（两年前），dans deux ans 是“两年后”。" },
  { id: "fr-r7-14", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Tu es allé où pendant les vacances ?", tr: "意思：你假期去哪儿了？", opts: ["En Bretagne, chez mes cousins.", "Pendant deux semaines.", "Avec mes parents.", "Oui, c'était super."], a: 0,
    exp: "疑问词是 où（哪里），只有地点的回答对题。pendant 回答多久，avec 回答和谁。" },
  { id: "fr-r7-15", ch: 38, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Ça ne te dérange pas si j'ouvre la fenêtre ?", tr: "意思：我开窗你不介意吧？", opts: ["Non, pas du tout, vas-y.", "Si, ouvre-la tout de suite.", "Oui, merci beaucoup.", "Non, je ne l'ai pas."], a: 0,
    exp: "否定问句“不打扰你吧？”，回答 Non 表示“不打扰”，所以 Non, vas-y（去开吧）。如果说 Si，意思是“会打扰”，后面就不会让对方开窗。" },
  { id: "fr-r7-16", ch: 33, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Il est à qui, ce parapluie ?", tr: "意思：这把伞是谁的？", opts: ["C'est le mien.", "Il est à la maison.", "Il pleut beaucoup.", "C'est un grand parapluie."], a: 0,
    exp: "être à qn = 属于某人。问“是谁的”，回答 C'est le mien（是我的）。Il est à la maison 是说在哪里。" },
  { id: "fr-r7-17", ch: 37, cat: "听力 · 听懂内容", q: "听录音：这个人订的是什么？", audio: "Bonjour, je voudrais réserver une table pour quatre personnes, samedi soir, vers vingt heures.", tr: "意思：您好，我想订一张桌子，四个人，星期六晚上八点左右。", opts: ["星期六晚上八点，四个人", "星期六晚上四点，八个人", "星期四晚上八点，四个人", "星期天晚上八点，四个人"], a: 0,
    exp: "vingt heures = 20 点 = 晚上八点。法国口语和广播常用 24 小时制。注意区分 samedi（周六）和 jeudi（周四）。" },
  { id: "fr-r7-18", ch: 7, cat: "听力 · 听懂内容", q: "听录音：说话人是什么意思？", audio: "Désolé, je ne pourrai pas venir demain : ma fille est malade. On peut remettre ça à la semaine prochaine ?", tr: "意思：抱歉，我明天来不了：我女儿病了。我们能改到下周吗？", opts: ["明天来不了，想改到下周", "明天能来，但会晚一点", "下周来不了，想改到明天", "他自己病了，明天来不了"], a: 0,
    exp: "je ne pourrai pas = 我将不能（pouvoir 的将来时）。remettre à… = 推迟到……。病的是 ma fille（女儿）。" },
  { id: "fr-r7-19", ch: 37, cat: "听力 · 听懂内容", q: "听广播：这趟火车实际几点出发？", audio: "Le train de neuf heures quinze à destination de Marseille partira avec vingt minutes de retard.", tr: "意思：九点十五分开往马赛的火车将晚点二十分钟出发。", opts: ["9 点 35 分", "9 点 15 分", "8 点 55 分", "9 点 20 分"], a: 0,
    exp: "原定 9:15，avec vingt minutes de retard = 晚点 20 分钟，所以是 9:35。" },
  { id: "fr-r7-20", ch: 14, cat: "听力 · 听懂内容", q: "听录音：药店在哪里？", audio: "Prenez la deuxième rue à gauche, puis continuez tout droit. La pharmacie est en face de la poste.", tr: "意思：走第二条街左转，然后一直往前走。药店在邮局对面。", opts: ["在邮局对面", "在邮局旁边", "在第二条街右边", "在邮局后面"], a: 0,
    exp: "en face de = 在……对面。à côté de 是旁边，derrière 是后面。à gauche 是左边。" },
  { id: "fr-r7-21", ch: 13, cat: "听力 · 听懂内容", q: "听录音：说话人今年夏天怎么样？", audio: "J'aurais bien aimé partir en vacances cet été, mais je n'avais pas assez d'argent.", tr: "意思：今年夏天我本来很想去度假，可是钱不够。", opts: ["想去度假，但没去成", "去度假了，但花了很多钱", "根本不想去度假", "明年夏天才会去度假"], a: 0,
    exp: "j'aurais bien aimé = 我本来很想……（但没有实现），条件式过去时表示遗憾。" },
  { id: "fr-r7-22", ch: 30, cat: "听力 · 听懂内容", q: "听录音：下面哪个说法正确？", audio: "Marie est plus âgée que son frère, mais c'est lui qui est le plus grand.", tr: "意思：玛丽比她弟弟年纪大，但个子更高的是弟弟。", opts: ["玛丽年纪大，弟弟个子高", "玛丽年纪大，个子也高", "弟弟年纪大，个子也高", "玛丽年纪小，弟弟个子高"], a: 0,
    exp: "plus âgée que = 比……年纪大。c'est lui qui… 强调“是他”。grand 在这里指个子高。" },
  { id: "fr-r7-23", ch: 12, cat: "听力 · 听懂内容", q: "听录音：说话人在找什么？", audio: "Je cherche quelqu'un qui puisse garder mon chat pendant le week-end.", tr: "意思：我在找一个周末能帮我照看猫的人。", opts: ["周末能帮忙照看猫的人", "周末走丢的猫", "周末想买的一只猫", "能把猫带走送人的人"], a: 0,
    exp: "garder = 照看、看管。qui puisse 用了虚拟式，因为要找的人还不确定存不存在。" },
  { id: "fr-r7-24", ch: 31, cat: "听力 · 听懂内容", q: "听对话：钥匙在哪里？", audio: "Tu n'as pas oublié tes clés, j'espère ? — Non, je les ai mises dans mon sac.", tr: "意思：你没忘带钥匙吧？——没有，我把它们放在包里了。", opts: ["在包里", "忘在家里了", "找不到了", "在对方那里"], a: 0,
    exp: "je les ai mises：les 指 tes clés，mises 和阴性复数的 clés 配合。dans mon sac = 在我的包里。" },

  { id: "fr-r8-1", ch: 5, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Je suis fatigué, je vais me coucher.", tr: "意思：我累了，我要去睡觉了。", opts: ["我累了，要去睡觉了。", "我饿了，要去吃饭了。", "我很开心，要出去玩。", "我生病了，要去医院。"], a: 0,
    exp: "fatigué = 累。se coucher = 上床睡觉。" },
  { id: "fr-r8-2", ch: 19, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Il fait froid aujourd'hui.", tr: "意思：今天很冷。", opts: ["今天很冷。", "今天很热。", "今天在下雨。", "今天天气很好。"], a: 0,
    exp: "说天气用 il fait：il fait froid（冷）、il fait chaud（热）、il fait beau（天气好）。下雨是 il pleut。" },
  { id: "fr-r8-3", ch: 38, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Je ne mange pas de viande.", tr: "意思：我不吃肉。", opts: ["我不吃肉。", "我只吃肉。", "我今天还没吃饭。", "我不喜欢吃鱼。"], a: 0,
    exp: "ne… pas = 不。viande = 肉，poisson = 鱼。" },
  { id: "fr-r8-4", ch: 7, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "On va au restaurant ce soir ?", tr: "意思：我们今晚去饭店吃饭吧？", opts: ["今晚我们去饭店吃饭吧？", "今晚我们在家吃饭吗？", "昨晚我们去饭店了。", "饭店今晚不开门。"], a: 0,
    exp: "on 在口语里就是“我们”。ce soir = 今晚，hier soir 才是昨晚。" },
  { id: "fr-r8-5", ch: 30, cat: "听力 · 选意思", q: "听句子，选出正确的意思。", audio: "Ma sœur a deux ans de plus que moi.", tr: "意思：我姐姐比我大两岁。", opts: ["我姐姐比我大两岁。", "我妹妹比我小两岁。", "我姐姐今年两岁。", "我有两个姐姐。"], a: 0,
    exp: "avoir deux ans de plus que qn = 比某人大两岁。de moins que 是“小……岁”。" },
  { id: "fr-r8-6", ch: 37, cat: "听力 · 选意思", q: "听句子：他是哪一年出生的？", audio: "Je suis né en mille neuf cent quatre-vingt-dix-huit.", tr: "意思：我出生于 1998 年。", opts: ["1998 年", "1988 年", "1978 年", "1898 年"], a: 0,
    exp: "mille neuf cent = 1900，quatre-vingt-dix-huit = 4×20 + 18 = 98，合起来是 1998。" },
  { id: "fr-r8-7", ch: 20, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Comment tu t'appelles ?", tr: "意思：你叫什么名字？", opts: ["Je m'appelle Léa.", "J'ai vingt ans.", "Je vais bien, merci.", "J'habite à Paris."], a: 0,
    exp: "s'appeler = 名叫。注意不要和 Comment ça va ?（你好吗）混淆。" },
  { id: "fr-r8-8", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Quel âge as-tu ?", tr: "意思：你多大了？", opts: ["J'ai vingt-deux ans.", "Je suis étudiant.", "Il est deux heures.", "Depuis deux ans."], a: 0,
    exp: "法语说年龄用 avoir：j'ai vingt-deux ans。Il est deux heures 是说时间。" },
  { id: "fr-r8-9", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Tu habites où ?", tr: "意思：你住在哪儿？", opts: ["À Lille, près de la gare.", "Avec ma sœur.", "Depuis trois ans.", "Oui, j'habite."], a: 0,
    exp: "où = 哪里，回答地点。avec 回答“和谁”，depuis 回答“多久”。" },
  { id: "fr-r8-10", ch: 37, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Il est quelle heure ?", tr: "意思：现在几点？", opts: ["Il est midi et demi.", "Il fait beau.", "Il a trois ans.", "Une heure de route."], a: 0,
    exp: "问时间用 Il est quelle heure ? 回答 Il est… heure(s)。midi et demi = 中午十二点半。" },
  { id: "fr-r8-11", ch: 37, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Combien coûte ce pull ?", tr: "意思：这件毛衣多少钱？", opts: ["Trente-cinq euros.", "Il est bleu.", "En coton.", "Taille M."], a: 0,
    exp: "combien coûte… = ……多少钱。trente-cinq = 35。" },
  { id: "fr-r8-12", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Pourquoi tu es en retard ?", tr: "意思：你为什么迟到了？", opts: ["Parce que j'ai raté le bus.", "À neuf heures.", "Avec mon frère.", "En bus."], a: 0,
    exp: "pourquoi（为什么）用 parce que（因为）回答。rater le bus = 没赶上公交车。" },
  { id: "fr-r8-13", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Tu veux un café ?", tr: "意思：你要来杯咖啡吗？", opts: ["Oui, avec plaisir.", "Oui, c'est mon café.", "Il est au coin de la rue.", "Non, il n'est pas là."], a: 0,
    exp: "别人请你喝东西，接受说 Oui, avec plaisir / Oui, je veux bien，不要说 Non, merci。" },
  { id: "fr-r8-14", ch: 9, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Qu'est-ce que tu as fait ce week-end ?", tr: "意思：你这个周末做了什么？", opts: ["Je suis allé à la plage.", "Je vais aller à la plage.", "Je vais bien.", "Ce week-end, c'est samedi."], a: 0,
    exp: "问句用复合过去时 tu as fait（做了），回答也要用过去时：je suis allé。je vais aller 是“将要去”。" },
  { id: "fr-r8-15", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "Tu as des frères et sœurs ?", tr: "意思：你有兄弟姐妹吗？", opts: ["Oui, j'ai un frère.", "Oui, ce sont mes amis.", "Non, je n'ai pas faim.", "Oui, j'ai vingt ans."], a: 0,
    exp: "frères et sœurs = 兄弟姐妹。" },
  { id: "fr-r8-16", ch: 39, cat: "听力 · 选回答", q: "听问句，选出最合适的回答。", audio: "On se voit quand ?", tr: "意思：我们什么时候见面？", opts: ["Demain après-midi, ça te va ?", "Au café de la gare.", "Avec Paul et Marie.", "Oui, je te vois."], a: 0,
    exp: "quand = 什么时候，回答时间。au café 回答的是“在哪儿”。" },
  { id: "fr-r8-17", ch: 37, cat: "听力 · 数字和时间", q: "听录音：商店几点关门？", audio: "Le magasin ouvre à neuf heures et ferme à dix-neuf heures.", tr: "意思：商店九点开门，十九点关门。", opts: ["晚上 7 点", "晚上 9 点", "早上 9 点", "晚上 10 点"], a: 0,
    exp: "ouvrir = 开门，fermer = 关门。dix-neuf heures = 19 点 = 晚上 7 点。" },
  { id: "fr-r8-18", ch: 37, cat: "听力 · 数字和时间", q: "听录音：要付多少钱？", audio: "Ça fait douze euros cinquante, s'il vous plaît.", tr: "意思：一共十二欧五十。", opts: ["12.50 欧元", "2.50 欧元", "12.15 欧元", "20.50 欧元"], a: 0,
    exp: "douze = 12，cinquante = 50。说价格时 euros 后面的数字是分：douze euros cinquante = 12.50 欧元。" },
  { id: "fr-r8-19", ch: 37, cat: "听力 · 数字和时间", q: "听录音：电话号码是多少？", audio: "Mon numéro, c'est le zéro six, quarante-deux, dix-sept, quatre-vingt-trois, cinquante.", tr: "意思：我的号码是 06 42 17 83 50。", opts: ["06 42 17 83 50", "06 42 70 83 50", "06 24 17 83 50", "06 42 17 63 50"], a: 0,
    exp: "法国电话号码两位两位地读。quatre-vingt-trois = 4×20 + 3 = 83；soixante-trois 才是 63。dix-sept = 17。" },
  { id: "fr-r8-20", ch: 37, cat: "听力 · 数字和时间", q: "听录音：法语课什么时候开始？", audio: "Le cours de français commence le mardi à quatorze heures.", tr: "意思：法语课每周二下午两点开始。", opts: ["每周二下午 2 点", "每周二下午 4 点", "每周四下午 2 点", "每周一下午 2 点"], a: 0,
    exp: "mardi = 星期二（jeudi 是星期四，lundi 是星期一）。quatorze heures = 14 点 = 下午 2 点。" },
  { id: "fr-r8-21", ch: 37, cat: "听力 · 数字和时间", q: "听录音：今天是几号？", audio: "Nous sommes le vingt-cinq décembre.", tr: "意思：今天是十二月二十五日。", opts: ["12 月 25 日", "12 月 5 日", "10 月 25 日", "11 月 25 日"], a: 0,
    exp: "vingt-cinq = 25。décembre = 十二月（octobre 是十月，novembre 是十一月）。" },
  { id: "fr-r8-22", ch: 6, cat: "听力 · 数字和时间", q: "听录音：他什么时候去看医生？", audio: "J'ai rendez-vous chez le médecin dans une demi-heure.", tr: "意思：我半小时后要去看医生。", opts: ["半小时后", "半小时前", "一个半小时后", "一小时后"], a: 0,
    exp: "dans + 时间 = ……之后（将来）；il y a + 时间 = ……之前。une demi-heure = 半小时。" },

  { id: "fr-r9-1", ch: 40, cat: "长文 · 语音留言", title: "语音留言", q: "第 1 问：野餐为什么取消了？", audio: "Salut Thomas, c'est Julie. Je t'appelle pour samedi. Finalement, on ne va pas faire le pique-nique au parc, parce que la météo annonce de la pluie toute la journée. Je propose plutôt de se retrouver chez moi vers midi. Chacun apporte quelque chose : moi, je fais une salade et un gâteau au chocolat. Est-ce que tu pourrais apporter des boissons ? Paul viendra avec sa nouvelle copine, Inès. Tu ne la connais pas encore, elle est très sympa. Ah, et n'oublie pas : mon code d'entrée a changé. Rappelle-moi ce soir après dix-neuf heures, parce qu'avant, je suis au travail. Bisous !", quote: "on ne va pas faire le pique-nique au parc, parce que la météo annonce de la pluie toute la journée.", tr: "意思：我们不去公园野餐了，因为天气预报说一整天都会下雨。", opts: ["天气预报说一整天都会下雨", "公园周六不开门", "保罗周六来不了", "朱莉周六要上班"], a: 0,
    exp: "parce que 后面就是原因：la météo annonce de la pluie（天气预报说有雨）。finalement 在这里是“最后决定、结果”。" },
  { id: "fr-r9-2", ch: 40, cat: "长文 · 语音留言", title: "语音留言", q: "第 2 问：朱莉请托马带什么？", audio: "Salut Thomas, c'est Julie. Je t'appelle pour samedi. Finalement, on ne va pas faire le pique-nique au parc, parce que la météo annonce de la pluie toute la journée. Je propose plutôt de se retrouver chez moi vers midi. Chacun apporte quelque chose : moi, je fais une salade et un gâteau au chocolat. Est-ce que tu pourrais apporter des boissons ? Paul viendra avec sa nouvelle copine, Inès. Tu ne la connais pas encore, elle est très sympa. Ah, et n'oublie pas : mon code d'entrée a changé. Rappelle-moi ce soir après dix-neuf heures, parce qu'avant, je suis au travail. Bisous !", quote: "Est-ce que tu pourrais apporter des boissons ?", tr: "意思：你能带些饮料来吗？", opts: ["饮料", "沙拉", "巧克力蛋糕", "什么都不用带"], a: 0,
    exp: "沙拉和巧克力蛋糕是朱莉自己做的（moi, je fais…）。请托马带的是 des boissons（饮料）。" },
