    exp: "日期用基数词，onze、huit 前面不省音：le onze novembre、le huit juin。（书中第 37 章 · p.618）" },
  { id: "fr-r20-32", ch: 37, cat: "日期", q: "1 月 1 日怎么说？", opts: ["le premier janvier", "le un janvier", "l'un janvier", "le unième janvier"], a: 0,
    exp: "每月的第一天用 premier，其余日子用基数词：le premier janvier、le deux janvier。（书中第 37 章 · p.618）" },
  { id: "fr-r20-33", ch: 37, cat: "星期", q: "À Paris, les musées sont fermés ___ mardi.（每逢周二）", opts: ["le", "（不填）", "au", "en"], a: 0,
    exp: "表示每逢某天、习惯性的事，星期前加定冠词 le；只指某一个周二时不加：Je ferai les courses mardi。（书中第 37 章 · p.619）" },
  { id: "fr-r20-34", ch: 37, cat: "an / année", q: "J'ai vécu à Londres pendant cinq ___.", opts: ["ans", "années", "an", "année"], a: 0,
    exp: "基数词后面一般用 an：cinq ans、il y a trois ans。有修饰语时用 année：cinq longues années。（书中第 37 章 · p.623）" },
  { id: "fr-r20-35", ch: 37, cat: "an / année", q: "C'est la troisième ___ que je suis en Angleterre.", opts: ["année", "an", "ans", "années"], a: 0,
    exp: "序数词以及 chaque、plusieurs、cette 后面用 année：la troisième année、plusieurs années。（书中第 37 章 · p.623）" },
  { id: "fr-r20-36", ch: 37, cat: "jour / journée", q: "J'ai dormi toute la ___ !", opts: ["journée", "jour", "jours", "journées"], a: 0,
    exp: "“一整天”用 toute la journée；journée、matinée、soirée 强调一段时间，jour、matin、soir 指时间点。（书中第 37 章 · p.624）" },
  { id: "fr-r20-37", ch: 37, cat: "周", q: "“两周后我就走。” Je partirai dans ___ jours.", opts: ["quinze", "quatorze", "seize", "douze"], a: 0,
    exp: "法语习惯说 dans huit jours（一周后）、dans quinze jours（两周后）。（书中第 37 章 · p.620）" },
  { id: "fr-r20-38", ch: 37, cat: "年龄", q: "J'ai seize ans, et Catherine ___ dix-huit.", opts: ["en a", "a", "y a", "les a"], a: 0,
    exp: "数词单独作宾语时要加 en：Catherine en a dix-huit；而且表示年龄时 ans 不能省略（这里由 en 代替）。（书中第 37 章 · p.627）" },
  { id: "fr-r20-39", ch: 37, cat: "价格", q: "Les poires sont à trois euros ___ kilo.", opts: ["le", "par le", "au", "un"], a: 0,
    exp: "按单位计价用定冠词：six francs le litre、quinze francs le kilo；按个计价用 pièce：dix francs pièce。（书中第 37 章 · p.628）" },
  { id: "fr-r20-40", ch: 37, cat: "频率", q: "Je vais à la piscine ___ deux jours.（每隔一天）", opts: ["tous les", "chaque", "toutes les", "par"], a: 0,
    exp: "tous les / toutes les + 数字 + 名词表示“每隔……”：tous les deux jours、toutes les trois semaines。（书中第 37 章 · p.629）" },
  { id: "fr-r20-41", ch: 37, cat: "速度", q: "Il roulait ___ 160 km à l'heure.", opts: ["à", "de", "en", "par"], a: 0,
    exp: "aller、rouler 后面用 à 表示速度：rouler à 160 km à l'heure；faire 后面用 du：faire du 160。（书中第 37 章 · p.629）" },
  { id: "fr-r20-42", ch: 37, cat: "nombre / numéro", q: "On ne connaît pas encore le ___ de blessés.", opts: ["nombre", "numéro", "nom", "nombril"], a: 0,
    exp: "nombre 表示数量；numéro 表示编号（电话号码、门牌号、页码）。（书中第 37 章 · p.606）" },
  { id: "fr-r20-43", ch: 37, cat: "nombre / numéro", q: "Mon ___ de téléphone a changé.", opts: ["numéro", "nombre", "compte", "chiffre"], a: 0,
    exp: "表示编号、名称时用 numéro：numéro de téléphone、le numéro un mondial。（书中第 37 章 · p.606）" },
  { id: "fr-r20-44", ch: 37, cat: "发音", q: "neuf heures 里 neuf 的 f 读作什么？", opts: ["[v]", "[f]", "不发音", "[s]"], a: 0,
    exp: "neuf 在 ans、heures 前读 [v]：dix-neuf ans、neuf heures；其他情况读 [f]：neuf enfants。（书中第 37 章 · p.607）" },
  { id: "fr-r20-45", ch: 37, cat: "听力 · 数字", q: "听录音，选出你听到的数字。", opts: ["97", "77", "87", "67"], a: 0, audio: "quatre-vingt-dix-sept",
    exp: "quatre-vingt-dix-sept = 4 × 20 + 17 = 97。（书中第 37 章 · p.604）" },
  { id: "fr-r20-46", ch: 37, cat: "听力 · 数字", q: "听录音，选出你听到的数字。", opts: ["76", "66", "96", "16"], a: 0, audio: "soixante-seize",
    exp: "soixante-seize = 60 + 16 = 76。（书中第 37 章 · p.604）" },
  { id: "fr-r20-47", ch: 37, cat: "听力 · 年份", q: "听录音，他是哪一年出生的？", opts: ["1984", "1974", "1994", "1964"], a: 0, audio: "Il est né en mille neuf cent quatre-vingt-quatre.",
    exp: "mille neuf cent quatre-vingt-quatre = 1984。年份也常说 dix-neuf cent quatre-vingt-quatre。（书中第 37 章 · p.621）" },
  { id: "fr-r20-48", ch: 37, cat: "听力 · 时间", q: "听录音，约在几点？", opts: ["19:45", "9:45", "19:05", "18:45"], a: 0, audio: "Rendez-vous à dix-neuf heures quarante-cinq.",
    exp: "时刻表和正式场合用 24 小时制：dix-neuf heures quarante-cinq = 19:45。（书中第 37 章 · p.626）" },
  { id: "fr-r20-49", ch: 37, cat: "听力 · 价格", q: "听录音，一共多少钱？", opts: ["35,70 €", "35,17 €", "75,30 €", "36,70 €"], a: 0, audio: "Ça fait trente-cinq euros soixante-dix.",
    exp: "trente-cinq euros soixante-dix = 35,70 €。（书中第 37 章 · p.628）" },
  { id: "fr-r20-50", ch: 37, cat: "听力 · 年龄", q: "听录音，他上个月满几岁？", opts: ["19 岁", "9 岁", "17 岁", "90 岁"], a: 0, audio: "Il a eu dix-neuf ans le mois dernier.",
    exp: "dix-neuf ans，neuf 在 ans 前读 [v]。（书中第 37 章 · p.607）" },
  { id: "fr-r21-1", ch: 26, cat: "动词搭配", q: "Je pense souvent ___ mes vacances en Bretagne.", opts: ["à", "de", "en", "sur"], a: 0,
    hint: "penser 后面的介词随意思变：“想着、惦记”和“对……有什么看法”用的不是同一个。",
    exp: "penser à qch / qn = 想着、惦记：Je pense à toi. penser de = 对……有什么看法，多用在疑问句里：Qu'est-ce que tu penses de ce film ?" },
  { id: "fr-r21-2", ch: 26, cat: "动词搭配", q: "Qu'est-ce que tu penses ___ ce film ?", opts: ["de", "à", "sur", "pour"], a: 0,
    hint: "这里问的是“看法”，不是“想念”。",
    exp: "问看法用 penser de：Que pensez-vous de mon idée ? 回答时常用 penser que：Je pense que c'est intéressant." },
  { id: "fr-r21-3", ch: 26, cat: "动词搭配", q: "Il se méfie ___ tout le monde.", opts: ["de", "à", "contre", "envers"], a: 0,
    hint: "se méfier 和 avoir peur 后面接同一个介词。",
    exp: "se méfier de qn / qch = 提防、不信任。同样接 de 的还有 avoir peur de、se moquer de、se souvenir de。" },
  { id: "fr-r21-4", ch: 26, cat: "动词搭配", q: "Le prix du billet dépend ___ la saison.", opts: ["de", "à", "sur", "en"], a: 0,
    hint: "别照着英语 depend on 直译。",
    exp: "dépendre de qch = 取决于：Ça dépend du temps. 英语的 on 在这里对应 de，不是 sur。" },
  { id: "fr-r21-5", ch: 26, cat: "动词搭配", q: "Elle croit ___ Dieu.", opts: ["en", "à", "dans", "de"], a: 0,
    hint: "信仰某位神、信任某个人，和“相信某事存在”用的介词不一样。",
    exp: "croire en Dieu、croire en qn（信任某人）用 en。croire à qch 表示相信某事存在或为真：croire aux fantômes。croire qn 不加介词，表示相信某人说的话。" },
  { id: "fr-r21-6", ch: 26, cat: "动词搭配", q: "Les enfants croient encore ___ Père Noël.", opts: ["au", "en", "dans le", "du"], a: 0,
    hint: "这里是“相信某个东西存在”。",
    exp: "croire à qch = 相信某事存在：croire au Père Noël、croire aux miracles。à + le 缩合成 au。对比 croire en Dieu。" },
  { id: "fr-r21-7", ch: 26, cat: "空间关系", q: "Au cinéma, il était assis ___ ses deux sœurs.", opts: ["entre", "parmi", "chez", "avec"], a: 0,
    hint: "注意人数：只有两个人。",
    exp: "entre 用于两者之间（也可用于界限分明的几者之间）；parmi 表示“在一群人或一堆东西当中”，后面是三个以上。" },
  { id: "fr-r21-8", ch: 26, cat: "空间关系", q: "___ tous ses amis, c'est Paul qu'il préfère.", opts: ["Parmi", "Entre", "Dans", "Chez"], a: 0,
    hint: "从一群人里挑出一个。",
    exp: "parmi + 复数名词（三个以上）= 在……之中：parmi les invités、parmi nous。" },
  { id: "fr-r21-9", ch: 26, cat: "让步与原因", q: "Il est sorti se promener ___ la pluie : rien ne l'arrête !", opts: ["malgré", "à cause de", "grâce à", "faute de"], a: 0,
    hint: "下着雨他还是出去了，这是让步关系，不是因果。",
    exp: "malgré + 名词 = 尽管：malgré le froid、malgré tout。后面接从句要用 bien que + 虚拟式。" },
  { id: "fr-r21-10", ch: 26, cat: "让步与原因", q: "___ ton aide, j'ai réussi l'examen. Merci !", opts: ["Grâce à", "À cause de", "Malgré", "Faute de"], a: 0,
    hint: "结果是好事。",
    exp: "grâce à 引出带来好结果的原因；à cause de 引出中性或不好的原因：Je suis en retard à cause des embouteillages." },
  { id: "fr-r21-11", ch: 26, cat: "让步与原因", q: "___ argent, il a dû renoncer à son voyage.", opts: ["Faute d'", "Grâce à l'", "Au lieu d'", "Malgré l'"], a: 0,
    hint: "因为“没有”某样东西才放弃了。",
    exp: "faute de + 不带冠词的名词 = 因为缺少：faute de temps、faute de place。也可接不定式：faute d'avoir compris。" },
  { id: "fr-r21-12", ch: 26, cat: "复合介词", q: "___ travailler, il regarde la télé toute la journée.", opts: ["Au lieu de", "Afin de", "À force de", "Faute de"], a: 0,
    hint: "他没做该做的事，而是去做了另一件。",
    exp: "au lieu de + 不定式 / 名词 = 不……而……、代替：Prends du thé au lieu du café. afin de 表目的，à force de 表反复带来的结果。" },
  { id: "fr-r21-13", ch: 26, cat: "让步与原因", q: "___ répéter, il a fini par comprendre.", opts: ["À force de", "Au lieu de", "Faute de", "Afin de"], a: 0,
    hint: "是一遍又一遍地重复，才换来了“终于懂了”。",
    exp: "à force de + 不定式 / 不带冠词的名词 = 由于反复、大量地……：à force de patience、à force de travailler。" },
  { id: "fr-r21-14", ch: 26, cat: "时间", q: "J'habite à Lyon ___ trois ans.", opts: ["depuis", "pendant", "il y a", "pour"], a: 0,
    hint: "现在还住在里昂：动作从过去开始，一直延续到现在。",
    exp: "depuis + 时段，主句用现在时，表示持续到现在：J'apprends le français depuis deux ans. pendant 用于有起止的一段时间，il y a 表示“……以前”。" },
  { id: "fr-r21-15", ch: 26, cat: "时间", q: "Je suis arrivé à Lyon ___ trois ans.", opts: ["il y a", "depuis", "pendant", "dans"], a: 0,
    hint: "arriver 是一下子完成的动作，问的是它发生在过去哪个时间点。",
    exp: "il y a + 时段 = ……以前，标出过去的时间点：Il est parti il y a dix minutes. dans + 时段则指将来：dans dix minutes。" },
  { id: "fr-r21-16", ch: 26, cat: "时间", q: "Il a plu ___ tout le week-end.", opts: ["pendant", "depuis", "pour", "dans"], a: 0,
    hint: "这段时间已经结束了，周末下了一整个周末的雨。",
    exp: "pendant + 时段 = 在……期间，常配复合过去时说已经结束的一段时间。pour + 时段多用于计划：Je pars pour une semaine." },
  { id: "fr-r21-17", ch: 26, cat: "时间", q: "Les soldes commencent ___ demain.", opts: ["à partir de", "depuis", "dès que", "pendant"], a: 0,
    hint: "起点是将来的某一天。",
    exp: "à partir de = 从……起，起点可以在现在或将来：à partir de lundi。depuis 的起点在过去；dès que 是连词，后面接从句。" },
  { id: "fr-r21-18", ch: 26, cat: "复合介词", q: "___ la météo, il va neiger demain.", opts: ["D'après", "Malgré", "Pour", "Par"], a: 0,
    hint: "空格后面的词是这条消息的“来源”。",
    exp: "d'après / selon = 根据……的说法：d'après les journaux、selon moi。" },
  { id: "fr-r21-19", ch: 26, cat: "介词本义", q: "Il a échangé sa vieille voiture ___ une moto.", opts: ["contre", "avec", "sur", "par"], a: 0,
    hint: "用 A 换 B：这个介词的本义是“对着、相对”。",
    exp: "échanger qch contre qch = 用……换……。contre 还表示反对（voter contre）、靠着（contre le mur）、针对（un médicament contre la toux）。" },
  { id: "fr-r21-20", ch: 26, cat: "介词本义", q: "Tout le monde est venu, ___ Marc, qui était malade.", opts: ["sauf", "malgré", "avec", "parmi"], a: 0,
    hint: "Marc 生病了，所以没来。",
    exp: "sauf = 除……以外（不包括在内）：Le magasin est ouvert tous les jours sauf le dimanche. 同义的有 excepté、à part。" },
  { id: "fr-r21-21", ch: 26, cat: "动词搭配", q: "Elle s'est fâchée ___ son frère qui avait cassé son téléphone.", opts: ["contre", "à", "de", "sur"], a: 0,
    hint: "她是冲着弟弟发火，这个介词有“针对、反对”的意思。",
    exp: "se fâcher contre qn = 冲某人发火；se fâcher avec qn = 和某人闹翻、不再来往。" },
  { id: "fr-r21-22", ch: 26, cat: "动词搭配", q: "« Paris me manque. » 是什么意思？", opts: ["我想念巴黎", "巴黎想念我", "我错过了巴黎", "巴黎缺少我"], a: 0,
    hint: "manquer à qn 的语序和中文、英语都反过来：被想念的东西做主语。",
    exp: "A manque à B = B 想念 A：Tu me manques = 我想你。manquer qch（不加介词）= 错过：J'ai manqué le train." },
  { id: "fr-r21-23", ch: 26, cat: "动词搭配", q: "Il manque ___ patience avec les enfants.", opts: ["de", "à", "en", "pour"], a: 0,
    hint: "这里是“缺乏”某种品质。",
    exp: "manquer de qch = 缺乏：manquer de temps、manquer d'expérience。注意 de 后面不加冠词。" },
  { id: "fr-r21-24", ch: 26, cat: "动词搭配", q: "Je tiens beaucoup ___ cette montre : c'est un cadeau de ma grand-mère.", opts: ["à", "de", "pour", "sur"], a: 0,
    hint: "外婆送的，所以很珍惜。",
    exp: "tenir à qch / qn = 珍惜、看重；tenir à + 不定式 = 坚持要：Je tiens à vous remercier. tenir de qn = 像（长辈）。" },
  { id: "fr-r21-25", ch: 26, cat: "动词搭配", q: "« Elle tient de sa mère. » 是什么意思？", opts: ["她像她妈妈", "她握着妈妈的手", "她很珍惜妈妈", "她坚持要妈妈来"], a: 0,
    hint: "tenir de qn 多用来说孩子和长辈之间的关系。",
    exp: "tenir de qn = 像某位长辈（长相或性格）：Il tient de son père. “珍惜”是 tenir à。" },
  { id: "fr-r21-26", ch: 26, cat: "动词搭配", q: "Merci ___ votre aide !", opts: ["pour", "à", "par", "en"], a: 0,
    hint: "空格引出感谢的理由。",
    exp: "merci pour / de + 名词都可以：merci pour ton cadeau、merci de votre attention。后面接不定式时只能用 de：Merci d'être venu." },
  { id: "fr-r21-27", ch: 26, cat: "动词搭配", q: "Il est tombé amoureux ___ sa voisine.", opts: ["de", "avec", "à", "pour"], a: 0,
    hint: "英语说 fall in love with，法语不用“with”。",
    exp: "être / tomber amoureux de qn。同样接 de 的还有 être fier de、être jaloux de。" },
  { id: "fr-r21-28", ch: 26, cat: "空间关系", q: "La boulangerie est ___ la banque, juste de l'autre côté de la rue.", opts: ["en face de", "à côté de", "au bout de", "autour de"], a: 0,
    hint: "两家店隔着一条街。",
    exp: "en face de = 在……对面；à côté de = 在……旁边（同一侧）；au bout de = 在……尽头；autour de = 在……周围。" },
  { id: "fr-r21-29", ch: 26, cat: "空间关系", q: "Va tout droit, la gare est ___ la rue.", opts: ["au bout de", "autour de", "en dehors de", "au-dessus de"], a: 0,
    hint: "一直往前走，走到这条街的最后。",
    exp: "au bout de = 在……尽头；用于时间时表示“……之后”：au bout de dix minutes。" },
  { id: "fr-r21-30", ch: 26, cat: "时间", q: "___ son mariage, il a invité tous ses collègues.", opts: ["Lors de", "Depuis", "Pendant que", "Dès que"], a: 0,
    hint: "先看空格后面：是名词，不是从句。",
    exp: "lors de + 名词 = 在……之际，略正式：lors de sa visite。pendant que、dès que 是连词，后面要接从句。" },
  { id: "fr-r21-31", ch: 26, cat: "时间", q: "Je t'appelle ___ mon arrivée.", opts: ["dès", "depuis", "lors", "pendant que"], a: 0,
    hint: "一到就打，后面又是名词。",
    exp: "dès + 名词 = 一……就、从……起：dès mon arrivée、dès demain。接从句时用 dès que：dès que j'arrive。" },
  { id: "fr-r21-32", ch: 26, cat: "复合介词", q: "Mes amis partent à la mer. ___ moi, je préfère la montagne.", opts: ["Quant à", "Selon", "Grâce à", "Malgré"], a: 0,
    hint: "把话题从“朋友们”转到“我”身上。",
    exp: "quant à = 至于：Quant à moi, … 与 quant à 一起用的是重读代词 moi、toi、lui……" },
  { id: "fr-r21-33", ch: 26, cat: "复合介词", q: "Je me suis renseigné ___ l'office du tourisme.", opts: ["auprès de", "près de", "chez", "à côté de"], a: 0,
    hint: "不是说位置，而是向某个机构打听情况。",
    exp: "se renseigner / se plaindre / faire une demande auprès de qn = 向某人、某机构打听、投诉、申请。près de 只表示空间上靠近。" },
  { id: "fr-r21-34", ch: 26, cat: "介词本义", q: "Il a voté ___ la réforme : il la trouve injuste.", opts: ["contre", "pour", "sur", "malgré"], a: 0,
    hint: "冒号后面说了他的看法。",
    exp: "voter pour = 投赞成票，voter contre = 投反对票。他觉得改革不公平，所以投反对票。" },
  { id: "fr-r21-35", ch: 26, cat: "动词搭配", q: "Elle s'intéresse beaucoup ___ l'histoire de l'art.", opts: ["à", "pour", "de", "en"], a: 0,
    hint: "s'intéresser 后面的介词和 penser（想着）一样。",
    exp: "s'intéresser à qch。名词说法用 pour：avoir de l'intérêt pour qch、se passionner pour qch。" },
  { id: "fr-r21-36", ch: 26, cat: "形容词 + 介词", q: "Ce texte est facile ___ comprendre.", opts: ["à", "de", "pour", "en"], a: 0,
    hint: "主语 ce texte 本身就是要“理解”的对象。",
    exp: "名词主语 + être + 形容词 + à + 不定式：Ce texte est facile à comprendre. 对比无人称句：Il est facile de comprendre ce texte." },
  { id: "fr-r21-37", ch: 26, cat: "形容词 + 介词", q: "Il est facile ___ comprendre ce texte.", opts: ["de", "à", "pour", "en"], a: 0,
    hint: "这里 il 不指任何东西，真正的主语是后面的“理解这篇文章”。",
    exp: "无人称句 il est + 形容词 + de + 不定式（后面带宾语）。口语里也说 C'est facile de…。如果把宾语提前做主语，就改用 à：Ce texte est facile à comprendre." },
  { id: "fr-r21-38", ch: 26, cat: "形容词 + 介词", q: "Je suis vraiment content ___ te revoir !", opts: ["de", "à", "pour", "en"], a: 0,
    hint: "表情绪的形容词（content、heureux、triste）后面接不定式。",
    exp: "être content / heureux / triste / désolé de + 不定式：Je suis désolé d'être en retard." },
  { id: "fr-r22-1", ch: 26, cat: "时间 · 填空", q: "J'apprends le français ___ trois ans.", opts: ["depuis", "il y a", "pendant", "pour"], a: 0,
    hint: "现在还在学吗？看看动词用的是什么时态。",
    exp: "动作从过去开始、一直持续到现在，用 depuis + 现在时：J'apprends le français depuis trois ans. 英语这里用现在完成进行时（I have been learning），法语用现在时。" },
  { id: "fr-r22-2", ch: 26, cat: "时间 · 填空", q: "J'ai commencé le français ___ trois ans.", opts: ["il y a", "depuis", "pendant", "dans"], a: 0,
    hint: "commencer 是一下子完成的动作，这里问的是它发生在什么时候。",
    exp: "il y a + 时长 = ……以前，标出过去的一个时间点：J'ai commencé il y a trois ans. dans trois ans 是“三年后”。" },
  { id: "fr-r22-3", ch: 26, cat: "时间 · 填空", q: "J'ai étudié le français ___ trois ans, puis j'ai arrêté.", opts: ["pendant", "depuis", "il y a", "dans"], a: 0,
    hint: "后半句说已经停了，这是一段已经结束的时间。",
    exp: "pendant + 时长，配复合过去时，表示一段有始有终、已经结束的时间。对比：J'étudie le français depuis trois ans（现在还在学）。" },
  { id: "fr-r22-4", ch: 26, cat: "时间 · 填空", q: "Elle habite à Lyon ___ 2019.", opts: ["depuis", "il y a", "pendant", "en"], a: 0,
    hint: "后面是一个时间点（年份），动作一直持续到现在。",
    exp: "depuis 后面既可以接时长（depuis trois ans），也可以接起点（depuis 2019、depuis lundi）。en 2019 表示事情发生在 2019 年，不能和表示持续到现在的现在时连用。" },
  { id: "fr-r22-5", ch: 26, cat: "时间 · 填空", q: "Paul a téléphoné ___ dix minutes, il voulait te parler.", opts: ["il y a", "depuis", "pendant", "dans"], a: 0,
    hint: "打电话这件事已经发生了，问的是“多久以前”。",
    exp: "il y a dix minutes = 十分钟前。depuis 要求动作或状态持续到现在，téléphoner 在这里是一次已完成的动作，不能用 depuis。" },
  { id: "fr-r22-6", ch: 26, cat: "时间 · 填空", q: "Je ne l'ai pas vu ___ des mois : je me demande comment il va.", opts: ["depuis", "pendant", "il y a", "en"], a: 0,
    hint: "后半句说明“没见到他”这个状态到现在还在继续。",
    exp: "否定句中，“没做某事”本身是一种持续的状态，可以用 depuis + 复合过去时：Je ne l'ai pas vu depuis des mois. 若用 pendant，说的是过去一段已结束的时间里没见，和后半句的“现在不知道他怎么样”不搭。" },
  { id: "fr-r22-7", ch: 26, cat: "时间 · 结构", q: "___ deux ans que je travaille dans cette entreprise.", opts: ["Il y a", "Depuis", "Pendant", "Pour"], a: 0,
    hint: "注意句子后面有 que + 现在时。",
    exp: "il y a + 时长 + que + 现在时 = depuis + 时长，强调持续的时间：Il y a deux ans que je travaille ici = Je travaille ici depuis deux ans。同义的还有 ça fait … que、voilà … que。" },
  { id: "fr-r22-8", ch: 26, cat: "时间 · 同义", q: "« Ça fait une heure que j'attends. » 和哪一句意思相同？", opts: ["J'attends depuis une heure.", "J'ai attendu il y a une heure.", "J'attends pendant une heure.", "J'attendrai dans une heure."], a: 0,
    hint: "ça fait + 时长 + que + 现在时，表示一直持续到现在。",
    exp: "ça fait … que = il y a … que = depuis，都表示“已经……了（还在继续）”。口语里 ça fait … que 最常用。" },
  { id: "fr-r22-9", ch: 26, cat: "时间 · 填空", q: "Je pars en Italie ___ deux semaines, je reviens le 15.", opts: ["pour", "depuis", "il y a", "en"], a: 0,
    hint: "说的是出发时计划要待多久。",
    exp: "partir、aller、venir 后面表示计划的时长用 pour：Je pars pour deux semaines。实际经过的时长才用 pendant：J'y suis resté pendant deux semaines。" },
  { id: "fr-r22-10", ch: 26, cat: "时间 · 填空", q: "___ les vacances, j'ai lu cinq romans.", opts: ["Pendant", "Depuis", "Il y a", "Pour"], a: 0,
    hint: "“在……期间”，后面是一个名词表示的时间段。",
    exp: "pendant + 名词 = 在……期间：pendant les vacances、pendant le repas。" },
  { id: "fr-r22-11", ch: 26, cat: "时间 · 时态", q: "Il pleuvait ___ trois jours quand nous sommes arrivés.", opts: ["depuis", "il y a", "pendant", "dans"], a: 0,
    hint: "到达时，雨已经下了三天并且还在下。这是“过去的过去一直持续到过去某时刻”。",
    exp: "depuis + 未完成过去时，表示一直持续到过去某个时刻：Il pleuvait depuis trois jours quand… 就像 depuis + 现在时表示持续到现在一样，时态整体往前移一格。" },
  { id: "fr-r22-12", ch: 26, cat: "时间 · 填空", q: "Nous nous connaissons ___ l'enfance.", opts: ["depuis", "pendant", "il y a", "pour"], a: 0,
    hint: "后面是一个起点，关系持续到现在。",
    exp: "depuis + 起点：depuis l'enfance、depuis notre rencontre。" },
  { id: "fr-r22-13", ch: 26, cat: "时间 · 填空", q: "Le train arrive ___ cinq minutes, préparez vos bagages.", opts: ["dans", "il y a", "depuis", "en"], a: 0,
    hint: "火车还没到，说的是从现在算起多久以后。",
    exp: "dans + 时长 = ……以后（从现在算起），和 il y a（……以前）正好相反。现在时也可以表示马上要发生的事。" },
  { id: "fr-r22-14", ch: 26, cat: "时间 · 填空", q: "Ce coureur a fait le marathon ___ moins de trois heures.", opts: ["en", "pendant", "depuis", "dans"], a: 0,
    hint: "说的是完成这件事花了多少时间。",
    exp: "en + 时长 = 用了多少时间完成：en moins de trois heures、en deux semaines。pendant 只说持续了多久，不强调完成。" },
  { id: "fr-r22-15", ch: 26, cat: "时间 · 连词", q: "___ qu'il a déménagé, il est beaucoup plus heureux.", opts: ["Depuis", "Pendant", "Il y a", "Dès"], a: 0,
    hint: "后面接的是一个从句，作为“从……以来”的起点。",
    exp: "depuis que + 从句 = 自从……以来：Depuis qu'il a déménagé, il est plus heureux。dès que 是“一……就”，后面结构不同。" },
  { id: "fr-r22-16", ch: 26, cat: "时间 · 连词", q: "___ que tu dormais, j'ai rangé toute la cuisine.", opts: ["Pendant", "Depuis", "Il y a", "Pour"], a: 0,
    hint: "两件事是同时发生的。",
    exp: "pendant que + 从句 = 在……的时候（同时）：Pendant que tu dormais, j'ai rangé la cuisine。" },
  { id: "fr-r22-17", ch: 26, cat: "时间 · 中译法", q: "“我三年前来到法国。”", opts: ["Je suis arrivé en France il y a trois ans.", "Je suis arrivé en France pendant trois ans.", "J'arrive en France il y a trois ans.", "Je suis arrivé en France dans trois ans."], a: 0,
    hint: "“三年前”是一个过去的时间点，动词用什么时态？",
    exp: "il y a + 时长 配过去时，标出事情发生的时间。dans trois ans 是“三年后”，和过去时矛盾。" },
  { id: "fr-r22-18", ch: 26, cat: "时间 · 中译法", q: "“我在法国住了三年了（现在还住在这里）。”", opts: ["J'habite en France depuis trois ans.", "J'ai habité en France pendant trois ans.", "J'habite en France il y a trois ans.", "J'ai habité en France il y a trois ans."], a: 0,
    hint: "现在还住着：法语用现在时，配哪个词？",
    exp: "持续到现在用 depuis + 现在时。J'ai habité en France pendant trois ans 是“曾经在法国住过三年”，现在已经不住了。" },
  { id: "fr-r22-19", ch: 26, cat: "时间 · 中译法", q: "“我在法国住过三年（现在已经不住了）。”", opts: ["J'ai habité en France pendant trois ans.", "J'habite en France depuis trois ans.", "J'habitais en France depuis trois ans.", "J'habite en France pendant trois ans."], a: 0,
    hint: "这段时间已经结束了。",
    exp: "已经结束的一段时间：pendant + 复合过去时。J'habitais … depuis trois ans 需要一个后续的过去时刻（quand…），单独用不完整。" },
  { id: "fr-r22-20", ch: 26, cat: "时间 · 问答", q: "« Depuis combien de temps es-tu malade ? » 最合适的回答是？", opts: ["Depuis trois jours.", "Il y a trois jours.", "Pendant trois jours.", "Dans trois jours."], a: 0,
    hint: "问的是“病了多久了”，病还没好。",
    exp: "depuis combien de temps 问持续到现在多久，用 depuis 回答。Il y a trois jours 回答的是“什么时候开始病的”。" },
  { id: "fr-r22-21", ch: 26, cat: "时间 · 问答", q: "« Quand est-ce que tu es tombé malade ? » 最合适的回答是？", opts: ["Il y a trois jours.", "Depuis trois jours.", "Pendant trois jours.", "Pour trois jours."], a: 0,
    hint: "tomber malade 是一下子发生的事，问的是发生的时间点。",
    exp: "问时间点（quand），用 il y a 回答：三天前。对比上一题：Depuis combien de temps es-tu malade ? — Depuis trois jours." },
  { id: "fr-r22-22", ch: 26, cat: "时间 · 时态", q: "J'___ ce film il y a deux semaines.", opts: ["ai vu", "vois", "vais voir", "verrai"], a: 0,
    hint: "il y a + 时长 指的是过去还是将来？",
    exp: "il y a deux semaines 是两周前，动词用过去时：J'ai vu ce film il y a deux semaines。表示将来要用 dans deux semaines。" },
  { id: "fr-r22-23", ch: 26, cat: "时间 · 时态", q: "Je ___ ici depuis cinq ans.", opts: ["travaille", "ai travaillé", "travaillerai", "travaillai"], a: 0,
    hint: "动作还在继续。英语说 I have been working，法语用什么时态？",
    exp: "depuis + 现在时表示持续到现在的动作，这是中国学生和英语母语者都常犯的错：不要用复合过去时。" },
  { id: "fr-r22-24", ch: 26, cat: "时间 · 问答", q: "« ___ combien de temps as-tu vécu à Paris ? — Deux ans, de 2018 à 2020. »", opts: ["Pendant", "Depuis", "Il y a", "Dans"], a: 0,
    hint: "回答给出了起止年份，这段时间已经结束了。",
    exp: "问一段已经结束的时间有多长：pendant combien de temps + 复合过去时。若还住在巴黎，就问 Depuis combien de temps vis-tu à Paris ?" },
  { id: "fr-r23-1", ch: 27, cat: "词尾 -isme", q: "以 -isme 结尾的名词（le tourisme、le réalisme、l'optimisme）是什么性？", opts: ["阳性", "阴性", "大多阴性，少数阳性", "要看词义"], a: 0,
    hint: "想想 le communisme、le capitalisme、le journalisme 前面的冠词。",
    exp: "-isme 结尾的名词全部是阳性，几乎没有例外，是最可靠的规则之一。" },
  { id: "fr-r23-2", ch: 27, cat: "词尾 -oir", q: "Il a oublié ___ mouchoir sur la table.", opts: ["son", "sa"], a: 0,

    exp: "-oir 结尾的名词是阳性：le mouchoir、le miroir、le couloir、le trottoir、le devoir、l'espoir。注意别和 -oire 混淆。" },
  { id: "fr-r23-3", ch: 27, cat: "词尾 -oire", q: "下面这几个以 -oire 结尾的名词里，哪个是阳性？", opts: ["laboratoire", "histoire", "victoire", "gloire"], a: 0,
    hint: "-oire 结尾大多是阴性，但有一批“地点、场所、用具”类的词是阳性。",
    exp: "-oire 多为阴性：l'histoire、la victoire、la gloire、la mémoire（记忆）。阳性的有：le laboratoire、le territoire、le répertoire、l'observatoire、l'accessoire、l'interrogatoire。" },
  { id: "fr-r23-4", ch: 27, cat: "词尾 -ion", q: "下面这几个以 -ion 结尾的名词里，哪个是阳性？", opts: ["avion", "nation", "télévision", "opinion"], a: 0,

    exp: "-tion、-sion、-xion 结尾的名词是阴性：la nation、la télévision、la connexion。-ion 前面是其他字母时有阳性：l'avion、le camion、le million、le pion、le bastion。" },
  { id: "fr-r23-5", ch: 27, cat: "词尾 -in / -ain", q: "Donne-moi ___ main, on traverse la rue.", opts: ["la", "le"], a: 0,

  { id: "fr-r23-6", ch: 27, cat: "词尾 -in / -ain", q: "La réunion touche à ___ fin.", opts: ["sa", "son"], a: 0,
    hint: "fin 是 -in 结尾的例外之一。",
    exp: "la fin 是阴性，所以是 sa fin。同样的固定说法还有 à la fin、sans fin。" },
  { id: "fr-r23-7", ch: 27, cat: "词尾 -oi", q: "下面这几个以 -oi 结尾的名词里，哪个是阴性？", opts: ["loi", "emploi", "tournoi", "envoi"], a: 0,

    exp: "-oi 结尾多为阳性：l'emploi、le tournoi、l'envoi、le roi。阴性的有：la loi、la foi、la paroi。" },
  { id: "fr-r23-8", ch: 27, cat: "词尾 -ice", q: "下面这几个以 -ice 结尾的名词里，哪个是阴性？", opts: ["police", "service", "exercice", "dentifrice"], a: 0,

  { id: "fr-r23-9", ch: 27, cat: "词尾 -ure", q: "下面这几个以 -ure 结尾的名词里，哪个是阳性？", opts: ["murmure", "voiture", "culture", "peinture"], a: 0,
    hint: "-ure 结尾几乎都是阴性，只有很少几个例外。",
    exp: "-ure 多为阴性：la voiture、la culture、la peinture、la nature。阳性例外：le murmure、le mercure、le parjure。" },
  { id: "fr-r23-10", ch: 27, cat: "词尾 -ude", q: "下面这几个以 -ude 结尾的名词里，哪个是阳性？", opts: ["prélude", "habitude", "solitude", "attitude"], a: 0,

    exp: "-ude 多为阴性：l'habitude、la solitude、l'attitude、la certitude。例外：le prélude、l'interlude。" },
  { id: "fr-r23-11", ch: 27, cat: "词尾 -ette", q: "下面这几个以 -ette 结尾的名词里，哪个是阳性？", opts: ["squelette", "baguette", "assiette", "fourchette"], a: 0,
    hint: "-ette 通常是阴性（很多是指小词），例外和人体有关。",
    exp: "-ette 多为阴性：la baguette、l'assiette、la fourchette、la cigarette。例外：le squelette。" },
  { id: "fr-r23-12", ch: 27, cat: "词尾 -elle", q: "下面这几个以 -elle 结尾的名词里，哪个是阳性？", opts: ["violoncelle", "poubelle", "vaisselle", "ficelle"], a: 0,
    hint: "-elle 结尾通常是阴性。例外是一种乐器。",
    exp: "-elle 多为阴性：la poubelle、la vaisselle、la ficelle、la querelle。例外：le violoncelle。" },
  { id: "fr-r23-13", ch: 27, cat: "词尾 -ie", q: "下面这几个以 -ie 结尾的名词里，哪个是阳性？", opts: ["incendie", "boulangerie", "pluie", "sortie"], a: 0,

    exp: "-ie 多为阴性：la boulangerie、la pluie、la sortie、la maladie。阳性例外：l'incendie、le parapluie、le génie。" },
  { id: "fr-r23-14", ch: 27, cat: "词尾 -ée", q: "下面这几个以 -ée 结尾的名词里，哪个是阳性？", opts: ["lycée", "journée", "idée", "entrée"], a: 0,

    exp: "-ée 多为阴性：la journée、l'idée、l'entrée、l'armée。阳性例外：le lycée、le musée、le trophée、l'apogée。" },
  { id: "fr-r23-15", ch: 27, cat: "词尾 -ique", q: "下面这几个以 -ique 结尾的名词里，哪个是阳性？", opts: ["pique-nique", "musique", "boutique", "politique"], a: 0,
    hint: "-ique 结尾多为阴性。例外中有一个复合名词。",
    exp: "-ique 多为阴性：la musique、la boutique、la politique、la panique。阳性例外：le pique-nique、le lexique、le portique、le cantique。" },
  { id: "fr-r23-16", ch: 27, cat: "词尾 -esse", q: "以 -esse 结尾的名词（la vitesse、la jeunesse、la tristesse）一般是什么性？", opts: ["阴性", "阳性", "阴阳各半", "要看词义"], a: 0,

    exp: "-esse 结尾是阴性：la vitesse、la jeunesse、la richesse、la politesse、la promesse。" },
  { id: "fr-r23-17", ch: 27, cat: "词尾 -ail / -eil", q: "Mon nouvel appareil photo est très ___.", opts: ["léger", "légère"], a: 0,
    hint: "-ail、-eil 结尾的名词，想想 le soleil、le travail。",
    exp: "-ail、-eil 结尾是阳性：l'appareil、le soleil、le réveil、le conseil、le travail、l'éventail。注意 nouvel 是 nouveau 在元音前的阳性形式。" },
  { id: "fr-r23-18", ch: 27, cat: "词尾 -age", q: "下面这几个以 -age 结尾的名词里，哪个是阴性？", opts: ["nage", "garage", "courage", "voyage"], a: 0,
    hint: "-age 结尾大多是阳性，但两个音节、以 -age 结尾的短词里有几个阴性的。",
    exp: "-age 多为阳性：le garage、le courage、le voyage。阴性例外：la nage、la cage、la page、la plage、l'image、la rage。" },
  { id: "fr-r23-19", ch: 27, cat: "词尾 -ment", q: "Le gouvernement a été ___ par la crise.", opts: ["affaibli", "affaiblie"], a: 0,
    hint: "-ment 结尾的无生命名词是什么性？",
    exp: "-ment 结尾的名词是阳性：le gouvernement、le moment、l'appartement、le mouvement。过去分词和阳性单数主语配合，写 affaibli。" },
  { id: "fr-r23-20", ch: 27, cat: "词尾 -et / -êt", q: "下面这几个名词里，哪个是阴性？", opts: ["forêt", "billet", "jouet", "secret"], a: 0,
    hint: "-et 结尾通常是阳性。看看哪个词的拼写有点不一样。",
    exp: "-et 结尾多为阳性：le billet、le jouet、le secret、le cabinet、l'intérêt。例外：la forêt。" },
  { id: "fr-r23-21", ch: 27, cat: "词尾 -phone / -scope", q: "Mon téléphone est encore ___.", opts: ["cassé", "cassée"], a: 0,
    hint: "-phone、-scope 结尾的科技名词，想想 microscope、microphone。",
    exp: "-phone、-scope 结尾是阳性：le téléphone、le microphone、le microscope、le télescope。" },
  { id: "fr-r23-22", ch: 27, cat: "词尾 -is", q: "下面这几个以 -is 结尾的名词里，哪个是阴性？", opts: ["vis", "tapis", "colis", "avis"], a: 0,
    hint: "-is 结尾通常是阳性。例外里有一个五金用品。",
    exp: "-is 结尾多为阳性：le tapis、le colis、l'avis、le paradis、le riz（-iz）。阴性例外：la vis（螺丝）、l'oasis、la souris（动物）。" },
  { id: "fr-r23-23", ch: 27, cat: "词尾 -ère", q: "下面这几个以 -ère 结尾的名词里，哪个是阳性？", opts: ["cimetière", "lumière", "rivière", "prière"], a: 0,
    hint: "-ère 结尾大多是阴性，但有一组常用阳性词，比如“性格”“神秘”。",
    exp: "-ère 多为阴性：la lumière、la rivière、la prière、la colère。阳性例外：le cimetière、le caractère、le mystère、le ministère、le derrière。" },
  { id: "fr-r23-24", ch: 27, cat: "词尾 -son", q: "下面这几个以 -son 结尾的名词里，哪个是阳性？", opts: ["frisson", "maison", "saison", "comparaison"], a: 0,
    hint: "-aison 结尾是阴性。看哪个不是 -aison。",
    exp: "-aison、-ison 结尾是阴性：la maison、la saison、la comparaison、la prison、la guérison。-sson 结尾多为阳性：le frisson、le buisson、le poisson；其他 -son 也常是阳性：le son、le blouson。" },
  { id: "fr-r23-25", ch: 27, cat: "词尾 -eur", q: "下面这几个以 -eur 结尾的名词里，哪个是阴性？", opts: ["valeur", "moteur", "ordinateur", "honneur"], a: 0,

    exp: "表示机器、工具的 -eur 是阳性：le moteur、l'ordinateur；抽象名词多为阴性：la valeur、la peur、la douleur、la chaleur。阳性例外：l'honneur、le bonheur、le malheur、le labeur。" },
