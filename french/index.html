  { id: "fr-r9-3", ch: 40, cat: "长文 · 语音留言", title: "语音留言", q: "第 3 问：关于伊内丝，哪一项正确？", audio: "Salut Thomas, c'est Julie. Je t'appelle pour samedi. Finalement, on ne va pas faire le pique-nique au parc, parce que la météo annonce de la pluie toute la journée. Je propose plutôt de se retrouver chez moi vers midi. Chacun apporte quelque chose : moi, je fais une salade et un gâteau au chocolat. Est-ce que tu pourrais apporter des boissons ? Paul viendra avec sa nouvelle copine, Inès. Tu ne la connais pas encore, elle est très sympa. Ah, et n'oublie pas : mon code d'entrée a changé. Rappelle-moi ce soir après dix-neuf heures, parce qu'avant, je suis au travail. Bisous !", quote: "Paul viendra avec sa nouvelle copine, Inès. Tu ne la connais pas encore, elle est très sympa.", tr: "意思：保罗会带他的新女朋友伊内丝来。你还不认识她，她人很好。", opts: ["她是保罗的新女朋友，托马还不认识她", "她是朱莉的同事", "托马和她很熟", "她周六来不了"], a: 0,
    exp: "sa nouvelle copine = 他的新女朋友。tu ne la connais pas encore = 你还不认识她，la 指 Inès。" },
  { id: "fr-r9-4", ch: 40, cat: "长文 · 语音留言", title: "语音留言", q: "第 4 问：托马该什么时候回电话？", audio: "Salut Thomas, c'est Julie. Je t'appelle pour samedi. Finalement, on ne va pas faire le pique-nique au parc, parce que la météo annonce de la pluie toute la journée. Je propose plutôt de se retrouver chez moi vers midi. Chacun apporte quelque chose : moi, je fais une salade et un gâteau au chocolat. Est-ce que tu pourrais apporter des boissons ? Paul viendra avec sa nouvelle copine, Inès. Tu ne la connais pas encore, elle est très sympa. Ah, et n'oublie pas : mon code d'entrée a changé. Rappelle-moi ce soir après dix-neuf heures, parce qu'avant, je suis au travail. Bisous !", quote: "Rappelle-moi ce soir après dix-neuf heures, parce qu'avant, je suis au travail.", tr: "意思：今晚七点以后给我回电话，因为在那之前我在上班。", opts: ["今晚 7 点以后", "今晚 7 点以前", "周六中午", "明天早上"], a: 0,
    exp: "après dix-neuf heures = 19 点以后。avant（在那之前）她在上班，所以不能更早打。" },
  { id: "fr-r9-5", ch: 40, cat: "长文 · 在里昂的新生活", title: "在里昂的新生活", q: "第 1 问：小陈为什么离开巴黎？", audio: "Je m'appelle Chen, j'ai vingt-six ans et je suis arrivée en France il y a un an et demi. Au début, j'habitais à Paris chez une amie, mais les loyers étaient trop chers, alors j'ai déménagé à Lyon en septembre dernier. Maintenant, je partage un appartement avec deux étudiantes françaises, ce qui m'aide beaucoup à progresser en français. Le matin, je travaille à mi-temps dans une librairie, et l'après-midi, je suis des cours de gestion à l'université. Ce qui me manque le plus, c'est la cuisine de ma mère. Alors le dimanche, j'essaie de préparer des raviolis avec mes colocataires. Elles adorent ça ! L'année prochaine, j'aimerais trouver un stage dans une entreprise internationale.", quote: "les loyers étaient trop chers, alors j'ai déménagé à Lyon", tr: "意思：房租太贵了，所以我搬到了里昂。", opts: ["房租太贵", "在里昂找到了工作", "朋友搬走了", "想离大学近一点"], a: 0,
    exp: "les loyers = 房租。alors = 所以，引出结果：搬到里昂。" },
  { id: "fr-r9-6", ch: 40, cat: "长文 · 在里昂的新生活", title: "在里昂的新生活", q: "第 2 问：她现在和谁住在一起？", audio: "Je m'appelle Chen, j'ai vingt-six ans et je suis arrivée en France il y a un an et demi. Au début, j'habitais à Paris chez une amie, mais les loyers étaient trop chers, alors j'ai déménagé à Lyon en septembre dernier. Maintenant, je partage un appartement avec deux étudiantes françaises, ce qui m'aide beaucoup à progresser en français. Le matin, je travaille à mi-temps dans une librairie, et l'après-midi, je suis des cours de gestion à l'université. Ce qui me manque le plus, c'est la cuisine de ma mère. Alors le dimanche, j'essaie de préparer des raviolis avec mes colocataires. Elles adorent ça ! L'année prochaine, j'aimerais trouver un stage dans une entreprise internationale.", quote: "je partage un appartement avec deux étudiantes françaises", tr: "意思：我和两个法国女大学生合租一套公寓。", opts: ["两个法国女大学生", "一个中国朋友", "她的妈妈", "她一个人住"], a: 0,
    exp: "partager un appartement = 合租。在巴黎时她住在朋友家（chez une amie），那是以前的事，动词用的是未完成过去时 j'habitais。" },
  { id: "fr-r9-7", ch: 40, cat: "长文 · 在里昂的新生活", title: "在里昂的新生活", q: "第 3 问：她上午一般做什么？", audio: "Je m'appelle Chen, j'ai vingt-six ans et je suis arrivée en France il y a un an et demi. Au début, j'habitais à Paris chez une amie, mais les loyers étaient trop chers, alors j'ai déménagé à Lyon en septembre dernier. Maintenant, je partage un appartement avec deux étudiantes françaises, ce qui m'aide beaucoup à progresser en français. Le matin, je travaille à mi-temps dans une librairie, et l'après-midi, je suis des cours de gestion à l'université. Ce qui me manque le plus, c'est la cuisine de ma mère. Alors le dimanche, j'essaie de préparer des raviolis avec mes colocataires. Elles adorent ça ! L'année prochaine, j'aimerais trouver un stage dans une entreprise internationale.", quote: "Le matin, je travaille à mi-temps dans une librairie", tr: "意思：上午我在一家书店做兼职。", opts: ["在书店做兼职", "在大学上课", "在公司实习", "在家做饭"], a: 0,
    exp: "le matin = 上午，l'après-midi = 下午。下午她去大学上管理课。à mi-temps = 兼职、半工。注意 librairie 是书店，图书馆是 bibliothèque。" },
  { id: "fr-r9-8", ch: 40, cat: "长文 · 在里昂的新生活", title: "在里昂的新生活", q: "第 4 问：她明年想做什么？", audio: "Je m'appelle Chen, j'ai vingt-six ans et je suis arrivée en France il y a un an et demi. Au début, j'habitais à Paris chez une amie, mais les loyers étaient trop chers, alors j'ai déménagé à Lyon en septembre dernier. Maintenant, je partage un appartement avec deux étudiantes françaises, ce qui m'aide beaucoup à progresser en français. Le matin, je travaille à mi-temps dans une librairie, et l'après-midi, je suis des cours de gestion à l'université. Ce qui me manque le plus, c'est la cuisine de ma mère. Alors le dimanche, j'essaie de préparer des raviolis avec mes colocataires. Elles adorent ça ! L'année prochaine, j'aimerais trouver un stage dans une entreprise internationale.", quote: "L'année prochaine, j'aimerais trouver un stage dans une entreprise internationale.", tr: "意思：明年我想在一家跨国公司找份实习。", opts: ["在跨国公司找实习", "回中国", "搬回巴黎", "开一家书店"], a: 0,
    exp: "l'année prochaine = 明年。j'aimerais = 我想（条件式，语气比 je veux 委婉）。un stage = 实习。" },
  { id: "fr-r9-9", ch: 40, cat: "长文 · 城堡导游", title: "城堡导游", q: "第 1 问：这次参观大约多长时间？", audio: "Bienvenue au château de Chenonceau, mesdames et messieurs. La visite d'aujourd'hui dure environ une heure et quart. Nous commencerons par la grande galerie, construite au-dessus de la rivière, puis nous monterons au premier étage pour voir les chambres. Je vous rappelle qu'il est interdit de prendre des photos avec flash à l'intérieur, mais vous pouvez photographier librement les jardins. À la fin de la visite, vous aurez trente minutes de temps libre. Le bus partira à seize heures précises du parking principal. Si vous vous perdez, appelez le numéro indiqué sur votre billet. Bonne visite !", quote: "La visite d'aujourd'hui dure environ une heure et quart.", tr: "意思：今天的参观大约持续一小时十五分钟。", opts: ["一小时十五分钟", "四十五分钟", "半小时", "一个半小时"], a: 0,
    exp: "une heure et quart = 一小时一刻钟 = 75 分钟。une heure et demie 才是一个半小时。" },
  { id: "fr-r9-10", ch: 40, cat: "长文 · 城堡导游", title: "城堡导游", q: "第 2 问：关于拍照，导游是怎么说的？", audio: "Bienvenue au château de Chenonceau, mesdames et messieurs. La visite d'aujourd'hui dure environ une heure et quart. Nous commencerons par la grande galerie, construite au-dessus de la rivière, puis nous monterons au premier étage pour voir les chambres. Je vous rappelle qu'il est interdit de prendre des photos avec flash à l'intérieur, mais vous pouvez photographier librement les jardins. À la fin de la visite, vous aurez trente minutes de temps libre. Le bus partira à seize heures précises du parking principal. Si vous vous perdez, appelez le numéro indiqué sur votre billet. Bonne visite !", quote: "il est interdit de prendre des photos avec flash à l'intérieur, mais vous pouvez photographier librement les jardins.", tr: "意思：室内禁止用闪光灯拍照，但花园可以随便拍。", opts: ["室内不能用闪光灯，花园可以随便拍", "城堡里任何地方都不能拍", "只有花园里可以用闪光灯", "可以随便拍，没有任何限制"], a: 0,
    exp: "il est interdit de = 禁止。avec flash 是关键：室内只是不能用闪光灯，并不是完全不能拍。" },
  { id: "fr-r9-11", ch: 40, cat: "长文 · 城堡导游", title: "城堡导游", q: "第 3 问：参观结束后有什么安排？", audio: "Bienvenue au château de Chenonceau, mesdames et messieurs. La visite d'aujourd'hui dure environ une heure et quart. Nous commencerons par la grande galerie, construite au-dessus de la rivière, puis nous monterons au premier étage pour voir les chambres. Je vous rappelle qu'il est interdit de prendre des photos avec flash à l'intérieur, mais vous pouvez photographier librement les jardins. À la fin de la visite, vous aurez trente minutes de temps libre. Le bus partira à seize heures précises du parking principal. Si vous vous perdez, appelez le numéro indiqué sur votre billet. Bonne visite !", quote: "À la fin de la visite, vous aurez trente minutes de temps libre.", tr: "意思：参观结束后，你们有三十分钟自由活动时间。", opts: ["有 30 分钟自由活动", "马上上大巴", "去花园吃午饭", "去参观二楼"], a: 0,
    exp: "temps libre = 自由时间。参观二楼（le premier étage）是参观过程中的安排。注意法国的 premier étage 是中国说的二楼。" },
  { id: "fr-r9-12", ch: 40, cat: "长文 · 城堡导游", title: "城堡导游", q: "第 4 问：大巴几点出发？", audio: "Bienvenue au château de Chenonceau, mesdames et messieurs. La visite d'aujourd'hui dure environ une heure et quart. Nous commencerons par la grande galerie, construite au-dessus de la rivière, puis nous monterons au premier étage pour voir les chambres. Je vous rappelle qu'il est interdit de prendre des photos avec flash à l'intérieur, mais vous pouvez photographier librement les jardins. À la fin de la visite, vous aurez trente minutes de temps libre. Le bus partira à seize heures précises du parking principal. Si vous vous perdez, appelez le numéro indiqué sur votre billet. Bonne visite !", quote: "Le bus partira à seize heures précises du parking principal.", tr: "意思：大巴将在下午四点整从主停车场出发。", opts: ["下午 4 点整", "下午 6 点", "下午 4 点半", "下午 3 点半"], a: 0,
    exp: "seize heures = 16 点 = 下午 4 点。précises = 整点、准时。不要和 six（6）弄混。" },
  { id: "fr-r9-13", ch: 40, cat: "长文 · 没有汽车的市中心", title: "没有汽车的市中心", q: "第 1 问：市中心什么时候禁止汽车通行？", audio: "Depuis le premier avril, le centre-ville de Saint-Aubin est fermé aux voitures le week-end. La mairie a pris cette décision pour réduire la pollution et le bruit. Au début, beaucoup de commerçants étaient inquiets : ils avaient peur de perdre des clients. Mais trois mois plus tard, les résultats sont plutôt positifs. Selon la mairie, le nombre de visiteurs a augmenté de quinze pour cent, et les cafés ont installé plus de terrasses. Pourtant, tout le monde n'est pas content : certains habitants âgés trouvent difficile de se déplacer sans voiture. Pour les aider, la ville propose maintenant un petit bus électrique gratuit, qui passe toutes les dix minutes.", quote: "le centre-ville de Saint-Aubin est fermé aux voitures le week-end.", tr: "意思：圣欧班市中心周末禁止汽车进入。", opts: ["周末", "每天", "工作日", "只在四月"], a: 0,
    exp: "le week-end = 每个周末。depuis le premier avril 是说从 4 月 1 日开始实行，不是只在四月。" },
  { id: "fr-r9-14", ch: 40, cat: "长文 · 没有汽车的市中心", title: "没有汽车的市中心", q: "第 2 问：一开始商家为什么担心？", audio: "Depuis le premier avril, le centre-ville de Saint-Aubin est fermé aux voitures le week-end. La mairie a pris cette décision pour réduire la pollution et le bruit. Au début, beaucoup de commerçants étaient inquiets : ils avaient peur de perdre des clients. Mais trois mois plus tard, les résultats sont plutôt positifs. Selon la mairie, le nombre de visiteurs a augmenté de quinze pour cent, et les cafés ont installé plus de terrasses. Pourtant, tout le monde n'est pas content : certains habitants âgés trouvent difficile de se déplacer sans voiture. Pour les aider, la ville propose maintenant un petit bus électrique gratuit, qui passe toutes les dix minutes.", quote: "ils avaient peur de perdre des clients.", tr: "意思：他们怕失去顾客。", opts: ["怕失去顾客", "怕污染变得更严重", "怕没有停车位", "怕房租上涨"], a: 0,
    exp: "avoir peur de = 害怕。减少污染和噪音（réduire la pollution et le bruit）是市政府做这个决定的原因，不是商家的担心。" },
  { id: "fr-r9-15", ch: 40, cat: "长文 · 没有汽车的市中心", title: "没有汽车的市中心", q: "第 3 问：三个月后结果怎么样？", audio: "Depuis le premier avril, le centre-ville de Saint-Aubin est fermé aux voitures le week-end. La mairie a pris cette décision pour réduire la pollution et le bruit. Au début, beaucoup de commerçants étaient inquiets : ils avaient peur de perdre des clients. Mais trois mois plus tard, les résultats sont plutôt positifs. Selon la mairie, le nombre de visiteurs a augmenté de quinze pour cent, et les cafés ont installé plus de terrasses. Pourtant, tout le monde n'est pas content : certains habitants âgés trouvent difficile de se déplacer sans voiture. Pour les aider, la ville propose maintenant un petit bus électrique gratuit, qui passe toutes les dix minutes.", quote: "le nombre de visiteurs a augmenté de quinze pour cent, et les cafés ont installé plus de terrasses.", tr: "意思：游客数量增加了 15%，咖啡馆也摆出了更多露天座位。", opts: ["游客增加了 15%，咖啡馆露天座位变多", "游客减少了 15%", "很多商店关门了", "又允许汽车进城了"], a: 0,
    exp: "augmenter = 增加（减少是 diminuer）。plutôt positifs = 总体来说比较积极。" },
  { id: "fr-r9-16", ch: 40, cat: "长文 · 没有汽车的市中心", title: "没有汽车的市中心", q: "第 4 问：市里怎样帮助老人？", audio: "Depuis le premier avril, le centre-ville de Saint-Aubin est fermé aux voitures le week-end. La mairie a pris cette décision pour réduire la pollution et le bruit. Au début, beaucoup de commerçants étaient inquiets : ils avaient peur de perdre des clients. Mais trois mois plus tard, les résultats sont plutôt positifs. Selon la mairie, le nombre de visiteurs a augmenté de quinze pour cent, et les cafés ont installé plus de terrasses. Pourtant, tout le monde n'est pas content : certains habitants âgés trouvent difficile de se déplacer sans voiture. Pour les aider, la ville propose maintenant un petit bus électrique gratuit, qui passe toutes les dix minutes.", quote: "la ville propose maintenant un petit bus électrique gratuit, qui passe toutes les dix minutes.", tr: "意思：现在市里提供一种免费的小型电动巴士，每十分钟一班。", opts: ["提供每 10 分钟一班的免费电动小巴", "允许老人开车进城", "提供打折出租车", "免费发放自行车"], a: 0,
    exp: "pourtant = 然而，引出反面情况。gratuit = 免费。toutes les dix minutes = 每十分钟一次。" },

  { id: "fr-r10-1", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il y a deux chats dans le jardin.", tr: "意思：花园里有两只猫。", opts: ["Il y a deux chats dans le jardin.", "Il y a douze chats dans le jardin.", "Il y a des chats dans le jardin.", "Il y a deux chiens dans le jardin."], a: 0,
    exp: "deux [dø] 和 douze [duz] 的区别在元音和结尾的 z 音。des [de] 是开口的 é，deux 的元音要圆唇。" },
  { id: "fr-r10-2", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je vais au marché le samedi.", tr: "意思：我每周六去市场。", opts: ["Je vais au marché le samedi.", "Je vais au marché ce samedi.", "Je vais au marché le mardi.", "Je vais au magasin le samedi."], a: 0,
    exp: "le samedi = 每个周六，ce samedi = 这个周六，开头的辅音 l / s 不一样。samedi 和 mardi 的重音音节也不同。" },
  { id: "fr-r10-3", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Elle a mangé une pomme.", tr: "意思：她吃了一个苹果。", opts: ["Elle a mangé une pomme.", "Elle mange une pomme.", "Elle a mangé deux pommes.", "Elle a mangé une poire."], a: 0,
    exp: "elle a mangé 比 elle mange 多了 a 和结尾的 é 音，这是复合过去时和现在时在听力上的区别。" },
  { id: "fr-r10-4", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Nous avons rendez-vous à onze heures.", tr: "意思：我们十一点有个约会。", opts: ["Nous avons rendez-vous à onze heures.", "Nous avons rendez-vous à deux heures.", "Nous avons rendez-vous à douze heures.", "Vous avez rendez-vous à onze heures."], a: 0,
    exp: "onze 前面不连读也不省音：à onze heures [a ɔ̃z œʁ]。deux heures 和 douze heures 都有连读的 z 音，要靠前面的元音区分。" },
  { id: "fr-r10-5", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Tu peux fermer la fenêtre ?", tr: "意思：你能把窗户关上吗？", opts: ["Tu peux fermer la fenêtre ?", "Tu veux fermer la fenêtre ?", "Tu peux fermer la porte ?", "Tu peux ouvrir la fenêtre ?"], a: 0,
    exp: "peux [pø] 和 veux [vø] 只差第一个辅音 p / v。p 是双唇爆破，v 是上齿碰下唇的摩擦音。" },
  { id: "fr-r10-6", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il fait beau ce matin.", tr: "意思：今天早上天气很好。", opts: ["Il fait beau ce matin.", "Il fait chaud ce matin.", "Il faisait beau ce matin.", "Il fait beau demain matin."], a: 0,
    exp: "fait [fɛ] 和 faisait [fəzɛ] 多一个音节。beau 和 chaud 只差开头的辅音 b / ʃ。" },
  { id: "fr-r10-7", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je n'aime pas le poisson.", tr: "意思：我不喜欢吃鱼。", opts: ["Je n'aime pas le poisson.", "J'aime bien le poisson.", "Je n'aime pas le poison.", "Je n'aime plus le poisson."], a: 0,
    exp: "poisson [pwasɔ̃]（鱼）里的 ss 读清音 s，poison [pwazɔ̃]（毒药）里的单个 s 读浊音 z。pas 和 plus 也要听清。" },
  { id: "fr-r10-8", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Mon frère habite à Lyon.", tr: "意思：我哥哥住在里昂。", opts: ["Mon frère habite à Lyon.", "Mon père habite à Lyon.", "Mon frère habitait à Lyon.", "Mes frères habitent à Lyon."], a: 0,
    exp: "frère / père 只差开头的 fr / p。habitait 结尾是 [ɛ] 音，habite 结尾是辅音 t。mes [me] 和 mon [mɔ̃] 也不同。" },
  { id: "fr-r10-9", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "On part dans dix minutes.", tr: "意思：我们十分钟后出发。", opts: ["On part dans dix minutes.", "On part dans deux minutes.", "On part dans six minutes.", "On part dans douze minutes."], a: 0,
    exp: "dix [di] 和 six [si] 只差 d / s。在辅音前面它们的结尾 x 不发音：dix minutes [di minyt]。" },
  { id: "fr-r10-10", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "C'est au-dessus de la table.", tr: "意思：它在桌子上方。", opts: ["C'est au-dessus de la table.", "C'est au-dessous de la table.", "C'est à côté de la table.", "C'est au-dessus de la tasse."], a: 0,
    exp: "dessus [dəsy] 是 u 音（嘴唇圆、舌头靠前），dessous [dəsu] 是 ou 音。意思正好相反：上面 / 下面。" },
  { id: "fr-r10-11", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "J'ai acheté un pull rouge.", tr: "意思：我买了一件红毛衣。", opts: ["J'ai acheté un pull rouge.", "J'ai acheté une jupe rouge.", "J'ai acheté un pull rose.", "Je vais acheter un pull rouge."], a: 0,
    exp: "rouge [ʁuʒ] 和 rose [ʁoz] 元音和结尾辅音都不同。j'ai acheté 是过去时，je vais acheter 是将来。" },
  { id: "fr-r10-12", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il est à la maison.", tr: "意思：他在家。", opts: ["Il est à la maison.", "Il était à la maison.", "Elle est à la maison.", "Il est à la mairie."], a: 0,
    exp: "il [il] 和 elle [ɛl] 元音不同。était [etɛ] 比 est [ɛ] 多一个音节。maison 和 mairie 后半部分不同。" },
  { id: "fr-r10-13", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Nous habitons au troisième étage.", tr: "意思：我们住在四楼（法国的三楼）。", opts: ["Nous habitons au troisième étage.", "Nous habitons au treizième étage.", "Vous habitez au troisième étage.", "Nous habitons au deuxième étage."], a: 0,
    exp: "troisième [tʁwazjɛm] 有 oi 音，treizième [tʁɛzjɛm] 是 è 音。nous habitons 有连读 [nuzabitɔ̃]，vous habitez 结尾是 é。" },
  { id: "fr-r10-14", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je voudrais un café, s'il vous plaît.", tr: "意思：我想要一杯咖啡。", opts: ["Je voudrais un café, s'il vous plaît.", "Je voudrais deux cafés, s'il vous plaît.", "Je voulais un café, s'il vous plaît.", "Je voudrais un thé, s'il vous plaît."], a: 0,
    exp: "voudrais [vudʁɛ] 里有 dr 音，voulais [vulɛ] 是 l 音。点餐时用条件式 je voudrais 显得礼貌。" },
  { id: "fr-r10-15", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Le train part à quinze heures.", tr: "意思：火车十五点出发。", opts: ["Le train part à quinze heures.", "Le train part à seize heures.", "Le train part à cinq heures.", "Le train arrive à quinze heures."], a: 0,
    exp: "quinze [kɛ̃z]（15）和 seize [sɛz]（16）开头辅音不同，quinze 的元音带鼻音。part 和 arrive 意思相反：出发 / 到达。" },
  { id: "fr-r10-16", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Ce livre coûte vingt euros.", tr: "意思：这本书二十欧元。", opts: ["Ce livre coûte vingt euros.", "Ces livres coûtent vingt euros.", "Ce livre coûte vingt-deux euros.", "Ce livre coûte trente euros."], a: 0,
    exp: "coûte 和 coûtent 读音一样，单复数只能靠 ce [sə] 和 ces [se] 来分辨。vingt euros 要连读 [vɛ̃t øʁo]。" },
  { id: "fr-r10-17", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il lit le journal le matin.", tr: "意思：他早上看报纸。", opts: ["Il lit le journal le matin.", "Il lit le journal le soir.", "Il a lu le journal ce matin.", "Il lit un journal le matin."], a: 0,
    exp: "il lit [il li] 和 il a lu [il a ly] 差一个音节，元音 i / u 也不同。le journal 和 un journal 冠词不同。" },
  { id: "fr-r10-18", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Elle a les cheveux longs.", tr: "意思：她留着长头发。", opts: ["Elle a les cheveux longs.", "Elle a les cheveux blonds.", "Elle a les cheveux courts.", "Elle avait les cheveux longs."], a: 0,
    exp: "longs [lɔ̃] 和 blonds [blɔ̃] 只差一个 b。elle a [ɛla] 和 elle avait [ɛlavɛ] 差一个音节。" },
  { id: "fr-r10-19", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "J'ai perdu mes clés.", tr: "意思：我把钥匙弄丢了。", opts: ["J'ai perdu mes clés.", "J'ai perdu ma clé.", "J'ai rendu mes clés.", "Je perds mes clés."], a: 0,
    exp: "clé 和 clés 读音一样，单复数只能靠 ma [ma] 和 mes [me] 分辨。perdu / rendu 开头不同。j'ai perdu 比 je perds 多一个音节。" },
  { id: "fr-r10-20", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Tu viens avec nous ce soir ?", tr: "意思：你今晚和我们一起来吗？", opts: ["Tu viens avec nous ce soir ?", "Vous venez avec nous ce soir ?", "Tu viens chez nous ce soir ?", "Tu viens avec nous samedi soir ?"], a: 0,
    exp: "tu viens [ty vjɛ̃] 和 vous venez [vu vəne] 开头和结尾都不同。avec 有清楚的 k 音，chez 是 ʃ 音。" },

  { id: "fr-r11-1", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je prends le bus tous les matins.", tr: "意思：我每天早上坐公交车。", opts: ["Je prends le bus tous les matins.", "Je prends les bus tous les matins.", "Je prenais le bus tous les matins.", "Je prends le bus tous les soirs."], a: 0,
    exp: "le [lə] 的元音轻而短，les [le] 是清楚的 é。prenais [pʁənɛ] 比 prends [pʁɑ̃] 多一个音节。" },
  { id: "fr-r11-2", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Ils ont deux enfants.", tr: "意思：他们有两个孩子。", opts: ["Ils ont deux enfants.", "Ils sont deux enfants.", "Elles ont deux enfants.", "Ils ont douze enfants."], a: 0,
    exp: "ils ont 连读成 [ilzɔ̃]（z 音），ils sont 是 [ilsɔ̃]（s 音）。这是法语听力里最经典的一对：avoir 和 être。" },
  { id: "fr-r11-3", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il y a du poisson ce soir.", tr: "意思：今晚有鱼。", opts: ["Il y a du poisson ce soir.", "Il y a du poison ce soir.", "Il y a des poissons ce soir.", "Il y a du poisson ce matin."], a: 0,
    exp: "上一轮你在 poisson / poison 上错过：ss 读 [s]，单个 s 夹在元音中间读 [z]。du [dy] 和 des [de] 元音不同。" },
  { id: "fr-r11-4", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Tu veux un dessert ?", tr: "意思：你要甜点吗？", opts: ["Tu veux un dessert ?", "Tu veux un désert ?", "Tu veux deux desserts ?", "Tu voulais un dessert ?"], a: 0,
    exp: "dessert [desɛʁ]（甜点）是 s 音，désert [dezɛʁ]（沙漠）是 z 音。拼写规律：元音之间的单个 s 读 z，ss 读 s。" },
  { id: "fr-r11-5", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Nous avons la réponse.", tr: "意思：我们有答案。", opts: ["Nous avons la réponse.", "Nous savons la réponse.", "Vous avez la réponse.", "Nous avions la réponse."], a: 0,
    exp: "nous avons 连读成 [nuzavɔ̃]，nous savons 是 [nusavɔ̃]，又是 z / s 的区别。avions [avjɔ̃] 多了一个 i 音。" },
  { id: "fr-r11-6", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je voudrais une baguette.", tr: "意思：我想要一根长棍面包。", opts: ["Je voudrais une baguette.", "Je voulais une baguette.", "Je voudrais deux baguettes.", "Je voudrais une galette."], a: 0,
    exp: "上一轮错过的一对：voudrais [vudʁɛ] 中间是 d + r，voulais [vulɛ] 是 l。点东西时用的是 je voudrais。" },
  { id: "fr-r11-7", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "J'aimerais partir en vacances.", tr: "意思：我想去度假。", opts: ["J'aimerais partir en vacances.", "J'aimais partir en vacances.", "Il aimerait partir en vacances.", "J'aimerais partir en avance."], a: 0,
    exp: "条件式 aimerais [ɛmʁɛ] 中间有 r，未完成过去时 aimais [ɛmɛ] 没有。条件式的标志就是这个 r 音。" },
  { id: "fr-r11-8", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il a deux ans.", tr: "意思：他两岁。", opts: ["Il a deux ans.", "Il a douze ans.", "Elle a deux ans.", "Il a deux mois."], a: 0,
    exp: "deux ans 连读成 [døzɑ̃]，douze ans 是 [duzɑ̃]。区别只在元音 eu / ou。" },
  { id: "fr-r11-9", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je mets le livre sur la table.", tr: "意思：我把书放在桌子上。", opts: ["Je mets le livre sur la table.", "Je mets les livres sur la table.", "Je mets le livre sous la table.", "J'ai mis le livre sur la table."], a: 0,
    exp: "sur [syʁ] 是 u 音，sous [su] 是 ou 音。le / les 靠元音区分。" },
  { id: "fr-r11-10", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Tout le monde est là.", tr: "意思：大家都到了。", opts: ["Tout le monde est là.", "Tout le monde était là.", "Tout le monde est parti.", "Tout le monde sera là."], a: 0,
    exp: "est [ɛ]、était [etɛ]、sera [səʁa] 分别是现在、过去、将来。听动词有几个音节。" },
  { id: "fr-r11-11", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Elle vend sa voiture.", tr: "意思：她要卖她的车。", opts: ["Elle vend sa voiture.", "Elle a vendu sa voiture.", "Elle lave sa voiture.", "Elle vend ta voiture."], a: 0,
    exp: "elle vend [ɛl vɑ̃] 和 elle a vendu [ɛla vɑ̃dy] 差两个音节。sa / ta 只差开头辅音。" },
  { id: "fr-r11-12", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "C'est le bureau de mon père.", tr: "意思：这是我父亲的办公室。", opts: ["C'est le bureau de mon père.", "C'est le bureau de ma mère.", "C'est le bateau de mon père.", "C'était le bureau de mon père."], a: 0,
    exp: "bureau [byʁo] 和 bateau [bato] 第一个元音不同。c'est [sɛ] 和 c'était [setɛ] 差一个音节。" },
  { id: "fr-r11-13", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il boit du vin rouge.", tr: "意思：他喝红酒。", opts: ["Il boit du vin rouge.", "Il boit du vin blanc.", "Il a bu du vin rouge.", "Ils boivent du vin rouge."], a: 0,
    exp: "il boit [il bwa] 和 ils boivent [il bwav] 读音不同，复数多了个 v 音。il a bu [il a by] 是过去时。" },
  { id: "fr-r11-14", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "On se voit à seize heures.", tr: "意思：我们十六点见。", opts: ["On se voit à seize heures.", "On se voit à treize heures.", "On se voit à six heures.", "On se voyait à seize heures."], a: 0,
    exp: "seize [sɛz] 是 s 开头，treize [tʁɛz] 是 tr 开头。six heures 连读成 [sizœʁ]。" },
  { id: "fr-r11-15", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Le musée ouvre à dix heures.", tr: "意思：博物馆十点开门。", opts: ["Le musée ouvre à dix heures.", "Le musée ferme à dix heures.", "Le musée ouvre à deux heures.", "Le musée ouvrait à dix heures."], a: 0,
    exp: "dix heures [dizœʁ] 和 deux heures [døzœʁ] 都有连读的 z，靠前面的元音 i / eu 区分。ouvre 和 ferme 意思相反。" },
  { id: "fr-r11-16", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Ça coûte soixante euros.", tr: "意思：这个六十欧元。", opts: ["Ça coûte soixante euros.", "Ça coûte soixante-dix euros.", "Ça coûte quatre-vingts euros.", "Ça coûte six euros."], a: 0,
    exp: "soixante = 60，soixante-dix = 70，quatre-vingts = 80。soixante 后面接 euros 要连读 [swasɑ̃t øʁo]。" },
  { id: "fr-r11-17", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il est né le douze mai.", tr: "意思：他生于五月十二日。", opts: ["Il est né le douze mai.", "Il est né le deux mai.", "Il est né le douze mars.", "Il était né le douze mai."], a: 0,
    exp: "mai [mɛ]（五月）是单音节，mars [maʁs]（三月）结尾有 rs 音。" },
  { id: "fr-r11-18", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il pleut depuis ce matin.", tr: "意思：从早上一直在下雨。", opts: ["Il pleut depuis ce matin.", "Il pleure depuis ce matin.", "Il pleuvait depuis ce matin.", "Il pleut depuis hier matin."], a: 0,
    exp: "pleut [plø]（下雨）结尾是元音，pleure [plœʁ]（哭）结尾有 r 音，元音也更开。" },
  { id: "fr-r11-19", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Tu as vu le film ?", tr: "意思：你看过那部电影了吗？", opts: ["Tu as vu le film ?", "Tu vas voir le film ?", "Vous avez vu le film ?", "Tu as vu les films ?"], a: 0,
    exp: "tu as vu [ty a vy] 是过去时，tu vas voir [ty va vwaʁ] 是将来。vu 是 u 音，voir 是 oi 音。" },
  { id: "fr-r11-20", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Elle habite près de la poste.", tr: "意思：她住在邮局附近。", opts: ["Elle habite près de la poste.", "Elle habite loin de la poste.", "Elle habite près de la porte.", "Elle habitait près de la poste."], a: 0,
    exp: "poste [pɔst] 有 st 音，porte [pɔʁt] 有 rt 音。près（近）和 loin（远）意思相反。" },
  { id: "fr-r11-21", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Nous allons au cinéma.", tr: "意思：我们去电影院。", opts: ["Nous allons au cinéma.", "Nous allions au cinéma.", "Vous allez au cinéma.", "Nous allons au casino."], a: 0,
    exp: "allons [alɔ̃] 是现在时，allions [aljɔ̃] 是未完成过去时，多了一个轻轻的 i 音。" },
  { id: "fr-r11-22", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Le chat est sous le lit.", tr: "意思：猫在床底下。", opts: ["Le chat est sous le lit.", "Le chat est sur le lit.", "Les chats sont sous le lit.", "Le chien est sous le lit."], a: 0,
    exp: "sous [su] / sur [syʁ] 再练一次：ou 和 u。le chat est 和 les chats sont 冠词和动词都不同。" },
  { id: "fr-r11-23", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je veux un pain au chocolat.", tr: "意思：我要一个巧克力面包。", opts: ["Je veux un pain au chocolat.", "Je veux deux pains au chocolat.", "Je voulais un pain au chocolat.", "Je veux un pain aux raisins."], a: 0,
    exp: "un [œ̃] 和 deux [dø] 一个是鼻化音，一个不是。veux [vø] 和 voulais [vulɛ] 音节数不同。" },
  { id: "fr-r11-24", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il faut prendre le métro.", tr: "意思：得坐地铁。", opts: ["Il faut prendre le métro.", "Il fallait prendre le métro.", "Il faut prendre le vélo.", "Il faut apprendre le mot."], a: 0,
    exp: "faut [fo] 是现在，fallait [falɛ] 是过去。métro 和 vélo 开头辅音不同。" },
  { id: "fr-r11-25", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Ma fille a quinze ans.", tr: "意思：我女儿十五岁。", opts: ["Ma fille a quinze ans.", "Ma fille a seize ans.", "Mes filles ont quinze ans.", "Ma fille a cinq ans."], a: 0,
    exp: "quinze [kɛ̃z] 和 seize [sɛz]：开头 k / s，元音一个带鼻音一个不带。cinq ans [sɛ̃kɑ̃] 有 k 音。" },
  { id: "fr-r11-26", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Nous partons demain matin.", tr: "意思：我们明天早上出发。", opts: ["Nous partons demain matin.", "Nous partirons demain matin.", "Vous partez demain matin.", "Nous partons ce matin."], a: 0,
    exp: "partons [paʁtɔ̃] 是现在时，partirons [paʁtiʁɔ̃] 是将来时，多了 ir 音。将来时的标志也是 r。" },
  { id: "fr-r11-27", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Ce gâteau est très bon.", tr: "意思：这个蛋糕很好吃。", opts: ["Ce gâteau est très bon.", "Ces gâteaux sont très bons.", "Ce gâteau était très bon.", "Ce bateau est très bon."], a: 0,
    exp: "ce [sə] / ces [se] 再加上 est / sont，单复数在两个地方都能听出来。gâteau / bateau 开头 g / b。" },
  { id: "fr-r11-28", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "J'ai faim, on mange ?", tr: "意思：我饿了，我们吃饭吧？", opts: ["J'ai faim, on mange ?", "J'ai fini, on mange ?", "J'avais faim, on mange ?", "J'ai froid, on mange ?"], a: 0,
    exp: "faim [fɛ̃] 是一个鼻化音，fini [fini] 是两个 i 音节。froid [fʁwa] 有 r 和 oi 音。" },
  { id: "fr-r11-29", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il y a une boulangerie en face.", tr: "意思：对面有一家面包店。", opts: ["Il y a une boulangerie en face.", "Il y avait une boulangerie en face.", "Il y a une boucherie en face.", "Il y a deux boulangeries en face."], a: 0,
    exp: "il y a [ilja] 和 il y avait [iljavɛ] 差一个音节。boulangerie（面包店）比 boucherie（肉店）多了 lan 音。" },
  { id: "fr-r11-30", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Elle porte une robe bleue.", tr: "意思：她穿着一条蓝裙子。", opts: ["Elle porte une robe bleue.", "Elle portait une robe bleue.", "Elle porte une robe blanche.", "Elle porte deux robes bleues."], a: 0,
    exp: "porte [pɔʁt] 和 portait [pɔʁtɛ] 差结尾的 è 音。bleue [blø] 和 blanche [blɑ̃ʃ] 元音和结尾都不同。" },
  { id: "fr-r11-31", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Le docteur vient demain.", tr: "意思：医生明天来。", opts: ["Le docteur vient demain.", "Le docteur viendra demain.", "Le docteur vient de manger.", "Les docteurs viennent demain."], a: 0,
    exp: "vient [vjɛ̃] 是现在，viendra [vjɛ̃dʁa] 是将来。viennent [vjɛn] 是复数，结尾有 n 音，不带鼻化。" },
  { id: "fr-r11-32", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Tu peux m'aider ?", tr: "意思：你能帮我吗？", opts: ["Tu peux m'aider ?", "Tu veux m'aider ?", "Vous pouvez m'aider ?", "Tu peux l'aider ?"], a: 0,
    exp: "peux [pø] / veux [vø]：p 和 v。m'aider 和 l'aider 只差开头的 m / l。" },
  { id: "fr-r11-33", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Où est la gare ?", tr: "意思：火车站在哪里？", opts: ["Où est la gare ?", "Où est le car ?", "Où était la gare ?", "Où sont les gares ?"], a: 0,
    exp: "gare [gaʁ] 是浊音 g，car [kaʁ]（长途汽车）是清音 k。la 和 le 元音也不同。" },
  { id: "fr-r11-34", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "J'ai un rendez-vous lundi.", tr: "意思：我周一有个约会。", opts: ["J'ai un rendez-vous lundi.", "J'ai un rendez-vous mardi.", "J'avais un rendez-vous lundi.", "J'ai deux rendez-vous lundi."], a: 0,
    exp: "lundi [lœ̃di] 第一个音节带鼻音，mardi [maʁdi] 有 r 音。" },
  { id: "fr-r11-35", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il écoute la radio.", tr: "意思：他在听广播。", opts: ["Il écoute la radio.", "Ils écoutent la radio.", "Il écoutait la radio.", "Il écoute la météo."], a: 0,
    exp: "il écoute [ilekut] 和 ils écoutent [ilzekut] 的区别只在连读的 z 音上，动词本身读音一样。" },
  { id: "fr-r11-36", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Elle attend le bus.", tr: "意思：她在等公交车。", opts: ["Elle attend le bus.", "Elles attendent le bus.", "Elle entend le bus.", "Elle attendait le bus."], a: 0,
    exp: "elles attendent 连读成 [ɛlzatɑ̃d]，单数没有 z 音，复数结尾还多一个 d 音。attend [atɑ̃] 和 entend [ɑ̃tɑ̃] 开头不同。" },
  { id: "fr-r11-37", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Le vent est très fort.", tr: "意思：风很大。", opts: ["Le vent est très fort.", "Le vin est très fort.", "Le vent était très fort.", "Le vent est trop fort."], a: 0,
    exp: "vent [vɑ̃]（风）和 vin [vɛ̃]（酒）都是鼻化音：vent 嘴张得更大、偏后，vin 偏前、嘴角向两边。très [tʁɛ] 和 trop [tʁo] 元音不同。" },
  { id: "fr-r11-38", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il est onze heures moins le quart.", tr: "意思：现在是十点四十五分。", opts: ["Il est onze heures moins le quart.", "Il est onze heures et quart.", "Il est douze heures moins le quart.", "Il est deux heures moins le quart."], a: 0,
    exp: "moins le quart = 差一刻（减 15 分钟），et quart = 过一刻。onze heures moins le quart = 10:45。" },
  { id: "fr-r11-39", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Je cherche le numéro douze.", tr: "意思：我在找十二号。", opts: ["Je cherche le numéro douze.", "Je cherche le numéro deux.", "Je cherchais le numéro douze.", "Je cherche le numéro treize."], a: 0,
    exp: "douze [duz]、deux [dø]、treize [tʁɛz] 结尾和元音都不同。cherchais 结尾有 è 音。" },
  { id: "fr-r11-40", ch: 3, cat: "听写辨音", q: "听句子，选出和录音一字不差的那一句。", audio: "Il a perdu son chien.", tr: "意思：他的狗丢了。", opts: ["Il a perdu son chien.", "Il a rendu son chien.", "Il perd son chien.", "Ils ont perdu leur chien."], a: 0,
    exp: "il a perdu [ilapɛʁdy] 和 il perd [ilpɛʁ] 差 a 和 du 两个音。ils ont 连读成 [ilzɔ̃]。" },





  { id: "fr-r16-1", ch: 26, cat: "après + 不定式过去时", q: "Après ___ le film, nous sommes allés dîner.", opts: ["voir", "avoir vu", "voyant", "vu"], a: 1,
    exp: "après 后面永远接不定式过去时（avoir / être + 过去分词）：après avoir vu、après être sorti。（书中第 26 章 · p.366）" },
  { id: "fr-r16-2", ch: 26, cat: "介词 + 不定式", q: "Elle est partie sans ___ au revoir.", opts: ["dire", "disant", "dit", "de dire"], a: 0,
    exp: "除 en 以外，介词后面的动词都用不定式，英语这里常用 -ing：sans dire = without saying。（书中第 26 章 · p.366）" },
  { id: "fr-r16-3", ch: 26, cat: "en + 现在分词", q: "J'ai rencontré Antoine ___ allant à la bibliothèque.", opts: ["en", "à", "pour", "par"], a: 0,
    exp: "只有 en 后面接现在分词，构成副动词（gérondif）：en allant = 在去……的路上。（书中第 26 章 · p.367）" },
  { id: "fr-r16-4", ch: 26, cat: "de ma part", q: "Dites-lui bonjour ___ ma part.", opts: ["de", "par", "pour", "à"], a: 0,
    exp: "“替我、以我的名义”说 de ma part，不说 *de moi。de 和 à 意思太多，容易产生歧义时会换成复合介词。（书中第 26 章 · p.368）" },
  { id: "fr-r16-5", ch: 26, cat: "à la télévision", q: "Hier soir, j'ai regardé un film ___ la télévision.", opts: ["à", "sur", "dans", "en"], a: 0,
    exp: "“在电视上”是 à la télévision，英语说 on television。这类介词习惯用法要逐个记。（书中第 26 章 · p.369）" },
  { id: "fr-r16-6", ch: 26, cat: "最高级 + de", q: "C'est le plus beau chat ___ monde.", opts: ["du", "dans le", "au", "en"], a: 0,
    exp: "最高级的范围用 de：le plus beau chat du monde，英语说 in the world。（书中第 26 章 · p.369）" },
  { id: "fr-r16-7", ch: 26, cat: "复合介词的重复", q: "Je me suis assise près de Julie et ___ Sophie.", opts: ["de", "près de", "à", "（不填）"], a: 0,
    exp: "“près de + 两个名词”时，第二个名词前只保留 de，不重复 près：près de Julie et de Sophie。（书中第 26 章 · p.372）" },
  { id: "fr-r16-8", ch: 26, cat: "jouer à / jouer de", q: "Je joue ___ tennis tous les jeudis.", opts: ["au", "du", "le", "de"], a: 0,
    exp: "jouer à + 定冠词 + 体育运动或游戏：jouer au tennis、à la belote。乐器用 de：jouer du piano。（书中第 26 章 · p.373）" },
  { id: "fr-r16-9", ch: 26, cat: "jouer à / jouer de", q: "Il joue ___ piano depuis dix ans.", opts: ["du", "au", "le", "en"], a: 0,
    exp: "乐器用 jouer de：jouer du piano、de la guitare；体育运动和游戏用 jouer à。（书中第 26 章 · p.378）" },
  { id: "fr-r16-10", ch: 26, cat: "城市名", q: "Ce week-end, nous allons ___ Mans.", opts: ["au", "à", "en", "dans le"], a: 0,
    exp: "城市名前一般只用 à，但城市名本身带冠词时要缩合：Le Mans → au Mans，La Rochelle → à La Rochelle。（书中第 26 章 · p.374）" },
  { id: "fr-r16-11", ch: 26, cat: "岛屿名", q: "Cet été, je vais ___ Ibiza.", opts: ["à", "en", "au", "aux"], a: 0,
    exp: "很多小岛前用 à：à Ibiza、à Paros；阴性的大岛用 en：en Corse、en Sicile。（书中第 26 章 · p.374）" },
  { id: "fr-r16-12", ch: 26, cat: "chez / à", q: "Cet après-midi, je vais ___ coiffeur.", opts: ["chez le", "au", "à le", "dans le"], a: 0,
    exp: "去某人家里或店里用 chez + 人：chez le coiffeur、chez le boulanger。au coiffeur 是口语，书中提醒正式法语里不宜这么说；用店名时才用 à：au salon de coiffure。（书中第 26 章 · p.375）" },
  { id: "fr-r16-13", ch: 26, cat: "交通方式", q: "Elle va au bureau ___ voiture, mais moi, j'y vais à pied.", opts: ["en", "à", "dans", "par"], a: 0,
    exp: "坐在交通工具里面用 en：en voiture、en train、en avion。“自然”的方式用 à：à pied、à cheval。自行车两种都可以：à vélo / en vélo。（书中第 26 章 · p.376）" },
  { id: "fr-r16-14", ch: 26, cat: "à + 用途", q: "N'oublie pas ta brosse ___ dents !", opts: ["à", "de", "pour", "en"], a: 0,
    exp: "à + 不带冠词的名词或不定式，表示用途：une brosse à dents、une machine à laver、une tasse à café。（书中第 26 章 · p.376）" },
  { id: "fr-r16-15", ch: 26, cat: "de 表原因", q: "Ferme la fenêtre, je tremble ___ froid !", opts: ["de", "par", "à", "avec"], a: 0,
    exp: "de 可以表示原因：trembler de froid、pleurer de joie、rouge de colère。（书中第 26 章 · p.379）" },
  { id: "fr-r16-16", ch: 26, cat: "de 表方式", q: "Il est parti ___ un pas pressé.", opts: ["d'", "avec", "à", "en"], a: 0,
    exp: "de 可以表示方式：d'un pas pressé、de cette façon、d'une manière différente。（书中第 26 章 · p.380）" },
  { id: "fr-r16-17", ch: 26, cat: "en 表变化", q: "Coupez le saucisson ___ tranches très fines.", opts: ["en", "à", "dans", "par"], a: 0,
    exp: "en 常表示“变成”：couper en tranches、se transformer en prince。（书中第 26 章 · p.381）" },
  { id: "fr-r16-18", ch: 26, cat: "en 表身份", q: "Pour la fête, il s'était déguisé ___ policier.", opts: ["en", "comme", "de", "à"], a: 0,
    exp: "en 也表示“作为、打扮成”：se déguiser en policier。（书中第 26 章 · p.381）" },
  { id: "fr-r16-19", ch: 26, cat: "avoir confiance en", q: "Hélène n'a pas confiance ___ son médecin.", opts: ["en", "à", "dans", "de"], a: 0,
    exp: "avoir confiance en qn：信任某人。书中例句正是 Hélène n'a pas confiance en son médecin。（书中第 26 章 · p.381）" },
  { id: "fr-r16-20", ch: 26, cat: "季节", q: "___ printemps, les arbres fleurissent.", opts: ["Au", "En", "Dans le", "À"], a: 0,
    exp: "季节前用 en：en été、en automne、en hiver，唯一的例外是 au printemps。（书中第 26 章 · p.382）" },
  { id: "fr-r16-21", ch: 26, cat: "en / dans + 时间", q: "Elle a écrit son article ___ deux semaines : elle a travaillé très vite.", opts: ["en", "dans", "pendant", "pour"], a: 0,
    exp: "en + 时间段表示完成一件事所用的时间（花了两周写完）；dans + 时间段表示从现在起若干时间之后。（书中第 26 章 · p.382）" },
  { id: "fr-r16-22", ch: 26, cat: "en / dans + 时间", q: "Je vous donnerai ma réponse ___ deux jours.", opts: ["dans", "en", "il y a", "depuis"], a: 0,
    exp: "dans + 时间段指将来，“两天之后”；它的反面是 il y a（……以前）。（书中第 26 章 · p.388）" },
  { id: "fr-r16-23", ch: 26, cat: "en + 状态", q: "Ne lui parle pas maintenant, il est ___ colère.", opts: ["en", "dans la", "à", "de"], a: 0,
    exp: "en 表示身体或心理状态，多用在 être 后：être en colère、en pleine forme、en vacances。（书中第 26 章 · p.383）" },
  { id: "fr-r16-24", ch: 26, cat: "材料", q: "Pour leur anniversaire de mariage, il lui a offert une bague ___ or.", opts: ["en", "à", "d'", "dans"], a: 0,
    exp: "材料可以用 en 或 de：une chemise en soie / de soie。但书中指出 une bague d'or 听起来很别扭，要说 une bague en or。（书中第 26 章 · p.383）" },
  { id: "fr-r16-25", ch: 26, cat: "pour + 时间", q: "Je pars ___ une semaine en Espagne.", opts: ["pour", "depuis", "dans", "il y a"], a: 0,
    exp: "和 partir、aller、venir、être 连用表示预计的时长时用 pour：Je pars pour une semaine。（书中第 26 章 · p.385）" },
  { id: "fr-r16-26", ch: 26, cat: "à / dans + 城市", q: "Je préfère marcher ___ Paris qu'à Londres.", opts: ["à", "dans", "en", "au"], a: 0,
    exp: "à 用来对比在不同地方发生的事；dans 强调在某个空间的范围内：J'aime me promener dans Paris。（书中第 26 章 · p.387）" },
  { id: "fr-r16-27", ch: 26, cat: "à l'école / dans", q: "Paul et Marie vont tous les deux à l'école, mais ___ des écoles différentes.", opts: ["dans", "à", "en", "aux"], a: 0,
    exp: "aller à l'école 是固定说法，但 école 一旦被修饰就用 dans：dans des écoles différentes。（书中第 26 章 · p.387）" },
  { id: "fr-r16-28", ch: 26, cat: "dans = 从……里", q: "Quelqu'un a bu ___ ma tasse !", opts: ["dans", "de", "à", "avec"], a: 0,
    exp: "从容器里拿、喝东西，法语用 dans：boire dans une tasse、prendre une serviette dans le placard。（书中第 26 章 · p.387）" },
  { id: "fr-r16-29", ch: 26, cat: "dans le train", q: "J'ai rencontré Michel ___ le train.", opts: ["dans", "sur", "en", "à"], a: 0,
    exp: "“在火车上”是 dans le train（英语 on the train）。en train 表示乘火车的方式。（书中第 26 章 · p.388）" },
  { id: "fr-r16-30", ch: 26, cat: "年代", q: "Cette chanson était très à la mode ___ les années soixante.", opts: ["dans", "en", "à", "aux"], a: 0,
    exp: "年代用 dans：dans les années soixante；具体年份用 en：en 1960。（书中第 26 章 · p.388）" },
  { id: "fr-r16-31", ch: 26, cat: "par + 频率", q: "Il faut traire les vaches deux fois ___ jour.", opts: ["par", "au", "pour", "à"], a: 0,
    exp: "par 表示“每”：par jour、par mois、par personne。（书中第 26 章 · p.389）" },
  { id: "fr-r16-32", ch: 26, cat: "commencer par", q: "Il a commencé ___ démonter toutes les étagères, puis il a repeint les murs.", opts: ["par", "à", "de", "en"], a: 0,
    exp: "commencer par / finir par + 不定式：先从……开始 / 最后终于……。commencer à 只表示“开始做”，finir de 表示“做完”。（书中第 26 章 · p.389）" },
  { id: "fr-r16-33", ch: 26, cat: "vers / envers", q: "Il s'est mal conduit ___ nous.", opts: ["envers", "vers", "à", "devant"], a: 0,
    exp: "envers 用于感情、态度（对……）；vers 表示方向或大约的时间。（书中第 26 章 · p.390）" },
  { id: "fr-r16-34", ch: 26, cat: "vers + 时间", q: "Je partirai ___ deux heures, je ne sais pas exactement.", opts: ["vers", "envers", "à", "pour"], a: 0,
    exp: "vers + 时间表示“大约”：vers deux heures。（书中第 26 章 · p.390）" },
  { id: "fr-r16-35", ch: 26, cat: "sur / au-dessus de", q: "Les avions ne devraient pas voler ___ habitations la nuit.", opts: ["au-dessus des", "sur les", "sous les", "au-dessous des"], a: 0,
    exp: "sur 是贴在表面上；au-dessus de 是在上方、不接触：voler au-dessus des maisons。（书中第 26 章 · p.391）" },
  { id: "fr-r16-36", ch: 26, cat: "sans + 名词", q: "Il est sorti sans ___ parapluie alors qu'il pleuvait.", opts: ["（不填）", "un", "de", "du"], a: 0,
    exp: "avec、sans + 名词表示方式时，名词前不加冠词：sans parapluie、sans chapeau、avec soin。（书中第 26 章 · p.392）" },
  { id: "fr-r16-37", ch: 26, cat: "à cause de", q: "Je ne suis pas sorti ___ la pluie.", opts: ["à cause de", "parce que", "car", "grâce à"], a: 0,
    exp: "à cause de 后接名词或代词；parce que、car 是连词，后接句子。grâce à 用于好的原因。（书中第 26 章 · p.393）" },

  { id: "fr-r17-1", ch: 26, cat: "判断正误 · chez", q: "（正式法语）下面哪一句正确？", opts: ["Je vais au coiffeur.", "Je vais chez le coiffeur.", "Je vais à le coiffeur.", "Je vais en coiffeur."], a: 1,
    exp: "去某人那里用 chez + 人；au coiffeur 是口语说法，书中标为正式法语不宜。用店名时才用 à：au salon de coiffure。（书中第 26 章 · p.375）" },
  { id: "fr-r17-2", ch: 26, cat: "判断正误 · à / en / dans", q: "下面哪一句有错误？", opts: ["Il est en prison.", "Il est dans une prison modèle.", "Il est à la maison.", "Il est en la maison."], a: 3,
    exp: "en 后面接不带冠词的名词：en prison；名词有冠词或修饰语时用 dans 或 à：dans une prison modèle、à la maison、dans la maison。（书中第 26 章 · p.368）" },
  { id: "fr-r17-3", ch: 26, cat: "判断正误 · 国家名", q: "下面哪一句正确？", opts: ["J'habite en Mexique.", "J'habite au Mexique.", "J'habite à Mexique.", "J'habite dans Mexique."], a: 1,
    exp: "以 e 结尾的国家一般是阴性、用 en，但 le Mexique 是阳性，所以说 au Mexique。（书中第 26 章 · p.382）" },
  { id: "fr-r17-4", ch: 26, cat: "判断正误 · 国家名", q: "下面哪一句有错误？", opts: ["Je viens de Grèce.", "Je viens du Portugal.", "Je viens des Pays-Bas.", "Je viens de le Japon."], a: 3,
    exp: "“从某国来”：阴性国家用 de（de Grèce），阳性用 du（du Japon、du Portugal），复数用 des（des Pays-Bas）。de + le 必须缩合成 du。（书中第 26 章 · p.379）" },
  { id: "fr-r17-5", ch: 26, cat: "判断正误 · sans", q: "下面哪一句有错误？", opts: ["Il est parti sans chapeau.", "Il est resté sans manger.", "Il est parti sans disant rien.", "Il l'a fait sans effort."], a: 2,
    exp: "sans 后面接名词（不加冠词）或不定式：sans rien dire。只有 en 才接现在分词。（书中第 26 章 · p.393）" },
  { id: "fr-r17-6", ch: 26, cat: "中译法 · en / dans", q: "“我两个小时就写完了这篇文章。”", opts: ["Je l'ai écrit en deux heures.", "Je l'ai écrit dans deux heures.", "Je l'ai écrit pour deux heures.", "Je l'ai écrit à deux heures."], a: 0,
    exp: "en + 时间段表示完成一件事所花的时间；dans deux heures 是“两小时以后”，用于将来。（书中第 26 章 · p.388）" },
  { id: "fr-r17-7", ch: 26, cat: "中译法 · 运动动词", q: "“他游过了这条河。”", opts: ["Il traversa la rivière à la nage.", "Il nagea à travers de la rivière.", "Il nagea en travers la rivière.", "Il nagea dessus la rivière."], a: 0,
    exp: "英语用“动词 + 介词”（swim across），法语常用表示位移的动词 traverser，再用 à la nage、en courant 等说明方式。（书中第 26 章 · p.394）" },
  { id: "fr-r17-8", ch: 26, cat: "中译法 · 运动动词", q: "“他跑着出去了。”", opts: ["Il sortit en courant.", "Il courut hors.", "Il sortit courant.", "Il sortit à courir."], a: 0,
    exp: "He ran out → Il sortit en courant：位移用动词 sortir，方式用副动词 en courant。（书中第 26 章 · p.394）" },
  { id: "fr-r17-9", ch: 26, cat: "中译法 · 运动动词", q: "“一只鸟飞进了房间。”", opts: ["Un oiseau entra dans la pièce.", "Un oiseau vola à la pièce.", "Un oiseau entra à la pièce.", "Un oiseau vola en la pièce."], a: 0,
    exp: "运动方式显而易见时法语省略不说：鸟当然是飞进来的，所以不加 en volant。书中特意把 *en volant 标成不自然。（书中第 26 章 · p.395）" },
  { id: "fr-r17-10", ch: 26, cat: "中译法 · across", q: "“塞纳河上有多少座桥？” Combien de ponts y a-t-il ___ la Seine ?", opts: ["sur", "à travers", "en travers de", "dans"], a: 0,
    exp: "英语 across 在法语里没有固定对应：桥“横跨”河上就说 sur la Seine。（书中第 26 章 · p.394）" },
  { id: "fr-r17-11", ch: 26, cat: "中译法 · across", q: "“面包店在广场对面。” La boulangerie se trouve ___ la place.", opts: ["de l'autre côté de", "à travers", "en travers de", "par-dessus"], a: 0,
    exp: "“在……的另一边”用 de l'autre côté de；à travers 是“穿过”，en travers de 是“横躺在……上”。（书中第 26 章 · p.394）" },
  { id: "fr-r17-12", ch: 26, cat: "中译法 · en travers de", q: "“有一棵树横倒在河上。” Il y avait un arbre ___ la rivière.", opts: ["en travers de", "à travers", "à travers de", "au travers"], a: 0,
    exp: "en travers de = 横放、横躺在……上；à travers 是“穿过”，而且后面从不加 de。（书中第 26 章 · p.393）" },
  { id: "fr-r17-13", ch: 26, cat: "中译法 · à travers", q: "“阳光努力穿透云层。” Le soleil essayait de percer ___ les nuages.", opts: ["à travers", "en travers de", "à travers de", "en travers"], a: 0,
    exp: "à travers / au travers de = 穿过。注意 à travers 后面直接接名词，从不加 de。（书中第 26 章 · p.393）" },
  { id: "fr-r17-14", ch: 26, cat: "同义替换 · avec", q: "哪个说法可以替换【】里的词？Relisez ce chapitre 【soigneusement】.", opts: ["avec soin", "avec du soin", "par soin", "en soin"], a: 0,
    exp: "avec / sans + 不带冠词的抽象名词，相当于一个方式副词：avec soin = soigneusement。（书中第 26 章 · p.392）" },
  { id: "fr-r17-15", ch: 26, cat: "同义替换 · sans", q: "哪个说法可以替换【】里的词？Ils l'ont traité 【impitoyablement】.", opts: ["sans pitié", "sans de pitié", "sans la pitié", "avec pitié"], a: 0,
    exp: "sans pitié = impitoyablement；表示方式时 sans 后面的名词不加冠词。（书中第 26 章 · p.392）" },
  { id: "fr-r17-16", ch: 26, cat: "同义替换 · vers", q: "哪个说法可以替换【】里的词？Je partirai 【vers】 deux heures.", opts: ["aux environs de", "envers", "à travers", "au-delà de"], a: 0,
    exp: "vers + 时间表示“大约”，相当于 aux environs de。envers 只用于对人的态度。（书中第 26 章 · p.390）" },
  { id: "fr-r17-17", ch: 26, cat: "同义替换 · chez", q: "哪个词可以替换【】里的词？Ces problèmes se rencontrent 【chez】 les personnes âgées.", opts: ["parmi", "envers", "vers", "contre"], a: 0,
    exp: "chez 除了“在……家”，还可以表示“在某类人当中”，书中说这时 chez = parmi。（书中第 26 章 · p.391）" },
  { id: "fr-r17-18", ch: 26, cat: "辨析用法 · de", q: "哪一句里的 de 表示原因？", opts: ["Il tremble de froid.", "Je viens de Lyon.", "un verre de vin", "la maison de Paul"], a: 0,
    exp: "trembler de froid 中 de 表原因；de Lyon 表来源，un verre de vin 表内容，de Paul 表所属。（书中第 26 章 · p.379）" },
  { id: "fr-r17-19", ch: 26, cat: "辨析用法 · à", q: "哪一句里的 à 表示用途？", opts: ["une tasse à café", "Ce livre est à Paul.", "J'habite à Lyon.", "Je pars à huit heures."], a: 0,
    exp: "à + 不带冠词的名词表示用途：une tasse à café（咖啡杯）。对比 une tasse de café（一杯咖啡）。（书中第 26 章 · p.376）" },
  { id: "fr-r17-20", ch: 26, cat: "辨析用法 · à", q: "哪一句里的 à 表示所属？", opts: ["Ce stylo est à moi.", "une machine à laver", "Il y va à pied.", "À demain !"], a: 0,
    exp: "être à qn 表示所属：Ce stylo est à moi = 这支笔是我的。（书中第 26 章 · p.377）" },
  { id: "fr-r17-21", ch: 26, cat: "辨析用法 · par", q: "哪一句里的 par 表示原因？", opts: ["Il l'a fait par bonté.", "Il est sorti par la fenêtre.", "Je l'appelle deux fois par jour.", "Il a été puni par son père."], a: 0,
    exp: "par bonté = 出于好心，表原因；其他三句分别表示经过的地点、频率和被动语态的施动者。（书中第 26 章 · p.389）" },
  { id: "fr-r17-22", ch: 26, cat: "辨析用法 · en", q: "哪一句里的 en 表示所花的时间？", opts: ["Il l'a réparé en une heure.", "Il est en colère.", "Il vit en France.", "Il est venu en train."], a: 0,
    exp: "en + 时间段表示完成所需的时间；其他三句分别表示状态、地点和交通方式。（书中第 26 章 · p.382）" },
  { id: "fr-r17-23", ch: 26, cat: "辨析用法 · 词性", q: "哪一句里的 passé 是介词？", opts: ["Passé minuit, silence !", "J'ai passé une heure ici.", "Il est dix heures passées.", "Le temps passé ne revient pas."], a: 0,
    exp: "放在名词前、不变化的 passé 是介词，意思是“过了……之后”。其他几句里它是过去分词或形容词，要配合。（书中第 26 章 · p.370）" },
  { id: "fr-r17-24", ch: 26, cat: "辨析用法 · 词性", q: "哪一句里的 devant 是副词？", opts: ["J'ai mis tes sacs devant.", "Il attend devant la porte.", "Il parle devant le comité.", "Tournez juste devant l'église."], a: 0,
    exp: "介词后面没有补语时就变成副词：J'ai mis tes sacs devant（放在前面）。（书中第 26 章 · p.370）" },
  { id: "fr-r17-25", ch: 26, cat: "双空 · de…à", q: "Je serai là ___ 5 heures ___ 6 heures.", opts: ["de … à", "à … à", "depuis … jusque", "entre … à"], a: 0,
    exp: "de 表示一段时间的开始，à 表示结束：de 5 heures à 6 heures。也可以说 entre 5 heures et 6 heures，但不能 entre … à。（书中第 26 章 · p.375）" },
  { id: "fr-r17-26", ch: 26, cat: "双空 · 国家名", q: "J'ai fait le trajet ___ Maroc ___ Portugal.", opts: ["du … au", "de … à", "du … en", "de … au"], a: 0,
    exp: "le Maroc、le Portugal 都是阳性国家：从……用 du，到……用 au。（书中第 26 章 · p.374）" },
  { id: "fr-r17-27", ch: 26, cat: "双空 · en / dans", q: "Je suis ___ Normandie, mais mon frère vit ___ Var.", opts: ["en … dans le", "à la … au", "en … en", "dans la … à"], a: 0,
    exp: "阴性的地区用 en（en Normandie）；阳性的省份、法国省份（département）一般用 dans le（dans le Var）。（书中第 26 章 · p.387）" },
  { id: "fr-r17-28", ch: 26, cat: "双空 · 复合介词", q: "Il y avait des policiers à l'intérieur et ___ extérieur ___ la maison.", opts: ["à l' … de", "de l' … à", "à l' … （不填）", "en … de"], a: 0,
    exp: "两个复合介词共用一个名词时，省略第一个的 de：à l'intérieur et à l'extérieur de la maison。（书中第 26 章 · p.372）" },
  { id: "fr-r17-29", ch: 26, cat: "双空 · commencer / finir", q: "Il a commencé ___ ranger, puis il a fini ___ s'endormir.", opts: ["à … par", "à … de", "de … à", "par … à"], a: 0,
    exp: "commencer à = 开始做；finir par = 最后终于。对比 finir de = 做完，commencer par = 先从……开始。（书中第 26 章 · p.389）" },
  { id: "fr-r17-30", ch: 26, cat: "动词搭配", q: "下面哪个动词后面要加 de？", opts: ["se souvenir (记得)", "se rappeler (记得)", "chercher (寻找)", "regarder (看)"], a: 0,
    exp: "se souvenir de qch，但 se rappeler qch 直接接宾语。英语 look for 有介词，法语 chercher 没有。（书中第 26 章 · p.369）" },
  { id: "fr-r17-31", ch: 26, cat: "动词搭配", q: "下面哪个动词直接接宾语，不加介词？", opts: ["chercher (寻找)", "dépendre (取决于)", "ressembler (像)", "penser (想念)"], a: 0,
    exp: "chercher qch 直接接宾语；dépendre de、ressembler à、penser à 都要介词。（书中第 26 章 · p.369）" },
  { id: "fr-r17-32", ch: 26, cat: "动词搭配", q: "Nous apprenons ___ jouer au badminton.", opts: ["à", "de", "（不填）", "pour"], a: 0,
    exp: "apprendre 直接接名词（apprendre l'anglais），接不定式时要加 à：apprendre à jouer。（书中第 26 章 · p.373）" },
  { id: "fr-r17-33", ch: 26, cat: "动词搭配", q: "Rentre le linge, il risque ___ pleuvoir.", opts: ["de", "à", "（不填）", "pour"], a: 0,
    exp: "risquer de faire qch；对比 risquer qch（risquer sa vie）。（书中第 26 章 · p.378）" },
  { id: "fr-r17-34", ch: 26, cat: "动词搭配", q: "L'art permet aux gens ___ rêver.", opts: ["de", "à", "pour", "（不填）"], a: 0,
    exp: "permettre à qn de faire qch：人前面用 à，不定式前面用 de。英语 enable people to dream 没有介词。（书中第 26 章 · p.369）" },
  { id: "fr-r17-35", ch: 26, cat: "听力 · 介词", q: "听录音，空格里是哪个介词？Je l'ai vu ___ hasard dans un cinéma.", opts: ["par", "au", "en", "de"], a: 0, audio: "Je l'ai vu par hasard dans un cinéma.",
    exp: "par hasard = 偶然。类似的 par 固定搭配还有 par terre、un par un、par-ci, par-là。（书中第 26 章 · p.390）" },
  { id: "fr-r17-36", ch: 26, cat: "听力 · 介词", q: "听录音，空格里是哪个介词？Nous sommes partis ___ plein hiver.", opts: ["en", "au", "dans", "à"], a: 0, audio: "Nous sommes partis en plein hiver.",
    exp: "en plein hiver = 隆冬时节；类似的还有 en plein jour、en pleine mer。（书中第 26 章 · p.382）" },
  { id: "fr-r17-37", ch: 26, cat: "听力 · 介词", q: "听录音，空格里是什么？Je reviens juste ___ le coiffeur.", opts: ["de chez", "du", "chez", "à"], a: 0, audio: "Je reviens juste de chez le coiffeur.",
    exp: "从某人那里回来：de chez + 人，两个介词连用：Je reviens de chez le coiffeur。（书中第 26 章 · p.391）" },
  { id: "fr-r17-38", ch: 26, cat: "听力 · 理解", q: "听录音，这句谚语是什么意思？", opts: ["人为活而吃，不为吃而活", "人要多吃才能长寿", "吃饭前要先工作", "不要为了吃而工作"], a: 0, audio: "Il faut manger pour vivre et non vivre pour manger.",
    exp: "Il faut manger pour vivre et non vivre pour manger。pour + 不定式表示目的（为了）。（书中第 26 章 · p.385）" },
  { id: "fr-r17-39", ch: 26, cat: "听力 · 理解", q: "听录音，sous le règne de 是什么意思？", opts: ["在……统治时期", "在……的王国下面", "在……去世之后", "在……出生之前"], a: 0, audio: "Sous le règne d'Henri IV, la France a beaucoup changé.",
    exp: "sous 除了“在……下面”，还用于固定表达：sous le règne de（在……统治时期）、sous des formes diverses、sous des angles différents。（书中第 26 章 · p.392）" },

  { id: "fr-r18-1", ch: 26, cat: "辨义 · à", q: "« la fille aux cheveux longs » 里的 à 表示什么？", opts: ["特征（带有……的）", "用途（用来……的）", "所属（属于……）", "方向（去……）"], a: 0,
    exp: "à + 带定冠词的名词表示特征，相当于英语 with：la fille aux bas nylon、l'homme à la moto。（书中第 26 章 · p.376）" },
  { id: "fr-r18-2", ch: 26, cat: "辨义 · à", q: "« une machine à laver » 里的 à 表示什么？", opts: ["用途（用来……的）", "特征（带有……的）", "所属（属于……）", "地点（在……）"], a: 0,
    exp: "à + 不带冠词的名词或不定式表示用途：une machine à laver、une brosse à dents、une salle à manger。（书中第 26 章 · p.376）" },
  { id: "fr-r18-3", ch: 26, cat: "辨义 · à", q: "« Ce vélo est à Pierre. » 里的 à 表示什么？", opts: ["所属", "方向", "用途", "时间点"], a: 0,
    exp: "être à qn、appartenir à qn 表示所属：这辆自行车是皮埃尔的。（书中第 26 章 · p.377）" },
  { id: "fr-r18-4", ch: 26, cat: "辨义 · à", q: "« Il est rentré à minuit. » 里的 à 表示什么？", opts: ["时间点", "地点", "方式", "目的"], a: 0,
    exp: "à 用来指具体的时间点：à minuit、à six heures；也可以指时期：au mois de mai、au quinzième siècle。（书中第 26 章 · p.375）" },
  { id: "fr-r18-5", ch: 26, cat: "辨义 · à", q: "« Ce pull est fait à la main. » 里的 à 表示什么？", opts: ["方式", "用途", "所属", "地点"], a: 0,
    exp: "à 可以引出方式状语：fait à la main、à toute vitesse、à voix basse、goutte à goutte。（书中第 26 章 · p.376）" },
  { id: "fr-r18-6", ch: 26, cat: "辨义 · à", q: "哪一句里的 à 表示“带有……特征”？", opts: ["l'homme à la moto", "un moulin à café", "Il est à la maison.", "un pull fait à la main"], a: 0,
    exp: "l'homme à la moto = 骑摩托车的那个男人（特征）；un moulin à café 是用途，à la maison 是地点，à la main 是方式。（书中第 26 章 · p.376）" },
  { id: "fr-r18-7", ch: 26, cat: "辨义 · à", q: "哪个介词既能表示用途（une brosse ___ dents），又能表示所属（être ___ qn）？", opts: ["à", "de", "pour", "en"], a: 0,
    exp: "une brosse à dents（用途）、Ce livre est à Paul（所属），都用 à。（书中第 26 章 · p.377）" },
  { id: "fr-r18-8", ch: 26, cat: "辨义 · de", q: "« Il pleure de joie. » 里的 de 表示什么？", opts: ["原因", "来源", "方式", "所属"], a: 0,
    exp: "de 可以表示原因：pleurer de joie、trembler de froid、rouge de colère。（书中第 26 章 · p.379）" },
  { id: "fr-r18-9", ch: 26, cat: "辨义 · de", q: "« Elle arrive de Rome. » 里的 de 表示什么？", opts: ["来源（从……来）", "原因", "材料", "所属"], a: 0,
    exp: "de 引出地点状语时表示来源或分离，常与表示目的地的 à 搭配：de Lyon à Marseille。（书中第 26 章 · p.379）" },
  { id: "fr-r18-10", ch: 26, cat: "辨义 · de", q: "« une veste de cuir » 里的 de 表示什么？", opts: ["材料", "内容", "来源", "所属"], a: 0,
    exp: "de + 不带冠词的名词可以表示材料：une veste de cuir；也可以用 en：une veste en cuir。（书中第 26 章 · p.380）" },
  { id: "fr-r18-11", ch: 26, cat: "辨义 · de", q: "« une tasse de thé » 是什么意思？", opts: ["一杯茶（内容）", "茶杯（用途）", "茶色的杯子", "茶叶做的杯子"], a: 0,
    exp: "de 表示容器里装的内容：une tasse de thé = 一杯茶；à 表示用途：une tasse à thé = 茶杯。（书中第 26 章 · p.380）" },
  { id: "fr-r18-12", ch: 26, cat: "辨义 · de", q: "« Elle est aimée de tous. » 里的 de 表示什么？", opts: ["被动语态的施动者", "来源", "原因", "所属"], a: 0,
    exp: "de 可以引出被动语态的施动者，多用于表示感情、状态的动词：être aimé de、être respecté de。（书中第 26 章 · p.380）" },
  { id: "fr-r18-13", ch: 26, cat: "辨义 · de", q: "« Il marche d'un pas lent. » 里的 de 表示什么？", opts: ["方式", "原因", "来源", "时间"], a: 0,
    exp: "de 可以表示方式：d'un pas lent、de cette façon、d'une manière différente。（书中第 26 章 · p.380）" },
  { id: "fr-r18-14", ch: 26, cat: "辨义 · de", q: "« la maison de mes parents » 里的 de 表示什么？", opts: ["所属", "来源", "材料", "内容"], a: 0,
    exp: "de + 有限定的名词表示所属、从属：la maison de mes parents。（书中第 26 章 · p.380）" },
  { id: "fr-r18-15", ch: 26, cat: "辨义 · de", q: "« Je le connais de vue. » 是什么意思？", opts: ["我见过他，但不熟", "我从远处认识他", "我因为他而认识", "我刚刚认识他"], a: 0,
    exp: "connaître qn de vue = 只是见过面；connaître qn de nom = 只听说过名字。（书中第 26 章 · p.381）" },
  { id: "fr-r18-16", ch: 26, cat: "辨义 · de", q: "哪一句里的 de 表示时间的起点？", opts: ["Il travaille de 9 h à 17 h.", "Il revient de Paris.", "Il meurt de faim.", "C'est un billet de train."], a: 0,
    exp: "de 表示一段时间的开始，常和表示结束的 à 搭配：de 9 h à 17 h、d'août à septembre。（书中第 26 章 · p.379）" },
  { id: "fr-r18-17", ch: 26, cat: "辨义 · de", q: "哪个介词既能表示原因（trembler ___ froid），又能表示来源（venir ___ Paris）？", opts: ["de", "par", "pour", "à"], a: 0,
    exp: "de 的意思非常多：原因、来源、方式、材料、内容、所属、施动者……书中说 de 和 à 被称为“空介词”，其实是因为意思太多。（书中第 26 章 · p.379）" },
  { id: "fr-r18-18", ch: 26, cat: "辨义 · en", q: "« Il est venu en avion. » 里的 en 表示什么？", opts: ["交通方式", "地点", "状态", "材料"], a: 0,
    exp: "人在交通工具里面时用 en：en avion、en voiture、en train。（书中第 26 章 · p.383）" },
  { id: "fr-r18-19", ch: 26, cat: "辨义 · en", q: "« Elle était en robe du soir. » 里的 en 表示什么？", opts: ["穿着", "材料", "状态", "地点"], a: 0,
    exp: "en 可以表示穿着：en robe du soir、en bras de chemise、en tenue de soirée。（书中第 26 章 · p.383）" },
  { id: "fr-r18-20", ch: 26, cat: "辨义 · en", q: "« Le prince s'est changé en grenouille. » 里的 en 表示什么？", opts: ["变成", "在……里面", "作为", "用……做的"], a: 0,
    exp: "en 常表示变化的结果“变成”：se changer en、couper en tranches。（书中第 26 章 · p.381）" },
  { id: "fr-r18-21", ch: 26, cat: "辨义 · en", q: "« Il est en vacances. » 里的 en 表示什么？", opts: ["状态", "地点", "时间", "方式"], a: 0,
    exp: "en 表示身体或心理状态，多用在 être 后：en vacances、en colère、en bonne santé、en crise。（书中第 26 章 · p.383）" },
  { id: "fr-r18-22", ch: 26, cat: "辨义 · en", q: "« Il est né en 1990. » 里的 en 表示什么？", opts: ["年份", "所用的时间", "地点", "状态"], a: 0,
    exp: "en 用于月份、季节和年份：en mai、en été、en 1990（但 au printemps）。（书中第 26 章 · p.382）" },
  { id: "fr-r18-23", ch: 26, cat: "辨义 · en", q: "« J'ai lu ce livre en trois jours. » 里的 en 表示什么？", opts: ["完成所用的时间", "三天以后", "持续了三天", "第三天"], a: 0,
    exp: "en + 时间段表示完成一件事所用的时间（三天就读完了）；dans trois jours 才是“三天以后”。（书中第 26 章 · p.382）" },
  { id: "fr-r18-24", ch: 26, cat: "辨义 · en", q: "« Il chante en se rasant. » 里的 en 表示什么？", opts: ["同时（一边……一边）", "目的", "地点", "材料"], a: 0,
    exp: "en + 现在分词构成副动词，可以表示同时发生的动作：一边刮胡子一边唱歌。（书中第 26 章 · p.384）" },
  { id: "fr-r18-25", ch: 26, cat: "辨义 · en", q: "« En travaillant plus, vous réussiriez. » 里的 en + 现在分词相当于？", opts: ["条件（如果……）", "时间点", "让步（虽然……）", "目的"], a: 0,
    exp: "副动词也可以相当于 si 引导的假设从句：= Si vous travailliez plus, vous réussiriez。（书中第 26 章 · p.384）" },
  { id: "fr-r18-26", ch: 26, cat: "辨义 · en", q: "哪个介词既能表示交通方式（___ voiture），又能表示状态（___ colère）？", opts: ["en", "à", "dans", "par"], a: 0,
    exp: "en voiture（交通方式）、en colère（状态），en 还能表示季节年份、材料、穿着、变成等。（书中第 26 章 · p.383）" },
  { id: "fr-r18-27", ch: 26, cat: "辨义 · dans", q: "« Prends une serviette dans le placard. » 里的 dans 表示什么？", opts: ["从……里面（取出）", "在……里面", "到……里去", "在……期间"], a: 0,
    exp: "dans 也可以表示“从……里”：prendre une serviette dans le placard、boire dans une tasse、découper un article dans un magazine。（书中第 26 章 · p.387）" },
  { id: "fr-r18-28", ch: 26, cat: "辨义 · dans", q: "« Je reviens dans dix minutes. » 里的 dans 表示什么？", opts: ["从现在起……以后", "花了……时间", "在……期间", "……以前"], a: 0,
    exp: "dans + 时间段指将来，“十分钟以后”；它的反面是 il y a（……以前）。（书中第 26 章 · p.388）" },
  { id: "fr-r18-29", ch: 26, cat: "辨义 · dans", q: "« Vous trouverez cette idée dans Molière. » 里的 dans 表示什么？", opts: ["在……的作品里", "在……家里", "在……身边", "在……的时代"], a: 0,
    exp: "dans + 作家名表示“在他的作品里”；chez + 作家名也可以：On retrouve cette tendance chez Proust。（书中第 26 章 · p.387）" },
  { id: "fr-r18-30", ch: 26, cat: "辨义 · dans", q: "哪一句里的 dans 表示“从……里”？", opts: ["Il a bu dans mon verre.", "Il est dans sa chambre.", "Je pars dans deux jours.", "Ils sont dans le besoin."], a: 0,
    exp: "boire dans un verre = 用（从）杯子喝；其他几句分别表示在里面、将来的时间和抽象的处境。（书中第 26 章 · p.387）" },
  { id: "fr-r18-31", ch: 26, cat: "辨义 · dans", q: "« Ils sont dans le besoin. » 里的 dans 是什么用法？", opts: ["比喻（抽象的处境）", "具体的地点", "将来的时间", "来源"], a: 0,
    exp: "dans 有比喻用法：être dans le besoin（处于困境）、dans un sens figuré、Dans le doute, abstiens-toi。（书中第 26 章 · p.387）" },
  { id: "fr-r18-32", ch: 26, cat: "辨义 · par", q: "« Il est entré par la fenêtre. » 里的 par 表示什么？", opts: ["经过的路径", "原因", "施动者", "频率"], a: 0,
    exp: "par 表示经过某处：entrer par la fenêtre、sortir par la porte de la cuisine。（书中第 26 章 · p.389）" },
  { id: "fr-r18-33", ch: 26, cat: "辨义 · par", q: "« Il l'a fait par jalousie. » 里的 par 表示什么？", opts: ["原因（出于……）", "经过的路径", "方式", "频率"], a: 0,
    exp: "par 可以表示原因：par jalousie、par bonté、par insouciance。（书中第 26 章 · p.389）" },
  { id: "fr-r18-34", ch: 26, cat: "辨义 · par", q: "« La lettre a été écrite par Marie. » 里的 par 表示什么？", opts: ["被动语态的施动者", "原因", "经过的路径", "工具"], a: 0,
    exp: "par 引出被动语态的施动者：écrite par Marie、submergés par la publicité。（书中第 26 章 · p.389）" },
  { id: "fr-r18-35", ch: 26, cat: "辨义 · par", q: "« C'est par un ami qu'il a trouvé ce travail. » 里的 par 表示什么？", opts: ["通过（某人的途径）", "原因", "施动者", "频率"], a: 0,
    exp: "par 的比喻用法表示“通过某种途径”：C'est par les Durand qu'elle a obtenu son travail。（书中第 26 章 · p.389）" },
  { id: "fr-r18-36", ch: 26, cat: "辨义 · par", q: "par 一般不表示下面哪种意思？", opts: ["材料（用……做的）", "原因（出于……）", "频率（每……）", "被动语态的施动者"], a: 0,
    exp: "材料用 en 或 de（une table en chêne、une veste de cuir），不用 par。（书中第 26 章 · p.389）" },
  { id: "fr-r18-37", ch: 26, cat: "辨义 · par", q: "哪个介词既能引出被动语态的施动者，又能表示频率（deux fois ___ jour）？", opts: ["par", "de", "pour", "à"], a: 0,
    exp: "par 可以引出施动者，也可以表示“每”：par jour、par mois、par personne。（书中第 26 章 · p.389）" },
  { id: "fr-r18-38", ch: 26, cat: "辨义 · pour", q: "« Il a été arrêté pour avoir brûlé un feu rouge. » 里的 pour 表示什么？", opts: ["原因", "目的", "去向", "时长"], a: 0,
    exp: "pour + 不定式过去时可以表示原因：因为闯红灯被拦下。同理 promu pour avoir travaillé si dur。（书中第 26 章 · p.385）" },
  { id: "fr-r18-39", ch: 26, cat: "辨义 · pour", q: "« Le train pour Marseille part à 6 h. » 里的 pour 表示什么？", opts: ["去向（开往……）", "目的", "原因", "时长"], a: 0,
    exp: "pour 表示目的地，书中说这是在用 à 会有歧义时的说法：le train pour Marseille。（书中第 26 章 · p.385）" },
  { id: "fr-r18-40", ch: 26, cat: "辨义 · pour", q: "« Il est parti à 6 h pour revenir deux minutes plus tard. » 里的 pour 表示什么？", opts: ["出乎意料的后续", "目的", "原因", "去向"], a: 0,
    exp: "pour + 不定式可以连接两个先后发生的动作，第二个往往出乎意料：他六点走了，结果两分钟后又回来了。（书中第 26 章 · p.386）" },
  { id: "fr-r18-41", ch: 26, cat: "辨义 · pour", q: "« Il n'y avait personne pour lui dire la vérité. » 里的 pour + 不定式相当于？", opts: ["关系从句（能……的人）", "原因从句", "让步从句", "时间从句"], a: 0,
    exp: "pour + 不定式可以相当于关系从句：personne pour lui dire = personne qui pouvait lui dire。（书中第 26 章 · p.386）" },
  { id: "fr-r18-42", ch: 26, cat: "辨义 · pour", q: "哪一句里的 pour 表示目的？", opts: ["Il travaille pour vivre.", "Je pars pour un mois.", "C'est le train pour Lyon.", "Il est puni pour avoir menti."], a: 0,
    exp: "pour vivre = 为了生活（目的）；其他几句分别表示预计时长、去向和原因。（书中第 26 章 · p.385）" },
  { id: "fr-r18-43", ch: 26, cat: "辨义 · sur", q: "« Ils se sont renseignés sur nos projets. » 里的 sur 表示什么？", opts: ["关于", "在……上面", "朝向", "大约"], a: 0,
    exp: "sur 除了“在……表面上”，还可以表示 au sujet de（关于）：s'informer sur notre état de santé。（书中第 26 章 · p.391）" },
  { id: "fr-r18-44", ch: 26, cat: "辨义 · sur", q: "« une pièce de trois mètres sur cinq » 里的 sur 表示什么？", opts: ["乘（长 × 宽）", "在……上面", "关于", "在……之中"], a: 0,
    exp: "量尺寸时 sur 相当于英语的 by：trois mètres sur cinq = 3 米 × 5 米。（书中第 26 章 · p.369）" },
  { id: "fr-r18-45", ch: 26, cat: "辨义 · sous", q: "« Cela existe sous des formes diverses. » 里的 sous 表示什么？", opts: ["以……形式", "在……下面", "低于", "在……之前"], a: 0,
    exp: "sous 的固定用法：sous des formes diverses、sous des angles différents、sous le règne de。（书中第 26 章 · p.392）" },
  { id: "fr-r18-46", ch: 26, cat: "辨义 · chez", q: "« On retrouve cette idée chez Proust. » 里的 chez 表示什么？", opts: ["在……的作品中", "在……家里", "在……的店里", "在……的国家"], a: 0,
    exp: "chez + 作家表示在其作品中；chez 还可以表示“在……家/店”“在……国家”“在……这类人当中”。（书中第 26 章 · p.391）" },
  { id: "fr-r18-47", ch: 26, cat: "辨义 · chez", q: "« Ce problème est fréquent chez les jeunes. » 里的 chez 表示什么？", opts: ["在……这类人当中", "在……家里", "在……的作品中", "朝向……"], a: 0,
    exp: "chez 可以表示“在某类人当中”，书中说这时 chez = parmi。（书中第 26 章 · p.391）" },
  { id: "fr-r18-48", ch: 26, cat: "辨义 · vers", q: "« Je passerai vers midi. » 里的 vers 表示什么？", opts: ["大约（时间）", "方向", "对……的态度", "经过"], a: 0,
    exp: "vers + 时间表示大约；vers + 地点表示方向；对人的态度用 envers。（书中第 26 章 · p.390）" },
  { id: "fr-r18-49", ch: 26, cat: "辨义 · avec", q: "« Il a répondu avec calme. » 里的 avec 表示什么？", opts: ["方式（相当于副词）", "伴随（和某人一起）", "工具", "原因"], a: 0,
    exp: "avec + 不带冠词的抽象名词相当于方式副词：avec calme = calmement，avec soin = soigneusement。（书中第 26 章 · p.392）" },

  { id: "fr-r19-1", ch: 26, cat: "辨义 · à", q: "« À mon avis, il a tort. » 里的 à 表示什么？", opts: ["依……看来（观点）", "方向", "时间点", "所属"], a: 0,
    exp: "à 构成许多固定表达：à mon avis（依我看）、à votre place（换作是你）、à leur façon（按他们的方式）。（书中第 26 章 · p.377）" },
  { id: "fr-r19-2", ch: 26, cat: "辨义 · à", q: "« Il a accepté à regret. » 里的 à 表示什么？", opts: ["方式（带着……情绪）", "原因", "时间", "目的"], a: 0,
    exp: "à regret（勉强地）、à la hâte（匆忙地）、à grands pas（大步地）都是 à 引出的方式状语。（书中第 26 章 · p.376）" },
  { id: "fr-r19-3", ch: 26, cat: "辨义 · à", q: "哪一句里的 à 表示一个时期，而不是时间点？", opts: ["au quinzième siècle", "à six heures", "à midi", "à minuit pile"], a: 0,
    exp: "à 既可以指时间点（à six heures），也可以指时期（au quinzième siècle、à l'époque romantique）。（书中第 26 章 · p.375）" },
  { id: "fr-r19-4", ch: 26, cat: "辨义 · à / en", q: "« en ce moment » 是什么意思？", opts: ["现在、目前", "在那一刻", "一会儿见", "及时"], a: 0,
    exp: "à 表示瞬间，en 表示持续：à ce moment(-là) = 在那一刻；en ce moment = 现在、这段时间。（书中第 26 章 · p.376）" },
  { id: "fr-r19-5", ch: 26, cat: "辨义 · à", q: "« Il est arrivé à temps. » 是什么意思？", opts: ["他及时赶到了", "他准点到了", "他提前很久到了", "他同时到了"], a: 0,
    exp: "arriver à temps = 及时（赶得上）；arriver à l'heure = 准时、准点。（书中第 26 章 · p.375）" },
  { id: "fr-r19-6", ch: 26, cat: "辨义 · de", q: "« Ce soir, l'infirmière est de garde. » 里的 de garde 是什么意思？", opts: ["值班", "在警卫室", "被看守", "在门口"], a: 0,
    exp: "être de garde = 值班（士兵、护士）。de 构成的固定表达还有 être d'avis que、connaître de vue。（书中第 26 章 · p.381）" },
  { id: "fr-r19-7", ch: 26, cat: "辨义 · de", q: "« un portrait de Picasso » 可以表示什么？", opts: ["毕加索画的或画毕加索的", "只能是毕加索画的", "只能是画毕加索的", "毕加索收藏的照片"], a: 0,
    exp: "de 意思太多会有歧义：可能是毕加索画的，也可能是画毕加索的，要靠上下文判断。（书中第 26 章 · p.369）" },
  { id: "fr-r19-8", ch: 26, cat: "辨义 · par", q: "« un portrait de M. Dupont par Picasso » 里的 par 表示什么？", opts: ["作者（谁画的）", "经过", "原因", "频率"], a: 0,
    exp: "名词带两个补语时，第二个介词换成意思更明确的 par：画的是杜邦先生，画家是毕加索。（书中第 26 章 · p.369）" },
  { id: "fr-r19-9", ch: 26, cat: "辨义 · en", q: "« C'est une occasion en or. » 是什么意思？", opts: ["这是个难得的好机会", "这是金子做的", "这是买金子的机会", "金价正在上涨"], a: 0,
    exp: "en 表示材料，也有比喻用法：une occasion en or = 黄金般的机会。（书中第 26 章 · p.383）" },
  { id: "fr-r19-10", ch: 26, cat: "辨义 · en", q: "« peindre les murs en blanc » 里的 en 表示什么？", opts: ["颜色", "材料", "地点", "时间"], a: 0,
    exp: "en 除了表示材料，有时也表示颜色或形状：peindre en blanc、un escalier en colimaçon（螺旋楼梯）。（书中第 26 章 · p.383）" },
  { id: "fr-r19-11", ch: 26, cat: "辨义 · en", q: "« en pleine mer » 是什么意思？", opts: ["在远海上", "在海水满潮时", "在海边", "在海底"], a: 0,
    exp: "en plein(e) + 名词表示“正当中”：en pleine mer、en plein hiver、en plein jour、en pleine poitrine。（书中第 26 章 · p.382）" },
  { id: "fr-r19-12", ch: 26, cat: "辨义 · dans", q: "« dans le Paris d'aujourd'hui » 为什么用 dans 而不是 à？", opts: ["城市名有修饰语", "巴黎是阳性", "表示从巴黎出来", "表示将来"], a: 0,
    exp: "城市名前一般用 à：à Paris；但城市名有修饰语时用 dans：dans le Paris d'aujourd'hui。（书中第 26 章 · p.387）" },
  { id: "fr-r19-13", ch: 26, cat: "辨义 · dans", q: "« Je l'ai fait dans le but de vous aider. » 里的 dans le but de 表示什么？", opts: ["目的", "原因", "时间", "地点"], a: 0,
    exp: "dans le but de = 为了、目的是；类似的还有 dans l'idée de。（书中第 26 章 · p.388）" },
  { id: "fr-r19-14", ch: 26, cat: "辨义 · dans", q: "« Nous restons dans les limites de la légalité. » 里的 dans 表示什么？", opts: ["在……范围之内", "从……里取出", "……以后", "进入……"], a: 0,
    exp: "dans 可以表示在某个范围、界限之内：dans les limites de、dans le besoin、dans un sens figuré。（书中第 26 章 · p.388）" },
  { id: "fr-r19-15", ch: 26, cat: "辨义 · par", q: "« Entrez un par un. » 里的 un par un 是什么意思？", opts: ["一个接一个", "每人一个", "一对一", "一个人负责"], a: 0,
    exp: "par 构成的固定表达：un par un、par terre、par hasard、par-ci, par-là。（书中第 26 章 · p.390）" },
  { id: "fr-r19-16", ch: 26, cat: "辨义 · par", q: "« Il a fini par accepter. » 里的 finir par 表示什么？", opts: ["最后终于", "因为", "通过", "每次"], a: 0,
    exp: "finir par / commencer par + 不定式：最后终于 / 先从……开始。finir de = 做完。（书中第 26 章 · p.389）" },
  { id: "fr-r19-17", ch: 26, cat: "辨义 · par", q: "« voyager par le train » 里的 par 表示什么？", opts: ["交通方式", "经过的地点", "原因", "施动者"], a: 0,
    exp: "par 可以表示交通方式：voyager par le train、envoyer par avion。也可以说 en train。（书中第 26 章 · p.389）" },
  { id: "fr-r19-18", ch: 26, cat: "辨义 · pour", q: "« Il passe pour intelligent. » 是什么意思？", opts: ["别人认为他聪明", "他为了显得聪明", "他因为聪明而通过", "他路过聪明人"], a: 0,
    exp: "passer pour = 被认为是、被当作；pour 引出主语的表语。（书中第 26 章 · p.366）" },
  { id: "fr-r19-19", ch: 26, cat: "辨义 · pour", q: "« On a pris Eric pour ton frère. » 是什么意思？", opts: ["别人把埃里克当成了你哥哥", "为了你哥哥带走了埃里克", "埃里克代替了你哥哥", "别人去接了埃里克"], a: 0,
    exp: "prendre qn pour = 把某人误当作；pour 引出宾语的表语。（书中第 26 章 · p.366）" },
  { id: "fr-r19-20", ch: 26, cat: "辨义 · sur", q: "« Je laisserai la clé sur la porte. » 是什么意思？", opts: ["钥匙会插在门锁上", "钥匙会放在门顶上", "关于门的钥匙", "钥匙会在门对面"], a: 0,
    exp: "sur 的习惯用法：laisser la clé sur la porte（把钥匙留在门锁上），lire quelque chose sur leur visage。（书中第 26 章 · p.391）" },
  { id: "fr-r19-21", ch: 26, cat: "辨义 · sous", q: "« Il fait trois degrés au-dessous de zéro. » 里的 au-dessous de 表示什么？", opts: ["低于", "在……正下方的地面上", "在……之后", "在……里面"], a: 0,
    exp: "sous = 在……下面（被遮住）；au-dessous de = 低于、在……以下：au-dessous de zéro。（书中第 26 章 · p.392）" },
  { id: "fr-r19-22", ch: 26, cat: "辨义 · devant", q: "« Tournez à gauche juste devant l'église. » 里的 devant 指什么？", opts: ["在教堂正对面", "到教堂之前", "过了教堂以后", "在教堂里面"], a: 0,
    exp: "书中对比：juste avant l'église = 还没到教堂时；juste devant l'église = 在教堂正对面。（书中第 26 章 · p.390）" },
  { id: "fr-r19-23", ch: 26, cat: "辨义 · devant", q: "« Il va présenter son projet devant le comité. » 里的 devant 表示什么？", opts: ["在……面前", "在……之前（时间）", "朝……方向", "代替……"], a: 0,
    exp: "一般来说 avant 用于时间，devant 用于地点：devant le comité = 在委员会面前。（书中第 26 章 · p.390）" },
  { id: "fr-r19-24", ch: 26, cat: "辨义 · avec", q: "« Il n'y a plus de sucre ? Il va falloir faire avec. » 是什么意思？", opts: ["只好将就着用", "要和别人一起做", "要用工具来做", "要加快速度"], a: 0,
    exp: "口语中 avec、sans 可以不带补语：faire avec = 将就现有的东西。（书中第 26 章 · p.393）" },
  { id: "fr-r19-25", ch: 26, cat: "辨义 · sans", q: "« Son manteau ? Il est parti sans. » 里的 sans 后面省略了什么？", opts: ["他的大衣", "告别", "钱", "钥匙"], a: 0,
    exp: "口语中 sans 可以不带补语，补语就是上文提到的东西：Il est parti sans (son manteau)。（书中第 26 章 · p.393）" },
  { id: "fr-r19-26", ch: 26, cat: "辨义 · chez", q: "« les ouvriers de chez Renault » 里的 chez 表示什么？", opts: ["在……公司", "在……家里", "在……的作品中", "在……的国家"], a: 0,
    exp: "chez 由“在……家/店”引申为“在……公司”：les ouvriers de chez Renault。（书中第 26 章 · p.375）" },
  { id: "fr-r19-27", ch: 26, cat: "辨义 · 词性", q: "« Il fallait y penser avant. » 里的 avant 是什么词？", opts: ["副词（以前）", "介词", "连词", "形容词"], a: 0,
    exp: "avant、après、devant、depuis 等后面没有补语时就成了副词：Il fallait y penser avant。（书中第 26 章 · p.370）" },
  { id: "fr-r19-28", ch: 26, cat: "辨义 · 词性", q: "哪一句里的 suivant 是介词（“根据”）？", opts: ["Suivant les cas, on décide.", "la semaine suivante", "le jour suivant", "suivant le chemin, il marche"], a: 0,
    exp: "suivant + 名词表示“根据、按照”时是介词；la semaine suivante 是形容词；suivant le chemin 是现在分词（沿着路走）。（书中第 26 章 · p.371）" },

  { id: "fr-r20-1", ch: 37, cat: "基数词写法", q: "71 用法语怎么写？", opts: ["soixante et onze", "soixante-onze", "septante-et-un", "soixante-et-onze"], a: 0,
    exp: "21、31、41、51、61、71 用 et 连接、不加连字符：vingt et un、soixante et onze。（比利时、瑞士说 septante et un。）（书中第 37 章 · p.604）" },
  { id: "fr-r20-2", ch: 37, cat: "基数词写法", q: "81 用法语怎么写？", opts: ["quatre-vingt-un", "quatre-vingt-et-un", "quatre-vingts-un", "quatre-vingts et un"], a: 0,
    exp: "81、91 不用 et：quatre-vingt-un、quatre-vingt-onze。vingt 后面还有数字，所以不加 s。（书中第 37 章 · p.604）" },
  { id: "fr-r20-3", ch: 37, cat: "vingt 的复数", q: "80 用法语怎么写？", opts: ["quatre-vingts", "quatre-vingt", "quatre vingts", "quatre-vingt-zéro"], a: 0,
    exp: "vingt 和 cent 被乘、后面又没有别的数字时加 s：quatre-vingts、deux cents；后面有数字就不加：quatre-vingt-huit。（书中第 37 章 · p.605）" },
  { id: "fr-r20-4", ch: 37, cat: "cent 的复数", q: "“200 欧元”怎么写？", opts: ["deux cents euros", "deux cent euros", "deux centes euros", "deux-cents euros"], a: 0,
    exp: "deux cents 后面没有别的数字，cent 加 s；数词不随名词变阴性。（书中第 37 章 · p.605）" },
  { id: "fr-r20-5", ch: 37, cat: "cent 的复数", q: "216 怎么写？", opts: ["deux cent seize", "deux cents seize", "deux cents et seize", "deux centes seize"], a: 0,
    exp: "cent 后面还有数字时不加 s：deux cent seize。（书中第 37 章 · p.605）" },
  { id: "fr-r20-6", ch: 37, cat: "cent 的复数", q: "Ouvrez votre livre à la page ___ (200).", opts: ["deux cent", "deux cents", "deux centième", "deux centièmes"], a: 0,
    exp: "vingt、cent 表示页码、章节、门牌号、年份时是序数意义，放在名词后，不加 s：à la page deux cent。（书中第 37 章 · p.606）" },
  { id: "fr-r20-7", ch: 37, cat: "million", q: "“三百万居民”怎么说？", opts: ["trois millions d'habitants", "trois million habitants", "trois millions habitants", "trois million d'habitants"], a: 0,
    exp: "million、milliard 是阳性名词：复数加 s，后面接名词时要加 de：trente millions d'habitants。（书中第 37 章 · p.607）" },
  { id: "fr-r20-8", ch: 37, cat: "mille", q: "“一万人”怎么说？", opts: ["dix mille personnes", "dix milles personnes", "dix mil personnes", "dix milliers personnes"], a: 0,
    exp: "mille 永远不变：dix mille。un millier de / des milliers de 是名词，表示“约一千 / 成千上万”。（书中第 37 章 · p.606）" },
  { id: "fr-r20-9", ch: 37, cat: "mille et un", q: "“我有一大堆事情要做。” J'ai ___ choses à faire.", opts: ["mille et une", "mille une", "mille-un", "un millier"], a: 0,
    exp: "表示“无数”的 a thousand and one 说 mille et un(e)，不说 mille un：Les Mille et Une Nuits。（书中第 37 章 · p.607）" },
  { id: "fr-r20-10", ch: 37, cat: "cent / mille", q: "1 120 用法语怎么说？", opts: ["mille cent vingt", "un mille cent vingt", "mille et cent vingt", "un mille un cent vingt"], a: 0,
    exp: "cent 和 mille 前面不加 un：cent onze、mille cent vingt。（书中第 37 章 · p.606）" },
  { id: "fr-r20-11", ch: 37, cat: "小数", q: "5,06 怎么读？", opts: ["cinq virgule zéro six", "cinq point zéro six", "cinq virgule six", "cinq et six"], a: 0,
    exp: "法语用逗号表示小数点，读作 virgule：5,06 = cinq virgule zéro six。（书中第 37 章 · p.607）" },
  { id: "fr-r20-12", ch: 37, cat: "千位分隔", q: "法语书写的“12.860”表示多少？", opts: ["一万两千八百六十", "十二点八六", "一千二百八十六", "十二万八千六百"], a: 0,
    exp: "法语用点（或空格）分隔千位，用逗号作小数点，和英语正好相反。（书中第 37 章 · p.607）" },
  { id: "fr-r20-13", ch: 37, cat: "词序", q: "“前三章”怎么说？", opts: ["les trois premiers chapitres", "les premiers trois chapitres", "les trois premières chapitres", "les premier trois chapitres"], a: 0,
    exp: "premier、dernier、prochain、autre 放在基数词后面：les trois premiers chapitres、les cinq dernières minutes。（书中第 37 章 · p.608）" },
  { id: "fr-r20-14", ch: 37, cat: "君主的序号", q: "Louis XIV 怎么读？", opts: ["Louis Quatorze", "Louis le Quatorzième", "Louis Quatorzième", "Louis le Quatorze"], a: 0,
    exp: "君主和教皇的序号用基数词、不加冠词：Louis Quatorze、Elizabeth Deux。（书中第 37 章 · p.609）" },
  { id: "fr-r20-15", ch: 37, cat: "君主的序号", q: "François Ier 怎么读？", opts: ["François Premier", "François Un", "François le Premier", "François Unième"], a: 0,
    exp: "只有“一世”用序数词 premier，同样不加冠词：François Premier。（书中第 37 章 · p.609）" },
  { id: "fr-r20-16", ch: 37, cat: "序数词", q: "“第二十一”怎么说？", opts: ["vingt et unième", "vingt et premier", "vingt-premier", "vingt-et-unième"], a: 0,
    exp: "premier 只用于“第一”；复合数里用 unième：vingt et unième、cent unième。（书中第 37 章 · p.611）" },
  { id: "fr-r20-17", ch: 37, cat: "序数词", q: "“第五”怎么拼？", opts: ["cinquième", "cinqième", "quintième", "cinquème"], a: 0,
    exp: "cinq → cinquième，别忘了 u。（书中第 37 章 · p.611）" },
  { id: "fr-r20-18", ch: 37, cat: "序数词", q: "“第九”怎么拼？", opts: ["neuvième", "neufième", "nonième", "neufème"], a: 0,
    exp: "neuf → neuvième，f 变成 v。（书中第 37 章 · p.611）" },
  { id: "fr-r20-19", ch: 37, cat: "序数词", q: "C'est ___ fois qu'il vient.（第十一次）", opts: ["la onzième", "l'onzième", "la onzeième", "l'onze"], a: 0,
    exp: "onze、onzième、huit、huitième 前面不省音：la onzième、le huitième。（书中第 37 章 · p.611）" },
  { id: "fr-r20-20", ch: 37, cat: "约数 -aine", q: "“大约二十个人来了。” ___ personnes sont venues.", opts: ["Une vingtaine de", "Une vingtaine", "Vingtaine de", "Un vingtaine de"], a: 0,
    exp: "-aine 构成阴性名词，后面接 de + 名词：une vingtaine de personnes、une dizaine de jours。（书中第 37 章 · p.612）" },
  { id: "fr-r20-21", ch: 37, cat: "约数 -aine", q: "“她五十岁左右。” Elle a ___.", opts: ["la cinquantaine", "le cinquantaine", "cinquantaine", "une cinquante"], a: 0,
    exp: "表示大约的年龄：avoir la cinquantaine、approcher de la soixantaine、une femme d'une quarantaine d'années。（书中第 37 章 · p.612）" },
  { id: "fr-r20-22", ch: 37, cat: "约数 -aine", q: "下面哪种说法是错的？", opts: ["environ soixante-dix ans", "vers les quatre-vingt-dix ans", "une soixante-dizaine d'années", "une quarantaine d'années"], a: 2,
    exp: "soixante-dix、quatre-vingts、quatre-vingt-dix 不能加 -aine，要用 environ、vers les 表示大约。（书中第 37 章 · p.612）" },
  { id: "fr-r20-23", ch: 37, cat: "demi / moitié", q: "J'y suis resté une ___.（半小时）", opts: ["demi-heure", "demie-heure", "demi heure", "moitié heure"], a: 0,
    exp: "demi 放在名词前用连字符连接，不变化：une demi-heure、une demi-douzaine。（书中第 37 章 · p.614）" },
  { id: "fr-r20-24", ch: 37, cat: "demi / moitié", q: "Il a passé ___ de sa vie à voyager.", opts: ["la moitié", "la demie", "le demi", "une demie"], a: 0,
    exp: "“……的一半”不是标准计量单位时要用名词 moitié：la moitié de sa vie、la moitié de la population。（书中第 37 章 · p.615）" },
  { id: "fr-r20-25", ch: 37, cat: "分数 + de", q: "J'y suis resté trois quarts ___ heure.", opts: ["d'", "de l'", "（不填）", "à l'"], a: 0,
    exp: "除了 demi，分数后面接名词都要加 de：trois quarts d'heure、un tiers de la classe。（书中第 37 章 · p.614）" },
  { id: "fr-r20-26", ch: 37, cat: "时间", q: "Il est midi et ___.", opts: ["demi", "demie", "demis", "moitié"], a: 0,
    exp: "midi、minuit 是阳性，所以 midi et demi；heure 是阴性，所以 deux heures et demie。（书中第 37 章 · p.626）" },
  { id: "fr-r20-27", ch: 37, cat: "时间", q: "Il est huit heures et ___.", opts: ["demie", "demi", "moitié", "demies"], a: 0,
    exp: "heure 是阴性单数，et demie 与它配合。表示时间只能用 demi，不能用 moitié。（书中第 37 章 · p.624）" },
  { id: "fr-r20-28", ch: 37, cat: "比例 sur", q: "“十个学生里只有两个填了问卷。” Seulement deux étudiants ___ dix…", opts: ["sur", "de", "par", "en"], a: 0,
    exp: "sur 表示“……中的……”：deux sur dix、vingt-quatre heures sur vingt-quatre。（书中第 37 章 · p.616）" },
  { id: "fr-r20-29", ch: 37, cat: "门牌号", q: "“他住在 36 号之一（36a）。” Il habite au 36 ___ rue François-Premier.", opts: ["bis", "ter", "demi", "second"], a: 0,
    exp: "门牌号加 bis、ter 表示同号的第二、第三户：36 bis = 36a。（书中第 37 章 · p.617）" },
  { id: "fr-r20-30", ch: 37, cat: "尺寸", q: "un mur de cinquante centimètres d'___", opts: ["épaisseur", "épais", "épaisse", "épaissi"], a: 0,
    exp: "long、haut、large 可以说 de long、de haut、de large；épais 和 profond 只能用名词：d'épaisseur、de profondeur。（书中第 37 章 · p.617）" },
  { id: "fr-r20-31", ch: 37, cat: "日期", q: "11 月 11 日怎么说？", opts: ["le onze novembre", "l'onze novembre", "le onzième novembre", "l'onzième novembre"], a: 0,
